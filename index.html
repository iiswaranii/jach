var LESSONS = {"en": {"anger1": "Anger is fast; [[wisdom is a pause]]. Let self-control be your workshop and patience your goldsmith. Before you reply, breathe, wait, and let the heat cool. Then speak in a way you will not regret tomorrow.", "ego1": "[[No success is yours alone.]] Teachers, family, timing and countless unseen hands helped you get here. Remembering the bigger order keeps the I, I quiet, and lets you celebrate with gratitude instead of pride.", "comp1": "[[No one is high and no one is low.]] Comparison steals joy and hides people from us. Measure yourself against who you were yesterday, and give everyone, from the boss to the cleaner, the same respect.", "accept1": "[[Do your part fully, then let go of the rest.]] Much of life is outside your hands. Walking with hukam means effort without anxiety: act well where you can, and accept calmly where you cannot.", "content1": "[[Enough is a feeling, not a number.]] Contentment means honest effort and simple gratitude for what you already have. Chasing more never ends. Noticing enough lets peace begin today.", "listen1": "[[Listening heals more than advice.]] When someone speaks, give them your full attention instead of planning your reply. Truly listening, to people and to the Guru's word, washes away pain and misunderstanding.", "habit1": "[[Small things done daily become who you are.]] Like Amar Das carrying water every dawn, a few calm minutes each morning shape the mind more than rare big efforts ever can.", "action1": "[[You reap what you sow.]] Your words and actions are seeds. Plant honesty, kindness and effort today, and the harvest will be yours. No one else can plant your field for you.", "hard1": "[[Hard days are part of life, not the end of it.]] Pain comes to everyone. Accept the day, reach out to someone who cares, do one small kind thing, and trust that heavy seasons pass.", "kind1": "[[Without fear, without enmity.]] Seeing the same light in everyone means helping without asking whose side they are on, just as Bhai Kanhaiya gave water to every wounded soldier.", "mind1": "[[Win your own mind, and you win the world.]] A restless mind runs to worries and screens. Gently bring it back to the present, again and again. That quiet practice is the real victory.", "nature1": "[[Air is our teacher, water our father, earth our mother.]] Treat nature like family: waste less, pollute nothing, and pause each day to notice the sky, trees and water that keep us alive.", "purpose1": "[[Truth is built one honest choice at a time.]] The wall of small lies grows brick by brick, and it falls the same way. Choose honesty in little things, and your whole life becomes truthful.", "guilt1": "[[Mistakes can be washed clean.]] Guilt is a signal, not a sentence. Admit the wrong, say sorry, make amends and change the habit. Love and honest change wash the mind like water washes cloth.", "joy1": "[[Joy grows when it is shared.]] Those whose hearts turn to the One stay in bloom. Celebrate your good moments, laugh, sing, and let others into your happiness. Shared joy doubles.", "lonely1": "[[You are never outside the circle.]] All beings have one Giver, so no one is truly alone. When loneliness comes, reach out to one person, and remember you belong to a much larger family.", "loved1": "[[You are valued for who you are, not for what you produce.]] Loving eyes turned mud into saffron. Accept that you matter, and look at others with the same loving eyes.", "fear1": "[[Worry is not protection; trust and presence are.]] Do what is yours to do, then rest inside the circle of the Name. The heat may come, but it need not set the mind on fire.", "grief1": "[[Love does not end; it changes form.]] Grieve honestly, then let love become remembrance, praise and service. Carry their light forward, as Guru Amar Das asked his family to sing rather than despair.", "forgive1": "[[Forgiving frees you first.]] Do not let anger settle and live in your mind. You can let go of resentment and still keep your boundaries. Doing good is your choice, not a reward they earned.", "women1": "[[Dignity is no one's to give or take.]] Every life comes through a woman; why call her lesser? Make equal respect a daily habit at home: who studies, who speaks, who eats first.", "work1": "[[Earn honestly, share with open hands.]] Honest work, sharing and remembering go together. The true path is recognised not by a holy appearance but by clean earning and a giving hand."}, "hi": {"anger1": "गुस्सा तेज़ होता है; [[समझदारी एक ठहराव है]]। संयम को अपनी कार्यशाला और धीरज को अपना सुनार बनाइए। जवाब देने से पहले साँस लीजिए, रुकिए और गर्मी को ठंडा होने दीजिए। फिर ऐसे बोलिए कि कल पछताना न पड़े।", "ego1": "[[कोई भी सफलता अकेले आपकी नहीं होती।]] अध्यापक, परिवार, सही समय और अनगिनत अनदेखे हाथों ने आपको यहाँ तक पहुँचाया। बड़े हुकम को याद रखने से मैं, मैं शांत रहता है और आप घमंड की जगह शुक्राने से खुशी मनाते हैं।", "comp1": "[[न कोई ऊँचा है, न कोई नीचा।]] तुलना खुशी छीन लेती है और लोगों को हमसे छिपा देती है। खुद को कल वाले खुद से नापिए, और मालिक से लेकर सफ़ाई करने वाले तक, सबको एक जैसा सम्मान दीजिए।", "accept1": "[[अपना हिस्सा पूरे मन से कीजिए, बाक़ी छोड़ दीजिए।]] ज़िंदगी का बहुत कुछ हमारे हाथ में नहीं है। हुकम के साथ चलना यानी बिना बेचैनी के मेहनत: जहाँ हो सके अच्छा कीजिए, जहाँ न हो सके शांति से मान लीजिए।", "content1": "[[काफ़ी होना एक एहसास है, कोई गिनती नहीं।]] संतोख का मतलब है ईमानदार मेहनत और जो है उसके लिए सीधा-सा शुक्राना। और ज़्यादा की दौड़ कभी ख़त्म नहीं होती। काफ़ी को पहचानने से शांति आज ही शुरू हो जाती है।", "listen1": "[[सुनना सलाह से ज़्यादा भरता है।]] जब कोई बोले, तो जवाब सोचने की जगह पूरा ध्यान उसे दीजिए। लोगों को और गुरु की बाणी को सच में सुनने से दुख और ग़लतफ़हमी धुल जाती हैं।", "habit1": "[[रोज़ की छोटी बातें ही आपकी पहचान बनती हैं।]] जैसे अमरदास जी हर सुबह पानी लाते रहे, वैसे ही हर सुबह के कुछ शांत मिनट मन को उतना गढ़ते हैं जितना कभी-कभार की बड़ी कोशिश कभी नहीं गढ़ सकती।", "action1": "[[जो बोते हैं, वही काटते हैं।]] आपके शब्द और काम बीज हैं। आज ईमानदारी, दया और मेहनत बोइए, फ़सल आपकी होगी। आपका खेत कोई और नहीं बो सकता।", "hard1": "[[कठिन दिन ज़िंदगी का हिस्सा हैं, उसका अंत नहीं।]] दुख सबके पास आता है। दिन को स्वीकार कीजिए, किसी अपने से बात कीजिए, एक छोटा अच्छा काम कीजिए, और भरोसा रखिए कि भारी मौसम बीत जाते हैं।", "kind1": "[[निरभउ, निरवैर: बिना डर, बिना दुश्मनी।]] सबमें एक ही ज्योति देखने का मतलब है बिना पूछे मदद करना कि कौन किस तरफ़ है, जैसे भाई घनैया ने हर घायल सिपाही को पानी पिलाया।", "mind1": "[[मन जीत लिया, तो जग जीत लिया।]] बेचैन मन चिंताओं और स्क्रीन की ओर भागता है। उसे प्यार से बार-बार वर्तमान में वापस लाइए। यही शांत अभ्यास असली जीत है।", "nature1": "[[हवा गुरु है, पानी पिता है, धरती माता है।]] प्रकृति को परिवार की तरह रखिए: कम बर्बाद कीजिए, कुछ भी गंदा मत कीजिए, और रोज़ एक पल रुककर आसमान, पेड़ और पानी को देखिए जो हमें ज़िंदा रखते हैं।", "purpose1": "[[सच एक-एक ईमानदार फ़ैसले से बनता है।]] छोटे झूठों की दीवार ईंट-ईंट से बनती है और वैसे ही गिरती है। छोटी बातों में ईमानदारी चुनिए, पूरी ज़िंदगी सच्ची हो जाएगी।", "guilt1": "[[ग़लतियाँ धोई जा सकती हैं।]] पछतावा एक इशारा है, सज़ा नहीं। ग़लती मानिए, माफ़ी माँगिए, भरपाई कीजिए और आदत बदलिए। प्यार और सच्चा बदलाव मन को ऐसे धोते हैं जैसे पानी कपड़े को।", "joy1": "[[ख़ुशी बाँटने से बढ़ती है।]] जिनका मन एक से जुड़ा है, वे सदा खिले रहते हैं। अपने अच्छे पलों का जश्न मनाइए, हँसिए, गाइए, और दूसरों को भी अपनी ख़ुशी में शामिल कीजिए। बाँटी हुई ख़ुशी दुगनी होती है।", "lonely1": "[[आप कभी दायरे से बाहर नहीं हैं।]] सब जीवों का एक ही दाता है, इसलिए कोई सच में अकेला नहीं। जब अकेलापन आए, तो किसी एक इंसान से संपर्क कीजिए, और याद रखिए कि आप एक बहुत बड़े परिवार का हिस्सा हैं।", "loved1": "[[आपकी क़ीमत आप ख़ुद हैं, आपका काम नहीं।]] प्यार भरी आँखों ने कीचड़ को केसर बना दिया। मान लीजिए कि आप मायने रखते हैं, और दूसरों को भी उन्हीं प्यार भरी आँखों से देखिए।", "fear1": "[[चिंता सुरक्षा नहीं है; भरोसा और साथ हैं।]] जो आपके हाथ में है वह कीजिए, फिर नाम के घेरे में आराम कीजिए। तपिश आ सकती है, पर मन को जलाना ज़रूरी नहीं।", "grief1": "[[प्यार ख़त्म नहीं होता; रूप बदलता है।]] सच्चाई से शोक कीजिए, फिर प्यार को याद, स्तुति और सेवा बनने दीजिए। उनकी रोशनी आगे ले चलिए, जैसे गुरु अमरदास जी ने परिवार से निराशा की जगह कीर्तन करने को कहा।", "forgive1": "[[माफ़ी सबसे पहले आपको आज़ाद करती है।]] गुस्से को मन में टिकने और बसने मत दीजिए। आप नाराज़गी छोड़कर भी अपनी सीमाएँ रख सकते हैं। भला करना आपका चुनाव है, उनका कमाया इनाम नहीं।", "women1": "[[सम्मान किसी का देने या छीनने का नहीं।]] हर जीवन स्त्री से आता है; उसे छोटा क्यों कहें? घर में बराबर सम्मान को रोज़ की आदत बनाइए: कौन पढ़ता है, कौन बोलता है, कौन पहले खाता है।", "work1": "[[ईमानदारी से कमाइए, खुले हाथ से बाँटिए।]] ईमानदार मेहनत, बाँटना और याद रखना साथ चलते हैं। सच्ची राह पवित्र दिखावे से नहीं, साफ़ कमाई और देने वाले हाथ से पहचानी जाती है।"}, "pa": {"anger1": "ਗੁੱਸਾ ਤੇਜ਼ ਹੁੰਦਾ ਹੈ; [[ਸਿਆਣਪ ਇਕ ਠਹਿਰਾਅ ਹੈ]]। ਜਤ ਨੂੰ ਆਪਣੀ ਕਾਰਜਸ਼ਾਲਾ ਤੇ ਧੀਰਜ ਨੂੰ ਆਪਣਾ ਸੁਨਿਆਰ ਬਣਾਓ। ਜਵਾਬ ਦੇਣ ਤੋਂ ਪਹਿਲਾਂ ਸਾਹ ਲਓ, ਰੁਕੋ ਤੇ ਗਰਮੀ ਨੂੰ ਠੰਢਾ ਹੋਣ ਦਿਓ। ਫਿਰ ਇਉਂ ਬੋਲੋ ਕਿ ਕੱਲ੍ਹ ਪਛਤਾਉਣਾ ਨਾ ਪਵੇ।", "ego1": "[[ਕੋਈ ਵੀ ਕਾਮਯਾਬੀ ਇਕੱਲੀ ਤੁਹਾਡੀ ਨਹੀਂ ਹੁੰਦੀ।]] ਅਧਿਆਪਕ, ਪਰਿਵਾਰ, ਸਹੀ ਸਮਾਂ ਤੇ ਅਣਗਿਣਤ ਅਣਦਿਸਦੇ ਹੱਥਾਂ ਨੇ ਤੁਹਾਨੂੰ ਇੱਥੇ ਤਕ ਪਹੁੰਚਾਇਆ। ਵੱਡੇ ਹੁਕਮ ਨੂੰ ਯਾਦ ਰੱਖਣ ਨਾਲ ਹਉਮੈ ਸ਼ਾਂਤ ਰਹਿੰਦੀ ਹੈ ਤੇ ਤੁਸੀਂ ਘਮੰਡ ਦੀ ਥਾਂ ਸ਼ੁਕਰਾਨੇ ਨਾਲ ਖ਼ੁਸ਼ੀ ਮਨਾਉਂਦੇ ਹੋ।", "comp1": "[[ਨਾ ਕੋਈ ਉੱਚਾ ਹੈ, ਨਾ ਕੋਈ ਨੀਵਾਂ।]] ਤੁਲਨਾ ਖ਼ੁਸ਼ੀ ਖੋਹ ਲੈਂਦੀ ਹੈ ਤੇ ਲੋਕਾਂ ਨੂੰ ਸਾਡੇ ਤੋਂ ਲੁਕਾ ਦਿੰਦੀ ਹੈ। ਆਪਣੇ ਆਪ ਨੂੰ ਕੱਲ੍ਹ ਵਾਲੇ ਆਪ ਨਾਲ ਮਿਣੋ, ਤੇ ਮਾਲਕ ਤੋਂ ਲੈ ਕੇ ਸਫ਼ਾਈ ਕਰਨ ਵਾਲੇ ਤਕ, ਸਭ ਨੂੰ ਇਕੋ ਜਿਹਾ ਆਦਰ ਦਿਓ।", "accept1": "[[ਆਪਣਾ ਹਿੱਸਾ ਪੂਰੇ ਮਨ ਨਾਲ ਕਰੋ, ਬਾਕੀ ਛੱਡ ਦਿਓ।]] ਜ਼ਿੰਦਗੀ ਦਾ ਬਹੁਤ ਕੁਝ ਸਾਡੇ ਹੱਥ ਵਿਚ ਨਹੀਂ। ਹੁਕਮ ਨਾਲ ਤੁਰਨਾ ਯਾਨੀ ਬਿਨਾਂ ਬੇਚੈਨੀ ਦੇ ਮਿਹਨਤ: ਜਿੱਥੇ ਹੋ ਸਕੇ ਚੰਗਾ ਕਰੋ, ਜਿੱਥੇ ਨਾ ਹੋ ਸਕੇ ਸ਼ਾਂਤੀ ਨਾਲ ਮੰਨ ਲਓ।", "content1": "[[ਕਾਫ਼ੀ ਹੋਣਾ ਇਕ ਅਹਿਸਾਸ ਹੈ, ਕੋਈ ਗਿਣਤੀ ਨਹੀਂ।]] ਸੰਤੋਖ ਦਾ ਅਰਥ ਹੈ ਇਮਾਨਦਾਰ ਮਿਹਨਤ ਤੇ ਜੋ ਹੈ ਉਸ ਲਈ ਸਿੱਧਾ ਜਿਹਾ ਸ਼ੁਕਰਾਨਾ। ਹੋਰ ਦੀ ਦੌੜ ਕਦੇ ਨਹੀਂ ਮੁੱਕਦੀ। ਕਾਫ਼ੀ ਨੂੰ ਪਛਾਣਨ ਨਾਲ ਸ਼ਾਂਤੀ ਅੱਜ ਹੀ ਸ਼ੁਰੂ ਹੋ ਜਾਂਦੀ ਹੈ।", "listen1": "[[ਸੁਣਨਾ ਸਲਾਹ ਨਾਲੋਂ ਵੱਧ ਭਰਦਾ ਹੈ।]] ਜਦੋਂ ਕੋਈ ਬੋਲੇ, ਤਾਂ ਜਵਾਬ ਸੋਚਣ ਦੀ ਥਾਂ ਪੂਰਾ ਧਿਆਨ ਉਸ ਨੂੰ ਦਿਓ। ਲੋਕਾਂ ਨੂੰ ਤੇ ਗੁਰੂ ਦੀ ਬਾਣੀ ਨੂੰ ਸੱਚਮੁੱਚ ਸੁਣਨ ਨਾਲ ਦੁੱਖ ਤੇ ਗ਼ਲਤਫ਼ਹਿਮੀ ਧੁਲ ਜਾਂਦੇ ਹਨ।", "habit1": "[[ਰੋਜ਼ ਦੀਆਂ ਛੋਟੀਆਂ ਗੱਲਾਂ ਹੀ ਤੁਹਾਡੀ ਪਛਾਣ ਬਣਦੀਆਂ ਹਨ।]] ਜਿਵੇਂ ਅਮਰਦਾਸ ਜੀ ਹਰ ਸਵੇਰ ਪਾਣੀ ਲਿਆਉਂਦੇ ਰਹੇ, ਉਵੇਂ ਹੀ ਹਰ ਸਵੇਰ ਦੇ ਕੁਝ ਸ਼ਾਂਤ ਮਿੰਟ ਮਨ ਨੂੰ ਉਸ ਤੋਂ ਵੱਧ ਘੜਦੇ ਹਨ ਜਿੰਨਾ ਕਦੇ-ਕਦਾਈਂ ਦੀ ਵੱਡੀ ਕੋਸ਼ਿਸ਼।", "action1": "[[ਜੋ ਬੀਜਦੇ ਹਾਂ, ਉਹੀ ਵੱਢਦੇ ਹਾਂ।]] ਤੁਹਾਡੇ ਸ਼ਬਦ ਤੇ ਕੰਮ ਬੀਜ ਹਨ। ਅੱਜ ਇਮਾਨਦਾਰੀ, ਦਇਆ ਤੇ ਮਿਹਨਤ ਬੀਜੋ, ਫ਼ਸਲ ਤੁਹਾਡੀ ਹੋਵੇਗੀ। ਤੁਹਾਡਾ ਖੇਤ ਕੋਈ ਹੋਰ ਨਹੀਂ ਬੀਜ ਸਕਦਾ।", "hard1": "[[ਔਖੇ ਦਿਨ ਜ਼ਿੰਦਗੀ ਦਾ ਹਿੱਸਾ ਹਨ, ਉਸ ਦਾ ਅੰਤ ਨਹੀਂ।]] ਦੁੱਖ ਸਭ ਕੋਲ ਆਉਂਦਾ ਹੈ। ਦਿਨ ਨੂੰ ਪਰਵਾਨ ਕਰੋ, ਕਿਸੇ ਆਪਣੇ ਨਾਲ ਗੱਲ ਕਰੋ, ਇਕ ਛੋਟਾ ਚੰਗਾ ਕੰਮ ਕਰੋ, ਤੇ ਭਰੋਸਾ ਰੱਖੋ ਕਿ ਭਾਰੇ ਮੌਸਮ ਲੰਘ ਜਾਂਦੇ ਹਨ।", "kind1": "[[ਨਿਰਭਉ, ਨਿਰਵੈਰ: ਬਿਨਾਂ ਡਰ, ਬਿਨਾਂ ਵੈਰ।]] ਸਭ ਵਿਚ ਇਕੋ ਜੋਤ ਵੇਖਣ ਦਾ ਅਰਥ ਹੈ ਬਿਨਾਂ ਪੁੱਛੇ ਮਦਦ ਕਰਨਾ ਕਿ ਕੌਣ ਕਿਸ ਪਾਸੇ ਹੈ, ਜਿਵੇਂ ਭਾਈ ਘਨੱਈਆ ਨੇ ਹਰ ਜ਼ਖ਼ਮੀ ਸਿਪਾਹੀ ਨੂੰ ਪਾਣੀ ਪਿਲਾਇਆ।", "mind1": "[[ਮਨ ਜਿੱਤਿਆ ਤਾਂ ਜਗ ਜਿੱਤਿਆ।]] ਬੇਚੈਨ ਮਨ ਫ਼ਿਕਰਾਂ ਤੇ ਸਕਰੀਨਾਂ ਵੱਲ ਭੱਜਦਾ ਹੈ। ਉਸ ਨੂੰ ਪਿਆਰ ਨਾਲ ਵਾਰ-ਵਾਰ ਵਰਤਮਾਨ ਵਿਚ ਵਾਪਸ ਲਿਆਓ। ਇਹੀ ਸ਼ਾਂਤ ਅਭਿਆਸ ਅਸਲ ਜਿੱਤ ਹੈ।", "nature1": "[[ਪਵਣੁ ਗੁਰੂ, ਪਾਣੀ ਪਿਤਾ, ਧਰਤੀ ਮਾਤਾ।]] ਕੁਦਰਤ ਨੂੰ ਪਰਿਵਾਰ ਵਾਂਗ ਸਾਂਭੋ: ਘੱਟ ਬਰਬਾਦ ਕਰੋ, ਕੁਝ ਵੀ ਗੰਦਾ ਨਾ ਕਰੋ, ਤੇ ਰੋਜ਼ ਇਕ ਪਲ ਰੁਕ ਕੇ ਅਸਮਾਨ, ਰੁੱਖਾਂ ਤੇ ਪਾਣੀ ਨੂੰ ਵੇਖੋ ਜੋ ਸਾਨੂੰ ਜਿਊਂਦਾ ਰੱਖਦੇ ਹਨ।", "purpose1": "[[ਸੱਚ ਇਕ-ਇਕ ਇਮਾਨਦਾਰ ਫ਼ੈਸਲੇ ਨਾਲ ਬਣਦਾ ਹੈ।]] ਛੋਟੇ ਝੂਠਾਂ ਦੀ ਕੰਧ ਇੱਟ-ਇੱਟ ਨਾਲ ਬਣਦੀ ਹੈ ਤੇ ਉਵੇਂ ਹੀ ਡਿੱਗਦੀ ਹੈ। ਛੋਟੀਆਂ ਗੱਲਾਂ ਵਿਚ ਇਮਾਨਦਾਰੀ ਚੁਣੋ, ਸਾਰੀ ਜ਼ਿੰਦਗੀ ਸੱਚੀ ਹੋ ਜਾਵੇਗੀ।", "guilt1": "[[ਗ਼ਲਤੀਆਂ ਧੋਤੀਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ।]] ਪਛਤਾਵਾ ਇਕ ਇਸ਼ਾਰਾ ਹੈ, ਸਜ਼ਾ ਨਹੀਂ। ਗ਼ਲਤੀ ਮੰਨੋ, ਮਾਫ਼ੀ ਮੰਗੋ, ਭਰਪਾਈ ਕਰੋ ਤੇ ਆਦਤ ਬਦਲੋ। ਪਿਆਰ ਤੇ ਸੱਚਾ ਬਦਲਾਅ ਮਨ ਨੂੰ ਇਉਂ ਧੋਂਦੇ ਹਨ ਜਿਵੇਂ ਪਾਣੀ ਕੱਪੜੇ ਨੂੰ।", "joy1": "[[ਖ਼ੁਸ਼ੀ ਵੰਡਣ ਨਾਲ ਵਧਦੀ ਹੈ।]] ਜਿਨ੍ਹਾਂ ਦਾ ਮਨ ਇਕ ਨਾਲ ਜੁੜਿਆ ਹੈ, ਉਹ ਸਦਾ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ। ਆਪਣੇ ਚੰਗੇ ਪਲਾਂ ਦੀ ਖ਼ੁਸ਼ੀ ਮਨਾਓ, ਹੱਸੋ, ਗਾਓ, ਤੇ ਹੋਰਾਂ ਨੂੰ ਵੀ ਆਪਣੀ ਖ਼ੁਸ਼ੀ ਵਿਚ ਸ਼ਾਮਲ ਕਰੋ। ਵੰਡੀ ਹੋਈ ਖ਼ੁਸ਼ੀ ਦੁੱਗਣੀ ਹੁੰਦੀ ਹੈ।", "lonely1": "[[ਤੁਸੀਂ ਕਦੇ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਨਹੀਂ।]] ਸਭ ਜੀਆਂ ਦਾ ਇਕੋ ਦਾਤਾ ਹੈ, ਇਸ ਲਈ ਕੋਈ ਸੱਚਮੁੱਚ ਇਕੱਲਾ ਨਹੀਂ। ਜਦੋਂ ਇਕੱਲਾਪਣ ਆਵੇ, ਤਾਂ ਕਿਸੇ ਇਕ ਇਨਸਾਨ ਨਾਲ ਸੰਪਰਕ ਕਰੋ, ਤੇ ਯਾਦ ਰੱਖੋ ਕਿ ਤੁਸੀਂ ਇਕ ਬਹੁਤ ਵੱਡੇ ਪਰਿਵਾਰ ਦਾ ਹਿੱਸਾ ਹੋ।", "loved1": "[[ਤੁਹਾਡੀ ਕੀਮਤ ਤੁਸੀਂ ਆਪ ਹੋ, ਤੁਹਾਡਾ ਕੰਮ ਨਹੀਂ।]] ਪਿਆਰ ਭਰੀਆਂ ਅੱਖਾਂ ਨੇ ਚਿੱਕੜ ਨੂੰ ਕੇਸਰ ਬਣਾ ਦਿੱਤਾ। ਮੰਨ ਲਓ ਕਿ ਤੁਸੀਂ ਮਾਇਨੇ ਰੱਖਦੇ ਹੋ, ਤੇ ਹੋਰਾਂ ਨੂੰ ਵੀ ਉਨ੍ਹਾਂ ਹੀ ਪਿਆਰ ਭਰੀਆਂ ਅੱਖਾਂ ਨਾਲ ਵੇਖੋ।", "fear1": "[[ਚਿੰਤਾ ਸੁਰੱਖਿਆ ਨਹੀਂ; ਭਰੋਸਾ ਅਤੇ ਸਾਥ ਹਨ।]] ਜੋ ਤੁਹਾਡੇ ਹੱਥ ਵਿੱਚ ਹੈ ਉਹ ਕਰੋ, ਫਿਰ ਨਾਮ ਦੇ ਘੇਰੇ ਵਿੱਚ ਆਰਾਮ ਕਰੋ। ਸੇਕ ਆ ਸਕਦਾ ਹੈ, ਪਰ ਮਨ ਦਾ ਸੜਨਾ ਜ਼ਰੂਰੀ ਨਹੀਂ।", "grief1": "[[ਪਿਆਰ ਮੁੱਕਦਾ ਨਹੀਂ; ਰੂਪ ਬਦਲਦਾ ਹੈ।]] ਸੱਚਾਈ ਨਾਲ ਸੋਗ ਕਰੋ, ਫਿਰ ਪਿਆਰ ਨੂੰ ਯਾਦ, ਸਿਫ਼ਤ ਅਤੇ ਸੇਵਾ ਬਣਨ ਦਿਓ। ਉਨ੍ਹਾਂ ਦੀ ਰੌਸ਼ਨੀ ਅੱਗੇ ਲੈ ਕੇ ਚੱਲੋ, ਜਿਵੇਂ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਪਰਿਵਾਰ ਨੂੰ ਨਿਰਾਸ਼ਾ ਦੀ ਥਾਂ ਕੀਰਤਨ ਕਰਨ ਲਈ ਕਿਹਾ।", "forgive1": "[[ਮਾਫ਼ੀ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਤੁਹਾਨੂੰ ਆਜ਼ਾਦ ਕਰਦੀ ਹੈ।]] ਗੁੱਸੇ ਨੂੰ ਮਨ ਵਿੱਚ ਟਿਕਣ ਅਤੇ ਵੱਸਣ ਨਾ ਦਿਓ। ਤੁਸੀਂ ਨਾਰਾਜ਼ਗੀ ਛੱਡ ਕੇ ਵੀ ਆਪਣੀਆਂ ਹੱਦਾਂ ਰੱਖ ਸਕਦੇ ਹੋ। ਭਲਾ ਕਰਨਾ ਤੁਹਾਡੀ ਚੋਣ ਹੈ, ਉਨ੍ਹਾਂ ਦਾ ਕਮਾਇਆ ਇਨਾਮ ਨਹੀਂ।", "women1": "[[ਸਤਿਕਾਰ ਕਿਸੇ ਦੇ ਦੇਣ ਜਾਂ ਖੋਹਣ ਦਾ ਨਹੀਂ।]] ਹਰ ਜੀਵਨ ਔਰਤ ਤੋਂ ਆਉਂਦਾ ਹੈ; ਉਸ ਨੂੰ ਛੋਟਾ ਕਿਉਂ ਕਹੀਏ? ਘਰ ਵਿੱਚ ਬਰਾਬਰ ਸਤਿਕਾਰ ਨੂੰ ਰੋਜ਼ ਦੀ ਆਦਤ ਬਣਾਓ: ਕੌਣ ਪੜ੍ਹਦਾ ਹੈ, ਕੌਣ ਬੋਲਦਾ ਹੈ, ਕੌਣ ਪਹਿਲਾਂ ਖਾਂਦਾ ਹੈ।", "work1": "[[ਇਮਾਨਦਾਰੀ ਨਾਲ ਕਮਾਓ, ਖੁੱਲ੍ਹੇ ਹੱਥ ਨਾਲ ਵੰਡੋ।]] ਕਿਰਤ, ਵੰਡ ਛਕਣਾ ਅਤੇ ਨਾਮ ਜਪਣਾ ਨਾਲ-ਨਾਲ ਚੱਲਦੇ ਹਨ। ਸੱਚਾ ਰਾਹ ਪਵਿੱਤਰ ਦਿਖਾਵੇ ਨਾਲ ਨਹੀਂ, ਸਾਫ਼ ਕਮਾਈ ਅਤੇ ਦੇਣ ਵਾਲੇ ਹੱਥ ਨਾਲ ਪਛਾਣਿਆ ਜਾਂਦਾ ਹੈ।"}}, DEEP = {"en": {"c": {"anger1": "Two thousand years ago the Stoic philosopher Seneca wrote in his book On Anger that the greatest remedy for anger is delay. Modern psychology agrees. In 2002 the psychologist Brad Bushman found that venting anger, for example by hitting a punching bag while thinking about the person, made people more aggressive, not less. What helps is reappraisal, a term from the researcher James Gross: changing how you read the situation. Maybe my friend is overwhelmed, not careless. Japji Sahib puts patience in the goldsmith's hands for the same reason. Heat is useful only when it is controlled.", "ego1": "Psychologists call it the self-serving bias: we take credit for our successes and blame circumstances for our failures. It protects our self-image, but it blinds us to the many hands behind every result. The Ashtavakra Gita, an old Indian text on non-duality, has a striking image: you have been bitten by the black snake of the ego that says, I am the doer. Japji Sahib says the same in the language of hukam: everything happens within a larger order. Seeing this does not make you passive. It makes you grateful, and gratitude is a much lighter thing to carry than pride.", "comp1": "In 1954 the psychologist Leon Festinger described social comparison theory: we judge ourselves by measuring against others. Comparing upward can inspire, but done constantly, especially on social media where we compare our ordinary days with others' best photos, it breeds envy and low mood. Researchers suggest a simple switch: compare yourself with who you were last year, and turn others' success into curiosity, what can I learn from them? Gurbani goes deeper still: no one is high and no one is low. When the ladder disappears, comparison loses its grip.", "accept1": "The Stoic teacher Epictetus opened his handbook, the Enchiridion, with one idea: some things are in our control, and some are not. Our effort, words and choices are ours; other people's actions, the weather and outcomes are not. Modern Acceptance and Commitment Therapy, developed by Steven Hayes, builds on a similar idea: accept what you cannot change, and commit to action guided by your values. Walking in hukam is not giving up. It is putting your full strength where it belongs, and letting the rest go.", "content1": "In 1971 the psychologists Philip Brickman and Donald Campbell described what is now called the hedonic treadmill: after a raise, a new phone or a new house, our happiness rises, then quietly returns to its usual level, and we start wanting the next thing. What breaks the cycle is noticing. In a well-known 2003 study, Robert Emmons and Michael McCullough found that people who wrote down a few things they were grateful for each week felt more positive about their lives than those who did not. Santokh is not having less. It is finally seeing what you already have.", "listen1": "The psychologist Carl Rogers, with Richard Farson, described active listening in 1957: listening for the feeling behind the words, and reflecting it back without judging or rushing to fix. When people feel truly heard, their defensiveness drops and they think more clearly. Most of us listen to reply, not to understand. Japji Sahib's pauris on suniai, listening, describe listening as a doorway: through it pain and wrongdoing fall away. Deep listening is both a spiritual practice and one of the kindest things one person can do for another.", "habit1": "In his book Atomic Habits, published in 2018, James Clear describes habits as a loop: a cue, a craving, a response and a reward. Make the cue obvious and the habit easy, and it slowly becomes part of who you are. Research by Phillippa Lally and colleagues in 2010 found that a new habit took on average about sixty six days to become automatic, with a wide range depending on the person and the habit. That is why Amrit vela matters: the same calm time, every day, until reflection is not an effort but who you are.", "action1": "Psychologist Daryl Bem's self-perception theory, from 1972, suggests that we learn who we are partly by watching what we do. Act honestly a few times and you start seeing yourself as an honest person, which makes the next honest act easier. Small actions compound, like interest in a bank. This is close to the idea of karma: not a mysterious punishment, but the natural harvest of seeds we keep planting. Japji Sahib says it plainly: you sow, and you yourself eat.", "hard1": "The psychiatrist Viktor Frankl survived Nazi concentration camps and wrote in Man's Search for Meaning, first published in 1946: when we are no longer able to change a situation, we are challenged to change ourselves. Decades later, the psychologists Richard Tedeschi and Lawrence Calhoun studied what they called post-traumatic growth: many people, after great hardship, report deeper relationships, new priorities and stronger inner life. This does not make suffering good. It means suffering does not have the last word. Seeing even hard days within the Giver's order is the Gurbani way of saying the same.", "kind1": "In 1979 the psychologists Henri Tajfel and John Turner described social identity theory: we naturally split the world into us and them, and favour our own group, sometimes without noticing. A remedy researchers have tested is loving-kindness meditation: in a 2008 study led by Barbara Fredrickson, people who practised wishing others well for a few weeks reported more positive emotions and felt more connected to others. Ik Onkar, One Creator, goes to the root: if there is one light in all, there is no them. That is why Bhai Kanhaiya could serve every wounded soldier.", "mind1": "In 2010 the Harvard researchers Matthew Killingsworth and Daniel Gilbert used a phone app to ask thousands of people what they were doing and what they were thinking about. Nearly half the time, about forty seven percent, their minds were wandering, and they were usually less happy while wandering. Their paper was titled A wandering mind is an unhappy mind. The Bhagavad Gita already had Arjuna complain that the mind is restless, as hard to hold as the wind, and the answer it gives is practice and detachment. Japji Sahib says: win the mind, and you win the world.", "nature1": "The biologist Edward O. Wilson popularised the word biophilia in 1984: the idea that humans have an inborn love of living things. Psychologists Rachel and Stephen Kaplan developed attention restoration theory in 1989, suggesting that time in nature gently restores the attention that city life and screens wear out. Many studies since link green spaces with lower stress. Gurbani calls air our Guru, water our father, the earth our mother. Science explains why nature heals us; Gurbani reminds us that we belong to it, and must care for it like family.", "purpose1": "In 2016, the neuroscientist Neil Garrett and colleagues published a study in Nature Neuroscience showing that small self-serving lies tend to grow: as people kept lying, the brain's emotional response to their dishonesty weakened, and the lies got bigger. Decades earlier, Leon Festinger described cognitive dissonance: when our actions and values clash, we feel discomfort, and often bend our values to fit our actions rather than the other way round. This is exactly the wall of falsehood Japji Sahib speaks of. It is built one brick at a time, and taken down the same way.", "guilt1": "The psychologist June Tangney has studied the difference between guilt and shame for decades. Guilt says I did a bad thing; shame says I am bad. Her research suggests guilt tends to lead to repair, apologies and change, while shame tends to lead to hiding, blaming or withdrawing. Kristin Neff's work on self-compassion adds that treating yourself kindly after a mistake makes you more, not less, likely to take responsibility. Gurbani's image of washing a stained mind is hopeful in exactly this way: the stain is real, but it is not who you are.", "joy1": "Psychologists have a name for sharing good news: capitalisation. In 2004 Shelly Gable and colleagues found that when people tell someone about a good event and that person responds with genuine enthusiasm, the joy grows and the relationship strengthens. Fred Bryant's research on savouring shows that pausing to notice and stretch good moments makes them last longer. Gurbani's word vigaas, blossoming, describes a heart that stays open in this way. Joy is not a selfish thing to hide; shared, it multiplies.", "lonely1": "In 1995 Roy Baumeister and Mark Leary argued that the need to belong is a basic human need, like food and shelter. In 2010 Julianne Holt-Lunstad and colleagues reviewed 148 studies and found that people with stronger social relationships had about a fifty percent greater chance of survival over the study periods. Loneliness is not weakness; it is a signal, like hunger, that we need connection. Gurbani speaks to both sides: all beings have one Giver, so no one is outside the circle, and that same truth calls us to reach out to each other.", "loved1": "Carl Rogers described unconditional positive regard: accepting a person as worthy without conditions, even while not approving of everything they do. He saw it as the soil in which people grow. Jennifer Crocker's research on contingencies of self-worth shows the opposite: when our worth depends on marks, looks or approval, our mood swings with every success and failure. Gurbani points to a worth that does not depend on performance. Bhai Lehna's muddy bundle was seen with loving eyes, and the mud looked like saffron.", "fear1": "Psychologists describe worry as the mind rehearsing danger in advance, hoping to feel prepared. A 2020 study by Lucas LaFreniere and Michelle Newman asked people with anxiety to write down their worries and check later what actually happened: about ninety one percent of the predictions did not come true. The attachment researchers John Bowlby and Mary Ainsworth showed that children explore bravely when they have a secure base to return to. Gurbani offers a secure base for the mind: the shelter of the One, a circle around us within which fear loses its heat.", "grief1": "For much of the twentieth century, grief was described as letting go and moving on. In 1996 Dennis Klass, Phyllis Silverman and Steven Nickman described continuing bonds instead: healthy mourners often keep a changed, inner relationship with the person who died, through memories, values and rituals. In 1999 Margaret Stroebe and Henk Schut described the dual process model: grieving people naturally swing between facing the loss and resting from it by attending to daily life. Both are healthy. Guru Amar Das gave his family a continuing bond of the deepest kind: kirtan, and the Guru's light carried forward.", "forgive1": "The psychologist Everett Worthington, who has researched forgiveness for decades, describes it as replacing resentment with goodwill, slowly and often in steps. Robert Enright's work stresses what forgiveness is not: it is not excusing the wrong, forgetting it, or necessarily reconciling. Studies link long-held grudges and rumination with higher stress, and forgiveness with better wellbeing. Farid said this centuries earlier: when anger is not allowed to settle in the mind, the body and the mind stay healthier. Forgiveness is not weakness; it is taking your own heart back.", "women1": "In 1996 the psychologists Peter Glick and Susan Fiske described ambivalent sexism: alongside openly hostile attitudes there is benevolent sexism, which sounds kind but still limits, for example she is too delicate for that job, or she will marry anyway, why study. The philosopher Immanuel Kant argued that every person must be treated as an end in themselves, never merely as a means. Guru Nanak's salok goes straight to the root: every one of us came into the world through a woman. Equal dignity is not modern politics; it is simple truth.", "work1": "Research by Elizabeth Dunn, Lara Aknin and Michael Norton, published in Science in 2008, found that people who spent money on others felt happier than those who spent the same amount on themselves. Self-determination theory, developed by Edward Deci and Richard Ryan, shows that people thrive when they feel competent, free and connected, and honest work done well feeds all three. Guru Nanak's three-part path, honest work, sharing and remembering, describes a whole and happy life, long before psychology measured it."}, "x": {"anger1": "The full pauri 38 describes a mint where the true Word is coined: self-control is the workshop, patience the goldsmith, understanding the anvil, knowledge the tools, the fear of the Divine the bellows, discipline the fire, and love the crucible in which nectar is poured. Patience is one part of a whole craft of shaping a person.", "ego1": "Pauri 2 says everything is created by hukam, the divine order: forms, beings, greatness, high and low, pain and joy. Some are blessed, some wander. Everyone is within hukam, none outside. The line comes at the end as the conclusion: whoever understands hukam stops saying I, I.", "comp1": "Pauri 33 lists what is not in our power: to speak or stay silent, to ask or give, to live or die, to rule or gain wealth. Power is in the Creator's hands alone. Its last line follows from that: since no one holds the power, no one is high and no one is low.", "accept1": "Pauri 1 asks how washing, silence, or piling up wealth cannot make us truthful, and how cleverness cannot help. Then it asks: how can we become truthful, and how can the wall of falsehood be broken? The answer is this line: walk in the will of the hukam, which is written within us.", "content1": "Pauri 28 speaks to the yogis of the time, using their own symbols. Instead of earrings, begging bag and ash, it offers inner qualities: contentment, modesty or honest effort, and meditation. It turns outward religious symbols into inner virtues.", "listen1": "Pauris 8 to 11 repeat suniai, by listening, again and again: by listening one understands the earth, the sky and the spiritual seekers, and even death cannot touch, and every pauri ends with the same refrain: Nanak, the devotees always blossom; by listening, pain and wrongdoing are destroyed.", "habit1": "Pauri 4 says the Lord is true, with true Name, spoken of with endless love. People beg and the Giver gives. What can we offer in return? In the amrit vela, the ambrosial hours before dawn, reflect on the True Name and its greatness. Grace opens the door.", "action1": "Pauri 20 uses everyday images: dirty hands are washed with water, stained clothes with soap, a mind stained by wrongdoing with love of the Name. Virtue and vice are not just words; whatever we do is written with us. You yourself sow, and you yourself eat.", "hard1": "Pauri 25 praises the Giver's endless gifts: so many receive, so many waste, so many enjoy and deny. Then it says so many suffer pain, hunger and constant blows; even these are your gifts, O Giver. Release from bondage comes through the hukam. The line holds pain inside the same order as blessing.", "kind1": "The Mool Mantar opens Guru Granth Sahib and describes the One: one Creator, Truth by name, the Doer, without fear, without enmity, timeless, unborn, self-existent, known through the Guru's grace. Everything else in Gurbani unfolds from these words.", "mind1": "Pauri 28 again speaks in the yogis' own language: make the fraternity of all people your sect. Then it gives the core: win your own mind, and you win the world. True conquest is inner.", "nature1": "The closing salok of Japji Sahib calls air the Guru, water the father and the great earth the mother, with day and night as nurses in whose lap the whole world plays. Good and bad deeds are read out in the divine presence. It ends with those who remembered the Name and left their effort done.", "purpose1": "Pauri 1 begins by saying that cleansing, silence, satisfying hunger with wealth, and endless cleverness cannot bring us to truth. This line is the question at the heart of the pauri: how to become truthful, how to break the wall of falsehood. The next line answers: by walking in the hukam.", "guilt1": "Pauri 20 sets washing side by side: dirt on hands is washed with water, urine-stained clothes with soap, and a mind stained with wrongdoing is washed by love of the Name. Then it says virtue and vice are recorded by what we do: you sow and you reap.", "joy1": "These words close pauris 8 to 11, the pauris on listening. After each list of what listening brings, the refrain returns: Nanak, the devotees are always in bloom. Joy here is the fruit of a heart that listens.", "lonely1": "Pauri 5 and 6 speak of one Giver for all: the Guru has given one understanding, that there is one Giver of all beings, and the prayer is that I never forget the One. Bathing at pilgrimages means nothing without pleasing the One.", "loved1": "Pauri 21 questions pilgrimages, austerity and charity done for show; they earn only a little honour. Whoever listens, believes and holds love in the heart is cleansed by bathing in the sacred place within.", "fear1": "A short shabad of Guru Arjan in Raag Bilaval. The first verse speaks of the protective circle of the Name. The Rahao line, the centre, says the complete Satguru has given the Name as medicine. It ends: the Protector protected, all affliction removed; Nanak says, grace was given and God became the helper.", "grief1": "From the Sadd in Raag Ramkali, written by Baba Sundar. It describes Guru Amar Das's last days: he gathers his family, says the Lord's will is sweet to him, tells them not to weep because a friend rejoices in a friend's honour, asks for kirtan after him, and installs Guru Ram Das on the Guru's seat.", "forgive1": "Saloks of Sheikh Farid, the Sufi saint of Punjab, are full of humility and patience: do not hit back at those who hit you, kiss their feet and go home. This salok gives the practical reason: anger kept inside harms body and mind.", "women1": "A salok of Guru Nanak in Asa di Var. It lists how every human is conceived, born, engaged and married through a woman, how friendship and the world's path run through her, and asks why she should be called lesser. It ends: whoever praises the One, man or woman, their face shines in the true court.", "work1": "From Sarang ki Var. Guru Nanak first describes people who turn religion into a living: singing without understanding, a hungry mullah, a man who pierces his ears to beg, one who calls himself guru yet begs; do not bow at such feet. Then this answer: earn by effort and share."}}, "hi": {"c": {"anger1": "दो हज़ार साल पहले स्टोइक दार्शनिक सेनेका ने अपनी किताब 'ऑन एंगर' में लिखा कि गुस्से का सबसे बड़ा इलाज है ठहरना। आधुनिक मनोविज्ञान भी यही कहता है। 2002 में मनोवैज्ञानिक ब्रैड बुशमैन ने पाया कि गुस्सा निकालना, जैसे उस इंसान के बारे में सोचते हुए पंचिंग बैग पर मुक्के मारना, लोगों को कम नहीं बल्कि ज़्यादा आक्रामक बनाता है। मदद करता है 'रीअप्रेज़ल', शोधकर्ता जेम्स ग्रॉस का शब्द, यानी स्थिति को दूसरी नज़र से पढ़ना। शायद मेरा दोस्त बेपरवाह नहीं, बस परेशान है। जपुजी साहिब इसी वजह से धीरज को सुनार के हाथ में रखता है। तपिश तभी काम की है जब वह क़ाबू में हो।", "ego1": "मनोवैज्ञानिक इसे 'सेल्फ़-सर्विंग बायस' कहते हैं: अपनी सफलता का श्रेय ख़ुद को देना और नाकामी का दोष हालात को। यह हमारी छवि बचाता है, पर हर नतीजे के पीछे के अनगिनत हाथों को छिपा देता है। अष्टावक्र गीता, अद्वैत पर एक पुराना भारतीय ग्रंथ, एक तीखी तस्वीर देती है: तुम्हें 'मैं करने वाला हूँ' नाम के अहंकार के काले साँप ने डसा है। जपुजी साहिब हुकम की भाषा में यही कहता है: सब कुछ एक बड़े विधान के अंदर होता है। यह समझ आपको निष्क्रिय नहीं बनाती, शुक्रगुज़ार बनाती है, और शुक्राना घमंड से कहीं हल्का बोझ है।", "comp1": "1954 में मनोवैज्ञानिक लियोन फ़ेस्टिंगर ने 'सोशल कंपैरिज़न थ्योरी' दी: हम ख़ुद को दूसरों से नापकर आँकते हैं। ऊपर की ओर तुलना प्रेरित कर सकती है, पर लगातार करने पर, ख़ासकर सोशल मीडिया पर जहाँ हम अपने साधारण दिनों की तुलना दूसरों की सबसे अच्छी तस्वीरों से करते हैं, यह जलन और उदासी पैदा करती है। शोधकर्ता एक आसान बदलाव सुझाते हैं: ख़ुद की तुलना पिछले साल के ख़ुद से कीजिए, और दूसरों की सफलता को जिज्ञासा में बदलिए, मैं इनसे क्या सीख सकता हूँ? गुरबाणी इससे भी गहरी बात कहती है: न कोई ऊँचा, न कोई नीचा। जब सीढ़ी ही न रहे, तो तुलना की पकड़ छूट जाती है।", "accept1": "स्टोइक शिक्षक एपिक्टेटस ने अपनी पुस्तिका 'एनकिरिडियन' एक ही विचार से शुरू की: कुछ चीज़ें हमारे वश में हैं, कुछ नहीं। हमारी मेहनत, शब्द और चुनाव हमारे हैं; दूसरों के काम, मौसम और नतीजे नहीं। स्टीवन हेज़ की विकसित की हुई आधुनिक 'एक्सेप्टेंस एंड कमिटमेंट थेरेपी' भी इसी पर टिकी है: जो बदल नहीं सकते उसे स्वीकारो, और अपने मूल्यों के हिसाब से कर्म करो। हुकम में चलना हार मानना नहीं। यह अपनी पूरी ताक़त सही जगह लगाना है, और बाक़ी को छोड़ देना।", "content1": "1971 में मनोवैज्ञानिक फ़िलिप ब्रिकमैन और डोनाल्ड कैंपबेल ने वह बताया जिसे आज 'हेडोनिक ट्रेडमिल' कहते हैं: तनख़्वाह बढ़ने, नए फ़ोन या नए घर के बाद ख़ुशी बढ़ती है, फिर चुपचाप पुराने स्तर पर लौट आती है, और हम अगली चीज़ चाहने लगते हैं। यह चक्र तोड़ता है ध्यान देना। 2003 के एक मशहूर अध्ययन में रॉबर्ट एमन्स और माइकल मैककलो ने पाया कि जो लोग हर हफ़्ते कुछ बातें लिखते थे जिनके लिए वे शुक्रगुज़ार थे, वे अपनी ज़िंदगी को लेकर ज़्यादा सकारात्मक महसूस करते थे। संतोख कम रखना नहीं है। यह आख़िरकार उसे देख पाना है जो आपके पास पहले से है।", "listen1": "मनोवैज्ञानिक कार्ल रॉजर्स ने रिचर्ड फ़ार्सन के साथ 1957 में 'एक्टिव लिसनिंग' का वर्णन किया: शब्दों के पीछे की भावना को सुनना, और बिना परखे या जल्दी हल सुझाए उसे लौटाना। जब लोग सच में सुने जाते हैं, तो उनकी अकड़ ढीली पड़ती है और वे साफ़ सोच पाते हैं। हममें से ज़्यादातर जवाब देने के लिए सुनते हैं, समझने के लिए नहीं। जपुजी साहिब की 'सुणिऐ' वाली पउड़ियाँ सुनने को एक दरवाज़ा बताती हैं, जिससे दुख और पाप दूर होते हैं। गहराई से सुनना एक आध्यात्मिक अभ्यास भी है और किसी के लिए की जा सकने वाली सबसे प्यारी चीज़ों में से एक भी।", "habit1": "2018 में छपी किताब 'एटॉमिक हैबिट्स' में जेम्स क्लियर आदतों को एक चक्र बताते हैं: संकेत, चाह, प्रतिक्रिया और इनाम। संकेत को साफ़ और आदत को आसान बनाइए, तो वह धीरे-धीरे आपकी पहचान बन जाती है। 2010 में फ़िलिपा लैली और साथियों के शोध में पाया गया कि किसी नई आदत को अपने-आप होने में औसतन लगभग छियासठ दिन लगे, हालाँकि यह इंसान और आदत के हिसाब से काफ़ी अलग था। इसीलिए अमृत वेला मायने रखता है: रोज़ वही शांत समय, जब तक विचार करना कोशिश नहीं, आपकी पहचान न बन जाए।", "action1": "मनोवैज्ञानिक डैरिल बेम की 1972 की 'सेल्फ़-पर्सेप्शन थ्योरी' कहती है कि हम कुछ हद तक यह देखकर सीखते हैं कि हम कौन हैं कि हम क्या करते हैं। कुछ बार ईमानदारी से काम कीजिए, तो आप ख़ुद को ईमानदार इंसान मानने लगते हैं, और अगला ईमानदार काम आसान हो जाता है। छोटे काम बैंक के ब्याज की तरह बढ़ते हैं। यह कर्म के विचार के क़रीब है: कोई रहस्यमय सज़ा नहीं, बल्कि उन बीजों की स्वाभाविक फ़सल जो हम बोते रहते हैं। जपुजी साहिब सीधा कहता है: तुम ख़ुद बोते हो, और ख़ुद ही खाते हो।", "hard1": "मनोचिकित्सक विक्टर फ़्रैंकल नाज़ी यातना शिविरों से बचकर निकले और 1946 में पहली बार छपी किताब 'मैन्स सर्च फ़ॉर मीनिंग' में लिखा: जब हम किसी स्थिति को बदल नहीं सकते, तो हमें ख़ुद को बदलने की चुनौती मिलती है। दशकों बाद मनोवैज्ञानिक रिचर्ड टेडेस्की और लॉरेंस कैल्हुन ने 'पोस्ट-ट्रॉमैटिक ग्रोथ' का अध्ययन किया: बहुत से लोग बड़ी मुश्किल के बाद गहरे रिश्ते, नई प्राथमिकताएँ पउड़ी बताती है कि नहाने, चुप रहने या धन जोड़ने से सच्चे नहीं बनते, और चतुराई भी काम नहीं आती। फिर पूछती है: सच्चे कैसे बनें, झूठ की दीवार कैसे टूटे? जवाब यही पंक्ति है: हुकम की रज़ा में चलो, जो हमारे भीतर लिखी है।", "content1": "28वीं पउड़ी उस समय के योगियों से उन्हीं के प्रतीकों में बात करती है। कुंडल, झोली और राख की जगह यह भीतरी गुण देती है: संतोख, लज्जा या ईमानदार मेहनत, और ध्यान। यह बाहरी धार्मिक चिह्नों को भीतर के गुणों में बदल देती है।", "listen1": "आठवीं से ग्यारहवीं पउड़ी बार-बार 'सुणिऐ', यानी सुनने से, दोहराती हैं: सुनने से धरती, आकाश और सिद्ध-पीरों की समझ आती है, मौत भी छू नहीं पाती, और हर पउड़ी एक ही टेक पर ख़त्म होती है: नानक, भक्त सदा खिले रहते हैं; सुनने से दुख और पाप मिट जाते हैं।", "habit1": "चौथी पउड़ी कहती है कि प्रभु सच्चा है, उसका नाम सच्चा, और उसे अपार प्यार से गाया जाता है। लोग माँगते हैं और दाता देता है। हम बदले में क्या दें? अमृत वेले, भोर से पहले के शांत पहर में, सच्चे नाम और उसकी बड़ाई पर विचार करो। कृपा से दरवाज़ा खुलता है।", "action1": "20वीं पउड़ी रोज़ की तस्वीरें देती है: गंदे हाथ पानी से धुलते हैं, मैले कपड़े साबुन से, और पापों से मैला मन नाम के प्यार से। पुण्य और पाप सिर्फ़ शब्द नहीं; जो हम करते हैं वह हमारे साथ लिखा जाता है। तुम ख़ुद बोते हो, ख़ुद खाते हो।", "hard1": "25वीं पउड़ी दाता की अनगिनत देनों की स्तुति करती है: कितने पाते हैं, कितने गँवाते हैं, कितने भोगकर मुकर जाते हैं। फिर कहती है कि कितने दुख, भूख और लगातार मार सहते हैं; ये भी तेरी ही देन हैं, हे दाता। बंधन से छुटकारा हुकम से होता है। यह पंक्ति दर्द को भी उसी विधान में रखती है जिसमें बरकत है।", "kind1": "मूल मंतर गुरु ग्रंथ साहिब की शुरुआत है और उस एक का वर्णन करता है: एक करतार, सत्य जिसका नाम, कर्ता पुरख, निरभउ, निरवैर, अकाल मूरत, अजूनी, सैभं, गुरु की कृपा से जाना जाता है। गुरबाणी का बाक़ी सब कुछ इन्हीं शब्दों से खुलता है।", "mind1": "28वीं पउड़ी फिर योगियों की अपनी भाषा में कहती है: सब लोगों की बिरादरी को अपना पंथ बनाओ। फिर मूल बात: मन जीता तो जग जीता। सच्ची जीत भीतर की है।", "nature1": "जपुजी साहिब का अंतिम सलोक हवा को गुरु, पानी को पिता और महान धरती को माता कहता है, और दिन-रात को दाई-दाया, जिनकी गोद में सारा जगत खेलता है। अच्छे-बुरे कर्म प्रभु के सामने पढ़े जाते हैं। यह उन पर ख़त्म होता है जिन्होंने नाम सिमरा और अपनी मेहनत पूरी करके गए।", "purpose1": "पहली पउड़ी कहती है कि सफ़ाई, चुप्पी, धन से भूख मिटाना और अनगिनत चतुराइयाँ हमें सच तक नहीं ले जातीं। यह पंक्ति पउड़ी के बीच का सवाल है: सच्चे कैसे बनें, झूठ की दीवार कैसे टूटे। अगली पंक्ति जवाब देती है: हुकम में चलकर।", "guilt1": "20वीं पउड़ी धोने की बातें साथ रखती है: हाथों की मैल पानी से, पेशाब से मैले कपड़े साबुन से, और पापों से मैला मन नाम के प्यार से धुलता है। फिर कहती है कि पुण्य-पाप हमारे कामों से लिखे जाते हैं: जो बोओगे, वही काटोगे।", "joy1": "ये शब्द सुनने वाली आठवीं से ग्यारहवीं पउड़ियों को समेटते हैं। सुनने से मिलने वाली हर सूची के बाद टेक लौटती है: नानक, भक्त सदा खिले रहते हैं। यहाँ ख़ुशी सुनने वाले दिल का फल है।", "lonely1": "पाँचवीं और छठी पउड़ी सबके एक दाता की बात करती हैं: गुरु ने एक समझ दी है कि सब जीवों का एक ही दाता है, और अरदास है कि मैं उसे कभी न भूलूँ। उसे प्रसन्न किए बिना तीर्थ-स्नान का कोई अर्थ नहीं।", "loved1": "21वीं पउड़ी दिखावे के लिए किए तीर्थ, तप और दान पर सवाल उठाती है; उनसे बस थोड़ा-सा मान मिलता है। जो सुनता है, मानता है और मन में प्यार रखता है, वह भीतर के तीर्थ में नहाकर निर्मल होता है।", "fear1": "राग बिलावल में गुरु अर्जन देव जी का एक छोटा शब्द। पहला बंद नाम के रक्षा-घेरे की बात करता है। रहाउ की पंक्ति, जो केंद्र है, कहती है कि पूरे सतगुरु ने नाम की औषधि दी है। अंत में: रक्षक ने बचा लिया, सारी व्याधि मिटा दी; नानक कहते हैं, कृपा हुई और प्रभु सहायक बन गए।", "grief1": "राग रामकली में बाबा सुंदर जी की लिखी 'सद' से। यह गुरु अमरदास जी के आख़िरी दिनों का वर्णन है: वे परिवार को बुलाते हैं, कहते हैं कि प्रभु का भाणा उन्हें मीठा लगता है, कहते हैं कि मत रोना क्योंकि मित्र के आदर पर मित्र ख़ुश होता है, अपने बाद कीर्तन करने को कहते हैं, और गुरु रामदास जी को गुरु-गद्दी पर बिठाते हैं।", "forgive1": "पंजाब के सूफ़ी संत शेख़ फ़रीद के सलोक नम्रता और धीरज से भरे हैं: जो मारे उसे पलटकर मत मारो, उसके पैर चूमो और घर लौट जाओ। यह सलोक व्यावहारिक कारण देता है: भीतर रखा गुस्सा शरीर और मन को नुक़सान पहुँचाता है।", "women1": "आसा दी वार में गुरु नानक देव जी का एक सलोक। यह गिनाता है कि हर इंसान स्त्री से ही गर्भ में आता, जन्म लेता, सगाई और शादी करता है, दोस्ती और दुनिया की राह उसी से चलती है, और पूछता है कि उसे छोटा क्यों कहें। अंत में: जो भी, पुरुष हो या स्त्री, उस एक की स्तुति करता है, उसका मुख सच्चे दरबार में उजला होता है।", "work1": "सारंग की वार से। गुरु नानक देव जी पहले उन लोगों का वर्णन करते हैं जो धर्म को रोज़ी बना लेते हैं: बिना समझ के गाने वाला, भूखा मुल्ला, माँगने के लिए कान छिदवाने वाला, ख़ुद को गुरु कहलवाकर माँगने वाला; ऐसे पैरों पर सिर मत झुकाओ। फिर यह जवाब: मेहनत से कमाओ और बाँटो।"}}, "pa": {"c": {"anger1": "ਦੋ ਹਜ਼ਾਰ ਸਾਲ ਪਹਿਲਾਂ ਸਟੋਇਕ ਫ਼ਿਲਾਸਫ਼ਰ ਸੇਨੇਕਾ ਨੇ ਆਪਣੀ ਕਿਤਾਬ 'ਆਨ ਐਂਗਰ' ਵਿੱਚ ਲਿਖਿਆ ਕਿ ਗੁੱਸੇ ਦਾ ਸਭ ਤੋਂ ਵੱਡਾ ਇਲਾਜ ਹੈ ਠਹਿਰਨਾ। ਅੱਜ ਦਾ ਮਨੋਵਿਗਿਆਨ ਵੀ ਇਹੀ ਕਹਿੰਦਾ ਹੈ। 2002 ਵਿੱਚ ਮਨੋਵਿਗਿਆਨੀ ਬ੍ਰੈਡ ਬੁਸ਼ਮੈਨ ਨੇ ਪਾਇਆ ਕਿ ਗੁੱਸਾ ਕੱਢਣਾ, ਜਿਵੇਂ ਉਸ ਇਨਸਾਨ ਬਾਰੇ ਸੋਚਦਿਆਂ ਪੰਚਿੰਗ ਬੈਗ ਉੱਤੇ ਮੁੱਕੇ ਮਾਰਨਾ, ਲੋਕਾਂ ਨੂੰ ਘੱਟ ਨਹੀਂ ਸਗੋਂ ਵੱਧ ਹਮਲਾਵਰ ਬਣਾਉਂਦਾ ਹੈ। ਮਦਦ ਕਰਦਾ ਹੈ 'ਰੀਅਪ੍ਰੇਜ਼ਲ', ਖੋਜੀ ਜੇਮਸ ਗ੍ਰੌਸ ਦਾ ਸ਼ਬਦ, ਯਾਨੀ ਹਾਲਾਤ ਨੂੰ ਦੂਜੀ ਨਜ਼ਰ ਨਾਲ ਪੜ੍ਹਨਾ। ਸ਼ਾਇਦ ਮੇਰਾ ਦੋਸਤ ਬੇਪਰਵਾਹ ਨਹੀਂ, ਬੱਸ ਪਰੇਸ਼ਾਨ ਹੈ। ਜਪੁਜੀ ਸਾਹਿਬ ਇਸੇ ਕਰਕੇ ਧੀਰਜ ਨੂੰ ਸੁਨਿਆਰ ਦੇ ਹੱਥ ਵਿੱਚ ਰੱਖਦਾ ਹੈ। ਸੇਕ ਤਾਂ ਹੀ ਕੰਮ ਦਾ ਹੈ ਜਦੋਂ ਉਹ ਕਾਬੂ ਵਿੱਚ ਹੋਵੇ।", "ego1": "ਮਨੋਵਿਗਿਆਨੀ ਇਸ ਨੂੰ 'ਸੈਲਫ਼-ਸਰਵਿੰਗ ਬਾਇਸ' ਕਹਿੰਦੇ ਹਨ: ਆਪਣੀ ਕਾਮਯਾਬੀ ਦਾ ਸਿਹਰਾ ਆਪਣੇ ਸਿਰ ਲੈਣਾ ਅਤੇ ਨਾਕਾਮੀ ਦਾ ਦੋਸ਼ ਹਾਲਾਤ ਨੂੰ ਦੇਣਾ। ਇਹ ਸਾਡੀ ਛਵੀ ਬਚਾਉਂਦਾ ਹੈ, ਪਰ ਹਰ ਨਤੀਜੇ ਪਿੱਛੇ ਅਣਗਿਣਤ ਹੱਥਾਂ ਨੂੰ ਲੁਕਾ ਦਿੰਦਾ ਹੈ। ਅਸ਼ਟਾਵਕ੍ਰ ਗੀਤਾ, ਅਦਵੈਤ ਬਾਰੇ ਇੱਕ ਪੁਰਾਣਾ ਭਾਰਤੀ ਗ੍ਰੰਥ, ਇੱਕ ਤਿੱਖੀ ਤਸਵੀਰ ਦਿੰਦੀ ਹੈ: ਤੈਨੂੰ 'ਮੈਂ ਕਰਨ ਵਾਲਾ ਹਾਂ' ਨਾਮ ਦੇ ਹਉਮੈ ਦੇ ਕਾਲੇ ਸੱਪ ਨੇ ਡੰਗਿਆ ਹੈ। ਜਪੁਜੀ ਸਾਹਿਬ ਹੁਕਮ ਦੀ ਬੋਲੀ ਵਿੱਚ ਇਹੀ ਕਹਿੰਦਾ ਹੈ: ਸਭ ਕੁਝ ਇੱਕ ਵੱਡੇ ਵਿਧਾਨ ਅੰਦਰ ਹੁੰਦਾ ਹੈ। ਇਹ ਸਮਝ ਤੁਹਾਨੂੰ ਨਿਕੰਮਾ ਨਹੀਂ ਬਣਾਉਂਦੀ, ਸ਼ੁਕਰਗੁਜ਼ਾਰ ਬਣਾਉਂਦੀ ਹੈ, ਅਤੇ ਸ਼ੁਕਰਾਨਾ ਹੰਕਾਰ ਨਾਲੋਂ ਕਿਤੇ ਹਲਕਾ ਭਾਰ ਹੈ।", "comp1": "1954 ਵਿੱਚ ਮਨੋਵਿਗਿਆਨੀ ਲਿਓਨ ਫ਼ੈਸਟਿੰਗਰ ਨੇ 'ਸੋਸ਼ਲ ਕੰਪੈਰਿਜ਼ਨ ਥਿਊਰੀ' ਦਿੱਤੀ: ਅਸੀਂ ਆਪਣੇ ਆਪ ਨੂੰ ਦੂਜਿਆਂ ਨਾਲ ਮਾਪ ਕੇ ਪਰਖਦੇ ਹਾਂ। ਉੱਪਰ ਵੱਲ ਤੁਲਨਾ ਪ੍ਰੇਰਨਾ ਦੇ ਸਕਦੀ ਹੈ, ਪਰ ਲਗਾਤਾਰ ਕਰਨ ਨਾਲ, ਖ਼ਾਸ ਕਰਕੇ ਸੋਸ਼ਲ ਮੀਡੀਆ ਉੱਤੇ ਜਿੱਥੇ ਅਸੀਂ ਆਪਣੇ ਆਮ ਦਿਨਾਂ ਦੀ ਤੁਲਨਾ ਦੂਜਿਆਂ ਦੀਆਂ ਸਭ ਤੋਂ ਚੰਗੀਆਂ ਤਸਵੀਰਾਂ ਨਾਲ ਕਰਦੇ ਹਾਂ, ਇਹ ਈਰਖਾ ਅਤੇ ਉਦਾਸੀ ਪੈਦਾ ਕਰਦੀ ਹੈ। ਖੋਜੀ ਇੱਕ ਸੌਖਾ ਬਦਲਾਅ ਸੁਝਾਉਂਦੇ ਹਨ: ਆਪਣੀ ਤੁਲਨਾ ਪਿਛਲੇ ਸਾਲ ਦੇ ਆਪਣੇ ਆਪ ਨਾਲ ਕਰੋ, ਅਤੇ ਦੂਜਿਆਂ ਦੀ ਕਾਮਯਾਬੀ ਨੂੰ ਜਗਿਆਸਾ ਵਿੱਚ ਬਦਲੋ, ਮੈਂ ਇਨ੍ਹਾਂ ਤੋਂ ਕੀ ਸਿੱਖ ਸਕਦਾ ਹਾਂ? ਗੁਰਬਾਣੀ ਇਸ ਤੋਂ ਵੀ ਡੂੰਘੀ ਗੱਲ ਕਹਿੰਦੀ ਹੈ: ਨਾ ਕੋਈ ਉੱਚਾ, ਨਾ ਕੋਈ ਨੀਵਾਂ। ਜਦੋਂ ਪੌੜੀ ਹੀ ਨਾ ਰਹੇ, ਤਾਂ ਤੁਲਨਾ ਦੀ ਪਕੜ ਛੁੱਟ ਜਾਂਦੀ ਹੈ।", "accept1": "ਸਟੋਇਕ ਅਧਿਆਪਕ ਐਪਿਕਟੀਟਸ ਨੇ ਆਪਣੀ ਛੋਟੀ ਕਿਤਾਬ 'ਐਨਕਿਰਿਡੀਅਨ' ਇੱਕੋ ਵਿਚਾਰ ਨਾਲ ਸ਼ੁਰੂ ਕੀਤੀ: ਕੁਝ ਚੀਜ਼ਾਂ ਸਾਡੇ ਵੱਸ ਵਿੱਚ ਹਨ, ਕੁਝ ਨਹੀਂ। ਸਾਡੀ ਮਿਹਨਤ, ਬੋਲ ਅਤੇ ਚੋਣਾਂ ਸਾਡੀਆਂ ਹਨ; ਦੂਜਿਆਂ ਦੇ ਕੰਮ, ਮੌਸਮ ਅਤੇ ਨਤੀਜੇ ਨਹੀਂ। ਸਟੀਵਨ ਹੇਜ਼ ਦੀ ਵਿਕਸਿਤ ਕੀਤੀ ਅੱਜ ਦੀ 'ਐਕਸੈਪਟੈਂਸ ਐਂਡ ਕਮਿਟਮੈਂਟ ਥੈਰੇਪੀ' ਵੀ ਇਸੇ ਉੱਤੇ ਟਿਕੀ ਹੈ: ਜੋ ਬਦਲ ਨਹੀਂ ਸਕਦੇ ਉਸ ਨੂੰ ਸਵੀਕਾਰੋ, ਅਤੇ ਆਪਣੀਆਂ ਕਦਰਾਂ ਮੁਤਾਬਕ ਕਰਮ ਕਰੋ। ਹੁਕਮ ਵਿੱਚ ਚੱਲਣਾ ਹਾਰ ਮੰਨਣਾ ਨਹੀਂ। ਇਹ ਆਪਣੀ ਪੂਰੀ ਤਾਕਤ ਸਹੀ ਥਾਂ ਲਾਉਣਾ ਹੈ, ਅਤੇ ਬਾਕੀ ਨੂੰ ਛੱਡ ਦੇਣਾ।", "content1": "1971 ਵਿੱਚ ਮਨੋਵਿਗਿਆਨੀ ਫ਼ਿਲਿਪ ਬ੍ਰਿਕਮੈਨ ਅਤੇ ਡੋਨਲਡ ਕੈਂਪਬੈਲ ਨੇ ਉਹ ਦੱਸਿਆ ਜਿਸ ਨੂੰ ਅੱਜ 'ਹੇਡੋਨਿਕ ਟ੍ਰੈਡਮਿਲ' ਕਹਿੰਦੇ ਹਨ: ਤਨਖ਼ਾਹ ਵਧਣ, ਨਵੇਂ ਫ਼ੋਨ ਜਾਂ ਨਵੇਂ ਘਰ ਤੋਂ ਬਾਅਦ ਖ਼ੁਸ਼ੀ ਵਧਦੀ ਹੈ, ਫਿਰ ਚੁੱਪ-ਚਾਪ ਪੁਰਾਣੇ ਪੱਧਰ ਉੱਤੇ ਮੁੜ ਆਉਂਦੀ ਹੈ, ਅਤੇ ਅਸੀਂ ਅਗਲੀ ਚੀਜ਼ ਚਾਹੁਣ ਲੱਗਦੇ ਹਾਂ। ਇਹ ਚੱਕਰ ਤੋੜਦਾ ਹੈ ਧਿਆਨ ਦੇਣਾ। 2003 ਦੇ ਇੱਕ ਮਸ਼ਹੂਰ ਅਧਿਐਨ ਵਿੱਚ ਰੌਬਰਟ ਐਮਨਸ ਅਤੇ ਮਾਈਕਲ ਮੈਕਕਲੋ ਨੇ ਪਾਇਆ ਕਿ ਜੋ ਲੋਕ ਹਰ ਹਫ਼ਤੇ ਕੁਝ ਗੱਲਾਂ ਲਿਖਦੇ ਸਨ ਜਿਨ੍ਹਾਂ ਲਈ ਉਹ ਸ਼ੁਕਰਗੁਜ਼ਾਰ ਸਨ, ਉਹ ਆਪਣੀ ਜ਼ਿੰਦਗੀ ਬਾਰੇ ਵੱਧ ਸਕਾਰਾਤਮਕ ਮਹਿਸੂਸ ਕਰਦੇ ਸਨ। ਸੰਤੋਖ ਘੱਟ ਰੱਖਣਾ ਨਹੀਂ। ਇਹ ਆਖ਼ਰਕਾਰ ਉਸ ਨੂੰ ਵੇਖ ਸਕਣਾ ਹੈ ਜੋ ਤੁਹਾਡੇ ਕੋਲ ਪਹਿਲਾਂ ਹੀ ਹੈ।", "listen1": "ਮਨੋਵਿਗਿਆਨੀ ਕਾਰਲ ਰੌਜਰਜ਼ ਨੇ ਰਿਚਰਡ ਫ਼ਾਰਸਨ ਨਾਲ 1957 ਵਿੱਚ 'ਐਕਟਿਵ ਲਿਸਨਿੰਗ' ਦਾ ਵਰਣਨ ਕੀਤਾ: ਸ਼ਬਦਾਂ ਪਿੱਛੇ ਦੀ ਭਾਵਨਾ ਨੂੰ ਸੁਣਨਾ, ਅਤੇ ਬਿਨਾਂ ਪਰਖੇ ਜਾਂ ਛੇਤੀ ਹੱਲ ਸੁਝਾਏ ਉਸ ਨੂੰ ਮੋੜਨਾ। ਜਦੋਂ ਲੋਕ ਸੱਚਮੁੱਚ ਸੁਣੇ ਜਾਂਦੇ ਹਨ, ਤਾਂ ਉਨ੍ਹਾਂ ਦੀ ਆਕੜ ਢਿੱਲੀ ਪੈਂਦੀ ਹੈ ਅਤੇ ਉਹ ਸਾਫ਼ ਸੋਚ ਸਕਦੇ ਹਨ। ਸਾਡੇ ਵਿੱਚੋਂ ਬਹੁਤੇ ਜਵਾਬ ਦੇਣ ਲਈ ਸੁਣਦੇ ਹਨ, ਸਮਝਣ ਲਈ ਨਹੀਂ। ਜਪੁਜੀ ਸਾਹਿਬ ਦੀਆਂ 'ਸੁਣਿਐ' ਵਾਲੀਆਂ ਪਉੜੀਆਂ ਸੁਣਨ ਨੂੰ ਇੱਕ ਦਰਵਾਜ਼ਾ ਦੱਸਦੀਆਂ ਹਨ, ਜਿਸ ਰਾਹੀਂ ਦੁੱਖ ਅਤੇ ਪਾਪ ਦੂਰ ਹੁੰਦੇ ਹਨ। ਡੂੰਘਾਈ ਨਾਲ ਸੁਣਨਾ ਇੱਕ ਰੂਹਾਨੀ ਅਭਿਆਸ ਵੀ ਹੈ ਅਤੇ ਕਿਸੇ ਲਈ ਕੀਤੀਆਂ ਜਾ ਸਕਣ ਵਾਲੀਆਂ ਸਭ ਤੋਂ ਪਿਆਰੀਆਂ ਚੀਜ਼ਾਂ ਵਿੱਚੋਂ ਇੱਕ ਵੀ।", "habit1": "2018 ਵਿੱਚ ਛਪੀ ਕਿਤਾਬ 'ਐਟੌਮਿਕ ਹੈਬਿਟਸ' ਵਿੱਚ ਜੇਮਸ ਕਲੀਅਰ ਆਦਤਾਂ ਨੂੰ ਇੱਕ ਚੱਕਰ ਦੱਸਦੇ ਹਨ: ਸੰਕੇਤ, ਚਾਹ, ਪ੍ਰਤੀਕਿਰਿਆ ਅਤੇ ਇਨਾਮ। ਸੰਕੇਤ ਨੂੰ ਸਾਫ਼ ਅਤੇ ਆਦਤ ਨੂੰ ਸੌਖਾ ਬਣਾਓ, ਤਾਂ ਉਹ ਹੌਲੀ-ਹੌਲੀ ਤੁਹਾਡੀ ਪਛਾਣ ਬਣ ਜਾਂਦੀ ਹੈ। 2010 ਵਿੱਚ ਫ਼ਿਲਿਪਾ ਲੈਲੀ ਅਤੇ ਸਾਥੀਆਂ ਦੀ ਖੋਜ ਵਿੱਚ ਪਾਇਆ ਗਿਆ ਕਿ ਕਿਸੇ ਨਵੀਂ ਆਦਤ ਨੂੰ ਆਪਣੇ ਆਪ ਹੋਣ ਵਿੱਚ ਔਸਤਨ ਲਗਭਗ ਛਿਆਹਠ ਦਿਨ ਲੱਗੇ, ਭਾਵੇਂ ਇਹ ਇਨਸਾਨ ਅਤੇ ਆਦਤ ਮੁਤਾਬਕ ਕਾਫ਼ੀ ਵੱਖਰਾ ਸੀ। ਇਸੇ ਕਰਕੇ ਅੰਮ੍ਰਿਤ ਵੇਲਾ ਮਾਇਨੇ ਰੱਖਦਾ ਹੈ: ਰੋਜ਼ ਉਹੀ ਸ਼ਾਂਤ ਸਮਾਂ, ਜਦੋਂ ਤੱਕ ਵਿਚਾਰ ਕਰਨਾ ਕੋਸ਼ਿਸ਼ ਨਹੀਂ, ਤੁਹਾਡੀ ਪਛਾਣ ਨਾ ਬਣ ਜਾਵੇ।", "action1": "ਮਨੋਵਿਗਿਆਨੀ ਡੈਰਿਲ ਬੈਮ ਦੀ 1972 ਦੀ 'ਸੈਲਫ਼-ਪਰਸੈਪਸ਼ਨ ਥਿਊਰੀ' ਕਹਿੰਦੀ ਹੈ ਕਿ ਅਸੀਂ ਕੁਝ ਹੱਦ ਤੱਕ ਇਹ ਵੇਖ ਕੇ ਸਿੱਖਦੇ ਹਾਂ ਕਿ ਅਸੀਂ ਕੌਣ ਹਾਂ ਕਿ ਅਸੀਂ ਕੀ ਕਰਦੇ ਹਾਂ। ਕੁਝ ਵਾਰ ਇਮਾਨਦਾਰੀ ਨਾਲ ਕੰਮ ਕਰੋ, ਤਾਂ ਤੁਸੀਂ ਆਪਣੇ ਆਪ ਨੂੰ ਇਮਾਨਦਾਰ ਇਨਸਾਨ ਮੰਨਣ ਲੱਗਦੇ ਹੋ, ਅਤੇ ਅਗਲਾ ਇਮਾਨਦਾਰ ਕੰਮ ਸੌਖਾ ਹੋ ਜਾਂਦਾ ਹੈ। ਛੋਟੇ ਕੰਮ ਬੈਂਕ ਦੇ ਵਿਆਜ ਵਾਂਗ ਵਧਦੇ ਹਨ। ਇਹ ਕਰਮ ਦੇ ਵਿਚਾਰ ਦੇ ਨੇੜੇ ਹੈ: ਕੋਈ ਰਹੱਸਮਈ ਸਜ਼ਾ ਨਹੀਂ, ਸਗੋਂ ਉਨ੍ਹਾਂ ਬੀਜਾਂ ਦੀ ਕੁਦਰਤੀ ਫ਼ਸਲ ਜੋ ਅਸੀਂ ਬੀਜਦੇ ਰਹਿੰਦੇ ਹਾਂ। ਜਪੁਜੀ ਸਾਹਿਬ ਸਿੱਧਾ ਕਹਿੰਦਾ ਹੈ: ਆਪ ਹੀ ਬੀਜਦੇ ਹੋ, ਅਤੇ ਆਪ ਹੀ ਖਾਂਦੇ ਹੋ।", "hard1": "ਮਨੋਚਿਕਿਤਸਕ ਵਿਕਟਰ ਫ਼੍ਰੈਂਕਲ ਨਾਜ਼ੀ ਤਸੀਹਾ ਕੈਂਪਾਂ ਵਿੱਚੋਂ ਬਚ ਨਿਕਲੇ ਅਤੇ 1946 ਵਿੱਚ ਪਹਿਲੀ ਵਾਰ ਛਪੀ ਕਿਤਾਬ 'ਮੈਨਜ਼ ਸਰਚ ਫ਼ਾਰ ਮੀਨਿੰਗ' ਵਿੱਚ ਲਿਖਿਆ: ਜਦੋਂ ਅਸੀਂ ਕਿਸੇ ਹਾਲਾਤ ਨੂੰ ਬਦਲ ਨਹੀਂ ਸਕਦੇ, ਤਾਂ ਸਾਨੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਬਦਲਣ ਦੀ ਚੁਣੌਤੀ ਮਿਲਦੀ ਹੈ। ਦਹਾਕਿਆਂ ਬਾਅਦ ਮਨੋਵਿਗਿਆਨੀ ਰਿਚਰਡ ਟੇਡੇਸਕੀ ਅਤੇ ਲਾਰੈਂਸ ਕੈਲਹੂਨ ਨੇ 'ਪੋਸਟ-ਟ੍ਰਾਮੈਟਿਕ ਗ੍ਰੋਥ' ਦਾ ਅਧਿਐਨ ਕੀਤਾ: ਬਹੁਤ ਸਾਰੇ ਲੋਕ ਵੱਡੀ ਮੁਸ਼ਕਲ ਤੋਂ ਬਾਅਦ ਡੂੰਘੇ ਰਿਸ਼ਤੇ, ਨਵੀਆਂ ਤਰਜੀਹਾਂ ਅਤੇ ਮਜ਼ਬੂਤ ਅੰਦਰੂਨੀ ਜੀਵਨ ਦੱਸਦੇ ਹਨ। ਇਸ ਨਾਲ ਦੁੱਖ ਚੰਗਾ ਨਹੀਂ ਬਣ ਜਾਂਦਾ। ਪਰ ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਆਖ਼ਰੀ ਸ਼ਬਦ ਦੁੱਖ ਦਾ ਨਹੀਂ ਹੁੰਦਾ। ਔਖੇ ਦਿਨਾਂ ਨੂੰ ਵੀ ਦਾਤਾਰ ਦੇ ਵਿਧਾਨ ਵਿੱਚ ਵੇਖਣਾ, ਗੁਰਬਾਣੀ ਦਾ ਇਹੀ ਕਹਿਣ ਦਾ ਢੰਗ ਹੈ।", "kind1": "1979 ਵਿੱਚ ਮਨੋਵਿਗਿਆਨੀ ਹੈਨਰੀ ਤਾਜਫ਼ੈਲ ਅਤੇ ਜੌਨ ਟਰਨਰ ਨੇ 'ਸੋਸ਼ਲ ਆਈਡੈਂਟਿਟੀ ਥਿਊਰੀ' ਦਿੱਤੀ: ਅਸੀਂ ਕੁਦਰਤੀ ਤੌਰ ਉੱਤੇ ਦੁਨੀਆ ਨੂੰ 'ਅਸੀਂ' ਅਤੇ 'ਉਹ' ਵਿੱਚ ਵੰਡਦੇ ਹਾਂ ਅਤੇ ਆਪਣੇ ਸਮੂਹ ਦਾ ਪੱਖ ਲੈਂਦੇ ਹਾਂ, ਕਈ ਵਾਰ ਬਿਨਾਂ ਜਾਣੇ। ਖੋਜੀਆਂ ਨੇ ਇੱਕ ਉਪਾਅ ਪਰਖਿਆ ਹੈ, 'ਲਵਿੰਗ-ਕਾਈਂਡਨੈੱਸ ਮੈਡੀਟੇਸ਼ਨ': ਬਾਰਬਰਾ ਫ਼੍ਰੈਡਰਿਕਸਨ ਦੀ ਅਗਵਾਈ ਵਿੱਚ 2008 ਦੇ ਇੱਕ ਅਧਿਐਨ ਵਿੱਚ ਜਿਨ੍ਹਾਂ ਲੋਕਾਂ ਨੇ ਕੁਝ ਹਫ਼ਤੇ ਦੂਜਿਆਂ ਦੇ ਭਲੇ ਦੀ ਕਾਮਨਾ ਦਾ ਅਭਿਆਸ ਕੀਤਾ, ਉਨ੍ਹਾਂ ਨੇ ਵੱਧ ਸਕਾਰਾਤਮਕ ਭਾਵਨਾਵਾਂ ਅਤੇ ਦੂਜਿਆਂ ਨਾਲ ਵੱਧ ਜੁੜਾਅ ਮਹਿਸੂਸ ਕੀਤਾ। ੴ, ਇੱਕ ਕਰਤਾਰ, ਜੜ੍ਹ ਤੱਕ ਜਾਂਦਾ ਹੈ: ਜੇ ਸਭ ਵਿੱਚ ਇੱਕੋ ਜੋਤ ਹੈ, ਤਾਂ ਕੋਈ 'ਉਹ' ਨਹੀਂ। ਇਸੇ ਕਰਕੇ ਭਾਈ ਘਨੱਈਆ ਜੀ ਹਰ ਜ਼ਖ਼ਮੀ ਸਿਪਾਹੀ ਦੀ ਸੇਵਾ ਕਰ ਸਕੇ।", "mind1": "2010 ਵਿੱਚ ਹਾਰਵਰਡ ਦੇ ਖੋਜੀ ਮੈਥਿਊ ਕਿਲਿੰਗਸਵਰਥ ਅਤੇ ਡੈਨੀਅਲ ਗਿਲਬਰਟ ਨੇ ਇੱਕ ਫ਼ੋਨ ਐਪ ਰਾਹੀਂ ਹਜ਼ਾਰਾਂ ਲੋਕਾਂ ਤੋਂ ਪੁੱਛਿਆ ਕਿ ਉਹ ਕੀ ਕਰ ਰਹੇ ਹਨ ਅਤੇ ਕੀ ਸੋਚ ਰਹੇ ਹਨ। ਲਗਭਗ ਅੱਧੇ ਸਮੇਂ, ਕਰੀਬ ਸੰਤਾਲੀ ਪ੍ਰਤੀਸ਼ਤ, ਉਨ੍ਹਾਂ ਦਾ ਮਨ ਭਟਕ ਰਿਹਾ ਸੀ, ਅਤੇ ਭਟਕਦੇ ਸਮੇਂ ਉਹ ਆਮ ਤੌਰ ਉੱਤੇ ਘੱਟ ਖ਼ੁਸ਼ ਸਨ। ਉਨ੍ਹਾਂ ਦੇ ਖੋਜ-ਪੱਤਰ ਦਾ ਨਾਮ ਸੀ: ਭਟਕਦਾ ਮਨ, ਦੁਖੀ ਮਨ। ਭਗਵਦ ਗੀਤਾ ਵਿੱਚ ਅਰਜੁਨ ਪਹਿਲਾਂ ਹੀ ਸ਼ਿਕਾਇਤ ਕਰਦੇ ਹਨ ਕਿ ਮਨ ਚੰਚਲ ਹੈ, ਹਵਾ ਵਾਂਗ ਫੜਨਾ ਔਖਾ, ਅਤੇ ਜਵਾਬ ਮਿਲਦਾ ਹੈ: ਅਭਿਆਸ ਅਤੇ ਵੈਰਾਗ। ਜਪੁਜੀ ਸਾਹਿਬ ਕਹਿੰਦਾ ਹੈ: ਮਨਿ ਜੀਤੈ ਜਗੁ ਜੀਤੁ।", "nature1": "ਜੀਵ-ਵਿਗਿਆਨੀ ਐਡਵਰਡ ਓ. ਵਿਲਸਨ ਨੇ 1984 ਵਿੱਚ 'ਬਾਇਓਫ਼ੀਲੀਆ' ਸ਼ਬਦ ਨੂੰ ਮਸ਼ਹੂਰ ਕੀਤਾ: ਇਹ ਵਿਚਾਰ ਕਿ ਇਨਸਾਨਾਂ ਵਿੱਚ ਜਿਊਂਦੀਆਂ ਚੀਜ਼ਾਂ ਲਈ ਜਮਾਂਦਰੂ ਪਿਆਰ ਹੁੰਦਾ ਹੈ। ਮਨੋਵਿਗਿਆਨੀ ਰੇਚਲ ਅਤੇ ਸਟੀਫ਼ਨ ਕੈਪਲਨ ਨੇ 1989 ਵਿੱਚ 'ਅਟੈਂਸ਼ਨ ਰੀਸਟੋਰੇਸ਼ਨ ਥਿਊਰੀ' ਦਿੱਤੀ, ਜਿਸ ਮੁਤਾਬਕ ਕੁਦਰਤ ਵਿੱਚ ਬਿਤਾਇਆ ਸਮਾਂ ਉਸ ਧਿਆਨ ਨੂੰ ਹੌਲੀ-ਹੌਲੀ ਮੋੜਦਾ ਹੈ ਜਿਸ ਨੂੰ ਸ਼ਹਿਰ ਅਤੇ ਸਕ੍ਰੀਨਾਂ ਥਕਾ ਦਿੰਦੀਆਂ ਹਨ। ਉਦੋਂ ਤੋਂ ਕਈ ਅਧਿਐਨ ਹਰਿਆਲੀ ਨੂੰ ਘੱਟ ਤਣਾਅ ਨਾਲ ਜੋੜਦੇ ਹਨ। ਗੁਰਬਾਣੀ ਪਵਣ ਨੂੰ ਗੁਰੂ, ਪਾਣੀ ਨੂੰ ਪਿਤਾ ਅਤੇ ਧਰਤੀ ਨੂੰ ਮਾਤਾ ਕਹਿੰਦੀ ਹੈ। ਵਿਗਿਆਨ ਦੱਸਦਾ ਹੈ ਕਿ ਕੁਦਰਤ ਸਾਨੂੰ ਕਿਉਂ ਠੀਕ ਕਰਦੀ ਹੈ; ਗੁਰਬਾਣੀ ਯਾਦ ਕਰਾਉਂਦੀ ਹੈ ਕਿ ਅਸੀਂ ਉਸੇ ਦੇ ਹਾਂ, ਅਤੇ ਸਾਨੂੰ ਪਰਿਵਾਰ ਵਾਂਗ ਉਸ ਦੀ ਸੰਭਾਲ ਕਰਨੀ ਹੈ।", "purpose1": "2016 ਵਿੱਚ ਨਿਊਰੋ-ਵਿਗਿਆਨੀ ਨੀਲ ਗੈਰੇਟ ਅਤੇ ਸਾਥੀਆਂ ਨੇ 'ਨੇਚਰ ਨਿਊਰੋਸਾਇੰਸ' ਵਿੱਚ ਇੱਕ ਅਧਿਐਨ ਛਾਪਿਆ ਜਿਸ ਵਿੱਚ ਦਿਸਿਆ ਕਿ ਆਪਣੇ ਫ਼ਾਇਦੇ ਵਾਲੇ ਛੋਟੇ ਝੂਠ ਵਧਦੇ ਜਾਂਦੇ ਹਨ: ਜਿਵੇਂ-ਜਿਵੇਂ ਲੋਕ ਝੂਠ ਬੋਲਦੇ ਰਹੇ, ਉਨ੍ਹਾਂ ਦੀ ਬੇਈਮਾਨੀ ਉੱਤੇ ਦਿਮਾਗ਼ ਦੀ ਭਾਵਨਾਤਮਕ ਪ੍ਰਤੀਕਿਰਿਆ ਕਮਜ਼ੋਰ ਹੁੰਦੀ ਗਈ, ਅਤੇ ਝੂਠ ਵੱਡੇ ਹੁੰਦੇ ਗਏ। ਦਹਾਕਿਆਂ ਪਹਿਲਾਂ ਲਿਓਨ ਫ਼ੈਸਟਿੰਗਰ ਨੇ 'ਕੌਗਨਿਟਿਵ ਡਿਸੋਨੈਂਸ' ਦੱਸਿਆ ਸੀ: ਜਦੋਂ ਸਾਡੇ ਕੰਮ ਅਤੇ ਕਦਰਾਂ ਟਕਰਾਉਂਦੀਆਂ ਹਨ, ਤਾਂ ਬੇਚੈਨੀ ਹੁੰਦੀ ਹੈ, ਅਤੇ ਅਕਸਰ ਅਸੀਂ ਕੰਮਾਂ ਮੁਤਾਬਕ ਕਦਰਾਂ ਮੋੜ ਲੈਂਦੇ ਹਾਂ, ਉਲਟਾ ਨਹੀਂ। ਇਹੀ ਉਹ ਕੂੜ ਦੀ ਪਾਲ ਹੈ ਜਿਸ ਦੀ ਗੱਲ ਜਪੁਜੀ ਸਾਹਿਬ ਕਰਦਾ ਹੈ। ਉਹ ਇੱਕ-ਇੱਕ ਇੱਟ ਨਾਲ ਬਣਦੀ ਹੈ, ਅਤੇ ਉਸੇ ਤਰ੍ਹਾਂ ਢਾਹੀ ਜਾਂਦੀ ਹੈ।", "guilt1": "ਮਨੋਵਿਗਿਆਨੀ ਜੂਨ ਟੈਂਗਨੀ ਨੇ ਦਹਾਕਿਆਂ ਤੱਕ ਪਛਤਾਵੇ ਅਤੇ ਸ਼ਰਮ ਦੇ ਫ਼ਰਕ ਦਾ ਅਧਿਐਨ ਕੀਤਾ। ਪਛਤਾਵਾ ਕਹਿੰਦਾ ਹੈ: ਮੈਂ ਮਾੜਾ ਕੰਮ ਕੀਤਾ; ਸ਼ਰਮ ਕਹਿੰਦੀ ਹੈ: ਮੈਂ ਮਾੜਾ ਹਾਂ। ਉਨ੍ਹਾਂ ਦੀ ਖੋਜ ਮੁਤਾਬਕ ਪਛਤਾਵਾ ਅਕਸਰ ਸੁਧਾਰ, ਮਾਫ਼ੀ ਅਤੇ ਬਦਲਾਅ ਵੱਲ ਲੈ ਜਾਂਦਾ ਹੈ, ਜਦਕਿ ਸ਼ਰਮ ਲੁਕਣ, ਦੋਸ਼ ਦੇਣ ਜਾਂ ਦੂਰ ਹੋ ਜਾਣ ਵੱਲ। ਕ੍ਰਿਸਟਿਨ ਨੈੱਫ਼ ਦਾ 'ਸੈਲਫ਼-ਕੰਪੈਸ਼ਨ' ਉੱਤੇ ਕੰਮ ਜੋੜਦਾ ਹੈ ਕਿ ਗ਼ਲਤੀ ਤੋਂ ਬਾਅਦ ਆਪਣੇ ਨਾਲ ਨਰਮੀ ਵਰਤਣ ਨਾਲ ਜ਼ਿੰਮੇਵਾਰੀ ਲੈਣ ਦੀ ਸੰਭਾਵਨਾ ਘੱਟ ਨਹੀਂ, ਸਗੋਂ ਵੱਧ ਹੁੰਦੀ ਹੈ। ਗੁਰਬਾਣੀ ਦੀ ਮੈਲੀ ਮੱਤ ਨੂੰ ਧੋਣ ਵਾਲੀ ਤਸਵੀਰ ਇਸੇ ਤਰ੍ਹਾਂ ਉਮੀਦ ਭਰੀ ਹੈ: ਦਾਗ਼ ਅਸਲ ਹੈ, ਪਰ ਉਹ ਤੁਹਾਡੀ ਪਛਾਣ ਨਹੀਂ।", "joy1": "ਮਨੋਵਿਗਿਆਨੀਆਂ ਕੋਲ ਚੰਗੀ ਖ਼ਬਰ ਸਾਂਝੀ ਕਰਨ ਲਈ ਇੱਕ ਸ਼ਬਦ ਹੈ: 'ਕੈਪੀਟਲਾਈਜ਼ੇਸ਼ਨ'। 2004 ਵਿੱਚ ਸ਼ੈਲੀ ਗੇਬਲ ਅਤੇ ਸਾਥੀਆਂ ਨੇ ਪਾਇਆ ਕਿ ਜਦੋਂ ਲੋਕ ਕਿਸੇ ਨੂੰ ਚੰਗੀ ਘਟਨਾ ਬਾਰੇ ਦੱਸਦੇ ਹਨ ਅਤੇ ਉਹ ਸੱਚੇ ਉਤਸ਼ਾਹ ਨਾਲ ਜਵਾਬ ਦਿੰਦਾ ਹੈ, ਤਾਂ ਖ਼ੁਸ਼ੀ ਵਧਦੀ ਹੈ ਅਤੇ ਰਿਸ਼ਤਾ ਮਜ਼ਬੂਤ ਹੁੰਦਾ ਹੈ। ਫ਼੍ਰੈੱਡ ਬ੍ਰਾਇੰਟ ਦੀ 'ਸੇਵਰਿੰਗ' ਉੱਤੇ ਖੋਜ ਦਿਖਾਉਂਦੀ ਹੈ ਕਿ ਚੰਗੇ ਪਲਾਂ ਨੂੰ ਰੁਕ ਕੇ ਮਹਿਸੂਸ ਕਰਨ ਅਤੇ ਖਿੱਚਣ ਨਾਲ ਉਹ ਦੇਰ ਤੱਕ ਟਿਕਦੇ ਹਨ। ਗੁਰਬਾਣੀ ਦਾ ਸ਼ਬਦ 'ਵਿਗਾਸੁ', ਯਾਨੀ ਖਿੜਨਾ, ਇਸੇ ਤਰ੍ਹਾਂ ਖੁੱਲ੍ਹੇ ਰਹਿਣ ਵਾਲੇ ਦਿਲ ਨੂੰ ਦੱਸਦਾ ਹੈ। ਖ਼ੁਸ਼ੀ ਲੁਕਾਉਣ ਵਾਲੀ ਖ਼ੁਦਗਰਜ਼ ਚੀਜ਼ ਨਹੀਂ; ਵੰਡਣ ਨਾਲ ਉਹ ਵਧਦੀ ਹੈ।", "lonely1": "1995 ਵਿੱਚ ਰੌਏ ਬੌਮਾਈਸਟਰ ਅਤੇ ਮਾਰਕ ਲੀਅਰੀ ਨੇ ਦਲੀਲ ਦਿੱਤੀ ਕਿ ਜੁੜਾਅ ਦੀ ਚਾਹ ਇਨਸਾਨ ਦੀ ਬੁਨਿਆਦੀ ਲੋੜ ਹੈ, ਜਿਵੇਂ ਖਾਣਾ ਅਤੇ ਛੱਤ। 2010 ਵਿੱਚ ਜੂਲੀਅਨ ਹੋਲਟ-ਲੁੰਸਟੈਡ ਅਤੇ ਸਾਥੀਆਂ ਨੇ 148 ਅਧਿਐਨਾਂ ਦੀ ਸਮੀਖਿਆ ਕੀਤੀ ਅਤੇ ਪਾਇਆ ਕਿ ਮਜ਼ਬੂਤ ਸਮਾਜਿਕ ਰਿਸ਼ਤਿਆਂ ਵਾਲੇ ਲੋਕਾਂ ਦੀ ਅਧਿਐਨ ਦੇ ਸਮੇਂ ਦੌਰਾਨ ਜਿਊਂਦੇ ਰਹਿਣ ਦੀ ਸੰਭਾਵਨਾ ਲਗਭਗ ਪੰਜਾਹ ਪ੍ਰਤੀਸ਼ਤ ਵੱਧ ਸੀ। ਇਕੱਲਾਪਣ ਕਮਜ਼ੋਰੀ ਨਹੀਂ; ਇਹ ਭੁੱਖ ਵਾਂਗ ਇੱਕ ਸੰਕੇਤ ਹੈ ਕਿ ਸਾਨੂੰ ਜੁੜਾਅ ਚਾਹੀਦਾ ਹੈ। ਗੁਰਬਾਣੀ ਦੋਵੇਂ ਗੱਲਾਂ ਕਹਿੰਦੀ ਹੈ: ਸਭ ਜੀਆਂ ਦਾ ਇੱਕੋ ਦਾਤਾ ਹੈ, ਇਸ ਲਈ ਕੋਈ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਨਹੀਂ, ਅਤੇ ਇਹੀ ਸੱਚ ਸਾਨੂੰ ਇੱਕ-ਦੂਜੇ ਵੱਲ ਹੱਥ ਵਧਾਉਣ ਲਈ ਕਹਿੰਦਾ ਹੈ।", "loved1": "ਕਾਰਲ ਰੌਜਰਜ਼ ਨੇ 'ਅਨਕੰਡੀਸ਼ਨਲ ਪੌਜ਼ਿਟਿਵ ਰਿਗਾਰਡ' ਦੱਸਿਆ: ਕਿਸੇ ਇਨਸਾਨ ਨੂੰ ਬਿਨਾਂ ਸ਼ਰਤ ਕੀਮਤੀ ਮੰਨਣਾ, ਭਾਵੇਂ ਉਸ ਦੇ ਹਰ ਕੰਮ ਨਾਲ ਸਹਿਮਤ ਨਾ ਹੋਈਏ। ਉਨ੍ਹਾਂ ਲਈ ਇਹੀ ਉਹ ਮਿੱਟੀ ਸੀ ਜਿਸ ਵਿੱਚ ਇਨਸਾਨ ਵਧਦਾ ਹੈ। ਜੈਨੀਫ਼ਰ ਕ੍ਰੌਕਰ ਦੀ 'ਕੰਟਿੰਜੈਂਸੀਜ਼ ਆਫ਼ ਸੈਲਫ਼-ਵਰਥ' ਉੱਤੇ ਖੋਜ ਉਲਟਾ ਦਿਖਾਉਂਦੀ ਹੈ: ਜਦੋਂ ਸਾਡੀ ਕੀਮਤ ਅੰਕਾਂ, ਸ਼ਕਲ ਜਾਂ ਤਾਰੀਫ਼ ਉੱਤੇ ਟਿਕੀ ਹੋਵੇ, ਤਾਂ ਹਰ ਕਾਮਯਾਬੀ-ਨਾਕਾਮੀ ਨਾਲ ਮਨ ਝੂਲਦਾ ਹੈ। ਗੁਰਬਾਣੀ ਉਸ ਕੀਮਤ ਵੱਲ ਇਸ਼ਾਰਾ ਕਰਦੀ ਹੈ ਜੋ ਕਾਰਗੁਜ਼ਾਰੀ ਉੱਤੇ ਨਹੀਂ ਟਿਕੀ। ਭਾਈ ਲਹਿਣਾ ਜੀ ਦੀ ਚਿੱਕੜ ਵਾਲੀ ਪੰਡ ਪਿਆਰ ਭਰੀਆਂ ਅੱਖਾਂ ਨਾਲ ਵੇਖੀ ਗਈ, ਅਤੇ ਚਿੱਕੜ ਕੇਸਰ ਵਰਗਾ ਲੱਗਿਆ।", "fear1": "ਮਨੋਵਿਗਿਆਨੀ ਚਿੰਤਾ ਨੂੰ ਇੰਝ ਦੱਸਦੇ ਹਨ: ਮਨ ਪਹਿਲਾਂ ਤੋਂ ਖ਼ਤਰੇ ਦਾ ਅਭਿਆਸ ਕਰਦਾ ਹੈ, ਤਾਂ ਜੋ ਤਿਆਰ ਮਹਿਸੂਸ ਕਰੇ। 2020 ਦੇ ਇੱਕ ਅਧਿਐਨ ਵਿੱਚ ਲੂਕਸ ਲਾਫ਼੍ਰੈਨੀਅਰ ਅਤੇ ਮਿਸ਼ੈਲ ਨਿਊਮੈਨ ਨੇ ਚਿੰਤਾ ਨਾਲ ਜੂਝਦੇ ਲੋਕਾਂ ਨੂੰ ਆਪਣੀਆਂ ਚਿੰਤਾਵਾਂ ਲਿਖਣ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਜਾਂਚਣ ਲਈ ਕਿਹਾ ਕਿ ਅਸਲ ਵਿੱਚ ਕੀ ਹੋਇਆ: ਲਗਭਗ ਇਕਾਨਵੇਂ ਪ੍ਰਤੀਸ਼ਤ ਖ਼ਦਸ਼ੇ ਸੱਚ ਨਹੀਂ ਹੋਏ। ਜੁੜਾਅ ਉੱਤੇ ਖੋਜ ਕਰਨ ਵਾਲੇ ਜੌਨ ਬੌਲਬੀ ਅਤੇ ਮੈਰੀ ਐਂਸਵਰਥ ਨੇ ਦਿਖਾਇਆ ਕਿ ਬੱਚੇ ਤਦ ਹੌਸਲੇ ਨਾਲ ਦੁਨੀਆ ਖੋਜਦੇ ਹਨ ਜਦੋਂ ਉਨ੍ਹਾਂ ਕੋਲ ਮੁੜਨ ਲਈ ਇੱਕ ਸੁਰੱਖਿਅਤ ਟਿਕਾਣਾ ਹੋਵੇ। ਗੁਰਬਾਣੀ ਮਨ ਨੂੰ ਅਜਿਹਾ ਹੀ ਟਿਕਾਣਾ ਦਿੰਦੀ ਹੈ: ਉਸ ਇੱਕ ਦੀ ਸ਼ਰਨ, ਸਾਡੇ ਚੁਫੇਰੇ ਇੱਕ ਘੇਰਾ, ਜਿਸ ਦੇ ਅੰਦਰ ਡਰ ਦਾ ਸੇਕ ਘਟ ਜਾਂਦਾ ਹੈ।", "grief1": "ਵੀਹਵੀਂ ਸਦੀ ਦੇ ਬਹੁਤੇ ਸਮੇਂ ਸੋਗ ਨੂੰ 'ਛੱਡ ਦੇਣਾ ਅਤੇ ਅੱਗੇ ਵਧ ਜਾਣਾ' ਦੱਸਿਆ ਗਿਆ। 1996 ਵਿੱਚ ਡੈਨਿਸ ਕਲਾਸ, ਫ਼ਿਲਿਸ ਸਿਲਵਰਮੈਨ ਅਤੇ ਸਟੀਵਨ ਨਿਕਮੈਨ ਨੇ ਇਸ ਦੀ ਥਾਂ 'ਕੰਟੀਨਿਊਇੰਗ ਬੌਂਡਜ਼' ਦੱਸੇ: ਸੋਗ ਵਿੱਚ ਸਿਹਤਮੰਦ ਲੋਕ ਅਕਸਰ ਗੁਜ਼ਰੇ ਇਨਸਾਨ ਨਾਲ ਇੱਕ ਬਦਲਿਆ ਹੋਇਆ, ਅੰਦਰੂਨੀ ਰਿਸ਼ਤਾ ਬਣਾਈ ਰੱਖਦੇ ਹਨ, ਯਾਦਾਂ, ਕਦਰਾਂ ਅਤੇ ਰਸਮਾਂ ਰਾਹੀਂ। 1999 ਵਿੱਚ ਮਾਰਗਰੇਟ ਸਟ੍ਰੋਬੇ ਅਤੇ ਹੈਂਕ ਸ਼ੁਟ ਨੇ 'ਡਿਊਲ ਪ੍ਰੋਸੈੱਸ ਮਾਡਲ' ਦਿੱਤਾ: ਸੋਗ ਕਰਨ ਵਾਲੇ ਕੁਦਰਤੀ ਤੌਰ ਉੱਤੇ ਕਦੇ ਘਾਟੇ ਦਾ ਸਾਹਮਣਾ ਕਰਦੇ ਹਨ ਅਤੇ ਕਦੇ ਰੋਜ਼ ਦੇ ਕੰਮਾਂ ਵਿੱਚ ਲੱਗ ਕੇ ਉਸ ਤੋਂ ਆਰਾਮ ਲੈਂਦੇ ਹਨ। ਦੋਵੇਂ ਸਿਹਤਮੰਦ ਹਨ। ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਪਰਿਵਾਰ ਨੂੰ ਸਭ ਤੋਂ ਡੂੰਘਾ 'ਕੰਟੀਨਿਊਇੰਗ ਬੌਂਡ' ਦਿੱਤਾ: ਕੀਰਤਨ, ਅਤੇ ਅੱਗੇ ਤੁਰਦੀ ਗੁਰੂ-ਜੋਤ।", "forgive1": "ਮਨੋਵਿਗਿਆਨੀ ਐਵਰੇਟ ਵਰਥਿੰਗਟਨ, ਜਿਨ੍ਹਾਂ ਨੇ ਦਹਾਕਿਆਂ ਤੱਕ ਮਾਫ਼ੀ ਉੱਤੇ ਖੋਜ ਕੀਤੀ, ਇਸ ਨੂੰ ਨਾਰਾਜ਼ਗੀ ਦੀ ਥਾਂ ਸਦਭਾਵਨਾ ਲਿਆਉਣਾ ਦੱਸਦੇ ਹਨ, ਹੌਲੀ-ਹੌਲੀ ਅਤੇ ਅਕਸਰ ਕਦਮ-ਦਰ-ਕਦਮ। ਰੌਬਰਟ ਐਨਰਾਈਟ ਦਾ ਕੰਮ ਦੱਸਦਾ ਹੈ ਕਿ ਮਾਫ਼ੀ ਕੀ ਨਹੀਂ ਹੈ: ਗ਼ਲਤੀ ਨੂੰ ਸਹੀ ਠਹਿਰਾਉਣਾ, ਉਸ ਨੂੰ ਭੁੱਲ ਜਾਣਾ, ਜਾਂ ਜ਼ਰੂਰੀ ਤੌਰ ਉੱਤੇ ਮੁੜ ਰਿਸ਼ਤਾ ਜੋੜਨਾ। ਅਧਿਐਨ ਲੰਮੇ ਗਿਲੇ-ਸ਼ਿਕਵੇ ਅਤੇ ਵਾਰ-ਵਾਰ ਸੋਚਣ ਨੂੰ ਵੱਧ ਤਣਾਅ ਨਾਲ, ਅਤੇ ਮਾਫ਼ੀ ਨੂੰ ਬਿਹਤਰ ਸਿਹਤ ਨਾਲ ਜੋੜਦੇ ਹਨ। ਫ਼ਰੀਦ ਜੀ ਨੇ ਸਦੀਆਂ ਪਹਿਲਾਂ ਇਹੀ ਕਿਹਾ: ਜਦੋਂ ਗੁੱਸੇ ਨੂੰ ਮਨ ਵਿੱਚ ਟਿਕਣ ਨਹੀਂ ਦਿੱਤਾ ਜਾਂਦਾ, ਤਾਂ ਸਰੀਰ ਅਤੇ ਮਨ ਤੰਦਰੁਸਤ ਰਹਿੰਦੇ ਹਨ। ਮਾਫ਼ੀ ਕਮਜ਼ੋਰੀ ਨਹੀਂ; ਇਹ ਆਪਣਾ ਦਿਲ ਵਾਪਸ ਲੈਣਾ ਹੈ।", "women1": "1996 ਵਿੱਚ ਮਨੋਵਿਗਿਆਨੀ ਪੀਟਰ ਗਲਿਕ ਅਤੇ ਸੂਜ਼ਨ ਫ਼ਿਸਕ ਨੇ 'ਐਂਬਿਵੇਲੈਂਟ ਸੈਕਸਿਜ਼ਮ' ਦੱਸਿਆ: ਖੁੱਲ੍ਹੇ ਦੁਸ਼ਮਣੀ ਭਰੇ ਰਵੱਈਏ ਦੇ ਨਾਲ-ਨਾਲ 'ਬੈਨੇਵੋਲੈਂਟ ਸੈਕਸਿਜ਼ਮ' ਵੀ ਹੁੰਦਾ ਹੈ, ਜੋ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ ਪਰ ਹੱਦਾਂ ਬੰਨ੍ਹਦਾ ਹੈ, ਜਿਵੇਂ 'ਉਹ ਇਸ ਕੰਮ ਲਈ ਬਹੁਤ ਨਾਜ਼ੁਕ ਹੈ', ਜਾਂ 'ਵਿਆਹ ਤਾਂ ਹੋਣਾ ਹੈ, ਪੜ੍ਹ ਕੇ ਕੀ ਕਰੇਗੀ'। ਫ਼ਿਲਾਸਫ਼ਰ ਇਮੈਨੁਅਲ ਕਾਂਟ ਨੇ ਕਿਹਾ ਕਿ ਹਰ ਇਨਸਾਨ ਨੂੰ ਆਪਣੇ ਆਪ ਵਿੱਚ ਇੱਕ ਮੰਜ਼ਿਲ ਮੰਨਣਾ ਚਾਹੀਦਾ ਹੈ, ਕਦੇ ਸਿਰਫ਼ ਸਾਧਨ ਨਹੀਂ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦਾ ਸਲੋਕ ਸਿੱਧਾ ਜੜ੍ਹ ਤੱਕ ਜਾਂਦਾ ਹੈ: ਅਸੀਂ ਸਾਰੇ ਔਰਤ ਤੋਂ ਹੀ ਇਸ ਦੁਨੀਆ ਵਿੱਚ ਆਏ। ਬਰਾਬਰ ਸਤਿਕਾਰ ਕੋਈ ਅੱਜ ਦੀ ਸਿਆਸਤ ਨਹੀਂ; ਇਹ ਸਿੱਧਾ ਸੱਚ ਹੈ।", "work1": "ਐਲਿਜ਼ਾਬੈਥ ਡਨ, ਲਾਰਾ ਅਕਨਿਨ ਅਤੇ ਮਾਈਕਲ ਨੌਰਟਨ ਦੀ ਖੋਜ, ਜੋ 2008 ਵਿੱਚ 'ਸਾਇੰਸ' ਵਿੱਚ ਛਪੀ, ਵਿੱਚ ਪਾਇਆ ਗਿਆ ਕਿ ਜਿਨ੍ਹਾਂ ਲੋਕਾਂ ਨੇ ਦੂਜਿਆਂ ਉੱਤੇ ਪੈਸਾ ਖ਼ਰਚ ਕੀਤਾ, ਉਹ ਓਨਾ ਹੀ ਆਪਣੇ ਉੱਤੇ ਖ਼ਰਚਣ ਵਾਲਿਆਂ ਨਾਲੋਂ ਵੱਧ ਖ਼ੁਸ਼ ਸਨ। ਐਡਵਰਡ ਡੇਸੀ ਅਤੇ ਰਿਚਰਡ ਰਾਇਨ ਦੀ 'ਸੈਲਫ਼-ਡਿਟਰਮੀਨੇਸ਼ਨ ਥਿਊਰੀ' ਦਿਖਾਉਂਦੀ ਹੈ ਕਿ ਲੋਕ ਤਦ ਵਧਦੇ-ਫੁੱਲਦੇ ਹਨ ਜਦੋਂ ਉਹ ਕਾਬਲ, ਆਜ਼ਾਦ ਅਤੇ ਜੁੜੇ ਹੋਏ ਮਹਿਸੂਸ ਕਰਦੇ ਹਨ, ਅਤੇ ਚੰਗੀ ਤਰ੍ਹਾਂ ਕੀਤੀ ਇਮਾਨਦਾਰ ਕਿਰਤ ਤਿੰਨਾਂ ਨੂੰ ਪਾਲਦੀ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦਾ ਤਿੰਨ ਹਿੱਸਿਆਂ ਵਾਲਾ ਰਾਹ, ਕਿਰਤ, ਵੰਡ ਛਕਣਾ ਅਤੇ ਨਾਮ ਜਪਣਾ, ਇੱਕ ਪੂਰੀ ਅਤੇ ਖ਼ੁਸ਼ ਜ਼ਿੰਦਗੀ ਦੱਸਦਾ ਹੈ, ਮਨੋਵਿਗਿਆਨ ਦੇ ਮਾਪਣ ਤੋਂ ਬਹੁਤ ਪਹਿਲਾਂ।"}, "x": {"anger1": "ਪੂਰੀ 38ਵੀਂ ਪਉੜੀ ਇੱਕ ਟਕਸਾਲ ਦਾ ਵਰਣਨ ਕਰਦੀ ਹੈ ਜਿੱਥੇ ਸੱਚਾ ਸ਼ਬਦ ਘੜਿਆ ਜਾਂਦਾ ਹੈ: ਜਤ ਯਾਨੀ ਸੰਜਮ ਕਾਰਖ਼ਾਨਾ ਹੈ, ਧੀਰਜ ਸੁਨਿਆਰ, ਮੱਤ ਅਹਿਰਨ, ਗਿਆਨ ਹਥੌੜਾ, ਪ੍ਰਭੂ ਦਾ ਭਉ ਧੌਂਕਣੀ, ਤਪ ਅੱਗ, ਅਤੇ ਭਾਉ ਯਾਨੀ ਪਿਆਰ ਉਹ ਕੁਠਾਲੀ ਜਿਸ ਵਿੱਚ ਅੰਮ੍ਰਿਤ ਢਾਲਿਆ ਜਾਂਦਾ ਹੈ। ਧੀਰਜ ਇਨਸਾਨ ਨੂੰ ਘੜਨ ਦੀ ਪੂਰੀ ਕਲਾ ਦਾ ਇੱਕ ਹਿੱਸਾ ਹੈ।", "ego1": "ਦੂਜੀ ਪਉੜੀ ਕਹਿੰਦੀ ਹੈ ਕਿ ਸਭ ਕੁਝ ਹੁਕਮ ਨਾਲ ਬਣਦਾ ਹੈ: ਆਕਾਰ, ਜੀਵ, ਵਡਿਆਈ, ਉੱਚ-ਨੀਚ, ਦੁੱਖ-ਸੁੱਖ। ਕੋਈ ਬਖ਼ਸ਼ਿਆ ਜਾਂਦਾ ਹੈ, ਕੋਈ ਭਟਕਦਾ ਹੈ। ਸਭ ਹੁਕਮ ਦੇ ਅੰਦਰ ਹਨ, ਬਾਹਰ ਕੋਈ ਨਹੀਂ। ਇਹ ਤੁਕ ਅੰਤ ਵਿੱਚ ਸਿੱਟੇ ਵਜੋਂ ਆਉਂਦੀ ਹੈ: ਜੋ ਹੁਕਮ ਨੂੰ ਸਮਝ ਲਵੇ, ਉਹ 'ਮੈਂ, ਮੈਂ' ਕਹਿਣਾ ਛੱਡ ਦਿੰਦਾ ਹੈ।", "comp1": "33ਵੀਂ ਪਉੜੀ ਗਿਣਾਉਂਦੀ ਹੈ ਕਿ ਸਾਡੇ ਵੱਸ ਵਿੱਚ ਕੀ ਨਹੀਂ: ਬੋਲਣਾ ਜਾਂ ਚੁੱਪ ਰਹਿਣਾ, ਮੰਗਣਾ ਜਾਂ ਦੇਣਾ, ਜਿਊਣਾ ਜਾਂ ਮਰਨਾ, ਰਾਜ ਜਾਂ ਮਾਲ ਪਾਉਣਾ। ਤਾਕਤ ਸਿਰਫ਼ ਕਰਤਾਰ ਦੇ ਹੱਥ ਵਿੱਚ ਹੈ। ਆਖ਼ਰੀ ਤੁਕ ਇਸੇ ਤੋਂ ਨਿਕਲਦੀ ਹੈ: ਜਦੋਂ ਤਾਕਤ ਕਿਸੇ ਕੋਲ ਨਹੀਂ, ਤਾਂ ਨਾ ਕੋਈ ਉੱਚਾ ਹੈ, ਨਾ ਨੀਵਾਂ।", "accept1": "ਪਹਿਲੀ ਪਉੜੀ ਦੱਸਦੀ ਹੈ ਕਿ ਨ੍ਹਾਉਣ, ਚੁੱਪ ਰਹਿਣ ਜਾਂ ਮਾਲ ਜੋੜਨ ਨਾਲ ਸਚਿਆਰ ਨਹੀਂ ਬਣਦੇ, ਅਤੇ ਚਤੁਰਾਈ ਵੀ ਕੰਮ ਨਹੀਂ ਆਉਂਦੀ। ਫਿਰ ਪੁੱਛਦੀ ਹੈ: ਸਚਿਆਰ ਕਿਵੇਂ ਬਣੀਏ, ਕੂੜ ਦੀ ਪਾਲ ਕਿਵੇਂ ਟੁੱਟੇ? ਜਵਾਬ ਇਹੀ ਤੁਕ ਹੈ: ਹੁਕਮ ਦੀ ਰਜ਼ਾ ਵਿੱਚ ਚੱਲੋ, ਜੋ ਸਾਡੇ ਅੰਦਰ ਲਿਖੀ ਹੈ।", "content1": "28ਵੀਂ ਪਉੜੀ ਉਸ ਸਮੇਂ ਦੇ ਜੋਗੀਆਂ ਨਾਲ ਉਨ੍ਹਾਂ ਦੇ ਹੀ ਚਿੰਨ੍ਹਾਂ ਵਿੱਚ ਗੱਲ ਕਰਦੀ ਹੈ। ਮੁੰਦਰਾਂ, ਝੋਲੀ ਅਤੇ ਬਿਭੂਤ ਦੀ ਥਾਂ ਇਹ ਅੰਦਰਲੇ ਗੁਣ ਦਿੰਦੀ ਹੈ: ਸੰਤੋਖ, ਸਰਮ ਯਾਨੀ ਮਿਹਨਤ, ਅਤੇ ਧਿਆਨ। ਇਹ ਬਾਹਰੀ ਧਾਰਮਿਕ ਚਿੰਨ੍ਹਾਂ ਨੂੰ ਅੰਦਰ ਦੇ ਗੁਣਾਂ ਵਿੱਚ ਬਦਲ ਦਿੰਦੀ ਹੈ।", "listen1": "ਅੱਠਵੀਂ ਤੋਂ ਗਿਆਰ੍ਹਵੀਂ ਪਉੜੀ ਵਾਰ-ਵਾਰ 'ਸੁਣਿਐ', ਯਾਨੀ ਸੁਣਨ ਨਾਲ, ਦੁਹਰਾਉਂਦੀਆਂ ਹਨ: ਸੁਣਨ ਨਾਲ ਧਰਤੀ, ਆਕਾਸ਼ ਅਤੇ ਸਿੱਧਾਂ-ਪੀਰਾਂ ਦੀ ਸਮਝ ਆਉਂਦੀ ਹੈ, ਮੌਤ ਵੀ ਛੂਹ ਨਹੀਂ ਸਕਦੀ, ਅਤੇ ਹਰ ਪਉੜੀ ਇੱਕੋ ਟੇਕ ਉੱਤੇ ਮੁੱਕਦੀ ਹੈ: ਨਾਨਕ, ਭਗਤ ਸਦਾ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ; ਸੁਣਨ ਨਾਲ ਦੁੱਖ ਅਤੇ ਪਾਪ ਮਿਟ ਜਾਂਦੇ ਹਨ।", "habit1": "ਚੌਥੀ ਪਉੜੀ ਕਹਿੰਦੀ ਹੈ ਕਿ ਪ੍ਰਭੂ ਸੱਚਾ ਹੈ, ਉਸ ਦਾ ਨਾਮ ਸੱਚਾ, ਅਤੇ ਉਸ ਨੂੰ ਅਪਾਰ ਪਿਆਰ ਨਾਲ ਗਾਇਆ ਜਾਂਦਾ ਹੈ। ਲੋਕ ਮੰਗਦੇ ਹਨ ਅਤੇ ਦਾਤਾਰ ਦਿੰਦਾ ਹੈ। ਅਸੀਂ ਬਦਲੇ ਵਿੱਚ ਕੀ ਦੇਈਏ? ਅੰਮ੍ਰਿਤ ਵੇਲੇ, ਸਵੇਰ ਤੋਂ ਪਹਿਲਾਂ ਦੇ ਸ਼ਾਂਤ ਪਹਿਰ ਵਿੱਚ, ਸੱਚੇ ਨਾਮ ਅਤੇ ਉਸ ਦੀ ਵਡਿਆਈ ਦੀ ਵਿਚਾਰ ਕਰੋ। ਮਿਹਰ ਨਾਲ ਦਰਵਾਜ਼ਾ ਖੁੱਲ੍ਹਦਾ ਹੈ।", "action1": "20ਵੀਂ ਪਉੜੀ ਰੋਜ਼ ਦੀਆਂ ਤਸਵੀਰਾਂ ਦਿੰਦੀ ਹੈ: ਗੰਦੇ ਹੱਥ ਪਾਣੀ ਨਾਲ ਧੁਲਦੇ ਹਨ, ਮੈਲੇ ਕੱਪੜੇ ਸਾਬਣ ਨਾਲ, ਅਤੇ ਪਾਪਾਂ ਨਾਲ ਮੈਲੀ ਮੱਤ ਨਾਮ ਦੇ ਰੰਗ ਨਾਲ। ਪੁੰਨ ਅਤੇ ਪਾਪ ਸਿਰਫ਼ ਕਹਿਣ ਦੀਆਂ ਗੱਲਾਂ ਨਹੀਂ; ਜੋ ਅਸੀਂ ਕਰਦੇ ਹਾਂ ਉਹ ਸਾਡੇ ਨਾਲ ਲਿਖਿਆ ਜਾਂਦਾ ਹੈ। ਆਪੇ ਬੀਜਦੇ ਹੋ, ਆਪੇ ਖਾਂਦੇ ਹੋ।", "hard1": "25ਵੀਂ ਪਉੜੀ ਦਾਤਾਰ ਦੀਆਂ ਅਣਗਿਣਤ ਦਾਤਾਂ ਦੀ ਸਿਫ਼ਤ ਕਰਦੀ ਹੈ: ਕਿੰਨੇ ਪਾਉਂਦੇ ਹਨ, ਕਿੰਨੇ ਗੁਆਉਂਦੇ ਹਨ, ਕਿੰਨੇ ਭੋਗ ਕੇ ਮੁੱਕਰ ਜਾਂਦੇ ਹਨ। ਫਿਰ ਕਹਿੰਦੀ ਹੈ ਕਿ ਕਿੰਨੇ ਦੁੱਖ, ਭੁੱਖ ਅਤੇ ਸਦਾ ਦੀ ਮਾਰ ਸਹਿੰਦੇ ਹਨ; ਇਹ ਵੀ ਤੇਰੀਆਂ ਹੀ ਦਾਤਾਂ ਹਨ, ਹੇ ਦਾਤਾਰ। ਬੰਧਨ ਤੋਂ ਛੁਟਕਾਰਾ ਭਾਣੇ ਨਾਲ ਹੁੰਦਾ ਹੈ। ਇਹ ਤੁਕ ਦਰਦ ਨੂੰ ਵੀ ਉਸੇ ਵਿਧਾਨ ਵਿੱਚ ਰੱਖਦੀ ਹੈ ਜਿਸ ਵਿੱਚ ਬਰਕਤ ਹੈ।", "kind1": "ਮੂਲ ਮੰਤਰ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਦੀ ਸ਼ੁਰੂਆਤ ਹੈ ਅਤੇ ਉਸ ਇੱਕ ਦਾ ਵਰਣਨ ਕਰਦਾ ਹੈ: ਇੱਕ ਕਰਤਾਰ, ਸੱਚ ਜਿਸ ਦਾ ਨਾਮ, ਕਰਤਾ ਪੁਰਖ, ਨਿਰਭਉ, ਨਿਰਵੈਰ, ਅਕਾਲ ਮੂਰਤਿ, ਅਜੂਨੀ, ਸੈਭੰ, ਗੁਰ ਪ੍ਰਸਾਦਿ ਨਾਲ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ। ਗੁਰਬਾਣੀ ਦਾ ਬਾਕੀ ਸਭ ਕੁਝ ਇਨ੍ਹਾਂ ਸ਼ਬਦਾਂ ਤੋਂ ਖੁੱਲ੍ਹਦਾ ਹੈ।", "mind1": "28ਵੀਂ ਪਉੜੀ ਫਿਰ ਜੋਗੀਆਂ ਦੀ ਆਪਣੀ ਬੋਲੀ ਵਿੱਚ ਕਹਿੰਦੀ ਹੈ: ਸਾਰੇ ਲੋਕਾਂ ਦੀ ਬਰਾਦਰੀ ਨੂੰ ਆਪਣਾ ਪੰਥ ਬਣਾਓ। ਫਿਰ ਮੂਲ ਗੱਲ: ਮਨ ਜਿੱਤਿਆ ਤਾਂ ਜਗ ਜਿੱਤਿਆ। ਸੱਚੀ ਜਿੱਤ ਅੰਦਰ ਦੀ ਹੈ।", "nature1": "ਜਪੁਜੀ ਸਾਹਿਬ ਦਾ ਅੰਤਲਾ ਸਲੋਕ ਪਵਣ ਨੂੰ ਗੁਰੂ, ਪਾਣੀ ਨੂੰ ਪਿਤਾ ਅਤੇ ਵੱਡੀ ਧਰਤੀ ਨੂੰ ਮਾਤਾ ਕਹਿੰਦਾ ਹੈ, ਅਤੇ ਦਿਨ-ਰਾਤ ਨੂੰ ਦਾਈ-ਦਾਇਆ, ਜਿਨ੍ਹਾਂ ਦੀ ਗੋਦ ਵਿੱਚ ਸਾਰਾ ਜਗਤ ਖੇਡਦਾ ਹੈ। ਚੰਗੇ-ਮਾੜੇ ਕਰਮ ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿੱਚ ਪੜ੍ਹੇ ਜਾਂਦੇ ਹਨ। ਇਹ ਉਨ੍ਹਾਂ ਉੱਤੇ ਮੁੱਕਦਾ ਹੈ ਜਿਨ੍ਹਾਂ ਨੇ ਨਾਮ ਧਿਆਇਆ ਅਤੇ ਆਪਣੀ ਘਾਲ ਪੂਰੀ ਕਰਕੇ ਗਏ।", "purpose1": "ਪਹਿਲੀ ਪਉੜੀ ਕਹਿੰਦੀ ਹੈ ਕਿ ਸੁੱਚ, ਚੁੱਪ, ਮਾਲ ਨਾਲ ਭੁੱਖ ਮਿਟਾਉਣਾ ਅਤੇ ਅਣਗਿਣਤ ਚਤੁਰਾਈਆਂ ਸਾਨੂੰ ਸੱਚ ਤੱਕ ਨਹੀਂ ਲੈ ਜਾਂਦੀਆਂ। ਇਹ ਤੁਕ ਪਉੜੀ ਦੇ ਵਿਚਕਾਰਲਾ ਸਵਾਲ ਹੈ: ਸਚਿਆਰ ਕਿਵੇਂ ਬਣੀਏ, ਕੂੜ ਦੀ ਪਾਲ ਕਿਵੇਂ ਟੁੱਟੇ। ਅਗਲੀ ਤੁਕ ਜਵਾਬ ਦਿੰਦੀ ਹੈ: ਹੁਕਮ ਵਿੱਚ ਚੱਲ ਕੇ।", "guilt1": "20ਵੀਂ ਪਉੜੀ ਧੋਣ ਦੀਆਂ ਗੱਲਾਂ ਨਾਲ-ਨਾਲ ਰੱਖਦੀ ਹੈ: ਹੱਥਾਂ ਦੀ ਮੈਲ ਪਾਣੀ ਨਾਲ, ਮੂਤ ਨਾਲ ਪਲੀਤ ਕੱਪੜਾ ਸਾਬਣ ਨਾਲ, ਅਤੇ ਪਾਪਾਂ ਨਾਲ ਭਰੀ ਮੱਤ ਨਾਮ ਦੇ ਰੰਗ ਨਾਲ ਧੁਲਦੀ ਹੈ। ਫਿਰ ਕਹਿੰਦੀ ਹੈ ਕਿ ਪੁੰਨ-ਪਾਪ ਸਾਡੇ ਕੰਮਾਂ ਨਾਲ ਲਿਖੇ ਜਾਂਦੇ ਹਨ: ਜੋ ਬੀਜੋਗੇ, ਉਹੀ ਵੱਢੋਗੇ।", "joy1": "ਇਹ ਸ਼ਬਦ ਸੁਣਨ ਵਾਲੀਆਂ ਅੱਠਵੀਂ ਤੋਂ ਗਿਆਰ੍ਹਵੀਂ ਪਉੜੀਆਂ ਨੂੰ ਸਮੇਟਦੇ ਹਨ। ਸੁਣਨ ਨਾਲ ਮਿਲਣ ਵਾਲੀ ਹਰ ਸੂਚੀ ਤੋਂ ਬਾਅਦ ਟੇਕ ਮੁੜਦੀ ਹੈ: ਨਾਨਕ, ਭਗਤ ਸਦਾ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ। ਇੱਥੇ ਖ਼ੁਸ਼ੀ ਸੁਣਨ ਵਾਲੇ ਦਿਲ ਦਾ ਫਲ ਹੈ।", "lonely1": "ਪੰਜਵੀਂ ਅਤੇ ਛੇਵੀਂ ਪਉੜੀ ਸਭ ਦੇ ਇੱਕ ਦਾਤੇ ਦੀ ਗੱਲ ਕਰਦੀਆਂ ਹਨ: ਗੁਰੂ ਨੇ ਇੱਕ ਸਮਝ ਦਿੱਤੀ ਹੈ ਕਿ ਸਭ ਜੀਆਂ ਦਾ ਇੱਕੋ ਦਾਤਾ ਹੈ, ਅਤੇ ਅਰਦਾਸ ਹੈ ਕਿ ਮੈਂ ਉਸ ਨੂੰ ਕਦੇ ਨਾ ਭੁੱਲਾਂ। ਉਸ ਨੂੰ ਭਾਉਣ ਤੋਂ ਬਿਨਾਂ ਤੀਰਥ-ਇਸ਼ਨਾਨ ਦਾ ਕੋਈ ਅਰਥ ਨਹੀਂ।", "loved1": "21ਵੀਂ ਪਉੜੀ ਦਿਖਾਵੇ ਲਈ ਕੀਤੇ ਤੀਰਥ, ਤਪ ਅਤੇ ਦਾਨ ਉੱਤੇ ਸਵਾਲ ਉਠਾਉਂਦੀ ਹੈ; ਉਨ੍ਹਾਂ ਨਾਲ ਬੱਸ ਤਿਲ ਜਿੰਨਾ ਮਾਣ ਮਿਲਦਾ ਹੈ। ਜੋ ਸੁਣਦਾ ਹੈ, ਮੰਨਦਾ ਹੈ ਅਤੇ ਮਨ ਵਿੱਚ ਪਿਆਰ ਰੱਖਦਾ ਹੈ, ਉਹ ਅੰਦਰਲੇ ਤੀਰਥ ਵਿੱਚ ਨ੍ਹਾ ਕੇ ਨਿਰਮਲ ਹੁੰਦਾ ਹੈ।", "fear1": "ਰਾਗ ਬਿਲਾਵਲ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦਾ ਇੱਕ ਛੋਟਾ ਸ਼ਬਦ। ਪਹਿਲਾ ਬੰਦ ਨਾਮ ਦੇ ਰੱਖਿਆ-ਘੇਰੇ ਦੀ ਗੱਲ ਕਰਦਾ ਹੈ। ਰਹਾਉ ਦੀ ਤੁਕ, ਜੋ ਕੇਂਦਰ ਹੈ, ਕਹਿੰਦੀ ਹੈ ਕਿ ਪੂਰੇ ਸਤਿਗੁਰੂ ਨੇ ਨਾਮ ਦੀ ਦਵਾਈ ਦਿੱਤੀ ਹੈ। ਅੰਤ ਵਿੱਚ: ਰੱਖਣ ਵਾਲੇ ਨੇ ਰੱਖ ਲਿਆ, ਸਾਰੀ ਬਿਆਧੀ ਮਿਟਾ ਦਿੱਤੀ; ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਮਿਹਰ ਹੋਈ ਅਤੇ ਪ੍ਰਭੂ ਸਹਾਈ ਹੋ ਗਏ।", "grief1": "ਰਾਗ ਰਾਮਕਲੀ ਵਿੱਚ ਬਾਬਾ ਸੁੰਦਰ ਜੀ ਦੀ ਲਿਖੀ 'ਸਦ' ਵਿੱਚੋਂ। ਇਹ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੇ ਆਖ਼ਰੀ ਦਿਨਾਂ ਦਾ ਵਰਣਨ ਹੈ: ਉਹ ਪਰਿਵਾਰ ਨੂੰ ਸੱਦਦੇ ਹਨ, ਕਹਿੰਦੇ ਹਨ ਕਿ ਪ੍ਰਭੂ ਦਾ ਭਾਣਾ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿੱਠਾ ਲੱਗਦਾ ਹੈ, ਕਹਿੰਦੇ ਹਨ ਕਿ ਨਾ ਰੋਣਾ ਕਿਉਂਕਿ ਮਿੱਤਰ ਦੇ ਆਦਰ ਉੱਤੇ ਮਿੱਤਰ ਖ਼ੁਸ਼ ਹੁੰਦਾ ਹੈ, ਆਪਣੇ ਪਿੱਛੋਂ ਕੀਰਤਨ ਕਰਨ ਲਈ ਕਹਿੰਦੇ ਹਨ, ਅਤੇ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਨੂੰ ਗੁਰਗੱਦੀ ਉੱਤੇ ਬਿਠਾਉਂਦੇ ਹਨ।", "forgive1": "ਪੰਜਾਬ ਦੇ ਸੂਫ਼ੀ ਸੰਤ ਸ਼ੇਖ਼ ਫ਼ਰੀਦ ਦੇ ਸਲੋਕ ਨਿਮਰਤਾ ਅਤੇ ਧੀਰਜ ਨਾਲ ਭਰੇ ਹਨ: ਜੋ ਮਾਰੇ ਉਸ ਨੂੰ ਮੋੜ ਕੇ ਨਾ ਮਾਰ, ਉਸ ਦੇ ਪੈਰ ਚੁੰਮ ਅਤੇ ਘਰ ਮੁੜ ਜਾ। ਇਹ ਸਲੋਕ ਵਿਹਾਰਕ ਕਾਰਨ ਦਿੰਦਾ ਹੈ: ਅੰਦਰ ਰੱਖਿਆ ਗੁੱਸਾ ਸਰੀਰ ਅਤੇ ਮਨ ਨੂੰ ਨੁਕਸਾਨ ਪਹੁੰਚਾਉਂਦਾ ਹੈ।", "women1": "ਆਸਾ ਦੀ ਵਾਰ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦਾ ਇੱਕ ਸਲੋਕ। ਇਹ ਗਿਣਾਉਂਦਾ ਹੈ ਕਿ ਹਰ ਇਨਸਾਨ ਔਰਤ ਤੋਂ ਹੀ ਕੁੱਖ ਵਿੱਚ ਆਉਂਦਾ, ਜੰਮਦਾ, ਮੰਗਣੀ ਅਤੇ ਵਿਆਹ ਕਰਦਾ ਹੈ, ਦੋਸਤੀ ਅਤੇ ਦੁਨੀਆ ਦੀ ਰਾਹ ਉਸੇ ਨਾਲ ਚੱਲਦੀ ਹੈ, ਅਤੇ ਪੁੱਛਦਾ ਹੈ ਕਿ ਉਸ ਨੂੰ ਮੰਦਾ ਕਿਉਂ ਕਹੀਏ। ਅੰਤ ਵਿੱਚ: ਜੋ ਵੀ, ਮਰਦ ਹੋਵੇ ਜਾਂ ਔਰਤ, ਉਸ ਇੱਕ ਦੀ ਸਿਫ਼ਤ ਕਰਦਾ ਹੈ, ਉਸ ਦਾ ਮੁੱਖ ਸੱਚੀ ਦਰਗਾਹ ਵਿੱਚ ਉੱਜਲਾ ਹੁੰਦਾ ਹੈ।", "work1": "ਸਾਰੰਗ ਕੀ ਵਾਰ ਵਿੱਚੋਂ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਪਹਿਲਾਂ ਉਨ੍ਹਾਂ ਲੋਕਾਂ ਦਾ ਵਰਣਨ ਕਰਦੇ ਹਨ ਜੋ ਧਰਮ ਨੂੰ ਰੋਜ਼ੀ ਬਣਾ ਲੈਂਦੇ ਹਨ: ਬਿਨਾਂ ਸਮਝ ਦੇ ਗਾਉਣ ਵਾਲਾ, ਭੁੱਖਾ ਮੁੱਲਾਂ, ਮੰਗਣ ਲਈ ਕੰਨ ਪੜਵਾਉਣ ਵਾਲਾ, ਆਪਣੇ ਆਪ ਨੂੰ ਗੁਰੂ ਅਖਵਾ ਕੇ ਮੰਗਣ ਵਾਲਾ; ਅਜਿਹੇ ਪੈਰੀਂ ਨਾ ਲੱਗੋ। ਫਿਰ ਇਹ ਜਵਾਬ: ਮਿਹਨਤ ਨਾਲ ਕਮਾਓ ਅਤੇ ਵੰਡੋ।"}}};
var cur=null, mode='story', idx=0, listening=false, player=null, timer=null, clip=-1, anim=false;
var QI_STORY=7, NSTORY=9;
function NC(){ return mode==='sc'?3:NSTORY; }
function QI(){ return mode==='sc'?1:QI_STORY; }
function clipFor(i){ return mode==='sc'?[0,1,4][i]:[0,1,2,3,10,4,5,6,9][i]; }
function isFb(n){ return mode==='sc'?(n===2||n===3):(n===7||n===8); }
function answered(){ return (mode==='sc'?S.ranswers:S.answers)[cur.id]!==undefined; }
var AB=/github\.io$|^localhost$|^127\./.test(location.hostname)?'':'https://iiswaranii.github.io/jach/';
function apath(n){ return mode==='sc'?'audio/sc/'+cur.id+'-'+n+'.mp3':(S.lang==='en'?'':AB)+'audio/'+S.lang+'/'+cur.id+'-'+n+'.mp3'; }
function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
function advanceLater(at){ clearTimer(); timer=setTimeout(function(){ if(listening && cur && idx===at && !anim) go(1,true); },PAUSE_MS); }
function ensurePlayer(){
  if(player) return;
  player=new Audio(); player.preload='auto';
  player.addEventListener('timeupdate',function(){ if(clip===clipFor(idx) && player.duration) setFill(player.currentTime/player.duration); });
  player.addEventListener('ended',function(){
    if(clip===clipFor(idx)) setFill(1);
    if(!listening || !cur) return;
    if(clip===clipFor(idx)){
      if(idx<NC()-1 && !(idx===QI() && !answered())) advanceLater(idx);
      else if(idx===NC()-1){ listening=false; setPlay(); }
    } else if(isFb(clip)){ if(idx===QI()) advanceLater(idx); }
  });
  player.addEventListener('error',function(){
    if(!player.getAttribute('src') || !listening || !cur) return;
    if(clip!==clipFor(idx)){ if(isFb(clip) && idx===QI()) advanceLater(idx); return; }
    var words=(($('stage').querySelector('.pnl.c')||{}).innerText||'').split(/\s+/).length, ms=Math.max(4000,words*330), t0=Date.now(), at=idx;
    clearTimer();
    (function tick(){ if(!listening || !cur || idx!==at) return; var f=(Date.now()-t0)/ms; setFill(f);
      if(f>=1){ if(idx<NC()-1 && !(idx===QI() && !answered())) advanceLater(at); else if(idx===NC()-1){ listening=false; setPlay(); } }
      else timer=setTimeout(tick,100); })();
  });
}
function setFill(f){ var s=$('segs').children[idx]; if(s) s.firstChild.style.width=Math.max(0,Math.min(1,f))*100+'%'; }
function playClip(n){
  ensurePlayer(); clearTimer(); clip=n;
  player.muted=false; player.setAttribute('src',apath(n));
  player.preservesPitch=true; player.defaultPlaybackRate=S.rate; player.playbackRate=S.rate;
  var pr=player.play(); if(pr && pr.catch) pr.catch(function(){ listening=false; setPlay(); });
}
function stopAudio(){ clearTimer(); if(player){ try{ player.pause(); }catch(e){} } }
function setPlay(){ var b=$('rplay'); b.innerHTML=listening?ICON.pause:ICON.play; b.setAttribute('aria-label',listening?'Pause':'Play'); }

/* colour theme per story, Deepstash-like */
function hx(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function mix(a,b,t){ var A=hx(a),B=hx(b); return 'rgb('+A.map(function(v,i){ return Math.round(v*(1-t)+B[i]*t); }).join(',')+')'; }
function themeFor(col){
  var r=$('reader').style;
  if(isDark()){ r.setProperty('--rbg',mix(col,'#120A0E',.84)); r.setProperty('--rcard',mix(col,'#120A0E',.72)); r.setProperty('--rink','#F8F2EE'); r.setProperty('--racc',mix(col,'#FFFFFF',.08)); r.setProperty('--rdim',mix(col,'#120A0E',.62)); r.setProperty('--rbtn',mix(col,'#120A0E',.7)); }
  else { r.setProperty('--rbg',mix(col,'#FFFFFF',.8)); r.setProperty('--rcard',mix(col,'#FFFFFF',.55)); r.setProperty('--rink','#24161B'); r.setProperty('--racc',mix(col,'#1A0E12',.5)); r.setProperty('--rdim',mix(col,'#FFFFFF',.2)); r.setProperty('--rbtn',mix(col,'#FFFFFF',.45)); }
}
function hl(s){ return esc(s).replace(/\[\[(.+?)\]\]/g,'<em class="hl">$1</em>'); }
function artBlock(id,i){ return '<div class="pimg grain">'+scene(id,i)+'</div>'; }
function cardHTML(i){
  var u=U(), h='';
  if(mode==='sc'){
    var s=cur, a=S.ranswers[s.id], m=meta(s.g), gm=TXT[S.lang][s.g].m, lbl=[u.situation,u.yourturn,u.reflection][i];
    h+='<span class="eyebrow">'+lbl+'</span>';
    if(S.lang!=='en' && i!==1) h+='<p class="note">'+u.enOnly+'</p>';
    if(i===0) h+='<p class="ptext">'+esc(s.s)+'</p>'+artBlock(s.id,0);
    else if(i===1){
      h+='<p class="ptext q">'+esc(s.q)+'</p><div class="opts">';
      s.o.forEach(function(o,k){ var cls='opt'; if(a!==undefined){ if(k===s.ans) cls+=' right'; else if(k===a) cls+=' picked'; } h+='<button class="'+cls+'" data-ans="'+k+'"><b>'+'ABC'[k]+'</b>'+esc(o)+'</button>'; });
      h+='</div>';
      if(a!==undefined){ var ok=a===s.ans; h+='<div class="fb">'+faceSvg(ok?'happy':'hopeful',ok?'#A3E7B2':'#FFD764',ok?0:2)+'<p>'+esc(ok?s.y:s.n)+'</p></div>'; }
    } else {
      h+='<div class="lcard"><div class="lhead"><span class="lic grain">'+scene(s.id,0)+'</span><b>'+u.gurbani+'</b></div><div class="lline"></div><p class="gur" lang="pa">'+esc(m.g).replace(/\n/g,'<br>')+'</p><p class="ref">'+esc(ref(m))+'</p><p class="ptext sm">'+esc(gm)+'</p></div>';
      h+='<p class="eyebrow" style="margin-top:6px">'+u.sakhi+'</p><p class="ptext">'+esc(s.k)+'</p>';
      h+='<p class="eyebrow" style="margin-top:6px">'+u.think+'</p><p class="ptext">'+esc(s.x)+'</p>';
      h+='<button class="btn cta" id="nextm">'+u.nextm+'</button>';
    }
    return h;
  }
  var d=T(cur.id);
  h+='<span class="eyebrow">'+u.labels[Math.min(i,7)]+'</span>';
  var dp=DEEP[S.lang]||DEEP.en;
  if(i===0) h+='<p class="ptext big">'+esc(d.s)+'</p>'+artBlock(cur.id,0);
  else if(i===1) h+='<p class="gur" lang="pa">'+esc(cur.g).replace(/\n/g,'<br>')+'</p><p class="ref">'+esc(ref(cur))+'</p><div class="mean"><div class="k">'+u.meaning+'</div><p class="ptext">'+esc(d.m)+'</p></div>'+(dp.x[cur.id]?'<div class="mean ctx"><div class="k">'+u.ctx+'</div><p class="ptext sm">'+esc(dp.x[cur.id])+'</p></div>':'')+artBlock(cur.id,1);
  else if(i===2) h+='<p class="ptext">'+esc(d.k)+'</p>'+artBlock(cur.id,2);
  else if(i===3) h+='<p class="ptext">'+esc(d.a)+'</p>'+artBlock(cur.id,3);
  else if(i===4) h+='<p class="deepk">'+u.deep+'</p><p class="ptext">'+esc(dp.c[cur.id]||'')+'</p>'+artBlock(cur.id,6);
  else if(i===5) h+='<p class="ptext">'+esc(d.b)+'</p>'+artBlock(cur.id,4);
  else if(i===6){ h+='<p class="ptext big">'+esc(d.t)+'</p>'+artBlock(cur.id,5); if(HELP[cur.id]) h+='<button class="btn ghost" id="helpbtn">'+u.help+'</button>'; }
  else if(i===7){
    var a2=S.answers[cur.id];
    h+='<p class="ptext q">'+esc(d.q)+'</p><div class="opts">';
    d.o.forEach(function(o,k){ var cls='opt'; if(a2!==undefined){ if(k===cur.ans) cls+=' right'; else if(k===a2) cls+=' picked'; } h+='<button class="'+cls+'" data-ans="'+k+'"><b>'+'ABC'[k]+'</b>'+esc(o)+'</button>'; });
    h+='</div>';
    if(a2!==undefined){ var ok2=a2===cur.ans; h+='<div class="fb">'+faceSvg(ok2?'happy':'hopeful',ok2?'#A3E7B2':'#FFD764',ok2?0:2)+'<p>'+esc(ok2?d.y:d.n)+'</p></div>'; }
  } else {
    h='<div class="lwrap"><div class="lcard big"><div class="lhead"><span class="lic grain">'+scene(cur.id,0)+'</span><b>'+esc(tname(cur.id))+'</b></div><div class="lline"></div><p class="ltext">'+hl(LESSONS[S.lang][cur.id])+'</p><div class="lfoot"><button class="lbtn" id="lshare" aria-label="Share">'+ICON.share+'</button><button class="lbtn" id="rsave" aria-label="Save">'+ICON.mark(isSaved(cur.id))+'</button></div></div></div><button class="btn cta" id="lcont">'+u.cont2+'</button>';
  }
  return h;
}
function panelPos(){ var st=$('stage'); return st.clientHeight-PEEK; }
var PEEK=92;
function buildPanels(){
  var st=$('stage'), n=NC(), P=panelPos(), h='';
  if(idx>0) h+='<div class="pnl p" style="transform:translate3d(0,'+(-P)+'px,0)">'+cardHTML(idx-1)+'</div>';
  h+='<div class="pnl c" style="transform:translate3d(0,0,0)">'+cardHTML(idx)+'</div>';
  if(idx<n-1) h+='<div class="pnl n'+(idx===QI() && !answered()?' locked':'')+'" style="transform:translate3d(0,'+P+'px,0)">'+cardHTML(idx+1)+'</div>';
  st.innerHTML=h;
}
function drawCard(autoplay){
  var n=NC(), segs='';
  for(var i=0;i<n;i++) segs+='<span class="'+(i<idx?'done':(i===idx?'on':''))+'"><i style="width:'+(i<idx?100:0)+'%"></i></span>';
  $('segs').innerHTML=segs;
  $('rhead').textContent=mode==='sc'?cur.ti:T(cur.id).ti;
  $('rspeed').textContent=S.rate+'×';
  themeFor(mode==='sc'?CATS[cur.cat].col:SC[cur.id].col);
  buildPanels();
  $('rprev').disabled=idx===0; $('rnext').disabled=idx===n-1;
  if(mode==='story' && idx<QI_STORY) S.resume={id:cur.id,i:idx};
  persist(); setPlay();
  var hint=$('swipehint'); if(hint){ $('swipetxt').textContent=U().swipe; hint.classList.toggle('on', !S.swiped && idx===0); }
  if(autoplay && listening){ clearTimer(); stopAudio(); var at=idx; timer=setTimeout(function(){ if(listening && cur && idx===at) playClip(clipFor(idx)); },300); }
}
function nudge(){ var c=$('stage').querySelector('.pnl.c'); if(!c||!c.animate) return; c.animate([{transform:'translate3d(0,0,0)'},{transform:'translate3d(0,-26px,0)'},{transform:'translate3d(0,0,0)'}],{duration:380,easing:'cubic-bezier(.3,.7,.3,1)'}); var o=c.querySelector('.opts'); if(o&&o.animate) o.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300}); }
function go(dir,auto){
  if(anim) return;
  var n=NC(), to=idx+dir;
  if(to<0){ nudgeBack(); return; }
  if(to>n-1) return;
  if(dir>0 && idx===QI() && !answered()){ nudge(); return; }
  if(!auto){ S.swiped=1; }
  var st=$('stage'), P=panelPos(), c=st.querySelector('.pnl.c'), o=st.querySelector(dir>0?'.pnl.n':'.pnl.p');
  anim=true; stopAudio();
  [c,o].forEach(function(el){ if(el){ el.style.transition='transform .42s cubic-bezier(.22,.8,.24,1),opacity .42s'; } });
  requestAnimationFrame(function(){
    c.style.transform='translate3d(0,'+(dir>0?-P:P)+'px,0)';
    if(o){ o.style.transform='translate3d(0,0,0)'; o.style.opacity=1; } c.style.opacity=.38;
  });
  setTimeout(function(){ anim=false; idx=to; listening=true; drawCard(true); },430);
}
function nudgeBack(){ var c=$('stage').querySelector('.pnl.c'); if(c&&c.animate) c.animate([{transform:'translate3d(0,0,0)'},{transform:'translate3d(0,24px,0)'},{transform:'translate3d(0,0,0)'}],{duration:360,easing:'ease-out'}); }
function snapBack(){ var st=$('stage'), P=panelPos(); st.querySelectorAll('.pnl').forEach(function(el){ el.style.transition='transform .3s cubic-bezier(.22,.8,.24,1)'; var b=el.classList.contains('c')?0:(el.classList.contains('n')?P:-P); el.style.transform='translate3d(0,'+b+'px,0)'; }); }
/* touch: drag the stack like reels; inner scroll wins until the card reaches its edge */
(function(){
  var st=null, y0=0, x0=0, t0=0, drag=false, decided=false, startTop=0, startBot=0;
  function sEl(){ return $('stage'); }
  document.addEventListener('touchstart',function(e){ var s=sEl(); if(!s || !s.contains(e.target) || anim) return; var c=s.querySelector('.pnl.c'); st=c; y0=e.touches[0].clientY; x0=e.touches[0].clientX; t0=performance.now(); drag=false; decided=false; startTop=c.scrollTop<=1; startBot=c.scrollTop+c.clientHeight>=c.scrollHeight-2; },{passive:true});
  document.addEventListener('touchmove',function(e){ if(!st) return; var dy=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    if(!decided){ if(Math.abs(dy)<8 && Math.abs(dx)<8) return; decided=true; drag=Math.abs(dy)>Math.abs(dx) && ((dy<0 && startBot) || (dy>0 && startTop)); }
    if(!drag) return; e.preventDefault();
    var P=panelPos(), s=sEl(), n=s.querySelector('.pnl.n'), p=s.querySelector('.pnl.p'), d=dy;
    if((dy<0 && (!n || n.classList.contains('locked'))) || (dy>0 && !p)) d=dy*.25;
    s.querySelectorAll('.pnl').forEach(function(el){ el.style.transition='none'; });
    st.style.transform='translate3d(0,'+d+'px,0)';
    if(n) n.style.transform='translate3d(0,'+(P+Math.min(0,d))+'px,0)';
    if(p) p.style.transform='translate3d(0,'+(-P+Math.max(0,d))+'px,0)';
  },{passive:false});
  document.addEventListener('touchend',function(e){ if(!st) return; var was=drag; st=null; if(!was) return;
    var dy=e.changedTouches[0].clientY-y0, v=dy/Math.max(1,performance.now()-t0);
    if(dy<-70 || v<-.5) go(1); else if(dy>70 || v>.5) go(-1); else snapBack();
    setTimeout(function(){ if(!anim) snapBack(); },460);
  },{passive:true});
  var wl=0; document.addEventListener('wheel',function(e){ var s=sEl(); if(!s||!cur||!s.contains(e.target)) return; var c=s.querySelector('.pnl.c'); var now=Date.now(); if(now-wl<650) return;
    if(e.deltaY>25 && c.scrollTop+c.clientHeight>=c.scrollHeight-2){ wl=now; go(1); } else if(e.deltaY<-25 && c.scrollTop<=1){ wl=now; go(-1); } },{passive:true});
})();
function openAny(at){
  idx=at||0; listening=true; $('reader').classList.add('on'); ensurePlayer();
  try{ player.muted=true; player.setAttribute('src',apath(clipFor(idx))); var pr=player.play(); if(pr && pr.catch) pr.catch(function(){}); }catch(e){}
  drawCard(false);
  clearTimer(); var c0=cur, i0=idx;
  timer=setTimeout(function(){ try{ player.pause(); }catch(e){} if(listening && cur===c0 && idx===i0) playClip(clipFor(idx)); },1000);
}
function openJ(id,at){ stopAudio(); mode='story'; cur=meta(id); openAny(at); }
function openS(id){ stopAudio(); mode='sc'; cur=scen(id); openAny(0); }
function closeJ(){ listening=false; stopAudio(); $('reader').classList.remove('on'); cur=null; render(); }
function finishS(){ if(S.rdone.indexOf(cur.id)<0) S.rdone.push(cur.id); persist(); }
function nextStory(){ var pool=META.filter(function(m){ return !isDone(m.id) && m.id!==cur.id; }); if(!pool.length) pool=META.filter(function(m){ return m.id!==cur.id; }); return pool[Math.floor(Math.random()*pool.length)].id; }
function next(){ go(1); }
function prev(){ go(-1); }
function sheet(html){ $('sheet').innerHTML=html+'<button class="btn" id="sheetclose">'+U().ok+'</button>'; $('sheetwrap').classList.add('on'); }
function cycleLang(){ var i=LANGS.map(function(l){return l[0];}).indexOf(S.lang); S.lang=LANGS[(i+1)%3][0]; persist(); }

document.addEventListener('click',function(e){
  var el=e.target.closest('button'); if(!el){ if(e.target.id==='sheetwrap') $('sheetwrap').classList.remove('on'); return; }
  if(el.closest('#bf')) return;
  if(el.dataset.tab){ tab=el.dataset.tab; sub=null; try{ history.replaceState(null,'','#'+tab); }catch(x){} render(); }
  else if(el.dataset.open){ openJ(el.dataset.open, el.dataset.at?+el.dataset.at:0); }
  else if(el.dataset.sc){ openS(el.dataset.sc); }
  else if(el.dataset.emo){ sub={type:'emo',id:el.dataset.emo}; render(); }
  else if(el.dataset.back){ sub=null; render(); }
  else if(el.dataset.ex){ exTab=el.dataset.ex; renderExplore(); }
  else if(el.dataset.rcat){ rcat=el.dataset.rcat; render(); }
  else if(el.dataset.lang){ S.lang=el.dataset.lang; persist(); render(); }
  else if(el.dataset.cyclelang){ cycleLang(); render(); }
  else if(el.dataset.theme){ S.theme=el.dataset.theme; persist(); applyTheme(); render(); }
  else if(el.dataset.toggletheme){ S.theme=isDark()?'light':'dark'; persist(); applyTheme(); render(); }
  else if(el.dataset.rate){ S.rate=+el.dataset.rate; persist(); render(); }
  else if(el.dataset.ans!==undefined){
    var a=+el.dataset.ans, ok=a===cur.ans;
    if(mode==='sc'){ S.ranswers[cur.id]=a; finishS(); } else { S.answers[cur.id]=a; }
    persist(); stopAudio(); listening=true; drawCard(false);
    var f=$('stage').querySelector('.pnl.c .fb'); if(f) f.scrollIntoView({block:'nearest',behavior:'smooth'});
    playClip(mode==='sc'?(ok?2:3):(ok?7:8));
  }
  else if(el.id==='nextm'){ var nid=randomScen(cur.id); stopAudio(); openS(nid); }
  else if(el.id==='lcont'){ if(!isDone(cur.id)) S.done.push(cur.id); S.resume=null; persist(); stopAudio(); openJ(nextStory(),0); }
  else if(el.id==='lshare'){ var txt=T(cur.id).ti+'\n\n'+LESSONS[S.lang][cur.id].replace(/\[\[|\]\]/g,'')+'\n\nJach'; try{ if(navigator.share) navigator.share({title:'Jach',text:txt,url:location.href.split('#')[0]}).catch(function(){}); else if(navigator.clipboard) navigator.clipboard.writeText(txt); }catch(x){} }
  else if(el.id==='bshuffle'){ S.bseed=(S.bseed||1)+1; persist(); render(); }
  else if(el.id==='bsurprise'){ openS(randomScen()); }
  else if(el.id==='rplay'){ listening=!listening; setPlay(); if(listening){ if(player && player.getAttribute('src') && player.currentTime>0 && !player.ended){ var pr=player.play(); if(pr&&pr.catch) pr.catch(function(){}); } else playClip(clipFor(idx)); } else stopAudio(); }
  else if(el.id==='rback5'){ if(player && player.getAttribute('src')){ player.currentTime=Math.max(0,player.currentTime-5); if(!listening){ listening=true; setPlay(); var p2=player.play(); if(p2&&p2.catch) p2.catch(function(){}); } } }
  else if(el.id==='rnext') go(1);
  else if(el.id==='rprev') go(-1);
  else if(el.id==='rclose') closeJ();
  else if(el.id==='rlang'){ cycleLang(); stopAudio(); listening=true; drawCard(true); }
  else if(el.id==='rspeed'){ var ri=RATES.indexOf(S.rate); S.rate=RATES[(ri+1)%RATES.length]; persist(); $('rspeed').textContent=S.rate+'×'; if(player){ player.playbackRate=S.rate; player.defaultPlaybackRate=S.rate; } }
  else if(el.id==='rsave'){ var i=S.saved.indexOf(cur.id); if(i>-1) S.saved.splice(i,1); else S.saved.push(cur.id); persist(); el.innerHTML=ICON.mark(isSaved(cur.id)); }
  else if(el.id==='helpbtn') sheet('<h2>'+U().helpt+'</h2><p>'+U().helpb+'</p>');
  else if(el.id==='sheetclose') $('sheetwrap').classList.remove('on');
  else if(el.id==='reset'){ S.saved=[]; S.done=[]; S.resume=null; S.answers={}; S.rdone=[]; S.ranswers={}; CH={cur:null,list:[]}; chSave(); persist(); render(); }
});
document.addEventListener('keydown',function(e){ if(!cur) return; if(e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); go(1); } else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); go(-1); } else if(e.key==='Escape') closeJ(); else if(e.key===' '){ e.preventDefault(); $('rplay').click(); } });
window.addEventListener('resize',function(){ if(cur && !anim) buildPanels(); });
if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(!cur) render(); }); }catch(e){}

window.addEventListener('hashchange',fromHash);
applyTheme(); fromHash();
if('serviceWorker' in navigator && location.protocol==='https:' && !/claudeusercontent|claude\.ai/.test(location.host)){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
