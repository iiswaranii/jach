ਦ ਅਜਿਹੀਆਂ ਚੀਜ਼ਾਂ ਬਾਰੇ ਸੀ ਜੋ ਬਾਹਰੋਂ ਚਮਕਦੀਆਂ ਤੇ ਸਾਫ਼ ਦਿਸਦੀਆਂ ਹਨ, ਪਰ ਅੰਦਰੋਂ ਕਾਲੀਆਂ ਰਹਿੰਦੀਆਂ ਹਨ। ਸੱਜਣ ਨੇ ਸੁਣਿਆ, ਤੇ ਉਸ ਨੂੰ ਆਪਣਾ ਚਿਹਰਾ ਦਿਸ ਪਿਆ। ਉਹ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਡਿੱਗ ਪਿਆ ਤੇ ਸਭ ਕੁਝ ਮੰਨ ਲਿਆ। ਗੁਰੂ ਨਾਨਕ ਨੇ ਕਿਹਾ ਕਿ ਜੋ ਕੁਝ ਗ਼ਲਤ ਤਰੀਕੇ ਨਾਲ ਲਿਆ ਹੈ ਉਹ ਮੋੜ ਦੇ, ਤੇ ਫਿਰ ਤੋਂ ਸ਼ੁਰੂ ਕਰ। ਸੱਜਣ ਨੇ ਇਹੀ ਕੀਤਾ। ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਉਸ ਦੀ ਸਰਾਂ ਉਨ੍ਹਾਂ ਪਹਿਲੀਆਂ ਥਾਵਾਂ ਵਿਚੋਂ ਇਕ ਬਣੀ ਜਿੱਥੇ ਲੋਕ ਗੁਰੂ ਨਾਨਕ ਦੇ ਸ਼ਬਦ ਗਾਉਣ ਲਈ ਇਕੱਠੇ ਹੁੰਦੇ ਸਨ।", "a": "ਗੁਰੂ ਨਾਨਕ ਦੋਸ਼ੀ ਮਨ ਦੀ ਤੁਲਨਾ ਮੈਲੇ ਕੱਪੜਿਆਂ ਨਾਲ ਕਰਦੇ ਹਨ। ਰਾਹ ਦੀ ਧੂੜ ਨਾਲ ਮੈਲੇ ਕੱਪੜੇ ਪਾਣੀ ਤੇ ਸਾਬਣ ਨਾਲ ਧੁਲਦੇ ਹਨ। ਮਾੜੇ ਕੰਮਾਂ ਨਾਲ ਮੈਲਾ ਮਨ ਨਾਮ ਨਾਲ ਧੁਲਦਾ ਹੈ, ਯਾਨੀ ਉਸ ਇਕ ਦੇ ਪਿਆਰ ਤੇ ਯਾਦ ਨਾਲ। ਵੇਖੋ ਇਹ ਪੰਕਤੀ ਕੀ ਨਹੀਂ ਕਹਿੰਦੀ। ਇਹ ਨਹੀਂ ਕਹਿੰਦੀ ਕਿ ਤੁਸੀਂ ਸਦਾ ਲਈ ਮੈਲੇ ਹੋ। ਇਹ ਕਹਿੰਦੀ ਹੈ ਕਿ ਧੁਲਣਾ ਮੁਮਕਿਨ ਹੈ। ਸੱਜਣ ਨੇ ਸਾਡੇ ਵਿਚੋਂ ਬਹੁਤਿਆਂ ਨਾਲੋਂ ਕਿਤੇ ਮਾੜੇ ਕੰਮ ਕੀਤੇ ਸਨ, ਫਿਰ ਵੀ ਉਸ ਦੀ ਕਹਾਣੀ ਸਜ਼ਾ ਉੱਤੇ ਨਹੀਂ, ਇਕ ਨਵੀਂ ਸ਼ੁਰੂਆਤ ਉੱਤੇ ਮੁੱਕਦੀ ਹੈ। ਇਹ ਵੀ ਵੇਖੋ ਕਿ ਧੁਲਣ ਲਈ ਕੀ ਚਾਹੀਦਾ ਸੀ। ਉਸ ਨੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਸਾਫ਼ ਵੇਖਣਾ ਪਿਆ, ਮੰਨਣਾ ਪਿਆ, ਤੇ ਜੋ ਲਿਆ ਸੀ ਮੋੜਨਾ ਪਿਆ। ਠੀਕ ਵਰਤਿਆ ਜਾਵੇ ਤਾਂ ਪਛਤਾਵਾ ਉਸ ਦਾਗ਼ ਵਰਗਾ ਹੈ ਜੋ ਆਖ਼ਰ ਦਿਸ ਪਿਆ। ਇਹ ਸਾਫ਼ ਹੋਣ ਵੱਲ ਪਹਿਲਾ ਕਦਮ ਹੈ, ਕਹਾਣੀ ਦਾ ਅੰਤ ਨਹੀਂ।", "b": "ਮਨੋਵਿਗਿਆਨੀ ਪਛਤਾਵੇ ਤੇ ਸ਼ਰਮ ਵਿਚ ਫ਼ਰਕ ਕਰਦੇ ਹਨ। ਪਛਤਾਵਾ ਕਹਿੰਦਾ ਹੈ, ਮੈਂ ਇਕ ਮਾੜਾ ਕੰਮ ਕੀਤਾ। ਸ਼ਰਮ ਕਹਿੰਦੀ ਹੈ, ਮੈਂ ਹੀ ਮਾੜਾ ਹਾਂ। ਜੂਨ ਟੈਂਗਨੀ ਤੇ ਦੂਜੇ ਖੋਜੀਆਂ ਦਾ ਕੰਮ ਦੱਸਦਾ ਹੈ ਕਿ ਪਛਤਾਵਾ ਅਕਸਰ ਇਨਸਾਨ ਨੂੰ ਨੁਕਸਾਨ ਠੀਕ ਕਰਨ ਵੱਲ ਧੱਕਦਾ ਹੈ, ਜਦ ਕਿ ਸ਼ਰਮ ਉਸ ਨੂੰ ਲੁਕਣ, ਮੁੱਕਰਨ ਜਾਂ ਭੜਕਣ ਵੱਲ। ਇਸ ਲਈ ਕੰਮ ਦਾ ਸਵਾਲ ਇਹ ਨਹੀਂ ਕਿ ਮੈਂ ਕਿਹੋ ਜਿਹਾ ਇਨਸਾਨ ਹਾਂ? ਸਵਾਲ ਇਹ ਹੈ ਕਿ ਇਸ ਨੂੰ ਠੀਕ ਕਰਨ ਲਈ ਮੈਂ ਕੀ ਕਰ ਸਕਦਾ ਹਾਂ? ਜਵਾਬ ਅਕਸਰ ਛੋਟਾ ਤੇ ਹਿੰਮਤ ਵਾਲਾ ਹੁੰਦਾ ਹੈ: ਬਿਨਾਂ ਬਹਾਨਿਆਂ ਦੇ ਇਕ ਸੱਚੀ ਮਾਫ਼ੀ। ਮੈਂ ਗ਼ਲਤ ਸੀ, ਤੇ ਮੈਨੂੰ ਅਫ਼ਸੋਸ ਹੈ ਕਿ ਤੈਨੂੰ ਮਾੜਾ ਲੱਗਾ। ਫਿਰ ਆਪਣਾ ਵਰਤਾਓ ਬਦਲਣਾ। ਮਾਫ਼ੀ ਨੂੰ ਪਰਫ਼ੈਕਟ ਹੋਣ ਦੀ ਲੋੜ ਨਹੀਂ। ਉਸ ਨੂੰ ਸੱਚਾ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ। ਬਹੁਤੇ ਲੋਕ ਸਾਡੇ ਦੇਰ ਰਾਤ ਦੇ ਡਰਾਂ ਨਾਲੋਂ ਕਿਤੇ ਵੱਧ ਮਾਫ਼ ਕਰਨ ਵਾਲੇ ਹੁੰਦੇ ਹਨ।", "t": "ਕਿਸੇ ਇਕ ਅਜਿਹੇ ਇਨਸਾਨ ਬਾਰੇ ਸੋਚੋ ਜਿਸ ਨੂੰ ਤੁਸੀਂ ਸੱਟ ਮਾਰੀ ਤੇ ਕਦੇ ਮਾਫ਼ੀ ਨਹੀਂ ਮੰਗੀ। ਇਸ ਹਫ਼ਤੇ ਇਕ ਛੋਟਾ, ਸੱਚਾ ਸੁਨੇਹਾ ਭੇਜੋ: ਮੈਂ ਗ਼ਲਤ ਸੀ, ਮੈਨੂੰ ਮਾਫ਼ ਕਰ ਦੇ। ਕੋਈ ਬਹਾਨਾ ਨਹੀਂ।", "q": "ਤੁਸੀਂ ਆਪਣੀ ਸਭ ਤੋਂ ਚੰਗੀ ਸਹੇਲੀ ਦਾ ਜਨਮਦਿਨ ਭੁੱਲ ਗਏ, ਤੇ ਉਹ ਚੁੱਪ ਚਾਪ ਦੁਖੀ ਲੱਗ ਰਹੀ ਹੈ। ਸਭ ਤੋਂ ਚੰਗਾ ਕੀ ਕਰਨਾ ਹੋਵੇਗਾ?", "o": ["ਇਉਂ ਵਿਖਾਉਣਾ ਕਿ ਤੁਸੀਂ ਧਿਆਨ ਹੀ ਨਹੀਂ ਦਿੱਤਾ", "ਸੱਚੇ ਮਨ ਨਾਲ ਮਾਫ਼ੀ ਮੰਗਣੀ, ਤੇ ਭਰਪਾਈ ਲਈ ਇਕ ਛੋਟਾ ਜਿਹਾ ਸਰਪ੍ਰਾਈਜ਼ ਪਲਾਨ ਕਰਨਾ", "ਲੰਮਾ ਸਮਝਾਉਣਾ ਕਿ ਤੁਸੀਂ ਕਿੰਨੇ ਰੁੱਝੇ ਸੀ"], "y": "ਬਹੁਤ ਪਿਆਰਾ। ਸੱਚੀ ਮਾਫ਼ੀ ਤੇ ਸੰਭਾਲ ਦਾ ਇਕ ਛੋਟਾ ਜਿਹਾ ਕੰਮ, ਦਾਗ਼ ਧੋਣ ਦਾ ਇਹੀ ਤਰੀਕਾ ਹੈ। ਉਸ ਨੂੰ ਉਹ ਦਿਨ ਘੱਟ ਯਾਦ ਰਹੇਗਾ ਜਦੋਂ ਤੁਸੀਂ ਭੁੱਲੇ, ਤੇ ਉਹ ਵੱਧ ਯਾਦ ਰਹੇਗਾ ਜਦੋਂ ਤੁਸੀਂ ਗੱਲ ਠੀਕ ਕੀਤੀ।", "n": "ਇਹ ਕੁਦਰਤੀ ਪ੍ਰਤੀਕਿਰਿਆ ਹੈ। ਜਦੋਂ ਅਸੀਂ ਦੋਸ਼ੀ ਮਹਿਸੂਸ ਕਰਦੇ ਹਾਂ, ਤਾਂ ਲੁਕਣਾ ਜਾਂ ਸਫ਼ਾਈ ਦੇਣਾ ਚਾਹੁੰਦੇ ਹਾਂ। ਪਰ ਲੰਮੇ ਬਹਾਨੇ ਇਉਂ ਲੱਗ ਸਕਦੇ ਹਨ ਜਿਵੇਂ ਉਸ ਦਾ ਦੁੱਖ ਮਾਇਨੇ ਨਹੀਂ ਰੱਖਦਾ। ਇਕ ਸਿੱਧੀ, ਸੱਚੀ ਮਾਫ਼ੀ ਤੇ ਭਰਪਾਈ ਲਈ ਇਕ ਛੋਟਾ ਜਿਹਾ ਕੰਮ ਕਰ ਕੇ ਵੇਖੋ। ਇਹੀ ਜ਼ਖ਼ਮ ਭਰਦਾ ਹੈ।"}, "joy1": {"ti": "ਖ਼ੁਸ਼ੀ ਵੰਡਣ ਲਈ ਹੁੰਦੀ ਹੈ", "s": "ਤੁਹਾਡਾ ਨਤੀਜਾ ਆਇਆ ਹੈ, ਤੇ ਉਮੀਦ ਤੋਂ ਵੀ ਚੰਗਾ ਹੈ। ਮਨ ਗਾਉਣ ਨੂੰ ਕਰਦਾ ਹੈ। ਤੁਸੀਂ ਆਪਣੀ ਸਭ ਤੋਂ ਚੰਗੀ ਦੋਸਤ ਨੂੰ ਫ਼ੋਨ ਕਰਦੇ ਹੋ, ਤੇ ਅਚਾਨਕ ਖ਼ੁਸ਼ੀ ਦੁੱਗਣੀ ਲੱਗਣ ਲੱਗ ਪੈਂਦੀ ਹੈ।", "m": "ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਦਾ ਦਿਲ ਉਸ ਇਕ ਵੱਲ ਮੁੜਿਆ ਹੈ, ਉਹ ਸਦਾ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ।", "k": "ਭਾਈ ਮਰਦਾਨਾ ਗੁਰੂ ਨਾਨਕ ਦੇ ਪਿੰਡ ਵਿਚ ਹੀ ਪਲੇ ਵੱਡੇ ਹੋਏ ਸਨ, ਤੇ ਬਚਪਨ ਤੋਂ ਉਨ੍ਹਾਂ ਦੇ ਦੋਸਤ ਸਨ। ਉਹ ਇਕ ਮੁਸਲਮਾਨ ਸੰਗੀਤਕਾਰ ਸਨ ਜੋ ਰਬਾਬ ਵਜਾਉਂਦੇ ਸਨ, ਤਾਰਾਂ ਵਾਲਾ ਇਕ ਸਾਜ਼। ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਆਪਣੀਆਂ ਲੰਮੀਆਂ ਯਾਤਰਾਵਾਂ ਉੱਤੇ ਨਿਕਲੇ, ਤਾਂ ਮਰਦਾਨਾ ਉਨ੍ਹਾਂ ਨਾਲ ਗਏ, ਬਹੁਤ ਸਾਲਾਂ ਤਕ ਤੇ ਹਜ਼ਾਰਾਂ ਮੀਲ। ਪੁਰਾਣੀਆਂ ਸਾਖੀਆਂ ਦੱਸਦੀਆਂ ਹਨ ਕਿ ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਦੇ ਮਨ ਵਿਚ ਨਵੇਂ ਬਚਨ ਉੱਠਦੇ, ਤਾਂ ਉਹ ਆਪਣੇ ਦੋਸਤ ਵੱਲ ਮੁੜ ਕੇ ਕਹਿੰਦੇ: ਮਰਦਾਨਿਆ, ਰਬਾਬ ਛੇੜ, ਬਾਣੀ ਆਈ ਹੈ। ਤੇ ਉੱਥੇ ਹੀ, ਕਿਸੇ ਰੁੱਖ ਹੇਠ ਜਾਂ ਦਰਿਆ ਕੰਢੇ, ਸੰਗੀਤ ਤੇ ਬਚਨ ਨਾਲ ਨਾਲ ਵਹਿ ਤੁਰਦੇ। ਉਨ੍ਹਾਂ ਦੀ ਖ਼ੁਸ਼ੀ ਕਦੇ ਆਪਣੇ ਤਕ ਨਹੀਂ ਰੱਖੀ ਗਈ। ਉਹ ਗਾਈ ਜਾਂਦੀ ਸੀ, ਤੇ ਜੋ ਵੀ ਸੁਣਨ ਆਉਂਦਾ, ਉਸ ਨਾਲ ਵੰਡੀ ਜਾਂਦੀ ਸੀ।", "a": "ਇਸ ਪੰਕਤੀ ਦੇ ਸ਼ਬਦ ਵਿਗਾਸੁ ਦਾ ਮਤਲਬ ਹੈ ਖਿੜਨਾ, ਜਿਵੇਂ ਸਵੇਰੇ ਫੁੱਲ ਖੁੱਲ੍ਹਦਾ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ ਕਿ ਜਿਨ੍ਹਾਂ ਦਾ ਦਿਲ ਉਸ ਇਕ ਵੱਲ ਮੁੜਿਆ ਹੈ, ਉਹ ਇਸੇ ਤਰ੍ਹਾਂ ਦੀ ਖ਼ੁਸ਼ੀ ਵਿਚ ਜਿਊਂਦੇ ਹਨ। ਇਹ ਕੋਈ ਪਾਰਟੀ ਨਹੀਂ ਜੋ ਅੱਧੀ ਰਾਤ ਨੂੰ ਮੁੱਕ ਜਾਵੇ। ਇਹ ਇਕ ਟਿਕਿਆ ਹੋਇਆ ਖਿੜਨਾ ਹੈ ਜੋ ਸਾਧਾਰਨ ਦਿਨਾਂ ਵਿਚ ਵੀ ਰਹਿੰਦਾ ਹੈ। ਮਰਦਾਨੇ ਦੀ ਰਬਾਬ ਵਿਖਾਉਂਦੀ ਹੈ ਕਿ ਇਹ ਖ਼ੁਸ਼ੀ ਕਦੇ ਫਿੱਕੀ ਜਾਂ ਭਾਰੀ ਨਹੀਂ ਸੀ। ਇਹ ਸੰਗੀਤ ਭਰੀ, ਨਿੱਘੀ ਤੇ ਦੋਸਤੀ ਨਾਲ ਭਰੀ ਸੀ। ਹਿੰਦੂ ਘਰ ਜੰਮੇ ਇਕ ਗੁਰੂ ਤੇ ਮੁਸਲਮਾਨ ਘਰ ਜੰਮੇ ਇਕ ਸੰਗੀਤਕਾਰ ਦਹਾਕਿਆਂ ਤਕ ਇਕੱਠੇ ਗਾਉਂਦੇ ਹੋਏ ਘੁੰਮੇ। ਉਨ੍ਹਾਂ ਦੀ ਖ਼ੁਸ਼ੀ ਨੇ ਉਹ ਸਾਰੀਆਂ ਲਕੀਰਾਂ ਪਾਰ ਕਰ ਦਿੱਤੀਆਂ ਜੋ ਲੋਕ ਅਕਸਰ ਖਿੱਚਦੇ ਹਨ। ਸੱਚੀ ਖ਼ੁਸ਼ੀ ਇਹੀ ਕਰਦੀ ਹੈ। ਉਹ ਸਾਨੂੰ ਹੰਕਾਰੀ ਨਹੀਂ ਬਣਾਉਂਦੀ। ਉਹ ਸਾਨੂੰ ਦੂਜਿਆਂ ਨੂੰ ਨਾਲ ਜੋੜਨ ਲਈ ਕਹਿੰਦੀ ਹੈ।", "b": "ਖ਼ੁਸ਼ੀ ਉੱਤੇ ਖੋਜ ਕਰਨ ਵਾਲੇ ਮਨੋਵਿਗਿਆਨੀਆਂ ਨੇ ਇਕ ਸਿੱਧੀ ਜਿਹੀ ਗੱਲ ਵੇਖੀ ਹੈ। ਜਦੋਂ ਅਸੀਂ ਕਿਸੇ ਨੂੰ ਆਪਣੀ ਚੰਗੀ ਖ਼ਬਰ ਦੱਸਦੇ ਹਾਂ, ਤੇ ਉਹ ਸੱਚੀ ਦਿਲਚਸਪੀ ਨਾਲ ਜਵਾਬ ਦਿੰਦਾ ਹੈ, ਤਾਂ ਚੰਗਾ ਅਹਿਸਾਸ ਅਕਸਰ ਵੱਧ ਦੇਰ ਟਿਕਦਾ ਹੈ। ਵੰਡੀ ਹੋਈ ਖ਼ੁਸ਼ੀ ਵਧਦੀ ਹੈ। ਖ਼ੁਸ਼ੀ ਸੰਗੀਤ ਨਾਲ, ਇਕੱਠੇ ਖਾਣ ਨਾਲ, ਤੇ ਇਕੱਠੇ ਹੱਸਣ ਨਾਲ ਵੀ ਫੈਲਦੀ ਹੈ। ਤੇ ਇਕ ਗੱਲ ਹੋਰ। ਜੋ ਲੋਕ ਛੋਟੀਆਂ ਚੀਜ਼ਾਂ ਲਈ ਸ਼ੁਕਰਗੁਜ਼ਾਰ ਰਹਿੰਦੇ ਹਨ, ਇਕ ਚੰਗੀ ਚਾਹ, ਧੁੱਪ ਵਾਲੀ ਬਾਰੀ, ਕਿਸੇ ਦੋਸਤ ਦੀ ਆਵਾਜ਼, ਉਹ ਸਮੇਂ ਨਾਲ ਉਨ੍ਹਾਂ ਲੋਕਾਂ ਨਾਲੋਂ ਵੱਧ ਖ਼ੁਸ਼ ਰਹਿੰਦੇ ਹਨ ਜੋ ਵੱਡੀਆਂ ਜਿੱਤਾਂ ਦੀ ਉਡੀਕ ਕਰਦੇ ਹਨ। ਤੁਹਾਨੂੰ ਕਿਸੇ ਪਰਫ਼ੈਕਟ ਦਿਨ ਦੀ ਉਡੀਕ ਨਹੀਂ ਕਰਨੀ। ਇਕ ਛੋਟਾ ਜਿਹਾ ਖਿੜਨਾ, ਜਿਸ ਨੂੰ ਵੇਖਿਆ ਤੇ ਵੰਡਿਆ ਜਾਵੇ, ਉਹੀ ਅਸਲ ਚੀਜ਼ ਹੈ।", "t": "ਅੱਜ ਕਿਸੇ ਨਾਲ ਇਕ ਛੋਟੀ ਖ਼ੁਸ਼ੀ ਵੰਡੋ: ਤੁਹਾਡਾ ਪਸੰਦੀਦਾ ਗੀਤ, ਕੋਈ ਮਜ਼ੇਦਾਰ ਤਸਵੀਰ, ਕੋਈ ਚੰਗੀ ਖ਼ਬਰ। ਤੇ ਜਦੋਂ ਕੋਈ ਆਪਣੀ ਖ਼ੁਸ਼ੀ ਵੰਡੇ, ਤਾਂ ਸੱਚੇ ਦਿਲੋਂ ਖ਼ੁਸ਼ ਹੋ ਕੇ ਜਵਾਬ ਦਿਓ।", "q": "ਤੁਹਾਡੀ ਸਾਥਣ ਜੋਸ਼ ਨਾਲ ਦੱਸਦੀ ਹੈ ਕਿ ਉਸ ਦੀ ਹੁਣੇ ਹੁਣੇ ਮੰਗਣੀ ਹੋਈ ਹੈ। ਤੁਸੀਂ ਇਕ ਰਿਪੋਰਟ ਪੂਰੀ ਕਰਨ ਵਿਚ ਰੁੱਝੇ ਹੋ। ਸਭ ਤੋਂ ਚੰਗਾ ਜਵਾਬ ਕੀ ਹੋਵੇਗਾ?", "o": ["ਬਿਨਾਂ ਉੱਤੇ ਵੇਖੇ ਵਧਾਈ ਕਹਿ ਦੇਣੀ", "ਇਕ ਮਿੰਟ ਰੁਕ ਕੇ, ਮੁਸਕਰਾ ਕੇ ਪੁੱਛਣਾ ਕਿ ਇਹ ਕਿਵੇਂ ਹੋਇਆ", "ਉਸ ਦੀ ਥਾਂ ਆਪਣੀਆਂ ਯੋਜਨਾਵਾਂ ਬਾਰੇ ਦੱਸਣ ਲੱਗ ਪੈਣਾ"], "y": "ਬਹੁਤ ਵਧੀਆ। ਇਕ ਮਿੰਟ ਦੀ ਸੱਚੀ ਖ਼ੁਸ਼ੀ ਉਸ ਦੀ ਖ਼ੁਸ਼ੀ ਦੁੱਗਣੀ ਕਰ ਦਿੰਦੀ ਹੈ, ਤੇ ਚੁੱਪ ਚਾਪ ਤੁਹਾਡੀ ਵੀ। ਖ਼ੁਸ਼ੀ ਇਉਂ ਹੀ ਕੰਮ ਕਰਦੀ ਹੈ: ਵੰਡੀ ਜਾਂਦੀ ਹੈ, ਜਮ੍ਹਾਂ ਨਹੀਂ ਕੀਤੀ ਜਾਂਦੀ।", "n": "ਰੁੱਝੇ ਹੋਣ ਵੇਲੇ ਇਹ ਬਹੁਤ ਆਮ ਜਵਾਬ ਹੈ। ਪਰ ਖ਼ਬਰ ਨਾਲ ਭਰੇ ਕਿਸੇ ਇਨਸਾਨ ਨੂੰ ਛੇਤੀ ਵਾਲੀ ਵਧਾਈ ਫਿੱਕੀ ਲੱਗ ਸਕਦੀ ਹੈ। ਇਕ ਮਿੰਟ ਰੁਕ ਕੇ ਉਸ ਦੀ ਖ਼ੁਸ਼ੀ ਵਿਚ ਸ਼ਾਮਲ ਹੋ ਕੇ ਵੇਖੋ। ਖ਼ੁਸ਼ੀ ਉਦੋਂ ਵਧਦੀ ਹੈ ਜਦੋਂ ਉਸ ਨੂੰ ਪਿਆਰ ਨਾਲ ਲਿਆ ਜਾਵੇ, ਤੇ ਰਿਪੋਰਟ ਸੱਠ ਸਕਿੰਟ ਉਡੀਕ ਕਰ ਸਕਦੀ ਹੈ।"}, "lonely1": {"ti": "ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਕੋਈ ਨਹੀਂ", "s": "ਤੁਸੀਂ ਕੰਮ ਲਈ ਇਕ ਨਵੇਂ ਸ਼ਹਿਰ ਆਏ ਹੋ। ਵੀਕਐਂਡ ਸਭ ਤੋਂ ਔਖੇ ਹੁੰਦੇ ਹਨ। ਔਨਲਾਈਨ ਹਰ ਕੋਈ ਦੋਸਤਾਂ ਨਾਲ ਦਿਸਦਾ ਹੈ, ਤੇ ਤੁਹਾਡਾ ਕਮਰਾ ਬਹੁਤ, ਬਹੁਤ ਸੁੰਨਾ ਲੱਗਦਾ ਹੈ।", "m": "ਸਾਰੇ ਜੀਆਂ ਦਾ ਇਕੋ ਦਾਤਾ ਹੈ। ਉਹ ਮੈਨੂੰ ਕਦੇ ਨਾ ਭੁੱਲੇ।", "k": "ਪੱਛਮ ਦੀ ਯਾਤਰਾ ਵਿਚ ਗੁਰੂ ਨਾਨਕ ਮੱਕੇ ਪਹੁੰਚੇ। ਸਫ਼ਰ ਤੋਂ ਥੱਕ ਕੇ ਉਹ ਆਰਾਮ ਕਰਨ ਲੇਟੇ, ਤੇ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰ ਸਬੱਬ ਨਾਲ ਕਾਬੇ ਵੱਲ ਹੋ ਗਏ। ਇਕ ਬੰਦੇ ਨੇ ਇਹ ਵੇਖਿਆ ਤੇ ਗੁੱਸੇ ਨਾਲ ਉਨ੍ਹਾਂ ਨੂੰ ਜਗਾਇਆ। ਤੂੰ ਖ਼ੁਦਾ ਦੇ ਘਰ ਵੱਲ ਪੈਰ ਕਰਨ ਦੀ ਹਿੰਮਤ ਕਿਵੇਂ ਕਰਦਾ ਹੈਂ, ਉਸ ਨੇ ਪੁੱਛਿਆ। ਗੁਰੂ ਨਾਨਕ ਨੇ ਨਰਮੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ: ਤਾਂ ਮੇਰੇ ਪੈਰ ਉਸ ਦਿਸ਼ਾ ਵੱਲ ਕਰ ਦੇ ਜਿੱਥੇ ਖ਼ੁਦਾ ਨਾ ਹੋਵੇ। ਭਾਈ ਗੁਰਦਾਸ, ਜਿਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਦੇ ਸਮੇਂ ਦੀਆਂ ਯਾਦਾਂ ਤਾਜ਼ੀਆਂ ਰਹਿੰਦਿਆਂ ਲਿਖਿਆ, ਆਪਣੀ ਪਹਿਲੀ ਵਾਰ ਵਿਚ ਇਹ ਕਹਾਣੀ ਦੱਸਦੇ ਹਨ। ਉਸ ਬੰਦੇ ਕੋਲ ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਸੀ। ਅਜਿਹੀ ਕੋਈ ਦਿਸ਼ਾ ਨਹੀਂ ਜਿੱਥੇ ਉਹ ਇਕ ਨਾ ਹੋਵੇ।", "a": "ਗੁਰੂ ਨਾਨਕ ਦੀ ਪੰਕਤੀ ਛੋਟੀ ਹੈ: ਸਾਰੇ ਜੀਆਂ ਦਾ ਇਕ ਦਾਤਾ ਹੈ, ਉਹ ਮੈਨੂੰ ਕਦੇ ਨਾ ਭੁੱਲੇ। ਹਰ ਕੋਈ ਉਸੇ ਦਾਤੇ ਦੇ ਸਹਾਰੇ ਹੈ। ਤੁਸੀਂ, ਤੁਹਾਡੇ ਆਲੇ ਦੁਆਲੇ ਸ਼ਹਿਰ ਦੇ ਲੋਕ, ਦੂਰ ਬੈਠਾ ਤੁਹਾਡਾ ਦੋਸਤ, ਬੱਸ ਵਿਚ ਬੈਠਾ ਅਜਨਬੀ ਵੀ। ਮੱਕੇ ਦੀ ਸਾਖੀ ਇਸ ਨੂੰ ਇਕ ਸਿੱਧੀ ਤਸਵੀਰ ਵਿਚ ਰੱਖ ਦਿੰਦੀ ਹੈ। ਕਿਸੇ ਵੀ ਦਿਸ਼ਾ ਵੱਲ ਮੁੜੋ, ਉਹ ਇਕ ਪਹਿਲਾਂ ਤੋਂ ਉੱਥੇ ਹੈ। ਇਕੱਲਾਪਣ ਅਕਸਰ ਕੰਨ ਵਿਚ ਕਹਿੰਦਾ ਹੈ ਕਿ ਅਸੀਂ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਹਾਂ, ਕਿ ਬਾਕੀ ਸਾਰੇ ਕਿਸੇ ਦੇ ਹਨ ਤੇ ਅਸੀਂ ਨਹੀਂ। ਇਹ ਪੰਕਤੀ ਉਸ ਘੁਸਰ ਮੁਸਰ ਦਾ ਜਵਾਬ ਹੈ। ਕੋਈ ਬਾਹਰ ਨਹੀਂ। ਇਸ ਨਾਲ ਖ਼ਾਲੀ ਕਮਰਾ ਉਸੇ ਵੇਲੇ ਨਹੀਂ ਭਰ ਜਾਂਦਾ। ਪਰ ਕਮਰਾ ਬਦਲ ਜਾਂਦਾ ਹੈ। ਤੁਸੀਂ ਉਸ ਵਿਚ ਛੱਡੇ ਹੋਏ ਨਹੀਂ। ਤੁਸੀਂ ਸਾਂਭੇ ਹੋਏ ਹੋ, ਤੇ ਅਗਲੀ ਦੋਸਤੀ ਓਨੀ ਦੂਰ ਨਹੀਂ ਜਿੰਨੀ ਲੱਗਦੀ ਹੈ।", "b": "ਇਕੱਲਾਪਣ ਬਹੁਤ ਆਮ ਹੈ, ਖ਼ਾਸ ਕਰਕੇ ਨਵੀਂ ਥਾਂ ਜਾਣ ਤੋਂ ਬਾਅਦ, ਤੇ ਇਹ ਤੁਹਾਡੇ ਬਾਰੇ ਕੁਝ ਮਾੜਾ ਨਹੀਂ ਕਹਿੰਦਾ। ਖੋਜੀ ਲੰਮੇ ਇਕੱਲੇਪਣ ਨੂੰ ਤਣਾਅ ਤੇ ਮਾੜੀ ਨੀਂਦ ਨਾਲ ਜੋੜਦੇ ਹਨ, ਇਸ ਲਈ ਉਸ ਦੀ ਪਿਆਰ ਨਾਲ ਸੰਭਾਲ ਜ਼ਰੂਰੀ ਹੈ। ਚੰਗੀ ਖ਼ਬਰ ਇਹ ਹੈ ਕਿ ਰਿਸ਼ਤੇ ਅਕਸਰ ਛੋਟੀਆਂ, ਵਾਰ ਵਾਰ ਦੀਆਂ ਮੁਲਾਕਾਤਾਂ ਨਾਲ ਵਧਦੇ ਹਨ, ਕਿਸੇ ਇਕ ਵੱਡੇ ਪਲ ਨਾਲ ਨਹੀਂ। ਹਰ ਸਵੇਰ ਉਸੇ ਚਾਹ ਵਾਲੇ ਦਾ ਹਾਲ ਚਾਲ ਪੁੱਛਣਾ। ਹਫ਼ਤੇ ਵਿਚ ਇਕ ਵਾਰ ਕੋਈ ਕਲਾਸ, ਜਾਂ ਐਤਵਾਰ ਗੁਰਦੁਆਰੇ ਦੇ ਲੰਗਰ ਵਿਚ ਸੇਵਾ, ਜਿੱਥੇ ਬਹੁਤ ਸਾਰੇ ਹੱਥ ਇਕੱਠੇ ਕੰਮ ਕਰਦੇ ਹਨ। ਕਿਸੇ ਪੁਰਾਣੇ ਦੋਸਤ ਨੂੰ ਪੰਜ ਮਿੰਟ ਦਾ ਫ਼ੋਨ। ਹਰ ਇਕ ਇਕ ਛੋਟਾ ਧਾਗਾ ਹੈ, ਤੇ ਧਾਗੇ ਮਿਲ ਕੇ ਰੱਸੀ ਬਣਦੇ ਹਨ। ਇਹ ਵੀ ਯਾਦ ਰੱਖੋ ਕਿ ਤੁਹਾਡੇ ਆਲੇ ਦੁਆਲੇ ਬਹੁਤ ਸਾਰੇ ਲੋਕ ਚੁੱਪ ਚਾਪ ਇਕੱਲੇ ਹਨ। ਹੋ ਸਕਦਾ ਹੈ ਤੁਹਾਡੇ ਹਾਲ ਚਾਲ ਪੁੱਛਣ ਦੀ ਹੀ ਉਹ ਉਡੀਕ ਕਰ ਰਹੇ ਹੋਣ।", "t": "ਇਸ ਹਫ਼ਤੇ ਇਕ ਅਜਿਹੀ ਥਾਂ ਚੁਣੋ ਜਿੱਥੇ ਤੁਸੀਂ ਵਾਰ ਵਾਰ ਜਾ ਸਕੋ: ਕੋਈ ਕਲਾਸ, ਪਾਰਕ, ਜਾਂ ਲੰਗਰ। ਦੋ ਵਾਰ ਜਾਓ, ਤੇ ਦੋਵੇਂ ਵਾਰ ਕਿਸੇ ਇਕ ਇਨਸਾਨ ਨਾਲ ਹਾਲ ਚਾਲ ਪੁੱਛੋ।", "q": "ਨਵੇਂ ਸ਼ਹਿਰ ਵਿਚ ਐਤਵਾਰ ਦੀ ਸ਼ਾਮ ਹੈ, ਤੇ ਤੁਸੀਂ ਬਹੁਤ ਇਕੱਲੇ ਮਹਿਸੂਸ ਕਰ ਰਹੇ ਹੋ। ਚੰਗਾ ਅਗਲਾ ਕਦਮ ਕੀ ਹੈ?", "o": ["ਆਪਣੇ ਆਪ ਨੂੰ ਕਹਿਣਾ ਕਿ ਕੋਈ ਤੁਹਾਡਾ ਦੋਸਤ ਨਹੀਂ ਬਣਨਾ ਚਾਹੁੰਦਾ", "ਕਿਸੇ ਪੁਰਾਣੇ ਦੋਸਤ ਨੂੰ ਫ਼ੋਨ ਕਰਨਾ, ਤੇ ਜੁੜਨ ਲਈ ਇਕ ਸਥਾਨਕ ਗਰੁੱਪ ਲੱਭਣਾ", "ਘਰ ਰਹਿ ਕੇ ਸਾਰਿਆਂ ਦੀਆਂ ਵੀਕਐਂਡ ਤਸਵੀਰਾਂ ਵੇਖਦੇ ਰਹਿਣਾ"], "y": "ਇਹ ਹਿੰਮਤ ਵਾਲਾ ਤੇ ਪਿਆਰਾ ਕਦਮ ਹੈ। ਪੁਰਾਣਾ ਦੋਸਤ ਯਾਦ ਕਰਾਉਂਦਾ ਹੈ ਕਿ ਤੁਹਾਨੂੰ ਪਿਆਰ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਤੇ ਸਥਾਨਕ ਗਰੁੱਪ ਨਵੇਂ ਧਾਗੇ ਸ਼ੁਰੂ ਕਰਦਾ ਹੈ। ਤੁਸੀਂ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਨਹੀਂ। ਤੁਸੀਂ ਬੱਸ ਉਸ ਵਿਚ ਆਪਣੀ ਥਾਂ ਲੱਭ ਰਹੇ ਹੋ।", "n": "ਇਹ ਬਹੁਤ ਸੱਚਾ ਅਹਿਸਾਸ ਹੈ, ਤੇ ਨਵੇਂ ਸ਼ਹਿਰਾਂ ਵਿਚ ਬਹੁਤ ਲੋਕ ਇਉਂ ਮਹਿਸੂਸ ਕਰਦੇ ਹਨ। ਪਰ ਕੌੜੀ ਸੋਚ ਤੇ ਲਗਾਤਾਰ ਸਕਰੋਲਿੰਗ ਅਕਸਰ ਇਕੱਲੇਪਣ ਨੂੰ ਹੋਰ ਭਾਰਾ ਕਰ ਦਿੰਦੀ ਹੈ। ਕਿਸੇ ਪੁਰਾਣੇ ਦੋਸਤ ਨੂੰ ਫ਼ੋਨ ਕਰ ਕੇ ਤੇ ਇਕ ਸਥਾਨਕ ਗਰੁੱਪ ਲੱਭ ਕੇ ਵੇਖੋ। ਛੋਟੇ ਧਾਗੇ, ਇਕ ਇਕ ਕਰਕੇ, ਅਸਲੀ ਰਿਸ਼ਤਾ ਬਣਦੇ ਹਨ।"}, "loved1": {"ti": "ਪਿਆਰ ਭਰੀ ਨਜ਼ਰ", "s": "ਤੁਸੀਂ ਸਾਰੀ ਰਾਤ ਇਕ ਦੋਸਤ ਦਾ ਘਰ ਬਦਲਵਾਉਣ ਵਿਚ ਲੱਗੇ ਰਹੇ। ਕੱਪੜੇ ਧੂੜ ਨਾਲ ਭਰੇ ਹਨ, ਲੱਕ ਦੁਖ ਰਿਹਾ ਹੈ, ਤੇ ਕਿਸੇ ਨੇ ਬਹੁਤਾ ਕੁਝ ਨਹੀਂ ਕਿਹਾ। ਤੁਸੀਂ ਸੋਚਦੇ ਹੋ, ਕੀ ਕਿਸੇ ਨੇ ਧਿਆਨ ਵੀ ਦਿੱਤਾ?", "m": "ਜੋ ਸੁਣਦਾ ਹੈ, ਮੰਨਦਾ ਹੈ, ਤੇ ਦਿਲ ਵਿਚ ਪਿਆਰ ਰੱਖਦਾ ਹੈ, ਉਹ ਆਪਣੇ ਅੰਦਰਲੇ ਪਵਿੱਤਰ ਸਰੋਵਰ ਵਿਚ ਨ੍ਹਾ ਕੇ ਸਾਫ਼ ਹੋ ਜਾਂਦਾ ਹੈ।", "k": "ਕਰਤਾਰਪੁਰ ਵਿਚ ਇਕ ਵਾਰ ਗੁਰੂ ਨਾਨਕ ਨੇ ਪਸ਼ੂਆਂ ਲਈ ਘਾਹ ਦੀਆਂ ਤਿੰਨ ਪੰਡਾਂ ਕਟਵਾਈਆਂ। ਘਾਹ ਗਿੱਲਾ ਸੀ ਤੇ ਉਸ ਵਿਚੋਂ ਚਿੱਕੜ ਚੋ ਰਿਹਾ ਸੀ, ਤੇ ਨੇੜੇ ਖੜ੍ਹੇ ਲੋਕਾਂ ਨੇ ਚੁੱਕਣ ਤੋਂ ਬਚਣ ਦੇ ਬਹਾਨੇ ਲੱਭ ਲਏ। ਭਾਈ ਲਹਿਣਾ ਹੁਣੇ ਹੁਣੇ ਆਏ ਸਨ, ਨਵੇਂ ਕੱਪੜੇ ਪਾਏ ਹੋਏ। ਬਿਨਾਂ ਕੁਝ ਕਹੇ ਉਨ੍ਹਾਂ ਨੇ ਤਿੰਨੇ ਪੰਡਾਂ ਸਿਰ ਉੱਤੇ ਚੁੱਕੀਆਂ ਤੇ ਘਰ ਤਕ ਲੈ ਗਏ। ਚਿੱਕੜ ਵਹਿ ਕੇ ਉਨ੍ਹਾਂ ਦੇ ਕੱਪੜਿਆਂ ਉੱਤੇ ਫੈਲ ਗਿਆ। ਜਦੋਂ ਉਹ ਪਹੁੰਚੇ, ਤਾਂ ਗੁਰੂ ਜੀ ਦੀ ਪਤਨੀ, ਮਾਤਾ ਸੁਲੱਖਣੀ ਜੀ, ਇਕ ਮਹਿਮਾਨ ਤੋਂ ਅਜਿਹਾ ਕੰਮ ਕਰਵਾਏ ਜਾਣ ਉੱਤੇ ਦੁਖੀ ਹੋਏ। ਜਿਵੇਂ ਮੈਕਾਲਿਫ਼ ਨੇ ਇਸ ਪਰੰਪਰਾ ਨੂੰ ਦਰਜ ਕੀਤਾ ਹੈ, ਗੁਰੂ ਨਾਨਕ ਨੇ ਕਿਹਾ ਕਿ ਲਹਿਣੇ ਦੇ ਕੱਪੜਿਆਂ ਉੱਤੇ ਚਿੱਕੜ ਨਹੀਂ। ਇਹ ਕੇਸਰ ਹੈ, ਮਾਣ ਦਾ ਰੰਗ।", "a": "ਇਹ ਪਉੜੀ ਉਸ ਇਨਸਾਨ ਦੀ ਗੱਲ ਕਰਦੀ ਹੈ ਜੋ ਸੁਣਦਾ ਹੈ, ਮੰਨਦਾ ਹੈ, ਤੇ ਦਿਲ ਵਿਚ ਪਿਆਰ ਰੱਖਦਾ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਅਜਿਹਾ ਇਨਸਾਨ ਆਪਣੇ ਅੰਦਰਲੇ ਪਵਿੱਤਰ ਸਰੋਵਰ ਵਿਚ ਨ੍ਹਾਉਂਦਾ ਹੈ। ਇੱਥੇ ਪਿਆਰ ਸਿਰਫ਼ ਇਕ ਅਹਿਸਾਸ ਨਹੀਂ ਜੋ ਸਾਨੂੰ ਮਿਲਦਾ ਹੈ। ਇਹ ਕੁਝ ਹੈ ਜੋ ਅਸੀਂ ਸਾਂਭਦੇ ਹਾਂ, ਤੇ ਕੁਝ ਜੋ ਅਸੀਂ ਕਰਦੇ ਹਾਂ। ਭਾਈ ਲਹਿਣੇ ਨੇ ਸਿਫ਼ਤ ਲਈ ਘਾਹ ਨਹੀਂ ਚੁੱਕਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਪਿਆਰ ਕਰਕੇ ਚੁੱਕਿਆ। ਤੇ ਗੁਰੂ ਨਾਨਕ ਨੇ ਉਹ ਪਿਆਰ ਪੂਰਾ ਵੇਖਿਆ। ਜਿੱਥੇ ਦੂਜਿਆਂ ਨੂੰ ਗੰਦ ਦਿਸਿਆ, ਉਨ੍ਹਾਂ ਨੂੰ ਕੇਸਰ ਦਿਸਿਆ। ਸੱਚਾ ਪਿਆਰ ਮਿਲਣਾ ਇਉਂ ਹੀ ਲੱਗਦਾ ਹੈ। ਕੋਈ ਠੀਕ ਉਸੇ ਚੀਜ਼ ਨੂੰ ਵੇਖੇ ਜਿਸ ਨੂੰ ਤੁਸੀਂ ਭੈੜਾ ਸਮਝਦੇ ਸੀ, ਤੁਹਾਡੀ ਥਕਾਵਟ, ਤੁਹਾਡੀ ਮਿਹਨਤ, ਤੁਹਾਡੀ ਖਿੱਲਰੀ ਹਾਲਤ, ਤੇ ਉਸ ਵਿਚ ਸੁੰਦਰਤਾ ਵੇਖੇ। ਤੁਹਾਡੀ ਅਣਦਿਸਦੀ ਮਿਹਨਤ ਕਦੇ ਬੇਕਾਰ ਨਹੀਂ ਜਾਂਦੀ।", "b": "ਸਾਨੂੰ ਸਾਰਿਆਂ ਨੂੰ ਕਦਰ ਮਹਿਸੂਸ ਹੋਣ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ, ਤੇ ਸਾਡਾ ਬਹੁਤ ਸਾਰਾ ਪਿਆਰ ਰੋਜ਼ ਦੇ ਜੀਵਨ ਵਿਚ ਅਣਦੇਖਿਆ ਰਹਿ ਜਾਂਦਾ ਹੈ। ਮਾਂ ਦੀਆਂ ਦਸ ਹਜ਼ਾਰ ਰੋਟੀਆਂ। ਕਿਸੇ ਦੋਸਤ ਦੀ ਦੇਰ ਰਾਤ ਦੀ ਮਦਦ। ਮਨੋਵਿਗਿਆਨੀ ਜੌਨ ਗੌਟਮੈਨ ਨੇ ਦਹਾਕਿਆਂ ਤਕ ਜੋੜਿਆਂ ਉੱਤੇ ਅਧਿਐਨ ਕੀਤਾ, ਤੇ ਵੇਖਿਆ ਕਿ ਛੋਟੇ ਪਲ ਬਹੁਤ ਮਾਇਨੇ ਰੱਖਦੇ ਹਨ: ਇਕ ਦੂਜੇ ਵੱਲ ਧਿਆਨ ਦੇਣਾ, ਧੰਨਵਾਦ ਕਰਨਾ, ਇਕ ਦੂਜੇ ਵੱਲ ਮੁੜਨਾ। ਚੰਗੀ ਖ਼ਬਰ ਇਹ ਹੈ ਕਿ ਧਿਆਨ ਦੇਣ ਵਾਲੇ ਅਸੀਂ ਆਪ ਬਣ ਸਕਦੇ ਹਾਂ। ਜਦੋਂ ਤੁਸੀਂ ਕਹਿੰਦੇ ਹੋ, ਮੈਂ ਵੇਖਿਆ ਤੂੰ ਕਿੰਨੀ ਮਿਹਨਤ ਕੀਤੀ, ਤਾਂ ਤੁਸੀਂ ਕਿਸੇ ਦੇ ਚਿੱਕੜ ਨੂੰ ਕੇਸਰ ਬਣਾ ਦਿੰਦੇ ਹੋ। ਤੇ ਜਦੋਂ ਕੋਈ ਤੁਹਾਡੇ ਵੱਲ ਧਿਆਨ ਨਾ ਦੇਵੇ, ਤਾਂ ਭਾਈ ਲਹਿਣੇ ਨੂੰ ਯਾਦ ਕਰੋ। ਸਾਫ਼ ਦਿਲ ਨਾਲ ਦਿੱਤਾ ਪਿਆਰ ਆਪਣੇ ਆਪ ਵਿਚ ਪੂਰਾ ਹੈ। ਉਸ ਨੂੰ ਸੱਚਾ ਹੋਣ ਲਈ ਤਾੜੀਆਂ ਦੀ ਲੋੜ ਨਹੀਂ। ਫਿਰ ਵੀ, ਲੋਕਾਂ ਨੂੰ ਦੱਸਣਾ ਚੰਗਾ ਹੈ ਕਿ ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿਆਰ ਕਰਦੇ ਹੋ। ਉਡੀਕ ਨਾ ਕਰੋ।", "t": "ਅੱਜ ਕਿਸੇ ਇਕ ਇਨਸਾਨ ਦੀ ਚੁੱਪ ਚਾਪ ਕੀਤੀ ਮਿਹਨਤ ਵੱਲ ਧਿਆਨ ਦਿਓ, ਘਰ ਜਾਂ ਕੰਮ ਉੱਤੇ, ਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸਾਫ਼ ਸਾਫ਼ ਕਹੋ: ਮੈਂ ਵੇਖਿਆ ਤੁਸੀਂ ਕੀ ਕੀਤਾ। ਸ਼ੁਕਰੀਆ।", "q": "ਤੁਹਾਡੀ ਮਾਂ ਸਾਲਾਂ ਤੋਂ ਹਰ ਰੋਜ਼ ਪਰਿਵਾਰ ਲਈ ਖਾਣਾ ਬਣਾਉਂਦੀ ਹੈ। ਆਮ ਤੌਰ ਉੱਤੇ ਕੋਈ ਕੁਝ ਨਹੀਂ ਕਹਿੰਦਾ। ਅੱਜ ਰਾਤ ਤੁਸੀਂ ਕੀ ਕਰ ਸਕਦੇ ਹੋ?", "o": ["ਕੁਝ ਨਹੀਂ, ਮਾਂ ਦਾ ਖਾਣਾ ਬਣਾਉਣਾ ਤਾਂ ਆਮ ਗੱਲ ਹੈ", "ਉਨ੍ਹਾਂ ਨੂੰ ਦੱਸਣਾ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਖਾਣੇ ਵਿਚ ਤੁਹਾਨੂੰ ਕੀ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਤੇ ਧੰਨਵਾਦ ਕਰਨਾ", "ਉਨ੍ਹਾਂ ਬਾਰੇ ਔਨਲਾਈਨ ਪੋਸਟ ਪਾਉਣੀ"], "y": "ਬਹੁਤ ਸੋਹਣਾ। ਇਕ ਸਾਫ਼ ਸਾਫ਼ ਧੰਨਵਾਦ ਸਾਲਾਂ ਦੀ ਅਣਦਿਸਦੀ ਮਿਹਨਤ ਨੂੰ ਕੇਸਰ ਬਣਾ ਦਿੰਦਾ ਹੈ। ਉਨ੍ਹਾਂ ਦਾ ਚਿਹਰਾ ਵੇਖਣਾ। ਉਹ ਛੋਟਾ ਜਿਹਾ ਵਾਕ ਤੁਹਾਡੀ ਸੋਚ ਤੋਂ ਵੱਧ ਮਾਇਨੇ ਰੱਖੇਗਾ।", "n": "ਸਾਡੇ ਵਿਚੋਂ ਬਹੁਤੇ ਇਹੀ ਕਰਦੇ ਹਨ, ਬਿਨਾਂ ਕੋਈ ਮਾੜਾ ਇਰਾਦਾ ਰੱਖੇ। ਉਨ੍ਹਾਂ ਦਾ ਕੰਮ ਏਨਾ ਆਮ ਹੋ ਗਿਆ ਹੈ ਕਿ ਅਸੀਂ ਉਸ ਨੂੰ ਵੇਖਣਾ ਬੰਦ ਕਰ ਦਿੰਦੇ ਹਾਂ। ਉਨ੍ਹਾਂ ਨੂੰ ਸਿੱਧਾ ਦੱਸ ਕੇ ਵੇਖੋ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਖਾਣੇ ਵਿਚ ਤੁਹਾਨੂੰ ਕੀ ਪਸੰਦ ਹੈ, ਤੇ ਧੰਨਵਾਦ ਕਰੋ। ਵੇਖੇ ਜਾਣਾ ਇਕ ਅਜਿਹਾ ਤੋਹਫ਼ਾ ਹੈ ਜੋ ਅਸੀਂ ਹਰ ਰੋਜ਼ ਦੇ ਸਕਦੇ ਹਾਂ।"}}}, SCEN = [{"id": "trek1", "cat": "joy", "g": "nature1", "ti": "Summit snacks", "s": "You and four friends finally reach the top of a mountain trail after a three hour climb. The view is unreal: snow peaks, clouds below your feet, everyone laughing and out of breath. Out come the chips, biscuits and juice boxes. A gust of wind snatches two wrappers and they land between the rocks. Kabir shrugs. Look around, he says, people have left bottles everywhere already. Two more wrappers will not change anything. Some of the others nod and start packing up to head down.", "q": "What do you do before you all start walking down?", "o": ["Leave it. The hill is already littered, and it is not your mess alone", "Pick up your wrappers and a few others, and carry them down to a bin", "Give everyone a loud lecture about pollution right there"], "ans": 1, "y": "Lovely choice. You did not wait for a rule or an audience, you just took care of the place that gave you that view. A tip for next time: carry one empty cloth bag on every trek. It turns picking up litter into a two minute habit instead of a big decision.", "n": "That is a very human reaction, and it shows you care about the right thing. Here is the catch. When a place already looks dirty, people feel allowed to make it dirtier, and the litter grows. Lectures usually make people defensive. The quiet move works better: pick up yours, pick up a few more, and let your friends see you do it. Most people quietly copy what they see.", "k": "Guru Har Rai loved gardens. Sikh tradition remembers that as a young man he once walked past a flowering bush, and his wide robe caught it. Petals fell to the ground. His grandfather, Guru Hargobind, said gently that if you wear a wide robe, you must carry it carefully so it does not harm what grows around you. Guru Har Rai never forgot it. All his life he walked carefully around living things, and he kept a large garden of healing plants open to anyone in need.", "x": "Japji Sahib ends by calling air our Guru, water our father and the earth our great mother. Nobody throws wrappers in their mother's courtyard. Think of the wide robe as your own footprint: your bag, your vehicle, your snacks. You are allowed to enjoy the world fully, you just carry yourself carefully in it. There is also simple psychology here. Researchers who study broken windows and litter found that visible mess invites more mess, and a clean spot tends to stay clean. So your two minutes of picking up do more than remove two wrappers. They change what the next group of trekkers thinks is normal."}, {"id": "dj1", "cat": "civic", "g": "mind1", "ti": "Wedding DJ at 1 AM", "s": "It is your cousin's sangeet and the night is going brilliantly. The DJ is playing every song you love, your aunts are dancing, and even your shy uncle is on the floor. Then your phone buzzes. It is the neighbour from the next house. His father is unwell and has a hospital check up at seven in the morning, and his daughter has a board exam. It is past one. Your cousin says, it is a wedding, it happens once in a lifetime, they will understand.", "q": "You are standing near the DJ. What do you suggest?", "o": ["Ignore the call. Weddings are allowed to be loud", "Ask the DJ to lower the volume now, move the dancing indoors, and send the neighbour a warm sorry", "Stop the party completely and send everyone home"], "ans": 1, "y": "Beautiful balance. You kept the joy alive and still made room for a family you will see every day after the wedding is over. One more idea: next morning, send that house a box of the wedding sweets. Small gestures like that turn a complaint into a friendship.", "n": "Your heart is in the right place, and it is not easy to think clearly at one in the morning with music in your ears. The thing to remember is that celebration and consideration are not enemies. Ignoring the call makes the neighbours pay for your joy. Ending the party punishes everyone. Turning it down, moving inside and saying sorry warmly lets both families have a good night.", "k": "The Janamsakhis tell that when Guru Nanak reached Multan, the holy men of the city sent him a bowl filled with milk right to the brim. The message was clear: this city is already full of teachers, there is no room for you. Guru Nanak smiled, picked a small jasmine flower and laid it on top of the milk. It floated without spilling a drop. He sent the bowl back. I will not take your space, he was saying. I will only add a fragrance.", "x": "Japji Sahib asks us to see all people as our own fellowship, and to win our own mind first. Your neighbour's sleeping father is part of that fellowship, even during your cousin's wedding. Be the jasmine flower: celebrate fully, but without spilling over into other people's lives. A good test for any celebration is simple. Would I be happy if the house next door did this to me tonight? If not, adjust the volume, the time or the place. A wedding that leaves the street smiling is a far better memory than one that leaves the street angry."}, {"id": "queue1", "cat": "civic", "g": "comp1", "ti": "The queue jumper", "s": "Summer afternoon at the railway reservation counter. The queue is long, the fan is weak, and you have been standing for forty minutes. Right ahead of you is an old man with a cloth bag and a young mother holding a sleepy baby. Then a well dressed man walks straight to the window, says sorry, very urgent, and pushes his form in. The clerk takes it. Your friend whispers, if he can do it, let us also find someone near the front.", "q": "What is the most sensible thing to do?", "o": ["Find a shortcut too, everyone does it", "Politely but clearly say: sir, there is a line, please join it. And let the old man and the mother go ahead of you", "Start shouting and filming him for social media"], "ans": 1, "y": "Well done. You stood up for fairness without turning it into a fight, and you went one step further by making space for people who needed it more. That is real strength. Saying the rule calmly, in a normal voice, works more often than people expect.", "n": "It is completely understandable. Heat, waiting and unfairness push anyone toward either joining in or blowing up. But a shortcut makes the line worse for the old man and the baby, and shouting usually makes the other person dig in. A calm, clear sentence names the problem and gives him an easy way to step back. And letting the most tired people go first turns your frustration into kindness.", "k": "At Khadur, during the time of Guru Angad, his wife Mata Khivi ran the langar, the free community kitchen. The bards Balwand and Satta later sang about it in a hymn now in Guru Granth Sahib: they praised Khivi as a noble soul whose shade was wide and cool, and they said that in her langar the wealth of the Guru was shared out, and rich kheer was served to all. Rich and poor, high caste and low, sat in the same row and were served the same food.", "x": "Japji Sahib says simply that no one is high and no one is low. A queue is one of the most everyday ways a society says the same thing: your time is worth as much as mine. When someone jumps the line, they are quietly saying their time matters more than the old man's. Mata Khivi's langar showed the opposite: one row, one food, one dignity. You do not need to be aggressive to protect that. A calm sentence, a firm tone, and a little extra kindness for the weakest people in line is exactly how fairness is kept alive in daily life."}, {"id": "river1", "cat": "nature", "g": "loved1", "ti": "Flowers in the river", "s": "After a family prayer at home, your aunt hands you two big plastic bags. Inside are old flowers, used diyas, a framed picture with cracked glass, and some old cloth. On the way back from the market she asks the driver to stop on the bridge. Throw it all in the river, beta, she says, that is the proper way to respect these things. Below the bridge you can see the water is already grey, with plastic caught along the banks.", "q": "How do you handle this?", "o": ["Throw the bags in. Arguing with elders is disrespectful", "Respectfully suggest another way: flowers into a compost pit or under a tree, glass and plastic to recycling, cloth to someone who can use it", "Refuse flatly and tell her it is all superstition"], "ans": 1, "y": "That was thoughtful and kind. You honoured what your aunt cares about, respect for sacred things, and simply offered a way that does not hurt the river. Most elders soften when they feel their feelings are taken seriously. You could even make it a family habit with a small compost corner at home.", "n": "It is hard to say no to an elder, and your wish to keep peace is a good one. But respect is not the same as silence. Plastic and glass do not become holy in a river, they choke it. On the other hand, calling her beliefs superstition will only hurt her. The middle way respects both her heart and the river: suggest gently, give her an easy alternative, and help her do it.", "k": "The Janamsakhis tell that Guru Nanak once reached Hardwar on the Ganga, where crowds were throwing water toward the rising sun, as an offering for their ancestors. Guru Nanak turned and began throwing water toward the west. People laughed and asked what he was doing. I am watering my fields back in Punjab, he said. If your water can reach your ancestors in the next world, surely mine can reach my fields a few hundred miles away. The laughter turned into a conversation about what offerings really mean.", "x": "Japji Sahib says that whoever listens, trusts and holds love in the heart bathes in the sacred pool within. The real pilgrimage is inward. That frees us to treat rivers as what they also are: drinking water for millions, homes for fish and birds, the lifeline of farms. Guru Nanak did not insult the people at Hardwar. He used a gentle, almost playful act to make them think. You can do the same with your family. Ask questions, offer a practical alternative, and show respect for the feeling behind the ritual, while keeping plastic and glass out of the water."}, {"id": "honk1", "cat": "civic", "g": "anger1", "ti": "Stuck in traffic", "s": "You are in your friend Arjun's car, already fifteen minutes late for a movie the whole gang has booked. The road is jammed. Arjun keeps his hand on the horn, then starts eyeing the footpath where an old man is walking with a stick and two kids are coming home from school. Bas, I will just go from the side, he says. The cars around you are honking too, and everyone looks tense.", "q": "What do you say to Arjun?", "o": ["Nothing. It is his car and his decision", "Say calmly: bro, the movie can wait, the footpath cannot. Message the gang that you will be late, and put on a song", "Grab the wheel and start a big fight"], "ans": 1, "y": "Perfect. You protected people on the footpath and also cooled your friend down, without making him feel attacked. Messaging the gang takes away the reason for the hurry. Putting on a song takes away the tension. Small moves, big difference.", "n": "It is not easy to speak up in someone else's car, and you clearly wanted to avoid trouble. But staying silent while a friend endangers walkers is not neutral, it is helping. A fight in a moving car is also dangerous. The calm sentence works best: remove the hurry by telling the others you are late, and give your friend a way to relax without losing face.", "k": "Sikh tradition tells that the Mughal emperor Humayun, after losing his throne to Sher Shah, came to Khadur to see Guru Angad. The Guru was absorbed in the singing of hymns and did not rise at once to greet him. Humayun, proud and hurt, put his hand on his sword. Guru Angad looked at him calmly and said: when you needed this sword against Sher Shah, it stayed in its sheath. Now you draw it in a place of prayer? Humayun felt ashamed, calmed down, and asked for the Guru's blessing.", "x": "Japji Sahib compares a good life to a goldsmith's workshop, with self control as the workshop and patience as the goldsmith. Traffic is a daily test of that workshop. Honking non stop, driving on the footpath, cutting lanes: all of it is anger looking for a target. Humayun's sword was pointed at the wrong person, and so is a car on a footpath. The useful question in a jam is: what is actually in my control? Usually just two things, your message to the people waiting, and your own breathing. Do those well, and the minutes pass far more peacefully."}, {"id": "salary1", "cat": "family", "g": "content1", "ti": "First salary", "s": "Your first salary has just landed in your account. You have been dreaming about this day for years. The new phone you wanted is in your cart, and your friends are already planning where you will treat them. At dinner your mother says, so proud of you, beta, and then quietly mentions that your younger cousin's school fees are pending this month, and that your grandfather always kept aside a little from every earning for someone in need.", "q": "What do you do with this first salary?", "o": ["Spend it all on yourself. You earned it", "Buy something for your parents, set aside a small share for someone in need, save a bit, and still enjoy a treat with friends", "Hand over the whole salary and feel guilty about wanting anything"], "ans": 1, "y": "What a lovely start to your working life. You celebrated, you honoured your parents, and you built in sharing from day one. Many people say that sharing becomes easier when it is automatic, so you might set up a small monthly transfer now, while the habit is fresh.", "n": "That is a natural feeling, and wanting to enjoy your own effort is not wrong at all. The point is balance. Spending everything on yourself can leave the joy feeling thin very quickly, and giving everything away with guilt is not healthy either. The beautiful path is in between: enjoy, honour family, save, and share a small fixed part. That mix tends to keep people both happy and generous for years.", "k": "The emperor Akbar once visited Guru Amar Das at Goindwal. Before meeting the Guru, he sat on the floor and ate in the langar like everyone else. Impressed, he offered the Guru the revenue of several villages, so that the langar would never run short. Sikh tradition remembers that Guru Amar Das politely declined. The langar, he explained, runs on the honest earnings and willing sharing of the sangat. It belongs to everyone because everyone gives a little.", "x": "Japji Sahib speaks of contentment as earrings and honest effort as your bowl and bag. Your salary is that honest effort. Contentment is knowing how much is enough, and that what is extra can flow outward. Guru Amar Das did not want a langar funded by one rich patron, because sharing is meant to be everyone's habit. Psychology research on spending agrees in its own way: money spent on other people tends to bring more lasting happiness than money spent only on ourselves. So enjoy the phone, buy your mother something she would never buy herself, and give a small share. That is a full, happy first salary."}, {"id": "cricket1", "cat": "friends", "g": "purpose1", "ti": "The broken window", "s": "Sunday evening street cricket. Your friends bowl, you swing hard, and the ball flies over the wall straight through the glass window of Sharma aunty's house. There is a crash, then silence. The lights inside are off. Everyone is staring at you. Run, run, someone hisses, nobody saw, she is not even home. Two of your friends are already grabbing the stumps.", "q": "What do you do?", "o": ["Run with everyone. Nobody saw", "Wait, ring the bell or leave a note with your number, and offer to pay for the glass from pocket money", "Blame the bowler for bowling a bad ball"], "ans": 1, "y": "That took real courage. Owning up when nobody is watching is the clearest sign of character there is. Here is a bonus tip: when you speak to her, apologise first, offer to pay second, and ask if you can help clean up third. People remember that order.", "n": "Almost everyone feels that urge to run, so do not be hard on yourself. But think about how it feels from the other side: coming home to broken glass and no explanation. Running teaches your own mind that hiding works. Blaming someone else damages a friendship. Owning up costs a little money and a few awkward minutes, and buys you trust that lasts for years.", "k": "As a young man Guru Nanak worked as the storekeeper of the government granary at Sultanpur. The Janamsakhis tell that while weighing grain for people, he would count: one, two, three, all the way to thirteen. Thirteen in Punjabi is tera, which also means yours. At tera he would stop counting and keep repeating, tera, tera, yours, yours, lost in the thought that everything belongs to the One. Some people complained that he was giving away too much. The stores were checked, and the accounts were found to be in order.", "x": "Japji Sahib begins with a question: how do we become truthful, and how is the wall of falsehood broken? The answer is not one big act of honesty. It is small honest acts when nobody is checking. Guru Nanak's accounts were clean even when people suspected him. A broken window is a small thing, but running from it builds a small wall of hiding inside you. Owning it knocks that wall down. Research on character also shows that confessing a mistake early tends to increase trust, not reduce it. People forgive the window. They remember the honesty."}, {"id": "grandma1", "cat": "family", "g": "listen1", "ti": "Grandma's kitchen", "s": "It is Sunday, and your grandmother has finally agreed to teach you her famous rajma. You set up your phone to film it for your channel. But she is slow. She keeps stopping to tell stories: how her mother cooked on a clay stove, how she made this dish when your father passed his exams. Your video is getting long and your patience is getting short. Dadi, just tell me the steps, you almost say.", "q": "What would make this afternoon a good one?", "o": ["Hurry her along. You can edit the stories out later", "Put the phone down for a while, ask her more about those stories, and just cook together", "Give up and find a recipe online"], "ans": 1, "y": "That is such a precious choice. The recipe is online in a hundred versions, but her stories exist only in her memory. You might later write some of them down, or record a separate video just of her talking. One day those recordings will feel like treasure.", "n": "It is easy to slip into hurry mode, especially when you are focused on a goal, so that is nothing to feel bad about. But think about what is actually rare here. Steps for rajma are everywhere. Your grandmother's memories, her voice and her way of telling them are not. Slowing down and truly listening turns a cooking lesson into a family memory you will carry for life.", "k": "Sikh tradition tells of a young boy named Bura who would bring milk to Guru Nanak when he passed his village. One day the boy asked serious questions about life and death. The Guru asked why a child was thinking such old thoughts. The boy said he had watched his mother light the stove. The small twigs always caught fire first, before the big logs. So death does not wait for old age, he said. Guru Nanak smiled and said, you speak like an elder. From then on he was called Bhai Buddha, the wise old one, and he lived to serve six Gurus.", "x": "Japji Sahib says that by truly listening, pain and wrongdoing fall away. Listening is not waiting for your turn to talk, or for someone to finish so you can move on. It is giving your full attention. Bhai Buddha's story works in two directions: the young can carry wisdom, and the old carry memories that the young cannot get anywhere else. When you listen to your grandmother's stories, you are also telling her she still matters. Psychologists have found that when older people share their life stories and feel heard, their mood and sense of meaning improve. Your patience is a gift to both of you."}, {"id": "beach1", "cat": "nature", "g": "action1", "ti": "Beach at 7 AM", "s": "You are on a holiday by the sea with friends. Last night was amazing, and the plan today is to sleep late, then a long lunch. As you walk back to the hotel, you see a poster: beach clean up, tomorrow seven to eight, gloves and bags provided. The sand near the rocks is full of bottles and chips packets. Your friends laugh. Bro, we are on vacation, not on duty.", "q": "What do you do?", "o": ["Skip it. Holidays are for rest", "Set an alarm, join for that one hour, and then enjoy the rest of the day", "Only take a few photos at the clean up for your story"], "ans": 1, "y": "Amazing. One hour of your holiday leaves a whole beach better for the people and turtles who come after you. And something nice usually happens: you meet locals, see a quieter side of the place, and come back to breakfast feeling great. Maybe one of your friends tags along next time.", "n": "That is a fair instinct. Rest matters, and holidays are precious. But this is only one hour, and it gives back to the place that is giving you such a good time. Photos without helping leave nothing behind. Joining in, even briefly, means you leave the beach a little better than you found it, and your holiday memories end up richer too.", "k": "When Guru Ram Das began building the city that became Amritsar, the great pool at its centre was dug by hand. Sikh tradition remembers that the Guru and the sangat worked side by side, carrying baskets of earth. That spirit of kar seva, voluntary service with your own hands, never stopped. Even in recent decades, when the sarovar needed cleaning, thousands of volunteers from all walks of life came together to carry out the silt, singing as they worked.", "x": "Japji Sahib says you yourself sow the seed and you yourself eat the harvest. A clean beach is a harvest that many people planted, one bag at a time. Kar seva teaches that public places are not someone else's job. They are shared homes that we keep up together. Notice also that the Amritsar volunteers sang while they worked. Service does not have to be grim. It can be joyful and social. One hour on a sunny beach with strangers who care about the same thing might end up being your favourite part of the trip."}, {"id": "neem1", "cat": "nature", "g": "nature1", "ti": "The old neem tree", "s": "There is a huge old neem tree in the corner of your housing society. Kids play under it, birds nest in it, and in summer it is the coolest spot around. At the society meeting, the committee proposes cutting it down to make space for four more parking spots. Everyone is tired of parking fights, and the vote looks easy. Your neighbour says, it is just one tree, we can plant saplings somewhere.", "q": "What do you do at the meeting?", "o": ["Stay quiet. Parking is a real problem", "Speak up: suggest other parking ideas, explain what the tree gives everyone, and offer to help find a solution together", "Threaten to complain to the police and walk out"], "ans": 1, "y": "Very well done. You did not just oppose, you helped solve the real problem. A big tree gives shade, cooler air, cleaner air and a home to birds that saplings will take twenty years to replace. You might even propose a parking rotation and a small tree committee. Constructive voices like yours change outcomes.", "n": "It is fair to see the parking problem as real, it is. And walking out in anger is understandable when you love something. But silence lets a twenty year gift disappear in five minutes, and threats close people's ears. The strongest position is to respect the problem, share what the tree gives everyone, and come with alternative ideas. People can be persuaded when they feel heard.", "k": "Sikh tradition in the dry Malwa region of Punjab remembers Guru Tegh Bahadur travelling through villages where water was scarce. He encouraged people to dig wells and plant trees, and in several places he helped them do it. Some of those villages still point to old wells and groves linked with his visit. For him, caring for people meant caring for the water and the shade they depended on.", "x": "Japji Sahib calls air our Guru, water our father and the earth our mother. A big tree is all three working together: it cleans the air, holds water in the soil, and keeps the earth cool and alive. Guru Tegh Bahadur saw wells and trees as part of looking after people, not as decoration. In cities, studies keep showing that big trees lower street temperatures by several degrees and improve how people feel. So this is not tree versus people. The tree is for people. Your job at the meeting is to help everyone see that, while still solving the parking problem with them."}, {"id": "exam1", "cat": "study", "g": "action1", "ti": "Leaked paper", "s": "It is the night before your final exam. You have studied, but one chapter still scares you. At eleven, your class group explodes: someone has the leaked paper. Screenshots are flying. Your best friend messages you privately: everyone is using it, if you do not, you will score less than all of us. Your hand hovers over the image.", "q": "What do you do?", "o": ["Open it. Everyone else is anyway", "Do not open it. Revise the scary chapter for one focused hour and sleep well", "Open it and also forward it to other classes"], "ans": 1, "y": "That is real integrity, and it is harder than any exam question. You are building a mind you can trust. Here is a small tip for nights like this: mute the group, set a timer for fifty minutes on the hard chapter, then sleep. A rested brain often scores better than a panicked one.", "n": "That temptation is very real, and feeling it does not make you a bad person. But think about what the exam is for. A mark you did not earn does not teach you anything, and it trains your mind to look for shortcuts when things are hard. Forwarding it spreads the harm further. Closing the chat and doing one focused hour builds something real, both knowledge and self respect.", "k": "The Janamsakhis tell that when young Nanak was sent to the village teacher to learn letters, he asked the teacher an unusual question: what do these letters really mean? Not their sounds, but their meaning for life. Then the boy himself began explaining each letter as a lesson about truth and the One. The teacher was amazed. Learning, for Nanak, was never about passing; it was about understanding.", "x": "Japji Sahib says you yourself sow the seed and you yourself eat the harvest. Every exam is a seed. A leaked paper might give you a nice harvest of marks, but the knowledge field stays empty, and the next harder test, in college or at work, will find that emptiness. Young Nanak showed that the point of learning is meaning, not the score. There is also a practical point: research on studying shows that a short focused revision followed by proper sleep improves memory far more than late night cramming or panic. Integrity and good strategy point the same way tonight."}, {"id": "credit1", "cat": "work", "g": "ego1", "ti": "Who gets the credit?", "s": "At work, you came up with an idea that saves the team three hours every week. You shared it with your senior, Rohan, over chai. Today, in the big meeting, he presents it to the manager as his own plan. Everyone claps. Rohan does not even look at you. Your face is burning, and your mind is already drafting an angry email to the whole team.", "q": "What is the wisest next step?", "o": ["Send the angry email to everyone right now", "Wait until you are calm, then speak to Rohan privately. Next time, share ideas in writing with the team, and make sure your contribution is visible", "Say nothing ever, and stop sharing ideas"], "ans": 1, "y": "Very mature. You protected your dignity without burning bridges, and you learned a practical lesson about making your work visible. In many workplaces, a short email that says, sharing an idea I had, works wonders. You can also give credit generously to others, people tend to return that.", "n": "That anger is completely valid, and anyone would feel it. The question is what actually helps you. A public angry email usually makes you look like the problem, even when you are right. Staying silent forever teaches you to hide your best ideas. The calm, private conversation plus a smarter habit of documenting ideas protects you and keeps the door open.", "k": "When Guru Arjan compiled the Adi Granth in 1604, he included the hymns of the Sikh Gurus, and also the hymns of saints from other backgrounds: Kabir the weaver, Ravidas the leatherworker, Sheikh Farid the Sufi, Namdev the tailor and many more. Each hymn was kept under its author's own name. No one's words were absorbed into someone else's. Centuries later, their names are still sung every day.", "x": "Japji Sahib says that everyone lives inside hukam, the great order of things, and that one who understands this stops saying I, I. That cuts both ways. Rohan's ego wanted the credit. Yours, quite naturally, wants it back. Guru Arjan showed a different culture: give credit by name, generously, and let good work stand on its own. You cannot control Rohan, but you can protect your work by sharing it openly, speak to him calmly and honestly, and build a reputation for giving credit to others. Over time, that reputation does more for you than any one idea."}, {"id": "sister1", "cat": "family", "g": "joy1", "ti": "Sister's big day", "s": "Your younger sister has topped the state in her board exams. The house is full of relatives, sweets and phone calls. Reporters even came. You are honestly proud of her, but you also notice nobody has asked about your new job, and an uncle jokes, at least one child in this house is a topper. You laugh along, but something stings inside.", "q": "How do you handle the feeling?", "o": ["Go to your room and sulk for the evening", "Admit the sting to yourself, then celebrate her fully: hug her, make her favourite dish, and tell her what this means to you", "Make a sarcastic comment about marks not mattering in real life"], "ans": 1, "y": "That is a big heart. You noticed your own feeling honestly and still chose to make her day bigger. That is what makes a family strong. Later, you could tell a parent quietly that the uncle's joke hurt a bit. Feelings shared calmly do not grow into resentment.", "n": "The sting is real and completely normal. Everyone feels that when attention goes elsewhere, so please do not judge yourself. The trouble is that sulking or sarcasm takes the joy away from her on one of the best days of her life, and it does not heal your sting either. Celebrating her, while being honest with yourself about the feeling, is how you both end up feeling loved.", "k": "Bhai Lehna came to Guru Nanak as a devoted seeker and served him for years. When the time came, Guru Nanak chose him as the next Guru and gave him a new name: Angad, which means a part of my own body. Guru Nanak did not treat his successor's rise as a loss for himself. He saw Angad's light as his own light shining on. Sikh tradition calls it one flame lighting another.", "x": "Japji Sahib says that those whose hearts are turned to the One are always in bloom. That blooming is not a competition. A sister's success is not your failure, it is your family's flower opening. Guru Nanak named his successor a part of my own body, the most beautiful way of saying: your success is mine too. Psychologists even have a word for the joy you feel in someone else's happiness, sometimes called sympathetic joy. It is a muscle. The more you use it, the stronger and lighter you become."}, {"id": "puppy1", "cat": "nature", "g": "lonely1", "ti": "Puppy on the road", "s": "You are rushing to an important office meeting on your scooter. At a crossing you see a small puppy limping on the side of the road, whimpering, its leg bleeding. Cars are swerving around it. People glance and keep going. You check the time: you have twelve minutes to reach on time.", "q": "What do you do?", "o": ["Keep going. Someone else will help", "Pull over safely, move the puppy off the road, call a local animal rescue or a friend nearby, and message your office that you will be a few minutes late", "Feel bad about it all day but do nothing"], "ans": 1, "y": "That was kind and smart. You helped without putting yourself in danger, and you handled the meeting honestly too. Most managers respect a short message like that. Saving one animal rescue number in your phone today will make the next time much easier.", "n": "That is such a common feeling: someone else will help. The trouble is that everyone is thinking the same thing, which is exactly why nobody stops. Feeling bad without acting does not help the puppy. A few minutes of action, done safely, plus a short honest message to your office, solves both problems.", "k": "Guru Har Rai kept a large herbal garden and dispensary at Kiratpur, open to anyone who needed medicine. Sikh tradition remembers that when Dara Shikoh, a son of the emperor Shah Jahan, fell seriously ill and the royal doctors could not find the rare herbs they needed, a request came to the Guru. The emperor's family had been hostile to the Gurus before. Still, Guru Har Rai sent the medicine. Healing, he showed, does not ask which side you are on.", "x": "Japji Sahib says all living beings have one Giver. A limping puppy on a busy road is one of those beings, and today you happen to be the one passing by. Guru Har Rai's dispensary was open to everyone, even those who had been unkind. Caring does not depend on whether someone deserves it or can pay you back. There is also a well known pattern in psychology called the bystander effect: the more people who see someone in trouble, the less likely any single person is to help. Knowing this helps you break it. Be the one who stops."}, {"id": "dinner1", "cat": "family", "g": "mind1", "ti": "Phones at dinner", "s": "Family dinner on a Sunday. Your mother made everyone's favourite food. But your brother is on his phone watching a match, your father is checking office mails, and you are halfway through a reel. Your mother stops serving and says quietly, I feel like I am eating alone with four phones. There is an awkward silence.", "q": "What could make this moment better?", "o": ["Say you are just checking one thing and keep scrolling", "Put your phone in another room, suggest a phone basket for dinners, and ask her something about her day", "Snap back that she is also always on WhatsApp"], "ans": 1, "y": "Lovely. You did not just fix tonight, you suggested a small system that makes it easier every night. A phone basket is simple, visible and fair for everyone. You might find that dinners slowly become the best part of your family's day again.", "n": "Getting defensive is a very natural reflex when someone points out something uncomfortable. And she might be on her phone at other times. But she was not on it right now, and she reached out honestly. Answering with blame just pushes everyone back into their screens. Putting the phone away and suggesting a family habit turns her sad moment into a warm one.", "k": "Bhai Gurdas, in his Vaars, describes the daily life of the community at Kartarpur in Guru Nanak's last years. In the early morning, Japji was recited. Through the day, people worked in the fields. In the evening, the Sodar hymns and the Aarti were sung together. Meals were shared in the langar. Work, prayer, food and company had a rhythm that brought everyone together each day.", "x": "Japji Sahib says: win your own mind, and you win the world. Phones are designed by very smart people to win your mind for as long as possible. Taking it back, even for one meal, is a small victory over that pull. The Kartarpur community had a rhythm of togetherness built into every day. Your family can too. Research on family meals keeps finding that regular shared meals are linked with better wellbeing for children and adults. A phone basket at dinner is a tiny rule with a big effect."}, {"id": "metro1", "cat": "civic", "g": "kind1", "ti": "Loud reels", "s": "You are on a crowded metro after a long day. A young man next to you is scrolling reels at full volume, laughing loudly. Across from him, an old woman is trying to rest her eyes, and a baby nearby keeps waking up and crying. Some people are glaring. One man mutters, should I film him and post it, he will learn.", "q": "What is the best way to handle this?", "o": ["Shout at him in front of everyone", "Lean over and say kindly: bhai, could you lower it a little, the baby is trying to sleep. Offer a spare earphone if you have one", "Film him secretly and post it online"], "ans": 1, "y": "Very well handled. Kind words in a normal voice give the other person an easy, dignified way to fix things, and most people do. Offering an earphone is a lovely touch. You turned a small conflict into a small kindness.", "n": "It is understandable to want to teach him a lesson, especially when you are tired. But shouting or filming him makes him feel attacked, and people who feel attacked usually get louder, not quieter. Posting someone online can also hurt them far more than the mistake deserves. A soft, specific request almost always works better, and it keeps the peace for everyone in the coach.", "k": "Baba Sri Chand, the elder son of Guru Nanak, was a respected ascetic with many followers. Sikh tradition tells that when he came to meet Guru Ram Das, he looked at the Guru's long flowing beard and asked, half teasing, why have you grown such a long beard? Guru Ram Das bowed and said, to wipe the feet of holy men like you. He bent forward as if to do so. Baba Sri Chand was deeply moved and embraced him. A soft answer had turned a sharp moment into love.", "x": "The Mool Mantar describes the One as nirbhau and nirvair: without fear and without enmity. Being nirvair does not mean accepting everything. It means you can ask for what is fair without turning the other person into an enemy. Guru Ram Das met a pointed question with humility, and the tension dissolved. In daily life, conflict research shows the same thing again and again: a calm, specific, respectful request is far more likely to change someone's behaviour than shaming or public attack. You can protect the baby's sleep and the young man's dignity at the same time."}, {"id": "bday1", "cat": "friends", "g": "comp1", "ti": "Birthday guest list", "s": "You and three friends are planning a surprise birthday dinner for your friend Meher. You make a group to plan it. When you suggest adding Simran, who sits with Meher every day in class, one friend says: no yaar, she is boring, she does not fit with our group. The others laugh and move on to choosing the cake. You know Simran will find out about the party.", "q": "What do you do?", "o": ["Go along with it. It is not your party alone", "Speak up kindly: Meher would want her there, and it costs us nothing to include her. Add her to the plan", "Leave the group in protest"], "ans": 1, "y": "That is a quiet act of real kindness. Being left out hurts far more than most people realise, and you just saved someone from that feeling. You might even find Simran turns out to be wonderful company once she feels welcome.", "n": "Going with the group is so natural, nobody wants to be the odd one out. And leaving in protest shows you care. But think about how Simran will feel when she sees the photos. Including someone usually costs very little, while excluding them can hurt for a long time. One kind sentence from you can change the whole group's choice.", "k": "Guru Nanak's closest companion for decades of travel was Bhai Mardana, a Muslim rabab player from a community of bards that many people of that time looked down on. Guru Nanak could have chosen anyone. He chose Mardana, walked thousands of miles with him, shared food with him and made his music part of every hymn. Sikh tradition remembers that their friendship crossed every line of caste and religion that society had drawn.", "x": "Japji Sahib says no one is high and no one is low. Friend groups quietly create their own high and low: cool and boring, inside and outside. Guru Nanak's friendship with Mardana broke those walls in a society full of them. Psychologists studying social rejection have found that being left out activates some of the same brain regions as physical pain. So inclusion is not a small thing. Adding one name to a guest list can be the difference between someone feeling invisible and someone feeling they belong."}, {"id": "run1", "cat": "joy", "g": "habit1", "ti": "Morning run with Dad", "s": "Your father has started running at six every morning, and he keeps asking you to join. Today he knocks on your door again. It is cold, your bed is warm, and you were scrolling till late. Through the window you can see a soft pink sky, and you can hear birds. He says, just one round of the park, and I will buy you hot chai after.", "q": "What do you do?", "o": ["Pull the blanket up. Maybe someday", "Get up, join him for just one round, and enjoy the chai together", "Promise to start a full fitness plan from next month"], "ans": 1, "y": "Wonderful. Big habits are built from small, easy starts, and one round with your father is the perfect size. You also got something better than exercise: quiet time with him at the most peaceful hour of the day. Try putting your phone away a little earlier tonight so tomorrow is even easier.", "n": "Warm blankets are powerful, and nobody is judging you for that. The trouble is that maybe someday and next month are usually the ways good intentions quietly disappear. A single small round today counts for more than a perfect plan for later. And the invitation is not only to run. It is to spend a calm morning with your father.", "k": "At Khadur, Guru Angad set up an akhara, a wrestling ground, often remembered as the Mal Akhara. Sikh tradition remembers that young people gathered there to exercise and wrestle, and that the Guru encouraged them to keep their bodies strong and healthy. A sound body was seen as part of a sound life, not as something separate from the spirit.", "x": "Japji Sahib praises the amrit vela, the calm hours before dawn, as a time for reflection on what is true. Many people find that the early morning is also when the body and mind feel freshest. Guru Angad's akhara shows that caring for the body is part of a full life. Habit research, made popular in books like Atomic Habits, says the best way to start is to make the habit so small it is hard to refuse: one round, not five kilometres. Showing up matters more than performance. And doing it with someone you love makes it something to look forward to."}, {"id": "diwali1", "cat": "nature", "g": "nature1", "ti": "Diwali night", "s": "It is Diwali. The house glows with diyas, the sweets are ready, and your cousins have bought a huge bag of crackers, the loud smoky kind. On the news this morning, the city's air quality was marked as severe, and your neighbour's little son has asthma. Your cousin says, it is once a year, let us have fun, and starts lining up the biggest ones.", "q": "What would you suggest?", "o": ["Burst them all. It is tradition", "Suggest keeping the diyas, sparklers in moderation and music, skip the big smoky ones, and maybe invite the neighbour's family to join the lights", "Refuse to celebrate and stay in your room"], "ans": 1, "y": "What a thoughtful way to celebrate. You kept the joy, the light and the togetherness, and dropped the part that hurts people's lungs. Inviting the neighbours turns your choice into a bigger celebration rather than a sacrifice. That is the real spirit of the festival of lights.", "n": "Wanting to enjoy the festival fully is beautiful, and refusing to join in shows you care, so both instincts come from a good place. But the biggest crackers mostly add smoke to air that is already making children sick, and staying in your room means the joy is lost too. The sweet spot is to keep the lights, the food and the people, and drop the thick smoke.", "k": "Sikhs celebrate Bandi Chhor Divas at Diwali time. Tradition tells that Guru Hargobind was held in Gwalior Fort, along with fifty two kings. When the order came to release the Guru, he refused to leave unless the kings were freed too. He was told that only those who could hold on to his cloak could leave with him. So he had a cloak made with fifty two long tassels, and every king walked out holding one. When he reached Amritsar, people lit lamps everywhere to welcome him.", "x": "Japji Sahib calls air our Guru. Diwali is the festival of light, not the festival of smoke. Guru Hargobind's celebration began with freedom for others: he would not walk out alone. That is a beautiful way to think about joy. Our celebrations should free people, not choke them. A child with asthma, an elderly neighbour, birds and street animals all share the same air. Lights, sweets, music, family and generosity are the heart of the festival. Keeping those and cutting the smoke makes it brighter for everyone."}, {"id": "flood1", "cat": "civic", "g": "hard1", "ti": "Flood relief", "s": "Heavy rains have flooded villages near your city. On the news you see families on rooftops and cattle in the water. Your college group is collecting supplies this weekend: dry rations, clean water, sanitary pads, medicines. You had planned to go to a concert with friends that day, and the tickets are already paid for. Your friend says, we can just donate online and go to the concert.", "q": "What do you do?", "o": ["Go to the concert and forget about it", "Talk to the organisers and see where you are most useful. If you can, give a few hours to sorting and packing, and donate too", "Post a sad story on social media about the floods and leave it there"], "ans": 1, "y": "That is beautiful. Relief work needs both money and hands, and you offered both with thought. Asking organisers where you are needed is exactly right, because untrained help can sometimes get in the way. Packing kits sounds small, but it is how relief actually reaches people.", "n": "Planning a fun day is not wrong, and donating online genuinely helps, so your friend has a point. But think about what you can give that money cannot: a few hours of your hands. Posting sadness alone does not reach anyone on a rooftop. Giving even part of the day to sorting and packing, and still donating, turns your concern into real help.", "k": "Sikh accounts tell that when a severe famine struck Lahore in the time of Guru Arjan, the Guru went to the city and stayed there to help. He organised free food and care for the suffering, and had a well with steps, a baoli, built so people would have water. He did not watch from far away. He went to where the pain was.", "x": "Japji Sahib says many live with pain, hunger and constant blows, and that even these are part of the Giver's order. That line is not an excuse to look away. It reminds us that suffering is part of the world we share, and that our response is our choice. Guru Arjan responded by being present: food, water, his own time. Disaster relief experts also say that well organised local volunteering, plus money to trusted groups, is one of the most useful forms of help. You can still enjoy concerts on other days. On this day, your hands matter."}, {"id": "water1", "cat": "civic", "g": "lonely1", "ti": "Water tanker", "s": "It is the peak of summer, and your area has had no piped water for four days. Your building has an underground tank, so your family is fine. The houses in the lane behind you are not, and you see families waiting with buckets for a tanker that keeps arriving late. When the tanker comes, someone from your building is filling your tank first, even though it is already half full.", "q": "What should your building do?", "o": ["Fill your tank first. You pay higher maintenance", "Let the families with nothing fill their buckets first, and offer them a few hours a day of water from your tank until supply returns", "Stay out of it. It is the tanker driver's job to decide"], "ans": 1, "y": "That is true neighbourliness. Water is the most basic need there is, and you made sure the people with nothing went first. Offering a few hours a day from your tank builds trust that will last long after the summer. You might also push your building to save water during the crisis, like fixing leaks and skipping car washes.", "n": "It is natural to protect your own family first, especially when you have paid for the facilities. But your family is already safe. The families in the back lane are not. Staying out of it lets the strongest take the most. Letting those with nothing go first, and sharing a little from your tank, costs your family very little and means a great deal to theirs.", "k": "At Goindwal, Guru Amar Das had a large stepwell built, a baoli with eighty four steps leading down to the water. It was open to everyone, whatever their caste, religion or status, at a time when access to wells was often restricted by caste. People came from far and wide. Clean water for all was one of the Guru's clearest teachings in stone.", "x": "Japji Sahib says that all living beings have one Giver, and asks that we never forget it. Water is the clearest example of a gift that belongs to everyone. Guru Amar Das did not build a baoli for one group. He built it so that anyone could walk down and drink. In a shortage, the real test of a community is not how much it can store, but how fairly it shares. Letting the most vulnerable go first is not charity. It is simply remembering that the same Giver gave water to them too."}, {"id": "sunrise1", "cat": "joy", "g": "joy1", "ti": "Sunrise selfie", "s": "You and your friends drove through the night to reach a hilltop just before sunrise. The sky is turning gold, there is mist in the valley, and the air smells of pine. But your friend Tanya is stressed, moving from spot to spot, retaking photos because her hair is not right and the light keeps changing. You realise you have also spent the last ten minutes looking at the sunrise through your screen.", "q": "What would make this moment count?", "o": ["Keep shooting. You will enjoy it later in the photos", "Take a few photos, then put the phones away, invite Tanya to sit with you, and just watch the sun come up together", "Tell Tanya she is ruining the morning"], "ans": 1, "y": "That is such a gift to yourself and your friend. Photos are lovely souvenirs, but only the present moment gives you the real thing: the warmth on your face, the sound of birds, the quiet together. Some people call it one photo, then live it. A good habit for every beautiful place.", "n": "Wanting to capture beautiful moments is natural, and wanting Tanya to relax shows you care. But a sunrise only lasts a few minutes, and screens can make us miss the very thing we came for. Telling her off would hurt her. Inviting her to sit with you, phones down, lets both of you actually receive the morning.", "k": "Bhai Gurdas tells that on his travels, Guru Nanak climbed high into the Himalayas, to the mountain called Sumer, where yogis known as siddhs lived far from the world. They asked him how things were down below. Guru Nanak answered that the world was in darkness, and asked why those who had found peace were hiding up in the mountains instead of sharing it with people below. Mountain peace, he suggested, is meant to be carried back down.", "x": "Japji Sahib says those whose hearts are turned to the One are always in bloom. Blooming happens in the present. A flower does not take a photo of itself opening. Moments of natural beauty, like a sunrise from a hill, are gifts that can only be received by being there fully. Guru Nanak's words to the siddhs add a second lesson: let the peace you find in nature come back home with you, into how you treat people. Psychologists who study awe find that moments of wonder in nature make people kinder and less stressed. Put the phone down, and let the morning do its work."}, {"id": "tutor1", "cat": "study", "g": "loved1", "ti": "Homework helper", "s": "The daughter of the woman who helps in your home, Pinky, is in class six. She is bright but struggles with maths, and her mother cannot afford tuition. One evening Pinky is sitting on the steps, crying over a fractions worksheet. You are good at maths and you have an hour free most evenings, though you were planning to use it for gaming.", "q": "What do you do?", "o": ["Feel sorry for her but keep your evening for yourself", "Sit with her for half an hour a few evenings a week, explain fractions with rotis and pizzas, and keep it fun", "Do her homework for her so she stops crying"], "ans": 1, "y": "That is such a powerful choice. Half an hour of patient help can change how a child sees herself, from I am bad at maths to I can do this. Using rotis and pizzas makes it real for her. Celebrate her small wins, and you will be amazed how fast she grows.", "n": "Your evening time is precious, and feeling sorry for her shows you care. Doing her homework comes from kindness too. But it would only fix tonight's sheet, not her understanding. Sitting with her and explaining in a fun way builds her confidence for years. Even a little of your time can change the direction of a child's life.", "k": "Guru Angad is remembered for shaping and spreading the Gurmukhi script, so that ordinary people, not only priests and scholars, could read and write their own language and the Guru's words. Sikh tradition remembers that at Khadur he spent time teaching children their letters himself. For him, helping a child learn to read was itself an act of devotion.", "x": "Japji Sahib speaks of listening, trusting and holding love in the heart as bathing in the sacred pool within. Teaching a child with love is exactly that. Guru Angad made learning available to people who were usually shut out, and taught children with his own hands. Research on mentoring and tutoring shows that regular, warm attention from one caring person can make a big difference to a child's confidence and results. You do not need to be a teacher. You need patience, a few rotis drawn on paper, and the belief that she can do it."}, {"id": "neighbour1", "cat": "friends", "g": "kind1", "ti": "New neighbours", "s": "A new family has moved into your building from the northeast. Their son, Tenzin, is your age and joined your college. In the lift, some of your friends mimic his accent and joke about his food smell. Tenzin pretends not to notice, but he goes quiet. Later you see him eating alone in the canteen.", "q": "What do you do?", "o": ["Laugh along. It is just harmless fun", "Go sit with him, ask about his home and food, introduce him to your friends, and quietly tell your friends the jokes are not okay", "Report your friends to the principal straight away"], "ans": 1, "y": "That is what welcome looks like. You gave Tenzin a seat at the table and gave your friends a gentle way to do better. You might also discover a new favourite dish. Being a bridge between people is one of the most valuable things anyone can do.", "n": "It often feels harmless when everyone is laughing, and reporting shows you care about fairness. But jokes about someone's accent or food can make them feel like an outsider in their own country. Going straight to the principal may harden your friends. Sitting with him and talking to your friends directly is kinder and usually works better.", "k": "The Janamsakhis tell that Guru Nanak and Bhai Mardana passed through a village where people were rude and unwelcoming. As they left, Guru Nanak said, may this village stay settled here. In the next village, people welcomed them warmly and served them food. As they left, Guru Nanak said, may this village be scattered. Mardana was puzzled. The Guru explained: when good people scatter, they carry their goodness everywhere they go.", "x": "The Mool Mantar describes the One as nirvair, without enmity. Mocking someone for their accent or food quietly makes them an outsider, the opposite of nirvair. Tenzin's family has scattered from their home, like the good village in the story, and they carry their own goodness, food and culture with them. Welcoming them is how your building and your college grow richer. Research on prejudice has found that friendly contact between groups is one of the most reliable ways to reduce it. One shared lunch can do more than a hundred lectures."}];

    grateful:closed+sm+blush, loved:closed+sm+blush+hearts, hopeful:dot(0,-3)+sm+spark, neutral:dot(0,0)+flat, think:dot(3,-3)+flat+q};
  return M[m]||M.neutral;
}

  var rt=$('rtop'), rb=$('rbot'); BF.top=rt?rt.offsetHeight:0; BF.bot=rb?(box.clientHeight-rb.offsetTop):0;
  bfFrame();
  box.addEventListener('pointerdown',function(e){ BF.down={t:e.target.closest('.bub'),lx:e.clientX,ly:e.clientY,lt:performance.now()}; BF.moved=0; BF.vx=BF.vy=BF.svx=BF.svy=0; try{ box.setPointerCapture(e.pointerId); }catch(x){} bfKick(); });
  box.addEventListener('pointermove',function(e){ var d=BF.down; if(!d) return; var dx=e.clientX-d.lx, dy=e.clientY-d.ly, now=performance.now(), dt=Math.max(6,now-d.lt);
    BF.pdx+=dx; BF.pdy+=dy; BF.moved+=Math.abs(dx)+Math.abs(dy);
    // smoothed velocity in px per 16ms frame, so one jittery event cannot trigger a wobble
    BF.svx=BF.svx*.75+(dx*16/dt)*.25; BF.svy=BF.svy*.75+(dy*16/dt)*.25;
    d.lx=e.clientX; d.ly=e.clientY; d.lt=now; bfKick(); });
  function up(){ var d=BF.down; if(!d) return; BF.ox+=BF.pdx; BF.oy+=BF.pdy; BF.pdx=BF.pdy=0;
    if(performance.now()-d.lt>80){ BF.svx=BF.svy=0; }
    BF.vx=Math.max(-60,Math.min(60,BF.svx)); BF.vy=Math.max(-60,Math.min(60,BF.svy)); BF.down=null;
    if(BF.moved<8 && d.t){ BF.vx=BF.vy=0; tapBubble(d.t); return; } bfKick(); }
  box.addEventListener('pointerup',up); box.addEventListener('pointercancel',function(){ BF.down=null; bfKick(); });
  box.addEventListener('wheel',function(e){ e.preventDefault(); BF.ox-=e.deltaX; BF.oy-=e.deltaY; bfKick(); },{passive:false});
}
function tapBubble(el){
  el.animate && el.animate([{filter:'brightness(1)'},{filter:'brightness(1.15)'},{filter:'brightness(1)'}],{duration:220});
  setTimeout(function(){ if(el.dataset.bsc) openS(el.dataset.bsc); else openS(randomScen()); },120);
}
function randomScen(except){

  if(!pool.length) pool=SCEN.filter(function(s){ return s.id!==except; });
  return pool[Math.floor(Math.random()*pool.length)].id;
}

async function toolSearch(inp){
  var ix=await gbIdx(), L=ix.L, res=[], ak=(inp.first_letters?String(inp.first_letters).replace(/\s/g,''):'') || (inp.gurmukhi?akharOf(inp.gurmukhi):'');
  var words=String(inp.english_keywords||'').toLowerCase().split(/[^a-z']+/).filter(function(w){ return w.length>2 && !STOP[w]; });
  for(var i=0;i<L.length;i++){
    var l=L[i], sc=0;
    if(ak && ak.length>=3 && l[2].indexOf(ak)>-1) sc+=10+ak.length;
    if(words.length){ var en=l[3].toLowerCase(), h=0; for(var w=0;w<words.length;w++) if(en.indexOf(words[w])>-1) h++; if(h) sc+=h*2+(h===words.length?3:0); }
    if(sc) res.push([sc,i]);
  }
  res.sort(function(a,b){ return b[0]-a[0]; });
  var out=[], seen={};
  for(var r=0;r<res.length && out.length<10;r++){
    var li=res[r][1], l2=L[li]; if(seen[l2[0]]>=2) continue; seen[l2[0]]=(seen[l2[0]]||0)+1;
    var sh=await gbShabad(l2[0]), S2=ix.S[l2[0]], k=li; while(k>0 && L[k-1][0]===l2[0]) k--;
    var line=sh[li-k]; if(!line) continue;
    rememberLine(line[0],line[3],S2[1]);
    out.push({shabad_id:l2[0],ang:l2[1],author:S2[1],raag:S2[2],gurmukhi:line[0],english:l2[3]});
  }
  return out.length?out:'No matching lines. Try other English keywords or the first letters of the pangti.';
}
async function toolShabad(inp){
  var si=parseInt(inp.shabad_id,10), ix=await gbIdx(); if(!(si>=0 && si<ix.S.length)) throw new Error('Unknown shabad_id');
  var sh=await gbShabad(si), S2=ix.S[si], lines=sh, start=0;
  if(sh.length>36){ var hint=gnorm(inp.focus_gurmukhi||''), at=0; if(hint) for(var i=0;i<sh.length;i++) if(gnorm(sh[i][0]).indexOf(hint.slice(0,24))>-1){ at=i; break; } start=Math.max(0,at-14); lines=sh.slice(start,start+30); }
  lines.forEach(function(l){ rememberLine(l[0],l[3],S2[1]); });
  return {shabad_id:si,author:S2[1],raag:S2[2],ang:sh[0][3],total_lines:sh.length,from_line:start+1,
    lines:lines.map(function(l){ return {gurmukhi:l[0],ang:l[3],english:l[1],teeka_sahib_singh:String(l[2]||'').slice(0,320)}; })};
}

/* engines */

var SAMPLE=null; (async function(){ try{ if(window.claude && claude.use) SAMPLE=await claude.use('sample'); }catch(e){} if(tab==='chat' && !cur) renderChat(); })();
async function askClaude(turns,onText,onStatus,signal){

  if(lim && lim.tools) opts.tools=toolsFor(onStatus); else input[0]={role:'user',content:RULES+'\n\n(Tools are unavailable right now: you may quote only the most widely known pangtis, and must say the quote is unchecked.)'};
  var r=await SAMPLE(input,opts); return r.text;
}
async function askGemini(turns,onText,onStatus,signal){
  var model=S.gmodel||'gemini-flash-latest', url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(S.gkey);
  var contents=turns.map(function(t){ return {role:t.role==='assistant'?'model':'user',parts:[{text:t.content}]}; });
  var decl=TOOLS_DEF.map(function(t){ return {name:t.name,description:t.description,parameters:t.inputSchema}; });
  for(var round=0;round<6;round++){
    var res=await fetch(url,{method:'POST',signal:signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:RULES}]},contents:contents,tools:[{functionDeclarations:decl}],generationConfig:{temperature:.6}})});
    if(res.status===429) throw {code:'rate_limited'};
    if(!res.ok){ var et=await res.text().catch(function(){return '';}); throw {code:'upstream_error',message:et}; }
    var j=await res.json(), parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];
    var calls=parts.filter(function(p){ return p.functionCall; });
    if(!calls.length){ var txt=parts.map(function(p){ return p.text||''; }).join('').trim(); if(!txt) throw {code:'empty_completion'}; onText(txt); return txt; }
    contents.push({role:'model',parts:parts});
    var resp=[];
    for(var c=0;c<calls.length;c++){ var fc=calls[c].functionCall, out;
      try{ if(fc.name==='search_gurbani'){ onStatus('search'); out=await toolSearch(fc.args||{}); } else { onStatus('read'); out=await toolShabad(fc.args||{}); } }catch(e){ out='Error: '+(e.message||e); }
      resp.push({functionResponse:{name:fc.name,response:{result:out}}}); }
    contents.push({role:'user',parts:resp});
  }
  throw {code:'empty_completion'};
}

/* rendering: markdown-lite + Gurbani check */
function mdInline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<i>$2</i>'); }
function renderMsg(m){
  if(m.role==='user') return '<div class="cm u"><div class="bub2">'+esc(m.content).replace(/\n/g,'<br>')+'</div></div>';
  var h='', lines=String(m.content||'').split('\n'), list=false, v=m.v||{};
  lines.forEach(function(ln){
    var t=ln.trim();
    if(/^- /.test(t)){ if(!list){ h+='<ul>'; list=true; } h+='<li>'+mdInline(t.slice(2))+'</li>'; return; }
    if(list){ h+='</ul>'; list=false; }
    if(!t){ h+='<div class="gap"></div>'; return; }
    var gq=t.replace(/^>\s*/,'');
    if(/[ਅ-ਹ]{2}/.test(gq) && (t[0]==='>' || gnorm(gq).length>8 && gnorm(gq).length/gq.replace(/\s/g,'').length>.7)){
      var n=gnorm(gq), ok=m.done && v[n];
      h+='<div class="cg'+(m.done&&!ok?' bad':'')+'"><p lang="pa">'+esc(gq)+'</p>'+(m.done?(ok?'<span class="chk ok">✓ '+U().ver+(ok.ang?' · Ang '+ok.ang:'')+'</span>':'<span class="chk no">'+U().unver+'</span>'):'')+'</div>'; return;
    }
    if(t[0]==='>') t=t.replace(/^>\s*/,'');
    h+='<p>'+mdInline(t)+'</p>';
  });
  if(list) h+='</ul>';
  return '<div class="cm a"><div class="who">Jach</div>'+h+(m.status?'<div class="cstat"><span class="dots"><i></i><i></i><i></i></span>'+esc(m.status)+'</div>':'')+'</div>';
}
function verifyMsg(m){
  var v={};
  String(m.content).split('\n').forEach(function(ln){ var gq=ln.trim().replace(/^>\s*/,''); if(!/[ਅ-ਹ]{2}/.test(gq)) return; var n=gnorm(gq); if(n.length<6) return;
    for(var k in VER){ if(k.indexOf(n)>-1 || (n.length>12 && n.indexOf(k)>-1)){ v[n]=VER[k]; return; } } });
  m.v=v;
}
