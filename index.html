var META = [{"id": "anger1", "topic": "anger", "src": "38", "ang": 8, "ans": 1, "g": "ਜਤੁ ਪਾਹਾਰਾ ਧੀਰਜੁ ਸੁਨਿਆਰੁ ॥"}, {"id": "ego1", "topic": "ego", "src": "2", "ang": 1, "ans": 1, "g": "ਹੁਕਮੈ ਅੰਦਰਿ ਸਭੁ ਕੋ ਬਾਹਰਿ ਹੁਕਮ ਨ ਕੋਇ ॥\nਨਾਨਕ ਹੁਕਮੈ ਜੇ ਬੁਝੈ ਤ ਹਉਮੈ ਕਹੈ ਨ ਕੋਇ ॥੨॥"}, {"id": "comp1", "topic": "comparison", "src": "33", "ang": 7, "ans": 2, "g": "ਨਾਨਕ ਉਤਮੁ ਨੀਚੁ ਨ ਕੋਇ ॥੩੩॥"}, {"id": "accept1", "topic": "acceptance", "src": "1", "ang": 1, "ans": 1, "g": "ਹੁਕਮਿ ਰਜਾਈ ਚਲਣਾ ਨਾਨਕ ਲਿਖਿਆ ਨਾਲਿ ॥੧॥"}, {"id": "content1", "topic": "contentment", "src": "28", "ang": 6, "ans": 1, "g": "ਮੁੰਦਾ ਸੰਤੋਖੁ ਸਰਮੁ ਪਤੁ ਝੋਲੀ ਧਿਆਨ ਕੀ ਕਰਹਿ ਬਿਭੂਤਿ ॥"}, {"id": "listen1", "topic": "listening", "src": "8", "ang": 2, "ans": 0, "g": "ਸੁਣਿਐ ਦੂਖ ਪਾਪ ਕਾ ਨਾਸੁ ॥੮॥"}, {"id": "habit1", "topic": "habits", "src": "4", "ang": 2, "ans": 1, "g": "ਅੰਮ੍ਰਿਤ ਵੇਲਾ ਸਚੁ ਨਾਉ ਵਡਿਆਈ ਵੀਚਾਰੁ ॥"}, {"id": "action1", "topic": "actions", "src": "20", "ang": 4, "ans": 2, "g": "ਆਪੇ ਬੀਜਿ ਆਪੇ ਹੀ ਖਾਹੁ ॥"}, {"id": "hard1", "topic": "hard", "src": "25", "ang": 5, "ans": 1, "g": "ਕੇਤਿਆ ਦੂਖ ਭੂਖ ਸਦ ਮਾਰ ॥\nਏਹਿ ਭਿ ਦਾਤਿ ਤੇਰੀ ਦਾਤਾਰ ॥"}, {"id": "kind1", "topic": "kindness", "src": "mm", "ang": 1, "ans": 1, "g": "ੴ ਸਤਿ ਨਾਮੁ ਕਰਤਾ ਪੁਰਖੁ ਨਿਰਭਉ ਨਿਰਵੈਰੁ ਅਕਾਲ ਮੂਰਤਿ ਅਜੂਨੀ ਸੈਭੰ ਗੁਰ ਪ੍ਰਸਾਦਿ ॥"}, {"id": "mind1", "topic": "mind", "src": "28", "ang": 6, "ans": 0, "g": "ਆਈ ਪੰਥੀ ਸਗਲ ਜਮਾਤੀ ਮਨਿ ਜੀਤੈ ਜਗੁ ਜੀਤੁ ॥"}, {"id": "nature1", "topic": "nature", "src": "sl", "ang": 8, "ans": 2, "g": "ਪਵਣੁ ਗੁਰੂ ਪਾਣੀ ਪਿਤਾ ਮਾਤਾ ਧਰਤਿ ਮਹਤੁ ॥"}, {"id": "purpose1", "topic": "purpose", "src": "1", "ang": 1, "ans": 1, "g": "ਕਿਵ ਸਚਿਆਰਾ ਹੋਈਐ ਕਿਵ ਕੂੜੈ ਤੁਟੈ ਪਾਲਿ ॥"}, {"id": "guilt1", "topic": "guilt", "src": "20", "ang": 4, "ans": 1, "g": "ਭਰੀਐ ਮਤਿ ਪਾਪਾ ਕੈ ਸੰਗਿ ॥\nਓਹੁ ਧੋਪੈ ਨਾਵੈ ਕੈ ਰੰਗਿ ॥"}, {"id": "joy1", "topic": "joy", "src": "8", "ang": 2, "ans": 1, "g": "ਨਾਨਕ ਭਗਤਾ ਸਦਾ ਵਿਗਾਸੁ ॥"}, {"id": "lonely1", "topic": "lonely", "src": "6", "ang": 2, "ans": 1, "g": "ਸਭਨਾ ਜੀਆ ਕਾ ਇਕੁ ਦਾਤਾ ਸੋ ਮੈ ਵਿਸਰਿ ਨ ਜਾਈ ॥੬॥"}, {"id": "loved1", "topic": "loved", "src": "21", "ang": 4, "ans": 1, "g": "ਸੁਣਿਆ ਮੰਨਿਆ ਮਨਿ ਕੀਤਾ ਭਾਉ ॥\nਅੰਤਰਗਤਿ ਤੀਰਥਿ ਮਲਿ ਨਾਉ ॥"}, {"id": "fear1", "src": "x", "ang": 819, "ans": 1, "g": "ਤਾਤੀ ਵਾਉ ਨ ਲਗਈ ਪਾਰਬ੍ਰਹਮ ਸਰਣਾਈ ॥\nਚਉਗਿਰਦ ਹਮਾਰੈ ਰਾਮ ਕਾਰ ਦੁਖੁ ਲਗੈ ਨ ਭਾਈ ॥੧॥", "ref": {"en": "Guru Arjan, Raag Bilaval", "hi": "गुरु अर्जन, राग बिलावल", "pa": "ਗੁਰੂ ਅਰਜਨ, ਰਾਗ ਬਿਲਾਵਲ"}}, {"id": "grief1", "src": "x", "ang": 923, "ans": 1, "g": "ਮਤ ਮੈ ਪਿਛੈ ਕੋਈ ਰੋਵਸੀ ਸੋ ਮੈ ਮੂਲਿ ਨ ਭਾਇਆ ॥\nਮਿਤੁ ਪੈਝੈ ਮਿਤੁ ਬਿਗਸੈ ਜਿਸੁ ਮਿਤ ਕੀ ਪੈਜ ਭਾਵਏ ॥", "ref": {"en": "Baba Sundar, Ramkali Sadd", "hi": "बाबा सुंदर, रामकली सद", "pa": "ਬਾਬਾ ਸੁੰਦਰ, ਰਾਮਕਲੀ ਸਦ"}}, {"id": "forgive1", "src": "x", "ang": 1381, "ans": 1, "g": "ਫਰੀਦਾ ਬੁਰੇ ਦਾ ਭਲਾ ਕਰਿ ਗੁਸਾ ਮਨਿ ਨ ਹਢਾਇ ॥\nਦੇਹੀ ਰੋਗੁ ਨ ਲਗਈ ਪਲੈ ਸਭੁ ਕਿਛੁ ਪਾਇ ॥੭੮॥", "ref": {"en": "Sheikh Farid, Saloks", "hi": "शेख़ फ़रीद, सलोक", "pa": "ਸ਼ੇਖ਼ ਫ਼ਰੀਦ, ਸਲੋਕ"}}, {"id": "women1", "src": "x", "ang": 473, "ans": 1, "g": "ਸੋ ਕਿਉ ਮੰਦਾ ਆਖੀਐ ਜਿਤੁ ਜੰਮਹਿ ਰਾਜਾਨ ॥", "ref": {"en": "Guru Nanak, Asa di Var", "hi": "गुरु नानक, आसा दी वार", "pa": "ਗੁਰੂ ਨਾਨਕ, ਆਸਾ ਦੀ ਵਾਰ"}}, {"id": "work1", "src": "x", "ang": 1245, "ans": 1, "g": "ਘਾਲਿ ਖਾਇ ਕਿਛੁ ਹਥਹੁ ਦੇਇ ॥\nਨਾਨਕ ਰਾਹੁ ਪਛਾਣਹਿ ਸੇਇ ॥੧॥", "ref": {"en": "Guru Nanak, Sarang ki Var", "hi": "गुरु नानक, सारंग की वार", "pa": "ਗੁਰੂ ਨਾਨਕ, ਸਾਰੰਗ ਕੀ ਵਾਰ"}}], TXT = {en:{"anger1": {"ti": "The pause before you reply", "s": "A message lands in the family group. It is about you. Half joke, fully pointed. Your face goes hot, and your thumbs are already typing a reply that will hurt.", "m": "Let self-control be the workshop, and let patience be the goldsmith.", "k": "Guru Amar Das was already an old man when he became the third Guru. At Goindwal, people came from far and wide just to sit near him. Datu, a son of Guru Angad, could not bear it. He felt the seat should have been his. One day he walked into the gathering, burning with rage, and kicked the elderly Guru from his seat. The whole room fell silent. Slowly, the Guru got up. Sikh tradition says he did not shout, and he did not strike back. He gently held Datu's foot, and said he was sorry if his hard old bones had hurt it. That same evening, he quietly left Goindwal, so that there would be no fight.", "a": "Guru Nanak gives us a goldsmith's workshop. Gold never becomes a ring in one hard blow. It is heated, shaped, cooled, and shaped again, by a hand that does not hurry. He calls this dheeraj, patience, and he does not put it on the shelf with the tools. Patience is the goldsmith himself, the one doing the work. So patience is not weakness, and it is not swallowing everything. It is a skill. Guru Amar Das had every reason to strike back, yet in that room, his patience did the shaping. The thinkers who followed Sigmund Freud noticed something that fits here. Anger often lands on the wrong person. The boss shouts at us at noon, and at night we snap at our sister. Patience gives us time to see where the heat is really coming from.", "b": "Why does a pause help? Anger is strongest in its first few seconds, like milk boiling over. If you lift the pot off the flame for a moment, the milk settles, and nothing is lost. In the same way, a ten second pause does not mean you stop being upset. It means you are now choosing your words, instead of your anger choosing them for you. You can still say the hard thing. You can still be firm. You simply will not wake up tomorrow wishing you had said it differently. People who learn this become the calm ones in a family or an office, the ones everyone trusts in a crisis. That trust is built one paused reply at a time.", "t": "Next time a message stings, put the phone face down and take three slow breaths. Then decide what to say, or whether to say anything today.", "q": "A friend cancels your plans at the last minute, again. You feel the heat rising. What would you do first?", "o": ["Send an angry voice note right away", "Wait a little, then tell them calmly how it felt", "Ignore them for a week"], "y": "Beautiful choice. Waiting a little is the goldsmith at work. When you speak calmly about how it felt, your friend can actually hear you, instead of defending against your anger. You protect the friendship and your own peace at the same time.", "n": "That's an honest answer, and almost everyone has felt that pull. Anger wants to act fast, either by striking or by going cold. But both usually leave things worse. Try waiting a little, then saying calmly how it felt. It is harder in the moment, and much lighter afterwards."}, "ego1": {"ti": "Who really did this?", "s": "You get the promotion. On the way home you tell yourself: I did this. All me. Then you remember the teacher who stayed late, the friend who shared the job post, and your mother who packed your lunch for fifteen years.", "m": "Everyone lives inside hukam, the great order of things. No one is outside it. A person who understands this stops saying, I, I.", "k": "Akbar, the Mughal emperor, once travelled to Goindwal to meet Guru Amar Das. He was the most powerful man in the land, used to being received with great ceremony. But at the Guru's place there was one simple rule: first the pangat, then the sangat. Before meeting the Guru, everyone sat together in a row on the floor and ate the same food from the langar. Rich and poor, Hindu and Muslim, side by side. Tradition says the emperor did exactly that. He sat down among farmers and travellers, and ate the same simple meal. Only after that did he go to meet the Guru.", "a": "Two words matter here. Hukam is the great order that everything belongs to, like one wave in a whole sea. Haumai is the habit of saying: I did it, it is mine. Guru Nanak joins the two. The more clearly you see the sea, the less the wave boasts. Akbar sitting on the floor of the langar is that idea made visible. On that floor an emperor was simply one more hungry person, because everyone there belonged to the same order. An old Indian text, the Ashtavakra Gita, gives a sharp picture of the same habit. It says the thought, I am the doer, is like the bite of a snake. Its poison makes us proud when things go well, and crushed when they do not.", "b": "This does not mean your effort was nothing. You worked hard, and that is real. It means your effort was one part of a bigger story. Think of a cricket captain lifting the trophy. The good ones always speak first about the team, the coach and the ground staff. They know the trophy has many hands on it. People who see life this way are easier to work with. They say thank you more often, and others want to help them again. And when a plan fails, they do not fall apart, because they never believed it was all in their own hands. Gratitude and humility turn out to be the same thing, seen from two sides.", "t": "Tonight, think of one good thing in your life. Name three people or lucky breaks that helped it happen. Then thank one of them.", "q": "Your team project wins an award. In the meeting, your boss asks how it happened. What do you say?", "o": ["Explain all the parts you did yourself", "Name the people who helped, then share your part", "Say nothing and let them guess"], "y": "Lovely. Naming others first does not make you smaller. It shows you see the whole sea, not just your own wave. People remember the person who shared the credit, and they want to work with them again.", "n": "That's a very human answer. We all want our effort to be seen, and it should be. Try naming the people who helped first, and then share your part. Your work still shines, and now it shines along with everyone else's, which is how it really happened."}, "comp1": {"ti": "Higher, lower", "s": "You open your phone. A classmate has a new car. A cousin has moved to Canada. In ten seconds, a perfectly good day starts to feel like a failed life.", "m": "Says Nanak: no one is high, and no one is low.", "k": "In the town of Saidpur lived Bhai Lalo, a carpenter who earned his bread with his own hands. When Guru Nanak came to the town, he chose to stay in Lalo's small house. Nearby lived Malik Bhago, a rich official, who held a grand feast and invited every holy man around. Guru Nanak did not go. Offended, Malik Bhago had him brought, and asked why he preferred a poor man's dry bread to such fine food. The Janamsakhi tells that the Guru took Lalo's coarse bread in one hand and Bhago's rich food in the other, and pressed them both. Milk came from the carpenter's bread. Blood came from the feast.", "a": "Just before this line, Guru Nanak lists things that are not fully in our own hands: speaking, staying silent, asking, giving, living. If so much of what we have was given to us, then ranking people as high or low makes little sense. The sakhi turns this into a picture. Bhago had rank and riches. Lalo had a small house and honest hands. Guru Nanak measured them by a different scale, and on that scale the carpenter stood taller. The psychologist Leon Festinger showed that people judge themselves by looking at others. It is natural, and everyone does it. The trouble is the scale we use. When we measure only money, looks and followers, we keep finding someone above us, and we never feel enough.", "b": "Look at where we usually compare. Social media shows everyone's best ten seconds: the trip, the ring, the new car. You are comparing your whole ordinary day with their highlight. That is not a fair match, so the result is never true. It is like comparing your rough notebook with someone else's printed book. And there is a second trap. The cousin in Canada may be lonely. The classmate with the new car may be deep in debt. We see the picture, never the price. When we stop ranking, something good happens. We can be truly happy for others, and we have more energy left for our own road.", "t": "Today, catch one comparison as it happens. Say quietly to yourself: different road, not higher or lower. Then put the phone down for five minutes.", "q": "Your school friend posts photos from her wedding abroad. You feel a small sting. What helps most?", "o": ["Scroll through her photos again and again", "Unfollow her so you never see it", "Send her a warm message, then get back to your own day"], "y": "That's a big-hearted choice. Sending warmth turns the sting into something kind, and getting back to your day keeps you on your own road. Different road, not higher or lower.", "n": "That's honest, and very common. The sting is real, and it isn't wrong to feel it. But scrolling feeds it, and cutting people off can leave us lonelier. Try sending a warm message and returning to your own day. The sting usually fades much faster that way."}, "accept1": {"ti": "What is in my hands?", "s": "You prepare for weeks. On the day of the interview your train is two hours late. You stand on the platform, furious at a train.", "m": "Walk in step with hukam, the order of things, says Nanak. It is written into us.", "k": "For many years Guru Nanak travelled far and wide, east and south, into the mountains and to the west, often on foot. Bhai Gurdas, who wrote about him only a generation later, tells what happened when those long journeys ended. Guru Nanak came back to Kartarpur, on the banks of the river Ravi. He took off the robes of a wandering traveller and put on ordinary household clothes. Sikh accounts add that he lived there by farming, like any villager, while people gathered every morning and evening to sing and reflect together. The teacher who had walked across countries now waited for the rains like everyone else.", "a": "Guru Nanak has just asked how a person can live truthfully. This is his answer: walk in step with hukam, the way things are, instead of fighting it. It is like swimming with the river. You still swim, and you swim hard, but you stop wasting strength against the current. Kartarpur shows what this looks like in a real life. A farmer cannot order the rain, the sun or the season. He can only do his part well, and accept what the sky does. Almost two thousand years ago, the Greek teacher Epictetus began his small handbook with the same idea. Some things are up to us, and some are not. Our effort and our reply are ours. The weather, the train and other people's choices are not.", "b": "Accepting is not giving up. On the platform, your part is small but real. Call the office, send a message, breathe, and walk in calm when you arrive. Anger at the train does nothing to the train. It only spends your energy, and spoils the interview before it even starts. People who learn to keep two lists, in my hands and not in my hands, are not less ambitious. They are often more effective, because all their strength goes where it can actually make a difference. They also sleep better, because they stop carrying weights that were never theirs to carry.", "t": "Think of one thing that is worrying you. Make two lists: in my hands, and not in my hands. Do one small thing from the first list today.", "q": "It's your sister's wedding day, and heavy rain floods the garden venue. Everyone is panicking. What do you do?", "o": ["Keep complaining about the weather", "Help move things indoors and lift everyone's mood", "Blame whoever chose the venue"], "y": "Wonderful. You let go of the rain, which was never in anyone's hands, and put all your strength into what was. That is exactly what walking with hukam looks like.", "n": "Completely understandable. When something important goes wrong, we look for someone or something to blame. But the rain will not listen. Try putting your energy where it can work: move things indoors, help others smile. The day can still be beautiful."}, "content1": {"ti": "How much is enough?", "s": "You buy the new phone. For one week it feels wonderful. Then a newer model is announced, and the phone in your hand suddenly feels old.", "m": "Make contentment your earrings, honest effort your bowl and bag, and focused attention the ash you wear.", "k": "In Lahore lived Duni Chand, a man of very great wealth. He invited Guru Nanak to his home with much respect. Before leaving, the Guru handed him a small sewing needle and asked a favour. Keep this safe for me, he said, and give it back to me in the next world. Duni Chand proudly agreed and took the needle to his wife. She looked at him and asked one simple question. How will you carry a needle with you after you die? Duni Chand went quiet. If he could not take even a needle, what about everything else he owned? He went back to the Guru, and listened.", "a": "Guru Nanak is speaking to yogis, who wore special earrings and carried a begging bowl as signs of their path. He says the real signs are inside a person. The first one he names is santokh, contentment. It means being at peace with what you have, while you keep working honestly. The needle in the sakhi is tiny, almost funny, and that is its power. It shows in one small object that we cannot hold on to anything forever. Duni Chand did not have to give away his house. He had to stop believing his house was who he was. Contentment is that shift: from owning things, to simply using them well and sharing them.", "b": "Psychologists describe the problem with the picture of a treadmill. We run faster and earn more, but we get used to every new thing very quickly, so our happiness stays in the same place. The new phone feels wonderful for a week. The bigger salary feels special for a month. Then the goal moves again. Contentment does not mean you stop growing. You can still want a better job or a bigger home. The difference is where you stand while you grow. You stand on, I have enough, and I am building. Not on, I am nothing until I get that. From the first place, life feels like a journey. From the second, it feels like a race you are always losing.", "t": "Before you buy the next thing you want, wait one day. Tonight, name three things you already own that you once dreamed of having.", "q": "Your phone works fine, but a new model with a better camera just launched. Your friends are all buying it. What would you do?", "o": ["Buy it today on EMI", "Wait a month and see if you still want it", "Feel bad that you can't afford it"], "y": "Very wise. Waiting a month lets the excitement settle, so you can see whether it was a real need or just the treadmill. Often the wish fades, and you find you already had enough.", "n": "That's a very real feeling. New things are made to look irresistible, and it's hard when friends have them. Try waiting a month before you decide. If you still need it then, buy it with a clear mind. If not, you have just stepped off the treadmill."}, "listen1": {"ti": "Listen first", "s": "Your friend begins telling you about a terrible day. Before she has finished, you say: you know what you should do? She goes quiet. She wanted to be heard, and she got a lecture.", "m": "By truly listening, pain and wrongdoing fall away.", "k": "Long before he became the second Guru, Bhai Lehna lived in Khadur. Early one morning he heard his neighbour, Bhai Jodha, singing verses he had never heard before. They were words of Guru Nanak. Bhai Lehna stopped, and listened, and the words would not leave him. He asked who had written them. When he learned they came from Guru Nanak at Kartarpur, he set out to meet him, and his life was never the same again. It all began with one ordinary morning, and one moment of truly listening.", "a": "Four pauris of Japji Sahib begin with one word: suniai, listening. Guru Nanak is speaking of deep listening to the divine Word, with the whole of one's attention. Bhai Lehna's story shows how powerful that can be. He could have walked past, busy with his own thoughts. Instead he stopped, and opened himself fully to what he heard. In daily life, we borrow that same quality, full attention, for the people in front of us. Most of the time we do not really listen. We wait for our turn to speak. The other person can feel it, the way you can feel it when someone keeps looking at their phone while you talk.", "b": "In his famous book, The Seven Habits of Highly Effective People, Stephen Covey says: first understand the other person, and only then try to be understood. A doctor who writes the medicine before asking about the pain is a bad doctor. So is a friend. When people feel heard, something softens in them. They calm down, and very often they find their own answer while they talk. When they feel judged or rushed, they defend themselves instead. Two minutes of real listening can save two hours of argument. And there is a gift for you too. When you listen fully, you learn things you would never have heard while busy speaking.", "t": "In one conversation today, give no advice. Only ask: then what happened? And: how did that feel? Speak after they have finished.", "q": "Your mother starts telling you about a problem with a neighbour, just as you get home tired from work. What do you do?", "o": ["Put your phone away and listen till she finishes", "Quickly tell her what she should do", "Say you're too tired to talk"], "y": "That's a real gift to her. Putting the phone away tells her she matters more than the screen. Often she doesn't need a solution at all, just to be heard by someone she loves.", "n": "That's honest. When we are tired, quick advice or a pause feels easier. But usually she just wants to be heard. Try putting the phone away for a few minutes and listening till she finishes. It costs very little, and it means a lot."}, "habit1": {"ti": "One small thing, every morning", "s": "On the first of January you promise yourself: gym for one hour, every single day. By the twentieth of January, the gym bag is lying under the bed.", "m": "In the calm hours before dawn, reflect on the True Name and its greatness.", "k": "Amar Das was already past sixty when he came to serve Guru Angad at Khadur. Every day, in the dark hours before sunrise, he walked to the river Beas, filled a pitcher with water, and carried it back so the Guru could bathe. He did this every single morning, in summer heat and winter cold, for twelve years. Tradition remembers that one stormy night he stumbled and fell into a weaver's pit. He got up, picked up the pitcher, and carried the water on. Years later, this quiet, faithful man became the third Guru.", "a": "Amrit vela is the calm time before sunrise. Guru Nanak ties reflection to a fixed part of the day. The mind is fresh, the house is silent, and the phone has not yet started calling you. Amar Das's twelve years of water show the hidden strength of a fixed time. He did not have to decide every morning whether to go. The dawn decided for him. In his book Atomic Habits, James Clear gives the same advice in modern words. Start with a version that takes only two minutes, and join it to something you already do. After I brush my teeth, I will sit quietly for two minutes. Small enough that you cannot say no.", "b": "Why does this work? Your New Year plan was too big, and it had no fixed time. Every day you had to argue with yourself: should I go, or not today? That daily argument tires you out long before your body does. A fixed time ends the argument. And small steps add up quietly. One rupee saved every day looks like nothing. In a year, it is a real amount. A habit grows the same way. First make it regular, even if it is tiny. Later you can make it longer. A small lamp lit every day gives more light than a big fire lit once a year.", "t": "Pick one habit of two minutes for the morning: sit quietly, read one line, or stretch. Join it to brushing your teeth. Begin tomorrow.", "q": "You want to start reading, but you never find the time. Which plan is most likely to work?", "o": ["Read for one hour every Sunday", "Read two pages every night before sleep", "Buy ten books to feel motivated"], "y": "Exactly right. Two pages at a fixed time is small enough to never skip, and it joins a moment you already have. In a year, that is more than seven hundred pages.", "n": "A very natural plan, and many of us start this way. Big goals feel exciting, but they're easy to skip when life gets busy. Try two pages at the same time every night. It's so small you won't say no, and that is how the habit actually begins."}, "action1": {"ti": "What you plant", "s": "A shopkeeper adds a little water to the milk every day. Nobody notices. One year later, half his customers have quietly moved to the next shop.", "m": "You yourself sow the seed, and you yourself eat the harvest.", "k": "Bhai Vir Singh retells an old story of Bhumia, a robber who fed travellers for free, using stolen money. When Guru Nanak passed through, Bhumia invited him to eat. The Guru would not eat food bought with other people's tears, but he made Bhumia an offer. Keep a few small promises: never rob the poor, always speak the truth, and never betray a house where you have eaten. Bhumia agreed, thinking they were easy. But soon, each small promise began to block another crime. And one night, keeping them, he found he could not go on stealing at all. His whole life turned.", "a": "Guru Nanak uses a farmer's picture that everyone understands. Plant wheat, and you get wheat. Plant thorns, and you get thorns. Nobody else decides your crop. Bhumia's story shows the same truth from the hopeful side. He did not change in one dramatic moment. He changed through a few small promises, kept again and again, until his whole life was different. This line is not a threat. It is good news, because it means you can begin planting better seeds today, whoever you were yesterday. James Clear makes the same point in Atomic Habits. A tiny improvement each day looks like nothing in a week. Over a year, it becomes a very large change. And so does a tiny slip.", "b": "Look at one ordinary day. A kind word to the watchman. A small lie to a friend. Ten pages of a book. One more hour of scrolling. Each one is a seed. You will not see the plant tomorrow, and that is exactly why we forget. Savings, health, trust and friendships are never built or broken in a single day. They grow, seed by seed. A mango tree does not give fruit in a week either. The person you will be next year is being planted right now, in what you do today, again and again. That can feel heavy, but it is also freeing. It means no day is wasted, and no day is too late to begin.", "t": "Choose one small seed to plant every day this week: one honest answer, one page of reading, or one kind message.", "q": "You've been telling small lies at work to cover your late arrivals. You want to change. What's the best first step?", "o": ["Promise yourself to be perfect from tomorrow", "Do nothing, since it's too late now", "Pick one small promise, like being on time this week, and keep it"], "y": "That is exactly how Bhumia changed. One small promise, kept, is a real seed. Next week it gets easier, and slowly the whole crop changes.", "n": "That's an understandable thought. When we see our mistakes, we either want one giant leap or we lose hope. Neither works well. Try one small promise you can keep this week. Small seeds, kept daily, change more than big vows."}, "hard1": {"ti": "When the day is heavy", "s": "The result comes, and it is bad. Or the job is gone. Or someone you love is unwell. Kind people say, everything happens for the best. Somehow it does not help.", "m": "So many live with pain, hunger and constant blows. These too come from you, O Giver.", "k": "Around the year fifteen twenty one, Babar's army attacked the town of Saidpur. Guru Nanak was there. The Janamsakhis say he was among the people taken captive, and that in the prison, while grinding grain like the other prisoners, he sang. Out of what he saw came four hymns, now in Guru Granth Sahib, known as the Babarvani. In them he does not look away. He describes the fear, the grief and the destruction plainly, and he even asks the Creator about the people's pain. Yet through all of it, he never stops speaking to the One.", "a": "Guru Nanak does not hide suffering. In this pauri he names it plainly: pain, hunger, blow after blow. At Saidpur he did the same, putting real grief into words instead of covering it with nice phrases. He does not say that pain is pleasant, or that we must smile through it. What he adds is this: hard times are not outside the Giver's hand. They are not proof that you have been forgotten. The good days and the heavy days come from the same place. That one thought can take away the extra pain of asking, why only me? It lets you grieve, without also feeling abandoned.", "b": "Viktor Frankl was a doctor who lived through the Nazi prison camps. In his book, Man's Search for Meaning, he wrote that when we cannot change a situation, we can still choose how we face it. Those who found some meaning in their pain were better able to carry it. Think of a student who fails once, and later becomes a patient teacher, because she remembers exactly how failing felt. The failure still hurt. But it did not go to waste. Notice also that Guru Nanak sang among the other prisoners. Pain carried together is lighter. On a heavy day, one honest conversation can do more than a hundred brave faces.", "t": "If today is heavy, do one small caring thing for yourself. Eat properly, step outside, or call one person you trust and say: today was hard.", "q": "Your close friend just lost her job and is crying on the phone. What would help her most right now?", "o": ["Tell her everything happens for a reason", "Listen, and tell her you're with her and it's okay to be sad", "Quickly send her ten job links"], "y": "That's real kindness. You let her pain be real, the way Guru Nanak named pain openly, and you stayed with her in it. Help with jobs can come later. Right now, she needs company.", "n": "You clearly want to help, and that matters a lot. But in the first hours, quick answers can make her feel her pain isn't allowed. Try just listening, and telling her you're with her. Practical help is precious too. It simply comes a little later."}, "kind1": {"ti": "Water for both sides", "s": "The neighbour who fought with your family over parking has slipped on the stairs. You are the only one nearby. One voice inside says: remember what he said to us. Another says: he is a person in pain.", "m": "One Creator, whose name is Truth, the Doer of all, without fear, without enmity, beyond time, unborn, self-existent, known by the Guru's grace.", "k": "During the siege of Anandpur, the battlefield was full of wounded men crying out for water. Bhai Kanhaiya walked among them with a water bag on his shoulder. He knelt beside each one, and gave water to all, Sikh soldiers and enemy soldiers alike. Some Sikhs were angry and complained to Guru Gobind Singh that he was reviving the enemy. The Guru called him, and asked if this was true. Bhai Kanhaiya replied that on that field he saw no enemy, only people in need. Tradition says the Guru was pleased, and gave him ointment and bandages too, so that he could heal as well as give water.", "a": "Look at two words in the middle of the Mool Mantar. Nirbhau, without fear. And nirvair, without enmity. The One described here has no enemies. Those who try to live by this slowly keep fewer enemies in their own hearts. Bhai Kanhaiya showed what that looks like when it is hardest, in the middle of a war. He did not pretend the battle was not happening. He simply refused to let it decide who deserved water. This is not weakness. It takes great courage to kneel beside someone who was fighting you an hour ago. Fear and enmity often walk together. When we are less afraid, we have less need for enemies.", "b": "Helping someone you dislike does not mean they were right. It means your kindness does not depend on their behaviour. Think of a lamp. It gives the same light to whoever walks into the room. And there is a quiet benefit for you too. Hatred is heavy to carry. You hold it in your own chest all day, while the other person may not even know. It spoils your sleep and your mood, not theirs. Researchers who study forgiveness have found that letting go of grudges tends to go with lower stress. The one who puts the weight down walks lighter. Kindness to a difficult person is, in the end, also kindness to yourself.", "t": "Think of one person you avoid. This week, do one small simple thing: a nod, a hello, or holding the door. Nothing more is needed.", "q": "A colleague who once spoke badly about you is struggling to meet a deadline. You know how to fix the problem. What do you do?", "o": ["Let them struggle, they deserve it", "Offer a little help, without making a big deal of it", "Tell others how they once treated you"], "y": "That's a lamp kind of choice. Your help doesn't excuse what they said. It simply shows that your kindness belongs to you, and is not theirs to control. And you walk away lighter.", "n": "That reaction is very human. When someone hurts us, a part of us wants them to feel it too. But that keeps the weight on your own chest. Try offering a little help, quietly. It doesn't mean they were right. It means you are free."}, "mind1": {"ti": "Win the mind first", "s": "It is eleven at night. Just five minutes of reels, you tell yourself. You look up and it is one in the morning. The alarm is set for six.", "m": "See all people as your own fellowship. Win over your own mind, and you have won the world.", "k": "When Guru Nanak lived in Sultanpur, the Nawab, Daulat Khan, invited him to join the prayer at the mosque. Guru Nanak went along, but stood quietly while the others prayed. Afterwards, the Nawab and the Qazi asked why he had not joined them. The Janamsakhis tell his answer. The Nawab's body had been bowing, but his mind was far away, buying horses in Kabul. And the Qazi's mind was at home, worried that his newborn foal might fall into the well. So whom was he to pray with? Both men were silent for a moment, and then admitted it was true.", "a": "The yogis of that time left home to conquer the world outside. Guru Nanak points inward instead. Win your own mind, and you have won the world. The Sultanpur sakhi shows how easily the mind slips away. The Nawab and the Qazi were doing a holy act, yet their minds were on horses and foals. Our minds do the same with reels. You did not decide to lose two hours last night. Some part of your mind decided for you, one swipe at a time. Most of our daily battles are like this. They are not with the world, but with our own attention. The person who can guide the mind has done the hardest thing, and everything outside becomes easier after that.", "b": "In his book, Thinking, Fast and Slow, Daniel Kahneman describes two ways the mind works. One is fast and automatic, like swiping. The other is slow and careful, like doing a sum. Many mistakes happen because the fast one acts before the slow one wakes up. So do not depend on willpower at midnight, when you are tired. Change the setting instead. Keep the phone charging in another room, and a book near your pillow. A sweet shop owner on a diet does not sit beside the jalebis. Make the good choice the easy one. And when your mind wanders, do not scold it. Simply notice, and gently bring it back, again and again. That is the practice.", "t": "Tonight, charge your phone away from your bed. Notice how the first ten minutes feel. That restless feeling is the mind you are learning to guide.", "q": "You sit down to study for an exam, and your phone buzzes every few minutes. What's the smartest move?", "o": ["Put the phone in another room for an hour", "Promise yourself not to look at it", "Reply quickly to every message so it stops"], "y": "Spot on. You changed the setting instead of fighting your own mind. Out of sight is out of reach, and your attention gets to stay where you want it.", "n": "That's what most of us try first. But promises and quick replies keep the fast mind in charge, and it usually wins in the end. Try moving the phone to another room for an hour. Changing the setting is far easier than fighting yourself."}, "nature1": {"ti": "Air, water, earth", "s": "You take about twenty thousand breaths every day. How many of them did you notice today?", "m": "Air is the Guru, water is the father, and the great earth is the mother.", "k": "On his journey to the east, Guru Nanak came to the great temple of Jagannath at Puri. In the evening the priests performed the aarti, circling a tray of lamps, flowers and incense. They invited the Guru to join them. Tradition says he stepped out under the open sky instead, and sang a hymn that is now in Guru Granth Sahib. In it, the whole sky becomes the tray. The sun and the moon are its lamps, and the stars are scattered pearls. The breeze is the incense, and every forest offers its flowers. All of creation, he sang, is already performing the aarti.", "a": "Japji Sahib ends by calling nature our own family. Air is the Guru: it gives life with every breath and asks for nothing. Water is like a father. The great earth feeds everyone, like a mother. At Puri, Guru Nanak saw the same truth on a cosmic scale. Why build a small aarti when the whole universe is already singing one? We thank the delivery boy and the cook. We rarely think of the air, the tap water, or the soil where our food grew. They work for us every second and never send a bill. If this is family, it deserves the care we give to family: not wasting, not polluting, and sometimes simply saying thank you.", "b": "There is a second gift here. People who spend even a little time noticing nature tend to feel calmer, and less trapped inside their own problems. Stand under a wide evening sky, and your big worry looks a little smaller. Not because the worry went away, but because you remembered how large the world is. Researchers call this feeling awe, and they have found it can quiet the mind's constant chatter about ourselves. Elsewhere in Japji Sahib, Guru Nanak looks at creation and says he cannot even begin to describe it. Wonder is a kind of rest for the mind. And it is free, every single evening.", "t": "Today, step outside for two minutes without your phone. Feel the air and look at one tree or the sky. Then do one caring act: close a running tap, or water a plant.", "q": "Your weekend is packed and you feel stressed. You have twenty free minutes. Which choice will refresh you most?", "o": ["Scroll short videos in bed", "Clear out your email inbox", "Walk outside and look at the trees and the sky"], "y": "Beautiful. Twenty minutes with the sky gives your mind real rest, the kind a screen can't. You come back lighter, and often clearer about what matters.", "n": "That's a very common choice, and it feels like rest. But screens keep the mind busy, even when the body is still. Try twenty minutes outside, with the trees and the sky. Nature refreshes in a way a phone rarely can."}, "purpose1": {"ti": "The wall of small lies", "s": "Someone asks how the new job is going. You say, great! You have been unhappy there for six months. You have not even told yourself.", "m": "How can we become truthful? How can the wall of falsehood be broken?", "k": "When Nanak was young, his father, Mehta Kalu, gave him twenty rupees and sent him to the market town to strike a good bargain: buy goods that could be sold at a profit. On the way, the Janamsakhis tell, he met people who had gone hungry for days. The tellings differ on who they were, but not on what he did. He spent all twenty rupees on food for them, and walked home empty-handed. His father was furious. Nanak answered that he had made a true bargain, a sacha sauda. A gurdwara named Sacha Sauda stands at that place today.", "a": "This is the main question of Japji Sahib, and Guru Nanak asks it at the very start. How can we become truthful, and break the wall of falsehood? Small untruths pile up like bricks. I am fine. I love this course. I am not jealous. After some years there is a wall between who we are and who we show. Guru Nanak first says what will not break it: washing the body again and again, sitting in silence, piling up wealth or clever ideas. The true bargain points the other way. Young Nanak knew what his heart said was valuable, and he acted on it, even when it disappointed his father. Truthfulness begins with being honest about what really matters to you.", "b": "The writer Simon Sinek noticed that people do well when they are clear about why they do something, not only what they do. Without a true why, we copy others, and we can feel empty even when we succeed. Being truthful does not mean announcing every thought, or quitting your job tomorrow. It starts with being honest with yourself. Once you can admit, I am not happy here, you can finally do something about it: talk to someone, learn a new skill, or change one small thing. A crack in a wall cannot be repaired until someone agrees that it is there. Admitting it is not weakness. It is the first brick removed.", "t": "Finish this sentence quietly, in your mind or on paper: the thing I keep saying is fine, but is not, is. You do not have to tell anyone yet.", "q": "Everyone in your family wants you to become an engineer, but you love design. A relative asks about your plans. What is the most truthful step?", "o": ["Say engineering, to keep everyone happy", "Gently say you're exploring design, and why it matters to you", "Change the topic quickly"], "y": "That takes courage. You don't have to win the argument today. By gently sharing your why, you've removed the first brick, and the people who love you can start to see the real you.", "n": "That's very understandable. Family hopes are heavy, and keeping the peace matters. But each small hiding adds another brick to the wall. Try gently sharing that you're exploring design, and why. You can be respectful and truthful at the same time."}, "guilt1": {"ti": "Washing the heart clean", "s": "Last month you said something cruel to your younger brother. He laughed it off, but you saw his face. You still think about it at night, and you don't know how to bring it up.", "m": "When the mind is stained by wrongdoing, it is washed clean by the love of the Name.", "k": "Near Tulamba lived Sajjan, who kept an inn for travellers. On the outside he was warm and welcoming. Behind that, the Janamsakhi says, he robbed and harmed the guests who slept there. When Guru Nanak and Bhai Mardana stopped at his inn, Sajjan served them well, and waited for the night. Before sleeping, the Guru asked to sing, and Mardana played the rabab. The hymn spoke of things that look bright and clean outside, but stay dark within. Sajjan listened, and saw himself. He fell at the Guru's feet and confessed. Guru Nanak told him to give away everything he had taken wrongly, and to begin again. Sajjan did. Tradition says his inn became one of the first places where people gathered to sing Guru Nanak's hymns.", "a": "Guru Nanak compares a guilty mind to stained clothes. Clothes muddied by the road are washed with water and soap. A mind stained by wrongdoing is washed by naam, by love and remembrance of the One. Notice what this line does not say. It does not say you are stained forever. It says washing is possible. Sajjan had done far worse than most of us ever will, yet his story ends not in punishment, but in a new beginning. Look also at what the washing needed. He had to see himself clearly, admit it, and return what he had taken. Guilt, used well, is like a stain you finally notice. It is the first step towards getting clean, not the end of the story.", "b": "Psychologists separate guilt from shame. Guilt says, I did a bad thing. Shame says, I am bad. Research by June Tangney and others suggests that guilt tends to push people to repair the harm, while shame makes them hide, deny, or lash out. So the useful question is not, what kind of person am I? It is, what can I do to make this right? Usually the answer is small and brave: an honest apology, without excuses. I was wrong, and I'm sorry it hurt you. Then, changing the behaviour. The apology does not need to be perfect. It needs to be real. Most people are far more forgiving than our late-night fears imagine.", "t": "Think of one person you hurt and never apologised to. This week, send a short, honest message: I was wrong, and I'm sorry. No excuses.", "q": "You forgot your best friend's birthday, and she seems quietly hurt. What's the best thing to do?", "o": ["Pretend you haven't noticed she's upset", "Apologise honestly, and plan a small surprise to make up", "Explain at length how busy you were"], "y": "Lovely. An honest sorry plus a small act of care is exactly how a stain gets washed. She'll remember how you made it right, more than the day you forgot.", "n": "That's a natural reaction. When we feel guilty, we want to hide or explain. But long excuses can sound like her hurt doesn't matter. Try a simple, honest sorry, and a small gesture to make up for it. That is what heals."}, "joy1": {"ti": "Joy is meant to be shared", "s": "Your exam results arrive, and they're better than you hoped. You feel like singing. You call your best friend, and suddenly the happiness feels twice as big.", "m": "Says Nanak, those whose hearts are turned to the One are always in bloom.", "k": "Bhai Mardana grew up in the same village as Guru Nanak, and was his friend from childhood. He was a Muslim musician who played the rabab, a stringed instrument. When Guru Nanak set out on his long journeys, Mardana went with him, for many years and many thousands of miles. The old accounts say that when new words of praise rose in Guru Nanak, he would turn to his friend and say: Mardana, play the rabab, the bani has come. And there, under a tree or beside a river, music and words would pour out together. Their joy was never kept private. It was sung, and shared with whoever came to listen.", "a": "The word vigaas in this line means blossoming, like a flower opening in the morning. Guru Nanak says those whose hearts are turned to the One live in this kind of joy. It is not a party that ends at midnight. It is a steady blooming that stays, even on ordinary days. Mardana's rabab shows that this joy was never dull or heavy. It was musical, warm and full of friendship. A teacher born Hindu and a musician born Muslim travelled together, singing, for decades. Their joy crossed every line people usually draw. Real joy does that. It does not make us proud. It makes us want to include others.", "b": "Psychologists who study happiness have noticed something simple. When we tell someone our good news, and they respond with real interest, the good feeling tends to last longer. Shared joy grows. Joy also spreads through music, through meals, and through laughing together. And there is one more thing. People who are grateful for small things, a good cup of chai, a sunny window, a friend's voice, tend to feel happier over time than people waiting for big wins. You do not have to wait for a perfect day. A small blooming, noticed and shared, is already the real thing.", "t": "Today, share one small joy with someone: a song you love, a funny photo, a good result. And when someone shares theirs, respond with real delight.", "q": "Your colleague excitedly tells you she just got engaged. You're busy finishing a report. What's the best response?", "o": ["Say congrats without looking up", "Stop for a minute, smile, and ask how it happened", "Start telling her about your own plans instead"], "y": "Wonderful. One minute of real delight doubles her joy, and it quietly lifts yours too. That is exactly how joy is meant to work: shared, not stored.", "n": "That's a very normal response when we're busy. But a quick congrats can feel flat to someone bursting with news. Try stopping for one minute to share her excitement. Joy grows when it's received warmly, and the report can wait sixty seconds."}, "lonely1": {"ti": "Never outside the circle", "s": "You've moved to a new city for work. Weekends are the hardest. Everyone online seems to be out with friends, and your room feels very, very quiet.", "m": "All living beings have one Giver. May I never forget the One.", "k": "On his journey to the west, Guru Nanak reached Mecca. Tired after travelling, he lay down to rest, and his feet happened to point towards the Kaaba. A man saw this, and angrily woke him. How dare you point your feet towards the house of God, he asked. Guru Nanak answered gently: then turn my feet in a direction where God is not. Bhai Gurdas, who wrote within living memory of the Guru, tells this story in his very first Var. The man had no answer. There is no direction without the One.", "a": "Guru Nanak's line is short: all beings have one Giver, may I never forget. Everyone is held by that same Giver. You, the people in the city around you, your friend far away, even the stranger on the bus. The Mecca sakhi puts this into one simple picture. Turn in any direction, and the One is already there. Loneliness often whispers that we are outside the circle, that everyone else belongs and we do not. This line answers that whisper. No one is outside. It does not instantly fill an empty room. But it changes the room. You are not abandoned in it. You are held, and the next friendship is not as far away as it feels.", "b": "Loneliness is very common, especially after a move, and it says nothing bad about you. Researchers link long loneliness with stress and poorer sleep, so it is worth caring for, gently. The good news is that connection usually grows from small, repeated contact, not from one big moment. Saying hello to the same chaiwala every morning. Joining a weekly class, or helping in a gurdwara langar on Sunday, where many hands work side by side. Calling an old friend for five minutes. Each is a small thread, and threads become a rope. Remember too that many people around you are quietly lonely. Your hello might be the one they were waiting for.", "t": "This week, pick one place you can visit regularly: a class, a park, a langar. Go twice, and say hello to one person both times.", "q": "It's Sunday evening in a new city, and you feel very alone. What's a good next step?", "o": ["Tell yourself nobody wants to be your friend", "Call an old friend, and look up one local group to join", "Stay in and scroll everyone's weekend photos"], "y": "That's a brave and gentle step. An old friend reminds you that you are loved, and a local group starts new threads. You are not outside the circle. You're just finding your place in it.", "n": "That's a very honest feeling, and so many people in new cities feel it. But harsh thoughts and endless scrolling usually make loneliness heavier. Try calling an old friend and finding one local group. Small threads, one at a time, become real connection."}, "loved1": {"ti": "Seen with loving eyes", "s": "You stayed up all night helping a friend move house. Your clothes are dusty, your back hurts, and nobody said much. You wonder if anyone even noticed.", "m": "Whoever listens, trusts, and holds love in the heart, bathes in the sacred pool within, and is made clean.", "k": "At Kartarpur, Guru Nanak once had three bundles of grass cut for the cattle. The grass was wet and dripping with mud, and those standing near found reasons not to carry it. Bhai Lehna had just arrived, wearing new clothes. Without a word, he lifted all three bundles onto his head and carried them to the house. Mud ran down and soiled his clothes. When they arrived, Mata Sulakhni, the Guru's wife, was upset to see a guest treated this way. As the tradition is recorded by Macauliffe, Guru Nanak replied that it was not mud on Lehna's clothes. It was saffron, the colour of honour.", "a": "This pauri speaks of someone who listens, trusts, and keeps love in the heart. Such a person, Guru Nanak says, bathes in a sacred pool that is inside them. Love here is not only a feeling we receive. It is something we hold, and something we do. Bhai Lehna did not carry the grass to be praised. He carried it because he loved. And Guru Nanak saw that love completely. Where others saw dirt, he saw saffron. That is what being truly loved feels like. Someone looks at the very thing you thought was ugly, your tiredness, your effort, your mess, and sees its beauty. Your unseen effort is never wasted.", "b": "We all need to feel valued, and so much of our love goes unnoticed in daily life. A mother's ten thousand rotis. A friend's late-night help. The psychologist John Gottman, who studied couples for decades, found that small moments matter enormously: noticing each other, thanking each other, turning towards each other. The good news is that we can be the one who notices. When you say, I saw how hard you worked, you turn someone's mud into saffron. And when nobody notices you, remember Bhai Lehna. Love given with a pure heart is already complete. It does not need applause to be real. Still, it is kind to tell people you love them. Don't wait.", "t": "Today, notice one person's quiet effort, at home or at work, and tell them specifically: I saw what you did. Thank you.", "q": "Your mother has cooked for the family every day for years. Usually nobody says anything. What could you do tonight?", "o": ["Nothing, it's normal for mothers to cook", "Tell her what you love about her food, and thank her", "Post about her online"], "y": "Beautiful. A specific thank you turns years of unseen effort into saffron. Watch her face. That small sentence will mean more than you think.", "n": "That's what most of us do, without meaning any harm. Her work has become so normal that we stop seeing it. Try telling her directly what you love about her cooking, and thank her. Being seen is a gift we can give every single day."}, "fear1": {"ti": "When worry won't switch off", "s": "It is two in the morning. Your father's test results come tomorrow. Your mind keeps playing every bad ending like a film on repeat, and your phone is open on a search page full of frightening words. Sleep feels very far away.", "m": "The hot wind does not touch one who is in the shelter of the Supreme Lord. All around us is the protective line of the Lord's Name; no pain can reach us, brother.", "k": "Sikh tradition remembers that when Guru Arjan's young son Hargobind fell seriously ill with smallpox, many people around were frightened. Some urged the Guru to make offerings to the smallpox goddess, as was the custom. Guru Arjan did not. He stayed beside the child, kept the sangat in kirtan and prayer, and placed his trust in the Creator. When the boy recovered, the Guru's thanks became a shabad in Guru Granth Sahib: Seetla te rakhiya Bihari, You Yourself saved him from smallpox, on Ang 200. The Guru did not pretend there was no danger. He met it with care, with company and with trust, instead of with panic.", "a": "Look at the whole shabad. Its Rahao line, the centre of the shabad, says the complete Satguru has given the Name as medicine. Prof. Sahib Singh explains the hot wind as the heat of afflictions and illness. So this is not a promise that nothing hard will ever happen. It speaks about what happens inside: when the mind rests in the Name, a circle is drawn around it, and the heat of fear cannot set it on fire. The body may still fall sick; the mind need not burn. Worry feels like protection, as if thinking harder will keep us ready. Mostly it rehearses suffering that has not arrived. The shabad offers a better shelter: do what is yours to do, and rest in the One who holds everything.", "b": "At night, when the mind races, write the worry down in one line, and next to it one thing you can actually do tomorrow. Then put the paper away. You have given the worry a place, and given yourself permission to rest.", "t": "Tonight, before you sleep, read these two lines slowly three times. Then breathe out longer than you breathe in, five times.", "q": "Your best friend's mother is in hospital. At midnight your friend messages you, spiralling with what-ifs. What helps most?", "o": ["Send her links about every possible complication", "Call her, listen, help her name one next step for the morning, and stay with her until she is calmer", "Tell her to stop overthinking because worrying is useless"], "y": "That is real friendship. Company and one small next step calm a racing mind far better than more information. Your steady voice becomes a little of that protective circle for her.", "n": "You clearly want to help, and that matters. But more information at midnight usually feeds the spiral, and being told to stop worrying rarely works. What calms fear is presence: listening, one concrete next step, and someone staying close."}, "grief1": {"ti": "When someone we love is gone", "s": "It has been a month since your grandfather died. Everyone has gone back to work and school. But you still reach for your phone to send him the cricket score, and the empty chair at dinner feels louder than anything in the room.", "m": "Let no one weep for me after I am gone; that would not please me at all. A friend rejoices when his friend is honoured.", "k": "In 1574 at Goindwal, Guru Amar Das, then about ninety five years old, knew his time had come. His great-grandson, Baba Sundar, recorded what happened in a hymn called the Sadd, The Call, which is now in Guru Granth Sahib. The Guru gathered his family and Sikhs around him. He told them not to weep for him, because he was going to meet the Beloved with honour, and a true friend is glad when a friend is honoured. He asked them to sing kirtan after him, not to perform empty rituals. Then, while still alive, he seated Bhai Jetha, Guru Ram Das, on the Guru's seat and asked everyone to bow to him. Grief was given a direction.", "a": "Read in its full context, this line is not a rule that grieving people must not cry. It is the Guru speaking about his own departure, and the very next line gives the reason: a friend rejoices when a friend is honoured. The Sadd turns the family's eyes from the empty seat to where their beloved is going, and to what they can now do: sing, remember, and carry the work forward. Tears are human; Gurbani elsewhere is full of the ache of separation, called birha. What the Sadd warns against is grief that turns only into despair and ritual. Love that continues becomes praise, service, and living the values the person gave us.", "b": "Grief comes in waves, not neat stages. Some days are fine, then a song in a shop undoes you. Let both happen. Say the person's name. Keep one of their habits alive.", "t": "Today, do one small thing your loved one used to do or loved, and do it quietly in their name.", "q": "A classmate lost her mother last month and has just come back to college. People avoid her because they do not know what to say. What do you do?", "o": ["Avoid the topic completely so she does not feel sad", "Sit with her, say you are sorry, and if she wants, ask her to tell you about her mother", "Tell her everything happens for a reason and she must be strong"], "y": "That is a real gift. People who are grieving often feel their loved one is being erased by everyone's silence. Saying the name and inviting a memory keeps love alive, and lets her lead.", "n": "That comes from wanting to protect her, which is kind. But silence often feels like the person has been forgotten, and big phrases like be strong can make grief feel wrong. A simple I am sorry, and space to share a memory, helps far more."}, "forgive1": {"ti": "Letting go of the hurt", "s": "Last year your cousin spread a lie about you in the family group. He never apologised. Now there is a wedding, he will be there, and just thinking about it makes your jaw tight. You have replayed that day a hundred times.", "m": "Farid, do good even to the one who does you wrong, and do not let anger settle in your mind. Then the body is not touched by disease, and you keep everything good with you.", "k": "Sikh tradition remembers forty Sikhs who, during the long siege of Anandpur in 1705, signed a note disowning Guru Gobind Singh and went home. In their village, Mai Bhago, a brave woman of the area, shamed them and led them back to stand with the Guru. At Khidrana, today Sri Muktsar Sahib, they fought and fell. The last of them, Mahan Singh, lay dying when the Guru reached him and held his head in his lap. Asked what he wished, Mahan Singh said: forgive us, and tear up that note. The Guru took out the note and tore it. They are remembered as the Chali Mukte, the forty liberated ones.", "a": "Farid's salok sits among his saloks on humility and patience, and its reason is practical: anger kept in the mind wears on the body and the mind, and you lose the good you have. Prof. Sahib Singh reads it as: do not let anger come and live in the mind. Notice what it does not say. It does not say that what happened was fine, or that you must trust the person again. Doing good to the one who wronged you means refusing to let their wrong shape your heart. Forgiveness is first a gift you give yourself.", "b": "At the wedding you do not have to hug him or discuss the past. Greet him politely, then spend your energy on the people you love. Forgiveness can begin as simply not feeding the anger any more.", "t": "Write the hurt down once, completely. Under it write: I am choosing not to carry this today. Then tear the paper.", "q": "A friend borrowed money, delayed returning it for months and got defensive when asked. He has finally paid it back. What now?", "o": ["Tell everyone what he did so they are warned", "Let go of the anger, stay cordial, and decide calmly whether to lend again in future", "Pretend nothing happened and lend him even more next time"], "y": "Wise and big-hearted. You let go of the resentment without pretending, and kept healthy boundaries. That is forgiveness with open eyes.", "n": "Both warning others and proving your trust can come from good intentions. But spreading the story keeps the anger alive in you, and ignoring the lesson invites the same hurt. Real forgiveness drops the grudge and keeps the wisdom."}, "women1": {"ti": "Equal dignity", "s": "At a family function, an uncle jokes that girls need not study much since they will get married anyway. A few people laugh. Your younger cousin, who has just topped her class in physics, goes quiet and looks down at her plate.", "m": "Why call her lesser, from whom even kings are born?", "k": "Sikh tradition remembers Bibi Amro, the daughter of Guru Angad, who was married into the family of Amar Das's brother. Every morning she sang Guru Nanak's bani while churning milk. One day Amar Das, then past sixty and a devoted pilgrim, heard her singing and was deeply moved. He asked whose words these were, and she took him to her father, Guru Angad, at Khadur. That meeting changed his life. He served with complete devotion and later became the third Guru. A young woman's voice brought the future Guru to the Guru.", "a": "In Guru Nanak's time, women were often treated as impure, especially after childbirth, and blamed for misfortune. This salok in Asa di Var answers that head on. Every human is conceived and born through a woman; engagements, marriages, friendships and the very path of the world run through her. So how can she be called lesser? The salok ends by saying that only the One is not born of a woman, and that any face, a man's or a woman's, that praises the One shines in the true court. Dignity is not a favour given to women; it was never anyone's to take away. The Gurus put this into practice in the sangat and the langar, where everyone sat and sang together.", "b": "At home, notice who always serves and who always eats first, who is asked about career and who only about marriage. Small daily patterns teach children more than big speeches.", "t": "Today, ask a woman in your family about her dreams or her work, and really listen to the answer.", "q": "Back at that family function, your uncle's joke hangs in the air. What do you do?", "o": ["Laugh along to keep the peace", "Smile and say lightly but clearly, actually she just topped physics, and ask your cousin about her plans", "Shout at your uncle in front of everyone"], "y": "Beautifully done. You turned the moment toward your cousin's achievement without humiliating anyone. She heard that someone sees her, and the whole room heard a different story.", "n": "Keeping the peace and defending her both come from care. But laughing along teaches her that her worth is a joke, and shouting makes the moment about the fight. A light, clear correction that celebrates her is usually the strongest move."}, "work1": {"ti": "Honest work, open hands", "s": "Your friend shows you a work-from-phone scheme that promises fifty thousand rupees a month for one hour a day. You only have to pay a joining fee and recruit others. Your own job, meanwhile, feels slow and ordinary.", "m": "One who earns by honest effort, eats from it, and gives some of it away with their own hands, Nanak, such people recognise the true path.", "k": "Sikh tradition remembers that Guru Angad, even as Guru, earned his own living at Khadur by twisting munj, a coarse grass, into rope, and that the langar ran on honest, shared earnings rather than on gifts the Guru demanded. He also set up an akhara for wrestlers and taught children to read and write Gurmukhi. His days were full of ordinary work, done with full attention, and that work was itself part of his worship.", "a": "In context, this salok places two kinds of life side by side. Just before these lines, Guru Nanak describes people who turn religion into a way of living off others: a singer of hymns without understanding, a hungry mullah for whom the mosque is only a livelihood, a man who pierces his ears to look like a yogi and begs; and one who calls himself guru or pir yet goes begging, at whose feet one should not bow. Then comes the answer: earn by effort and share. Prof. Sahib Singh reads the line as giving some of that very earning to others. This is the root of three Sikh habits: kirat karni, honest work; vand chhakna, sharing; and naam japna, remembering. Honest work is not about the size of the salary; it is about whether the money came cleanly, and whether some of it flows out to others.", "b": "Schemes that pay mainly for recruiting people, not for real products or work, usually collapse and hurt the people at the bottom. If a promise sounds too easy, check it with someone you trust before paying anything.", "t": "This week, set aside a small share of what you earn, even fifty rupees, and give it with your own hands to someone who needs it.", "q": "Your sales target is due tomorrow. A colleague suggests marking some unconfirmed orders as sold, to fix later. What do you do?", "o": ["Do it, everyone does this at quarter end", "Report the true numbers, explain the gap honestly, and offer a plan to close it", "Quietly let your colleague do it and keep yourself out of it"], "y": "Strong and clean. Honest numbers protect you, your colleague and the customers. A clear plan shows your manager you care about real results, not just about looking good.", "n": "The pressure is real, and wanting to protect the team is understandable. But fudged numbers are built on sand, and staying silent still makes you part of it. Honest numbers plus a plan earn more trust in the long run."}}, hi:{"anger1": {"ti": "जवाब देने से पहले एक ठहराव", "s": "परिवार के ग्रुप में एक संदेश आता है। बात आपके बारे में है। आधा मज़ाक, पूरा ताना। चेहरा गरम हो जाता है, और उँगलियाँ ऐसा जवाब लिखने लगती हैं जो चुभेगा।", "m": "संयम को अपनी भट्ठी बनाओ, और धीरज को सुनार।", "k": "गुरु अमरदास जी जब तीसरे गुरु बने, तब वे बुज़ुर्ग हो चुके थे। गोइंदवाल में दूर दूर से लोग बस उनके पास बैठने आते थे। गुरु अंगद जी के बेटे दातू से यह सहा नहीं गया। उन्हें लगता था कि यह गद्दी उनकी होनी चाहिए थी। एक दिन वे गुस्से में भरे संगत में आए, और बुज़ुर्ग गुरु जी को लात मारकर गद्दी से गिरा दिया। पूरी सभा में सन्नाटा छा गया। गुरु जी धीरे से उठे। सिख परंपरा बताती है कि उन्होंने न आवाज़ ऊँची की, न पलटकर वार किया। उन्होंने प्यार से दातू का पैर पकड़ा, और कहा कि अगर उनकी सख़्त बूढ़ी हड्डियों से पैर को चोट लगी हो तो उन्हें अफ़सोस है। उसी शाम वे चुपचाप गोइंदवाल छोड़कर चले गए, ताकि कोई झगड़ा न हो।", "a": "गुरु नानक हमें एक सुनार की भट्ठी की तस्वीर देते हैं। सोना एक चोट में अँगूठी नहीं बनता। उसे तपाया जाता है, ढाला जाता है, ठंडा किया जाता है, और फिर ढाला जाता है, ऐसे हाथ से जो जल्दी नहीं करता। इसी को वे धीरज कहते हैं, और धीरज को औज़ारों के साथ ताक पर नहीं रखते। धीरज ख़ुद सुनार है, जो काम कर रहा है। इसलिए धीरज कमज़ोरी नहीं है, और सब कुछ चुपचाप निगल जाना भी नहीं है। यह एक हुनर है। गुरु अमरदास जी के पास पलटकर वार करने की हर वजह थी, फिर भी उस सभा में उनके धीरज ने गढ़ने का काम किया। सिगमंड फ़्रॉइड के बाद आए विचारकों ने एक बात देखी जो यहाँ ठीक बैठती है। गुस्सा अक्सर ग़लत इंसान पर उतरता है। दोपहर में बॉस डाँटता है, और रात को हम अपनी बहन पर बरस पड़ते हैं। धीरज हमें यह देखने का समय देता है कि गर्मी असल में कहाँ से आ रही है।", "b": "ठहरने से फ़ायदा क्यों होता है? गुस्सा अपने पहले कुछ पलों में सबसे तेज़ होता है, जैसे उबलकर गिरता दूध। अगर आप एक पल के लिए बर्तन आँच से उतार लें, तो दूध बैठ जाता है, और कुछ नहीं बिगड़ता। ऐसे ही दस पल का ठहराव यह नहीं कहता कि आप नाराज़ नहीं हैं। इसका मतलब है कि अब शब्द आप चुन रहे हैं, गुस्सा नहीं चुन रहा। आप फिर भी कड़ी बात कह सकते हैं। फिर भी अपनी बात पर डटे रह सकते हैं। बस कल सुबह यह नहीं सोचना पड़ेगा कि काश मैंने अलग तरह से कहा होता। जो लोग यह सीख लेते हैं, वे परिवार या दफ़्तर के शांत लोग बन जाते हैं, जिन पर मुश्किल में सब भरोसा करते हैं। वह भरोसा एक एक रुके हुए जवाब से बनता है।", "t": "अगली बार जब कोई संदेश चुभे, फ़ोन उलटा रख दीजिए और तीन धीमी साँसें लीजिए। फिर तय कीजिए कि क्या कहना है, या आज कुछ कहना भी है या नहीं।", "q": "एक दोस्त ने आख़िरी पल में फिर से आपका प्लान रद्द कर दिया। आपके अंदर गुस्सा उठ रहा है। आप सबसे पहले क्या करेंगे?", "o": ["तुरंत एक गुस्से वाला वॉइस नोट भेज देंगे", "थोड़ा रुकेंगे, फिर शांति से बताएँगे कि कैसा लगा", "एक हफ़्ते तक उससे बात नहीं करेंगे"], "y": "बहुत सुंदर चुनाव। थोड़ा रुकना ही सुनार का काम है। जब आप शांति से बताते हैं कि कैसा लगा, तो दोस्त सच में आपकी बात सुन पाता है, आपके गुस्से से बचाव नहीं करता। आप दोस्ती भी बचाते हैं और अपना सुकून भी।", "n": "यह एक सच्चा जवाब है, और लगभग हर किसी ने यह खिंचाव महसूस किया है। गुस्सा जल्दी कुछ करना चाहता है, या तो वार करके या ठंडा पड़कर। पर दोनों से बात अक्सर और बिगड़ती है। थोड़ा रुककर, शांति से बताकर देखिए कि कैसा लगा। उस पल में यह मुश्किल लगता है, पर बाद में मन बहुत हल्का रहता है।"}, "ego1": {"ti": "यह असल में किसने किया?", "s": "आपको तरक़्क़ी मिलती है। घर लौटते हुए आप ख़ुद से कहते हैं, यह मैंने किया। सिर्फ़ मैंने। फिर याद आता है वह अध्यापक जो देर तक रुकते थे, वह दोस्त जिसने नौकरी की ख़बर भेजी थी, और माँ, जिसने पंद्रह साल टिफ़िन बाँधा।", "m": "हर कोई हुकम के भीतर है, उसके बाहर कोई नहीं। जो इस बात को समझ लेता है, वह मैं, मैं कहना छोड़ देता है।", "k": "एक बार मुग़ल बादशाह अकबर गुरु अमरदास जी से मिलने गोइंदवाल आए। वे देश के सबसे ताक़तवर इंसान थे, बड़े ठाट बाट से स्वागत के आदी। पर गुरु जी के यहाँ एक सीधा सा नियम था: पहले पंगत, फिर संगत। गुरु जी से मिलने से पहले हर कोई ज़मीन पर एक पंक्ति में बैठकर लंगर का एक जैसा भोजन करता था। अमीर और ग़रीब, हिंदू और मुसलमान, कंधे से कंधा मिलाकर। परंपरा बताती है कि बादशाह ने भी यही किया। वे किसानों और मुसाफ़िरों के बीच बैठे, और वही सादा भोजन किया। उसके बाद ही वे गुरु जी से मिलने गए।", "a": "यहाँ दो शब्द ज़रूरी हैं। हुकम वह बड़ी व्यवस्था है जिसका हर चीज़ हिस्सा है, जैसे पूरे समुद्र में एक लहर। हउमै वह आदत है जो कहती है, मैंने किया, यह मेरा है। गुरु नानक दोनों को जोड़ते हैं। समुद्र जितना साफ़ दिखता है, लहर उतना कम इतराती है। लंगर की ज़मीन पर बैठे अकबर इसी बात की जीती जागती तस्वीर हैं। उस ज़मीन पर एक बादशाह भी बस एक और भूखा इंसान था, क्योंकि वहाँ हर कोई एक ही व्यवस्था का हिस्सा था। भारत का एक पुराना ग्रंथ, अष्टावक्र गीता, इसी आदत की एक तीखी तस्वीर देता है। वह कहता है कि मैं करने वाला हूँ, यह सोच साँप के डसने जैसी है। इसका ज़हर हमें अच्छे समय में घमंडी बना देता है, और बुरे समय में तोड़ देता है।", "b": "इसका मतलब यह नहीं कि आपकी मेहनत कुछ नहीं थी। आपने मेहनत की, और वह सच है। मतलब यह है कि आपकी मेहनत एक बड़ी कहानी का एक हिस्सा थी। ट्रॉफ़ी उठाते क्रिकेट कप्तान को देखिए। अच्छे कप्तान सबसे पहले टीम, कोच और मैदान के कर्मचारियों का नाम लेते हैं। वे जानते हैं कि उस ट्रॉफ़ी पर बहुत से हाथ हैं। जो लोग जीवन को ऐसे देखते हैं, उनके साथ काम करना आसान होता है। वे ज़्यादा धन्यवाद कहते हैं, और लोग फिर से उनकी मदद करना चाहते हैं। और जब कोई योजना बिगड़ती है तो वे टूटते नहीं, क्योंकि उन्होंने कभी माना ही नहीं था कि सब कुछ उनके अपने हाथ में है। शुक्रगुज़ारी और नम्रता असल में एक ही चीज़ हैं, बस दो तरफ़ से देखी गई।", "t": "आज रात अपने जीवन की एक अच्छी चीज़ के बारे में सोचिए। तीन लोगों या मौक़ों के नाम लीजिए जिनकी वजह से वह हो पाई। फिर उनमें से एक को धन्यवाद कहिए।", "q": "आपकी टीम के प्रोजेक्ट को इनाम मिला है। मीटिंग में बॉस पूछते हैं कि यह कैसे हुआ। आप क्या कहेंगे?", "o": ["वे सारे हिस्से बताएँगे जो आपने ख़ुद किए", "पहले मदद करने वालों के नाम लेंगे, फिर अपना हिस्सा बताएँगे", "कुछ नहीं कहेंगे, उन्हें अंदाज़ा लगाने देंगे"], "y": "बहुत अच्छा। पहले दूसरों का नाम लेने से आप छोटे नहीं होते। यह दिखाता है कि आप पूरा समुद्र देखते हैं, सिर्फ़ अपनी लहर नहीं। लोग उस इंसान को याद रखते हैं जिसने श्रेय बाँटा, और फिर से उसके साथ काम करना चाहते हैं।", "n": "यह बहुत इंसानी जवाब है। हम सब चाहते हैं कि हमारी मेहनत दिखे, और उसे दिखना भी चाहिए। पहले मदद करने वालों के नाम लेकर, फिर अपना हिस्सा बताकर देखिए। आपका काम तब भी चमकेगा, बस अब सबके काम के साथ, जैसा असल में हुआ था।"}, "comp1": {"ti": "ऊँचा, नीचा", "s": "आप फ़ोन खोलते हैं। एक सहपाठी ने नई गाड़ी ली है। एक रिश्तेदार कनाडा चला गया है। दस पल में एक अच्छा भला दिन नाकाम ज़िंदगी जैसा लगने लगता है।", "m": "नानक कहते हैं, न कोई ऊँचा है, न कोई नीचा।", "k": "सैदपुर नगर में भाई लालो रहते थे, एक बढ़ई जो अपने हाथों की मेहनत से रोटी कमाते थे। जब गुरु नानक उस नगर में आए, तो उन्होंने लालो के छोटे से घर में रहना चुना। पास ही मलिक भागो रहता था, एक अमीर अफ़सर, जिसने एक बड़ी दावत रखी और आसपास के सब संतों को बुलाया। गुरु नानक नहीं गए। नाराज़ होकर मलिक भागो ने उन्हें बुलवाया और पूछा कि वे इतने बढ़िया खाने को छोड़कर एक ग़रीब की सूखी रोटी क्यों पसंद करते हैं। जनमसाखी बताती है कि गुरु जी ने एक हाथ में लालो की मोटी रोटी ली और दूसरे में भागो का पकवान, और दोनों को दबाया। बढ़ई की रोटी से दूध निकला। दावत के पकवान से ख़ून।", "a": "इस पंक्ति से ठीक पहले गुरु नानक कई ऐसी चीज़ें गिनाते हैं जो पूरी तरह हमारे बस में नहीं हैं। बोलना, चुप रहना, माँगना, देना, जीना। जब हमारे पास जो
