var LESSONS = {"en": {"anger1": "Anger is fast; [[wisdom is a pause]]. Let self-control be your workshop and patience your goldsmith. Before you reply, breathe, wait, and let the heat cool. Then speak in a way you will not regret tomorrow.", "ego1": "[[No success is yours alone.]] Teachers, family, timing and countless unseen hands helped you get here. Remembering the bigger order keeps the I, I quiet, and lets you celebrate with gratitude instead of pride.", "comp1": "[[No one is high and no one is low.]] Comparison steals joy and hides people from us. Measure yourself against who you were yesterday, and give everyone, from the boss to the cleaner, the same respect.", "accept1": "[[Do your part fully, then let go of the rest.]] Much of life is outside your hands. Walking with hukam means effort without anxiety: act well where you can, and accept calmly where you cannot.", "content1": "[[Enough is a feeling, not a number.]] Contentment means honest effort and simple gratitude for what you already have. Chasing more never ends. Noticing enough lets peace begin today.", "listen1": "[[Listening heals more than advice.]] When someone speaks, give them your full attention instead of planning your reply. Truly listening, to people and to the Guru's word, washes away pain and misunderstanding.", "habit1": "[[Small things done daily become who you are.]] Like Amar Das carrying water every dawn, a few calm minutes each morning shape the mind more than rare big efforts ever can.", "action1": "[[You reap what you sow.]] Your words and actions are seeds. Plant honesty, kindness and effort today, and the harvest will be yours. No one else can plant your field for you.", "hard1": "[[Hard days are part of life, not the end of it.]] Pain comes to everyone. Accept the day, reach out to someone who cares, do one small kind thing, and trust that heavy seasons pass.", "kind1": "[[Without fear, without enmity.]] Seeing the same light in everyone means helping without asking whose side they are on, just as Bhai Kanhaiya gave water to every wounded soldier.", "mind1": "[[Win your own mind, and you win the world.]] A restless mind runs to worries and screens. Gently bring it back to the present, again and again. That quiet practice is the real victory.", "nature1": "[[Air is our teacher, water our father, earth our mother.]] Treat nature like family: waste less, pollute nothing, and pause each day to notice the sky, trees and water that keep us alive.", "purpose1": "[[Truth is built one honest choice at a time.]] The wall of small lies grows brick by brick, and it falls the same way. Choose honesty in little things, and your whole life becomes truthful.", "guilt1": "[[Mistakes can be washed clean.]] Guilt is a signal, not a sentence. Admit the wrong, say sorry, make amends and change the habit. Love and honest change wash the mind like water washes cloth.", "joy1": "[[Joy grows when it is shared.]] Those whose hearts turn to the One stay in bloom. Celebrate your good moments, laugh, sing, and let others into your happiness. Shared joy doubles.", "lonely1": "[[You are never outside the circle.]] All beings have one Giver, so no one is truly alone. When loneliness comes, reach out to one person, and remember you belong to a much larger family.", "loved1": "[[You are valued for who you are, not for what you produce.]] Loving eyes turned mud into saffron. Accept that you matter, and look at others with the same loving eyes.", "fear1": "[[Worry is not protection; trust and presence are.]] Do what is yours to do, then rest inside the circle of the Name. The heat may come, but it need not set the mind on fire.", "grief1": "[[Love does not end; it changes form.]] Grieve honestly, then let love become remembrance, praise and service. Carry their light forward, as Guru Amar Das asked his family to sing rather than despair.", "forgive1": "[[Forgiving frees you first.]] Do not let anger settle and live in your mind. You can let go of resentment and still keep your boundaries. Doing good is your choice, not a reward they earned.", "women1": "[[Dignity is no one's to give or take.]] Every life comes through a woman; why call her lesser? Make equal respect a daily habit at home: who studies, who speaks, who eats first.", "work1": "[[Earn honestly, share with open hands.]] Honest work, sharing and remembering go together. The true path is recognised not by a holy appearance but by clean earning and a giving hand."}, "hi": {"anger1": "गुस्सा तेज़ होता है; [[समझदारी एक ठहराव है]]। संयम को अपनी कार्यशाला और धीरज को अपना सुनार बनाइए। जवाब देने से पहले साँस लीजिए, रुकिए और गर्मी को ठंडा होने दीजिए। फिर ऐसे बोलिए कि कल पछताना न पड़े।", "ego1": "[[कोई भी सफलता अकेले आपकी नहीं होती।]] अध्यापक, परिवार, सही समय और अनगिनत अनदेखे हाथों ने आपको यहाँ तक पहुँचाया। बड़े हुकम को याद रखने से मैं, मैं शांत रहता है और आप घमंड की जगह शुक्राने से खुशी मनाते हैं।", "comp1": "[[न कोई ऊँचा है, न कोई नीचा।]] तुलना खुशी छीन लेती है और लोगों को हमसे छिपा देती है। खुद को कल वाले खुद से नापिए, और मालिक से लेकर सफ़ाई करने वाले तक, सबको एक जैसा सम्मान दीजिए।", "accept1": "[[अपना हिस्सा पूरे मन से कीजिए, बाक़ी छोड़ दीजिए।]] ज़िंदगी का बहुत कुछ हमारे हाथ में नहीं है। हुकम के साथ चलना यानी बिना बेचैनी के मेहनत: जहाँ हो सके अच्छा कीजिए, जहाँ न हो सके शांति से मान लीजिए।", "content1": "[[काफ़ी होना एक एहसास है, कोई गिनती नहीं।]] संतोख का मतलब है ईमानदार मेहनत और जो है उसके लिए सीधा-सा शुक्राना। और ज़्यादा की दौड़ कभी ख़त्म नहीं होती। काफ़ी को पहचानने से शांति आज ही शुरू हो जाती है।", "listen1": "[[सुनना सलाह से ज़्यादा भरता है।]] जब कोई बोले, तो जवाब सोचने की जगह पूरा ध्यान उसे दीजिए। लोगों को और गुरु की बाणी को सच में सुनने से दुख और ग़लतफ़हमी धुल जाती हैं।", "habit1": "[[रोज़ की छोटी बातें ही आपकी पहचान बनती हैं।]] जैसे अमरदास जी हर सुबह पानी लाते रहे, वैसे ही हर सुबह के कुछ शांत मिनट मन को उतना गढ़ते हैं जितना कभी-कभार की बड़ी कोशिश कभी नहीं गढ़ सकती।", "action1": "[[जो बोते हैं, वही काटते हैं।]] आपके शब्द और काम बीज हैं। आज ईमानदारी, दया और मेहनत बोइए, फ़सल आपकी होगी। आपका खेत कोई और नहीं बो सकता।", "hard1": "[[कठिन दिन ज़िंदगी का हिस्सा हैं, उसका अंत नहीं।]] दुख सबके पास आता है। दिन को स्वीकार कीजिए, किसी अपने से बात कीजिए, एक छोटा अच्छा काम कीजिए, और भरोसा रखिए कि भारी मौसम बीत जाते हैं।", "kind1": "[[निरभउ, निरवैर: बिना डर, बिना दुश्मनी।]] सबमें एक ही ज्योति देखने का मतलब है बिना पूछे मदद करना कि कौन किस तरफ़ है, जैसे भाई घनैया ने हर घायल सिपाही को पानी पिलाया।", "mind1": "[[मन जीत लिया, तो जग जीत लिया।]] बेचैन मन चिंताओं और स्क्रीन की ओर भागता है। उसे प्यार से बार-बार वर्तमान में वापस लाइए। यही शांत अभ्यास असली जीत है।", "nature1": "[[हवा गुरु है, पानी पिता है, धरती माता है।]] प्रकृति को परिवार की तरह रखिए: कम बर्बाद कीजिए, कुछ भी गंदा मत कीजिए, और रोज़ एक पल रुककर आसमान, पेड़ और पानी को देखिए जो हमें ज़िंदा रखते हैं।", "purpose1": "[[सच एक-एक ईमानदार फ़ैसले से बनता है।]] छोटे झूठों की दीवार ईंट-ईंट से बनती है और वैसे ही गिरती है। छोटी बातों में ईमानदारी चुनिए, पूरी ज़िंदगी सच्ची हो जाएगी।", "guilt1": "[[ग़लतियाँ धोई जा सकती हैं।]] पछतावा एक इशारा है, सज़ा नहीं। ग़लती मानिए, माफ़ी माँगिए, भरपाई कीजिए और आदत बदलिए। प्यार और सच्चा बदलाव मन को ऐसे धोते हैं जैसे पानी कपड़े को।", "joy1": "[[ख़ुशी बाँटने से बढ़ती है।]] जिनका मन एक से जुड़ा है, वे सदा खिले रहते हैं। अपने अच्छे पलों का जश्न मनाइए, हँसिए, गाइए, और दूसरों को भी अपनी ख़ुशी में शामिल कीजिए। बाँटी हुई ख़ुशी दुगनी होती है।", "lonely1": "[[आप कभी दायरे से बाहर नहीं हैं।]] सब जीवों का एक ही दाता है, इसलिए कोई सच में अकेला नहीं। जब अकेलापन आए, तो किसी एक इंसान से संपर्क कीजिए, और याद रखिए कि आप एक बहुत बड़े परिवार का हिस्सा हैं।", "loved1": "[[आपकी क़ीमत आप ख़ुद हैं, आपका काम नहीं।]] प्यार भरी आँखों ने कीचड़ को केसर बना दिया। मान लीजिए कि आप मायने रखते हैं, और दूसरों को भी उन्हीं प्यार भरी आँखों से देखिए।", "fear1": "[[चिंता सुरक्षा नहीं है; भरोसा और साथ हैं।]] जो आपके हाथ में है वह कीजिए, फिर नाम के घेरे में आराम कीजिए। तपिश आ सकती है, पर मन को जलाना ज़रूरी नहीं।", "grief1": "[[प्यार ख़त्म नहीं होता; रूप बदलता है।]] सच्चाई से शोक कीजिए, फिर प्यार को याद, स्तुति और सेवा बनने दीजिए। उनकी रोशनी आगे ले चलिए, जैसे गुरु अमरदास जी ने परिवार से निराशा की जगह कीर्तन करने को कहा।", "forgive1": "[[माफ़ी सबसे पहले आपको आज़ाद करती है।]] गुस्से को मन में टिकने और बसने मत दीजिए। आप नाराज़गी छोड़कर भी अपनी सीमाएँ रख सकते हैं। भला करना आपका चुनाव है, उनका कमाया इनाम नहीं।", "women1": "[[सम्मान किसी का देने या छीनने का नहीं।]] हर जीवन स्त्री से आता है; उसे छोटा क्यों कहें? घर में बराबर सम्मान को रोज़ की आदत बनाइए: कौन पढ़ता है, कौन बोलता है, कौन पहले खाता है।", "work1": "[[ईमानदारी से कमाइए, खुले हाथ से बाँटिए।]] ईमानदार मेहनत, बाँटना और याद रखना साथ चलते हैं। सच्ची राह पवित्र दिखावे से नहीं, साफ़ कमाई और देने वाले हाथ से पहचानी जाती है।"}, "pa": {"anger1": "ਗੁੱਸਾ ਤੇਜ਼ ਹੁੰਦਾ ਹੈ; [[ਸਿਆਣਪ ਇਕ ਠਹਿਰਾਅ ਹੈ]]। ਜਤ ਨੂੰ ਆਪਣੀ ਕਾਰਜਸ਼ਾਲਾ ਤੇ ਧੀਰਜ ਨੂੰ ਆਪਣਾ ਸੁਨਿਆਰ ਬਣਾਓ। ਜਵਾਬ ਦੇਣ ਤੋਂ ਪਹਿਲਾਂ ਸਾਹ ਲਓ, ਰੁਕੋ ਤੇ ਗਰਮੀ ਨੂੰ ਠੰਢਾ ਹੋਣ ਦਿਓ। ਫਿਰ ਇਉਂ ਬੋਲੋ ਕਿ ਕੱਲ੍ਹ ਪਛਤਾਉਣਾ ਨਾ ਪਵੇ।", "ego1": "[[ਕੋਈ ਵੀ ਕਾਮਯਾਬੀ ਇਕੱਲੀ ਤੁਹਾਡੀ ਨਹੀਂ ਹੁੰਦੀ।]] ਅਧਿਆਪਕ, ਪਰਿਵਾਰ, ਸਹੀ ਸਮਾਂ ਤੇ ਅਣਗਿਣਤ ਅਣਦਿਸਦੇ ਹੱਥਾਂ ਨੇ ਤੁਹਾਨੂੰ ਇੱਥੇ ਤਕ ਪਹੁੰਚਾਇਆ। ਵੱਡੇ ਹੁਕਮ ਨੂੰ ਯਾਦ ਰੱਖਣ ਨਾਲ ਹਉਮੈ ਸ਼ਾਂਤ ਰਹਿੰਦੀ ਹੈ ਤੇ ਤੁਸੀਂ ਘਮੰਡ ਦੀ ਥਾਂ ਸ਼ੁਕਰਾਨੇ ਨਾਲ ਖ਼ੁਸ਼ੀ ਮਨਾਉਂਦੇ ਹੋ।", "comp1": "[[ਨਾ ਕੋਈ ਉੱਚਾ ਹੈ, ਨਾ ਕੋਈ ਨੀਵਾਂ।]] ਤੁਲਨਾ ਖ਼ੁਸ਼ੀ ਖੋਹ ਲੈਂਦੀ ਹੈ ਤੇ ਲੋਕਾਂ ਨੂੰ ਸਾਡੇ ਤੋਂ ਲੁਕਾ ਦਿੰਦੀ ਹੈ। ਆਪਣੇ ਆਪ ਨੂੰ ਕੱਲ੍ਹ ਵਾਲੇ ਆਪ ਨਾਲ ਮਿਣੋ, ਤੇ ਮਾਲਕ ਤੋਂ ਲੈ ਕੇ ਸਫ਼ਾਈ ਕਰਨ ਵਾਲੇ ਤਕ, ਸਭ ਨੂੰ ਇਕੋ ਜਿਹਾ ਆਦਰ ਦਿਓ।", "accept1": "[[ਆਪਣਾ ਹਿੱਸਾ ਪੂਰੇ ਮਨ ਨਾਲ ਕਰੋ, ਬਾਕੀ ਛੱਡ ਦਿਓ।]] ਜ਼ਿੰਦਗੀ ਦਾ ਬਹੁਤ ਕੁਝ ਸਾਡੇ ਹੱਥ ਵਿਚ ਨਹੀਂ। ਹੁਕਮ ਨਾਲ ਤੁਰਨਾ ਯਾਨੀ ਬਿਨਾਂ ਬੇਚੈਨੀ ਦੇ ਮਿਹਨਤ: ਜਿੱਥੇ ਹੋ ਸਕੇ ਚੰਗਾ ਕਰੋ, ਜਿੱਥੇ ਨਾ ਹੋ ਸਕੇ ਸ਼ਾਂਤੀ ਨਾਲ ਮੰਨ ਲਓ।", "content1": "[[ਕਾਫ਼ੀ ਹੋਣਾ ਇਕ ਅਹਿਸਾਸ ਹੈ, ਕੋਈ ਗਿਣਤੀ ਨਹੀਂ।]] ਸੰਤੋਖ ਦਾ ਅਰਥ ਹੈ ਇਮਾਨਦਾਰ ਮਿਹਨਤ ਤੇ ਜੋ ਹੈ ਉਸ ਲਈ ਸਿੱਧਾ ਜਿਹਾ ਸ਼ੁਕਰਾਨਾ। ਹੋਰ ਦੀ ਦੌੜ ਕਦੇ ਨਹੀਂ ਮੁੱਕਦੀ। ਕਾਫ਼ੀ ਨੂੰ ਪਛਾਣਨ ਨਾਲ ਸ਼ਾਂਤੀ ਅੱਜ ਹੀ ਸ਼ੁਰੂ ਹੋ ਜਾਂਦੀ ਹੈ।", "listen1": "[[ਸੁਣਨਾ ਸਲਾਹ ਨਾਲੋਂ ਵੱਧ ਭਰਦਾ ਹੈ।]] ਜਦੋਂ ਕੋਈ ਬੋਲੇ, ਤਾਂ ਜਵਾਬ ਸੋਚਣ ਦੀ ਥਾਂ ਪੂਰਾ ਧਿਆਨ ਉਸ ਨੂੰ ਦਿਓ। ਲੋਕਾਂ ਨੂੰ ਤੇ ਗੁਰੂ ਦੀ ਬਾਣੀ ਨੂੰ ਸੱਚਮੁੱਚ ਸੁਣਨ ਨਾਲ ਦੁੱਖ ਤੇ ਗ਼ਲਤਫ਼ਹਿਮੀ ਧੁਲ ਜਾਂਦੇ ਹਨ।", "habit1": "[[ਰੋਜ਼ ਦੀਆਂ ਛੋਟੀਆਂ ਗੱਲਾਂ ਹੀ ਤੁਹਾਡੀ ਪਛਾਣ ਬਣਦੀਆਂ ਹਨ।]] ਜਿਵੇਂ ਅਮਰਦਾਸ ਜੀ ਹਰ ਸਵੇਰ ਪਾਣੀ ਲਿਆਉਂਦੇ ਰਹੇ, ਉਵੇਂ ਹੀ ਹਰ ਸਵੇਰ ਦੇ ਕੁਝ ਸ਼ਾਂਤ ਮਿੰਟ ਮਨ ਨੂੰ ਉਸ ਤੋਂ ਵੱਧ ਘੜਦੇ ਹਨ ਜਿੰਨਾ ਕਦੇ-ਕਦਾਈਂ ਦੀ ਵੱਡੀ ਕੋਸ਼ਿਸ਼।", "action1": "[[ਜੋ ਬੀਜਦੇ ਹਾਂ, ਉਹੀ ਵੱਢਦੇ ਹਾਂ।]] ਤੁਹਾਡੇ ਸ਼ਬਦ ਤੇ ਕੰਮ ਬੀਜ ਹਨ। ਅੱਜ ਇਮਾਨਦਾਰੀ, ਦਇਆ ਤੇ ਮਿਹਨਤ ਬੀਜੋ, ਫ਼ਸਲ ਤੁਹਾਡੀ ਹੋਵੇਗੀ। ਤੁਹਾਡਾ ਖੇਤ ਕੋਈ ਹੋਰ ਨਹੀਂ ਬੀਜ ਸਕਦਾ।", "hard1": "[[ਔਖੇ ਦਿਨ ਜ਼ਿੰਦਗੀ ਦਾ ਹਿੱਸਾ ਹਨ, ਉਸ ਦਾ ਅੰਤ ਨਹੀਂ।]] ਦੁੱਖ ਸਭ ਕੋਲ ਆਉਂਦਾ ਹੈ। ਦਿਨ ਨੂੰ ਪਰਵਾਨ ਕਰੋ, ਕਿਸੇ ਆਪਣੇ ਨਾਲ ਗੱਲ ਕਰੋ, ਇਕ ਛੋਟਾ ਚੰਗਾ ਕੰਮ ਕਰੋ, ਤੇ ਭਰੋਸਾ ਰੱਖੋ ਕਿ ਭਾਰੇ ਮੌਸਮ ਲੰਘ ਜਾਂਦੇ ਹਨ।", "kind1": "[[ਨਿਰਭਉ, ਨਿਰਵੈਰ: ਬਿਨਾਂ ਡਰ, ਬਿਨਾਂ ਵੈਰ।]] ਸਭ ਵਿਚ ਇਕੋ ਜੋਤ ਵੇਖਣ ਦਾ ਅਰਥ ਹੈ ਬਿਨਾਂ ਪੁੱਛੇ ਮਦਦ ਕਰਨਾ ਕਿ ਕੌਣ ਕਿਸ ਪਾਸੇ ਹੈ, ਜਿਵੇਂ ਭਾਈ ਘਨੱਈਆ ਨੇ ਹਰ ਜ਼ਖ਼ਮੀ ਸਿਪਾਹੀ ਨੂੰ ਪਾਣੀ ਪਿਲਾਇਆ।", "mind1": "[[ਮਨ ਜਿੱਤਿਆ ਤਾਂ ਜਗ ਜਿੱਤਿਆ।]] ਬੇਚੈਨ ਮਨ ਫ਼ਿਕਰਾਂ ਤੇ ਸਕਰੀਨਾਂ ਵੱਲ ਭੱਜਦਾ ਹੈ। ਉਸ ਨੂੰ ਪਿਆਰ ਨਾਲ ਵਾਰ-ਵਾਰ ਵਰਤਮਾਨ ਵਿਚ ਵਾਪਸ ਲਿਆਓ। ਇਹੀ ਸ਼ਾਂਤ ਅਭਿਆਸ ਅਸਲ ਜਿੱਤ ਹੈ।", "nature1": "[[ਪਵਣੁ ਗੁਰੂ, ਪਾਣੀ ਪਿਤਾ, ਧਰਤੀ ਮਾਤਾ।]] ਕੁਦਰਤ ਨੂੰ ਪਰਿਵਾਰ ਵਾਂਗ ਸਾਂਭੋ: ਘੱਟ ਬਰਬਾਦ ਕਰੋ, ਕੁਝ ਵੀ ਗੰਦਾ ਨਾ ਕਰੋ, ਤੇ ਰੋਜ਼ ਇਕ ਪਲ ਰੁਕ ਕੇ ਅਸਮਾਨ, ਰੁੱਖਾਂ ਤੇ ਪਾਣੀ ਨੂੰ ਵੇਖੋ ਜੋ ਸਾਨੂੰ ਜਿਊਂਦਾ ਰੱਖਦੇ ਹਨ।", "purpose1": "[[ਸੱਚ ਇਕ-ਇਕ ਇਮਾਨਦਾਰ ਫ਼ੈਸਲੇ ਨਾਲ ਬਣਦਾ ਹੈ।]] ਛੋਟੇ ਝੂਠਾਂ ਦੀ ਕੰਧ ਇੱਟ-ਇੱਟ ਨਾਲ ਬਣਦੀ ਹੈ ਤੇ ਉਵੇਂ ਹੀ ਡਿੱਗਦੀ ਹੈ। ਛੋਟੀਆਂ ਗੱਲਾਂ ਵਿਚ ਇਮਾਨਦਾਰੀ ਚੁਣੋ, ਸਾਰੀ ਜ਼ਿੰਦਗੀ ਸੱਚੀ ਹੋ ਜਾਵੇਗੀ।", "guilt1": "[[ਗ਼ਲਤੀਆਂ ਧੋਤੀਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ।]] ਪਛਤਾਵਾ ਇਕ ਇਸ਼ਾਰਾ ਹੈ, ਸਜ਼ਾ ਨਹੀਂ। ਗ਼ਲਤੀ ਮੰਨੋ, ਮਾਫ਼ੀ ਮੰਗੋ, ਭਰਪਾਈ ਕਰੋ ਤੇ ਆਦਤ ਬਦਲੋ। ਪਿਆਰ ਤੇ ਸੱਚਾ ਬਦਲਾਅ ਮਨ ਨੂੰ ਇਉਂ ਧੋਂਦੇ ਹਨ ਜਿਵੇਂ ਪਾਣੀ ਕੱਪੜੇ ਨੂੰ।", "joy1": "[[ਖ਼ੁਸ਼ੀ ਵੰਡਣ ਨਾਲ ਵਧਦੀ ਹੈ।]] ਜਿਨ੍ਹਾਂ ਦਾ ਮਨ ਇਕ ਨਾਲ ਜੁੜਿਆ ਹੈ, ਉਹ ਸਦਾ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ। ਆਪਣੇ ਚੰਗੇ ਪਲਾਂ ਦੀ ਖ਼ੁਸ਼ੀ ਮਨਾਓ, ਹੱਸੋ, ਗਾਓ, ਤੇ ਹੋਰਾਂ ਨੂੰ ਵੀ ਆਪਣੀ ਖ਼ੁਸ਼ੀ ਵਿਚ ਸ਼ਾਮਲ ਕਰੋ। ਵੰਡੀ ਹੋਈ ਖ਼ੁਸ਼ੀ ਦੁੱਗਣੀ ਹੁੰਦੀ ਹੈ।", "lonely1": "[[ਤੁਸੀਂ ਕਦੇ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਨਹੀਂ।]] ਸਭ ਜੀਆਂ ਦਾ ਇਕੋ ਦਾਤਾ ਹੈ, ਇਸ ਲਈ ਕੋਈ ਸੱਚਮੁੱਚ ਇਕੱਲਾ ਨਹੀਂ। ਜਦੋਂ ਇਕੱਲਾਪਣ ਆਵੇ, ਤਾਂ ਕਿਸੇ ਇਕ ਇਨਸਾਨ ਨਾਲ ਸੰਪਰਕ ਕਰੋ, ਤੇ ਯਾਦ ਰੱਖੋ ਕਿ ਤੁਸੀਂ ਇਕ ਬਹੁਤ ਵੱਡੇ ਪਰਿਵਾਰ ਦਾ ਹਿੱਸਾ ਹੋ।", "loved1": "[[ਤੁਹਾਡੀ ਕੀਮਤ ਤੁਸੀਂ ਆਪ ਹੋ, ਤੁਹਾਡਾ ਕੰਮ ਨਹੀਂ।]] ਪਿਆਰ ਭਰੀਆਂ ਅੱਖਾਂ ਨੇ ਚਿੱਕੜ ਨੂੰ ਕੇਸਰ ਬਣਾ ਦਿੱਤਾ। ਮੰਨ ਲਓ ਕਿ ਤੁਸੀਂ ਮਾਇਨੇ ਰੱਖਦੇ ਹੋ, ਤੇ ਹੋਰਾਂ ਨੂੰ ਵੀ ਉਨ੍ਹਾਂ ਹੀ ਪਿਆਰ ਭਰੀਆਂ ਅੱਖਾਂ ਨਾਲ ਵੇਖੋ।", "fear1": "[[ਚਿੰਤਾ ਸੁਰੱਖਿਆ ਨਹੀਂ; ਭਰੋਸਾ ਅਤੇ ਸਾਥ ਹਨ।]] ਜੋ ਤੁਹਾਡੇ ਹੱਥ ਵਿੱਚ ਹੈ ਉਹ ਕਰੋ, ਫਿਰ ਨਾਮ ਦੇ ਘੇਰੇ ਵਿੱਚ ਆਰਾਮ ਕਰੋ। ਸੇਕ ਆ ਸਕਦਾ ਹੈ, ਪਰ ਮਨ ਦਾ ਸੜਨਾ ਜ਼ਰੂਰੀ ਨਹੀਂ।", "grief1": "[[ਪਿਆਰ ਮੁੱਕਦਾ ਨਹੀਂ; ਰੂਪ ਬਦਲਦਾ ਹੈ।]] ਸੱਚਾਈ ਨਾਲ ਸੋਗ ਕਰੋ, ਫਿਰ ਪਿਆਰ ਨੂੰ ਯਾਦ, ਸਿਫ਼ਤ ਅਤੇ ਸੇਵਾ ਬਣਨ ਦਿਓ। ਉਨ੍ਹਾਂ ਦੀ ਰੌਸ਼ਨੀ ਅੱਗੇ ਲੈ ਕੇ ਚੱਲੋ, ਜਿਵੇਂ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਪਰਿਵਾਰ ਨੂੰ ਨਿਰਾਸ਼ਾ ਦੀ ਥਾਂ ਕੀਰਤਨ ਕਰਨ ਲਈ ਕਿਹਾ।", "forgive1": "[[ਮਾਫ਼ੀ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਤੁਹਾਨੂੰ ਆਜ਼ਾਦ ਕਰਦੀ ਹੈ।]] ਗੁੱਸੇ ਨੂੰ ਮਨ ਵਿੱਚ ਟਿਕਣ ਅਤੇ ਵੱਸਣ ਨਾ ਦਿਓ। ਤੁਸੀਂ ਨਾਰਾਜ਼ਗੀ ਛੱਡ ਕੇ ਵੀ ਆਪਣੀਆਂ ਹੱਦਾਂ ਰੱਖ ਸਕਦੇ ਹੋ। ਭਲਾ ਕਰਨਾ ਤੁਹਾਡੀ ਚੋਣ ਹੈ, ਉਨ੍ਹਾਂ ਦਾ ਕਮਾਇਆ ਇਨਾਮ ਨਹੀਂ।", "women1": "[[ਸਤਿਕਾਰ ਕਿਸੇ ਦੇ ਦੇਣ ਜਾਂ ਖੋਹਣ ਦਾ ਨਹੀਂ।]] ਹਰ ਜੀਵਨ ਔਰਤ ਤੋਂ ਆਉਂਦਾ ਹੈ; ਉਸ ਨੂੰ ਛੋਟਾ ਕਿਉਂ ਕਹੀਏ? ਘਰ ਵਿੱਚ ਬਰਾਬਰ ਸਤਿਕਾਰ ਨੂੰ ਰੋਜ਼ ਦੀ ਆਦਤ ਬਣਾਓ: ਕੌਣ ਪੜ੍ਹਦਾ ਹੈ, ਕੌਣ ਬੋਲਦਾ ਹੈ, ਕੌਣ ਪਹਿਲਾਂ ਖਾਂਦਾ ਹੈ।", "work1": "[[ਇਮਾਨਦਾਰੀ ਨਾਲ ਕਮਾਓ, ਖੁੱਲ੍ਹੇ ਹੱਥ ਨਾਲ ਵੰਡੋ।]] ਕਿਰਤ, ਵੰਡ ਛਕਣਾ ਅਤੇ ਨਾਮ ਜਪਣਾ ਨਾਲ-ਨਾਲ ਚੱਲਦੇ ਹਨ। ਸੱਚਾ ਰਾਹ ਪਵਿੱਤਰ ਦਿਖਾਵੇ ਨਾਲ ਨਹੀਂ, ਸਾਫ਼ ਕਮਾਈ ਅਤੇ ਦੇਣ ਵਾਲੇ ਹੱਥ ਨਾਲ ਪਛਾਣਿਆ ਜਾਂਦਾ ਹੈ।"}};

function panelPos(){ var st=$('stage'); return st.clientHeight-PEEK; }

function nudge(){ var c=$('stage').querySelector('.pnl.c'); if(!c||!c.animate) return; c.animate([{transform:'translate3d(0,0,0)'},{transform:'translate3d(0,-26px,0)'},{transform:'translate3d(0,0,0)'}],{duration:380,easing:'cubic-bezier(.3,.7,.3,1)'}); var o=c.querySelector('.opts'); if(o&&o.animate) o.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300}); }

}
function nudgeBack(){ var c=$('stage').querySelector('.pnl.c'); if(c&&c.animate) c.animate([{transform:'translate3d(0,0,0)'},{transform:'translate3d(0,24px,0)'},{transform:'translate3d(0,0,0)'}],{duration:360,easing:'ease-out'}); }
function snapBack(){ var st=$('stage'), P=panelPos(); st.querySelectorAll('.pnl').forEach(function(el){ el.style.transition='transform .3s cubic-bezier(.22,.8,.24,1)'; var b=el.classList.contains('c')?0:(el.classList.contains('n')?P:-P); el.style.transform='translate3d(0,'+b+'px,0)'; }); }
/* touch: drag the stack like reels; inner scroll wins until the card reaches its edge */
(function(){
  var st=null, y0=0, x0=0, t0=0, drag=false, decided=false, startTop=0, startBot=0;
  function sEl(){ return $('stage'); }

  document.addEventListener('touchmove',function(e){ if(!st) return; var dy=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    if(!decided){ if(Math.abs(dy)<8 && Math.abs(dx)<8) return; decided=true; drag=Math.abs(dy)>Math.abs(dx) && ((dy<0 && startBot) || (dy>0 && startTop)); }
    if(!drag) return; e.preventDefault();
    var P=panelPos(), s=sEl(), n=s.querySelector('.pnl.n'), p=s.querySelector('.pnl.p'), d=dy;
    if((dy<0 && (!n || n.classList.contains('locked'))) || (dy>0 && !p)) d=dy*.25;
    s.querySelectorAll('.pnl').forEach(function(el){ el.style.transition='none'; });
    st.style.transform='translate3d(0,'+d+'px,0)';
    if(n) n.style.transform='translate3d(0,'+(P+Math.min(0,d))+'px,0)';
    if(p) p.style.transform='translate3d(0,'+(-P+Math.max(0,d))+'px,0)';
  },{passive:false});

    if(dy<-70 || v<-.5) go(1); else if(dy>70 || v>.5) go(-1); else snapBack();
    setTimeout(function(){ if(!anim) snapBack(); },460);
  },{passive:true});
  var wl=0; document.addEventListener('wheel',function(e){ var s=sEl(); if(!s||!cur||!s.contains(e.target)) return; var c=s.querySelector('.pnl.c'); var now=Date.now(); if(now-wl<650) return;
    if(e.deltaY>25 && c.scrollTop+c.clientHeight>=c.scrollHeight-2){ wl=now; go(1); } else if(e.deltaY<-25 && c.scrollTop<=1){ wl=now; go(-1); } },{passive:true});
})();
function openAny(at){
