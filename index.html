ling an old friend for five minutes. Each is a small thread, and threads become a rope. Remember too that many people around you are quietly lonely. Your hello might be the one they were waiting for.", "t": "This week, choose one place to go twice, and greet one person both times.", "q": "You moved to a new city three months ago. A colleague invites you to a weekend dinner with her friends, whom you don't know. You feel shy. What do you do?", "o": ["Decline politely; you'll go when you know people better", "Go, stay for an hour, and ask two people one question each", "Go, but stay on your phone so it isn't awkward"], "y": "Good choice. Friendships start with small, repeated presence. One hour and two real questions is enough to begin.", "n": "Shyness is natural. But you get to know people by going, not before going, and a phone makes you invisible in the room. Go for an hour and ask two questions.", "d": "In Mecca, an angry man woke Guru Nanak because his feet pointed towards the Kaaba. Guru Nanak replied gently: turn my feet in a direction where God is not. Bhai Gurdas records it in his first Var. There is no direction without the One, and no person outside the circle. Why does loneliness hurt so much? Because belonging is a basic need, like food. Roy Baumeister and Mark Leary argued this in 1995. In 2010, Julianne Holt-Lunstad reviewed 148 studies and found that people with strong social ties had about a fifty percent higher chance of survival over the study periods. Loneliness is not weakness; it is a signal, like hunger, telling you to reach out. Gurbani speaks to both sides: you are never outside the One's care, and that same truth asks you to step towards others. Real example: most new friendships in a new city begin with going to the same place again and again."}, "loved1": {"ti": "Seen with loving eyes", "s": "You stayed up all night helping a friend move house. Your clothes are dusty, your back hurts, and nobody said much. You wonder if anyone even noticed.", "m": "Whoever listens, trusts, and holds love in the heart, bathes in the sacred pool within, and is made clean.", "k": "At Kartarpur, Guru Nanak once had three bundles of grass cut for the cattle. The grass was wet and dripping with mud, and those standing near found reasons not to carry it. Bhai Lehna had just arrived, wearing new clothes. Without a word, he lifted all three bundles onto his head and carried them to the house. Mud ran down and soiled his clothes. When they arrived, Mata Sulakhni, the Guru's wife, was upset to see a guest treated this way. As the tradition is recorded by Macauliffe, Guru Nanak replied that it was not mud on Lehna's clothes. It was saffron, the colour of honour.", "a": "This pauri speaks of someone who listens, trusts, and keeps love in the heart. Such a person, Guru Nanak says, bathes in a sacred pool that is inside them. Love here is not only a feeling we receive. It is something we hold, and something we do. Bhai Lehna did not carry the grass to be praised. He carried it because he loved. And Guru Nanak saw that love completely. Where others saw dirt, he saw saffron. That is what being truly loved feels like. Someone looks at the very thing you thought was ugly, your tiredness, your effort, your mess, and sees its beauty. Your unseen effort is never wasted.", "b": "We all need to feel valued, and so much of our love goes unnoticed in daily life. A mother's ten thousand rotis. A friend's late-night help. The psychologist John Gottman, who studied couples for decades, found that small moments matter enormously: noticing each other, thanking each other, turning towards each other. The good news is that we can be the one who notices. When you say, I saw how hard you worked, you turn someone's mud into saffron. And when nobody notices you, remember Bhai Lehna. Love given with a pure heart is already complete. It does not need applause to be real. Still, it is kind to tell people you love them. Don't wait.", "t": "Today, tell one person: I saw what you did. Thank you. Be specific.", "q": "Your father has worked the same tiring job for twenty five years to pay for your education. He never talks about it. Tonight, at dinner, what could you do?", "o": ["Nothing; that is what parents do", "Buy him an expensive gift next month", "Tell him specifically: I know what you gave up for me. Thank you, Papa."], "y": "That will stay with him for years. Specific words show you have truly seen his sacrifice, and that is what every parent quietly hopes for.", "n": "Gifts are nice, and parents do sacrifice naturally. But what most parents long for is to be seen. Specific words, tonight, mean more than anything you can buy.", "d": "At Kartarpur, wet bundles of grass dripping mud had to be carried. Others found excuses. Bhai Lehna, in new clothes, lifted all three and carried them. When Mata Sulakhni was upset at his muddy clothes, Guru Nanak said it was not mud but saffron. Love sees the effort, not the stain. Why do we keep chasing approval? Carl Rogers described unconditional positive regard: being accepted as worthy, without conditions. Jennifer Crocker's research shows the opposite trap: when our worth depends on marks, looks or likes, our mood swings with every result. Gurbani points to a worth that does not depend on performance. And it asks us to be the eyes that notice. Real example: the cleaner in your office who keeps everything spotless is seen only when something is dirty. One thank you can change her whole day."}, "fear1": {"ti": "When worry won't switch off", "s": "It is two in the morning. Your father's test results come tomorrow. Your mind keeps playing every bad ending like a film on repeat, and your phone is open on a search page full of frightening words. Sleep feels very far away.", "m": "The hot wind does not touch one who is in the shelter of the Supreme Lord. All around us is the protective line of the Lord's Name; no pain can reach us, brother.", "k": "Sikh tradition remembers that when Guru Arjan's young son Hargobind fell seriously ill with smallpox, many people around were frightened. Some urged the Guru to make offerings to the smallpox goddess, as was the custom. Guru Arjan did not. He stayed beside the child, kept the sangat in kirtan and prayer, and placed his trust in the Creator. When the boy recovered, the Guru's thanks became a shabad in Guru Granth Sahib: Seetla te rakhiya Bihari, You Yourself saved him from smallpox, on Ang 200. The Guru did not pretend there was no danger. He met it with care, with company and with trust, instead of with panic.", "a": "Look at the whole shabad. Its Rahao line, the centre of the shabad, says the complete Satguru has given the Name as medicine. Prof. Sahib Singh explains the hot wind as the heat of afflictions and illness. So this is not a promise that nothing hard will ever happen. It speaks about what happens inside: when the mind rests in the Name, a circle is drawn around it, and the heat of fear cannot set it on fire. The body may still fall sick; the mind need not burn. Worry feels like protection, as if thinking harder will keep us ready. Mostly it rehearses suffering that has not arrived. The shabad offers a better shelter: do what is yours to do, and rest in the One who holds everything.", "b": "At night, when the mind races, write the worry down in one line, and next to it one thing you can actually do tomorrow. Then put the paper away. You have given the worry a place, and given yourself permission to rest.", "t": "Write tonight's worry in one line, and one thing you can do tomorrow. Then sleep.", "q": "Your company announces layoffs next month. You can't sleep. Which step actually reduces fear?", "o": ["Update your CV, list three people to call, and check your savings this weekend", "Read every rumour on office chats tonight", "Tell yourself not to think about it"], "y": "Exactly. Fear shrinks when you act on what is in your hands. A plan turns a cloud of what-ifs into three clear steps.", "n": "Both are very human. But rumours feed the fear, and pushing thoughts away makes them return stronger. Small concrete actions, like a CV and a savings check, give the mind solid ground.", "d": "When Guru Arjan's young son Hargobind fell ill with smallpox, people urged offerings to the smallpox goddess. The Guru stayed by the child, kept the sangat in prayer, and trusted the Creator. When the child recovered, his thanks became a shabad on Ang 200. He did not deny the danger; he met it with care and trust, not panic. Why does worry feel so convincing? It feels like preparation, as if thinking harder will protect us. Mostly it rehearses pain that has not come. In a 2020 study, Lucas LaFreniere and Michelle Newman asked anxious people to write down their worries and check later: about ninety one percent did not come true. Attachment researcher John Bowlby showed that children explore bravely when they have a secure base. Gurbani gives the mind that base: the shelter of the One. Real example: at two in the morning, every symptom you search looks fatal. At ten in the morning, the doctor explains it in two minutes."}, "grief1": {"ti": "When someone we love is gone", "s": "It has been a month since your grandfather died. Everyone has gone back to work and school. But you still reach for your phone to send him the cricket score, and the empty chair at dinner feels louder than anything in the room.", "m": "Let no one weep for me after I am gone; that would not please me at all. A friend rejoices when his friend is honoured.", "k": "In 1574 at Goindwal, Guru Amar Das, then about ninety five years old, knew his time had come. His great-grandson, Baba Sundar, recorded what happened in a hymn called the Sadd, The Call, which is now in Guru Granth Sahib. The Guru gathered his family and Sikhs around him. He told them not to weep for him, because he was going to meet the Beloved with honour, and a true friend is glad when a friend is honoured. He asked them to sing kirtan after him, not to perform empty rituals. Then, while still alive, he seated Bhai Jetha, Guru Ram Das, on the Guru's seat and asked everyone to bow to him. Grief was given a direction.", "a": "Read in its full context, this line is not a rule that grieving people must not cry. It is the Guru speaking about his own departure, and the very next line gives the reason: a friend rejoices when a friend is honoured. The Sadd turns the family's eyes from the empty seat to where their beloved is going, and to what they can now do: sing, remember, and carry the work forward. Tears are human; Gurbani elsewhere is full of the ache of separation, called birha. What the Sadd warns against is grief that turns only into despair and ritual. Love that continues becomes praise, service, and living the values the person gave us.", "b": "Grief comes in waves, not neat stages. Some days are fine, then a song in a shop undoes you. Let both happen. Say the person's name. Keep one of their habits alive.", "t": "Today, do one small thing a loved one who has passed used to love, in their name.", "q": "Your friend's father died two months ago. Everyone has stopped asking about it. You are not sure whether to bring it up. What do you do?", "o": ["Don't mention it; it might upset her", "Message her: I've been thinking of your dad. How are you really doing?", "Tell her it's time to move on and focus on the future"], "y": "That is a gift. Two months later is when most people feel forgotten. Naming her father tells her he still matters, and lets her decide what to share.", "n": "You want to protect her, and that is kind. But silence often feels like her father has been forgotten, and move on can feel like a push. A simple message saying his name opens the door gently.", "d": "In 1574, Guru Amar Das, about ninety five, gathered his family. He said: do not weep for me, a friend rejoices when a friend is honoured. Sing kirtan after me. Then he seated Guru Ram Das on the Guru's seat while still alive. Grief was given a direction: remembrance, praise and carrying the work forward. Read in context, this is about his own going home. It does not shame ordinary tears. Why do we expect grief to just pass? For years, psychology said healthy grieving meant letting go. In 1996, Klass, Silverman and Nickman showed something different: many people keep a continuing bond with those who died, through memories, values and habits. Stroebe and Schut's dual process model (1999) adds that it is healthy to swing between facing the loss and resting from it. Real example: making your grandmother's dal every Sunday is not refusing to move on. It is love finding a new form."}, "forgive1": {"ti": "Letting go of the hurt", "s": "Last year your cousin spread a lie about you in the family group. He never apologised. Now there is a wedding, he will be there, and just thinking about it makes your jaw tight. You have replayed that day a hundred times.", "m": "Farid, do good even to the one who does you wrong, and do not let anger settle in your mind. Then the body is not touched by disease, and you keep everything good with you.", "k": "Sikh tradition remembers forty Sikhs who, during the long siege of Anandpur in 1705, signed a note disowning Guru Gobind Singh and went home. In their village, Mai Bhago, a brave woman of the area, shamed them and led them back to stand with the Guru. At Khidrana, today Sri Muktsar Sahib, they fought and fell. The last of them, Mahan Singh, lay dying when the Guru reached him and held his head in his lap. Asked what he wished, Mahan Singh said: forgive us, and tear up that note. The Guru took out the note and tore it. They are remembered as the Chali Mukte, the forty liberated ones.", "a": "Farid's salok sits among his saloks on humility and patience, and its reason is practical: anger kept in the mind wears on the body and the mind, and you lose the good you have. Prof. Sahib Singh reads it as: do not let anger come and live in the mind. Notice what it does not say. It does not say that what happened was fine, or that you must trust the person again. Doing good to the one who wronged you means refusing to let their wrong shape your heart. Forgiveness is first a gift you give yourself.", "b": "At the wedding you do not have to hug him or discuss the past. Greet him politely, then spend your energy on the people you love. Forgiveness can begin as simply not feeding the anger any more.", "t": "Write the hurt down once. Under it: I choose not to carry this today. Tear it.", "q": "A friend who badly hurt you two years ago messages: sorry for everything, can we meet? You still feel the sting. What is the healthiest response?", "o": ["Ignore the message; some things can't be forgiven", "Meet immediately and act like nothing happened", "Thank him for the apology, and say you'd like to meet, but slowly"], "y": "Wise and kind. You accept the apology, and keep a healthy boundary. Forgiveness and trust can grow at different speeds.", "n": "Both reactions are understandable. But ignoring keeps the wound open inside you, and pretending nothing happened skips the healing. Accept the apology, and rebuild trust slowly.", "d": "In 1705, forty Sikhs signed a letter disowning Guru Gobind Singh and went home. Shamed by Mai Bhago, they returned and gave their lives at Khidrana. As Mahan Singh lay dying, he asked the Guru to tear up that letter. The Guru held his head in his lap and tore it. Why is forgiving so hard? Because we confuse it with saying it was okay. Robert Enright's research is clear: forgiveness is not excusing, forgetting, or even reconciling. Everett Worthington describes it as slowly replacing resentment with goodwill. Studies link long-held grudges and replaying the hurt with higher stress. Farid gave the same reason centuries ago: do not let anger settle in the mind, and the body stays well. Real example: your cousin may never apologise. Forgiving him does not mean trusting him again. It means he no longer lives rent-free in your head."}, "women1": {"ti": "Equal dignity", "s": "At a family function, an uncle jokes that girls need not study much since they will get married anyway. A few people laugh. Your younger cousin, who has just topped her class in physics, goes quiet and looks down at her plate.", "m": "Why call her lesser, from whom even kings are born?", "k": "Sikh tradition remembers Bibi Amro, the daughter of Guru Angad, who was married into the family of Amar Das's brother. Every morning she sang Guru Nanak's bani while churning milk. One day Amar Das, then past sixty and a devoted pilgrim, heard her singing and was deeply moved. He asked whose words these were, and she took him to her father, Guru Angad, at Khadur. That meeting changed his life. He served with complete devotion and later became the third Guru. A young woman's voice brought the future Guru to the Guru.", "a": "In Guru Nanak's time, women were often treated as impure, especially after childbirth, and blamed for misfortune. This salok in Asa di Var answers that head on. Every human is conceived and born through a woman; engagements, marriages, friendships and the very path of the world run through her. So how can she be called lesser? The salok ends by saying that only the One is not born of a woman, and that any face, a man's or a woman's, that praises the One shines in the true court. Dignity is not a favour given to women; it was never anyone's to take away. The Gurus put this into practice in the sangat and the langar, where everyone sat and sang together.", "b": "At home, notice who always serves and who always eats first, who is asked about career and who only about marriage. Small daily patterns teach children more than big speeches.", "t": "Today, ask a woman in your family about her dreams, and really listen.", "q": "At a wedding, an aunt tells your cousin, a doctor: you are getting old, forget career, focus on marriage now. Everyone is listening. What do you do?", "o": ["Change the topic to avoid tension", "Smile and say: Aunty, she just saved a patient's life last week, tell them about it!", "Tell the aunt she is backward"], "y": "Lovely. You shift the spotlight to her achievement without humiliating anyone. The whole room hears a different story, and your cousin feels seen.", "n": "Peace and loyalty both matter. But changing the topic lets the message stand, and insulting the aunt turns it into a fight. Celebrating her work answers it gracefully.", "d": "Bibi Amro, Guru Angad's daughter, sang Guru Nanak's bani every morning while churning milk. Amar Das, past sixty, heard her, was deeply moved, and asked whose words these were. She led him to her father, and he later became the third Guru. A young woman's voice brought the future Guru to the Guru. In Guru Nanak's time, women were often called impure. His salok answers plainly: every human, even every king, is born of a woman, so she can never be called lesser. Why does inequality survive in loving families? Because much of it sounds kind. Psychologists Peter Glick and Susan Fiske called it benevolent sexism (1996): she is too delicate for that job, why should she study, she will marry anyway. It sounds caring, but it shrinks her world. Real example: notice at home who always serves and who eats first, who is asked about career and who only about marriage."}, "work1": {"ti": "Honest work, open hands", "s": "Your friend shows you a work-from-phone scheme that promises fifty thousand rupees a month for one hour a day. You only have to pay a joining fee and recruit others. Your own job, meanwhile, feels slow and ordinary.", "m": "One who earns by honest effort, eats from it, and gives some of it away with their own hands, Nanak, such people recognise the true path.", "k": "Sikh tradition remembers that Guru Angad, even as Guru, earned his own living at Khadur by twisting munj, a coarse grass, into rope, and that the langar ran on honest, shared earnings rather than on gifts the Guru demanded. He also set up an akhara for wrestlers and taught children to read and write Gurmukhi. His days were full of ordinary work, done with full attention, and that work was itself part of his worship.", "a": "In context, this salok places two kinds of life side by side. Just before these lines, Guru Nanak describes people who turn religion into a way of living off others: a singer of hymns without understanding, a hungry mullah for whom the mosque is only a livelihood, a man who pierces his ears to look like a yogi and begs; and one who calls himself guru or pir yet goes begging, at whose feet one should not bow. Then comes the answer: earn by effort and share. Prof. Sahib Singh reads the line as giving some of that very earning to others. This is the root of three Sikh habits: kirat karni, honest work; vand chhakna, sharing; and naam japna, remembering. Honest work is not about the size of the salary; it is about whether the money came cleanly, and whether some of it flows out to others.", "b": "Schemes that pay mainly for recruiting people, not for real products or work, usually collapse and hurt the people at the bottom. If a promise sounds too easy, check it with someone you trust before paying anything.", "t": "This week, give a small part of what you earn, with your own hands, to someone in need.", "q": "A friend offers you a side income: post fake five-star reviews for restaurants, five hundred rupees each, from your phone. Easy money, he says. What do you do?", "o": ["Do it for a month and stop", "Do it, but only for restaurants you have actually visited", "Decline; earn extra through something real, even if slower"], "y": "Right. Fake reviews mislead real people spending real money. Honest extra income, even slower, lets you sleep well.", "n": "Extra money is tempting, and it seems harmless. But fake reviews deceive people who trust them, and a month easily becomes a habit. Choose real work, even if slower.", "d": "Guru Angad, even as Guru, earned his living by twisting munj grass into rope, and the langar ran on honest, shared earnings. In context, the salok first criticises those who use religion to live off others, and then gives the answer: earn by effort, and share. This is the root of three Sikh habits: kirat karni, honest work; vand chhakna, sharing; and naam japna, remembering. Why does it make life feel full? Research by Elizabeth Dunn and colleagues (Science, 2008) found that people who spent money on others felt happier than those who spent the same on themselves. Self-determination theory (Deci and Ryan) shows we thrive when we feel capable, free and connected, and honest work done well feeds all three. Real example: schemes that pay mainly for recruiting people, not real work, usually collapse and hurt those at the bottom."}}, hi:{"anger1": {"ti": "जवाब देने से पहले एक ठहराव", "s": "परिवार के ग्रुप में एक संदेश आता है। बात आपके बारे में है। आधा मज़ाक, पूरा ताना। चेहरा गरम हो जाता है, और उँगलियाँ ऐसा जवाब लिखने लगती हैं जो चुभेगा।", "m": "संयम को अपनी भट्ठी बनाओ, और धीरज को सुनार।", "k": "गुरु अमरदास जी जब तीसरे गुरु बने, तब वे बुज़ुर्ग हो चुके थे। गोइंदवाल में दूर दूर से लोग बस उनके पास बैठने आते थे। गुरु अंगद जी के बेटे दातू से यह सहा नहीं गया। उन्हें लगता था कि यह गद्दी उनकी होनी चाहिए थी। एक दिन वे गुस्से में भरे संगत में आए, और बुज़ुर्ग गुरु जी को लात मारकर गद्दी से गिरा दिया। पूरी सभा में सन्नाटा छा गया। गुरु जी धीरे से उठे। सिख परंपरा बताती है कि उन्होंने न आवाज़ ऊँची की, न पलटकर वार किया। उन्होंने प्यार से दातू का पैर पकड़ा, और कहा कि अगर उनकी सख़्त बूढ़ी हड्डियों से पैर को चोट लगी हो तो उन्हें अफ़सोस है। उसी शाम वे चुपचाप गोइंदवाल छोड़कर चले गए, ताकि कोई झगड़ा न हो।", "a": "गुरु नानक हमें एक सुनार की भट्ठी की तस्वीर देते हैं। सोना एक चोट में अँगूठी नहीं बनता। उसे तपाया जाता है, ढाला जाता है, ठंडा किया जाता है, और फिर ढाला जाता है, ऐसे हाथ से जो जल्दी नहीं करता। इसी को वे धीरज कहते हैं, और धीरज को औज़ारों के साथ ताक पर नहीं रखते। धीरज ख़ुद सुनार है, जो काम कर रहा है। इसलिए धीरज कमज़ोरी नहीं है, और सब कुछ चुपचाप निगल जाना भी नहीं है। यह एक हुनर है। गुरु अमरदास जी के पास पलटकर वार करने की हर वजह थी, फिर भी उस सभा में उनके धीरज ने गढ़ने का काम किया। सिगमंड फ़्रॉइड के बाद आए विचारकों ने एक बात देखी जो यहाँ ठीक बैठती है। गुस्सा अक्सर ग़लत इंसान पर उतरता है। दोपहर में बॉस डाँटता है, और रात को हम अपनी बहन पर बरस पड़ते हैं। धीरज हमें यह देखने का समय देता है कि गर्मी असल में कहाँ से आ रही है।", "b": "ठहरने से फ़ायदा क्यों होता है? गुस्सा अपने पहले कुछ पलों में सबसे तेज़ होता है, जैसे उबलकर गिरता दूध। अगर आप एक पल के लिए बर्तन आँच से उतार लें, तो दूध बैठ जाता है, और कुछ नहीं बिगड़ता। ऐसे ही दस पल का ठहराव यह नहीं कहता कि आप नाराज़ नहीं हैं। इसका मतलब है कि अब शब्द आप चुन रहे हैं, गुस्सा नहीं चुन रहा। आप फिर भी कड़ी बात कह सकते हैं। फिर भी अपनी बात पर डटे रह सकते हैं। बस कल सुबह यह नहीं सोचना पड़ेगा कि काश मैंने अलग तरह से कहा होता। जो लोग यह सीख लेते हैं, वे परिवार या दफ़्तर के शांत लोग बन जाते हैं, जिन पर मुश्किल में सब भरोसा करते हैं। वह भरोसा एक एक रुके हुए जवाब से बनता है।", "t": "अगली बार कुछ चुभे, तो जवाब देने से पहले दस मिनट रुकिए। बस दस।", "q": "मीटिंग में मैनेजर पूरी टीम के सामने आपको तीखे ढंग से ग़लत ठहराता है। असल में आप सही थे। सबसे मज़बूत क़दम क्या है?", "o": ["वहीं विनम्रता से पर दृढ़ता से उसे सुधार देना, ताकि सब जान लें", "कभी कुछ न कहना, और मन ही मन उसकी इज़्ज़त खो देना", "अभी शांत रहना, फिर बाद में अकेले में तथ्यों के साथ मिलना"], "y": "हाँ। सबके सामने उसका अहं अपना बचाव कर रहा होता है, वह सुन नहीं पाता। अकेले में, तथ्यों और शांत आवाज़ के साथ, वह सुन सकता है। आपकी इज़्ज़त भी बची और बात भी।", "n": "समझ में आता है, पर सोचिए। सबके सामने बहस से वह तथ्यों का नहीं, अपनी छवि का बचाव करेगा, और चुप्पी आपके भीतर नाराज़गी बढ़ाएगी। तथ्यों के साथ शांत, अकेले में बात, दोनों को बचाती है।", "d": "जब गुरु अंगद देव जी के बेटे दातू ने बुज़ुर्ग गुरु अमरदास जी को लात मारकर गद्दी से गिरा दिया, तो गुरु जी ने पलटकर वार नहीं किया। उन्होंने दातू का पैर पकड़ा और पूछा, कहीं मेरी बूढ़ी हड्डियों से तुम्हारे पैर को चोट तो नहीं लगी? यह असर क्यों करता है? गुस्सा आग है, और हर जवाब उसमें ईंधन। तीखा जवाब ताक़त जैसा लगता है, पर असल में वह आपके अगले दस मिनट का क़ाबू सामने वाले को दे देता है। मनोवैज्ञानिकों ने पाया कि गुस्सा निकालना, जैसे उस इंसान को सोचते हुए तकिए पर मुक्के मारना, लोगों को और आक्रामक बनाता है (बुशमैन, 2002)। गुस्सा ठंडा करता है ठहराव, और हालात को दूसरी नज़र से पढ़ना: शायद वह थका था, बुरा नहीं। इसीलिए जपुजी साहिब धीरज को सुनार के हाथ में रखता है। सोना तपिश से ढलता है, पर क़ाबू वाली तपिश से। असली उदाहरण: रात को ग़ुस्से में लिखा ईमेल जो सुबह आपने डिलीट कर दिया, उसी के न भेजने पर आप सबसे ज़्यादा ख़ुश होते हैं।"}, "ego1": {"ti": "यह असल में किसने किया?", "s": "आपको तरक़्क़ी मिलती है। घर लौटते हुए आप ख़ुद से कहते हैं, यह मैंने किया। सिर्फ़ मैंने। फिर याद आता है वह अध्यापक जो देर तक रुकते थे, वह दोस्त जिसने नौकरी की ख़बर भेजी थी, और माँ, जिसने पंद्रह साल टिफ़िन बाँधा।", "m": "हर कोई हुकम के भीतर है, उसके बाहर कोई नहीं। जो इस बात को समझ लेता है, वह मैं, मैं कहना छोड़ देता है।", "k": "एक बार मुग़ल बादशाह अकबर गुरु अमरदास जी से मिलने गोइंदवाल आए। वे देश के सबसे ताक़तवर इंसान थे, बड़े ठाट बाट से स्वागत के आदी। पर गुरु जी के यहाँ एक सीधा सा नियम था: पहले पंगत, फिर संगत। गुरु जी से मिलने से पहले हर कोई ज़मीन पर एक पंक्ति में बैठकर लंगर का एक जैसा भोजन करता था। अमीर और ग़रीब, हिंदू और मुसलमान, कंधे से कंधा मिलाकर। परंपरा बताती है कि बादशाह ने भी यही किया। वे किसानों और मुसाफ़िरों के बीच बैठे, और वही सादा भोजन किया। उसके बाद ही वे गुरु जी से मिलने गए।", "a": "यहाँ दो शब्द ज़रूरी हैं। हुकम वह बड़ी व्यवस्था है जिसका हर चीज़ हिस्सा है, जैसे पूरे समुद्र में एक लहर। हउमै वह आदत है जो कहती है, मैंने किया, यह मेरा है। गुरु नानक दोनों को जोड़ते हैं। समुद्र जितना साफ़ दिखता है, लहर उतना कम इतराती है। लंगर की ज़मीन पर बैठे अकबर इसी बात की जीती जागती तस्वीर हैं। उस ज़मीन पर एक बादशाह भी बस एक और भूखा इंसान था, क्योंकि वहाँ हर कोई एक ही व्यवस्था का हिस्सा था। भारत का एक पुराना ग्रंथ, अष्टावक्र गीता, इसी आदत की एक तीखी तस्वीर देता है। वह कहता है कि मैं करने वाला हूँ, यह सोच साँप के डसने जैसी है। इसका ज़हर हमें अच्छे समय में घमंडी बना देता है, और बुरे समय में तोड़ देता है।", "b": "इसका मतलब यह नहीं कि आपकी मेहनत कुछ नहीं थी। आपने मेहनत की, और वह सच है। मतलब यह है कि आपकी मेहनत एक बड़ी कहानी का एक हिस्सा थी। ट्रॉफ़ी उठाते क्रिकेट कप्तान को देखिए। अच्छे कप्तान सबसे पहले टीम, कोच और मैदान के कर्मचारियों का नाम लेते हैं। वे जानते हैं कि उस ट्रॉफ़ी पर बहुत से हाथ हैं। जो लोग जीवन को ऐसे देखते हैं, उनके साथ काम करना आसान होता है। वे ज़्यादा धन्यवाद कहते हैं, और लोग फिर से उनकी मदद करना चाहते हैं। और जब कोई योजना बिगड़ती है तो वे टूटते नहीं, क्योंकि उन्होंने कभी माना ही नहीं था कि सब कुछ उनके अपने हाथ में है। शुक्रगुज़ारी और नम्रता असल में एक ही चीज़ हैं, बस दो तरफ़ से देखी गई।", "t": "आज रात इस साल की अपनी सबसे अच्छी उपलब्धि में मदद करने वाले तीन लोगों के नाम लीजिए। एक को धन्यवाद कहिए।", "q": "आपके आइडिया ने प्रोजेक्ट बचाया। रिव्यू मीटिंग में मैनेजर टीम लीड की तारीफ़ करता है, जिसने मुश्किल से मदद की। आप क्या कहेंगे?", "o": ["टीम का धन्यवाद करना, फिर शांति से आँकड़ों के साथ बताना कि आपके आइडिया से क्या बदला", "चुप रहना; विनम्र इंसान को श्रेय से क्या", "बाद में मैनेजर को मैसेज करके शिकायत करना कि लीड ने श्रेय चुरा लिया"], "y": "सही। नम्रता का मतलब सच छिपाना नहीं। आपने टीम का मान रखा और बिना किसी पर हमला किए तथ्य बताए। यही अहं-रहित और ईमानदार दोनों है।", "n": "क़रीब हैं, पर फ़र्क़ देखिए। नम्रता तथ्य मिटाना नहीं है, और शिकायत से बात काम की नहीं, लीड की हो जाती है। टीम का धन्यवाद कीजिए, फिर शांति से आँकड़े बताइए।", "d": "बादशाह अकबर गुरु अमरदास जी से मिलने आया। पहले उसे लंगर में किसानों के साथ एक पंगत में ज़मीन पर बैठकर वही खाना खाना पड़ा। देश का सबसे ताक़तवर आदमी, एक भोजन में सबके बराबर। अहंकार हमें अंधा क्यों करता है? मन चुपचाप सफलता का श्रेय ख़ुद ले लेता है और असफलता का दोष क़िस्मत को देता है। मनोवैज्ञानिक इसे सेल्फ़-सर्विंग बायस कहते हैं। यह हमारी छवि बचाता है, पर हर नतीजे के पीछे के कई हाथों को छिपा देता है। जपुजी साहिब कहता है कि सब कुछ हुकम, यानी एक बड़े विधान, के अंदर होता है। इससे आपकी मेहनत छोटी नहीं होती। आप शुक्रगुज़ार बनते हैं, और शुक्राना घमंड से कहीं हल्का बोझ है। असली उदाहरण: जो कप्तान ट्रॉफ़ी उठाकर पहले गेंदबाज़ों की ओर इशारा करता है, उसे सालों इज बारे में बस एक पीढ़ी बाद लिखा, बताते हैं कि इन लंबी यात्राओं के ख़त्म होने पर क्या हुआ। गुरु नानक रावी नदी के किनारे करतारपुर लौट आए। उन्होंने यात्री के वस्त्र उतारे और साधारण गृहस्थ के कपड़े पहन लिए। सिख इतिहास आगे बताता है कि वे वहाँ किसी भी गाँव वाले की तरह खेती करके जीते थे, और हर सुबह शाम लोग साथ बैठकर गाते और विचार करते थे। जो गुरु देश देश पैदल घूमे थे, अब बाक़ी सबकी तरह बारिश का इंतज़ार करते थे।", "a": "गुरु नानक ने अभी पूछा था कि इंसान सच्चा कैसे जिए। यह उसका जवाब है: हुकम के साथ क़दम मिलाकर चलो, यानी जो जैसा है उससे लड़ो मत। यह नदी के बहाव के साथ तैरने जैसा है। आप तब भी तैरते हैं, और पूरी ताक़त से तैरते हैं, बस धारा के ख़िलाफ़ ताक़त बर्बाद नहीं करते। करतारपुर दिखाता है कि असली जीवन में यह कैसा दिखता है। किसान बारिश, धूप या मौसम को हुक्म नहीं दे सकता। वह बस अपना हिस्सा अच्छे से कर सकता है, और आसमान जो करे उसे मान सकता है। लगभग दो हज़ार साल पहले यूनान के गुरु एपिक्टेटस ने अपनी छोटी सी किताब इसी बात से शुरू की थी। कुछ चीज़ें हमारे बस में हैं, कुछ नहीं। हमारी कोशिश और हमारा जवाब हमारा है। मौसम, ट्रेन और दूसरों के फ़ैसले हमारे नहीं।", "b": "मान लेना हार मान लेना नहीं है। प्लैटफ़ॉर्म पर आपका हिस्सा छोटा है, पर असली है। दफ़्तर फ़ोन कीजिए, संदेश भेजिए, साँस लीजिए, और पहुँचकर शांति से अंदर जाइए। ट्रेन पर गुस्से से ट्रेन का कुछ नहीं बिगड़ता। वह बस आपकी ताक़त खाता है, और इंटरव्यू शुरू होने से पहले ही उसे बिगाड़ देता है। जो लोग दो सूचियाँ रखना सीख लेते हैं, मेरे हाथ में और मेरे हाथ में नहीं, वे कम महत्वाकांक्षी नहीं होते। वे अक्सर ज़्यादा कामयाब होते हैं, क्योंकि उनकी पूरी ताक़त वहीं लगती है जहाँ फ़र्क़ पड़ सकता है। वे बेहतर सोते भी हैं, क्योंकि वे वह बोझ उठाना छोड़ देते हैं जो कभी उनका था ही नहीं।", "t": "एक चिंता के लिए दो सूचियाँ बनाइए: मेरे हाथ में, मेरे हाथ में नहीं। पहली पर काम कीजिए।", "q": "आपने महीनों तैयारी की। आख़िरी पल में परीक्षा तीन हफ़्ते आगे खिसक गई। सारी योजना बिगड़ गई। अब क्या?", "o": ["शाम भर सोशल मीडिया पर बोर्ड पर ग़ुस्सा निकालना", "तीन हफ़्ते पूरी छुट्टी; वैसे भी लय टूट गई", "एक दिन आराम, फिर तीन हफ़्तों में कमज़ोर टॉपिक मज़बूत करने की योजना"], "y": "अच्छा चुनाव। तारीख़ आपके हाथ में नहीं, पर समय का इस्तेमाल है। पहले आराम, फिर देरी को फ़ायदे में बदलिए।", "n": "यह प्रतिक्रिया समझ में आती है, पर देखिए। ऑनलाइन ग़ुस्सा कुछ नहीं बदलता, और पूरी तरह रुकना अतिरिक्त समय का तोहफ़ा गँवाना है। एक दिन आराम, फिर कमज़ोर टॉपिक।", "d": "दशकों की यात्राओं के बाद गुरु नानक देव जी करतारपुर लौटे, साधारण कपड़े पहने और खेती की। अपने समय का सबसे बड़ा शिक्षक किसी भी गाँव वाले की तरह हल चलाता रहा: अपना हिस्सा करो, फ़सल बारिश पर छोड़ दो। जो बदल नहीं सकते, उस पर हम इतना दुखी क्यों होते हैं? क्योंकि हम अपनी ऊर्जा ट्रेन, मौसम और दूसरों के मूड से लड़ने में लगा देते हैं। स्टोइक शिक्षक एपिक्टेटस ने अपनी पुस्तिका एक पंक्ति से शुरू की: कुछ चीज़ें हमारे वश में हैं, कुछ नहीं। आधुनिक एक्सेप्टेंस एंड कमिटमेंट थेरेपी भी यही कहती है: जो नहीं बदल सकते उसे स्वीकारो, अपने मूल्यों पर कर्म करो। हुकम में चलना हार मानना नहीं, पूरी ताक़त सही जगह लगाना है। असली उदाहरण: किसान बारिश का हुक्म नहीं दे सकता, पर मिट्टी तैयार कर सकता है। वह शांत है क्योंकि उसने अपना हिस्सा किया।"}, "content1": {"ti": "कितना काफ़ी है?", "s": "आप नया फ़ोन ख़रीदते हैं। एक हफ़्ता बहुत अच्छा लगता है। फिर उससे नया मॉडल आ जाता है, और हाथ का फ़ोन अचानक पुराना लगने लगता है।", "m": "संतोष को अपने कुंडल बनाओ, ईमानदार मेहनत को अपना कटोरा और झोली, और ध्यान को अपनी भभूत।", "k": "लाहौर में दुनी चंद रहते थे, बहुत बड़ी दौलत वाले इंसान। उन्होंने गुरु नानक को बड़े आदर से अपने घर बुलाया। जाते समय गुरु जी ने उन्हें एक छोटी सी सुई दी और एक काम कहा। इसे मेरे लिए सँभालकर रखना, और अगले लोक में मुझे लौटा देना। दुनी चंद ने गर्व से हाँ कह दी और सुई अपनी पत्नी के पास ले गए। पत्नी ने उनकी ओर देखा और एक सीधा सा सवाल पूछा। मरने के बाद आप एक सुई भी साथ कैसे ले जाएँगे? दुनी चंद चुप हो गए। अगर वे एक सुई भी नहीं ले जा सकते, तो बाक़ी सब कुछ का क्या? वे गुरु जी के पास लौटे, और ध्यान से सुना।", "a": "गुरु नानक योगियों से बात कर रहे हैं, जो अपने रास्ते की निशानी के तौर पर ख़ास कुंडल पहनते थे और कटोरा रखते थे। वे कहते हैं कि असली निशानियाँ इंसान के भीतर होती हैं। पहली जो वे गिनाते हैं, वह है संतोख, यानी संतोष। जो है उसमें शांति, और साथ में ईमानदार मेहनत। साखी की सुई छोटी सी है, लगभग मज़ेदार, और यही उसकी ताक़त है। एक छोटी सी चीज़ से वह दिखा देती है कि हम किसी चीज़ को हमेशा पकड़कर नहीं रख सकते। दुनी चंद को अपना घर छोड़ने की ज़रूरत नहीं थी। उन्हें यह मानना छोड़ना था कि उनका घर ही वे हैं। संतोष यही बदलाव है: चीज़ों के मालिक बनने से, उन्हें अच्छे से इस्तेमाल करने और बाँटने तक।", "b": "मनोवैज्ञानिक इस मुश्किल को ट्रेडमिल की तस्वीर से समझाते हैं। हम तेज़ दौड़ते हैं और ज़्यादा कमाते हैं, पर हर नई चीज़ की बहुत जल्दी आदत पड़ जाती है, इसलिए ख़ुशी वहीं की वहीं रहती है। नया फ़ोन एक हफ़्ता बहुत अच्छा लगता है। बड़ी तनख़्वाह एक महीना ख़ास लगती है। फिर मंज़िल फिर से आगे खिसक जाती है। संतोष का मतलब बढ़ना छोड़ देना नहीं है। आप बेहतर नौकरी या बड़ा घर चाह सकते हैं। फ़र्क़ इसमें है कि बढ़ते समय आप कहाँ खड़े हैं। मेरे पास काफ़ी है, और मैं आगे बना रहा हूँ, यहाँ से। जब तक वह नहीं मिलता मैं कुछ नहीं, यहाँ से नहीं। पहली जगह से जीवन एक सफ़र लगता है। दूसरी से, एक ऐसी दौड़ जिसमें आप हमेशा हार रहे हैं।", "t": "अगली ख़रीदारी से पहले एक दिन रुकिए। आज रात तीन चीज़ें गिनिए जो पहले से आपके पास हैं।", "q": "आपकी तनख़्वाह बढ़ी। दोस्त कहते हैं: अब EMI पर बड़ी गाड़ी लो, तुम हक़दार हो। समझदारी क्या है?", "o": ["अभी वाली गाड़ी रखना, छह महीने अतिरिक्त पैसा बचाना, फिर शांति से तय करना", "आज ही ले लेना; ज़िंदगी छोटी है", "गाड़ी भी लेना, और बड़े फ़्लैट का लोन भी"], "y": "समझदारी। छह महीने दिखा देंगे कि आपको सच में वह चाहिए या बस पहला रोमांच। और बचत गाड़ी से बेहतर चीज़ ख़रीदती है: बेफ़िक्री।", "n": "आप अच्छी चीज़ों के हक़दार हैं। पर नई तनख़्वाह पर बड़ी EMI अक्सर ख़ुशी को हर महीने के तनाव में बदल देती है, और रोमांच हफ़्तों में फीका पड़ जाता है। छह महीने रुककर देखिए।", "d": "लाहौर के अमीर दुनी चंद ने अपने घर पर हर लाख के लिए एक झंडा लगा रखा था। गुरु नानक देव जी ने उसे एक सुई दी और कहा, इसे अगले जहान में लौटा देना। उसकी पत्नी ने पूछा: मरने के बाद सुई कैसे साथ ले जाओगे? वह चुप हो गया, और बाँटने लगा। बस क्यों कभी बस नहीं होता? मनोवैज्ञानिक इसे हेडोनिक ट्रेडमिल कहते हैं (ब्रिकमैन और कैंपबेल, 1971): तनख़्वाह बढ़ने या नए फ़ोन के बाद ख़ुशी बढ़ती है, फिर सामान्य पर लौट आती है, और हम अगली चीज़ के पीछे भागते हैं। ट्रेडमिल से उतरने का रास्ता है ध्यान देना। जिन्होंने हर हफ़्ते शुक्राने की बातें लिखीं, वे अपनी ज़िंदगी से ज़्यादा संतुष्ट थे (एमन्स और मैककलो, 2003)। संतोख कम रखना नहीं, जो है उसे आख़िरकार देख पाना है। असली उदाहरण: जिस फ़ोन के लिए आपने दो साल पहले ज़िद की थी, आज उसी को पुराना कहते हैं।"}, "listen1": {"ti": "पहले सुनिए", "s": "आपकी सहेली अपने बुरे दिन की बात शुरू करती है। उसके पूरा करने से पहले आप कह देते हैं, पता है तुम्हें क्या करना चाहिए? वह चुप हो जाती है। उसे सुनने वाला चाहिए था, उसे भाषण मिल गया।", "m": "सच्चे मन से सुनने से दुख और पाप मिट जाते हैं।", "k": "दूसरे गुरु बनने से बहुत पहले भाई लहणा खडूर में रहते थे। एक सुबह तड़के उन्होंने अपने पड़ोसी भाई जोधा को कुछ ऐसी पंक्तियाँ गाते सुना जो उन्होंने पहले कभी नहीं सुनी थीं। वे गुरु नानक के शब्द थे। भाई लहणा रुक गए, सुनते रहे, और वे शब्द उनके मन से गए ही नहीं। उन्होंने पूछा कि ये किसने लिखे हैं। जब पता चला कि ये करतारपुर वाले गुरु नानक के हैं, तो वे उनसे मिलने निकल पड़े, और उनका जीवन फिर कभी पहले जैसा नहीं रहा। यह सब एक साधारण सुबह से शुरू हुआ, और सच्चे मन से सुनने के एक पल से।", "a": "जपुजी साहिब की चार पउड़ियाँ एक ही शब्द से शुरू होती हैं: सुणिऐ, यानी सुनना। गुरु नानक पूरे ध्यान से ईश्वर के शब्द को सुनने की बात कर रहे हैं। भाई लहणा की कहानी दिखाती है कि यह कितना ताक़तवर हो सकता है। वे अपने ख़यालों में डूबे आगे निकल सकते थे। पर वे रुके, और जो सुना उसके लिए पूरी तरह खुल गए। रोज़ के जीवन में हम वही गुण, यानी पूरा ध्यान, अपने सामने बैठे लोगों के लिए उधार लेते हैं। ज़्यादातर समय हम सच में सुनते नहीं। हम बस अपनी बारी का इंतज़ार करते हैं। सामने वाला इसे महसूस कर लेता है, जैसे आप महसूस कर लेते हैं जब कोई बात करते हुए बार बार अपना फ़ोन देखता रहे।", "b": "स्टीफ़न कवी अपनी मशहूर किताब, सेवन हैबिट्स, में कहते हैं: पहले दूसरे को समझिए, फिर अपनी बात समझाइए। जो डॉक्टर दर्द पूछे बिना दवा लिख दे, वह अच्छा डॉक्टर नहीं है। दोस्त भी नहीं। जब इंसान को लगता है कि उसे सुना गया, तो उसके अंदर कुछ नरम पड़ जाता है। वह शांत हो जाता है, और अक्सर बोलते बोलते अपना जवाब ै, किसी से बैर नहीं रखता, समय से परे है, जन्म से परे है, अपने आप से है, और गुरु की कृपा से जाना जाता है।", "k": "आनंदपुर की घेराबंदी के समय मैदान घायलों से भरा था, जो पानी के लिए पुकार रहे थे। भाई घनैया जी कंधे पर पानी की मशक लिए उनके बीच चलते थे। वे हर एक के पास घुटनों के बल बैठते, और सबको पानी पिलाते, सिख सिपाहियों को भी और दुश्मन सिपाहियों को भी। कुछ सिखों को गुस्सा आया और उन्होंने गुरु गोबिंद सिंह जी से शिकायत की कि वे दुश्मन को फिर से ज़िंदा कर रहे हैं। गुरु जी ने उन्हें बुलाया और पूछा कि क्या यह सच है। भाई घनैया जी ने जवाब दिया कि उस मैदान में उन्हें कोई दुश्मन नहीं दिखता, सिर्फ़ ज़रूरतमंद इंसान दिखते हैं। परंपरा बताती है कि गुरु जी ख़ुश हुए, और उन्हें मरहम और पट्टियाँ भी दीं, ताकि वे पानी के साथ घाव भी भर सकें।", "a": "मूल मंतर के बीच के दो शब्दों को देखिए। निरभउ, यानी बिना डर के। और निरवैर, यानी बिना बैर के। जिस एक की यहाँ बात है, उसका कोई दुश्मन नहीं। जो लोग इसे जीने की कोशिश करते हैं, उनके अपने दिल में भी दुश्मन धीरे धीरे कम होते जाते हैं। भाई घनैया जी ने दिखाया कि यह सबसे मुश्किल जगह, जंग के बीच, कैसा दिखता है। उन्होंने यह नहीं माना कि लड़ाई नहीं हो रही। बस उन्होंने लड़ाई को यह तय नहीं करने दिया कि पानी किसे मिलेगा। यह कमज़ोरी नहीं है। जो एक घंटे पहले आपसे लड़ रहा था, उसके पास घुटनों के बल बैठने में बहुत हिम्मत चाहिए। डर और बैर अक्सर साथ चलते हैं। जब हम कम डरते हैं, तो हमें दुश्मनों की कम ज़रूरत पड़ती है।", "b": "जिसे आप पसंद नहीं करते उसकी मदद करने का मतलब यह नहीं कि वह सही था। इसका मतलब है कि आपकी भलाई उसके बर्ताव पर टिकी नहीं है। एक दीये को देखिए। कमरे में जो भी आए, वह सबको एक जैसी रोशनी देता है। और इसमें आपका अपना भी चुपचाप फ़ायदा है। नफ़रत उठाने में भारी होती है। आप उसे दिन भर अपने सीने में ढोते हैं, जबकि सामने वाले को शायद पता भी न हो। वह आपकी नींद और मूड बिगाड़ती है, उसकी नहीं। माफ़ी पर शोध करने वालों ने पाया है कि मन की गाँठें खोलने से अक्सर तनाव कम होता है। जो बोझ नीचे रख देता है, वह हल्का होकर चलता है। मुश्किल इंसान के साथ भलाई, आख़िर में, अपने साथ भी भलाई है।", "t": "इस हफ़्ते जिससे आप कतराते हैं, उसके लिए एक छोटी भलाई कीजिए।", "q": "जिस पड़ोसी ने सोसाइटी में आपके परिवार की शिकायत की थी, उसकी गाड़ी की बैटरी बैठ गई है और उसे अस्पताल पहुँचने में देर हो रही है। आपके पास केबल हैं। आप क्या करेंगे?", "o": ["अनदेखा करना; उसने अपना रास्ता ख़ुद चुना", "मदद करना, पर साथ में उसकी शिकायत याद दिलाना", "जल्दी से मदद करना, और पुरानी बात का ज़िक्र न करना"], "y": "यही भाई घनैया जी का रास्ता है। ज़रूरत इतिहास से पहले आती है। और बिना भाषण की मदद ही दिल को नरम करती है।", "n": "आपकी चोट असली है। पर मुँह मोड़ना आपको छोटा करता है, और याद दिलाकर मदद करना भलाई को क़र्ज़ बना देता है। जल्दी मदद कीजिए और अतीत को चुप रहने दीजिए।", "d": "आनंदपुर की लड़ाई में भाई घनैया जी हर घायल सिपाही को पानी पिलाते थे, सिख हो या दुश्मन। कुछ ने शिकायत की, तो गुरु गोबिंद सिंह जी ने पूछा। उन्होंने कहा, मुझे कोई दुश्मन नहीं दिखा, बस ज़रूरतमंद इंसान। गुरु जी ने उन्हें मरहम दी और कहा, ज़ख़्मों पर भी लगाओ। यह हमारे लिए इतना कठिन क्यों है? मन दुनिया को हम और वे में बाँटता है, और बिना जाने अपने समूह का पक्ष लेता है। हेनरी ताजफ़ेल ने इसे सोशल आइडेंटिटी कहा (1979)। इक ओंकार, एक करतार, जड़ तक जाता है: अगर सबमें एक ही ज्योति है, तो वे कोई नहीं। लविंग-काइंडनेस अभ्यास पर शोध में पाया गया कि कुछ हफ़्ते दूसरों के भले की कामना करने वाले लोग ज़्यादा जुड़ाव और सकारात्मकता महसूस करते थे (फ़्रेडरिकसन, 2008)। असली उदाहरण: पार्किंग पर जिस पड़ोसी से झगड़ा हुआ, वह भी किसी का पिता है, और दर्द हर चेहरे पर एक-सा दिखता है।"}, "mind1": {"ti": "पहले मन को जीतिए", "s": "रात के ग्यारह बजे हैं। बस पाँच मिनट रील्स, आप ख़ुद से कहते हैं। सिर उठाते हैं तो रात का एक बज चुका है। अलार्म सुबह छह बजे का है।", "m": "सबको अपनी ही जमात का समझो। अपने मन को जीत लो, तो जग जीत लिया।", "k": "जब गुरु नानक सुल्तानपुर में रहते थे, तो वहाँ के नवाब दौलत ख़ान ने उन्हें मस्जिद में नमाज़ में शामिल होने बुलाया। गुरु नानक साथ गए, पर जब बाक़ी सब नमाज़ पढ़ रहे थे, वे चुपचाप खड़े रहे। बाद में नवाब और क़ाज़ी ने पूछा कि वे शामिल क्यों नहीं हुए। जनमसाखियाँ उनका जवाब बताती हैं। नवाब का शरीर तो झुक रहा था, पर उनका मन दूर काबुल में घोड़े ख़रीद रहा था। और क़ाज़ी का मन घर पर था, इस चिंता में कि कहीं उनका नया जन्मा बछेरा  चिल्लाना ग़लत था", "समझाना कि आप तनाव में क्यों थे, ताकि वे समझें"], "y": "हाँ। सीधा, बिना बहाने। उसी रात की माफ़ी चोट को बैठने नहीं देती, और दिखाती है कि वे आपके अहं से ज़्यादा मायने रखती हैं।", "n": "ये आसान लगते हैं, पर वे यूँ ही नहीं भूलेंगी, और बहाने माफ़ी को सफ़ाई बना देते हैं। आज रात एक सीधा माफ़ कीजिए, मैं ग़लत था, कहीं ज़्यादा भरता है।", "d": "सज्जन सड़क किनारे स्वागत करने वाली सराय चलाता था, और रात को मेहमानों को लूटता था। गुरु नानक देव जी वहाँ ठहरे, तो उन्होंने उन चीज़ों का शब्द गाया जो बाहर चमकती हैं पर भीतर से काली रहती हैं। सज्जन ने ख़ुद को देखा, गुरु जी के चरणों में गिरा, चुराया हुआ लौटाया, और सराय को सच्ची सेवा की जगह बना दिया। ग्लानि कभी मदद क्यों करती है और कभी तोड़ क्यों देती है? मनोवैज्ञानिक जून टैंगनी ने फ़र्क़ बताया: ग्लानि कहती है मैंने बुरा किया, शर्म कहती है मैं बुरा हूँ। ग्लानि सुधार की ओर ले जाती है, शर्म छिपने या दोष देने की ओर। क्रिस्टिन नेफ़ का शोध जोड़ता है कि ग़लती के बाद ख़ुद से नरमी बरतने वाले ज़िम्मेदारी लेने की ज़्यादा संभावना रखते हैं, कम नहीं। गुरबाणी की तस्वीर उम्मीद भरी है: मैला मन धुल सकता है। दाग़ असली है, पर वह आपकी पहचान नहीं। असली उदाहरण: जो दोस्त कहता है मैं ग़लत था, माफ़ करना, उस पर ग़लती के बाद पहले से ज़्यादा भरोसा होता है।"}, "joy1": {"ti": "ख़ुशी बाँटने के लिए होती है", "s": "आपका रिज़ल्ट आया है, और उम्मीद से भी अच्छा है। मन गाने को करता है। आप अपनी सबसे अच्छी दोस्त को फ़ोन करते हैं, और अचानक ख़ुशी दोगुनी लगने लगती है।", "m": "नानक कहते हैं, जिनका दिल उस एक की ओर मुड़ा है, वे सदा खिले रहते हैं।", "k": "भाई मरदाना गुरु नानक के गाँव में ही पले बढ़े थे, और बचपन से उनके दोस्त थे। वे एक मुसलमान संगीतकार थे जो रबाब बजाते थे, तारों वाला एक साज़। जब गुरु नानक अपनी लंबी यात्राओं पर निकले, तो मरदाना उनके साथ गए, बहुत सालों तक और हज़ारों मील। पुरानी कथाएँ बताती हैं कि जब गुरु नानक के मन में नए शब्द उठते, तो वे अपने दोस्त की ओर मुड़कर कहते: मरदाना, रबाब छेड़, बाणी आई है। और वहीं, किसी पेड़ के नीचे या नदी के किनारे, संगीत और शब्द साथ साथ बह निकलते। उनकी ख़ुशी कभी अपने तक नहीं रखी गई। वह गाई जाती थी, और जो भी सुनने आता, उससे बाँटी जाती थी।", "a": "इस पंक्ति का शब्द विगास का मतलब है खिलना, जैसे सुबह फूल खुलता है। गुरु नानक कहते हैं कि जिनका दिल उस एक की ओर मुड़ा है, वे ऐसी ही ख़ुशी में जीते हैं। यह कोई पार्टी नहीं जो आधी रात को ख़त्म हो जाए। यह एक ठहरा हुआ खिलना है जो साधारण दिनों में भी रहता है। मरदाना का रबाब दिखाता है कि यह ख़ुशी कभी फीकी या भारी नहीं थी। यह संगीत भरी, गर्म और दोस्ती से भरी थी। हिंदू घर में जन्मे एक गुरु और मुसलमान घर में जन्मे एक संगीतकार दशकों तक साथ गाते हुए घूमे। उनकी ख़ुशी ने वे सब लकीरें पार कर दीं जो लोग अक्सर खींचते हैं। सच्ची ख़ुशी यही करती है। वह हमें घमंडी नहीं बनाती। वह हमें दूसरों को साथ जोड़ने को कहती है।", "b": "ख़ुशी पर शोध करने वाले मनोवैज्ञानिकों ने एक सीधी सी बात देखी है। जब हम किसी को अपनी अच्छी ख़बर बताते हैं, और वह सच्ची दिलचस्पी से जवाब देता है, तो अच्छा एहसास अक्सर ज़्यादा देर टिकता है। बाँटी गई ख़ुशी बढ़ती है। ख़ुशी संगीत से, साथ खाने से, और साथ हँसने से भी फैलती है। और एक बात और। जो लोग छोटी चीज़ों के लिए शुक्रगुज़ार रहते हैं, एक अच्छी चाय, धूप वाली खिड़की, किसी दोस्त की आवाज़, वे समय के साथ उन लोगों से ज़्यादा ख़ुश रहते हैं जो बड़ी जीतों का इंतज़ार करते हैं। आपको किसी परफ़ेक्ट दिन का इंतज़ार नहीं करना। एक छोटा सा खिलना, जिसे देखा और बाँटा जाए, वही असली चीज़ है।", "t": "आज किसी की अच्छी ख़बर पर सच्ची ख़ुशी दिखाइए, और एक सवाल पूछिए।", "q": "आपकी छोटी बहन दौड़ती आती है, बताने कि स्कूल प्रतियोगिता में दूसरा इनाम मिला। आप वर्क कॉल के बीच में हैं। आप क्या करेंगे?", "o": ["बीस सेकंड कॉल म्यूट करके, बड़ी मुस्कान के साथ कहना: कॉल के बाद सब बताना!", "इशारे से रुकने को कहना और कॉल पूरी करना", "बिना ऊपर देखे शाबाश कह देना"], "y": "बहुत सुंदर। बीस सेकंड की सच्ची ख़ुशी, और आगे सुनने का वादा। उसे याद रहेगा कि आप उसके लिए ख़ुश थे।", "n": "आप व्यस्त थे, यह सच है। पर बच्चे का गर्व का पल जल्दी गुज़रता है, और ठंडा जवाब सिखाता है कि उसकी ख़ुशी आपके लिए मायने नहीं रखती। बीस सेकंड का सच्चा ध्यान काफ़ी है।", "d": "भाई मरदाना, मुसलमान संगीतकार और गुरु नानक देव जी के बचपन के दोस्त, सालों उनके साथ घूमे। जब नई बाणी आती, गुरु जी कहते: मरदाना, रबाब छेड़, बाणी आई है। ख़ुशी गीत बनकर निकलती, और पेड़ों के नीचे, नदियों के किनारे बँटती। बाँटी हुई ख़ुशी क्यों बढ़ती है? मनोवैज्ञानिक अच्छी ख़बर बाँटने को कैपिटलाइज़ेशन कहते हैं। शेली गेबल और साथियों ने पाया (2004) कि जब कोई हमारी अच्छी ख़बर पर सच्चे उत्साह से जवाब देता है, तो ख़ुशी बढ़ती है और रिश्ता गहरा होता है। ठंडा सा अच्छा है, दोनों को छोटा करता है। गुरबाणी का शब्द विगास, यानी खिलना, ऐसे ही खुले दिल को बताता है। असली उदाहरण: जब दोस्त नई नौकरी की ख़बर देने फ़ोन करे, तो दो मिनट पूछना कि कैसे हुआ, उसके लिए किसी तोहफ़े से ज़्यादा है।"}, "lonely1": {"ti": "घेरे से बाहर कोई नहीं", "s": "आप काम के लिए एक नए शहर आए हैं। वीकेंड सबसे मुश्किल होते हैं। ऑनलाइन हर कोई दोस्तों के साथ दिखता है, और आपका कमरा बहुत, बहुत शांत लगता है।", "m": "सब जीवों का एक ही दाता है। वह मुझे कभी न भूले।", "k": "पश्चिम की यात्रा में गुरु नानक मक्का पहुँचे। सफ़र से थककर वे आराम करने लेटे, और उनके पैर संयोग से काबा की ओर हो गए। एक आदमी ने यह देखा और गुस्से में उन्हें जगाया। तुम ख़ुदा के घर की ओर पैर करने की हिम्मत कैसे करते हो, उसने पूछा। गुरु नानक ने नरमी से जवाब दिया: तो मेरे पैर उस दिशा में कर दो जहाँ ख़ुदा न हो। भाई गुरदास, जिन्होंने गुरु जी के समय की यादें ताज़ा रहते लिखा, अपनी पहली वार में यह कहानी बताते हैं। उस आदमी के पास कोई जवाब नहीं था। ऐसी कोई दिशा नहीं जहाँ वह एक न हो।", "a": "गुरु नानक की पंक्ति छोटी है: सब जीवों का एक दाता है, वह मुझे कभी न भूले। हर कोई उसी दाता के सहारे है। आप, आपके आसपास शहर के लोग, दूर बैठा आपका दोस्त, बस में बैठा अजनबी भी। मक्का की साखी इसे एक सीधी तस्वीर में रख देती है। किसी भी दिशा में मुड़िए, वह एक पहले से वहाँ है। अकेलापन अक्सर कान में कहता है कि हम घेरे से बाहर हैं, कि बाक़ी सब किसी के हैं और हम नहीं। यह पंक्ति उस फुसफुसाहट का जवाब है। कोई बाहर नहीं है। इससे ख़ाली कमरा तुरंत नहीं भर जाता। पर कमरा बदल जाता है। आप उसमें छोड़े हुए नहीं हैं। आप थामे हुए हैं, और अगली दोस्ती उतनी दूर नहीं जितनी लगती है।", "b": "अकेलापन बहुत आम है, ख़ासकर नई जगह जाने के बाद, और यह आपके बारे में कुछ बुरा नहीं कहता। शोधकर्ता लंबे अकेलेपन को तनाव और ख़राब नींद से जोड़ते हैं, इसलिए उसकी प्यार से देखभाल ज़रूरी है। अच्छी ख़बर यह है कि रिश्ते अक्सर छोटी, बार बार की मुलाक़ातों से बढ़ते हैं, किसी एक बड़े पल से नहीं। हर सुबह उसी चायवाले को नमस्ते। हफ़्ते में एक बार कोई क्लास, या रविवार को गुरुद्वारे के लंगर में सेवा, जहाँ बहुत से हाथ साथ काम करते हैं। किसी पुराने दोस्त को पाँच मिनट का फ़ोन। हर एक एक छोटा धागा है, और धागे मिलकर रस्सी बनते हैं। यह भी याद रखिए कि आपके आसपास बहुत से लोग चुपचाप अकेले हैं। हो सकता है आपकी नमस्ते का ही वे इंतज़ार कर रहे हों।", "t": "इस हफ़्ते एक जगह चुनिए जहाँ दो बार जाएँ, और दोनों बार एक इंसान से नमस्ते कहें।", "q": "आपको नए शहर आए तीन महीने हुए। एक सहकर्मी आपको वीकेंड पर अपने दोस्तों के साथ डिनर पर बुलाती है, जिन्हें आप नहीं जानते। आपको झिझक है। आप क्या करेंगे?", "o": ["विनम्रता से मना करना; जब लोगों को बेहतर जानेंगे तब जाएँगे", "जाना, एक घंटा रुकना, और दो लोगों से एक-एक सवाल पूछना", "जाना, पर फ़ोन में लगे रहना ताकि अजीब न लगे"], "y": "अच्छा चुनाव। दोस्तियाँ छोटी-छोटी बार-बार की मौजूदगी से शुरू होती हैं। एक घंटा और दो सच्चे सवाल शुरुआत के लिए काफ़ी हैं।", "n": "झिझक स्वाभाविक है। पर लोगों को जाकर ही जाना जाता है, जाने से पहले नहीं, और फ़ोन आपको कमरे में अदृश्य कर देता है। एक घंटा जाइए और दो सवाल पूछिए।", "d": "मक्का में एक नाराज़ आदमी ने गुरु नानक देव जी को जगाया, क्योंकि उनके पैर काबे की ओर थे। गुरु जी ने नरमी से कहा: मेरे पैर उस ओर कर दो जहाँ ख़ुदा न हो। भाई गुरदास जी अपनी पहली वार में यह लिखते हैं। कोई दिशा उस एक के बिना नहीं, और कोई इंसान दायरे से बाहर नहीं। अकेलापन इतना क्यों चुभता है? क्योंकि जुड़ाव खाने जैसी बुनियादी ज़रूरत है। रॉय बॉमाइस्टर और मार्क लियरी ने 1995 में यही तर्क दिया। 2010 में जूलियन होल्ट-लुन्स्टैड ने 148 अध्ययनों की समीक्षा की और पाया कि मज़बूत रिश्तों वाले लोगों के अध्ययन अवधि में जीवित रहने की संभावना लगभग पचास प्रतिशत ज़्यादा थी। अकेलापन कमज़ोरी नहीं; यह भूख जैसा संकेत है कि हाथ बढ़ाओ। गुरबाणी दोनों बात कहती है: आप उस एक की देखभाल से बाहर नहीं, और यही सच आपको दूसरों की ओर बढ़ने को कहता है। असली उदाहरण: नए शहर की ज़्यादातर दोस्तियाँ एक ही जगह बार-बार जाने से शुरू होती हैं।"}, "loved1": {"ti": "प्यार भरी नज़र", "s": "आप पूरी े लिए तालियों की ज़रूरत नहीं। फिर भी, लोगों को बताना अच्छा है कि आप उनसे प्यार करते हैं। इंतज़ार मत कीजिए।", "t": "आज किसी एक से कहिए: मैंने देखा आपने क्या किया। धन्यवाद। साफ़-साफ़ कहिए।", "q": "आपके पापा पच्चीस साल से एक ही थकाने वाली नौकरी कर रहे हैं ताकि आपकी पढ़ाई हो सके। वे कभी इसका ज़िक्र नहीं करते। आज रात खाने पर आप क्या कर सकते हैं?", "o": ["कुछ नहीं; माता-पिता यही करते हैं", "अगले महीने महँगा तोहफ़ा ख़रीदना", "साफ़ शब्दों में कहना: मैं जानता हूँ आपने मेरे लिए क्या छोड़ा। धन्यवाद, पापा।"], "y": "यह बात उनके साथ सालों रहेगी। साफ़ शब्द बताते हैं कि आपने उनका त्याग सच में देखा है, और हर माता-पिता चुपचाप यही चाहते हैं।", "n": "तोहफ़े अच्छे हैं, और माता-पिता स्वाभाविक रूप से त्याग करते हैं। पर ज़्यादातर माता-पिता देखे जाना चाहते हैं। आज रात के साफ़ शब्द किसी भी ख़रीदी चीज़ से ज़्यादा मायने रखते हैं।", "d": "करतारपुर में कीचड़ से टपकते घास के गट्ठर उठाने थे। बाक़ी लोग बहाने ढूँढते रहे। भाई लहणा जी ने नए कपड़ों में तीनों गट्ठर उठा लिए। माता सुलखनी जी कीचड़ भरे कपड़े देखकर दुखी हुईं, तो गुरु नानक देव जी ने कहा: यह कीचड़ नहीं, केसर है। प्यार मेहनत देखता है, दाग़ नहीं। हम तारीफ़ के पीछे क्यों भागते रहते हैं? कार्ल रॉजर्स ने अनकंडीशनल पॉज़िटिव रिगार्ड बताया: बिना शर्त क़ीमती माना जाना। जेनिफ़र क्रॉकर का शोध उल्टा जाल दिखाता है: जब क़ीमत अंकों, रूप या लाइक्स पर टिकी हो, तो हर नतीजे के साथ मन झूलता है। गुरबाणी उस क़ीमत की ओर इशारा करती है जो प्रदर्शन पर नहीं टिकी। और हमसे कहती है कि वे आँखें बनो जो देखती हैं। असली उदाहरण: ऑफ़िस की सफ़ाई करने वाली, जो सब चमकाकर रखती है, तभी दिखती है जब कुछ गंदा हो। एक धन्यवाद उसका पूरा दिन बदल सकता है।"}, "fear1": {"ti": "जब चिंता रुकती नहीं", "s": "रात के दो बजे हैं। कल पापा की जाँच की रिपोर्ट आनी है। दिमाग़ हर बुरे अंत को फ़िल्म की तरह बार-बार चला रहा है, और फ़ोन पर डरावने शब्दों से भरा सर्च पेज खुला है। नींद बहुत दूर लगती है।", "m": "जो परमात्मा की शरण में है, उसे गर्म हवा नहीं लगती। हमारे चारों ओर प्रभु के नाम की रक्षा की रेखा है; भाई, कोई दुख हमें छू नहीं सकता।", "k": "सिख परंपरा याद करती है कि जब गुरु अर्जन देव जी के छोटे बेटे हरगोब , "o": ["मैसेज अनदेखा करना; कुछ बातें माफ़ नहीं होतीं", "तुरंत मिलना और ऐसे दिखाना जैसे कुछ हुआ ही नहीं", "माफ़ी के लिए धन्यवाद कहना, और बताना कि मिलना चाहेंगे, पर धीरे-धीरे"], "y": "समझदारी और भलाई दोनों। आपने माफ़ी स्वीकार की, और सेहतमंद सीमा भी रखी। माफ़ी और भरोसा अलग-अलग रफ़्तार से बढ़ सकते हैं।", "n": "दोनों प्रतिक्रियाएँ समझ में आती हैं। पर अनदेखा करने से ज़ख़्म आपके भीतर खुला रहता है, और कुछ हुआ ही नहीं दिखाने से भरना छूट जाता है। माफ़ी स्वीकारिए, और भरोसा धीरे-धीरे बनाइए।", "d": "1705 में चालीस सिखों ने गुरु गोबिंद सिंह जी से नाता तोड़ने का बेदावा लिखा और घर लौट गए। माई भागो की लाहनत के बाद वे लौटे और खिदराणा में जान दे दी। मरते हुए महां सिंह ने गुरु जी से वह बेदावा फाड़ने की विनती की। गुरु जी ने उनका सिर गोद में रखा और उसे फाड़ दिया। माफ़ करना इतना कठिन क्यों है? क्योंकि हम उसे यह कहना समझते हैं कि सब ठीक था। रॉबर्ट एनराइट का शोध साफ़ है: माफ़ी ग़लती को सही ठहराना, भूलना, या ज़रूरी तौर पर फिर जुड़ना नहीं है। एवरेट वर्थिंगटन इसे धीरे-धीरे नाराज़गी की जगह सद्भावना लाना बताते हैं। अध्ययन लंबे गिले और चोट को बार-बार दोहराने को ज़्यादा तनाव से जोड़ते हैं। फ़रीद जी ने सदियों पहले यही कारण दिया: गुस्से को मन में टिकने मत दो, शरीर स्वस्थ रहेगा। असली उदाहरण: शायद आपका कज़िन कभी माफ़ी न माँगे। उसे माफ़ करना उस पर फिर भरोसा करना नहीं है। इसका मतलब है वह अब आपके दिमाग़ में मुफ़्त किराए पर नहीं रहता।"}, "women1": {"ti": "बराबर सम्मान", "s": "एक पारिवारिक समारोह में एक अंकल मज़ाक़ करते हैं कि लड़कियों को ज़्यादा पढ़ने की क्या ज़रूरत, शादी तो होनी ही है। कुछ लोग हँस देते हैं। आपकी छोटी कज़िन, जिसने अभी-अभी फ़िज़िक्स में क्लास टॉप की है, चुप हो जाती है और अपनी प्लेट की ओर देखने लगती है।", "m": "उसे बुरा क्यों कहें, जिससे राजा भी जन्म लेते हैं?", "k": "सिख परंपरा बीबी अमरो को याद करती है, गुरु अंगद देव जी की बेटी, जिनकी शादी अमरदास जी के भाई के परिवार में हुई थी। हर सुबह दूध बिलोते हुए वे गुरु नानक देव जी की बाणी गाती थीं। एक दिन अमरदास जी, जो साठ पार के एक श्रद्धालु तीर्थयात्री थे, ने उन्हें गाते सुना और भीतर तक हिल गए। उन्होंने पूछा, ये किसके वचन हैं? बीबी अमरो उन्हें खडूर में अपने पिता गुरु अंगद देव जी के पास ले गईं। उस मुलाक़ात ने उनकी ज़िंदगी बदल दी। उन्होंने पूरी लगन से सेवा की और आगे चलकर तीसरे गुरु बने। एक युवा स्त्री की आवाज़ भविष्य के गुरु को गुरु तक ले आई।", "a": "गुरु नानक देव जी के समय में स्त्रियों को अक्सर अपवित्र माना जाता था, ख़ासकर बच्चे के जन्म के बाद, और बदक़िस्मती का दोष उन पर डाला जाता था। आसा दी वार का यह सलोक इसका सीधा जवाब देता है। हर इंसान स्त्री के गर्भ में बनता और उसी से जन्म लेता है; रिश्ते, शादियाँ, दोस्तियाँ और दुनिया की राह उसी से चलती है। तो उसे छोटा कैसे कहा जा सकता है? सलोक के अंत में कहा गया है कि सिर्फ़ वह एक ही स्त्री से जन्म नहीं लेता, और जो भी मुख, पुरुष का हो या स्त्री का, उस एक की स्तुति करता है, वह सच्चे दरबार में उजला होता है। सम्मान स्त्रियों पर कोई एहसान नहीं; वह कभी किसी का छीनने का था ही नहीं। गुरुओं ने इसे संगत और लंगर में जीकर दिखाया, जहाँ सब साथ बैठते और गाते थे।", "b": "घर में देखिए कि हमेशा कौन परोसता है और कौन पहले खाता है, किससे करियर के बारे में पूछा जाता है और किससे सिर्फ़ शादी के बारे में। रोज़ की छोटी आदतें बच्चों को बड़े भाषणों से ज़्यादा सिखाती हैं।", "t": "आज परिवार की किसी स्त्री से उसके सपनों के बारे में पूछिए, और सच में सुनिए।", "q": "एक शादी में एक आंटी आपकी डॉक्टर कज़िन से कहती हैं: उम्र हो रही है, करियर छोड़ो, अब शादी पर ध्यान दो। सब सुन रहे हैं। आप क्या करेंगे?", "o": ["तनाव से बचने के लिए बात बदल देना", "मुस्कुराकर कहना: आंटी, इसने पिछले हफ़्ते एक मरीज़ की जान बचाई, सबको बताओ!", "आंटी से कहना कि वे पिछड़ी सोच वाली हैं"], "y": "बहुत सुंदर। आपने किसी को नीचा दिखाए बिना रोशनी उसकी उपलब्धि पर डाल दी। पूरे कमरे ने अलग कहानी सुनी, और कज़िन को लगा कि कोई उसे देखता है।", "n": "शांति और वफ़ादारी दोनों मायने रखते हैं। पर बात बदलने से वह संदेश वहीं खड़ा रहता है, और आंटी का अपमान उसे झगड़ा बना देता है। उसके काम का जश्न सलीक़े से जवाब देता है।", "d": "गुरु अंगद देव जी की बेटी बीबी अमरो हर सुबह दूध बिलोते हुए गुरु नानक देव जी की बाणी गाती थीं। साठ पार अमरदास जी ने सुना, भीतर तक हिल गए, और पूछा ये किसके वचन हैं। वे उन्हें अपने पिता के पास ले गईं, और आगे चलकर वे तीसरे गुरु बने। एक युवा स्त्री की आवाज़ भविष्य के गुरु को गुरु तक ले आई। गुरु नानक देव जी के समय स्त्रियों को अक्सर अपवित्र कहा जाता था। उनका सलोक सीधा जवाब देता है: हर इंसान, हर राजा भी, स्त्री से जन्मा है, इसलिए उसे छोटा कहा ही नहीं जा सकता। प्यार करने वाले परिवारों में भी असमानता क्यों बची रहती है? क्योंकि उसका बड़ा हिस्सा प्यारा लगता है। पीटर ग्लिक और सूज़न फ़िस्क ने इसे बेनेवोलेंट सेक्सिज़्म कहा (1996): वह इस काम के लिए नाज़ुक है, पढ़कर क्या करेगी, शादी तो होनी है। सुनने में परवाह, पर उसकी दुनिया छोटी करता है। असली उदाहरण: घर में देखिए कौन हमेशा परोसता है और कौन पहले खाता है, किससे करियर पूछा जाता है और किससे सिर्फ़ शादी।"}, "work1": {"ti": "ईमानदार कमाई, खुले हाथ", "s": "आपका दोस्त एक 'फ़ोन से काम' स्कीम दिखाता है जो रोज़ एक घंटे के लिए महीने के पचास हज़ार रुपये का वादा करती है। बस जॉइनिंग फ़ीस देनी है और दूसरों को जोड़ना है। वहीं आपकी अपनी नौकरी धीमी और साधारण लगती है।", "m": "जो मेहनत से कमाकर खाता है, और उसमें से कुछ अपने हाथ से दूसरों को देता है, नानक, वही असली राह पहचानते हैं।", "k": "सिख परंपरा याद करती है कि गुरु अंगद देव जी गुरु होकर भी खडूर में मूँज, यानी मोटी घास, की रस्सी बटकर अपनी रोज़ी कमाते थे, और लंगर ईमानदार, बाँटी हुई कमाई से चलता था, गुरु जी की माँगी भेंटों से नहीं। उन्होंने पहलवानों के लिए अखाड़ा भी बनाया और बच्चों को गुरमुखी पढ़ना-लिखना सिखाया। उनका दिन साधारण कामों से भरा था, पूरे ध्यान से किया हुआ, और वही काम उनकी भक्ति का हिस्सा था।", "a": "संदर्भ में देखें तो यह सलोक दो तरह की ज़िंदगियों को आमने-सामने रखता है। इन पंक्तियों से ठीक पहले गुरु नानक देव जी उन लोगों का ज़िक्र करते हैं जो धर्म को दूसरों पर पलने का ज़रिया बना लेते हैं: समझ के बिना भजन गाने वाला, भूखा मुल्ला जिसके लिए मस्जिद बस रोज़ी है, योगी दिखने के लिए कान छिदवाकर माँगने वाला; और जो ख़ुद को गुरु या पीर कहलवाए पर माँगता फिरे, उसके पैर कभी मत छूना। फिर आता है जवाब: मेहनत से कमाओ और बाँटो। प्रो. साहिब सिंह इसका अर्थ करते हैं कि उसी कमाई में से कुछ दूसरों को देना। यही तीन सिख आदतों की जड़ है: किरत करनी, यानी ईमानदार मेहनत; वंड छकना, यानी बाँटना; और नाम जपना, यानी याद रखना। ईमानदार काम तनख़्वाह के आकार की बात नहीं; बात यह है कि पैसा साफ़ आया या नहीं, और उसमें से कुछ दूसरों तक बहता है या नहीं।", "b": "जो स्कीमें असली सामान या काम के बजाय मुख्य रूप से लोगों को जोड़ने के पैसे देती हैं, वे अक्सर ढह जाती हैं और सबसे नीचे वालों को चोट पहुँचाती हैं। अगर कोई वादा बहुत आसान लगे, तो पैसे देने से पहले किसी भरोसेमंद से जाँच करा लीजिए।", "t": "इस हफ़्ते अपनी कमाई का एक छोटा हिस्सा अपने हाथ से किसी ज़रूरतमंद को दीजिए।", "q": "एक दोस्त साइड इनकम का ऑफ़र देता है: रेस्टोरेंट के लिए नक़ली फ़ाइव-स्टार रिव्यू लिखो, हर एक पर पाँच सौ रुपये, फ़ोन से। आसान पैसा, वह कहता है। आप क्या करेंगे?", "o": ["एक महीना करके छोड़ देना", "करना, पर सिर्फ़ उन रेस्टोरेंट के लिए जहाँ सच में गए हों", "मना करना; किसी असली काम से ज़्यादा कमाना, भले धीरे"], "y": "सही। नक़ली रिव्यू असली लोगों को असली पैसे ख़र्च करते वक़्त भटकाते हैं। ईमानदार अतिरिक्त कमाई, भले धीमी, चैन की नींद देती है।", "n": "अतिरिक्त पैसा लुभाता है, और यह बेनुक़सान लगता है। पर नक़ली रिव्यू भरोसा करने वालों को धोखा देते हैं, और एक महीना आसानी से आदत बन जाता है। असली काम चुनिए, भले धीमा हो।", "d": "गुरु अंगद देव जी गुरु होकर भी मूँज की रस्सी बटकर रोज़ी कमाते थे, और लंगर ईमानदार, बाँटी हुई कमाई से चलता था। संदर्भ में, सलोक पहले उन लोगों की आलोचना करता है जो धर्म को दूसरों पर पलने का ज़रिया बनाते हैं, और फिर जवाब देता है: मेहनत से कमाओ, और बाँटो। यही तीन सिख आदतों की जड़ है: किरत करनी, वंड छकना, और नाम जपना। इससे ज़िंदगी भरी-भरी क्यों लगती है? एलिज़ाबेथ डन और साथियों के शोध (साइंस, 2008) में पाया गया कि दूसरों पर पैसा ख़र्च करने वाले उतना ही अपने ऊपर ख़र्च करने वालों से ज़्यादा ख़ुश थे। सेल्फ़-डिटर्मिनेशन थ्योरी (डेसी और रायन) बताती है कि हम तब फलते-फूलते हैं जब सक्षम, आज़ाद और जुड़े हुए महसूस करते हैं, और अच्छे से किया ईमानदार काम तीनों को पोसता है। असली उदाहरण: जो स्कीमें असली काम की बजाय लोगों को जोड़ने के पैसे देती हैं, वे अक्सर ढह जाती हैं और सबसे नीचे वालों को चोट पहुँचाती हैं।"}}, pa:{"anger1": {"ti": "ਜਵਾਬ ਦੇਣ ਤੋਂ ਪਹਿਲਾਂ ਇਕ ਠਹਿਰਾਅ", "s": "ਪਰਿਵਾਰ ਦੇ ਗਰੁੱਪ ਵਿਚ ਇਕ ਸੁਨੇਹਾ ਆਉਂਦਾ ਹੈ। ਗੱਲ ਤੁਹਾਡੇ ਬਾਰੇ ਹੈ। ਅੱਧਾ ਮਜ਼ਾਕ, ਪੂਰਾ ਤਾਅਨਾ। ਚਿਹਰਾ ਗਰਮ ਹੋ ਜਾਂਦਾ ਹੈ, ਤੇ ਉਂਗਲਾਂ ਅਜਿਹਾ ਜਵਾਬ ਲਿਖਣ ਲੱਗ ਪੈਂਦੀਆਂ ਹਨ ਜੋ ਚੁਭੇਗਾ।", "m": "ਸੰਜਮ ਨੂੰ ਆਪਣੀ ਭੱਠੀ ਬਣਾਓ, ਤੇ ਧੀਰਜ ਨੂੰ ਸੁਨਿਆਰਾ।", "k": "ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਜਦੋਂ ਤੀਜੇ ਗੁਰੂ ਬਣੇ, ਉਦੋਂ ਉਹ ਬਜ਼ੁਰਗ ਹੋ ਚੁੱਕੇ ਸਨ। ਗੋਇੰਦਵਾਲ ਵਿਚ ਦੂਰੋਂ ਦੂਰੋਂ ਲੋਕ ਬੱਸ ਉਨ੍ਹਾਂ ਕੋਲ ਬੈਠਣ ਆਉਂਦੇ ਸਨ। ਗੁਰੂ ਅੰਗਦ ਜੀ ਦੇ ਪੁੱਤਰ ਦਾਤੂ ਤੋਂ ਇਹ ਸਹਿਆ ਨਾ ਗਿਆ। ਉਨ੍ਹਾਂ ਨੂੰ ਲੱਗਦਾ ਸੀ ਕਿ ਇਹ ਗੱਦੀ ਉਨ੍ਹਾਂ ਦੀ ਹੋਣੀ ਚਾਹੀਦੀ ਸੀ। ਇਕ ਦਿਨ ਉਹ ਗੁੱਸੇ ਨਾਲ ਭਰੇ ਸੰਗਤ ਵਿਚ ਆਏ, ਤੇ ਬਜ਼ੁਰਗ ਗੁਰੂ ਜੀ ਨੂੰ ਲੱਤ ਮਾਰ ਕੇ ਗੱਦੀ ਤੋਂ ਡੇਗ ਦਿੱਤਾ। ਸਾਰੀ ਸਭਾ ਵਿਚ ਚੁੱਪ ਛਾ ਗਈ। ਗੁਰੂ ਜੀ ਹੌਲੀ ਜਿਹੀ ਉੱਠੇ। ਸਿੱਖ ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਉਨ੍ਹਾਂ ਨੇ ਨਾ ਆਵਾਜ਼ ਉੱਚੀ ਕੀਤੀ, ਨਾ ਮੋੜ ਕੇ ਵਾਰ ਕੀਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਪਿਆਰ ਨਾਲ ਦਾਤੂ ਦਾ ਪੈਰ ਫੜਿਆ, ਤੇ ਕਿਹਾ ਕਿ ਜੇ ਉਨ੍ਹਾਂ ਦੀਆਂ ਸਖ਼ਤ ਬੁੱਢੀਆਂ ਹੱਡੀਆਂ ਨਾਲ ਪੈਰ ਨੂੰ ਸੱਟ ਲੱਗੀ ਹੋਵੇ ਤਾਂ ਉਨ੍ਹਾਂ ਨੂੰ ਅਫ਼ਸੋਸ ਹੈ। ਉਸੇ ਸ਼ਾਮ ਉਹ ਚੁੱਪ ਚਾਪ ਗੋਇੰਦਵਾਲ ਛੱਡ ਕੇ ਚਲੇ ਗਏ, ਤਾਂ ਜੋ ਕੋਈ ਝਗੜਾ ਨਾ ਹੋਵੇ।", "a": "ਗੁਰੂ ਨਾਨਕ ਸਾਨੂੰ ਸੁਨਿਆਰੇ ਦੀ ਭੱਠੀ ਦੀ ਤਸਵੀਰ ਦਿੰਦੇ ਹਨ। ਸੋਨਾ ਇਕ ਸੱਟ ਨਾਲ ਮੁੰਦਰੀ ਨਹੀਂ ਬਣਦਾ। ਉਸ ਨੂੰ ਤਪਾਇਆ ਜਾਂਦਾ ਹੈ, ਘੜਿਆ ਜਾਂਦਾ ਹੈ, ਠੰਢਾ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਤੇ ਫਿਰ ਘੜਿਆ ਜਾਂਦਾ ਹੈ, ਅਜਿਹੇ ਹੱਥ ਨਾਲ ਜੋ ਕਾਹਲੀ ਨਹੀਂ ਕਰਦਾ। ਇਸੇ ਨੂੰ ਉਹ ਧੀਰਜ ਕਹਿੰਦੇ ਹਨ, ਤੇ ਧੀਰਜ ਨੂੰ ਸੰਦਾਂ ਨਾਲ ਪਾਸੇ ਨਹੀਂ ਰੱਖਦੇ। ਧੀਰਜ ਆਪ ਸੁਨਿਆਰਾ ਹੈ, ਜੋ ਕੰਮ ਕਰ ਰਿਹਾ ਹੈ। ਇਸ ਲਈ ਧੀਰਜ ਕਮਜ਼ੋਰੀ ਨਹੀਂ, ਤੇ ਸਭ ਕੁਝ ਚੁੱਪ ਚਾਪ ਨਿਗਲ ਲੈਣਾ ਵੀ ਨਹੀਂ। ਇਹ ਇਕ ਹੁਨਰ ਹੈ। ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਕੋਲ ਮੋੜ ਕੇ ਵਾਰ ਕਰਨ ਦੀ ਹਰ ਵਜ੍ਹਾ ਸੀ, ਫਿਰ ਵੀ ਉਸ ਸਭਾ ਵਿਚ ਉਨ੍ਹਾਂ ਦੇ ਧੀਰਜ ਨੇ ਘੜਨ ਦਾ ਕੰਮ ਕੀਤਾ। ਸਿਗਮੰਡ ਫ਼ਰਾਇਡ ਤੋਂ ਬਾਅਦ ਆਏ ਚਿੰਤਕਾਂ ਨੇ ਇਕ ਗੱਲ ਵੇਖੀ ਜੋ ਇੱਥੇ ਢੁਕਦੀ ਹੈ। ਗੁੱਸਾ ਅਕਸਰ ਗ਼ਲਤ ਬੰਦੇ ਉੱਤੇ ਨਿਕਲਦਾ ਹੈ। ਦੁਪਹਿਰੇ ਬੌਸ ਝਿੜਕਦਾ ਹੈ, ਤੇ ਰਾਤ ਨੂੰ ਅਸੀਂ ਆਪਣੀ ਭੈਣ ਉੱਤੇ ਵਰ੍ਹ ਪੈਂਦੇ ਹਾਂ। ਧੀਰਜ ਸਾਨੂੰ ਇਹ ਵੇਖਣ ਦਾ ਸਮਾਂ ਦਿੰਦਾ ਹੈ ਕਿ ਤਪਸ਼ ਅਸਲ ਵਿਚ ਕਿੱਥੋਂ ਆ ਰਹੀ ਹੈ।", "b": "ਠਹਿਰਨ ਨਾਲ ਫ਼ਾਇਦਾ ਕਿਉਂ ਹੁੰਦਾ ਹੈ? ਗੁੱਸਾ ਆਪਣੇ ਪਹਿਲੇ ਕੁਝ ਪਲਾਂ ਵਿਚ ਸਭ ਤੋਂ ਤੇਜ਼ ਹੁੰਦਾ ਹੈ, ਜਿਵੇਂ ਉਬਲ ਕੇ ਡੁੱਲ੍ਹਦਾ ਦੁੱਧ। ਜੇ ਤੁਸੀਂ ਇਕ ਪਲ ਲਈ ਭਾਂਡਾ ਅੱਗ ਤੋਂ ਲਾਹ ਲਓ, ਤਾਂ ਦੁੱਧ ਬਹਿ ਜਾਂਦਾ ਹੈ, ਤੇ ਕੁਝ ਨਹੀਂ ਵਿਗੜਦਾ। ਇਉਂ ਹੀ ਦਸ ਪਲਾਂ ਦਾ ਠਹਿਰਾਅ ਇਹ ਨਹੀਂ ਕਹਿੰਦਾ ਕਿ ਤੁਸੀਂ ਨਾਰਾਜ਼ ਨਹੀਂ। ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਹੁਣ ਸ਼ਬਦ ਤੁਸੀਂ ਚੁਣ ਰਹੇ ਹੋ, ਗੁੱਸਾ ਨਹੀਂ ਚੁਣ ਰਿਹਾ। ਤੁਸੀਂ ਫਿਰ ਵੀ ਸਖ਼ਤ ਗੱਲ ਕਹਿ ਸਕਦੇ ਹੋ। ਫਿਰ ਵੀ ਆਪਣੀ ਗੱਲ ਉੱਤੇ ਡਟੇ ਰਹਿ ਸਕਦੇ ਹੋ। ਬੱਸ ਕੱਲ੍ਹ ਸਵੇਰੇ ਇਹ ਨਹੀਂ ਸੋਚਣਾ ਪਵੇਗਾ ਕਿ ਕਾਸ਼ ਮੈਂ ਹੋਰ ਤਰ੍ਹਾਂ ਕਿਹਾ ਹੁੰਦਾ। ਜੋ ਲੋਕ ਇਹ ਸਿੱਖ ਲੈਂਦੇ ਹਨ, ਉਹ ਪਰਿਵਾਰ ਜਾਂ ਦਫ਼ਤਰ ਦੇ ਸ਼ਾਂਤ ਲੋਕ ਬਣ ਜਾਂਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਉੱਤੇ ਔਖੇ ਵੇਲੇ ਸਾਰੇ ਭਰੋਸਾ ਕਰਦੇ ਹਨ। ਉਹ ਭਰੋਸਾ ਇਕ ਇਕ ਰੁਕੇ ਹੋਏ ਜਵਾਬ ਨਾਲ ਬਣਦਾ ਹੈ।", "t": "ਅਗਲੀ ਵਾਰ ਕੁਝ ਚੁੱਭੇ, ਤਾਂ ਜਵਾਬ ਦੇਣ ਤੋਂ ਪਹਿਲਾਂ ਦਸ ਮਿੰਟ ਰੁਕੋ। ਬੱਸ ਦਸ।", "q": "ਮੀਟਿੰਗ ਵਿੱਚ ਮੈਨੇਜਰ ਪੂਰੀ ਟੀਮ ਦੇ ਸਾਹਮਣੇ ਤੁਹਾਨੂੰ ਤਿੱਖੇ ਢੰਗ ਨਾਲ ਗ਼ਲਤ ਠਹਿਰਾਉਂਦਾ ਹੈ। ਅਸਲ ਵਿੱਚ ਤੁਸੀਂ ਸਹੀ ਸੀ। ਸਭ ਤੋਂ ਮਜ਼ਬੂਤ ਕਦਮ ਕੀ ਹੈ?", "o": ["ਉੱਥੇ ਹੀ ਨਿਮਰਤਾ ਪਰ ਦ੍ਰਿੜ੍ਹਤਾ ਨਾਲ ਉਸ ਨੂੰ ਸੁਧਾਰ ਦੇਣਾ, ਤਾਂ ਜੋ ਸਭ ਨੂੰ ਪਤਾ ਲੱਗੇ", "ਕਦੇ ਕੁਝ ਨਾ ਕਹਿਣਾ, ਅਤੇ ਮਨ ਹੀ ਮਨ ਉਸ ਦੀ ਇੱਜ਼ਤ ਗੁਆ ਦੇਣਾ", "ਹੁਣ ਸ਼ਾਂਤ ਰਹਿਣਾ, ਫਿਰ ਬਾਅਦ ਵਿੱਚ ਇਕੱਲਿਆਂ ਤੱਥਾਂ ਨਾਲ ਮਿਲਣਾ"], "y": "ਹਾਂ। ਸਭ ਦੇ ਸਾਹਮਣੇ ਉਸ ਦੀ ਹਉਮੈ ਆਪਣਾ ਬਚਾਅ ਕਰ ਰਹੀ ਹੁੰਦੀ ਹੈ, ਉਹ ਸੁਣ ਨਹੀਂ ਸਕਦਾ। ਇਕੱਲਿਆਂ, ਤੱਥਾਂ ਅਤੇ ਸ਼ਾਂਤ ਆਵਾਜ਼ ਨਾਲ, ਉਹ ਸੁਣ ਸਕਦਾ ਹੈ। ਤੁਹਾਡੀ ਇੱਜ਼ਤ ਵੀ ਬਚੀ ਅਤੇ ਗੱਲ ਵੀ।", "n": "ਸਮਝ ਆਉਂਦਾ ਹੈ, ਪਰ ਸੋਚੋ। ਸਭ ਦੇ ਸਾਹਮਣੇ ਬਹਿਸ ਨਾਲ ਉਹ ਤੱਥਾਂ ਦਾ ਨਹੀਂ, ਆਪਣੀ ਛਵੀ ਦਾ ਬਚਾਅ ਕਰੇਗਾ, ਅਤੇ ਚੁੱਪ ਤੁਹਾਡੇ ਅੰਦਰ ਨਾਰਾਜ਼ਗੀ ਵਧਾਏਗੀ। ਤੱਥਾਂ ਨਾਲ ਸ਼ਾਂਤ, ਇਕੱਲਿਆਂ ਗੱਲ, ਦੋਹਾਂ ਨੂੰ ਬਚਾਉਂਦੀ ਹੈ।", "d": "ਜਦੋਂ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਦੇ ਪੁੱਤਰ ਦਾਤੂ ਨੇ ਬਜ਼ੁਰਗ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਲੱਤ ਮਾਰ ਕੇ ਗੱਦੀ ਤੋਂ ਡੇਗ ਦਿੱਤਾ, ਤਾਂ ਗੁਰੂ ਜੀ ਨੇ ਮੋੜਵਾਂ ਵਾਰ ਨਹੀਂ ਕੀਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਦਾਤੂ ਦਾ ਪੈਰ ਫੜਿਆ ਅਤੇ ਪੁੱਛਿਆ, ਕਿਤੇ ਮੇਰੀਆਂ ਬੁੱਢੀਆਂ ਹੱਡੀਆਂ ਨਾਲ ਤੁਹਾਡੇ ਪੈਰ ਨੂੰ ਸੱਟ ਤਾਂ ਨਹੀਂ ਲੱਗੀ? ਇਹ ਅਸਰ ਕਿਉਂ ਕਰਦਾ ਹੈ? ਗੁੱਸਾ ਅੱਗ ਹੈ, ਅਤੇ ਹਰ ਜਵਾਬ ਉਸ ਵਿੱਚ ਬਾਲਣ। ਤਿੱਖਾ ਜਵਾਬ ਤਾਕਤ ਵਰਗਾ ਲੱਗਦਾ ਹੈ, ਪਰ ਅਸਲ ਵਿੱਚ ਉਹ ਤੁਹਾਡੇ ਅਗਲੇ ਦਸ ਮਿੰਟਾਂ ਦਾ ਕਾਬੂ ਸਾਹਮਣੇ ਵਾਲੇ ਨੂੰ ਦੇ ਦਿੰਦਾ ਹੈ। ਮਨੋਵਿਗਿਆਨੀਆਂ ਨੇ ਪਾਇਆ ਕਿ ਗੁੱਸਾ ਕੱਢਣਾ, ਜਿਵੇਂ ਉਸ ਇਨਸਾਨ ਨੂੰ ਸੋਚਦਿਆਂ ਸਿਰਹਾਣੇ ਉੱਤੇ ਮੁੱਕੇ ਮਾਰਨਾ, ਲੋਕਾਂ ਨੂੰ ਹੋਰ ਹਮਲਾਵਰ ਬਣਾਉਂਦਾ ਹੈ (ਬੁਸ਼ਮੈਨ, 2002)। ਗੁੱਸਾ ਠੰਢਾ ਕਰਦਾ ਹੈ ਠਹਿਰਾਅ, ਅਤੇ ਹਾਲਾਤ ਨੂੰ ਦੂਜੀ ਨਜ਼ਰ ਨਾਲ ਪੜ੍ਹਨਾ: ਸ਼ਾਇਦ ਉਹ ਥੱਕਿਆ ਸੀ, ਮਾੜਾ ਨਹੀਂ। ਇਸੇ ਕਰਕੇ ਜਪੁਜੀ ਸਾਹਿਬ ਧੀਰਜ ਨੂੰ ਸੁਨਿਆਰ ਦੇ ਹੱਥ ਵਿੱਚ ਰੱਖਦਾ ਹੈ। ਸੋਨਾ ਸੇਕ ਨਾਲ ਘੜਿਆ ਜਾਂਦਾ ਹੈ, ਪਰ ਕਾਬੂ ਵਾਲੇ ਸੇਕ ਨਾਲ। ਅਸਲ ਮਿਸਾਲ: ਰਾਤ ਨੂੰ ਗੁੱਸੇ ਵਿੱਚ ਲਿਖੀ ਈਮੇਲ ਜੋ ਸਵੇਰੇ ਤੁਸੀਂ ਮਿਟਾ ਦਿੱਤੀ, ਉਸੇ ਦੇ ਨਾ ਭੇਜਣ ਉੱਤੇ ਤੁਸੀਂ ਸਭ ਤੋਂ ਵੱਧ ਖ਼ੁਸ਼ ਹੁੰਦੇ ਹੋ।"}, "ego1": {"ti": "ਇਹ ਅਸਲ ਵਿਚ ਕਿਸ ਨੇ ਕੀਤਾ?", "s": "ਤੁਹਾਨੂੰ ਤਰੱਕੀ ਮਿਲਦੀ ਹੈ। ਘਰ ਮੁੜਦਿਆਂ ਤੁਸੀਂ ਆਪਣੇ ਆਪ ਨੂੰ ਕਹਿੰਦੇ ਹੋ, ਇਹ ਮੈਂ ਕੀਤਾ। ਸਿਰਫ਼ ਮੈਂ। ਫਿਰ ਯਾਦ ਆਉਂਦਾ ਹੈ ਉਹ ਅਧਿਆਪਕ ਜੋ ਦੇਰ ਤਕ ਰੁਕਦਾ ਸੀ, ਉਹ ਦੋਸਤ ਜਿਸ ਨੇ ਨੌਕਰੀ ਦੀ ਖ਼ਬਰ ਭੇਜੀ ਸੀ, ਤੇ ਮਾਂ, ਜਿਸ ਨੇ ਪੰਦਰਾਂ ਸਾਲ ਰੋਟੀ ਬੰਨ੍ਹ ਕੇ ਦਿੱਤੀ।", "m": "ਹਰ ਕੋਈ ਹੁਕਮ ਦੇ ਅੰਦਰ ਹੈ, ਉਸ ਤੋਂ ਬਾਹਰ ਕੋਈ ਨਹੀਂ। ਜੋ ਇਹ ਗੱਲ ਸਮਝ ਲੈਂਦਾ ਹੈ, ਉਹ ਮੈਂ, ਮੈਂ ਕਹਿਣਾ ਛੱਡ ਦਿੰਦਾ ਹੈ।", "k": "ਇਕ ਵਾਰ ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਅਕਬਰ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਮਿਲਣ ਗੋਇੰਦਵਾਲ ਆਇਆ। ਉਹ ਦੇਸ਼ ਦਾ ਸਭ ਤੋਂ ਤਾਕਤਵਰ ਬੰਦਾ ਸੀ, ਵੱਡੀ ਸ਼ਾਨ ਨਾਲ ਸਵਾਗਤ ਦਾ ਆਦੀ। ਪਰ ਗੁਰੂ ਜੀ ਦੇ ਦਰ ਉੱਤੇ ਇਕ ਸਿੱਧਾ ਨਿਯਮ ਸੀ: ਪਹਿਲਾਂ ਪੰਗਤ, ਫਿਰ ਸੰਗਤ। ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਤੋਂ ਪਹਿਲਾਂ ਹਰ ਕੋਈ ਧਰਤੀ ਉੱਤੇ ਇਕ ਕਤਾਰ ਵਿਚ ਬੈਠ ਕੇ ਲੰਗਰ ਦਾ ਇਕੋ ਜਿਹਾ ਭੋਜਨ ਛਕਦਾ ਸੀ। ਅਮੀਰ ਤੇ ਗ਼ਰੀਬ, ਹਿੰਦੂ ਤੇ ਮੁਸਲਮਾਨ, ਮੋਢੇ ਨਾਲ ਮੋਢਾ ਜੋੜ ਕੇ। ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਬਾਦਸ਼ਾਹ ਨੇ ਵੀ ਇਹੀ ਕੀਤਾ। ਉਹ ਕਿਸਾਨਾਂ ਤੇ ਮੁਸਾਫ਼ਰਾਂ ਵਿਚਕਾਰ ਬੈਠਾ, ਤੇ ਉਹੀ ਸਾਦਾ ਭੋਜਨ ਛਕਿਆ। ਉਸ ਤੋਂ ਬਾਅਦ ਹੀ ਉਹ ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਗਿਆ।", "a": "ਇੱਥੇ ਦੋ ਸ਼ਬਦ ਜ਼ਰੂਰੀ ਹਨ। ਹੁਕਮ ਉਹ ਵੱਡਾ ਨਿਜ਼ਾਮ ਹੈ ਜਿਸ ਦਾ ਹਰ ਚੀਜ਼ ਹਿੱਸਾ ਹੈ, ਜਿਵੇਂ ਪੂਰੇ ਸਮੁੰਦਰ ਵਿਚ ਇਕ ਲਹਿਰ। ਹਉਮੈ ਉਹ ਆਦਤ ਹੈ ਜੋ ਕਹਿੰਦੀ ਹੈ, ਮੈਂ ਕੀਤਾ, ਇਹ ਮੇਰਾ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਦੋਹਾਂ ਨੂੰ ਜੋੜਦੇ ਹਨ। ਸਮੁੰਦਰ ਜਿੰਨਾ ਸਾਫ਼ ਦਿਸਦਾ ਹੈ, ਲਹਿਰ ਓਨਾ ਘੱਟ ਆਕੜਦੀ ਹੈ। ਲੰਗਰ ਦੀ ਧਰਤੀ ਉੱਤੇ ਬੈਠਾ ਅਕਬਰ ਇਸੇ ਗੱਲ ਦੀ ਜਿਊਂਦੀ ਜਾਗਦੀ ਤਸਵੀਰ ਹੈ। ਉਸ ਧਰਤੀ ਉੱਤੇ ਇਕ ਬਾਦਸ਼ਾਹ ਵੀ ਬੱਸ ਇਕ ਹੋਰ ਭੁੱਖਾ ਬੰਦਾ ਸੀ, ਕਿਉਂਕਿ ਉੱਥੇ ਹਰ ਕੋਈ ਇਕੋ ਨਿਜ਼ਾਮ ਦਾ ਹਿੱਸਾ ਸੀ। ਭਾਰਤ ਦਾ ਇਕ ਪੁਰਾਣਾ ਗ੍ਰੰਥ, ਅਸ਼ਟਾਵਕਰ ਗੀਤਾ, ਇਸੇ ਆਦਤ ਦੀ ਇਕ ਤਿੱਖੀ ਤਸਵੀਰ ਦਿੰਦਾ ਹੈ। ਉਹ ਕਹਿੰਦਾ ਹੈ ਕਿ ਮੈਂ ਕਰਨ ਵਾਲਾ ਹਾਂ, ਇਹ ਸੋਚ ਸੱਪ ਦੇ ਡੰਗ ਵਰਗੀ ਹੈ। ਇਸ ਦਾ ਜ਼ਹਿਰ ਸਾਨੂੰ ਚੰਗੇ ਵੇਲੇ ਹੰਕਾਰੀ ਬਣਾ ਦਿੰਦਾ ਹੈ, ਤੇ ਮਾੜੇ ਵੇਲੇ ਤੋੜ ਦਿੰਦਾ ਹੈ।", "b": "ਇਸ ਦਾ ਮਤਲਬ ਇਹ ਨਹੀਂ ਕਿ ਤੁਹਾਡੀ ਮਿਹਨਤ ਕੁਝ ਨਹੀਂ ਸੀ। ਤੁਸੀਂ ਮਿਹਨਤ ਕੀਤੀ, ਤੇ ਉਹ ਸੱਚ ਹੈ। ਮਤਲਬ ਇਹ ਹੈ ਕਿ ਤੁਹਾਡੀ ਮਿਹਨਤ ਇਕ ਵੱਡੀ ਕਹਾਣੀ ਦਾ ਇਕ ਹਿੱਸਾ ਸੀ। ਟਰਾਫ਼ੀ ਚੁੱਕਦੇ ਕ੍ਰਿਕਟ ਕਪਤਾਨ ਨੂੰ ਵੇਖੋ। ਚੰਗੇ ਕਪਤਾਨ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਟੀਮ, ਕੋਚ ਤੇ ਮੈਦਾਨ ਦੇ ਕਾਮਿਆਂ ਦਾ ਨਾਂ ਲੈਂਦੇ ਹਨ। ਉਹ ਜਾਣਦੇ ਹਨ ਕਿ ਉਸ ਟਰਾਫ਼ੀ ਉੱਤੇ ਬਹੁਤ ਸਾਰੇ ਹੱਥ ਹਨ। ਜੋ ਲੋਕ ਜੀਵਨ ਨੂੰ ਇਉਂ ਵੇਖਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਨਾਲ ਕੰਮ ਕਰਨਾ ਸੌਖਾ ਹੁੰਦਾ ਹੈ। ਉਹ ਵੱਧ ਧੰਨਵਾਦ ਕਰਦੇ ਹਨ, ਤੇ ਲੋਕ ਫਿਰ ਉਨ੍ਹਾਂ ਦੀ ਮਦਦ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹਨ। ਤੇ ਜਦੋਂ ਕੋਈ ਯੋਜਨਾ ਵਿਗੜਦੀ ਹੈ ਤਾਂ ਉਹ ਟੁੱਟਦੇ ਨਹੀਂ, ਕਿਉਂਕਿ ਉਨ੍ਹਾਂ ਨੇ ਕਦੇ ਮੰਨਿਆ ਹੀ ਨਹੀਂ ਸੀ ਕਿ ਸਭ ਕੁਝ ਉਨ੍ਹਾਂ ਦੇ ਆਪਣੇ ਹੱਥ ਵਿਚ ਹੈ। ਸ਼ੁਕਰਾਨਾ ਤੇ ਨਿਮਰਤਾ ਅਸਲ ਵਿਚ ਇਕੋ ਚੀਜ਼ ਹਨ, ਬੱਸ ਦੋ ਪਾਸਿਆਂ ਤੋਂ ਵੇਖੀ ਹੋਈ।", "t": "ਅੱਜ ਰਾਤ ਇਸ ਸਾਲ ਦੀ ਆਪਣੀ ਸਭ ਤੋਂ ਚੰਗੀ ਪ੍ਰਾਪਤੀ ਵਿੱਚ ਮਦਦ ਕਰਨ ਵਾਲੇ ਤਿੰਨ ਲੋਕਾਂ ਦੇ ਨਾਮ ਲਓ। ਇੱਕ ਦਾ ਧੰਨਵਾਦ ਕਰੋ।", "q": "ਤੁਹਾਡੇ ਆਈਡੀਆ ਨੇ ਪ੍ਰੋਜੈਕਟ ਬਚਾਇਆ। ਰਿਵਿਊ ਮੀਟਿੰਗ ਵਿੱਚ ਮੈਨੇਜਰ ਟੀਮ ਲੀਡ ਦੀ ਤਾਰੀਫ਼ ਕਰਦਾ ਹੈ, ਜਿਸ ਨੇ ਮਸਾਂ ਮਦਦ ਕੀਤੀ। ਤੁਸੀਂ ਕੀ ਕਹੋਗੇ?", "o": ["ਟੀਮ ਦਾ ਧੰਨਵਾਦ ਕਰਨਾ, ਫਿਰ ਸ਼ਾਂਤੀ ਨਾਲ ਅੰਕੜਿਆਂ ਸਮੇਤ ਦੱਸਣਾ ਕਿ ਤੁਹਾਡੇ ਆਈਡੀਆ ਨਾਲ ਕੀ ਬਦਲਿਆ", "ਚੁੱਪ ਰਹਿਣਾ; ਨਿਮਰ ਬੰਦੇ ਨੂੰ ਸਿਹਰੇ ਨਾਲ ਕੀ", "ਬਾਅਦ ਵਿੱਚ ਮੈਨੇਜਰ ਨੂੰ ਮੈਸੇਜ ਕਰਕੇ ਸ਼ਿਕਾਇਤ ਕਰਨਾ ਕਿ ਲੀਡ ਨੇ ਸਿਹਰਾ ਚੁਰਾ ਲਿਆ"], "y": "ਸਹੀ। ਨਿਮਰਤਾ ਦਾ ਮਤਲਬ ਸੱਚ ਲੁਕਾਉਣਾ ਨਹੀਂ। ਤੁਸੀਂ ਟੀਮ ਦਾ ਮਾਣ ਰੱਖਿਆ ਅਤੇ ਕਿਸੇ ਉੱਤੇ ਹਮਲਾ ਕੀਤੇ ਬਿਨਾਂ ਤੱਥ ਦੱਸੇ। ਇਹੀ ਹਉਮੈ-ਰਹਿਤ ਅਤੇ ਇਮਾਨਦਾਰ ਦੋਵੇਂ ਹੈ।", "n": "ਨੇੜੇ ਹੋ, ਪਰ ਫ਼ਰਕ ਵੇਖੋ। ਨਿਮਰਤਾ ਤੱਥ ਮਿਟਾਉਣਾ ਨਹੀਂ, ਅਤੇ ਸ਼ਿਕਾਇਤ ਨਾਲ ਗੱਲ ਕੰਮ ਦੀ ਨਹੀਂ, ਲੀਡ ਦੀ ਹੋ ਜਾਂਦੀ ਹੈ। ਟੀਮ ਦਾ ਧੰਨਵਾਦ ਕਰੋ, ਫਿਰ ਸ਼ਾਂਤੀ ਨਾਲ ਅੰਕੜੇ ਦੱਸੋ।", "d": "ਬਾਦਸ਼ਾਹ ਅਕਬਰ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਮਿਲਣ ਆਇਆ। ਪਹਿਲਾਂ ਉਸ ਨੂੰ ਲੰਗਰ ਵਿੱਚ ਕਿਸਾਨਾਂ ਨਾਲ ਇੱਕ ਪੰਗਤ ਵਿੱਚ ਜ਼ਮੀਨ ਉੱਤੇ ਬੈਠ ਕੇ ਉਹੀ ਭੋਜਨ ਛਕਣਾ ਪਿਆ। ਦੇਸ਼ ਦਾ ਸਭ ਤੋਂ ਤਾਕਤਵਰ ਬੰਦਾ, ਇੱਕ ਭੋਜਨ ਵਿੱਚ ਸਭ ਦੇ ਬਰਾਬਰ। ਹਉਮੈ ਸਾਨੂੰ ਅੰਨ੍ਹਾ ਕਿਉਂ ਕਰਦੀ ਹੈ? ਮਨ ਚੁੱਪ-ਚਾਪ ਕਾਮਯਾਬੀ ਦਾ ਸਿਹਰਾ ਆਪਣੇ ਸਿਰ ਲੈ ਲੈਂਦਾ ਹੈ ਅਤੇ ਨਾਕਾਮੀ ਦਾ ਦੋਸ਼ ਕਿਸਮਤ ਨੂੰ ਦਿੰਦਾ ਹੈ। ਮਨੋਵਿਗਿਆਨੀ ਇਸ ਨੂੰ ਸੈਲਫ਼-ਸਰਵਿੰਗ ਬਾਇਸ ਕਹਿੰਦੇ ਹਨ। ਇਹ ਸਾਡੀ ਛਵੀ ਬਚਾਉਂਦਾ ਹੈ, ਪਰ ਹਰ ਨਤੀਜੇ ਪਿੱਛੇ ਦੇ ਕਈ ਹੱਥਾਂ ਨੂੰ ਲੁਕਾ ਦਿੰਦਾ ਹੈ। ਜਪੁਜੀ ਸਾਹਿਬ ਕਹਿੰਦਾ ਹੈ ਕਿ ਸਭ ਕੁਝ ਹੁਕਮ, ਯਾਨੀ ਇੱਕ ਵੱਡੇ ਵਿਧਾਨ, ਦੇ ਅੰਦਰ ਹੁੰਦਾ ਹੈ। ਇਸ ਨਾਲ ਤੁਹਾਡੀ ਮਿਹਨਤ ਛੋਟੀ ਨਹੀਂ ਹੁੰਦੀ। ਤੁਸੀਂ ਸ਼ੁਕਰਗੁਜ਼ਾਰ ਬਣਦੇ ਹੋ, ਅਤੇ ਸ਼ੁਕਰਾਨਾ ਹੰਕਾਰ ਨਾਲੋਂ ਕਿਤੇ ਹਲਕਾ ਭਾਰ ਹੈ। ਅਸਲ ਮਿਸਾਲ: ਜੋ ਕਪਤਾਨ ਟਰਾਫ਼ੀ ਚੁੱਕ ਕੇ ਪਹਿਲਾਂ ਗੇਂਦਬਾਜ਼ਾਂ ਵੱਲ ਇਸ਼ਾਰਾ ਕਰਦਾ ਹੈ, ਉਸ ਨੂੰ ਸਾਲਾਂ ਇੱਜ਼ਤ ਮਿਲਦੀ ਹੈ। ਜੋ ਕਹੇ ਮੈਂ ਜਿਤਾਇਆ, ਉਹ ਡਰੈਸਿੰਗ ਰੂਮ ਗੁਆ ਦਿੰਦਾ ਹੈ।"}, "comp1": {"ti": "ਉੱਚਾ, ਨੀਵਾਂ", "s": "ਤੁਸੀਂ ਫ਼ੋਨ ਖੋਲ੍ਹਦੇ ਹੋ। ਇਕ ਜਮਾਤੀ ਨੇ ਨਵੀਂ ਗੱਡੀ ਲਈ ਹੈ। ਇਕ ਰਿਸ਼ਤੇਦਾਰ ਕੈਨੇਡਾ ਚਲਾ ਗਿਆ ਹੈ। ਦਸ ਪਲਾਂ ਵਿਚ ਇਕ ਚੰਗਾ ਭਲਾ ਦਿਨ ਨਾਕਾਮ ਜ਼ਿੰਦਗੀ ਵਰਗਾ ਲੱਗਣ ਲੱਗ ਪੈਂਦਾ ਹੈ।", "m": "ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਨਾ ਕੋਈ ਉੱਚਾ ਹੈ, ਨਾ ਕੋਈ ਨੀਵਾਂ।", "k": "ਸੈਦਪੁਰ ਨਗਰ ਵਿਚ ਭਾਈ ਲਾਲੋ ਰਹਿੰਦੇ ਸਨ, ਇਕ ਤਰਖਾਣ ਜੋ ਆਪਣੇ ਹੱਥਾਂ ਦੀ ਕਿਰਤ ਨਾਲ ਰੋਟੀ ਕਮਾਉਂਦੇ ਸਨ। ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਉਸ ਨਗਰ ਵਿਚ ਆਏ, ਤਾਂ ਉਨ੍ਹਾਂ ਨੇ ਲਾਲੋ ਦੇ ਛੋਟੇ ਜਿਹੇ ਘਰ ਵਿਚ ਰਹਿਣਾ ਚੁਣਿਆ। ਨੇੜੇ ਹੀ ਮਲਿਕ ਭਾਗੋ ਰਹਿੰਦਾ ਸੀ, ਇਕ ਅਮੀਰ ਅਫ਼ਸਰ, ਜਿਸ ਨੇ ਵੱਡਾ ਭੋਜ ਰੱਖਿਆ ਤੇ ਆਲੇ ਦੁਆਲੇ ਦੇ ਸਾਰੇ ਸੰਤਾਂ ਨੂੰ ਸੱਦਿਆ। ਗੁਰੂ ਨਾਨਕ ਨਹੀਂ ਗਏ। ਨਾਰਾਜ਼ ਹੋ ਕੇ ਮਲਿਕ ਭਾਗੋ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸੱਦਵਾਇਆ ਤੇ ਪੁੱਛਿਆ ਕਿ ਉਹ ਏਨੇ ਵਧੀਆ ਖਾ
