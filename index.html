िसी एक चिंता के बारे में सोचिए। दो सूचियाँ बनाइए। मेरे हाथ में, और मेरे हाथ में नहीं। पहली सूची से एक छोटा काम आज कर लीजिए।", "q": "आज आपकी बहन की शादी है, और तेज़ बारिश से बाग़ वाली जगह में पानी भर गया है। सब घबरा रहे हैं। आप क्या करेंगे?", "o": ["मौसम की शिकायत करते रहेंगे", "सामान अंदर ले जाने में मदद करेंगे और सबका मन हल्का करेंगे", "जगह चुनने वाले पर दोष डालेंगे"], "y": "बहुत बढ़िया। आपने बारिश को छोड़ दिया, जो किसी के हाथ में थी ही नहीं, और अपनी पूरी ताक़त उसमें लगाई जो हाथ में था। हुकम के साथ चलना ठीक ऐसा ही दिखता है।", "n": "यह बिलकुल समझ में आता है। जब कुछ ज़रूरी बिगड़ता है, तो हम किसी पर दोष डालना चाहते हैं। पर बारिश कुछ नहीं सुनेगी। अपनी ताक़त वहाँ लगाकर देखिए जहाँ वह काम आए: सामान अंदर ले जाइए, दूसरों को मुस्कुराने में मदद कीजिए। दिन अब भी ख़ूबसूरत हो सकता है।"}, "content1": {"ti": "कितना काफ़ी है?", "s": "आप नया फ़ोन ख़रीदते हैं। एक हफ़्ता बहुत अच्छा लगता है। फिर उससे नया मॉडल आ जाता है, और हाथ का फ़ोन अचानक पुराना लगने लगता है।", "m": "संतोष को अपने कुंडल बनाओ, ईमानदार मेहनत को अपना कटोरा और झोली, और ध्यान को अपनी भभूत।", "k": "लाहौर में दुनी चंद रहते थे, बहुत बड़ी दौलत वाले इंसान। उन्होंने गुरु नानक को बड़े आदर से अपने घर बुलाया। जाते समय गुरु जी ने उन्हें एक छोटी सी सुई दी और एक काम कहा। इसे मेरे लिए सँभालकर रखना, और अगले लोक में मुझे लौटा देना। दुनी चंद ने गर्व से हाँ कह दी और सुई अपनी पत्नी के पास ले गए। पत्नी ने उनकी ओर देखा और एक सीधा सा सवाल पूछा। मरने के बाद आप एक सुई भी साथ कैसे ले जाएँगे? दुनी चंद चुप हो गए। अगर वे एक सुई भी नहीं ले जा सकते, तो बाक़ी सब कुछ का क्या? वे गुरु जी के पास लौटे, और ध्यान से सुना।", "a": "गुरु नानक योगियों से बात कर रहे हैं, जो अपने रास्ते की निशानी के तौर पर ख़ास कुंडल पहनते थे और कटोरा रखते थे। वे कहते हैं कि असली निशानियाँ इंसान के भीतर होती हैं। पहली जो वे गिनाते हैं, वह है संतोख, यानी संतोष। जो है उसमें शांति, और साथ में ईमानदार मेहनत। साखी की सुई छोटी सी है, लगभग मज़ेदार, और यही उसकी ताक़त है। एक छोटी सी चीज़ से वह दिखा देती है कि हम किसी चीज़ को हमेशा पकड़कर नहीं रख सकते। दुनी चंद को अपना घर छोड़ने की ज़रूरत नहीं थी। उन्हें यह मानना छोड़ना था कि उनका घर ही वे हैं। संतोष यही बदलाव है: चीज़ों के मालिक बनने से, उन्हें अच्छे से इस्तेमाल करने और बाँटने तक।", "b": "मनोवैज्ञानिक इस मुश्किल को ट्रेडमिल की तस्वीर से समझाते हैं। हम तेज़ दौड़ते हैं और ज़्यादा कमाते हैं, पर हर नई चीज़ की बहुत जल्दी आदत पड़ जाती है, इसलिए ख़ुशी वहीं की वहीं रहती है। नया फ़ोन एक हफ़्ता बहुत अच्छा लगता है। बड़ी तनख़्वाह एक महीना ख़ास लगती है। फिर मंज़िल फिर से आगे खिसक जाती है। संतोष का मतलब बढ़ना छोड़ देना नहीं है। आप बेहतर नौकरी या बड़ा घर चाह सकते हैं। फ़र्क़ इसमें है कि बढ़ते समय आप कहाँ खड़े हैं। मेरे पास काफ़ी है, और मैं आगे बना रहा हूँ, यहाँ से। जब तक वह नहीं मिलता मैं कुछ नहीं, यहाँ से नहीं। पहली जगह से जीवन एक सफ़र लगता है। दूसरी से, एक ऐसी दौड़ जिसमें आप हमेशा हार रहे हैं।", "t": "अगली चीज़ ख़रीदने से पहले एक दिन रुकिए। आज रात अपनी तीन ऐसी चीज़ें गिनिए जिनका आप कभी सपना देखते थे।", "q": "आपका फ़ोन ठीक चल रहा है, पर बेहतर कैमरे वाला नया मॉडल आया है। आपके सब दोस्त ले रहे हैं। आप क्या करेंगे?", "o": ["आज ही ईएमआई पर ख़रीद लेंगे", "एक महीना रुकेंगे और देखेंगे कि तब भी चाहिए या नहीं", "बुरा महसूस करेंगे कि आप नहीं ले सकते"], "y": "बहुत समझदारी। एक महीना रुकने से उत्साह बैठ जाता है, और आप देख पाते हैं कि यह असली ज़रूरत थी या बस ट्रेडमिल। अक्सर इच्छा ख़ुद ही चली जाती है, और पता चलता है कि आपके पास पहले से काफ़ी था।", "n": "यह बहुत असली एहसास है। नई चीज़ें इस तरह दिखाई जाती हैं कि मन न माने, और जब दोस्तों के पास हों तो और मुश्किल होता है। फ़ैसले से पहले एक महीना रुककर देखिए। अगर तब भी ज़रूरत हो, तो साफ़ मन से ख़रीदिए। अगर नहीं, तो आप अभी अभी ट्रेडमिल से उतर गए।"}, "listen1": {"ti": "पहले सुनिए", "s": "आपकी सहेली अपने बुरे दिन की बात शुरू करती है। उसके पूरा करने से पहले आप कह देते हैं, पता है तुम्हें क्या करना चाहिए? वह चुप हो जाती है। उसे सुनने वाला चाहिए था, उसे भाषण मिल गया।", "m": "सच्चे मन से सुनने से दुख और पाप मिट जाते हैं।", "k": "दूसरे गुरु बनने से बहुत पहले भाई लहणा खडूर में रहते थे। एक सुबह तड़के उन्होंने अपने पड़ोसी भाई जोधा को कुछ ऐसी पंक्तियाँ गाते सुना जो उन्होंने पहले कभी नहीं सुनी थीं। वे गुरु नानक के शब्द थे। भाई लहणा रुक गए, सुनते रहे, और वे शब्द उनके मन से गए ही नहीं। उन्होंने पूछा कि ये किसने लिखे हैं। जब पता चला कि ये करतारपुर वाले गुरु नानक के हैं, तो वे उनसे मिलने निकल पड़े, और उनका जीवन फिर कभी पहले जैसा नहीं रहा। यह सब एक साधारण सुबह से शुरू हुआ, और सच्चे मन से सुनने के एक पल से।", "a": "जपुजी साहिब की चार पउड़ियाँ एक ही शब्द से शुरू होती हैं: सुणिऐ, यानी सुनना। गुरु नानक पूरे ध्यान से ईश्वर के शब्द को सुनने की बात कर रहे हैं। भाई लहणा की कहानी दिखाती है कि यह कितना ताक़तवर हो सकता है। वे अपने ख़यालों में डूबे आगे निकल सकते थे। पर वे रुके, और जो सुना उसके लिए पूरी तरह खुल गए। रोज़ के जीवन में हम वही गुण, यानी पूरा ध्यान, अपने सामने बैठे लोगों के लिए उधार लेते हैं। ज़्यादातर समय हम सच में सुनते नहीं। हम बस अपनी बारी का इंतज़ार करते हैं। सामने वाला इसे महसूस कर लेता है, जैसे आप महसूस कर लेते हैं जब कोई बात करते हुए बार बार अपना फ़ोन देखता रहे।", "b": "स्टीफ़न कवी अपनी मशहूर किताब, सेवन हैबिट्स, में कहते हैं: पहले दूसरे को समझिए, फिर अपनी बात समझाइए। जो डॉक्टर दर्द पूछे बिना दवा लिख दे, वह अच्छा डॉक्टर नहीं है। दोस्त भी नहीं। जब इंसान को लगता है कि उसे सुना गया, तो उसके अंदर कुछ नरम पड़ जाता है। वह शांत हो जाता है, और अक्सर बोलते बोलते अपना जवाब ख़ुद ढूँढ लेता है। जब उसे लगता है कि उसे परखा जा रहा है या जल्दी की जा रही है, तो वह बचाव करने लगता है। दो मिनट का सच्चा सुनना दो घंटे की बहस बचा सकता है। और इसमें आपके लिए भी एक तोहफ़ा है। जब आप पूरे मन से सुनते हैं, तो वे बातें सीखते हैं जो बोलने में व्यस्त रहकर कभी न सुन पाते।", "t": "आज एक बातचीत में कोई सलाह मत दीजिए। बस पूछिए, फिर क्या हुआ? और, तब कैसा लगा? जब वे पूरा कह लें, तब बोलिए।", "q": "आप काम से थककर घर पहुँचे हैं, और माँ पड़ोसी की किसी परेशानी के बारे में बताने लगती हैं। आप क्या करेंगे?", "o": ["फ़ोन रख देंगे और उनकी पूरी बात सुनेंगे", "जल्दी से बता देंगे कि उन्हें क्या करना चाहिए", "कह देंगे कि अभी बहुत थके हैं"], "y": "यह उनके लिए एक सच्चा तोहफ़ा है। फ़ोन रखने से उन्हें पता चलता है कि वे स्क्रीन से ज़्यादा ज़रूरी हैं। अक्सर उन्हें हल नहीं चाहिए होता, बस किसी अपने का सुनना चाहिए होता है।", "n": "यह सच्चा जवाब है। थकान में जल्दी की सलाह या बात टालना आसान लगता है। पर अक्सर वे बस सुना जाना चाहती हैं। कुछ मिनट के लिए फ़ोन रखकर उनकी पूरी बात सुनकर देखिए। इसमें बहुत कम लगता है, और इसका मतलब बहुत होता है।"}, "habit1": {"ti": "हर सुबह एक छोटी सी चीज़", "s": "पहली जनवरी को आप ख़ुद से वादा करते हैं, रोज़ एक घंटा जिम। बीस जनवरी तक जिम का बैग पलंग के नीचे पड़ा होता है।", "m": "भोर से पहले के शांत समय में सच्चे नाम और उसकी बड़ाई पर विचार करो।", "k": "जब अमरदास जी खडूर में गुरु अंगद जी की सेवा करने आए, तब वे साठ साल पार कर चुके थे। हर दिन, सूरज उगने से पहले के अँधेरे में, वे ब्यास नदी तक जाते, गागर में पानी भरते, और वापस लाते ताकि गुरु जी स्नान कर सकें। वे यह हर सुबह करते रहे, गर्मी की तपन में भी और सर्दी की ठंड में भी, बारह साल तक। परंपरा याद करती है कि एक तूफ़ानी रात वे ठोकर खाकर एक जुलाहे के गड्ढे में गिर गए। वे उठे, गागर उठाई, और पानी लेकर आगे बढ़ गए। सालों बाद यही शांत, वफ़ादार इंसान तीसरे गुरु बने।", "a": "अमृत वेला सूरज उगने से पहले का शांत समय है। गुरु नानक विचार को दिन के एक तय समय से बाँधते हैं। मन ताज़ा होता है, घर शांत होता है, और फ़ोन ने अभी पुकारना शुरू नहीं किया होता। अमरदास जी के बारह साल का पानी तय समय की छिपी ताक़त दिखाता है। उन्हें हर सुबह यह तय नहीं करना पड़ता था कि जाऊँ या नहीं। भोर उनके लिए तय कर देती थी। जेम्स क्लियर अपनी किताब, एटॉमिक हैबिट्स, में यही सलाह आज के शब्दों में देते हैं। ऐसी शुरुआत कीजिए जिसमें बस दो मिनट लगें, और उसे किसी ऐसे काम से जोड़ दीजिए जो आप पहले से करते हैं। दाँत साफ़ करने के बाद, मैं दो मिनट शांत बैठूँगा। इतना छोटा कि मना न कर सकें।", "b": "यह काम क्यों करता है? आपकी नए साल वाली योजना बहुत बड़ी थी, और उसका कोई तय समय नहीं था। हर दिन ख़ुद से बहस करनी पड़ती थी, जाऊँ या आज रहने दूँ? यह रोज़ की बहस शरीर से बहुत पहले मन को थका देती है। तय समय इस बहस को ख़त्म कर देता है। और छोटे क़दम चुपचाप जुड़ते जाते हैं। रोज़ बचाया एक रुपया कुछ नहीं लगता। एक साल में वह अच्छी रक़म बन जाता है। आदत भी ऐसे ही बढ़ती है। पहले उसे नियमित कीजिए, चाहे वह बहुत छोटी हो। बाद में उसे लंबा कर सकते हैं। रोज़ जलने वाला छोटा दीया साल में एक बार जलने वाली बड़ी आग से ज़्यादा रोशनी देता है।", "t": "सुबह के लिए दो मिनट की एक आदत चुनिए। शांत बैठना, एक पंक्ति पढ़ना, या थोड़ा शरीर खींचना। इसे दाँत साफ़ करने से जोड़ दीजिए। कल से शुरू कीजिए।", "q": "आप पढ़ना शुरू करना चाहते हैं, पर कभी समय नहीं मिलता। कौन सी योजना सबसे ज़्यादा चलेगी?", "o": ["हर रविवार एक घंटा पढ़ना", "हर रात सोने से पहले दो पन्ने पढ़ना", "जोश के लिए दस किताबें ख़रीद लेना"], "y": "बिलकुल सही। तय समय पर दो पन्ने इतने छोटे हैं कि कभी छूटेंगे नहीं, और वे उस पल से जुड़ते हैं जो आपके पास पहले से है। एक साल में यह सात सौ से ज़्यादा पन्ने हो जाते हैं।", "n": "बहुत स्वाभाविक योजना है, और हम में से कई ऐसे ही शुरू करते हैं। बड़े लक्ष्य जोश देते हैं, पर जीवन व्यस्त होते ही छूट जाते हैं। हर रात एक ही समय पर दो पन्ने पढ़कर देखिए। यह इतना छोटा है कि आप मना नहीं करेंगे, और आदत असल में ऐसे ही शुरू होती है।"}, "action1": {"ti": "जो बोओगे", "s": "एक दुकानदार रोज़ दूध में थोड़ा सा पानी मिलाता है। किसी को पता नहीं चलता। एक साल बाद उसके आधे ग्राहक चुपचाप अगली दुकान पर जा चुके होते हैं।", "m": "तुम ख़ुद ही बीज बोते हो, और ख़ुद ही उसकी फ़सल खाते हो।", "k": "भाई वीर सिंह भूमिया नाम के एक डाकू की पुरानी कहानी सुनाते हैं, जो चोरी के पैसे से मुसाफ़िरों को मुफ़्त खाना खिलाता था। जब गुरु नानक वहाँ से गुज़रे, तो भूमिया ने उन्हें भोजन के लिए बुलाया। गुरु जी दूसरों के आँसुओं से ख़रीदा खाना नहीं खाते थे, पर उन्होंने भूमिया के सामने एक बात रखी। कुछ छोटे वादे निभाओ: ग़रीब को कभी मत लूटना, हमेशा सच बोलना, और जिस घर का नमक खाया हो उसे कभी धोखा मत देना। भूमिया ने आसान समझकर हाँ कह दी। पर जल्द ही हर छोटा वादा किसी न किसी अपराध के आगे दीवार बनने लगा। और एक रात, वादे निभाते निभाते, उसने पाया कि वह अब चोरी कर ही नहीं सकता। उसका पूरा जीवन बदल गया।", "a": "गुरु नानक किसान की ऐसी तस्वीर देते हैं जो हर कोई समझता है। गेहूँ बोओगे तो गेहूँ मिलेगा। काँटे बोओगे तो काँटे। आपकी फ़सल कोई और तय नहीं करता। भूमिया की कहानी यही सच उम्मीद की तरफ़ से दिखाती है। वह किसी एक बड़े पल में नहीं बदला। वह कुछ छोटे वादों से बदला, जिन्हें वह बार बार निभाता रहा, जब तक उसका पूरा जीवन अलग न हो गया। यह पंक्ति धमकी नहीं है। यह अच्छी ख़बर है, क्योंकि इसका मतलब है कि आप आज से बेहतर बीज बोना शुरू कर सकते हैं, चाहे कल आप जो भी थे। जेम्स क्लियर एटॉमिक हैबिट्स में यही कहते हैं। रोज़ का छोटा सा सुधार एक हफ़्ते में कुछ नहीं दिखता। एक साल में वह बहुत बड़ा बदलाव बन जाता है। और छोटी सी चूक भी।", "b": "अपने एक साधारण दिन को देखिए। चौकीदार से एक मीठा बोल। दोस्त से एक छोटा झूठ। किताब के दस पन्ने। एक घंटा और फ़ोन पर। हर एक बीज है। कल आपको पौधा नहीं दिखेगा, और इसीलिए हम भूल जाते हैं। बचत, सेहत, भरोसा और दोस्ती कभी एक दिन में न बनते हैं, न टूटते हैं। वे बीज बीज करके बढ़ते हैं। आम का पेड़ भी एक हफ़्ते में फल नहीं देता। अगले साल आप जो इंसान होंगे, वह अभी बोया जा रहा है, आज के कामों में, बार बार। यह बात भारी लग सकती है, पर यह आज़ाद भी करती है। इसका मतलब है कि कोई दिन बेकार नहीं, और शुरू करने के लिए कोई दिन देर नहीं।", "t": "इस हफ़्ते रोज़ बोने के लिए एक छोटा बीज चुनिए। एक सच्चा जवाब, पढ़ने का एक पन्ना, या एक प्यार भरा संदेश।", "q": "आप दफ़्तर देर से पहुँचने को छिपाने के लिए छोटे झूठ बोलते रहे हैं। अब आप बदलना चाहते हैं। सबसे अच्छा पहला क़दम क्या है?", "o": ["ख़ुद से वादा करना कि कल से बिलकुल परफ़ेक्ट बनेंगे", "कुछ नहीं करना, क्योंकि अब बहुत देर हो चुकी", "एक छोटा वादा चुनना, जैसे इस हफ़्ते समय पर पहुँचना, और उसे निभाना"], "y": "भूमिया भी ठीक ऐसे ही बदला था। एक छोटा वादा, जो निभाया जाए, एक असली बीज है। अगले हफ़्ते यह आसान हो जाता है, और धीरे धीरे पूरी फ़सल बदल जाती है।", "n": "यह समझ में आने वाली सोच है। जब हमें अपनी ग़लतियाँ दिखती हैं, तो हम या तो एक बड़ी छलाँग चाहते हैं या उम्मीद छोड़ देते हैं। दोनों से ज़्यादा फ़ायदा नहीं होता। इस हफ़्ते निभ सकने वाला एक छोटा वादा चुनकर देखिए। रोज़ निभाए गए छोटे बीज बड़े वादों से ज़्यादा बदलते हैं।"}, "hard1": {"ti": "जब दिन भारी हो", "s": "नतीजा आता है, और अच्छा नहीं है। या नौकरी चली गई। या कोई अपना बीमार है। भले लोग कहते हैं, जो होता है अच्छे के लिए होता है। पता नहीं क्यों, इससे मन हल्का नहीं होता।", "m": "कितने ही लोग दुख, भूख और लगातार मार सहते हैं। हे दाता, ये भी तेरी ही देन हैं।", "k": "लगभग सन पंद्रह सौ इक्कीस में बाबर की सेना ने सैदपुर नगर पर हमला किया। गुरु न े थे, वे चुपचाप खड़े रहे। बाद में नवाब और क़ाज़ी ने पूछा कि वे शामिल क्यों नहीं हुए। जनमसाखियाँ उनका जवाब बताती हैं। नवाब का शरीर तो झुक रहा था, पर उनका मन दूर काबुल में घोड़े ख़रीद रहा था। और क़ाज़ी का मन घर पर था, इस चिंता में कि कहीं उनका नया जन्मा बछेरा कुएँ में न गिर जाए। तो वे किसके साथ नमाज़ पढ़ते? दोनों एक पल चुप रहे, फिर मान गए कि यह सच है।", "a": "उस समय के योगी बाहर की दुनिया जीतने के लिए घर छोड़ देते थे। गुरु नानक भीतर की ओर इशारा करते हैं। अपने मन को जीत लो, तो जग जीत लिया। सुल्तानपुर की साखी दिखाती है कि मन कितनी आसानी से फिसल जाता है। नवाब और क़ाज़ी एक पवित्र काम कर रहे थे, फिर भी उनका मन घोड़ों और बछेरों पर था। हमारा मन रील्स के साथ यही करता है। आपने कल रात दो घंटे गँवाने का फ़ैसला नहीं किया था। मन के किसी हिस्से ने आपके लिए फ़ैसला कर लिया, एक एक स्वाइप करके। हमारी रोज़ की ज़्यादातर लड़ाइयाँ ऐसी ही हैं। वे दुनिया से नहीं, अपने ही ध्यान से हैं। जो मन को राह दिखा सकता है, उसने सबसे कठिन काम कर लिया, और उसके बाद बाहर का सब कुछ आसान हो जाता है।", "b": "डैनियल कानमैन अपनी किताब, थिंकिंग फ़ास्ट एंड स्लो, में मन के काम करने के दो तरीक़े बताते हैं। एक तेज़ और अपने आप चलने वाला है, जैसे स्वाइप करना। दूसरा धीमा और सोच समझकर चलने वाला है, जैसे हिसाब लगाना। बहुत सी ग़लतियाँ इसलिए होती हैं कि तेज़ वाला काम कर जाता है, और धीमा वाला बाद में जागता है। इसलिए आधी रात को, जब आप थके हों, इच्छाशक्ति के भरोसे मत रहिए। माहौल बदल दीजिए। फ़ोन दूसरे कमरे में चार्ज कीजिए, और तकिये के पास एक किताब रखिए। जो हलवाई परहेज़ पर है, वह जलेबियों के पास नहीं बैठता। अच्छे चुनाव को आसान चुनाव बना दीजिए। और जब मन भटके, तो उसे डाँटिए मत। बस ध्यान दीजिए, और प्यार से वापस ले आइए, बार बार। यही अभ्यास है।", "t": "आज रात फ़ोन को बिस्तर से दूर चार्ज कीजिए। ध्यान दीजिए कि पहले दस मिनट कैसे लगते हैं। वह बेचैनी वही मन है जिसे आप राह दिखाना सीख रहे हैं।", "q": "आप परीक्षा की पढ़ाई करने बैठे हैं, और फ़ोन हर कुछ मिनट में बज रहा है। सबसे समझदारी वाला क़दम क्या है?", "o": ["फ़ोन को एक घंटे के लिए दूसरे कमरे में रख देना", "ख़ुद से वादा करना कि उसे नहीं देखेंगे", "हर संदेश का जल्दी से जवाब देना ताकि बंद हो जाए"], "y": "बिलकुल सही। आपने अपने मन से लड़ने के बजाय माहौल बदल दिया। नज़र से दूर तो पहुँच से दूर, और आपका ध्यान वहीं रहता है जहाँ आप चाहते हैं।", "n": "हम में से ज़्यादातर पहले यही करते हैं। पर वादे और जल्दी के जवाब तेज़ मन को ही चलाने देते हैं, और आख़िर में वही जीतता है। फ़ोन को एक घंटे के लिए दूसरे कमरे में रखकर देखिए। ख़ुद से लड़ने से माहौल बदलना कहीं आसान है।"}, "nature1": {"ti": "हवा, पानी, धरती", "s": "आप हर दिन लगभग बीस हज़ार साँसें लेते हैं। आज उनमें से कितनी पर आपका ध्यान गया?", "m": "हवा गुरु है, पानी पिता है, और महान धरती माता है।", "k": "पूरब की यात्रा में गुरु नानक पुरी के जगन्नाथ मंदिर पहुँचे। शाम को पुजारी आरती कर रहे थे, दीयों, फूलों और धूप वाली थाली घुमाते हुए। उन्होंने गुरु जी को भी शामिल होने बुलाया। परंपरा बताती है कि गुरु जी खुले आसमान के नीचे निकल आए, और एक शबद गाया जो आज गुरु ग्रंथ साहिब में है। उसमें पूरा आसमान थाली बन जाता है। सूरज और चाँद उसके दीये हैं, और तारे बिखरे हुए मोती। हवा धूप है, और हर जंगल अपने फूल चढ़ा रहा है। उन्होंने गाया कि सारी सृष्टि पहले से ही आरती कर रही है।", "a": "जपुजी साहिब का अंत प्रकृति को हमारा अपना परिवार कहकर होता है। हवा गुरु है: वह हर साँस के साथ जीवन देती है और कुछ नहीं माँगती। पानी पिता जैसा है। महान धरती माँ की तरह सबको खिलाती है। पुरी में गुरु नानक ने यही सच ब्रह्मांड जितना बड़ा देखा। जब पूरा ब्रह्मांड पहले से आरती गा रहा है, तो एक छोटी आरती क्यों? हम सामान लाने वाले और खाना बनाने वाले को धन्यवाद कहते हैं। हवा, नल के पानी, या उस मिट्टी के बारे में हम शायद ही सोचते हैं जिसमें हमारा अन्न उगा। वे हर पल हमारे लिए काम करते हैं और कभी बिल नहीं भेजते। अगर यह परिवार है, तो इसे परिवार वाली देखभाल मिलनी चाहिए: बर्बाद न करना, गंदा न करना, और कभी कभी बस धन्यवाद कहना।", "b": "यहाँ एक दूसरी देन भी है। जो लोग थोड़ा सा समय भी प्रकृति को देखने में लगाते हैं, वे अक्सर ज़्यादा शांत महसूस करते हैं, और अपनी परेशानियों में कम फँसे रहते हैं। शाम के खुले आसमान के नीचे खड़े होइए, आपकी बड़ी चिंता थोड़ी छोटी लगने लगती है। इसलिए नहीं कि चिंता चली गई, बल्कि इसलिए कि आपको याद आया कि दुनिया कितनी बड़ी है। शोधकर्ता इस एहसास को विस्मय कहते हैं, और उन्होंने पाया है कि यह अपने बारे में मन की लगातार बड़बड़ को शांत कर सकता है। जपुजी साहिब में एक और जगह गुरु नानक सृष्टि को देखकर कहते हैं कि वे इसका बयान शुरू भी नहीं कर सकते। हैरानी मन के लिए एक तरह का आराम है। और यह मुफ़्त है, हर एक शाम।", "t": "आज दो मिनट के लिए फ़ोन के बिना बाहर निकलिए। हवा को महसूस कीजिए और एक पेड़ या आसमान को देखिए। फिर एक देखभाल का काम कीजिए। खुला नल बंद कर दीजिए, या किसी पौधे को पानी दीजिए।", "q": "आपका वीकेंड कामों से भरा है और आप तनाव में हैं। आपके पास बीस मिनट ख़ाली हैं। कौन सा चुनाव आपको सबसे ज़्यादा ताज़ा करेगा?", "o": ["बिस्तर में छोटे वीडियो देखना", "ईमेल का इनबॉक्स साफ़ करना", "बाहर निकलकर पेड़ों और आसमान को देखना"], "y": "बहुत सुंदर। आसमान के साथ बीस मिनट मन को असली आराम देते हैं, जो स्क्रीन नहीं दे सकती। आप हल्के होकर लौटते हैं, और अक्सर यह भी साफ़ हो जाता है कि क्या ज़रूरी है।", "n": "यह बहुत आम चुनाव है, और आराम जैसा लगता है। पर स्क्रीन मन को व्यस्त रखती है, चाहे शरीर रुका हो। बीस मिनट बाहर, पेड़ों और आसमान के साथ बिताकर देखिए। प्रकृति जिस तरह ताज़ा करती है, फ़ोन शायद ही कर पाता है।"}, "purpose1": {"ti": "छोटे झूठों की दीवार", "s": "कोई पूछता है, नई नौकरी कैसी चल रही है। आप कहते हैं, बहुत बढ़िया! आप छह महीने से वहाँ दुखी हैं। यह बात आपने ख़ुद को भी नहीं बताई।", "m": "हम सच्चे कैसे बनें? झूठ की यह दीवार कैसे टूटे?", "k": "जब नानक जी छोटे थे, उनके पिता मेहता कालू ने उन्हें बीस रुपये दिए और मंडी भेजा कि कोई अच्छा सौदा करें: ऐसा सामान ख़रीदें जो मुनाफ़े पर बिक सके। रास्ते में, जनमसाखियाँ बताती हैं, उन्हें ऐसे लोग मिले जो कई दिनों से भूखे थे। कहानियाँ अलग अलग बताती हैं कि वे कौन थे, पर इस पर सब एक हैं कि नानक जी ने क्या किया। उन्होंने पूरे बीस रुपये उनके भोजन पर लगा दिए, और ख़ाली हाथ घर लौटे। पिता बहुत नाराज़ हुए। नानक जी ने जवाब दिया कि उन्होंने सच्चा सौदा किया है। उस जगह आज सच्चा सौदा नाम का गुरुद्वारा खड़ा है।", "a": "यह जपुजी साहिब का सबसे बड़ा सवाल है, और गुरु नानक इसे बिलकुल शुरू में पूछते हैं। हम सच्चे कैसे बनें, और झूठ की दीवार कैसे टूटे? छोटे छोटे झूठ ईंटों की तरह जमा होते जाते हैं। मैं ठीक हूँ। मुझे यह पढ़ाई पसंद है। मुझे जलन नहीं होती। कुछ सालों में हम जो हैं और जो दिखाते हैं, उनके बीच एक दीवार खड़ी हो जाती है। गुरु नानक पहले बताते हैं कि यह किससे नहीं टूटेगी: बार बार शरीर धोने से नहीं, चुप बैठने से नहीं, दौलत या चतुराई जमा करने से नहीं। सच्चा सौदा दूसरी दिशा दिखाता है। नानक जी जानते थे कि उनका दिल किस चीज़ को क़ीमती मानता है, और उन्होंने उसी पर अमल किया, चाहे पिता नाराज़ हुए। सच्चाई इससे शुरू होती है कि आप ईमानदारी से मानें कि आपके लिए असल में क्या मायने रखता है।", "b": "लेखक साइमन सिनेक ने देखा कि लोग तब अच्छा करते हैं जब उन्हें साफ़ पता हो कि वे कोई काम क्यों कर रहे हैं, सिर्फ़ यह नहीं कि क्या कर रहे हैं। सच्चे क्यों के बिना हम दूसरों की नक़ल करते हैं, और कामयाब होकर भी ख़ाली महसूस कर सकते हैं। सच्चा होने का मतलब हर बात का ऐलान करना, या कल नौकरी छोड़ देना नहीं है। यह ख़ुद से ईमानदार होने से शुरू होता है। जब आप मान लेते हैं कि मैं यहाँ ख़ुश नहीं हूँ, तभी आप उसके बारे में कुछ कर सकते हैं: किसी से बात करना, कोई नया हुनर सीखना, या कोई एक छोटी चीज़ बदलना। दीवार की दरार तब तक नहीं भरी जा सकती जब तक कोई मान न ले कि दरार है। मानना कमज़ोरी नहीं है। यह पहली ईंट हटाना है।", "t": "यह वाक्य चुपचाप पूरा कीजिए, मन में या काग़ज़ पर। जिस बात को मैं ठीक कहता रहता हूँ, पर जो ठीक नहीं है, वह है। अभी किसी को बताना ज़रूरी नहीं।", "q": "परिवार में सब चाहते हैं कि आप इंजीनियर बनें, पर आपको डिज़ाइन से प्यार है। एक रिश्तेदार आपकी योजना पूछते हैं। सबसे सच्चा क़दम क्या है?", "o": ["सबको ख़ुश रखने के लिए इंजीनियरिंग कह देना", "नरमी से बताना कि आप डिज़ाइन में आगे बढ़ना चाहते हैं, और क्यों", "जल्दी से बात बदल देना"], "y": "इसमें हिम्मत लगती है। आपको आज बहस जीतने की ज़रूरत नहीं। नरमी से अपना क्यों बताकर आपने पहली ईंट हटा दी है, और जो लोग आपसे प्यार करते हैं, वे असली आपको देखना शुरू कर सकते हैं।", "n": "यह बहुत समझ में आता है। परिवार की उम्मीदें भारी होती हैं, और शांति बनाए रखना भी ज़रूरी है। पर हर छोटा छिपाना दीवार में एक और ईंट जोड़ देता है। नरमी से बताकर देखिए कि आप डिज़ाइन में आगे बढ़ना चाहते हैं, और क्यों। आप आदर और सच्चाई दोनों एक साथ रख सकते हैं।"}, "guilt1": {"ti": "दिल को साफ़ धोना", "s": "पिछले महीने आपने अपने छोटे भाई से कुछ बहुत कड़वा कह दिया था। वह हँसकर टाल गया, पर आपने उसका चेहरा देखा था। आप रात को अब भी उसके बारे में सोचते हैं, और समझ नहीं आता कि बात कैसे छेड़ें।", "m": "जब मन बुरे कामों से मैला हो जाता है, तो वह नाम के प्यार से धुलकर साफ़ होता है।", "k": "तुलंबा के पास सज्जन रहता था, जो मुसाफ़िरों के लिए एक सराय चलाता था। बाहर से वह गर्मजोशी से स्वागत करने वाला था। पर उसके पीछे, जनमसाखी बताती है, वह वहाँ सोने वाले मेहमानों को लूटता और नुक़सान पहुँचाता था। जब गुरु नानक और भाई मरदाना उसकी सराय में रुके, तो सज्जन ने उनकी अच्छी सेवा की, और रात का इंतज़ार करने लगा। सोने से पहले गुरु जी ने गाने की इच्छा जताई, और मरदाना ने रबाब बजाया। शबद ऐसी चीज़ों के बारे में था जो बाहर से चमकती और साफ़ दिखती हैं, पर अंदर से काली रहती हैं। सज्जन ने सुना, और उसे अपना चेहरा दिख गया। वह गुरु जी के चरणों में गिर पड़ा और सब मान लिया। गुरु नानक ने कहा कि जो कुछ ग़लत तरीक़े से लिया है वह लौटा दो, और फिर से शुरू करो। सज्जन ने वही किया। परंपरा बताती है कि उसकी सराय उन पहली जगहों में से एक बनी जहाँ लोग गुरु नानक के शबद गाने इकट्ठा होते थे।", "a": "गुरु नानक दोषी मन की तुलना मैले कपड़ों से करते हैं। रास्ते की धूल से गंदे कपड़े पानी और साबुन से धुलते हैं। बुरे कामों से मैला मन नाम से धुलता है, यानी उस एक के प्यार और याद से। देखिए यह पंक्ति क्या नहीं कहती। यह नहीं कहती कि आप हमेशा के लिए मैले हैं। यह कहती है कि धुलना मुमकिन है। सज्जन ने हम में से ज़्यादातर से कहीं बुरे काम किए थे, फिर भी उसकी कहानी सज़ा पर नहीं, एक नई शुरुआत पर ख़त्म होती है। यह भी देखिए कि धुलने के लिए क्या चाहिए था। उसे ख़ुद को साफ़ देखना पड़ा, मानना पड़ा, और जो लिया था लौटाना पड़ा। सही इस्तेमाल हो तो पछतावा उस दाग़ जैसा है जो आख़िर दिख गया। यह साफ़ होने की तरफ़ पहला क़दम है, कहानी का अंत नहीं।", "b": "मनोवैज्ञानिक पछतावे और शर्म में फ़र्क़ करते हैं। पछतावा कहता है, मैंने एक बुरा काम किया। शर्म कहती है, मैं ही बुरा हूँ। जून टैंगनी और दूसरे शोधकर्ताओं का काम बताता है कि पछतावा अक्सर इंसान को नुक़सान ठीक करने की तरफ़ धकेलता है, जबकि शर्म उसे छिपने, मुकरने या भड़कने की तरफ़। इसलिए काम का सवाल यह नहीं कि मैं कैसा इंस र रिपोर्ट साठ सेकंड इंतज़ार कर सकती है।"}, "lonely1": {"ti": "घेरे से बाहर कोई नहीं", "s": "आप काम के लिए एक नए शहर आए हैं। वीकेंड सबसे मुश्किल होते हैं। ऑनलाइन हर कोई दोस्तों के साथ दिखता है, और आपका कमरा बहुत, बहुत शांत लगता है।", "m": "सब जीवों का एक ही दाता है। वह मुझे कभी न भूले।", "k": "पश्चिम की यात्रा में गुरु नानक मक्का पहुँचे। सफ़र से थककर वे आराम करने लेटे, और उनके पैर संयोग से काबा की ओर हो गए। एक आदमी ने यह देखा और गुस्से में उन्हें जगाया। तुम ख़ुदा के घर की ओर पैर करने की हिम्मत कैसे करते हो, उसने पूछा। गुरु नानक ने नरमी से जवाब दिया: तो मेरे पैर उस दिशा में कर दो जहाँ ख़ुदा न हो। भाई गुरदास, जिन्होंने गुरु जी के समय की यादें ताज़ा रहते लिखा, अपनी पहली वार में यह कहानी बताते हैं। उस आदमी के पास कोई जवाब नहीं था। ऐसी कोई दिशा नहीं जहाँ वह एक न हो।", "a": "गुरु नानक की पंक्ति छोटी है: सब जीवों का एक दाता है, वह मुझे कभी न भूले। हर कोई उसी दाता के सहारे है। आप, आपके आसपास शहर के लोग, दूर बैठा आपका दोस्त, बस में बैठा अजनबी भी। मक्का की साखी इसे एक सीधी तस्वीर में रख देती है। किसी भी दिशा में मुड़िए, वह एक पहले से वहाँ है। अकेलापन अक्सर कान में कहता है कि हम घेरे से बाहर हैं, कि बाक़ी सब किसी के हैं और हम नहीं। यह पंक्ति उस फुसफुसाहट का जवाब है। कोई बाहर नहीं है। इससे ख़ाली कमरा तुरंत नहीं भर जाता। पर कमरा बदल जाता है। आप उसमें छोड़े हुए नहीं हैं। आप थामे हुए हैं, और अगली दोस्ती उतनी दूर नहीं जितनी लगती है।", "b": "अकेलापन बहुत आम है, ख़ासकर नई जगह जाने के बाद, और यह आपके बारे में कुछ बुरा नहीं कहता। शोधकर्ता लंबे अकेलेपन को तनाव और ख़राब नींद से जोड़ते हैं, इसलिए उसकी प्यार से देखभाल ज़रूरी है। अच्छी ख़बर यह है कि रिश्ते अक्सर छोटी, बार बार की मुलाक़ातों से बढ़ते हैं, किसी एक बड़े पल से नहीं। हर सुबह उसी चायवाले को नमस्ते। हफ़्ते में एक बार कोई क्लास, या रविवार को गुरुद्वारे के लंगर में सेवा, जहाँ बहुत से हाथ साथ काम करते हैं। किसी पुराने दोस्त को पाँच मिनट का फ़ोन। हर एक एक छोटा धागा है, और धागे मिलकर रस्सी बनते हैं। यह भी याद रखिए कि आपके आसपास बहुत से लोग चुपचाप अकेले हैं। हो सकता है आपकी नमस्ते का ही वे इंतज़ार कर रहे हों।", "t": "इस हफ़्ते एक ऐसी जगह  उठाई। उन्होंने प्यार की वजह से उठाई। और गुरु नानक ने वह प्यार पूरा देखा। जहाँ दूसरों को गंदगी दिखी, उन्हें केसर दिखा। सच्चा प्यार पाना ऐसा ही लगता है। कोई ठीक उसी चीज़ को देखे जिसे आप बदसूरत समझते थे, आपकी थकान, आपकी मेहनत, आपकी बिखरी हालत, और उसमें सुंदरता देखे। आपकी अनदेखी मेहनत कभी बेकार नहीं जाती।", "b": "हम सबको क़द्र महसूस होने की ज़रूरत होती है, और हमारा बहुत सा प्यार रोज़ के जीवन में अनदेखा रह जाता है। माँ की दस हज़ार रोटियाँ। किसी दोस्त की देर रात की मदद। मनोवैज्ञानिक जॉन गॉटमैन ने दशकों तक जोड़ों पर अध्ययन किया, और पाया कि छोटे पल बहुत मायने रखते हैं: एक दूसरे पर ध्यान देना, धन्यवाद कहना, एक दूसरे की तरफ़ मुड़ना। अच्छी ख़बर यह है कि ध्यान देने वाले हम ख़ुद बन सकते हैं। जब आप कहते हैं, मैंने देखा तुमने कितनी मेहनत की, तो आप किसी के कीचड़ को केसर बना देते हैं। और जब कोई आप पर ध्यान न दे, तो भाई लहणा को याद कीजिए। साफ़ दिल से दिया गया प्यार अपने आप में पूरा है। उसे सच्चा होने के लिए तालियों की ज़रूरत नहीं। फिर भी, लोगों को बताना अच्छा है कि आप उनसे प्यार करते हैं। इंतज़ार मत कीजिए।", "t": "आज किसी एक इंसान की चुपचाप की गई मेहनत पर ध्यान दीजिए, घर में या काम पर, और उन्हें साफ़ साफ़ कहिए: मैंने देखा तुमने क्या किया। शुक्रिया।", "q": "आपकी माँ सालों से हर दिन परिवार के लिए खाना बनाती हैं। आम तौर पर कोई कुछ नहीं कहता। आज रात आप क्या कर सकते हैं?", "o": ["कुछ नहीं, माँ का खाना बनाना तो आम बात है", "उन्हें बताना कि उनके खाने में आपको क्या अच्छा लगता है, और धन्यवाद कहना", "उनके बारे में ऑनलाइन पोस्ट डालना"], "y": "बहुत सुंदर। एक साफ़ साफ़ धन्यवाद सालों की अनदेखी मेहनत को केसर बना देता है। उनका चेहरा देखिए। वह छोटा सा वाक्य आपकी सोच से ज़्यादा मायने रखेगा।", "n": "हम में से ज़्यादातर यही करते हैं, बिना कोई बुरा इरादा रखे। उनका काम इतना आम हो गया है कि हम उसे देखना बंद कर देते हैं। उन्हें सीधे बताकर देखिए कि उनके खाने में आपको क्या पसंद है, और धन्यवाद कहिए। देखे जाना एक ऐसा तोहफ़ा है जो हम हर दिन दे सकते हैं।"}, "fear1": {"ti": "जब चिंता रुकती नहीं", "s": "रात के दो बजे हैं। कल पापा की जाँच की रिपोर्ट आनी है। दिमाग़ हर बुरे अंत को फ़िल्म की तरह बार-बार चला रहा है, और फ़ोन पर डरावने शब्दों से भरा सर्च पेज खुला है। नींद बहुत दूर लगती है।", "m": "जो परमात्मा की शरण में है, उसे गर्म हवा नहीं लगती। हमारे चारों ओर प्रभु के नाम की रक्षा की रेखा है; भाई, कोई दुख हमें छू नहीं सकता।", "k": "सिख परंपरा याद करती है कि जब गुरु अर्जन देव जी के छोटे बेटे हरगोबिंद को चेचक हो गई, तो आसपास बहुत लोग डर गए। कुछ ने कहा कि रिवाज के मुताबिक़ चेचक की देवी को चढ़ावा चढ़ाइए। गुरु जी ने ऐसा नहीं किया। वे बच्चे के पास रहे, संगत को कीर्तन और अरदास में जोड़े रखा, और करतार पर भरोसा रखा। जब बच्चा ठीक हुआ, तो गुरु जी का शुक्राना गुरु ग्रंथ साहिब में एक शब्द बन गया: सीतला ते रखिआ बिहारी, तूने ही उसे चेचक से बचाया, अंग 200। गुरु जी ने ख़तरे को नकारा नहीं। उन्होंने घबराहट की जगह देखभाल, साथ और भरोसे से उसका सामना किया।", "a": "पूरा शब्द देखिए। इसकी रहाउ वाली पंक्ति, जो शब्द का केंद्र है, कहती है कि पूरे सतगुरु ने नाम की औषधि दी है। प्रो. साहिब सिंह गर्म हवा का अर्थ बीमारियों और दुखों की तपिश बताते हैं। यानी यह वादा नहीं कि कभी कुछ कठिन नहीं होगा। यह भीतर की बात है: जब मन नाम में टिकता है, तो उसके चारों ओर एक घेरा बन जाता है, और डर की तपिश उसे जला नहीं पाती। शरीर बीमार हो सकता है, पर मन को जलना ज़रूरी नहीं। चिंता हमें सुरक्षा जैसी लगती है, जैसे ज़्यादा सोचने से हम तैयार रहेंगे। असल में वह उस दुख का अभ्यास करती है जो अभी आया ही नहीं। शब्द एक बेहतर आसरा देता है: जो आपके हाथ में है वह कीजिए, और उस एक में टिकिए जो सब कुछ सँभाले हुए है।", "b": "रात को जब मन दौड़े, तो चिंता को एक पंक्ति में लिख लीजिए, और उसके बगल में एक काम जो आप कल सच में कर सकते हैं। फिर काग़ज़ रख दीजिए। चिंता को जगह मिल गई, और आपको आराम की इजाज़त।", "t": "आज रात सोने से पहले ये दो पंक्तियाँ धीरे-धीरे तीन बार पढ़िए। फिर पाँच बार ऐसे साँस लीजिए कि छोड़ना लेने से लंबा हो।", "q": "आपकी सबसे अच्छी दोस्त की मम्मी अस्पताल में हैं। आधी रात को वह आपको मैसेज करती है, 'अगर ऐसा हो गया तो' में उलझी हुई। सबसे ज़्यादा क्या मदद करेगा?", "o": ["उसे हर संभव ख़तरे के बारे में लिंक भेजना", "उसे फ़ोन करना, सुनना, सुबह का एक अगला कदम तय करने में मदद करना, और उसके शांत होने तक साथ रहना", "उससे कहना कि ज़्यादा मत सोचो, चिंत ों में नहीं। किसी दिन सब ठीक लगता है, फिर दुकान में बजता कोई गाना आपको तोड़ देता है। दोनों को होने दीजिए। उनका नाम लीजिए। उनकी कोई एक आदत ज़िंदा रखिए।", "t": "आज कोई एक छोटा काम कीजिए जो आपके प्रिय करते थे या जिससे उन्हें प्यार था, और उसे चुपचाप उनके नाम कीजिए।", "q": "एक सहपाठी की मम्मी पिछले महीने गुज़र गईं, और वह अभी कॉलेज लौटी है। लोग उससे कतराते हैं क्योंकि समझ नहीं आता क्या कहें। आप क्या करेंगे?", "o": ["इस बात से पूरी तरह बचना ताकि वह उदास न हो", "उसके पास बैठना, कहना कि मुझे दुख है, और अगर वह चाहे तो उससे उसकी मम्मी के बारे में पूछना", "उससे कहना कि सब किसी वजह से होता है, उसे मज़बूत रहना होगा"], "y": "यह सच में एक तोहफ़ा है। दुख में डूबे लोगों को अक्सर लगता है कि सबकी चुप्पी उनके प्रिय को मिटा रही है। नाम लेना और कोई याद बाँटने का मौक़ा देना प्यार को ज़िंदा रखता है, और उसे राह दिखाने देता है।", "n": "यह उसे बचाने की चाह से आता है, जो अच्छी बात है। पर चुप्पी अक्सर ऐसी लगती है जैसे वह इंसान भुला दिया गया, और 'मज़बूत रहो' जैसे बड़े वाक्य दुख को ग़लत महसूस करा सकते हैं। एक सीधा 'मुझे दुख है', और याद बाँटने की जगह, कहीं ज़्यादा मदद करती है।"}, "forgive1": {"ti": "चोट को छोड़ना", "s": "पिछले साल आपके कज़िन ने फ़ैमिली ग्रुप में आपके बारे में झूठ फैलाया। उसने कभी माफ़ी नहीं माँगी। अब एक शादी है, वह भी आएगा, और बस सोचकर ही आपके जबड़े कस जाते हैं। आप वह दिन सौ बार दोहरा चुके हैं।", "m": "फ़रीद, जो तुम्हारे साथ बुरा करे उसके साथ भी भला करो, और गुस्से को मन में टिकने मत दो। तब शरीर को रोग नहीं लगता, और सारी अच्छाई तुम्हारे पास बनी रहती है।", "k": "सिख परंपरा उन चालीस सिखों को याद करती है जो 1705 में आनंदपुर की लंबी घेराबंदी के दौरान गुरु गोबिंद सिंह जी से नाता तोड़ने का काग़ज़ लिखकर घर लौट गए। उनके गाँव में इलाक़े की एक बहादुर औरत, माई भागो, ने उन्हें धिक्कारा और गुरु जी के साथ खड़े होने के लिए वापस ले आईं। खिदराणा में, जो आज श्री मुक्तसर साहिब है, वे लड़े और शहीद हुए। उनमें से आख़िरी, महां सिंह, जब दम तोड़ रहे थे, गुरु जी उनके पास पहुँचे और उनका सिर अपनी गोद में रखा। पूछा, क्या चाहते हो? महां सिंह बोले: हमें माफ़ कर दीजिए, और वह काग़ज़ फाड़ दीजिए। गुरु जी ने काग़ज़ नि मरो को याद करती है, गुरु अंगद देव जी की बेटी, जिनकी शादी अमरदास जी के भाई के परिवार में हुई थी। हर सुबह दूध बिलोते हुए वे गुरु नानक देव जी की बाणी गाती थीं। एक दिन अमरदास जी, जो साठ पार के एक श्रद्धालु तीर्थयात्री थे, ने उन्हें गाते सुना और भीतर तक हिल गए। उन्होंने पूछा, ये किसके वचन हैं? बीबी अमरो उन्हें खडूर में अपने पिता गुरु अंगद देव जी के पास ले गईं। उस मुलाक़ात ने उनकी ज़िंदगी बदल दी। उन्होंने पूरी लगन से सेवा की और आगे चलकर तीसरे गुरु बने। एक युवा स्त्री की आवाज़ भविष्य के गुरु को गुरु तक ले आई।", "a": "गुरु नानक देव जी के समय में स्त्रियों को अक्सर अपवित्र माना जाता था, ख़ासकर बच्चे के जन्म के बाद, और बदक़िस्मती का दोष उन पर डाला जाता था। आसा दी वार का यह सलोक इसका सीधा जवाब देता है। हर इंसान स्त्री के गर्भ में बनता और उसी से जन्म लेता है; रिश्ते, शादियाँ, दोस्तियाँ और दुनिया की राह उसी से चलती है। तो उसे छोटा कैसे कहा जा सकता है? सलोक के अंत में कहा गया है कि सिर्फ़ वह एक ही स्त्री से जन्म नहीं लेता, और जो भी मुख, पुरुष का हो या स्त्री का, उस एक की स्तुति करता है, वह सच्चे दरबार में उजला होता है। सम्मान स्त्रियों पर कोई एहसान नहीं; वह कभी किसी का छीनने का था ही नहीं। गुरुओं ने इसे संगत और लंगर में जीकर दिखाया, जहाँ सब साथ बैठते और गाते थे।", "b": "घर में देखिए कि हमेशा कौन परोसता है और कौन पहले खाता है, किससे करियर के बारे में पूछा जाता है और किससे सिर्फ़ शादी के बारे में। रोज़ की छोटी आदतें बच्चों को बड़े भाषणों से ज़्यादा सिखाती हैं।", "t": "आज अपने परिवार की किसी स्त्री से उसके सपनों या उसके काम के बारे में पूछिए, और जवाब सच में ध्यान से सुनिए।", "q": "उसी समारोह में, अंकल का मज़ाक़ हवा में लटका है। आप क्या करेंगे?", "o": ["माहौल ठीक रखने के लिए साथ में हँस देना", "मुस्कुराकर हल्के पर साफ़ शब्दों में कहना, वैसे इसने तो अभी फ़िज़िक्स टॉप की है, और कज़िन से उसके प्लान पूछना", "सबके सामने अंकल पर चिल्लाना"], "y": "बहुत सुंदर। आपने किसी को नीचा दिखाए बिना पल को कज़िन की उपलब्धि की ओर मोड़ दिया। उसने सुना कि कोई उसे देखता है, और पूरे कमरे ने एक अलग कहानी सुनी।", "n": "माहौल बचाना और उसका बचाव करना, दोनों परवाह से आते हैं। पर साथ में हँसना उसे सिखाता है कि उसक पूरा होना है। एक साथी कहता है कि कुछ अपुष्ट ऑर्डरों को बिका हुआ दिखा दो, बाद में ठीक कर लेंगे। आप क्या करेंगे?", "o": ["कर देना, क्वार्टर के अंत में सब यही करते हैं", "सही आँकड़े देना, कमी ईमानदारी से समझाना, और उसे पूरा करने की योजना रखना", "चुपचाप साथी को करने देना और ख़ुद को अलग रखना"], "y": "मज़बूत और साफ़। सही आँकड़े आपको, आपके साथी को और ग्राहकों को बचाते हैं। साफ़ योजना से मैनेजर देखता है कि आपको असली नतीजों की परवाह है, सिर्फ़ अच्छा दिखने की नहीं।", "n": "दबाव असली है, और टीम को बचाने की चाह समझ में आती है। पर गढ़े हुए आँकड़े रेत पर बनते हैं, और चुप रहना भी आपको उसमें शामिल कर देता है। सही आँकड़े और एक योजना, लंबे समय में ज़्यादा भरोसा कमाते हैं।"}}, pa:{"anger1": {"ti": "ਜਵਾਬ ਦੇਣ ਤੋਂ ਪਹਿਲਾਂ ਇਕ ਠਹਿਰਾਅ", "s": "ਪਰਿਵਾਰ ਦੇ ਗਰੁੱਪ ਵਿਚ ਇਕ ਸੁਨੇਹਾ ਆਉਂਦਾ ਹੈ। ਗੱਲ ਤੁਹਾਡੇ ਬਾਰੇ ਹੈ। ਅੱਧਾ ਮਜ਼ਾਕ, ਪੂਰਾ ਤਾਅਨਾ। ਚਿਹਰਾ ਗਰਮ ਹੋ ਜਾਂਦਾ ਹੈ, ਤੇ ਉਂਗਲਾਂ ਅਜਿਹਾ ਜਵਾਬ ਲਿਖਣ ਲੱਗ ਪੈਂਦੀਆਂ ਹਨ ਜੋ ਚੁਭੇਗਾ।", "m": "ਸੰਜਮ ਨੂੰ ਆਪਣੀ ਭੱਠੀ ਬਣਾਓ, ਤੇ ਧੀਰਜ ਨੂੰ ਸੁਨਿਆਰਾ।", "k": "ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਜਦੋਂ ਤੀਜੇ ਗੁਰੂ ਬਣੇ, ਉਦੋਂ ਉਹ ਬਜ਼ੁਰਗ ਹੋ ਚੁੱਕੇ ਸਨ। ਗੋਇੰਦਵਾਲ ਵਿਚ ਦੂਰੋਂ ਦੂਰੋਂ ਲੋਕ ਬੱਸ ਉਨ੍ਹਾਂ ਕੋਲ ਬੈਠਣ ਆਉਂਦੇ ਸਨ। ਗੁਰੂ ਅੰਗਦ ਜੀ ਦੇ ਪੁੱਤਰ ਦਾਤੂ ਤੋਂ ਇਹ ਸਹਿਆ ਨਾ ਗਿਆ। ਉਨ੍ਹਾਂ ਨੂੰ ਲੱਗਦਾ ਸੀ ਕਿ ਇਹ ਗੱਦੀ ਉਨ੍ਹਾਂ ਦੀ ਹੋਣੀ ਚਾਹੀਦੀ ਸੀ। ਇਕ ਦਿਨ ਉਹ ਗੁੱਸੇ ਨਾਲ ਭਰੇ ਸੰਗਤ ਵਿਚ ਆਏ, ਤੇ ਬਜ਼ੁਰਗ ਗੁਰੂ ਜੀ ਨੂੰ ਲੱਤ ਮਾਰ ਕੇ ਗੱਦੀ ਤੋਂ ਡੇਗ ਦਿੱਤਾ। ਸਾਰੀ ਸਭਾ ਵਿਚ ਚੁੱਪ ਛਾ ਗਈ। ਗੁਰੂ ਜੀ ਹੌਲੀ ਜਿਹੀ ਉੱਠੇ। ਸਿੱਖ ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਉਨ੍ਹਾਂ ਨੇ ਨਾ ਆਵਾਜ਼ ਉੱਚੀ ਕੀਤੀ, ਨਾ ਮੋੜ ਕੇ ਵਾਰ ਕੀਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਪਿਆਰ ਨਾਲ ਦਾਤੂ ਦਾ ਪੈਰ ਫੜਿਆ, ਤੇ ਕਿਹਾ ਕਿ ਜੇ ਉਨ੍ਹਾਂ ਦੀਆਂ ਸਖ਼ਤ ਬੁੱਢੀਆਂ ਹੱਡੀਆਂ ਨਾਲ ਪੈਰ ਨੂੰ ਸੱਟ ਲੱਗੀ ਹੋਵੇ ਤਾਂ ਉਨ੍ਹਾਂ ਨੂੰ ਅਫ਼ਸੋਸ ਹੈ। ਉਸੇ ਸ਼ਾਮ ਉਹ ਚੁੱਪ ਚਾਪ ਗੋਇੰਦਵਾਲ ਛੱਡ ਕੇ ਚਲੇ ਗਏ, ਤਾਂ ਜੋ ਕੋਈ ਝਗੜਾ ਨਾ ਹੋਵੇ।", "a": "ਗੁਰੂ ਨਾਨਕ ਸਾਨੂੰ ਸੁਨਿਆਰੇ ਦੀ ਭੱਠੀ ਦੀ ਤਸਵੀਰ ਦਿੰਦੇ ਹਨ। ਸੋਨਾ ਇਕ ਸੱਟ ਨਾਲ ਮੁੰਦਰੀ ਨਹੀਂ ਬਣਦਾ। ਉਸ ਨੂੰ ਤਪਾਇਆ ਜਾਂਦਾ ਹੈ, ਘੜਿਆ ਜਾਂਦਾ ਹੈ, ਠੰਢਾ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਤੇ ਫਿਰ ਘੜਿਆ ਜਾਂਦਾ ਹੈ, ਅਜਿਹੇ ਹੱਥ ਨਾਲ ਜੋ ਕਾਹਲੀ ਨਹੀਂ ਕਰਦਾ। ਇਸੇ ਨੂੰ ਉਹ ਧੀਰਜ ਕਹਿੰਦੇ ਹਨ, ਤੇ ਧੀਰਜ ਨੂੰ ਸੰਦਾਂ ਨਾਲ ਪਾਸੇ ਨਹੀਂ ਰੱਖਦੇ। ਧੀਰਜ ਆਪ ਸੁਨਿਆਰਾ ਹੈ, ਜੋ ਕੰਮ ਕਰ ਰਿਹਾ ਹੈ। ਇਸ ਲਈ ਧੀਰਜ ਕਮਜ਼ੋਰੀ ਨਹੀਂ, ਤੇ ਸਭ ਕੁਝ ਚੁੱਪ ਚਾਪ ਨਿਗਲ ਲੈਣਾ ਵੀ ਨਹੀਂ। ਇਹ ਇਕ ਹੁਨਰ ਹੈ। ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਕੋਲ ਮੋੜ ਕੇ ਵਾਰ ਕਰਨ ਦੀ ਹਰ ਵਜ੍ਹਾ ਸੀ, ਫਿਰ ਵੀ ਉਸ ਸਭਾ ਵਿਚ ਉਨ੍ਹਾਂ ਦੇ ਧੀਰਜ ਨੇ ਘੜਨ ਦਾ ਕੰਮ ਕੀਤਾ। ਸਿਗਮੰਡ ਫ਼ਰਾਇਡ ਤੋਂ ਬਾਅਦ ਆਏ ਚਿੰਤਕਾਂ ਨੇ ਇਕ ਗੱਲ ਵੇਖੀ ਜੋ ਇੱਥੇ ਢੁਕਦੀ ਹੈ। ਗੁੱਸਾ ਅਕਸਰ ਗ਼ਲਤ ਬੰਦੇ ਉੱਤੇ ਨਿਕਲਦਾ ਹੈ। ਦੁਪਹਿਰੇ ਬੌਸ ਝਿੜਕਦਾ ਹੈ, ਤੇ ਰਾਤ ਨੂੰ ਅਸੀਂ ਆਪਣੀ ਭੈਣ ਉੱਤੇ ਵਰ੍ਹ ਪੈਂਦੇ ਹਾਂ। ਧੀਰਜ ਸਾਨੂੰ ਇਹ ਵੇਖਣ ਦਾ ਸਮਾਂ ਦਿੰਦਾ ਹੈ ਕਿ ਤਪਸ਼ ਅਸਲ ਵਿਚ ਕਿੱਥੋਂ ਆ ਰਹੀ ਹੈ।", "b": "ਠਹਿਰਨ ਨਾਲ ਫ਼ਾਇਦਾ ਕਿਉਂ ਹੁੰਦਾ ਹੈ? ਗੁੱਸਾ ਆਪਣੇ ਪਹਿਲੇ ਕੁਝ ਪਲਾਂ ਵਿਚ ਸਭ ਤੋਂ ਤੇਜ਼ ਹੁੰਦਾ ਹੈ, ਜਿਵੇਂ ਉਬਲ ਕੇ ਡੁੱਲ੍ਹਦਾ ਦੁੱਧ। ਜੇ ਤੁਸੀਂ ਇਕ ਪਲ ਲਈ ਭਾਂਡਾ ਅੱਗ ਤੋਂ ਲਾਹ ਲਓ, ਤਾਂ ਦੁੱਧ ਬਹਿ ਜਾਂਦਾ ਹੈ, ਤੇ ਕੁਝ ਨਹੀਂ ਵਿਗੜਦਾ। ਇਉਂ ਹੀ ਦਸ ਪਲਾਂ ਦਾ ਠਹਿਰਾਅ ਇਹ ਨਹੀਂ ਕਹਿੰਦਾ ਕਿ ਤੁਸੀਂ ਨਾਰਾਜ਼ ਨਹੀਂ। ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਹੁਣ ਸ਼ਬਦ ਤੁਸੀਂ ਚੁਣ ਰਹੇ ਹੋ, ਗੁੱਸਾ ਨਹੀਂ ਚੁਣ ਰਿਹਾ। ਤੁਸੀਂ ਫਿਰ ਵੀ ਸਖ਼ਤ ਗੱਲ ਕਹਿ ਸਕਦੇ ਹੋ। ਫਿਰ ਵੀ ਆਪਣੀ ਗੱਲ ਉੱਤੇ ਡਟੇ ਰਹਿ ਸਕਦੇ ਹੋ। ਬੱਸ ਕੱਲ੍ਹ ਸਵੇਰੇ ਇਹ ਨਹੀਂ ਸੋਚਣਾ ਪਵੇਗਾ ਕਿ ਕਾਸ਼ ਮੈਂ ਹੋਰ ਤਰ੍ਹਾਂ ਕਿਹਾ ਹੁੰਦਾ। ਜੋ ਲੋਕ ਇਹ ਸਿੱਖ ਲੈਂਦੇ ਹਨ, ਉਹ ਪਰਿਵਾਰ ਜਾਂ ਦਫ਼ਤਰ ਦੇ ਸ਼ਾਂਤ ਲੋਕ ਬਣ ਜਾਂਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਉੱਤੇ ਔਖੇ ਵੇਲੇ ਸਾਰੇ ਭਰੋਸਾ ਕਰਦੇ ਹਨ। ਉਹ ਭਰੋਸਾ ਇਕ ਇਕ ਰੁਕੇ ਹੋਏ ਜਵਾਬ ਨਾਲ ਬਣਦਾ ਹੈ।", "t": "ਅਗਲੀ ਵਾਰ ਜਦੋਂ ਕੋਈ ਸੁਨੇਹਾ ਚੁਭੇ, ਫ਼ੋਨ ਪੁੱਠਾ ਰੱਖ ਦਿਓ ਤੇ ਤਿੰਨ ਹੌਲੇ ਸਾਹ ਲਓ। ਫਿਰ ਤੈਅ ਕਰੋ ਕਿ ਕੀ ਕਹਿਣਾ ਹੈ, ਜਾਂ ਅੱਜ ਕੁਝ ਕਹਿਣਾ ਵੀ ਹੈ ਕਿ ਨਹੀਂ।", "q": "ਇਕ ਦੋਸਤ ਨੇ ਆਖ਼ਰੀ ਪਲ ਫਿਰ ਤੁਹਾਡਾ ਪਲਾਨ ਰੱਦ ਕਰ ਦਿੱਤਾ। ਤੁਹਾਡੇ ਅੰਦਰ ਗੁੱਸਾ ਉੱਠ ਰਿਹਾ ਹੈ। ਤੁਸੀਂ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਉਸੇ ਵੇਲੇ ਗੁੱਸੇ ਵਾਲਾ ਵੌਇਸ ਨੋਟ ਭੇਜ ਦਿਓਗੇ", "ਥੋੜ੍ਹਾ ਰੁਕੋਗੇ, ਫਿਰ ਸ਼ਾਂਤੀ ਨਾਲ ਦੱਸੋਗੇ ਕਿ ਕਿਵੇਂ ਲੱਗਾ", "ਇਕ ਹਫ਼ਤਾ ਉਸ ਨਾਲ ਗੱਲ ਨਹੀਂ ਕਰੋਗੇ"], "y": "ਬਹੁਤ ਸੋਹਣੀ ਚੋਣ। ਥੋੜ੍ਹਾ ਰੁਕਣਾ ਹੀ ਸੁਨਿਆਰੇ ਦਾ ਕੰਮ ਹੈ। ਜਦੋਂ ਤੁਸੀਂ ਸ਼ਾਂਤੀ ਨਾਲ ਦੱਸਦੇ ਹੋ ਕਿ ਕਿਵੇਂ ਲੱਗਾ, ਤਾਂ ਦੋਸਤ ਸੱਚਮੁੱਚ ਤੁਹਾਡੀ ਗੱਲ ਸੁਣ ਸਕਦਾ ਹੈ, ਤੁਹਾਡੇ ਗੁੱਸੇ ਤੋਂ ਬਚਾਅ ਨਹੀਂ ਕਰਦਾ। ਤੁਸੀਂ ਦੋਸਤੀ ਵੀ ਬਚਾਉਂਦੇ ਹੋ ਤੇ ਆਪਣਾ ਸਕੂਨ ਵੀ।", "n": "ਇਹ ਇਕ ਸੱਚਾ ਜਵਾਬ ਹੈ, ਤੇ ਲਗਭਗ ਹਰ ਕਿਸੇ ਨੇ ਇਹ ਖਿੱਚ ਮਹਿਸੂਸ ਕੀਤੀ ਹੈ। ਗੁੱਸਾ ਛੇਤੀ ਕੁਝ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈ, ਜਾਂ ਵਾਰ ਕਰਕੇ ਜਾਂ ਠੰਢਾ ਪੈ ਕੇ। ਪਰ ਦੋਹਾਂ ਨਾਲ ਗੱਲ ਅਕਸਰ ਹੋਰ ਵਿਗੜਦੀ ਹੈ। ਥੋੜ੍ਹਾ ਰੁਕ ਕੇ, ਸ਼ਾਂਤੀ ਨਾਲ ਦੱਸ ਕੇ ਵੇਖੋ ਕਿ ਕਿਵੇਂ ਲੱਗਾ। ਉਸ ਪਲ ਇਹ ਔਖਾ ਲੱਗਦਾ ਹੈ, ਪਰ ਬਾਅਦ ਵਿਚ ਮਨ ਬਹੁਤ ਹੌਲਾ ਰਹਿੰਦਾ ਹੈ।"}, "ego1": {"ti": "ਇਹ ਅਸਲ ਵਿਚ ਕਿਸ ਨੇ ਕੀਤਾ?", "s": "ਤੁਹਾਨੂੰ ਤਰੱਕੀ ਮਿਲਦੀ ਹੈ। ਘਰ ਮੁੜਦਿਆਂ ਤੁਸੀਂ ਆਪਣੇ ਆਪ ਨੂੰ ਕਹਿੰਦੇ ਹੋ, ਇਹ ਮੈਂ ਕੀਤਾ। ਸਿਰਫ਼ ਮੈਂ। ਫਿਰ ਯਾਦ ਆਉਂਦਾ ਹੈ ਉਹ ਅਧਿਆਪਕ ਜੋ ਦੇਰ ਤਕ ਰੁਕਦਾ ਸੀ, ਉਹ ਦੋਸਤ ਜਿਸ ਨੇ ਨੌਕਰੀ ਦੀ ਖ਼ਬਰ ਭੇਜੀ ਸੀ, ਤੇ ਮਾਂ, ਜਿਸ ਨੇ ਪੰਦਰਾਂ ਸਾਲ ਰੋਟੀ ਬੰਨ੍ਹ ਕੇ ਦਿੱਤੀ।", "m": "ਹਰ ਕੋਈ ਹੁਕਮ ਦੇ ਅੰਦਰ ਹੈ, ਉਸ ਤੋਂ ਬਾਹਰ ਕੋਈ ਨਹੀਂ। ਜੋ ਇਹ ਗੱਲ ਸਮਝ ਲੈਂਦਾ ਹੈ, ਉਹ ਮੈਂ, ਮੈਂ ਕਹਿਣਾ ਛੱਡ ਦਿੰਦਾ ਹੈ।", "k": "ਇਕ ਵਾਰ ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਅਕਬਰ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਮਿਲਣ ਗੋਇੰਦਵਾਲ ਆਇਆ। ਉਹ ਦੇਸ਼ ਦਾ ਸਭ ਤੋਂ ਤਾਕਤਵਰ ਬੰਦਾ ਸੀ, ਵੱਡੀ ਸ਼ਾਨ ਨਾਲ ਸਵਾਗਤ ਦਾ ਆਦੀ। ਪਰ ਗੁਰੂ ਜੀ ਦੇ ਦਰ ਉੱਤੇ ਇਕ ਸਿੱਧਾ ਨਿਯਮ ਸੀ: ਪਹਿਲਾਂ ਪੰਗਤ, ਫਿਰ ਸੰਗਤ। ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਤੋਂ ਪਹਿਲਾਂ ਹਰ ਕੋਈ ਧਰਤੀ ਉੱਤੇ ਇਕ ਕਤਾਰ ਵਿਚ ਬੈਠ ਕੇ ਲੰਗਰ ਦਾ ਇਕੋ ਜਿਹਾ ਭੋਜਨ ਛਕਦਾ ਸੀ। ਅਮੀਰ ਤੇ ਗ਼ਰੀਬ, ਹਿੰਦੂ ਤੇ ਮੁਸਲਮਾਨ, ਮੋਢੇ ਨਾਲ ਮੋਢਾ ਜੋੜ ਕੇ। ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਬਾਦਸ਼ਾਹ ਨੇ ਵੀ ਇਹੀ ਕੀਤਾ। ਉਹ ਕਿਸਾਨਾਂ ਤੇ ਮੁਸਾਫ਼ਰਾਂ ਵਿਚਕਾਰ ਬੈਠਾ, ਤੇ ਉਹੀ ਸਾਦਾ ਭੋਜਨ ਛਕਿਆ। ਉਸ ਤੋਂ ਬਾਅਦ ਹੀ ਉਹ ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਗਿਆ।", "a": "ਇੱਥੇ ਦੋ ਸ਼ਬਦ ਜ਼ਰੂਰੀ ਹਨ। ਹੁਕਮ ਉਹ ਵੱਡਾ ਨਿਜ਼ਾਮ ਹੈ ਜਿਸ ਦਾ ਹਰ ਚੀਜ਼ ਹਿੱਸਾ ਹੈ, ਜਿਵੇਂ ਪੂਰੇ ਸਮੁੰਦਰ ਵਿਚ ਇਕ ਲਹਿਰ। ਹਉਮੈ ਉਹ ਆਦਤ ਹੈ ਜੋ ਕਹਿੰਦੀ ਹੈ, ਮੈਂ ਕੀਤਾ, ਇਹ ਮੇਰਾ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਦੋਹਾਂ ਨੂੰ ਜੋੜਦੇ ਹਨ। ਸਮੁੰਦਰ ਜਿੰਨਾ ਸਾਫ਼ ਦਿਸਦਾ ਹੈ, ਲਹਿਰ ਓਨਾ ਘੱਟ ਆਕੜਦੀ ਹੈ। ਲੰਗਰ ਦੀ ਧਰਤੀ ਉੱਤੇ ਬੈਠਾ ਅਕਬਰ ਇਸੇ ਗੱਲ ਦੀ ਜਿਊਂਦੀ ਜਾਗਦੀ ਤਸਵੀਰ ਹੈ। ਉਸ ਧਰਤੀ ਉੱਤੇ ਇਕ ਬਾਦਸ਼ਾਹ ਵੀ ਬੱਸ ਇਕ ਹੋਰ ਭੁੱਖਾ ਬੰਦਾ ਸੀ, ਕਿਉਂਕਿ ਉੱਥੇ ਹਰ ਕੋਈ ਇਕੋ ਨਿਜ਼ਾਮ ਦਾ ਹਿੱਸਾ ਸੀ। ਭਾਰਤ ਦਾ ਇਕ ਪੁਰਾਣਾ ਗ੍ਰੰਥ, ਅਸ਼ਟਾਵਕਰ ਗੀਤਾ, ਇਸੇ ਆਦਤ ਦੀ ਇਕ ਤਿੱਖੀ ਤਸਵੀਰ ਦਿੰਦਾ ਹੈ। ਉਹ ਕਹਿੰਦਾ ਹੈ ਕਿ ਮੈਂ ਕਰਨ ਵਾਲਾ ਹਾਂ, ਇਹ ਸੋਚ ਸੱਪ ਦੇ ਡੰਗ ਵਰਗੀ ਹੈ। ਇਸ ਦਾ ਜ਼ਹਿਰ ਸਾਨੂੰ ਚੰਗੇ ਵੇਲੇ ਹੰਕਾਰੀ ਬਣਾ ਦਿੰਦਾ ਹੈ, ਤੇ ਮਾੜੇ ਵੇਲੇ ਤੋੜ ਦਿੰਦਾ ਹੈ।", "b": "ਇਸ ਦਾ ਮਤਲਬ ਇਹ ਨਹੀਂ ਕਿ ਤੁਹਾਡੀ ਮਿਹਨਤ ਕੁਝ ਨਹੀਂ ਸੀ। ਤੁਸੀਂ ਮਿਹਨਤ ਕੀਤੀ, ਤੇ ਉਹ ਸੱਚ ਹੈ। ਮਤਲਬ ਇਹ ਹੈ ਕਿ ਤੁਹਾਡੀ ਮਿਹਨਤ ਇਕ ਵੱਡੀ ਕਹਾਣੀ ਦਾ ਇਕ ਹਿੱਸਾ ਸੀ। ਟਰਾਫ਼ੀ ਚੁੱਕਦੇ ਕ੍ਰਿਕਟ ਕਪਤਾਨ ਨੂੰ ਵੇਖੋ। ਚੰਗੇ ਕਪਤਾਨ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਟੀਮ, ਕੋਚ ਤੇ ਮੈਦਾਨ ਦੇ ਕਾਮਿਆਂ ਦਾ ਨਾਂ ਲੈਂਦੇ ਹਨ। ਉਹ ਜਾਣਦੇ ਹਨ ਕਿ ਉਸ ਟਰਾਫ਼ੀ ਉੱਤੇ ਬਹੁਤ ਸਾਰੇ ਹੱਥ ਹਨ। ਜੋ ਲੋਕ ਜੀਵਨ ਨੂੰ ਇਉਂ ਵੇਖਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਨਾਲ ਕੰਮ ਕਰਨਾ ਸੌਖਾ ਹੁੰਦਾ ਹੈ। ਉਹ ਵੱਧ ਧੰਨਵਾਦ ਕਰਦੇ ਹਨ, ਤੇ ਲੋਕ ਫਿਰ ਉਨ੍ਹਾਂ ਦੀ ਮਦਦ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹਨ। ਤੇ ਜਦੋਂ ਕੋਈ ਯੋਜਨਾ ਵਿਗੜਦੀ ਹੈ ਤਾਂ ਉਹ ਟੁੱਟਦੇ ਨਹੀਂ, ਕਿਉਂਕਿ ਉਨ੍ਹਾਂ ਨੇ ਕਦੇ ਮੰਨਿਆ ਹੀ ਨਹੀਂ ਸੀ ਕਿ ਸਭ ਕੁਝ ਉਨ੍ਹਾਂ ਦੇ ਆਪਣੇ ਹੱਥ ਵਿਚ ਹੈ। ਸ਼ੁਕਰਾਨਾ ਤੇ ਨਿਮਰਤਾ ਅਸਲ ਵਿਚ ਇਕੋ ਚੀਜ਼ ਹਨ, ਬੱਸ ਦੋ ਪਾਸਿਆਂ ਤੋਂ ਵੇਖੀ ਹੋਈ।", "t": "ਅੱਜ ਰਾਤ ਆਪਣੇ ਜੀਵਨ ਦੀ ਇਕ ਚੰਗੀ ਚੀਜ਼ ਬਾਰੇ ਸੋਚੋ। ਤਿੰਨ ਬੰਦਿਆਂ ਜਾਂ ਮੌਕਿਆਂ ਦੇ ਨਾਂ ਲਓ ਜਿਨ੍ਹਾਂ ਕਰਕੇ ਉਹ ਹੋ ਸਕੀ। ਫਿਰ ਉਨ੍ਹਾਂ ਵਿਚੋਂ ਇਕ ਦਾ ਧੰਨਵਾਦ ਕਰੋ।", "q": "ਤੁਹਾਡੀ ਟੀਮ ਦੇ ਪ੍ਰੋਜੈਕਟ ਨੂੰ ਇਨਾਮ ਮਿਲਿਆ ਹੈ। ਮੀਟਿੰਗ ਵਿਚ ਬੌਸ ਪੁੱਛਦਾ ਹੈ ਕਿ ਇਹ ਕਿਵੇਂ ਹੋਇਆ। ਤੁਸੀਂ ਕੀ ਕਹੋਗੇ?", "o": ["ਉਹ ਸਾਰੇ ਹਿੱਸੇ ਦੱਸੋਗੇ ਜੋ ਤੁਸੀਂ ਆਪ ਕੀਤੇ", "ਪਹਿਲਾਂ ਮਦਦ ਕਰਨ ਵਾਲਿਆਂ ਦੇ ਨਾਂ ਲਓਗੇ, ਫਿਰ ਆਪਣਾ ਹਿੱਸਾ ਦੱਸੋਗੇ", "ਕੁਝ ਨਹੀਂ ਕਹੋਗੇ, ਉਨ੍ਹਾਂ ਨੂੰ ਅੰਦਾਜ਼ਾ ਲਾਉਣ ਦਿਓਗੇ"], "y": "ਬਹੁਤ ਵਧੀਆ। ਪਹਿਲਾਂ ਦੂਜਿਆਂ ਦਾ ਨਾਂ ਲੈਣ ਨਾਲ ਤੁਸੀਂ ਛੋਟੇ ਨਹੀਂ ਹੁੰਦੇ। ਇਹ ਵਿਖਾਉਂਦਾ ਹੈ ਕਿ ਤੁਸੀਂ ਪੂਰਾ ਸਮੁੰਦਰ ਵੇਖਦੇ ਹੋ, ਸਿਰਫ਼ ਆਪਣੀ ਲਹਿਰ ਨਹੀਂ। ਲੋਕ ਉਸ ਬੰਦੇ ਨੂੰ ਯਾਦ ਰੱਖਦੇ ਹਨ ਜਿਸ ਨੇ ਸਿਹਰਾ ਵੰਡਿਆ, ਤੇ ਫਿਰ ਉਸ ਨਾਲ ਕੰਮ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹਨ।", "n": "ਇਹ ਬਹੁਤ ਇਨਸਾਨੀ ਜਵਾਬ ਹੈ। ਅਸੀਂ ਸਾਰੇ ਚਾਹੁੰਦੇ ਹਾਂ ਕਿ ਸਾਡੀ ਮਿਹਨਤ ਦਿਸੇ, ਤੇ ਉਸ ਨੂੰ ਦਿਸਣਾ ਵੀ ਚਾਹੀਦਾ ਹੈ। ਪਹਿਲਾਂ ਮਦਦ ਕਰਨ ਵਾਲਿਆਂ ਦੇ ਨਾਂ ਲੈ ਕੇ, ਫਿਰ ਆਪਣਾ ਹਿੱਸਾ ਦੱਸ ਕੇ ਵੇਖੋ। ਤੁਹਾਡਾ ਕੰਮ ਫਿਰ ਵੀ ਚਮਕੇਗਾ, ਬੱਸ ਹੁਣ ਸਾਰਿਆਂ ਦੇ ਕੰਮ ਨਾਲ, ਜਿਵੇਂ ਅਸਲ ਵਿਚ ਹੋਇਆ ਸੀ।"}, "comp1": {"ti": "ਉੱਚਾ, ਨੀਵਾਂ", "s": "ਤੁਸੀਂ ਫ਼ੋਨ ਖੋਲ੍ਹਦੇ ਹੋ। ਇਕ ਜਮਾਤੀ ਨੇ ਨਵੀਂ ਗੱਡੀ ਲਈ ਹੈ। ਇਕ ਰਿਸ਼ਤੇਦਾਰ ਕੈਨੇਡਾ ਚਲਾ ਗਿਆ ਹੈ। ਦਸ ਪਲਾਂ ਵਿਚ ਇਕ ਚੰਗਾ ਭਲਾ ਦਿਨ ਨਾਕਾਮ ਜ਼ਿੰਦਗੀ ਵਰਗਾ ਲੱਗਣ ਲੱਗ ਪੈਂਦਾ ਹੈ।", "m": "ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਨਾ ਕੋਈ ਉੱਚਾ ਹੈ, ਨਾ ਕੋਈ ਨੀਵਾਂ।", "k": "ਸੈਦਪੁਰ ਨਗਰ ਵਿਚ ਭਾਈ ਲਾਲੋ ਰਹਿੰਦੇ ਸਨ, ਇਕ ਤਰਖਾਣ ਜੋ ਆਪਣੇ ਹੱਥਾਂ ਦੀ ਕਿਰਤ ਨਾਲ ਰੋਟੀ ਕਮਾਉਂਦੇ ਸਨ। ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਉਸ ਨਗਰ ਵਿਚ ਆਏ, ਤਾਂ ਉਨ੍ਹਾਂ ਨੇ ਲਾਲੋ ਦੇ ਛੋਟੇ ਜਿਹੇ ਘਰ ਵਿਚ ਰਹਿਣਾ ਚੁਣਿਆ। ਨੇੜੇ ਹੀ ਮਲਿਕ ਭਾਗੋ ਰਹਿੰਦਾ ਸੀ, ਇਕ ਅਮੀਰ ਅਫ਼ਸਰ, ਜਿਸ ਨੇ ਵੱਡਾ ਭੋਜ ਰੱਖਿਆ ਤੇ ਆਲੇ ਦੁਆਲੇ ਦੇ ਸਾਰੇ ਸੰਤਾਂ ਨੂੰ ਸੱਦਿਆ। ਗੁਰੂ ਨਾਨਕ ਨਹੀਂ ਗਏ। ਨਾਰਾਜ਼ ਹੋ ਕੇ ਮਲਿਕ ਭਾਗੋ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸੱਦਵਾਇਆ ਤੇ ਪੁੱਛਿਆ ਕਿ ਉਹ ਏਨੇ ਵਧੀਆ ਖਾਣੇ ਨੂੰ ਛੱਡ ਕੇ ਇਕ ਗ਼ਰੀਬ ਦੀ ਸੁੱਕੀ ਰੋਟੀ ਕਿਉਂ ਪਸੰਦ ਕਰਦੇ ਹਨ। ਜਨਮਸਾਖੀ ਦੱਸਦੀ ਹੈ ਕਿ ਗੁਰੂ ਜੀ ਨੇ ਇਕ ਹੱਥ ਵਿਚ ਲਾਲੋ ਦੀ ਮੋਟੀ ਰੋਟੀ ਲਈ ਤੇ ਦੂਜੇ ਵਿਚ ਭਾਗੋ ਦਾ ਪਕਵਾਨ, ਤੇ ਦੋਹਾਂ ਨੂੰ ਨਿਚੋੜਿਆ। ਤਰਖਾਣ ਦੀ ਰੋਟੀ ਵਿਚੋਂ ਦੁੱਧ ਨਿਕਲਿਆ। ਭੋਜ ਦੇ ਪਕਵਾਨ ਵਿਚੋਂ ਲਹੂ।", "a": "ਇਸ ਪੰਕਤੀ ਤੋਂ ਠੀਕ ਪਹਿਲਾਂ ਗੁਰੂ ਨਾਨਕ ਕਈ ਅਜਿਹੀਆਂ ਚੀਜ਼ਾਂ ਗਿਣਾਉਂਦੇ ਹਨ ਜੋ ਪੂਰੀ ਤਰ੍ਹਾਂ ਸਾਡੇ ਵੱਸ ਵਿਚ ਨਹੀਂ। ਬੋਲਣਾ, ਚੁੱਪ ਰਹਿਣਾ, ਮੰਗਣਾ, ਦੇਣਾ, ਜਿਊਣਾ। ਜਦੋਂ ਸਾਡੇ ਕੋਲ ਜੋ ਹੈ ਉਸ ਦਾ ਏਨਾ ਵੱਡਾ ਹਿੱਸਾ ਸਾਨੂੰ ਮਿਲਿਆ ਹੋਇਆ ਹੈ, ਤਾਂ ਲੋਕਾਂ ਨੂੰ ਉੱਚਾ ਨੀਵਾਂ ਕਹਿਣ ਦਾ ਕੋਈ ਮਤਲਬ ਨਹੀਂ ਰਹਿੰਦਾ। ਸਾਖੀ ਇਸ ਨੂੰ ਇਕ ਤਸਵੀਰ ਬਣਾ ਦਿੰਦੀ ਹੈ। ਭਾਗੋ ਕੋਲ ਅਹੁਦਾ ਤੇ ਦੌਲਤ ਸੀ। ਲਾਲੋ ਕੋਲ ਛੋਟਾ ਘਰ ਤੇ ਇਮਾਨਦਾਰ ਹੱਥ ਸਨ। ਗੁਰੂ ਨਾਨਕ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਇਕ ਵੱਖਰੀ ਤੱਕੜੀ ਉੱਤੇ ਤੋਲਿਆ, ਤੇ ਉਸ ਤੱਕੜੀ ਉੱਤੇ ਤਰਖਾਣ ਉੱਚਾ ਨਿਕਲਿਆ। ਮਨੋਵਿਗਿਆਨੀ ਲਿਓਨ ਫ਼ੈਸਟਿੰਗਰ ਨੇ ਦੱਸਿਆ ਕਿ ਇਨਸਾਨ ਦੂਜਿਆਂ ਨੂੰ ਵੇਖ ਕੇ ਆਪਣੇ ਆਪ ਨੂੰ ਪਰਖਦਾ ਹੈ। ਇਹ ਕੁਦਰਤੀ ਹੈ, ਹਰ ਕੋਈ ਕਰਦਾ ਹੈ। ਮੁਸ਼ਕਲ ਉਸ ਤੱਕੜੀ ਦੀ ਹੈ ਜੋ ਅਸੀਂ ਵਰਤਦੇ ਹਾਂ। ਜਦੋਂ ਅਸੀਂ ਸਿਰਫ਼ ਪੈਸਾ, ਸ਼ਕਲ ਤੇ ਫ਼ਾਲੋਅਰ ਤੋਲਦੇ ਹਾਂ, ਤਾਂ ਕੋਈ ਨਾ ਕੋਈ ਸਾਡੇ ਤੋਂ ਉੱਤੇ ਮਿਲ ਹੀ ਜਾਂਦਾ ਹੈ, ਤੇ ਸਾਨੂੰ ਕਦੇ ਕਾਫ਼ੀ ਨਹੀਂ ਲੱਗਦਾ।", "b": "ਵੇਖੋ ਅਸੀਂ ਆਮ ਤੌਰ ਉੱਤੇ ਤੁਲਨਾ ਕਿੱਥੇ ਕਰਦੇ ਹਾਂ। ਸੋਸ਼ਲ ਮੀਡੀਆ ਹਰ ਕਿਸੇ ਦੇ ਸਭ ਤੋਂ ਚੰਗੇ ਦਸ ਪਲ ਵਿਖਾਉਂਦਾ ਹੈ: ਘੁੰਮਣਾ, ਮੁੰਦਰੀ, ਨਵੀਂ ਗੱਡੀ। ਤੁਸੀਂ ਆਪਣੇ ਪੂਰੇ ਸਾਧਾਰਨ ਦਿਨ ਦੀ ਤੁਲਨਾ ਉਨ੍ਹਾਂ ਦੇ ਸਭ ਤੋਂ ਚਮਕੀਲੇ ਪਲ ਨਾਲ ਕਰ ਰਹੇ ਹੋ। ਇਹ ਬਰਾਬਰ ਦਾ ਮੁਕਾਬਲਾ ਨਹੀਂ, ਇਸ ਲਈ ਨਤੀਜਾ ਕਦੇ ਸੱਚ ਨਹੀਂ ਹੁੰਦਾ। ਇਹ ਇਉਂ ਹੈ ਜਿਵੇਂ ਆਪਣੀ ਕੱਚੀ ਕਾਪੀ ਦੀ ਤੁਲਨਾ ਕਿਸੇ ਦੀ ਛਪੀ ਹੋਈ ਕਿਤਾਬ ਨਾਲ ਕਰਨੀ। ਤੇ ਇਕ ਦੂਜਾ ਜਾਲ ਵੀ ਹੈ। ਕੈਨੇਡਾ ਵਾਲਾ ਰਿਸ਼ਤੇਦਾਰ ਸ਼ਾਇਦ ਇਕੱਲਾ ਹੋਵੇ। ਨਵੀਂ ਗੱਡੀ ਵਾਲਾ ਜਮਾਤੀ ਸ਼ਾਇਦ ਕਰਜ਼ੇ ਵਿਚ ਡੁੱਬਾ ਹੋਵੇ। ਅਸੀਂ ਤਸਵੀਰ ਵੇਖਦੇ ਹਾਂ, ਉਸ ਦੀ ਕੀਮਤ ਨਹੀਂ। ਜਦੋਂ ਅਸੀਂ ਉੱਚ ਨੀਚ ਤੋਲਣਾ ਛੱਡਦੇ ਹਾਂ, ਤਾਂ ਕੁਝ ਚੰਗਾ ਹੁੰਦਾ ਹੈ। ਅਸੀਂ ਦੂਜਿਆਂ ਲਈ ਸੱਚਮੁੱਚ ਖ਼ੁਸ਼ ਹੋ ਸਕਦੇ ਹਾਂ, ਤੇ ਆਪਣੇ ਰਾਹ ਲਈ ਵੱਧ ਤਾਕਤ ਬਚਦੀ ਹੈ।", "t": "ਅੱਜ ਜਦੋਂ ਵੀ ਤੁਲਨਾ ਸ਼ੁਰੂ ਹੋਵੇ, ਉਸ ਨੂੰ ਫੜ ਲਓ। ਮਨ ਵਿਚ ਹੌਲੀ ਜਿਹੀ ਕਹੋ, ਰਾਹ ਵੱਖਰਾ ਹੈ, ਉੱਚਾ ਨੀਵਾਂ ਨਹੀਂ। ਫਿਰ ਪੰਜ ਮਿੰਟ ਲਈ ਫ਼ੋਨ ਰੱਖ ਦਿਓ।", "q": "ਸਕੂਲ ਦੀ ਇਕ ਸਹੇਲੀ ਨੇ ਵਿਦੇਸ਼ ਵਿਚ ਹੋਏ ਆਪਣੇ ਵਿਆਹ ਦੀਆਂ ਤਸਵੀਰਾਂ ਪਾਈਆਂ ਹਨ। ਤੁਹਾਨੂੰ ਹਲਕੀ ਜਿਹੀ ਚੁਭਨ ਹੁੰਦੀ ਹੈ। ਸਭ ਤੋਂ ਵੱਧ ਕੀ ਮਦਦ ਕਰੇਗਾ?", "o": ["ਉਸ ਦੀਆਂ ਤਸਵੀਰਾਂ ਵਾਰ ਵਾਰ ਵੇਖਣੀਆਂ", "ਉਸ ਨੂੰ ਅਨਫ਼ਾਲੋ ਕਰ ਦੇਣਾ ਤਾਂ ਜੋ ਕਦੇ ਨਾ ਦਿਸੇ", "ਉਸ ਨੂੰ ਪਿਆਰ ਭਰਿਆ ਸੁਨੇਹਾ ਭੇਜਣਾ, ਫਿਰ ਆਪਣੇ ਦਿਨ ਵਿਚ ਮੁੜ ਆਉਣਾ"], "y": "ਇਹ ਵੱਡੇ ਦਿਲ ਵਾਲੀ ਚੋਣ ਹੈ। ਪਿਆਰ ਭੇਜਣ ਨਾਲ ਚੁਭਨ ਕਿਸੇ ਚੰਗੀ ਚੀਜ਼ ਵਿਚ ਬਦਲ ਜਾਂਦੀ ਹੈ, ਤੇ ਆਪਣੇ ਦਿਨ ਵਿਚ ਮੁੜਨ ਨਾਲ ਤੁਸੀਂ ਆਪਣੇ ਰਾਹ ਉੱਤੇ ਰਹਿੰਦੇ ਹੋ। ਰਾਹ ਵੱਖਰਾ ਹੈ, ਉੱਚਾ ਨੀਵਾਂ ਨਹੀਂ।", "n": "ਇਹ ਸੱਚਾ ਜਵਾਬ ਹੈ, ਤੇ ਬਹੁਤ ਆਮ ਵੀ। ਚੁਭਨ ਅਸਲੀ ਹੈ, ਤੇ ਉਸ ਨੂੰ ਮਹਿਸੂਸ ਕਰਨਾ ਗ਼ਲਤ ਨਹੀਂ। ਪਰ ਵਾਰ ਵਾਰ ਵੇਖਣ ਨਾਲ ਉਹ ਵਧਦੀ ਹੈ, ਤੇ ਲੋਕਾਂ ਤੋਂ ਟੁੱਟ ਜਾਣ ਨਾਲ ਅਸੀਂ ਹੋਰ ਇਕੱਲੇ ਹੋ ਸਕਦੇ ਹਾਂ। ਇਕ ਪਿਆਰ ਭਰਿਆ ਸੁਨੇਹਾ ਭੇਜ ਕੇ ਆਪਣੇ ਦਿਨ ਵਿਚ ਮੁੜ ਕੇ ਵੇਖੋ। ਚੁਭਨ ਅਕਸਰ ਇਸ ਨਾਲ ਛੇਤੀ ਮਿਟ ਜਾਂਦੀ ਹੈ।"}, "accept1": {"ti": "ਮੇਰੇ ਹੱਥ ਵਿਚ ਕੀ ਹੈ?", "s": "ਤੁਸੀਂ ਹਫ਼ਤਿਆਂ ਤਕ ਤਿਆਰੀ ਕਰਦੇ ਹੋ। ਇੰਟਰਵਿਊ ਵਾਲੇ ਦਿਨ ਗੱਡੀ ਦੋ ਘੰਟੇ ਲੇਟ ਹੈ। ਤੁਸੀਂ ਪਲੇਟਫ਼ਾਰਮ ਉੱਤੇ ਖੜ੍ਹੇ ਹੋ, ਤੇ ਇਕ ਗੱਡੀ ਉੱਤੇ ਲਾਲ ਪੀਲੇ ਹੋ ਰਹੇ ਹੋ।", "m": "ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਹੁਕਮ ਦੇ ਨਾਲ ਕਦਮ ਮਿਲਾ ਕੇ ਚੱਲੋ। ਇਹ ਸਾਡੇ ਅੰਦਰ ਹੀ ਲਿਖਿਆ ਹੋਇਆ ਹੈ।", "k": "ਕਈ ਸਾਲਾਂ ਤਕ ਗੁਰੂ ਨਾਨਕ ਦੂਰ ਦੂਰ ਤਕ ਘੁੰਮੇ, ਪੂਰਬ ਤੇ ਦੱਖਣ, ਪਹਾੜਾਂ ਵਿਚ ਤੇ ਪੱਛਮ ਤਕ, ਅਕਸਰ ਪੈਦਲ। ਭਾਈ ਗੁਰਦਾਸ, ਜਿਨ੍ਹਾਂ ਨੇ ਉਨ੍ਹਾਂ ਬਾਰੇ ਬੱਸ ਇਕ ਪੀੜ੍ਹੀ ਬਾਅਦ ਲਿਖਿਆ, ਦੱਸਦੇ ਹਨ ਕਿ ਇਨ੍ਹਾਂ ਲੰਮੀਆਂ ਯਾਤਰਾਵਾਂ ਦੇ ਮੁੱਕਣ ਉੱਤੇ ਕੀ ਹੋਇਆ। ਗੁਰੂ ਨਾਨਕ ਰਾਵੀ ਦਰਿਆ ਦੇ ਕੰਢੇ ਕਰਤਾਰਪੁਰ ਮੁੜ ਆਏ। ਉਨ੍ਹਾਂ ਨੇ ਉਦਾਸੀ ਭੇਖ ਲਾਹ ਦਿੱਤਾ ਤੇ ਸਾਧਾਰਨ ਗ੍ਰਿਹਸਤੀ ਕੱਪੜੇ ਪਾ ਲਏ। ਸਿੱਖ ਇਤਿਹਾਸ ਅੱਗੇ ਦੱਸਦਾ ਹੈ ਕਿ ਉਹ ਉੱਥੇ ਕਿਸੇ ਵੀ ਪਿੰਡ ਵਾਲੇ ਵਾਂਗ ਖੇਤੀ ਕਰਕੇ ਜਿਊਂਦੇ ਸਨ, ਤੇ ਹਰ ਸਵੇਰ ਸ਼ਾਮ ਲੋਕ ਇਕੱਠੇ ਬੈਠ ਕੇ ਗਾਉਂਦੇ ਤੇ ਵਿਚਾਰ ਕਰਦੇ ਸਨ। ਜੋ ਗੁਰੂ ਦੇਸ਼ ਦੇਸ਼ ਪੈਦਲ ਘੁੰਮੇ ਸਨ, ਹੁਣ ਬਾਕੀ ਸਾਰਿਆਂ ਵਾਂਗ ਮੀਂਹ ਦੀ ਉਡੀਕ ਕਰਦੇ ਸਨ।", "a": "ਗੁਰੂ ਨਾਨਕ ਨੇ ਹੁਣੇ ਪੁੱਛਿਆ ਸੀ ਕਿ ਇਨਸਾਨ ਸਚਿਆਰ ਕਿਵੇਂ ਜੀਵੇ। ਇਹ ਉਸ ਦਾ ਜਵਾਬ ਹੈ: ਹੁਕਮ ਨਾਲ ਕਦਮ ਮਿਲਾ ਕੇ ਚੱਲੋ, ਯਾਨੀ ਜੋ ਜਿਵੇਂ ਹੈ ਉਸ ਨਾਲ ਨਾ ਲੜੋ। ਇਹ ਦਰਿਆ ਦੇ ਵਹਾਅ ਨਾਲ ਤਰਨ ਵਰਗਾ ਹੈ। ਤੁਸੀਂ ਫਿਰ ਵੀ ਤਰਦੇ ਹੋ, ਤੇ ਪੂਰੇ ਜ਼ੋਰ ਨਾਲ ਤਰਦੇ ਹੋ, ਬੱਸ ਧਾਰਾ ਦੇ ਉਲਟ ਤਾਕਤ ਬਰਬਾਦ ਨਹੀਂ ਕਰਦੇ। ਕਰਤਾਰਪੁਰ ਵਿਖਾਉਂਦਾ ਹੈ ਕਿ ਅਸਲ ਜੀਵਨ ਵਿਚ ਇਹ ਕਿਵੇਂ ਦਿਸਦਾ ਹੈ। ਕਿਸਾਨ ਮੀਂਹ, ਧੁੱਪ ਜਾਂ ਰੁੱਤ ਨੂੰ ਹੁਕਮ ਨਹੀਂ ਦੇ ਸਕਦਾ। ਉਹ ਬੱਸ ਆਪਣਾ ਹਿੱਸਾ ਚੰਗੀ ਤਰ੍ਹਾਂ ਕਰ ਸਕਦਾ ਹੈ, ਤੇ ਅਸਮਾਨ ਜੋ ਕਰੇ ਉਸ ਨੂੰ ਮੰਨ ਸਕਦਾ ਹੈ। ਲਗਭਗ ਦੋ ਹਜ਼ਾਰ ਸਾਲ ਪਹਿਲਾਂ ਯੂਨਾਨ ਦੇ ਉਸਤਾਦ ਐਪਿਕਟੀਟਸ ਨੇ ਆਪਣੀ ਛੋਟੀ ਜਿਹੀ ਕਿਤਾਬ ਇਸੇ ਗੱਲ ਨਾਲ ਸ਼ੁਰੂ ਕੀਤੀ ਸੀ। ਕੁਝ ਚੀਜ਼ਾਂ ਸਾਡੇ ਵੱਸ ਵਿਚ ਹਨ, ਕੁਝ ਨਹੀਂ। ਸਾਡੀ ਕੋਸ਼ਿਸ਼ ਤੇ ਸਾਡਾ ਜਵਾਬ ਸਾਡਾ ਹੈ। ਮੌਸਮ, ਗੱਡੀ ਤੇ ਦੂਜਿਆਂ ਦੇ ਫ਼ੈਸਲੇ ਸਾਡੇ ਨਹੀਂ।", "b": "ਮੰਨ ਲੈਣਾ ਹਾਰ ਮੰਨ ਲੈਣਾ ਨਹੀਂ। ਪਲੇਟਫ਼ਾਰਮ ਉੱਤੇ ਤੁਹਾਡਾ ਹਿੱਸਾ ਛੋਟਾ ਹੈ, ਪਰ ਅਸਲੀ ਹੈ। ਦਫ਼ਤਰ ਫ਼ੋਨ ਕਰੋ, ਸੁਨੇਹਾ ਭੇਜੋ, ਸਾਹ ਲਓ, ਤੇ ਪਹੁੰਚ ਕੇ ਸ਼ਾਂਤੀ ਨਾਲ ਅੰਦਰ ਜਾਓ। ਗੱਡੀ ਉੱਤੇ ਗੁੱਸੇ ਨਾਲ ਗੱਡੀ ਦਾ ਕੁਝ ਨਹੀਂ ਵਿਗੜਦਾ। ਉਹ ਬੱਸ ਤੁਹਾਡੀ ਤਾਕਤ ਖਾਂਦਾ ਹੈ, ਤੇ ਇੰਟਰਵਿਊ ਸ਼ੁਰੂ ਹੋਣ ਤੋਂ ਪਹਿਲਾਂ ਹੀ ਉਸ ਨੂੰ ਵਿਗਾੜ ਦਿੰਦਾ ਹੈ। ਜੋ ਲੋਕ ਦੋ ਸੂਚੀਆਂ ਰੱਖਣਾ ਸਿੱਖ ਲੈਂਦੇ ਹਨ, ਮੇਰੇ ਹੱਥ ਵਿਚ ਤੇ ਮੇਰੇ ਹੱਥ ਵਿਚ ਨਹੀਂ, ਉਹ ਘੱਟ ਉਤਸ਼ਾਹੀ ਨਹੀਂ ਹੁੰਦੇ। ਉਹ ਅਕਸਰ ਵੱਧ ਕਾਮਯਾਬ ਹੁੰਦੇ ਹਨ, ਕਿਉਂਕਿ ਉਨ੍ਹਾਂ ਦੀ ਸਾਰੀ ਤਾਕਤ ਉੱਥੇ ਹੀ ਲੱਗਦੀ ਹੈ ਜਿੱਥੇ ਫ਼ਰਕ ਪੈ ਸਕਦਾ ਹੈ। ਉਹ ਚੰਗੀ ਨੀਂਦ ਵੀ ਸੌਂਦੇ ਹਨ, ਕਿਉਂਕਿ ਉਹ ਉਹ ਭਾਰ ਚੁੱਕਣਾ ਛੱਡ ਦਿੰਦੇ ਹਨ ਜੋ ਕਦੇ ਉਨ੍ਹਾਂ ਦਾ ਸੀ ਹੀ ਨਹੀਂ।", "t": "ਕਿਸੇ ਇਕ ਫ਼ਿਕਰ ਬਾਰੇ ਸੋਚੋ। ਦੋ ਸੂਚੀਆਂ ਬਣਾਓ। ਮੇਰੇ ਹੱਥ ਵਿਚ, ਤੇ ਮੇਰੇ ਹੱਥ ਵਿਚ ਨਹੀਂ। ਪਹਿਲੀ ਸੂਚੀ ਵਿਚੋਂ ਇਕ ਛੋਟਾ ਕੰਮ ਅੱਜ ਕਰ ਲਓ।", "q": "ਅੱਜ ਤੁਹਾਡੀ ਭੈਣ ਦਾ ਵਿਆਹ ਹੈ, ਤੇ ਤੇਜ਼ ਮੀਂਹ ਨਾਲ ਬਾਗ਼ ਵਾਲੀ ਥਾਂ ਵਿਚ ਪਾਣੀ ਭਰ ਗਿਆ ਹੈ। ਸਾਰੇ ਘਬਰਾ ਰਹੇ ਹਨ। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਮੌਸਮ ਦੀ ਸ਼ਿਕਾਇਤ ਕਰਦੇ ਰਹੋਗੇ", "ਸਾਮਾਨ ਅੰਦਰ ਲਿਜਾਣ ਵਿਚ ਮਦਦ ਕਰੋਗੇ ਤੇ ਸਾਰਿਆਂ ਦਾ ਮਨ ਹੌਲਾ ਕਰੋਗੇ", "ਥਾਂ ਚੁਣਨ ਵਾਲੇ ਉੱਤੇ ਦੋਸ਼ ਲਾਓਗੇ"], "y": "ਬਹੁਤ ਵਧੀਆ। ਤੁਸੀਂ ਮੀਂਹ ਨੂੰ ਛੱਡ ਦਿੱਤਾ, ਜੋ ਕਿਸੇ ਦੇ ਹੱਥ ਵਿਚ ਸੀ ਹੀ ਨਹੀਂ, ਤੇ ਆਪਣੀ ਸਾਰੀ ਤਾਕਤ ਉਸ ਵਿਚ ਲਾਈ ਜੋ ਹੱਥ ਵਿਚ ਸੀ। ਹੁਕਮ ਨਾਲ ਚੱਲਣਾ ਬਿਲਕੁਲ ਇਉਂ ਹੀ ਦਿਸਦਾ ਹੈ।", "n": "ਇਹ ਬਿਲਕੁਲ ਸਮਝ ਆਉਂਦਾ ਹੈ। ਜਦੋਂ ਕੁਝ ਜ਼ਰੂਰੀ ਵਿਗੜਦਾ ਹੈ, ਤਾਂ ਅਸੀਂ ਕਿਸੇ ਉੱਤੇ ਦੋਸ਼ ਲਾਉਣਾ ਚਾਹੁੰਦੇ ਹਾਂ। ਪਰ ਮੀਂਹ ਕੁਝ ਨਹੀਂ ਸੁਣੇਗਾ। ਆਪਣੀ ਤਾਕਤ ਉੱਥੇ ਲਾ ਕੇ ਵੇਖੋ ਜਿੱਥੇ ਉਹ ਕੰਮ ਆਵੇ: ਸਾਮਾਨ ਅੰਦਰ ਲਿਜਾਓ, ਦੂਜਿਆਂ ਨੂੰ ਮੁਸਕਰਾਉਣ ਵਿਚ ਮਦਦ ਕਰੋ। ਦਿਨ ਅਜੇ ਵੀ ਸੋਹਣਾ ਹੋ ਸਕਦਾ ਹੈ।"}, "content1": {"ti": "ਕਿੰਨਾ ਕਾਫ਼ੀ ਹੈ?", "s": "ਤੁਸੀਂ ਨਵਾਂ ਫ਼ੋਨ ਖ਼ਰੀਦਦੇ ਹੋ। ਇਕ ਹਫ਼ਤਾ ਬਹੁਤ ਚੰਗਾ ਲੱਗਦਾ ਹੈ। ਫਿਰ ਉਸ ਤੋਂ ਨਵਾਂ ਮਾਡਲ ਆ ਜਾਂਦਾ ਹੈ, ਤੇ ਹੱਥ ਵਾਲਾ ਫ਼ੋਨ ਅਚਾਨਕ ਪੁਰਾਣਾ ਲੱਗਣ ਲੱਗ ਪੈਂਦਾ ਹੈ।", "m": "ਸੰਤੋਖ ਨੂੰ ਆਪਣੀਆਂ ਮੁੰਦਰਾਂ ਬਣਾਓ, ਇਮਾਨਦਾਰ ਮਿਹਨਤ ਨੂੰ ਆਪਣਾ ਖੱਪਰ ਤੇ ਝੋਲੀ, ਤੇ ਧਿਆਨ ਨੂੰ ਆਪਣੀ ਬਿਭੂਤ।", "k": "ਲਾਹੌਰ ਵਿਚ ਦੁਨੀ ਚੰਦ ਰਹਿੰਦੇ ਸਨ, ਬਹੁਤ ਵੱਡੀ ਦੌਲਤ ਵਾਲੇ ਬੰਦੇ। ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਨਾਨਕ ਨੂੰ ਬੜੇ ਆਦਰ ਨਾਲ ਆਪਣੇ ਘਰ ਸੱਦਿਆ। ਜਾਣ ਵੇਲੇ ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਇਕ ਛੋਟੀ ਜਿਹੀ ਸੂਈ ਦਿੱਤੀ ਤੇ ਇਕ ਕੰਮ ਕਿਹਾ। ਇਹ ਮੇਰੇ ਲਈ ਸਾਂਭ ਕੇ ਰੱਖਣੀ, ਤੇ ਅਗਲੇ ਜਹਾਨ ਵਿਚ ਮੈਨੂੰ ਮੋੜ ਦੇਣੀ। ਦੁਨੀ ਚੰਦ ਨੇ ਮਾਣ ਨਾਲ ਹਾਂ ਕਹਿ ਦਿੱਤੀ ਤੇ ਸੂਈ ਆਪਣੀ ਪਤਨੀ ਕੋਲ ਲੈ ਗਏ। ਪਤਨੀ ਨੇ ਉਨ੍ਹਾਂ ਵੱਲ ਵੇਖਿਆ ਤੇ ਇਕ ਸਿੱਧਾ ਜਿਹਾ ਸਵਾਲ ਪੁੱਛਿਆ। ਮਰਨ ਤੋਂ ਬਾਅਦ ਤੁਸੀਂ ਇਕ ਸੂਈ ਵੀ ਨਾਲ ਕਿਵੇਂ ਲੈ ਜਾਓਗੇ? ਦੁਨੀ ਚੰਦ ਚੁੱਪ ਹੋ ਗਏ। ਜੇ ਉਹ ਇਕ ਸੂਈ ਵੀ ਨਹੀਂ ਲੈ ਜਾ ਸਕਦੇ, ਤਾਂ ਬਾਕੀ ਸਭ ਕੁਝ ਦਾ ਕੀ? ਉਹ ਗੁਰੂ ਜੀ ਕੋਲ ਮੁੜੇ, ਤੇ ਧਿਆਨ ਨਾਲ ਸੁਣਿਆ।", "a": "ਗੁਰੂ ਨਾਨਕ ਜੋਗੀਆਂ ਨਾਲ ਗੱਲ ਕਰ ਰਹੇ ਹਨ, ਜੋ ਆਪਣੇ ਰਾਹ ਦੀ ਨਿਸ਼ਾਨੀ ਵਜੋਂ ਖ਼ਾਸ ਮੁੰਦਰਾਂ ਪਾਉਂਦੇ ਸਨ ਤੇ ਖੱਪਰ ਰੱਖਦੇ ਸਨ। ਉਹ ਕਹਿੰਦੇ ਹਨ ਕਿ ਅਸਲੀ ਨਿਸ਼ਾਨੀਆਂ ਇਨਸਾਨ ਦੇ ਅੰਦਰ ਹੁੰਦੀਆਂ ਹਨ। ਪਹਿਲੀ ਜੋ ਉਹ ਗਿਣਾਉਂਦੇ ਹਨ, ਉਹ ਹੈ ਸੰਤੋਖ। ਜੋ ਹੈ ਉਸ ਵਿਚ ਸ਼ਾਂਤੀ, ਤੇ ਨਾਲ ਇਮਾਨਦਾਰ ਮਿਹਨਤ। ਸਾਖੀ ਵਾਲੀ ਸੂਈ ਛੋਟੀ ਜਿਹੀ ਹੈ, ਲਗਭਗ ਹਾਸੇ ਵਾਲੀ, ਤੇ ਇਹੀ ਉਸ ਦੀ ਤਾਕਤ ਹੈ। ਇਕ ਛੋਟੀ ਜਿਹੀ ਚੀਜ਼ ਨਾਲ ਉਹ ਵਿਖਾ ਦਿੰਦੀ ਹੈ ਕਿ ਅਸੀਂ ਕਿਸੇ ਚੀਜ਼ ਨੂੰ ਸਦਾ ਲਈ ਫੜ ਕੇ ਨਹੀਂ ਰੱਖ ਸਕਦੇ। ਦੁਨੀ ਚੰਦ ਨੂੰ ਆਪਣਾ ਘਰ ਛੱਡਣ ਦੀ ਲੋੜ ਨਹੀਂ ਸੀ। ਉਨ੍ਹਾਂ ਨੂੰ ਇਹ ਮੰਨਣਾ ਛੱਡਣਾ ਸੀ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਘਰ ਹੀ ਉਹ ਹਨ। ਸੰਤੋਖ ਇਹੀ ਤਬਦੀਲੀ ਹੈ: ਚੀਜ਼ਾਂ ਦੇ ਮਾਲਕ ਬਣਨ ਤੋਂ, ਉਨ੍ਹਾਂ ਨੂੰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਵਰਤਣ ਤੇ ਵੰਡਣ ਤਕ।", "b": "ਮਨੋਵਿਗਿਆਨੀ ਇਸ ਮੁਸ਼ਕਲ ਨੂੰ ਟਰੈੱਡਮਿਲ ਦੀ ਤਸਵੀਰ ਨਾਲ ਸਮਝਾਉਂਦੇ ਹਨ। ਅਸੀਂ ਤੇਜ਼ ਦੌੜਦੇ ਹਾਂ ਤੇ ਵੱਧ ਕਮਾਉਂਦੇ ਹਾਂ, ਪਰ ਹਰ ਨਵੀਂ ਚੀਜ਼ ਦੀ ਬਹੁਤ ਛੇਤੀ ਆਦਤ ਪੈ ਜਾਂਦੀ ਹੈ, ਇਸ ਲਈ ਖ਼ੁਸ਼ੀ ਉੱਥੇ ਦੀ ਉੱਥੇ ਰਹਿੰਦੀ ਹੈ। ਨਵਾਂ ਫ਼ੋਨ ਇਕ ਹਫ਼ਤਾ ਬਹੁਤ ਚੰਗਾ ਲੱਗਦਾ ਹੈ। ਵੱਡੀ ਤਨਖ਼ਾਹ ਇਕ ਮਹੀਨਾ ਖ਼ਾਸ ਲੱਗਦੀ ਹੈ। ਫਿਰ ਮੰਜ਼ਿਲ ਫਿਰ ਅੱਗੇ ਖਿਸਕ ਜਾਂਦੀ ਹੈ। ਸੰਤੋਖ ਦਾ ਮਤਲਬ ਵਧਣਾ ਛੱਡ ਦੇਣਾ ਨਹੀਂ। ਤੁਸੀਂ ਚੰਗੀ ਨੌਕਰੀ ਜਾਂ ਵੱਡਾ ਘਰ ਚਾਹ ਸਕਦੇ ਹੋ। ਫ਼ਰਕ ਇਸ ਵਿਚ ਹੈ ਕਿ ਵਧਦੇ ਵੇਲੇ ਤੁਸੀਂ ਕਿੱਥੇ ਖੜ੍ਹੇ ਹੋ। ਮੇਰੇ ਕੋਲ ਕਾਫ਼ੀ ਹੈ, ਤੇ ਮੈਂ ਅੱਗੇ ਬਣਾ ਰਿਹਾ ਹਾਂ, ਇੱਥੋਂ। ਜਦ ਤਕ ਉਹ ਨਹੀਂ ਮਿਲਦਾ ਮੈਂ ਕੁਝ ਨਹੀਂ, ਇੱਥੋਂ ਨਹੀਂ। ਪਹਿਲੀ ਥਾਂ ਤੋਂ ਜੀਵਨ ਇਕ ਸਫ਼ਰ ਲੱਗਦਾ ਹੈ। ਦੂਜੀ ਤੋਂ, ਇਕ ਅਜਿਹੀ ਦੌੜ ਜਿਸ ਵਿਚ ਤੁਸੀਂ ਸਦਾ ਹਾਰ ਰਹੇ ਹੋ।", "t": "ਅਗਲੀ ਚੀਜ਼ ਖ਼ਰੀਦਣ ਤੋਂ ਪਹਿਲਾਂ ਇਕ ਦਿਨ ਰੁਕੋ। ਅੱਜ ਰਾਤ ਆਪਣੀਆਂ ਤਿੰਨ ਅਜਿਹੀਆਂ ਚੀਜ਼ਾਂ ਗਿਣੋ ਜਿਨ੍ਹਾਂ ਦਾ ਤੁਸੀਂ ਕਦੇ ਸੁਪਨਾ ਵੇਖਦੇ ਸੀ।", "q": "ਤੁਹਾਡਾ ਫ਼ੋਨ ਠੀਕ ਚੱਲ ਰਿਹਾ ਹੈ, ਪਰ ਚੰਗੇ ਕੈਮਰੇ ਵਾਲਾ ਨਵਾਂ ਮਾਡਲ ਆਇਆ ਹੈ। ਤੁਹਾਡੇ ਸਾਰੇ ਦੋਸਤ ਲੈ ਰਹੇ ਹਨ। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਅੱਜ ਹੀ ਕਿਸ਼ਤਾਂ ਉੱਤੇ ਖ਼ਰੀਦ ਲਓਗੇ", "ਇਕ ਮਹੀਨਾ ਰੁਕੋਗੇ ਤੇ ਵੇਖੋਗੇ ਕਿ ਉਦੋਂ ਵੀ ਚਾਹੀਦਾ ਹੈ ਕਿ ਨਹੀਂ", "ਮਾੜਾ ਮਹਿਸੂਸ ਕਰੋਗੇ ਕਿ ਤੁਸੀਂ ਨਹੀਂ ਲੈ ਸਕਦੇ"], "y": "ਬਹੁਤ ਸਿਆਣਪ। ਇਕ ਮਹੀਨਾ ਰੁਕਣ ਨਾਲ ਜੋਸ਼ ਬਹਿ ਜਾਂਦਾ ਹੈ, ਤੇ ਤੁਸੀਂ ਵੇਖ ਸਕਦੇ ਹੋ ਕਿ ਇਹ ਅਸਲੀ ਲੋੜ ਸੀ ਜਾਂ ਬੱਸ ਟਰੈੱਡਮਿਲ। ਅਕਸਰ ਇੱਛਾ ਆਪੇ ਚਲੀ ਜਾਂਦੀ ਹੈ, ਤੇ ਪਤਾ ਲੱਗਦਾ ਹੈ ਕਿ ਤੁਹਾਡੇ ਕੋਲ ਪਹਿਲਾਂ ਹੀ ਕਾਫ਼ੀ ਸੀ।", "n": "ਇਹ ਬਹੁਤ ਅਸਲੀ ਅਹਿਸਾਸ ਹੈ। ਨਵੀਆਂ ਚੀਜ਼ਾਂ ਇਸ ਤਰ੍ਹਾਂ ਵਿਖਾਈਆਂ ਜਾਂਦੀਆਂ ਹਨ ਕਿ ਮਨ ਨਾ ਮੰਨੇ, ਤੇ ਜਦੋਂ ਦੋਸਤਾਂ ਕੋਲ ਹੋਣ ਤਾਂ ਹੋਰ ਔਖਾ ਹੁੰਦਾ ਹੈ। ਫ਼ੈਸਲੇ ਤੋਂ ਪਹਿਲਾਂ ਇਕ ਮਹੀਨਾ ਰੁਕ ਕੇ ਵੇਖੋ। ਜੇ ਉਦੋਂ ਵੀ ਲੋੜ ਹੋਵੇ, ਤਾਂ ਸਾਫ਼ ਮਨ ਨਾਲ ਖ਼ਰੀਦੋ। ਜੇ ਨਹੀਂ, ਤਾਂ ਤੁਸੀਂ ਹੁਣੇ ਹੁਣੇ ਟਰੈੱਡਮਿਲ ਤੋਂ ਉੱਤਰ ਗਏ।"}, "listen1": {"ti": "ਪਹਿਲਾਂ ਸੁਣੋ", "s": "ਤੁਹਾਡੀ ਸਹੇਲੀ ਆਪਣੇ ਮਾੜੇ ਦਿਨ ਦੀ ਗੱਲ ਸ਼ੁਰੂ ਕਰਦੀ ਹੈ। ਉਸ ਦੇ ਮੁਕਾਉਣ ਤੋਂ ਪਹਿਲਾਂ ਤੁਸੀਂ ਕਹਿ ਦਿੰਦੇ ਹੋ, ਪਤਾ ਤੈਨੂੰ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ? ਉਹ ਚੁੱਪ ਹੋ ਜਾਂਦੀ ਹੈ। ਉਸ ਨੂੰ ਸੁਣਨ ਵਾਲਾ ਚਾਹੀਦਾ ਸੀ, ਉਸ ਨੂੰ ਭਾਸ਼ਣ ਮਿਲ ਗਿਆ।", "m": "ਸੱਚੇ ਮਨ ਨਾਲ ਸੁਣਨ ਨਾਲ ਦੁੱਖ ਤੇ ਪਾਪ ਮਿਟ ਜਾਂਦੇ ਹਨ।", "k": "ਦੂਜੇ ਗੁਰੂ ਬਣਨ ਤੋਂ ਬਹੁਤ ਪਹਿਲਾਂ ਭਾਈ ਲਹਿਣਾ ਖਡੂਰ ਵਿਚ ਰਹਿੰਦੇ ਸਨ। ਇਕ ਸਵੇਰ ਤੜਕੇ ਉਨ੍ਹਾਂ ਨੇ ਆਪਣੇ ਗੁਆਂਢੀ ਭਾਈ ਜੋਧਾ ਨੂੰ ਕੁਝ ਅਜਿਹੀਆਂ ਪੰਕਤੀਆਂ ਗਾਉਂਦੇ ਸੁਣਿਆ ਜੋ ਉਨ੍ਹਾਂ ਨੇ ਪਹਿਲਾਂ ਕਦੇ ਨਹੀਂ ਸੁਣੀਆਂ ਸਨ। ਉਹ ਗੁਰੂ ਨਾਨਕ ਦੇ ਬਚਨ ਸਨ। ਭਾਈ ਲਹਿਣਾ ਰੁਕ ਗਏ, ਸੁਣਦੇ ਰਹੇ, ਤੇ ਉਹ ਬਚਨ ਉਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿਚੋਂ ਨਿਕਲੇ ਹੀ ਨਹੀਂ। ਉਨ੍ਹਾਂ ਨੇ ਪੁੱਛਿਆ ਕਿ ਇਹ ਕਿਸ ਨੇ ਲਿਖੇ ਹਨ। ਜਦੋਂ ਪਤਾ ਲੱਗਾ ਕਿ ਇਹ ਕਰਤਾਰਪੁਰ ਵਾਲੇ ਗੁਰੂ ਨਾਨਕ ਦੇ ਹਨ, ਤਾਂ ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲਣ ਤੁਰ ਪਏ, ਤੇ ਉਨ੍ਹਾਂ ਦਾ ਜੀਵਨ ਫਿਰ ਕਦੇ ਪਹਿਲਾਂ ਵਰਗਾ ਨਾ ਰਿਹਾ। ਇਹ ਸਭ ਇਕ ਸਾਧਾਰਨ ਸਵੇਰ ਤੋਂ ਸ਼ੁਰੂ ਹੋਇਆ, ਤੇ ਸੱਚੇ ਮਨ ਨਾਲ ਸੁਣਨ ਦੇ ਇਕ ਪਲ ਤੋਂ।", "a": "ਜਪੁਜੀ ਸਾਹਿਬ ਦੀਆਂ ਚਾਰ ਪਉੜੀਆਂ ਇਕੋ ਸ਼ਬਦ ਨਾਲ ਸ਼ੁਰੂ ਹੁੰਦੀਆਂ ਹਨ: ਸੁਣਿਐ, ਯਾਨੀ ਸੁਣਨਾ। ਗੁਰੂ ਨਾਨਕ ਪੂਰੇ ਧਿਆਨ ਨਾਲ ਰੱਬੀ ਸ਼ਬਦ ਨੂੰ ਸੁਣਨ ਦੀ ਗੱਲ ਕਰ ਰਹੇ ਹਨ। ਭਾਈ ਲਹਿਣਾ ਦੀ ਕਹਾਣੀ ਵਿਖਾਉਂਦੀ ਹੈ ਕਿ ਇਹ ਕਿੰਨਾ ਤਾਕਤਵਰ ਹੋ ਸਕਦਾ ਹੈ। ਉਹ ਆਪਣੇ ਖ਼ਿਆਲਾਂ ਵਿਚ ਡੁੱਬੇ ਅੱਗੇ ਲੰਘ ਸਕਦੇ ਸਨ। ਪਰ ਉਹ ਰੁਕੇ, ਤੇ ਜੋ ਸੁਣਿਆ ਉਸ ਲਈ ਪੂਰੀ ਤਰ੍ਹਾਂ ਖੁੱਲ੍ਹ ਗਏ। ਰੋਜ਼ ਦੇ ਜੀਵਨ ਵਿਚ ਅਸੀਂ ਉਹੀ ਗੁਣ, ਯਾਨੀ ਪੂਰਾ ਧਿਆਨ, ਆਪਣੇ ਸਾਹਮਣੇ ਬੈਠੇ ਲੋਕਾਂ ਲਈ ਉਧਾਰ ਲੈਂਦੇ ਹਾਂ। ਬਹੁਤਾ ਸਮਾਂ ਅਸੀਂ ਸੱਚਮੁੱਚ ਸੁਣਦੇ ਨਹੀਂ। ਅਸੀਂ ਬੱਸ ਆਪਣੀ ਵਾਰੀ ਉਡੀਕਦੇ ਹਾਂ। ਸਾਹਮਣੇ ਵਾਲਾ ਇਹ ਮਹਿਸੂਸ ਕਰ ਲੈਂਦਾ ਹੈ, ਜਿਵੇਂ ਤੁਸੀਂ ਮਹਿਸੂਸ ਕਰ ਲੈਂਦੇ ਹੋ ਜਦੋਂ ਕੋਈ ਗੱਲ ਕਰਦਿਆਂ ਵਾਰ ਵਾਰ ਆਪਣਾ ਫ਼ੋਨ ਵੇਖਦਾ ਰਹੇ।", "b": "ਸਟੀਫ਼ਨ ਕਵੀ ਆਪਣੀ ਮਸ਼ਹੂਰ ਕਿਤਾਬ, ਸੈਵਨ ਹੈਬਿਟਸ, ਵਿਚ ਕਹਿੰਦੇ ਹਨ: ਪਹਿਲਾਂ ਦੂਜੇ ਨੂੰ ਸਮਝੋ, ਫਿਰ ਆਪਣੀ ਗੱਲ ਸਮਝਾਓ। ਜੋ ਡਾਕਟਰ ਦਰਦ ਪੁੱਛੇ ਬਿਨਾਂ ਦਵਾਈ ਲਿਖ ਦੇਵੇ, ਉਹ ਚੰਗਾ ਡਾਕਟਰ ਨਹੀਂ। ਦੋਸਤ ਵੀ ਨਹੀਂ। ਜਦੋਂ ਇਨਸਾਨ ਨੂੰ ਲੱਗਦਾ ਹੈ ਕਿ ਉਸ ਨੂੰ ਸੁਣਿਆ ਗਿਆ, ਤਾਂ ਉਸ ਦੇ ਅੰਦਰ ਕੁਝ ਨਰਮ ਪੈ ਜਾਂਦਾ ਹੈ। ਉਹ ਸ਼ਾਂਤ ਹੋ ਜਾਂਦਾ ਹੈ, ਤੇ ਅਕਸਰ ਬੋਲਦਿਆਂ ਬੋਲਦਿਆਂ ਆਪਣਾ ਜਵਾਬ ਆਪ ਲੱਭ ਲੈਂਦਾ ਹੈ। ਜਦੋਂ ਉਸ ਨੂੰ ਲੱਗਦਾ ਹੈ ਕਿ ਉਸ ਨੂੰ ਪਰਖਿਆ ਜਾ ਰਿਹਾ ਹੈ ਜਾਂ ਕਾਹਲੀ ਕੀਤੀ ਜਾ ਰਹੀ ਹੈ, ਤਾਂ ਉਹ ਬਚਾਅ ਕਰਨ ਲੱਗ ਪੈਂਦਾ ਹੈ। ਦੋ ਮਿੰਟ ਦਾ ਸੱਚਾ ਸੁਣਨਾ ਦੋ ਘੰਟੇ ਦੀ ਬਹਿਸ ਬਚਾ ਸਕਦਾ ਹੈ। ਤੇ ਇਸ ਵਿਚ ਤੁਹਾਡੇ ਲਈ ਵੀ ਇਕ ਤੋਹਫ਼ਾ ਹੈ। ਜਦੋਂ ਤੁਸੀਂ ਪੂਰੇ ਮਨ ਨਾਲ ਸੁਣਦੇ ਹੋ, ਤਾਂ ਉਹ ਗੱਲਾਂ ਸਿੱਖਦੇ ਹੋ ਜੋ ਬੋਲਣ ਵਿਚ ਰੁੱਝੇ ਰਹਿ ਕੇ ਕਦੇ ਨਾ ਸੁਣ ਸਕਦੇ।", "t": "ਅੱਜ ਇਕ ਗੱਲਬਾਤ ਵਿਚ ਕੋਈ ਸਲਾਹ ਨਾ ਦਿਓ। ਬੱਸ ਪੁੱਛੋ, ਫਿਰ ਕੀ ਹੋਇਆ? ਤੇ, ਉਦੋਂ ਕਿਵੇਂ ਲੱਗਾ? ਜਦੋਂ ਉਹ ਪੂਰੀ ਗੱਲ ਕਹਿ ਲੈਣ, ਫਿਰ ਬੋਲੋ।", "q": "ਤੁਸੀਂ ਕੰਮ ਤੋਂ ਥੱਕ ਕੇ ਘਰ ਪਹੁੰਚੇ ਹੋ, ਤੇ ਮਾਂ ਗੁਆਂਢੀ ਦੀ ਕਿਸੇ ਪਰੇਸ਼ਾਨੀ ਬਾਰੇ ਦੱਸਣ ਲੱਗਦੀ ਹੈ। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਫ਼ੋਨ ਰੱਖ ਦਿਓਗੇ ਤੇ ਉਨ੍ਹਾਂ ਦੀ ਪੂਰੀ ਗੱਲ ਸੁਣੋਗੇ", "ਛੇਤੀ ਨਾਲ ਦੱਸ ਦਿਓਗੇ ਕਿ ਉਨ੍ਹਾਂ ਨੂੰ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ", "ਕਹਿ ਦਿਓਗੇ ਕਿ ਹੁਣੇ ਬਹੁਤ ਥੱਕੇ ਹੋ"], "y": "ਇਹ ਉਨ੍ਹਾਂ ਲਈ ਇਕ ਸੱਚਾ ਤੋਹਫ਼ਾ ਹੈ। ਫ਼ੋਨ ਰੱਖਣ ਨਾਲ ਉਨ੍ਹਾਂ ਨੂੰ ਪਤਾ ਲੱਗਦਾ ਹੈ ਕਿ ਉਹ ਸਕਰੀਨ ਨਾਲੋਂ ਵੱਧ ਜ਼ਰੂਰੀ ਹਨ। ਅਕਸਰ ਉਨ੍ਹਾਂ ਨੂੰ ਹੱਲ ਨਹੀਂ ਚਾਹੀਦਾ ਹੁੰਦਾ, ਬੱਸ ਕਿਸੇ ਆਪਣੇ ਦਾ ਸੁਣਨਾ ਚਾਹੀਦਾ ਹੁੰਦਾ ਹੈ।", "n": "ਇਹ ਸੱਚਾ ਜਵਾਬ ਹੈ। ਥਕਾਵਟ ਵਿਚ ਛੇਤੀ ਦੀ ਸਲਾਹ ਜਾਂ ਗੱਲ ਟਾਲਣੀ ਸੌਖੀ ਲੱਗਦੀ ਹੈ। ਪਰ ਅਕਸਰ ਉਹ ਬੱਸ ਸੁਣੇ ਜਾਣਾ ਚਾਹੁੰਦੇ ਹਨ। ਕੁਝ ਮਿੰਟਾਂ ਲਈ ਫ਼ੋਨ ਰੱਖ ਕੇ ਉਨ੍ਹਾਂ ਦੀ ਪੂਰੀ ਗੱਲ ਸੁਣ ਕੇ ਵੇਖੋ। ਇਸ ਵਿਚ ਬਹੁਤ ਥੋੜ੍ਹਾ ਲੱਗਦਾ ਹੈ, ਤੇ ਇਸ ਦਾ ਮਤਲਬ ਬਹੁਤ ਹੁੰਦਾ ਹੈ।"}, "habit1": {"ti": "ਹਰ ਸਵੇਰ ਇਕ ਛੋਟੀ ਜਿਹੀ ਚੀਜ਼", "s": "ਪਹਿਲੀ ਜਨਵਰੀ ਨੂੰ ਤੁਸੀਂ ਆਪਣੇ ਆਪ ਨਾਲ ਵਾਅਦਾ ਕਰਦੇ ਹੋ, ਰੋਜ਼ ਇਕ ਘੰਟਾ ਜਿੰਮ। ਵੀਹ ਜਨਵਰੀ ਤਕ ਜਿੰਮ ਵਾਲਾ ਬੈਗ ਮੰਜੇ ਹੇਠ ਪਿਆ ਹੁੰਦਾ ਹੈ।", "m": "ਪਹੁ ਫੁੱਟਣ ਤੋਂ ਪਹਿਲਾਂ ਦੇ ਸ਼ਾਂਤ ਸਮੇਂ ਵਿਚ ਸੱਚੇ ਨਾਮ ਤੇ ਉਸ ਦੀ ਵਡਿਆਈ ਦੀ ਵਿਚਾਰ ਕਰੋ।", "k": "ਜਦੋਂ ਅਮਰਦਾਸ ਜੀ ਖਡੂਰ ਵਿਚ ਗੁਰੂ ਅੰਗਦ ਜੀ ਦੀ ਸੇਵਾ ਕਰਨ ਆਏ, ਉਦੋਂ ਉਹ ਸੱਠ ਸਾਲ ਟੱਪ ਚੁੱਕੇ ਸਨ। ਹਰ ਰੋਜ਼, ਸੂਰਜ ਚੜ੍ਹਨ ਤੋਂ ਪਹਿਲਾਂ ਦੇ ਹਨੇਰੇ ਵਿਚ, ਉਹ ਬਿਆਸ ਦਰਿਆ ਤਕ ਜਾਂਦੇ, ਗਾਗਰ ਵਿਚ ਪਾਣੀ ਭਰਦੇ, ਤੇ ਵਾਪਸ ਲਿਆਉਂਦੇ ਤਾਂ ਜੋ ਗੁਰੂ ਜੀ ਇਸ਼ਨਾਨ ਕਰ ਸਕਣ। ਉਹ ਇਹ ਹਰ ਸਵੇਰ ਕਰਦੇ ਰਹੇ, ਗਰਮੀ ਦੀ ਤਪਸ਼ ਵਿਚ ਵੀ ਤੇ ਸਿਆਲ ਦੀ ਠੰਢ ਵਿਚ ਵੀ, ਬਾਰਾਂ ਸਾਲ ਤਕ। ਪਰੰਪਰਾ ਯਾਦ ਕਰਦੀ ਹੈ ਕਿ ਇਕ ਤੂਫ਼ਾਨੀ ਰਾਤ ਉਹ ਠੇਡਾ ਖਾ ਕੇ ਇਕ ਜੁਲਾਹੇ ਦੀ ਖੱਡੀ ਵਿਚ ਡਿੱਗ ਪਏ। ਉਹ ਉੱਠੇ, ਗਾਗਰ ਚੁੱਕੀ, ਤੇ ਪਾਣੀ ਲੈ ਕੇ ਅੱਗੇ ਤੁਰ ਪਏ। ਸਾਲਾਂ ਬਾਅਦ ਇਹੀ ਸ਼ਾਂਤ, ਵਫ਼ਾਦਾਰ ਇਨਸਾਨ ਤੀਜੇ ਗੁਰੂ ਬਣੇ।", "a": "ਅੰਮ੍ਰਿਤ ਵੇਲਾ ਸੂਰਜ ਚੜ੍ਹਨ ਤੋਂ ਪਹਿਲਾਂ ਦਾ ਸ਼ਾਂਤ ਸਮਾਂ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਵਿਚਾਰ ਨੂੰ ਦਿਨ ਦੇ ਇਕ ਪੱਕੇ ਸਮੇਂ ਨਾਲ ਬੰਨ੍ਹਦੇ ਹਨ। ਮਨ ਤਾਜ਼ਾ ਹੁੰਦਾ ਹੈ, ਘਰ ਚੁੱਪ ਹੁੰਦਾ ਹੈ, ਤੇ ਫ਼ੋਨ ਨੇ ਅਜੇ ਬੁਲਾਉਣਾ ਸ਼ੁਰੂ ਨਹੀਂ ਕੀਤਾ ਹੁੰਦਾ। ਅਮਰਦਾਸ ਜੀ ਦੇ ਬਾਰਾਂ ਸਾਲਾਂ ਦਾ ਪਾਣੀ ਪੱਕੇ ਸਮੇਂ ਦੀ ਲੁਕੀ ਤਾਕਤ ਵਿਖਾਉਂਦਾ ਹੈ। ਉਨ੍ਹਾਂ ਨੂੰ ਹਰ ਸਵੇਰ ਇਹ ਤੈਅ ਨਹੀਂ ਕਰਨਾ ਪੈਂਦਾ ਸੀ ਕਿ ਜਾਵਾਂ ਕਿ ਨਾ। ਪਹੁ ਫੁਟਾਲਾ ਉਨ੍ਹਾਂ ਲਈ ਤੈਅ ਕਰ ਦਿੰਦਾ ਸੀ। ਜੇਮਜ਼ ਕਲੀਅਰ ਆਪਣੀ ਕਿਤਾਬ, ਐਟੌਮਿਕ ਹੈਬਿਟਸ, ਵਿਚ ਇਹੀ ਸਲਾਹ ਅੱਜ ਦੇ ਸ਼ਬਦਾਂ ਵਿਚ ਦਿੰਦੇ ਹਨ। ਅਜਿਹੀ ਸ਼ੁਰੂਆਤ ਕਰੋ ਜਿਸ ਨੂੰ ਬੱਸ ਦੋ ਮਿੰਟ ਲੱਗਣ, ਤੇ ਉਸ ਨੂੰ ਕਿਸੇ ਅਜਿਹੇ ਕੰਮ ਨਾਲ ਜੋੜ ਦਿਓ ਜੋ ਤੁਸੀਂ ਪਹਿਲਾਂ ਹੀ ਕਰਦੇ ਹੋ। ਦੰਦ ਸਾਫ਼ ਕਰਨ ਤੋਂ ਬਾਅਦ, ਮੈਂ ਦੋ ਮਿੰਟ ਸ਼ਾਂਤ ਬੈਠਾਂਗਾ। ਏਨਾ ਛੋਟਾ ਕਿ ਨਾਂਹ ਨਾ ਕਰ ਸਕੋ।", "b": "ਇਹ ਕੰਮ ਕਿਉਂ ਕਰਦਾ ਹੈ? ਤੁਹਾਡੀ ਨਵੇਂ ਸਾਲ ਵਾਲੀ ਯੋਜਨਾ ਬਹੁਤ ਵੱਡੀ ਸੀ, ਤੇ ਉਸ ਦਾ ਕੋਈ ਪੱਕਾ ਸਮਾਂ ਨਹੀਂ ਸੀ। ਹਰ ਰੋਜ਼ ਆਪਣੇ ਆਪ ਨਾਲ ਬਹਿਸ ਕਰਨੀ ਪੈਂਦੀ ਸੀ, ਜਾਵਾਂ ਕਿ ਅੱਜ ਰਹਿਣ ਦਿਆਂ? ਇਹ ਰੋਜ਼ ਦੀ ਬਹਿਸ ਸਰੀਰ ਤੋਂ ਬਹੁਤ ਪਹਿਲਾਂ ਮਨ ਨੂੰ ਥਕਾ ਦਿੰਦੀ ਹੈ। ਪੱਕਾ ਸਮਾਂ ਇਸ ਬਹਿਸ ਨੂੰ ਮੁਕਾ ਦਿੰਦਾ ਹੈ। ਤੇ ਛੋਟੇ ਕਦਮ ਚੁੱਪ ਚਾਪ ਜੁੜਦੇ ਜਾਂਦੇ ਹਨ। ਰੋਜ਼ ਬਚਾਇਆ ਇਕ ਰੁਪਈਆ ਕੁਝ ਨਹੀਂ ਲੱਗਦਾ। ਇਕ ਸਾਲ ਵਿਚ ਉਹ ਚੰਗੀ ਰਕਮ ਬਣ ਜਾਂਦਾ ਹੈ। ਆਦਤ ਵੀ ਇਉਂ ਹੀ ਵਧਦੀ ਹੈ। ਪਹਿਲਾਂ ਉਸ ਨੂੰ ਪੱਕੀ ਕਰੋ, ਭਾਵੇਂ ਉਹ ਬਹੁਤ ਛੋਟੀ ਹੋਵੇ। ਬਾਅਦ ਵਿਚ ਉਸ ਨੂੰ ਲੰਮੀ ਕਰ ਸਕਦੇ ਹੋ। ਰੋਜ਼ ਬਲਣ ਵਾਲਾ ਛੋਟਾ ਦੀਵਾ ਸਾਲ ਵਿਚ ਇਕ ਵਾਰ ਬਲਣ ਵਾਲੀ ਵੱਡੀ ਅੱਗ ਨਾਲੋਂ ਵੱਧ ਚਾਨਣ ਦਿੰਦਾ ਹੈ।", "t": "ਸਵੇਰ ਲਈ ਦੋ ਮਿੰਟ ਦੀ ਇਕ ਆਦਤ ਚੁਣੋ। ਸ਼ਾਂਤ ਬੈਠਣਾ, ਇਕ ਪੰਕਤੀ ਪੜ੍ਹਨੀ, ਜਾਂ ਥੋੜ੍ਹਾ ਸਰੀਰ ਖਿੱਚਣਾ। ਇਸ ਨੂੰ ਦੰਦ ਸਾਫ਼ ਕਰਨ ਨਾਲ ਜੋੜ ਦਿਓ। ਕੱਲ੍ਹ ਤੋਂ ਸ਼ੁਰੂ ਕਰੋ।", "q": "ਤੁਸੀਂ ਪੜ੍ਹਨਾ ਸ਼ੁਰੂ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ, ਪਰ ਕਦੇ ਸਮਾਂ ਨਹੀਂ ਮਿਲਦਾ। ਕਿਹੜੀ ਯੋਜਨਾ ਸਭ ਤੋਂ ਵੱਧ ਚੱਲੇਗੀ?", "o": ["ਹਰ ਐਤਵਾਰ ਇਕ ਘੰਟਾ ਪੜ੍ਹਨਾ", "ਹਰ ਰਾਤ ਸੌਣ ਤੋਂ ਪਹਿਲਾਂ ਦੋ ਪੰਨੇ ਪੜ੍ਹਨੇ", "ਜੋਸ਼ ਲਈ ਦਸ ਕਿਤਾਬਾਂ ਖ਼ਰੀਦ ਲੈਣੀਆਂ"], "y": "ਬਿਲਕੁਲ ਠੀਕ। ਪੱਕੇ ਸਮੇਂ ਉੱਤੇ ਦੋ ਪੰਨੇ ਏਨੇ ਛੋਟੇ ਹਨ ਕਿ ਕਦੇ ਨਹੀਂ ਛੁੱਟਣਗੇ, ਤੇ ਉਹ ਉਸ ਪਲ ਨਾਲ ਜੁੜਦੇ ਹਨ ਜੋ ਤੁਹਾਡੇ ਕੋਲ ਪਹਿਲਾਂ ਹੀ ਹੈ। ਇਕ ਸਾਲ ਵਿਚ ਇਹ ਸੱਤ ਸੌ ਤੋਂ ਵੱਧ ਪੰਨੇ ਹੋ ਜਾਂਦੇ ਹਨ।", "n": "ਬਹੁਤ ਕੁਦਰਤੀ ਯੋਜਨਾ ਹੈ, ਤੇ ਸਾਡੇ ਵਿਚੋਂ ਕਈ ਇਉਂ ਹੀ ਸ਼ੁਰੂ ਕਰਦੇ ਹਨ। ਵੱਡੇ ਟੀਚੇ ਜੋਸ਼ ਦਿੰਦੇ ਹਨ, ਪਰ ਜੀਵਨ ਰੁੱਝਦੇ ਹੀ ਛੁੱਟ ਜਾਂਦੇ ਹਨ। ਹਰ ਰਾਤ ਇਕੋ ਸਮੇਂ ਦੋ ਪੰਨੇ ਪੜ੍ਹ ਕੇ ਵੇਖੋ। ਇਹ ਏਨਾ ਛੋਟਾ ਹੈ ਕਿ ਤੁਸੀਂ ਨਾਂਹ ਨਹੀਂ ਕਰੋਗੇ, ਤੇ ਆਦਤ ਅਸਲ ਵਿਚ ਇਉਂ ਹੀ ਸ਼ੁਰੂ ਹੁੰਦੀ ਹੈ।"}, "action1": {"ti": "ਜੋ ਬੀਜੋਗੇ", "s": "ਇਕ ਦੁਕਾਨਦਾਰ ਰੋਜ਼ ਦੁੱਧ ਵਿਚ ਥੋੜ੍ਹਾ ਜਿਹਾ ਪਾਣੀ ਰਲਾਉਂਦਾ ਹੈ। ਕਿਸੇ ਨੂੰ ਪਤਾ ਨਹੀਂ ਲੱਗਦਾ। ਇਕ ਸਾਲ ਬਾਅਦ ਉਸ ਦੇ ਅੱਧੇ ਗਾਹਕ ਚੁੱਪ ਚਾਪ ਅਗਲੀ ਦੁਕਾਨ ਉੱਤੇ ਜਾ ਚੁੱਕੇ ਹੁੰਦੇ ਹਨ।", "m": "ਤੁਸੀਂ ਆਪ ਹੀ ਬੀਜ ਬੀਜਦੇ ਹੋ, ਤੇ ਆਪ ਹੀ ਉਸ ਦੀ ਫ਼ਸਲ ਖਾਂਦੇ ਹੋ।", "k": "ਭਾਈ ਵੀਰ ਸਿੰਘ ਭੂਮੀਏ ਨਾਂ ਦੇ ਇਕ ਡਾਕੂ ਦੀ ਪੁਰਾਣੀ ਕਹਾਣੀ ਸੁਣਾਉਂਦੇ ਹਨ, ਜੋ ਚੋਰੀ ਦੇ ਪੈਸੇ ਨਾਲ ਮੁਸਾਫ਼ਰਾਂ ਨੂੰ ਮੁਫ਼ਤ ਭੋਜਨ ਛਕਾਉਂਦਾ ਸੀ। ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਉੱਥੋਂ ਲੰਘੇ, ਤਾਂ ਭੂਮੀਏ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਭੋਜਨ ਲਈ ਸੱਦਿਆ। ਗੁਰੂ ਜੀ ਦੂਜਿਆਂ ਦੇ ਹੰਝੂਆਂ ਨਾਲ ਖ਼ਰੀਦਿਆ ਭੋਜਨ ਨਹੀਂ ਛਕਦੇ ਸਨ, ਪਰ ਉਨ੍ਹਾਂ ਨੇ ਭੂਮੀਏ ਅੱਗੇ ਇਕ ਗੱਲ ਰੱਖੀ। ਕੁਝ ਛੋਟੇ ਵਾਅਦੇ ਨਿਭਾ: ਗ਼ਰੀਬ ਨੂੰ ਕਦੇ ਨਾ ਲੁੱਟੀਂ, ਸਦਾ ਸੱਚ ਬੋਲੀਂ, ਤੇ ਜਿਸ ਘਰ ਦਾ ਲੂਣ ਖਾਧਾ ਹੋਵੇ ਉਸ ਨਾਲ ਕਦੇ ਧੋਖਾ ਨਾ ਕਰੀਂ। ਭੂਮੀਏ ਨੇ ਸੌਖੇ ਸਮਝ ਕੇ ਹਾਂ ਕਹਿ ਦਿੱਤੀ। ਪਰ ਛੇਤੀ ਹੀ ਹਰ ਛੋਟਾ ਵਾਅਦਾ ਕਿਸੇ ਨਾ ਕਿਸੇ ਜੁਰਮ ਅੱਗੇ ਕੰਧ ਬਣਨ ਲੱਗਾ। ਤੇ ਇਕ ਰਾਤ, ਵਾਅਦੇ ਨਿਭਾਉਂਦਿਆਂ, ਉਸ ਨੇ ਵੇਖਿਆ ਕਿ ਉਹ ਹੁਣ ਚੋਰੀ ਕਰ ਹੀ ਨਹੀਂ ਸਕਦਾ। ਉਸ ਦਾ ਸਾਰਾ ਜੀਵਨ ਬਦਲ ਗਿਆ।", "a": "ਗੁਰੂ ਨਾਨਕ ਕਿਸਾਨ ਦੀ ਅਜਿਹੀ ਤਸਵੀਰ ਦਿੰਦੇ ਹਨ ਜੋ ਹਰ ਕੋਈ ਸਮਝਦਾ ਹੈ। ਕਣਕ ਬੀਜੋਗੇ ਤਾਂ ਕਣਕ ਮਿਲੇਗੀ। ਕੰਡੇ ਬੀਜੋਗੇ ਤਾਂ ਕੰਡੇ। ਤੁਹਾਡੀ ਫ਼ਸਲ ਕੋਈ ਹੋਰ ਤੈਅ ਨਹੀਂ ਕਰਦਾ। ਭੂਮੀਏ ਦੀ ਕਹਾਣੀ ਇਹੀ ਸੱਚ ਉਮੀਦ ਵਾਲੇ ਪਾਸਿਓਂ ਵਿਖਾਉਂਦੀ ਹੈ। ਉਹ ਕਿਸੇ ਇਕ ਵੱਡੇ ਪਲ ਵਿਚ ਨਹੀਂ ਬਦਲਿਆ। ਉਹ ਕੁਝ ਛੋਟੇ ਵਾਅਦਿਆਂ ਨਾਲ ਬਦਲਿਆ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਉਹ ਵਾਰ ਵਾਰ ਨਿਭਾਉਂਦਾ ਰਿਹਾ, ਜਦ ਤਕ ਉਸ ਦਾ ਸਾਰਾ ਜੀਵਨ ਵੱਖਰਾ ਨਾ ਹੋ ਗਿਆ। ਇਹ ਪੰਕਤੀ ਧਮਕੀ ਨਹੀਂ। ਇਹ ਚੰਗੀ ਖ਼ਬਰ ਹੈ, ਕਿਉਂਕਿ ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਤੁਸੀਂ ਅੱਜ ਤੋਂ ਚੰਗੇ ਬੀਜ ਬੀਜਣੇ ਸ਼ੁਰੂ ਕਰ ਸਕਦੇ ਹੋ, ਭਾਵੇਂ ਕੱਲ੍ਹ ਤੁਸੀਂ ਜੋ ਵੀ ਸੀ। ਜੇਮਜ਼ ਕਲੀਅਰ ਐਟੌਮਿਕ ਹੈਬਿਟਸ ਵਿਚ ਇਹੀ ਕਹਿੰਦੇ ਹਨ। ਰੋਜ਼ ਦਾ ਛੋਟਾ ਜਿਹਾ ਸੁਧਾਰ ਇਕ ਹਫ਼ਤੇ ਵਿਚ ਕੁਝ ਨਹੀਂ ਦਿਸਦਾ। ਇਕ ਸਾਲ ਵਿਚ ਉਹ ਬਹੁਤ ਵੱਡੀ ਤਬਦੀਲੀ ਬਣ ਜਾਂਦਾ ਹੈ। ਤੇ ਛੋਟੀ ਜਿਹੀ ਢਿੱਲ ਵੀ।", "b": "ਆਪਣੇ ਇਕ ਸਾਧਾਰਨ ਦਿਨ ਨੂੰ ਵੇਖੋ। ਚੌਕੀਦਾਰ ਨੂੰ ਇਕ ਮਿੱਠਾ ਬੋਲ। ਦੋਸਤ ਨੂੰ ਇਕ ਛੋਟਾ ਝੂਠ। ਕਿਤਾਬ ਦੇ ਦਸ ਪੰਨੇ। ਇਕ ਘੰਟਾ ਹੋਰ ਫ਼ੋਨ ਉੱਤੇ। ਹਰ ਇਕ ਬੀਜ ਹੈ। ਕੱਲ੍ਹ ਤੁਹਾਨੂੰ ਬੂਟਾ ਨਹੀਂ ਦਿਸੇਗਾ, ਤੇ ਇਸੇ ਲਈ ਅਸੀਂ ਭੁੱਲ ਜਾਂਦੇ ਹਾਂ। ਬੱਚਤ, ਸਿਹਤ, ਭਰੋਸਾ ਤੇ ਦੋਸਤੀ ਕਦੇ ਇਕ ਦਿਨ ਵਿਚ ਨਾ ਬਣਦੇ ਹਨ, ਨਾ ਟੁੱਟਦੇ ਹਨ। ਉਹ ਬੀਜ ਬੀਜ ਕਰਕੇ ਵਧਦੇ ਹਨ। ਅੰਬ ਦਾ ਰੁੱਖ ਵੀ ਇਕ ਹਫ਼ਤੇ ਵਿਚ ਫਲ ਨਹੀਂ ਦਿੰਦਾ। ਅਗਲੇ ਸਾਲ ਤੁਸੀਂ ਜੋ ਇਨਸਾਨ ਹੋਵੋਗੇ, ਉਹ ਹੁਣੇ ਬੀਜਿਆ ਜਾ ਰਿਹਾ ਹੈ, ਅੱਜ ਦੇ ਕੰਮਾਂ ਵਿਚ, ਵਾਰ ਵਾਰ। ਇਹ ਗੱਲ ਭਾਰੀ ਲੱਗ ਸਕਦੀ ਹੈ, ਪਰ ਇਹ ਆਜ਼ਾਦ ਵੀ ਕਰਦੀ ਹੈ। ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਕੋਈ ਦਿਨ ਬੇਕਾਰ ਨਹੀਂ, ਤੇ ਸ਼ੁਰੂ ਕਰਨ ਲਈ ਕੋਈ ਦਿਨ ਦੇਰ ਨਹੀਂ।", "t": "ਇਸ ਹਫ਼ਤੇ ਰੋਜ਼ ਬੀਜਣ ਲਈ ਇਕ ਛੋਟਾ ਬੀਜ ਚੁਣੋ। ਇਕ ਸੱਚਾ ਜਵਾਬ, ਪੜ੍ਹਨ ਦਾ ਇਕ ਪੰਨਾ, ਜਾਂ ਇਕ ਪਿਆਰ ਭਰਿਆ ਸੁਨੇਹਾ।", "q": "ਤੁਸੀਂ ਦਫ਼ਤਰ ਦੇਰ ਨਾਲ ਪਹੁੰਚਣ ਨੂੰ ਲੁਕਾਉਣ ਲਈ ਛੋਟੇ ਝੂਠ ਬੋਲਦੇ ਰਹੇ ਹੋ। ਹੁਣ ਤੁਸੀਂ ਬਦਲਣਾ ਚਾਹੁੰਦੇ ਹੋ। ਸਭ ਤੋਂ ਚੰਗਾ ਪਹਿਲਾ ਕਦਮ ਕੀ ਹੈ?", "o": ["ਆਪਣੇ ਆਪ ਨਾਲ ਵਾਅਦਾ ਕਰਨਾ ਕਿ ਕੱਲ੍ਹ ਤੋਂ ਬਿਲਕੁਲ ਪਰਫ਼ੈਕਟ ਬਣੋਗੇ", "ਕੁਝ ਨਾ ਕਰਨਾ, ਕਿਉਂਕਿ ਹੁਣ ਬਹੁਤ ਦੇਰ ਹੋ ਚੁੱਕੀ", "ਇਕ ਛੋਟਾ ਵਾਅਦਾ ਚੁਣਨਾ, ਜਿਵੇਂ ਇਸ ਹਫ਼ਤੇ ਸਮੇਂ ਸਿਰ ਪਹੁੰਚਣਾ, ਤੇ ਉਸ ਨੂੰ ਨਿਭਾਉਣਾ"], "y": "ਭੂਮੀਆ ਵੀ ਬਿਲਕੁਲ ਇਉਂ ਹੀ ਬਦਲਿਆ ਸੀ। ਇਕ ਛੋਟਾ ਵਾਅਦਾ, ਜੋ ਨਿਭਾਇਆ ਜਾਵੇ, ਇਕ ਅਸਲੀ ਬੀਜ ਹੈ। ਅਗਲੇ ਹਫ਼ਤੇ ਇਹ ਸੌਖਾ ਹੋ ਜਾਂਦਾ ਹੈ, ਤੇ ਹੌਲੀ ਹੌਲੀ ਸਾਰੀ ਫ਼ਸਲ ਬਦਲ ਜਾਂਦੀ ਹੈ।", "n": "ਇਹ ਸਮਝ ਆਉਣ ਵਾਲੀ ਸੋਚ ਹੈ। ਜਦੋਂ ਸਾਨੂੰ ਆਪਣੀਆਂ ਗ਼ਲਤੀਆਂ ਦਿਸਦੀਆਂ ਹਨ, ਤਾਂ ਅਸੀਂ ਜਾਂ ਇਕ ਵੱਡੀ ਛਾਲ ਚਾਹੁੰਦੇ ਹਾਂ ਜਾਂ ਉਮੀਦ ਛੱਡ ਦਿੰਦੇ ਹਾਂ। ਦੋਹਾਂ ਨਾਲ ਬਹੁਤਾ ਫ਼ਾਇਦਾ ਨਹੀਂ ਹੁੰਦਾ। ਇਸ ਹਫ਼ਤੇ ਨਿਭ ਸਕਣ ਵਾਲਾ ਇਕ ਛੋਟਾ ਵਾਅਦਾ ਚੁਣ ਕੇ ਵੇਖੋ। ਰੋਜ਼ ਨਿਭਾਏ ਛੋਟੇ ਬੀਜ ਵੱਡੇ ਵਾਅਦਿਆਂ ਨਾਲੋਂ ਵੱਧ ਬਦਲਦੇ ਹਨ।"}, "hard1": {"ti": "ਜਦੋਂ ਦਿਨ ਭਾਰਾ ਹੋਵੇ", "s": "ਨਤੀਜਾ ਆਉਂਦਾ ਹੈ, ਤੇ ਚੰਗਾ ਨਹੀਂ। ਜਾਂ ਨੌਕਰੀ ਚਲੀ ਗਈ। ਜਾਂ ਕੋਈ ਆਪਣਾ ਬੀਮਾਰ ਹੈ। ਭਲੇ ਲੋਕ ਕਹਿੰਦੇ ਹਨ, ਜੋ ਹੁੰਦਾ ਹੈ ਚੰਗੇ ਲਈ ਹੁੰਦਾ ਹੈ। ਪਤਾ ਨਹੀਂ ਕਿਉਂ, ਇਸ ਨਾਲ ਮਨ ਹੌਲਾ ਨਹੀਂ ਹੁੰਦਾ।", "m": "ਕਿੰਨੇ ਹੀ ਲੋਕ ਦੁੱਖ, ਭੁੱਖ ਤੇ ਲਗਾਤਾਰ ਮਾਰ ਸਹਿੰਦੇ ਹਨ। ਹੇ ਦਾਤਾਰ, ਇਹ ਵੀ ਤੇਰੀ ਹੀ ਦਾਤ ਹਨ।", "k": "ਲਗਭਗ ਸੰਨ ਪੰਦਰਾਂ ਸੌ ਇੱਕੀ ਵਿਚ ਬਾਬਰ ਦੀ ਫ਼ੌਜ ਨੇ ਸੈਦਪੁਰ ਨਗਰ ਉੱਤੇ ਹਮਲਾ ਕੀਤਾ। ਗੁਰੂ ਨਾਨਕ ਉੱਥੇ ਹੀ ਸਨ। ਜਨਮਸਾਖੀਆਂ ਦੱਸਦੀਆਂ ਹਨ ਕਿ ਉਹ ਵੀ ਕੈਦ ਕੀਤੇ ਲੋਕਾਂ ਵਿਚ ਸਨ, ਤੇ ਕੈਦਖ਼ਾਨੇ ਵਿਚ ਦੂਜੇ ਕੈਦੀਆਂ ਵਾਂਗ ਚੱਕੀ ਪੀਹਂਦੇ ਹੋਏ ਉਹ ਗਾਉਂਦੇ ਰਹੇ। ਉਨ੍ਹਾਂ ਨੇ ਜੋ ਵੇਖਿਆ, ਉਸ ਵਿਚੋਂ ਚਾਰ ਸ਼ਬਦ ਨਿਕਲੇ, ਜੋ ਅੱਜ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਵਿਚ ਹਨ ਤੇ ਬਾਬਰਵਾਣੀ ਅਖਵਾਉਂਦੇ ਹਨ। ਉਨ੍ਹਾਂ ਵਿਚ ਉਹ ਨਜ਼ਰ ਨਹੀਂ ਫੇਰਦੇ। ਉਹ ਡਰ, ਦੁੱਖ ਤੇ ਤਬਾਹੀ ਨੂੰ ਸਾਫ਼ ਸਾਫ਼ ਬਿਆਨ ਕਰਦੇ ਹਨ, ਤੇ ਕਰਤੇ ਨੂੰ ਲੋਕਾਂ ਦੇ ਦਰਦ ਬਾਰੇ ਸਵਾਲ ਵੀ ਕਰਦੇ ਹਨ। ਫਿਰ ਵੀ ਇਸ ਸਭ ਵਿਚਕਾਰ ਉਹ ਉਸ ਇਕ ਨਾਲ ਗੱਲ ਕਰਨਾ ਕਦੇ ਨਹੀਂ ਛੱਡਦੇ।", "a": "ਗੁਰੂ ਨਾਨਕ ਦੁੱਖ ਨੂੰ ਲੁਕਾਉਂਦੇ ਨਹੀਂ। ਇਸ ਪਉੜੀ ਵਿਚ ਉਹ ਉਸ ਦਾ ਸਾਫ਼ ਨਾਂ ਲੈਂਦੇ ਹਨ: ਦਰਦ, ਭੁੱਖ, ਵਾਰ ਵਾਰ ਦੀ ਮਾਰ। ਸੈਦਪੁਰ ਵਿਚ ਵੀ ਉਨ੍ਹਾਂ ਨੇ ਇਹੀ ਕੀਤਾ, ਅਸਲੀ ਦੁੱਖ ਨੂੰ ਸ਼ਬਦ ਦਿੱਤੇ, ਉਸ ਨੂੰ ਸੋਹਣੇ ਵਾਕਾਂ ਨਾਲ ਢਕਿਆ ਨਹੀਂ। ਉਹ ਇਹ ਨਹੀਂ ਕਹਿੰਦੇ ਕਿ ਦੁੱਖ ਮਿੱਠਾ ਹੈ, ਜਾਂ ਸਾਨੂੰ ਹੱਸ ਕੇ ਸਹਿਣਾ ਚਾਹੀਦਾ ਹੈ। ਉਹ ਬੱਸ ਏਨਾ ਜੋੜਦੇ ਹਨ: ਔਖਾ ਸਮਾਂ ਦਾਤਾਰ ਦੇ ਹੱਥੋਂ ਬਾਹਰ ਨਹੀਂ। ਇਹ ਇਸ ਗੱਲ ਦਾ ਸਬੂਤ ਨਹੀਂ ਕਿ ਤੁਹਾਨੂੰ ਭੁਲਾ ਦਿੱਤਾ ਗਿਆ ਹੈ। ਚੰਗੇ ਦਿਨ ਤੇ ਭਾਰੇ ਦਿਨ ਇਕੋ ਥਾਂ ਤੋਂ ਆਉਂਦੇ ਹਨ। ਇਹ ਇਕ ਸੋਚ ਉਸ ਵੱਖਰੇ ਦਰਦ ਨੂੰ ਹਟਾ ਸਕਦੀ ਹੈ ਜੋ ਪੁੱਛਦਾ ਹੈ, ਸਿਰਫ਼ ਮੇਰੇ ਨਾਲ ਹੀ ਕਿਉਂ? ਇਹ ਤੁਹਾਨੂੰ ਦੁਖੀ ਹੋਣ ਦਿੰਦੀ ਹੈ, ਬਿਨਾਂ ਆਪਣੇ ਆਪ ਨੂੰ ਛੱਡਿਆ ਹੋਇਆ ਮਹਿਸੂਸ ਕੀਤੇ।", "b": "ਵਿਕਟਰ ਫ਼ਰੈਂਕਲ ਇਕ ਡਾਕਟਰ ਸਨ ਜੋ ਨਾਜ਼ੀ ਕੈਦਖ਼ਾਨਿਆਂ ਵਿਚੋਂ ਬਚ ਕੇ ਨਿਕਲੇ। ਆਪਣੀ ਕਿਤਾਬ, ਮੈਨਜ਼ ਸਰਚ ਫ਼ਾਰ ਮੀਨਿੰਗ, ਵਿਚ ਉਨ੍ਹਾਂ ਨੇ ਲਿਖਿਆ ਕਿ ਜਦੋਂ ਅਸੀਂ ਹਾਲਾਤ ਨਹੀਂ ਬਦਲ ਸਕਦੇ, ਉਦੋਂ ਵੀ ਇਹ ਚੁਣ ਸਕਦੇ ਹਾਂ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਸਾਹਮਣਾ ਕਿਵੇਂ ਕਰੀਏ। ਜਿਨ੍ਹਾਂ ਲੋਕਾਂ ਨੇ ਆਪਣੇ ਦੁੱਖ ਵਿਚ ਕੋਈ ਅਰਥ ਲੱਭ ਲਿਆ, ਉਹ ਉਸ ਨੂੰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਚੁੱਕ ਸਕੇ। ਇਕ ਵਿਦਿਆਰਥਣ ਬਾਰੇ ਸੋਚੋ ਜੋ ਇਕ ਵਾਰ ਫ਼ੇਲ ਹੋਈ, ਤੇ ਅੱਗੇ ਜਾ ਕੇ ਧੀਰਜ ਵਾਲੀ ਅਧਿਆਪਕਾ ਬਣੀ, ਕਿਉਂਕਿ ਉਸ ਨੂੰ ਠੀਕ ਯਾਦ ਸੀ ਕਿ ਫ਼ੇਲ ਹੋਣਾ ਕਿਵੇਂ ਲੱਗਦਾ ਹੈ। ਫ਼ੇਲ ਹੋਣ ਦਾ ਦਰਦ ਉਦੋਂ ਵੀ ਹੋਇਆ ਸੀ। ਪਰ ਉਹ ਬੇਕਾਰ ਨਹੀਂ ਗਿਆ। ਇਹ ਵੀ ਵੇਖੋ ਕਿ ਗੁਰੂ ਨਾਨਕ ਦੂਜੇ ਕੈਦੀਆਂ ਵਿਚਕਾਰ ਗਾਉਂਦੇ ਰਹੇ। ਇਕੱਠੇ ਚੁੱਕਿਆ ਦੁੱਖ ਹੌਲਾ ਹੁੰਦਾ ਹੈ। ਭਾਰੇ ਦਿਨ ਇਕ ਸੱਚੀ ਗੱਲਬਾਤ ਸੌ ਬਹਾਦਰ ਚਿਹਰਿਆਂ ਨਾਲੋਂ ਵੱਧ ਕੰਮ ਆਉਂਦੀ ਹੈ।", "t": "ਜੇ ਅੱਜ ਦਾ ਦਿਨ ਭਾਰਾ ਹੈ, ਤਾਂ ਆਪਣੇ ਲਈ ਇਕ ਛੋਟਾ ਜਿਹਾ ਚੰਗਾ ਕੰਮ ਕਰੋ। ਠੀਕ ਤਰ੍ਹਾਂ ਰੋਟੀ ਖਾਓ, ਥੋੜ੍ਹਾ ਬਾਹਰ ਨਿਕਲੋ, ਜਾਂ ਕਿਸੇ ਭਰੋਸੇ ਵਾਲੇ ਨੂੰ ਫ਼ੋਨ ਕਰਕੇ ਕਹੋ, ਅੱਜ ਦਾ ਦਿਨ ਔਖਾ ਸੀ।", "q": "ਤੁਹਾਡੀ ਇਕ ਨੇੜਲੀ ਸਹੇਲੀ ਦੀ ਨੌਕਰੀ ਹੁਣੇ ਹੁਣੇ ਗਈ ਹੈ ਤੇ ਉਹ ਫ਼ੋਨ ਉੱਤੇ ਰੋ ਰਹੀ ਹੈ। ਇਸ ਪਲ ਉਸ ਦੀ ਸਭ ਤੋਂ ਵੱਧ ਮਦਦ ਕੀ ਕਰੇਗਾ?", "o": ["ਉਸ ਨੂੰ ਕਹਿਣਾ ਕਿ ਜੋ ਹੁੰਦਾ ਹੈ ਕਿਸੇ ਵਜ੍ਹਾ ਨਾਲ ਹੁੰਦਾ ਹੈ", "ਸੁਣਨਾ, ਤੇ ਕਹਿਣਾ ਕਿ ਤੁਸੀਂ ਉਸ ਦੇ ਨਾਲ ਹੋ, ਉਦਾਸ ਹੋਣਾ ਠੀਕ ਹੈ", "ਛੇਤੀ ਨਾਲ ਉਸ ਨੂੰ ਨੌਕਰੀਆਂ ਦੇ ਦਸ ਲਿੰਕ ਭੇਜ ਦੇਣੇ"], "y": "ਇਹ ਸੱਚੀ ਦਇਆ ਹੈ। ਤੁਸੀਂ ਉਸ ਦੇ ਦਰਦ ਨੂੰ ਅਸਲੀ ਰਹਿਣ ਦਿੱਤਾ, ਜਿਵੇਂ ਗੁਰੂ ਨਾਨਕ ਨੇ ਦਰਦ ਦਾ ਖੁੱਲ੍ਹ ਕੇ ਨਾਂ ਲਿਆ, ਤੇ ਤੁਸੀਂ ਉਸ ਵਿਚ ਉਸ ਦੇ ਨਾਲ ਰਹੇ। ਨੌਕਰੀ ਵਿਚ ਮਦਦ ਬਾਅਦ ਵਿਚ ਆ ਸਕਦੀ ਹੈ। ਇਸ ਵੇਲੇ ਉਸ ਨੂੰ ਸਾਥ ਚਾਹੀਦਾ ਹੈ।", "n": "ਸਾਫ਼ ਹੈ ਕਿ ਤੁਸੀਂ ਮਦਦ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ, ਤੇ ਇਹ ਬਹੁਤ ਮਾਇਨੇ ਰੱਖਦਾ ਹੈ। ਪਰ ਪਹਿਲੇ ਕੁਝ ਘੰਟਿਆਂ ਵਿਚ ਛੇਤੀ ਦੇ ਜਵਾਬ ਇਉਂ ਮਹਿਸੂਸ ਕਰਾ ਸਕਦੇ ਹਨ ਜਿਵੇਂ ਉਸ ਦੇ ਦਰਦ ਦੀ ਇਜਾਜ਼ਤ ਨਹੀਂ। ਬੱਸ ਸੁਣ ਕੇ, ਤੇ ਇਹ ਕਹਿ ਕੇ ਵੇਖੋ ਕਿ ਤੁਸੀਂ ਉਸ ਦੇ ਨਾਲ ਹੋ। ਕੰਮ ਦੀ ਮਦਦ ਵੀ ਕੀਮਤੀ ਹੈ। ਉਹ ਬੱਸ ਥੋੜ੍ਹੀ ਦੇਰ ਬਾਅਦ ਆਉਂਦੀ ਹੈ।"}, "kind1": {"ti": "ਦੋਹਾਂ ਪਾਸਿਆਂ ਲਈ ਪਾਣੀ", "s": "ਜਿਸ ਗੁਆਂਢੀ ਨੇ ਗੱਡੀ ਖੜ੍ਹੀ ਕਰਨ ਪਿੱਛੇ ਤੁਹਾਡੇ ਪਰਿਵਾਰ ਨਾਲ ਝਗੜਾ ਕੀਤਾ ਸੀ, ਉਹ ਪੌੜੀਆਂ ਉੱਤੇ ਤਿਲਕ ਗਿਆ ਹੈ। ਨੇੜੇ ਸਿਰਫ਼ ਤੁਸੀਂ ਹੋ। ਅੰਦਰੋਂ ਇਕ ਆਵਾਜ਼ ਕਹਿੰਦੀ ਹੈ, ਯਾਦ ਹੈ ਇਸ ਨੇ ਕੀ ਕਿਹਾ ਸੀ। ਦੂਜੀ ਕਹਿੰਦੀ ਹੈ, ਇਹ ਇਕ ਇਨਸਾਨ ਹੈ, ਤੇ ਤਕਲੀਫ਼ ਵਿਚ ਹੈ।", "m": "ਇਕੋ ਕਰਤਾ ਹੈ, ਜਿਸ ਦਾ ਨਾਮ ਸੱਚ ਹੈ। ਉਹ ਸਭ ਕੁਝ ਰਚਣ ਵਾਲਾ ਹੈ, ਨਿਡਰ ਹੈ, ਕਿਸੇ ਨਾਲ ਵੈਰ ਨਹੀਂ ਰੱਖਦਾ, ਸਮੇਂ ਤੋਂ ਪਰੇ ਹੈ, ਜਨਮ ਤੋਂ ਪਰੇ ਹੈ, ਆਪਣੇ ਆਪ ਤੋਂ ਹੈ, ਤੇ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।", "k": "ਅਨੰਦਪੁਰ ਦੇ ਘੇਰੇ ਵੇਲੇ ਮੈਦਾਨ ਜ਼ਖ਼ਮੀਆਂ ਨਾਲ ਭਰਿਆ ਸੀ, ਜੋ ਪਾਣੀ ਲਈ ਪੁਕਾਰ ਰਹੇ ਸਨ। ਭਾਈ ਘਨੱਈਆ ਜੀ ਮੋਢੇ ਉੱਤੇ ਪਾਣੀ ਦੀ ਮਸ਼ਕ ਲਈ ਉਨ੍ਹਾਂ ਵਿਚਕਾਰ ਤੁਰਦੇ ਸਨ। ਉਹ ਹਰ ਇਕ ਕੋਲ ਗੋਡਿਆਂ ਭਾਰ ਬੈਠਦੇ, ਤੇ ਸਾਰਿਆਂ ਨੂੰ ਪਾਣੀ ਪਿਲਾਉਂਦੇ, ਸਿੱਖ ਸਿਪਾਹੀਆਂ ਨੂੰ ਵੀ ਤੇ ਦੁਸ਼ਮਣ ਸਿਪਾਹੀਆਂ ਨੂੰ ਵੀ। ਕੁਝ ਸਿੱਖਾਂ ਨੂੰ ਗੁੱਸਾ ਆਇਆ ਤੇ ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਕੋਲ ਸ਼ਿਕਾਇਤ ਕੀਤੀ ਕਿ ਉਹ ਦੁਸ਼ਮਣ ਨੂੰ ਫਿਰ ਜਿਊਂਦਾ ਕਰ ਰਹੇ ਹਨ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸੱਦਿਆ ਤੇ ਪੁੱਛਿਆ ਕਿ ਕੀ ਇਹ ਸੱਚ ਹੈ। ਭਾਈ ਘਨੱਈਆ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ ਕਿ ਉਸ ਮੈਦਾਨ ਵਿਚ ਉਨ੍ਹਾਂ ਨੂੰ ਕੋਈ ਦੁਸ਼ਮਣ ਨਹੀਂ ਦਿਸਦਾ, ਸਿਰਫ਼ ਲੋੜਵੰਦ ਇਨਸਾਨ ਦਿਸਦੇ ਹਨ। ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਗੁਰੂ ਜੀ ਖ਼ੁਸ਼ ਹੋਏ, ਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮੱਲ੍ਹਮ ਤੇ ਪੱਟੀਆਂ ਵੀ ਦਿੱਤੀਆਂ, ਤਾਂ ਜੋ ਉਹ ਪਾਣੀ ਦੇ ਨਾਲ ਜ਼ਖ਼ਮ ਵੀ ਭਰ ਸਕਣ।", "a": "ਮੂਲ ਮੰਤਰ ਦੇ ਵਿਚਕਾਰਲੇ ਦੋ ਸ਼ਬਦਾਂ ਨੂੰ ਵੇਖੋ। ਨਿਰਭਉ, ਯਾਨੀ ਡਰ ਤੋਂ ਬਿਨਾਂ। ਤੇ ਨਿਰਵੈਰ, ਯਾਨੀ ਵੈਰ ਤੋਂ ਬਿਨਾਂ। ਜਿਸ ਇਕ ਦੀ ਇੱਥੇ ਗੱਲ ਹੈ, ਉਸ ਦਾ ਕੋਈ ਦੁਸ਼ਮਣ ਨਹੀਂ। ਜੋ ਲੋਕ ਇਸ ਨੂੰ ਜਿਊਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਦੇ ਆਪਣੇ ਦਿਲ ਵਿਚ ਵੀ ਦੁਸ਼ਮਣ ਹੌਲੀ ਹੌਲੀ ਘਟਦੇ ਜਾਂਦੇ ਹਨ। ਭਾਈ ਘਨੱਈਆ ਜੀ ਨੇ ਵਿਖਾਇਆ ਕਿ ਸਭ ਤੋਂ ਔਖੀ ਥਾਂ, ਜੰਗ ਦੇ ਵਿਚਕਾਰ, ਇਹ ਕਿਵੇਂ ਦਿਸਦਾ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਇਹ ਨਹੀਂ ਮੰਨਿਆ ਕਿ ਲੜਾਈ ਨਹੀਂ ਹੋ ਰਹੀ। ਬੱਸ ਉਨ੍ਹਾਂ ਨੇ ਲੜਾਈ ਨੂੰ ਇਹ ਤੈਅ ਨਹੀਂ ਕਰਨ ਦਿੱਤਾ ਕਿ ਪਾਣੀ ਕਿਸ ਨੂੰ ਮਿਲੇਗਾ। ਇਹ ਕਮਜ਼ੋਰੀ ਨਹੀਂ। ਜੋ ਇਕ ਘੰਟਾ ਪਹਿਲਾਂ ਤੁਹਾਡੇ ਨਾਲ ਲੜ ਰਿਹਾ ਸੀ, ਉਸ ਕੋਲ ਗੋਡਿਆਂ ਭਾਰ ਬੈਠਣ ਲਈ ਬਹੁਤ ਹਿੰਮਤ ਚਾਹੀਦੀ ਹੈ। ਡਰ ਤੇ ਵੈਰ ਅਕਸਰ ਨਾਲ ਨਾਲ ਤੁਰਦੇ ਹਨ। ਜਦੋਂ ਅਸੀਂ ਘੱਟ ਡਰਦੇ ਹਾਂ, ਤਾਂ ਸਾਨੂੰ ਦੁਸ਼ਮਣਾਂ ਦੀ ਘੱਟ ਲੋੜ ਪੈਂਦੀ ਹੈ।", "b": "ਜਿਸ ਨੂੰ ਤੁਸੀਂ ਪਸੰਦ ਨਹੀਂ ਕਰਦੇ ਉਸ ਦੀ ਮਦਦ ਕਰਨ ਦਾ ਮਤਲਬ ਇਹ ਨਹੀਂ ਕਿ ਉਹ ਠੀਕ ਸੀ। ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਤੁਹਾਡੀ ਭਲਾਈ ਉਸ ਦੇ ਵਰਤਾਓ ਉੱਤੇ ਨਹੀਂ ਟਿਕੀ। ਇਕ ਦੀਵੇ ਨੂੰ ਵੇਖੋ। ਕਮਰੇ ਵਿਚ ਜੋ ਵੀ ਆਵੇ, ਉਹ ਸਭ ਨੂੰ ਇਕੋ ਜਿਹਾ ਚਾਨਣ ਦਿੰਦਾ ਹੈ। ਤੇ ਇਸ ਵਿਚ ਤੁਹਾਡਾ ਆਪਣਾ ਵੀ ਚੁੱਪ ਚਾਪ ਫ਼ਾਇਦਾ ਹੈ। ਨਫ਼ਰਤ ਚੁੱਕਣ ਵਿਚ ਭਾਰੀ ਹੁੰਦੀ ਹੈ। ਤੁਸੀਂ ਉਸ ਨੂੰ ਸਾਰਾ ਦਿਨ ਆਪਣੀ ਛਾਤੀ ਵਿਚ ਢੋਂਦੇ ਹੋ, ਜਦ ਕਿ ਸਾਹਮਣੇ ਵਾਲੇ ਨੂੰ ਸ਼ਾਇਦ ਪਤਾ ਵੀ ਨਾ ਹੋਵੇ। ਉਹ ਤੁਹਾਡੀ ਨੀਂਦ ਤੇ ਮੂਡ ਵਿਗਾੜਦੀ ਹੈ, ਉਸ ਦਾ ਨਹੀਂ। ਮਾਫ਼ੀ ਉੱਤੇ ਖੋਜ ਕਰਨ ਵਾਲਿਆਂ ਨੇ ਵੇਖਿਆ ਹੈ ਕਿ ਮਨ ਦੀਆਂ ਗੰਢਾਂ ਖੋਲ੍ਹਣ ਨਾਲ ਅਕਸਰ ਤਣਾਅ ਘਟਦਾ ਹੈ। ਜੋ ਭਾਰ ਹੇਠਾਂ ਰੱਖ ਦਿੰਦਾ ਹੈ, ਉਹ ਹੌਲਾ ਹੋ ਕੇ ਤੁਰਦਾ ਹੈ। ਔਖੇ ਬੰਦੇ ਨਾਲ ਭਲਾਈ, ਆਖ਼ਰ ਵਿਚ, ਆਪਣੇ ਨਾਲ ਵੀ ਭਲਾਈ ਹੈ।", "t": "ਕਿਸੇ ਇਕ ਅਜਿਹੇ ਬੰਦੇ ਬਾਰੇ ਸੋਚੋ ਜਿਸ ਤੋਂ ਤੁਸੀਂ ਬਚਦੇ ਹੋ। ਇਸ ਹਫ਼ਤੇ ਇਕ ਛੋਟਾ ਜਿਹਾ ਸਾਦਾ ਕੰਮ ਕਰੋ। ਸਿਰ ਹਿਲਾ ਕੇ ਸਤਿਕਾਰ, ਜਾਂ ਉਨ੍ਹਾਂ ਲਈ ਬੂਹਾ ਫੜ ਲੈਣਾ। ਇਸ ਤੋਂ ਵੱਧ ਕੁਝ ਨਹੀਂ ਚਾਹੀਦਾ।", "q": "ਇਕ ਸਾਥੀ ਜਿਸ ਨੇ ਕਦੇ ਤੁਹਾਡੇ ਬਾਰੇ ਮਾੜਾ ਕਿਹਾ ਸੀ, ਇਕ ਡੈੱਡਲਾਈਨ ਪੂਰੀ ਕਰਨ ਵਿਚ ਪਰੇਸ਼ਾਨ ਹੈ। ਤੁਸੀਂ ਜਾਣਦੇ ਹੋ ਕਿ ਉਸ ਦੀ ਮੁਸ਼ਕਲ ਕਿਵੇਂ ਹੱਲ ਹੋਵੇਗੀ। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਉਸ ਨੂੰ ਪਰੇਸ਼ਾਨ ਹੋਣ ਦਿਓਗੇ, ਉਹ ਇਸੇ ਲਾਇਕ ਹੈ", "ਬਿਨਾਂ ਵੱਡੀ ਗੱਲ ਬਣਾਏ ਥੋੜ੍ਹੀ ਮਦਦ ਕਰ ਦਿਓਗੇ", "ਦੂਜਿਆਂ ਨੂੰ ਦੱਸੋਗੇ ਕਿ ਉਸ ਨੇ ਕਦੇ ਤੁਹਾਡੇ ਨਾਲ ਕੀ ਕੀਤਾ ਸੀ"], "y": "ਇਹ ਦੀਵੇ ਵਰਗੀ ਚੋਣ ਹੈ। ਤੁਹਾਡੀ ਮਦਦ ਉਸ ਦੀ ਕਹੀ ਗੱਲ ਨੂੰ ਠੀਕ ਨਹੀਂ ਠਹਿਰਾਉਂਦੀ। ਇਹ ਬੱਸ ਵਿਖਾਉਂਦੀ ਹੈ ਕਿ ਤੁਹਾਡੀ ਭਲਾਈ ਤੁਹਾਡੀ ਹੈ, ਉਸ ਦੇ ਵੱਸ ਵਿਚ ਨਹੀਂ। ਤੇ ਤੁਸੀਂ ਹੌਲੇ ਹੋ ਕੇ ਅੱਗੇ ਵਧਦੇ ਹੋ।", "n": "ਇਹ ਬਹੁਤ ਇਨਸਾਨੀ ਪ੍ਰਤੀਕਿਰਿਆ ਹੈ। ਜਦੋਂ ਕੋਈ ਸਾਨੂੰ ਸੱਟ ਮਾਰਦਾ ਹੈ, ਤਾਂ ਸਾਡਾ ਇਕ ਹਿੱਸਾ ਚਾਹੁੰਦਾ ਹੈ ਕਿ ਉਸ ਨੂੰ ਵੀ ਮਹਿਸੂਸ ਹੋਵੇ। ਪਰ ਇਸ ਨਾਲ ਭਾਰ ਤੁਹਾਡੀ ਆਪਣੀ ਛਾਤੀ ਉੱਤੇ ਰਹਿੰਦਾ ਹੈ। ਚੁੱਪ ਚਾਪ ਥੋੜ੍ਹੀ ਮਦਦ ਕਰ ਕੇ ਵੇਖੋ। ਇਸ ਦਾ ਮਤਲਬ ਇਹ ਨਹੀਂ ਕਿ ਉਹ ਠੀਕ ਸੀ। ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਤੁਸੀਂ ਆਜ਼ਾਦ ਹੋ।"}, "mind1": {"ti": "ਪਹਿਲਾਂ ਮਨ ਨੂੰ ਜਿੱਤੋ", "s": "ਰਾਤ ਦੇ ਗਿਆਰਾਂ ਵੱਜੇ ਹਨ। ਬੱਸ ਪੰਜ ਮਿੰਟ ਰੀਲਾਂ, ਤੁਸੀਂ ਆਪਣੇ ਆਪ ਨੂੰ ਕਹਿੰਦੇ ਹੋ। ਸਿਰ ਚੁੱਕਦੇ ਹੋ ਤਾਂ ਰਾਤ ਦਾ ਇਕ ਵੱਜ ਚੁੱਕਾ ਹੈ। ਅਲਾਰਮ ਸਵੇਰੇ ਛੇ ਵਜੇ ਦਾ ਹੈ।", "m": "ਸਭ ਨੂੰ ਆਪਣੀ ਹੀ ਜਮਾਤ ਦਾ ਸਮਝੋ। ਆਪਣੇ ਮਨ ਨੂੰ ਜਿੱਤ ਲਓ, ਤਾਂ ਜੱਗ ਜਿੱਤ ਲਿਆ।", "k": "ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਸੁਲਤਾਨਪੁਰ ਰਹਿੰਦੇ ਸਨ, ਤਾਂ ਉੱਥੋਂ ਦੇ ਨਵਾਬ ਦੌਲਤ ਖ਼ਾਨ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮਸੀਤ ਵਿਚ ਨਮਾਜ਼ ਵਿਚ ਸ਼ਾਮਲ ਹੋਣ ਲਈ ਸੱਦਿਆ। ਗੁਰੂ ਨਾਨਕ ਨਾਲ ਗਏ, ਪਰ ਜਦੋਂ ਬਾਕੀ ਸਾਰੇ ਨਮਾਜ਼ ਪੜ੍ਹ ਰਹੇ ਸਨ, ਉਹ ਚੁੱਪ ਚਾਪ ਖੜ੍ਹੇ ਰਹੇ। ਬਾਅਦ ਵਿਚ ਨਵਾਬ ਤੇ ਕਾਜ਼ੀ ਨੇ ਪੁੱਛਿਆ ਕਿ ਉਹ ਸ਼ਾਮਲ ਕਿਉਂ ਨਹੀਂ ਹੋਏ। ਜਨਮਸਾਖੀਆਂ ਉਨ੍ਹਾਂ ਦਾ ਜਵਾਬ ਦੱਸਦੀਆਂ ਹਨ। ਨਵਾਬ ਦਾ ਸਰੀਰ ਤਾਂ ਝੁਕ ਰਿਹਾ ਸੀ, ਪਰ ਉਸ ਦਾ ਮਨ ਦੂਰ ਕਾਬਲ ਵਿਚ ਘੋੜੇ ਖ਼ਰੀਦ ਰਿਹਾ ਸੀ। ਤੇ ਕਾਜ਼ੀ ਦਾ ਮਨ ਘਰ ਸੀ, ਇਸ ਫ਼ਿਕਰ ਵਿਚ ਕਿ ਕਿਤੇ ਉਸ ਦੀ ਨਵੀਂ ਜੰਮੀ ਵਛੇਰੀ ਖੂਹ ਵਿਚ ਨਾ ਡਿੱਗ ਪਵੇ। ਤਾਂ ਉਹ ਕਿਸ ਨਾਲ ਨਮਾਜ਼ ਪੜ੍ਹਦੇ? ਦੋਵੇਂ ਇਕ ਪਲ ਚੁੱਪ ਰਹੇ, ਫਿਰ ਮੰਨ ਗਏ ਕਿ ਇਹ ਸੱਚ ਹੈ।", "a": "ਉਸ ਸਮੇਂ ਦੇ ਜੋਗੀ ਬਾਹਰਲੀ ਦੁਨੀਆ ਜਿੱਤਣ ਲਈ ਘਰ ਛੱਡ ਦਿੰਦੇ ਸਨ। ਗੁਰੂ ਨਾਨਕ ਅੰਦਰ ਵੱਲ ਇਸ਼ਾਰਾ ਕਰਦੇ ਹਨ। ਆਪਣੇ ਮਨ ਨੂੰ ਜਿੱਤ ਲਓ, ਤਾਂ ਜੱਗ ਜਿੱਤ ਲਿਆ। ਸੁਲਤਾਨਪੁਰ ਦੀ ਸਾਖੀ ਵਿਖਾਉਂਦੀ ਹੈ ਕਿ ਮਨ ਕਿੰਨੀ ਸੌਖ ਨਾਲ ਤਿਲਕ ਜਾਂਦਾ ਹੈ। ਨਵਾਬ ਤੇ ਕਾਜ਼ੀ ਇਕ ਪਵਿੱਤਰ ਕੰਮ ਕਰ ਰਹੇ ਸਨ, ਫਿਰ ਵੀ ਉਨ੍ਹਾਂ ਦਾ ਮਨ ਘੋੜਿਆਂ ਤੇ ਵਛੇਰੀਆਂ ਉੱਤੇ ਸੀ। ਸਾਡਾ ਮਨ ਰੀਲਾਂ ਨਾਲ ਇਹੀ ਕਰਦਾ ਹੈ। ਤੁਸੀਂ ਕੱਲ੍ਹ ਰਾਤ ਦੋ ਘੰਟੇ ਗੁਆਉਣ ਦਾ ਫ਼ੈਸਲਾ ਨਹੀਂ ਕੀਤਾ ਸੀ। ਮਨ ਦੇ ਕਿਸੇ ਹਿੱਸੇ ਨੇ ਤੁਹਾਡੇ ਲਈ ਫ਼ੈਸਲਾ ਕਰ ਲਿਆ, ਇਕ ਇਕ ਸਵਾਈਪ ਕਰਕੇ। ਸਾਡੀਆਂ ਰੋਜ਼ ਦੀਆਂ ਬਹੁਤੀਆਂ ਲੜਾਈਆਂ ਇਉਂ ਹੀ ਹਨ। ਉਹ ਦੁਨੀਆ ਨਾਲ ਨਹੀਂ, ਆਪਣੇ ਹੀ ਧਿਆਨ ਨਾਲ ਹਨ। ਜੋ ਮਨ ਨੂੰ ਰਾਹ ਵਿਖਾ ਸਕਦਾ ਹੈ, ਉਸ ਨੇ ਸਭ ਤੋਂ ਔਖਾ ਕੰਮ ਕਰ ਲਿਆ, ਤੇ ਉਸ ਤੋਂ ਬਾਅਦ ਬਾਹਰ ਦਾ ਸਭ ਕੁਝ ਸੌਖਾ ਹੋ ਜਾਂਦਾ ਹੈ।", "b": "ਡੈਨੀਅਲ ਕਾਹਨਮੈਨ ਆਪਣੀ ਕਿਤਾਬ, ਥਿੰਕਿੰਗ ਫ਼ਾਸਟ ਐਂਡ ਸਲੋ, ਵਿਚ ਮਨ ਦੇ ਕੰਮ ਕਰਨ ਦੇ ਦੋ ਤਰੀਕੇ ਦੱਸਦੇ ਹਨ। ਇਕ ਤੇਜ਼ ਤੇ ਆਪਣੇ ਆਪ ਚੱਲਣ ਵਾਲਾ ਹੈ, ਜਿਵੇਂ ਸਵਾਈਪ ਕਰਨਾ। ਦੂਜਾ ਹੌਲਾ ਤੇ ਸੋਚ ਸਮਝ ਕੇ ਚੱਲਣ ਵਾਲਾ ਹੈ, ਜਿਵੇਂ ਹਿਸਾਬ ਲਾਉਣਾ। ਬਹੁਤ ਸਾਰੀਆਂ ਗ਼ਲਤੀਆਂ ਇਸ ਲਈ ਹੁੰਦੀਆਂ ਹਨ ਕਿ ਤੇਜ਼ ਵਾਲਾ ਕੰਮ ਕਰ ਜਾਂਦਾ ਹੈ, ਤੇ ਹੌਲਾ ਵਾਲਾ ਬਾਅਦ ਵਿਚ ਜਾਗਦਾ ਹੈ। ਇਸ ਲਈ ਅੱਧੀ ਰਾਤ ਨੂੰ, ਜਦੋਂ ਤੁਸੀਂ ਥੱਕੇ ਹੋਵੋ, ਇੱਛਾ ਸ਼ਕਤੀ ਦੇ ਭਰੋਸੇ ਨਾ  ਝੂਠ ਦੀ ਇਹ ਕੰਧ ਕਿਵੇਂ ਟੁੱਟੇ?", "k": "ਜਦੋਂ ਨਾਨਕ ਜੀ ਛੋਟੇ ਸਨ, ਉਨ੍ਹਾਂ ਦੇ ਪਿਤਾ ਮਹਿਤਾ ਕਾਲੂ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਵੀਹ ਰੁਪਏ ਦਿੱਤੇ ਤੇ ਮੰਡੀ ਭੇਜਿਆ ਕਿ ਕੋਈ ਚੰਗਾ ਸੌਦਾ ਕਰਨ: ਅਜਿਹਾ ਸਾਮਾਨ ਖ਼ਰੀਦਣ ਜੋ ਮੁਨਾਫ਼ੇ ਉੱਤੇ ਵਿਕ ਸਕੇ। ਰਾਹ ਵਿਚ, ਜਨਮਸਾਖੀਆਂ ਦੱਸਦੀਆਂ ਹਨ, ਉਨ੍ਹਾਂ ਨੂੰ ਅਜਿਹੇ ਲੋਕ ਮਿਲੇ ਜੋ ਕਈ ਦਿਨਾਂ ਤੋਂ ਭੁੱਖੇ ਸਨ। ਕਹਾਣੀਆਂ ਵੱਖੋ ਵੱਖਰੀਆਂ ਦੱਸਦੀਆਂ ਹਨ ਕਿ ਉਹ ਕੌਣ ਸਨ, ਪਰ ਇਸ ਉੱਤੇ ਸਾਰੀਆਂ ਇਕ ਹਨ ਕਿ ਨਾਨਕ ਜੀ ਨੇ ਕੀ ਕੀਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਪੂਰੇ ਵੀਹ ਰੁਪਏ ਉਨ੍ਹਾਂ ਦੇ ਭੋਜਨ ਉੱਤੇ ਲਾ ਦਿੱਤੇ, ਤੇ ਖ਼ਾਲੀ ਹੱਥ ਘਰ ਮੁੜੇ। ਪਿਤਾ ਬਹੁਤ ਨਾਰਾਜ਼ ਹੋਏ। ਨਾਨਕ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ ਕਿ ਉਨ੍ਹਾਂ ਨੇ ਸੱਚਾ ਸੌਦਾ ਕੀਤਾ ਹੈ। ਉਸ ਥਾਂ ਅੱਜ ਸੱਚਾ ਸੌਦਾ ਨਾਂ ਦਾ ਗੁਰਦੁਆਰਾ ਖੜ੍ਹਾ ਹੈ।", "a": "ਇਹ ਜਪੁਜੀ ਸਾਹਿਬ ਦਾ ਸਭ ਤੋਂ ਵੱਡਾ ਸਵਾਲ ਹੈ, ਤੇ ਗੁਰੂ ਨਾਨਕ ਇਸ ਨੂੰ ਬਿਲਕੁਲ ਸ਼ੁਰੂ ਵਿਚ ਪੁੱਛਦੇ ਹਨ। ਅਸੀਂ ਸਚਿਆਰ ਕਿਵੇਂ ਬਣੀਏ, ਤੇ ਝੂਠ ਦੀ ਕੰਧ ਕਿਵੇਂ ਟੁੱਟੇ? ਛੋਟੇ ਛੋਟੇ ਝੂਠ ਇੱਟਾਂ ਵਾਂਗ ਜੁੜਦੇ ਜਾਂਦੇ ਹਨ। ਮੈਂ ਠੀਕ ਹਾਂ। ਮੈਨੂੰ ਇਹ ਪੜ੍ਹਾਈ ਪਸੰਦ ਹੈ। ਮੈਨੂੰ ਸਾੜਾ ਨਹੀਂ ਹੁੰਦਾ। ਕੁਝ ਸਾਲਾਂ ਵਿਚ ਅਸੀਂ ਜੋ ਹਾਂ ਤੇ ਜੋ ਵਿਖਾਉਂਦੇ ਹਾਂ, ਉਨ੍ਹਾਂ ਵਿਚਕਾਰ ਇਕ ਕੰਧ ਖੜ੍ਹੀ ਹੋ ਜਾਂਦੀ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਪਹਿਲਾਂ ਦੱਸਦੇ ਹਨ ਕਿ ਇਹ ਕਿਸ ਨਾਲ ਨਹੀਂ ਟੁੱਟੇਗੀ: ਵਾਰ ਵਾਰ ਸਰੀਰ ਧੋਣ ਨਾਲ ਨਹੀਂ, ਚੁੱਪ ਬੈਠਣ ਨਾਲ ਨਹੀਂ, ਦੌਲਤ ਜਾਂ ਚਤੁਰਾਈ ਇਕੱਠੀ ਕਰਨ ਨਾਲ ਨਹੀਂ। ਸੱਚਾ ਸੌਦਾ ਦੂਜੀ ਦਿਸ਼ਾ ਵਿਖਾਉਂਦਾ ਹੈ। ਨਾਨਕ ਜੀ ਜਾਣਦੇ ਸਨ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਦਿਲ ਕਿਸ ਚੀਜ਼ ਨੂੰ ਕੀਮਤੀ ਮੰਨਦਾ ਹੈ, ਤੇ ਉਨ੍ਹਾਂ ਨੇ ਉਸੇ ਉੱਤੇ ਅਮਲ ਕੀਤਾ, ਭਾਵੇਂ ਪਿਤਾ ਨਾਰਾਜ਼ ਹੋਏ। ਸੱਚਾਈ ਇਸ ਤੋਂ ਸ਼ੁਰੂ ਹੁੰਦੀ ਹੈ ਕਿ ਤੁਸੀਂ ਇਮਾਨਦਾਰੀ ਨਾਲ ਮੰਨੋ ਕਿ ਤੁਹਾਡੇ ਲਈ ਅਸਲ ਵਿਚ ਕੀ ਮਾਇਨੇ ਰੱਖਦਾ ਹੈ।", "b": "ਲੇਖਕ ਸਾਈਮਨ ਸਿਨੇਕ ਨੇ ਵੇਖਿਆ ਕਿ ਲੋਕ ਉਦੋਂ ਚੰਗਾ ਕਰਦੇ ਹਨ ਜਦੋਂ ਉਨ੍ਹਾਂ ਨੂੰ ਸਾਫ਼ ਪਤਾ ਹੋਵੇ ਕਿ ਉਹ ਕੋਈ ਕੰਮ ਕਿਉਂ ਕਰ ਰਹੇ ਹਨ, ਸਿਰਫ਼ ਇਹ ਨਹੀਂ ਕਿ ਕੀ ਕਰ ਰਹੇ ਹਨ। ਸੱਚੇ ਕਿਉਂ ਤੋਂ ਬਿਨਾਂ ਅਸੀਂ ਦੂਜਿਆਂ ਦੀ ਨਕਲ ਕਰਦੇ ਹਾਂ, ਤੇ ਕਾਮਯਾਬ ਹੋ ਕੇ ਵੀ ਖ਼ਾਲੀ ਮਹਿਸੂਸ ਕਰ ਸਕਦੇ ਹਾਂ। ਸੱਚਾ ਹੋਣ ਦਾ ਮਤਲਬ ਹਰ ਗੱਲ ਦਾ ਐਲਾਨ ਕਰਨਾ, ਜਾਂ ਕੱਲ੍ਹ ਨੌਕਰੀ ਛੱਡ ਦੇਣਾ ਨਹੀਂ। ਇਹ ਆਪਣੇ ਆਪ ਨਾਲ ਇਮਾਨਦਾਰ ਹੋਣ ਤੋਂ ਸ਼ੁਰੂ ਹੁੰਦਾ ਹੈ। ਜਦੋਂ ਤੁਸੀਂ ਮੰਨ ਲੈਂਦੇ ਹੋ ਕਿ ਮੈਂ ਇੱਥੇ ਖ਼ੁਸ਼ ਨਹੀਂ, ਉਦੋਂ ਹੀ ਤੁਸੀਂ ਉਸ ਬਾਰੇ ਕੁਝ ਕਰ ਸਕਦੇ ਹੋ: ਕਿਸੇ ਨਾਲ ਗੱਲ ਕਰਨੀ, ਕੋਈ ਨਵਾਂ ਹੁਨਰ ਸਿੱਖਣਾ, ਜਾਂ ਕੋਈ ਇਕ ਛੋਟੀ ਚੀਜ਼ ਬਦਲਣੀ। ਕੰਧ ਦੀ ਤ੍ਰੇੜ ਉਦੋਂ ਤਕ ਨਹੀਂ ਭਰੀ ਜਾ ਸਕਦੀ ਜਦ ਤਕ ਕੋਈ ਮੰਨ ਨਾ ਲਵੇ ਕਿ ਤ੍ਰੇੜ ਹੈ। ਮੰਨਣਾ ਕਮਜ਼ੋਰੀ ਨਹੀਂ। ਇਹ ਪਹਿਲੀ ਇੱਟ ਹਟਾਉਣਾ ਹੈ।", "t": "ਇਹ ਵਾਕ ਚੁੱਪ ਚਾਪ ਪੂਰਾ ਕਰੋ, ਮਨ ਵਿਚ ਜਾਂ ਕਾਗ਼ਜ਼ ਉੱਤੇ। ਜਿਸ ਗੱਲ ਨੂੰ ਮੈਂ ਠੀਕ ਕਹਿੰਦਾ ਰਹਿੰਦਾ ਹਾਂ, ਪਰ ਜੋ ਠੀਕ ਨਹੀਂ, ਉਹ ਹੈ। ਅਜੇ ਕਿਸੇ ਨੂੰ ਦੱਸਣਾ ਜ਼ਰੂਰੀ ਨਹੀਂ।", "q": "ਪਰਿਵਾਰ ਵਿਚ ਸਾਰੇ ਚਾਹੁੰਦੇ ਹਨ ਕਿ ਤੁਸੀਂ ਇੰਜੀਨੀਅਰ ਬਣੋ, ਪਰ ਤੁਹਾਨੂੰ ਡਿਜ਼ਾਈਨ ਨਾਲ ਪਿਆਰ ਹੈ। ਇਕ ਰਿਸ਼ਤੇਦਾਰ ਤੁਹਾਡੀ ਯੋਜਨਾ ਪੁੱਛਦਾ ਹੈ। ਸਭ ਤੋਂ ਸੱਚਾ ਕਦਮ ਕੀ ਹੈ?", "o": ["ਸਾਰਿਆਂ ਨੂੰ ਖ਼ੁਸ਼ ਰੱਖਣ ਲਈ ਇੰਜੀਨੀਅਰਿੰਗ ਕਹਿ ਦੇਣਾ", "ਨਰਮੀ ਨਾਲ ਦੱਸਣਾ ਕਿ ਤੁਸੀਂ ਡਿਜ਼ਾਈਨ ਵਿਚ ਅੱਗੇ ਵਧਣਾ ਚਾਹੁੰਦੇ ਹੋ, ਤੇ ਕਿਉਂ", "ਛੇਤੀ ਨਾਲ ਗੱਲ ਬਦਲ ਦੇਣੀ"], "y": "ਇਸ ਵਿਚ ਹਿੰਮਤ ਲੱਗਦੀ ਹੈ। ਤੁਹਾਨੂੰ ਅੱਜ ਬਹਿਸ ਜਿੱਤਣ ਦੀ ਲੋੜ ਨਹੀਂ। ਨਰਮੀ ਨਾਲ ਆਪਣਾ ਕਿਉਂ ਦੱਸ ਕੇ ਤੁਸੀਂ ਪਹਿਲੀ ਇੱਟ ਹਟਾ ਦਿੱਤੀ ਹੈ, ਤੇ ਜੋ ਲੋਕ ਤੁਹਾਨੂੰ ਪਿਆਰ ਕਰਦੇ ਹਨ, ਉਹ ਅਸਲੀ ਤੁਹਾਨੂੰ ਵੇਖਣਾ ਸ਼ੁਰੂ ਕਰ ਸਕਦੇ ਹਨ।", "n": "ਇਹ ਬਹੁਤ ਸਮਝ ਆਉਂਦਾ ਹੈ। ਪਰਿਵਾਰ ਦੀਆਂ ਉਮੀਦਾਂ ਭਾਰੀਆਂ ਹੁੰਦੀਆਂ ਹਨ, ਤੇ ਸ਼ਾਂਤੀ ਬਣਾਈ ਰੱਖਣੀ ਵੀ ਜ਼ਰੂਰੀ ਹੈ। ਪਰ ਹਰ ਛੋਟਾ ਲੁਕਾਉਣਾ ਕੰਧ ਵਿਚ ਇਕ ਹੋਰ ਇੱਟ ਜੋੜ ਦਿੰਦਾ ਹੈ। ਨਰਮੀ ਨਾਲ ਦੱਸ ਕੇ ਵੇਖੋ ਕਿ ਤੁਸੀਂ ਡਿਜ਼ਾਈਨ ਵਿਚ ਅੱਗੇ ਵਧਣਾ ਚਾਹੁੰਦੇ ਹੋ, ਤੇ ਕਿਉਂ। ਤੁਸੀਂ ਆਦਰ ਤੇ ਸੱਚ ਦੋਵੇਂ ਇਕੱਠੇ ਰੱਖ ਸਕਦੇ ਹੋ।"}, "guilt1": {"ti": "ਦਿਲ ਨੂੰ ਸਾਫ਼ ਧੋਣਾ", "s": "ਪਿਛਲੇ ਮਹੀਨੇ ਤੁਸੀਂ ਆਪਣੇ ਛੋਟੇ ਭਰਾ ਨੂੰ ਕੁਝ ਬਹੁਤ ਕੌੜਾ ਕਹਿ ਦਿੱਤਾ ਸੀ। ਉਹ ਹੱਸ ਕੇ ਟਾਲ ਗਿਆ, ਪਰ ਤੁਸੀਂ ਉਸ ਦਾ ਚਿਹਰਾ ਵੇਖਿਆ ਸੀ। ਤੁਸੀਂ ਰਾਤ ਨੂੰ ਅਜੇ ਵੀ ਉਸ ਬਾਰੇ ਸੋਚਦੇ ਹੋ, ਤੇ ਸਮਝ ਨਹੀਂ ਆਉਂਦਾ ਕਿ ਗੱਲ ਕਿਵੇਂ ਛੇੜੀਏ।", "m": "ਜਦੋਂ ਮਨ ਮਾੜੇ ਕੰਮਾਂ ਨਾਲ ਮੈਲਾ ਹੋ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਉਹ ਨਾਮ ਦੇ ਪਿਆਰ ਨਾਲ ਧੁਲ ਕੇ ਸਾਫ਼ ਹੁੰਦਾ ਹੈ।", "k": "ਤੁਲੰਬੇ ਨੇੜੇ ਸੱਜਣ ਰਹਿੰਦਾ ਸੀ, ਜੋ ਮੁਸਾਫ਼ਰਾਂ ਲਈ ਇਕ ਸਰਾਂ ਚਲਾਉਂਦਾ ਸੀ। ਬਾਹਰੋਂ ਉਹ ਨਿੱਘ ਨਾਲ ਸਵਾਗਤ ਕਰਨ ਵਾਲਾ ਸੀ। ਪਰ ਉਸ ਦੇ ਪਿੱਛੇ, ਜਨਮਸਾਖੀ ਦੱਸਦੀ ਹੈ, ਉਹ ਉੱਥੇ ਸੌਣ ਵਾਲੇ ਮਹਿਮਾਨਾਂ ਨੂੰ ਲੁੱਟਦਾ ਤੇ ਨੁਕਸਾਨ ਪਹੁੰਚਾਉਂਦਾ ਸੀ। ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਤੇ ਭਾਈ ਮਰਦਾਨਾ ਉਸ ਦੀ ਸਰਾਂ ਵਿਚ ਰੁਕੇ, ਤਾਂ ਸੱਜਣ ਨੇ ਉਨ੍ਹਾਂ ਦੀ ਚੰਗੀ ਸੇਵਾ ਕੀਤੀ, ਤੇ ਰਾਤ ਦੀ ਉਡੀਕ ਕਰਨ ਲੱਗਾ। ਸੌਣ ਤੋਂ ਪਹਿਲਾਂ ਗੁਰੂ ਜੀ ਨੇ ਗਾਉਣ ਦੀ ਇੱਛਾ ਜਤਾਈ, ਤੇ ਮਰਦਾਨੇ ਨੇ ਰਬਾਬ ਵਜਾਈ। ਸ਼ਬਦ ਅਜਿਹੀਆਂ ਚੀਜ਼ਾਂ ਬਾਰੇ ਸੀ ਜੋ ਬਾਹਰੋਂ ਚਮਕਦੀਆਂ ਤੇ ਸਾਫ਼ ਦਿਸਦੀਆਂ ਹਨ, ਪਰ ਅੰਦਰੋਂ ਕਾਲੀਆਂ ਰਹਿੰਦੀਆਂ ਹਨ। ਸੱਜਣ ਨੇ ਸੁਣਿਆ, ਤੇ ਉਸ ਨੂੰ ਆਪਣਾ ਚਿਹਰਾ ਦਿਸ ਪਿਆ। ਉਹ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਡਿੱਗ ਪਿਆ ਤੇ ਸਭ ਕੁਝ ਮੰਨ ਲਿਆ। ਗੁਰੂ ਨਾਨਕ ਨੇ ਕਿਹਾ ਕਿ ਜੋ ਕੁਝ ਗ਼ਲਤ ਤਰੀਕੇ ਨਾਲ ਲਿਆ ਹੈ ਉਹ ਮੋੜ ਦੇ, ਤੇ ਫਿਰ ਤੋਂ ਸ਼ੁਰੂ ਕਰ। ਸੱਜਣ ਨੇ ਇਹੀ ਕੀਤਾ। ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਉਸ ਦੀ ਸਰਾਂ ਉਨ੍ਹਾਂ ਪਹਿਲੀਆਂ ਥਾਵਾਂ ਵਿਚੋਂ ਇਕ ਬਣੀ ਜਿੱਥੇ ਲੋਕ ਗੁਰੂ ਨਾਨਕ ਦੇ ਸ਼ਬਦ ਗਾਉਣ ਲਈ ਇਕੱਠੇ ਹੁੰਦੇ ਸਨ।", "a": "ਗੁਰੂ ਨਾਨਕ ਦੋਸ਼ੀ ਮਨ ਦੀ ਤੁਲਨਾ ਮੈਲੇ ਕੱਪੜਿਆਂ ਨਾਲ ਕਰਦੇ ਹਨ। ਰਾਹ ਦੀ ਧੂੜ ਨਾਲ ਮੈਲੇ ਕੱਪੜੇ ਪਾਣੀ ਤੇ ਸਾਬਣ ਨਾਲ ਧੁਲਦੇ ਹਨ। ਮਾੜੇ ਕੰਮਾਂ ਨਾਲ ਮੈਲਾ ਮਨ ਨਾਮ ਨਾਲ ਧੁਲਦਾ ਹੈ, ਯਾਨੀ ਉਸ ਇਕ ਦੇ ਪਿਆਰ ਤੇ ਯਾਦ ਨਾਲ। ਵੇਖੋ ਇਹ ਪੰਕਤੀ ਕੀ ਨਹੀਂ ਕਹਿੰਦੀ। ਇਹ ਨਹੀਂ ਕਹਿੰਦੀ ਕਿ ਤੁਸੀਂ ਸਦਾ ਲਈ ਮੈਲੇ ਹੋ। ਇਹ ਕਹਿੰਦੀ ਹੈ ਕਿ ਧੁਲਣਾ ਮੁਮਕਿਨ ਹੈ। ਸੱਜਣ ਨੇ ਸਾਡੇ ਵਿਚੋਂ ਬਹੁਤਿਆਂ ਨਾਲੋਂ ਕਿਤੇ ਮਾੜੇ ਕੰਮ ਕੀਤੇ ਸਨ, ਫਿਰ ਵੀ ਉਸ ਦੀ ਕਹਾਣੀ ਸਜ਼ਾ ਉੱਤੇ ਨਹੀਂ, ਇਕ ਨਵੀਂ ਸ਼ੁਰੂਆਤ ਉੱਤੇ ਮੁੱਕਦੀ ਹੈ। ਇਹ ਵੀ ਵੇਖੋ ਕਿ ਧੁਲਣ ਲਈ ਕੀ ਚਾਹੀਦਾ ਸੀ। ਉਸ ਨੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਸਾਫ਼ ਵੇਖਣਾ ਪਿਆ, ਮੰਨਣਾ ਪਿਆ, ਤੇ ਜੋ ਲਿਆ ਸੀ ਮੋੜਨਾ ਪਿਆ। ਠੀਕ ਵਰਤਿਆ ਜਾਵੇ ਤਾਂ ਪਛਤਾਵਾ ਉਸ ਦਾਗ਼ ਵਰਗਾ ਹੈ ਜੋ ਆਖ਼ਰ ਦਿਸ ਪਿਆ। ਇਹ ਸਾਫ਼ ਹੋਣ ਵੱਲ ਪਹਿਲਾ ਕਦਮ ਹੈ, ਕਹਾਣੀ ਦਾ ਅੰਤ ਨਹੀਂ।", "b": "ਮਨੋਵਿਗਿਆਨੀ ਪਛਤਾਵੇ ਤੇ ਸ਼ਰਮ ਵਿਚ ਫ਼ਰਕ ਕਰਦੇ ਹਨ। ਪਛਤਾਵਾ ਕਹਿੰਦਾ ਹੈ, ਮੈਂ ਇਕ ਮਾੜਾ ਕੰਮ ਕੀਤਾ। ਸ਼ਰਮ ਕਹਿੰਦੀ ਹੈ, ਮੈਂ ਹੀ ਮਾੜਾ ਹਾਂ। ਜੂਨ ਟੈਂਗਨੀ ਤੇ ਦੂਜੇ ਖੋਜੀਆਂ ਦਾ ਕੰਮ ਦੱਸਦਾ ਹੈ ਕਿ ਪਛਤਾਵਾ ਅਕਸਰ ਇਨਸਾਨ ਨੂੰ ਨੁਕਸਾਨ ਠੀਕ ਕਰਨ ਵੱਲ ਧੱਕਦਾ ਹੈ, ਜਦ ਕਿ ਸ਼ਰਮ ਉਸ ਨੂੰ ਲੁਕਣ, ਮੁੱਕਰਨ ਜਾਂ ਭੜਕਣ ਵੱਲ। ਇਸ ਲਈ ਕੰਮ ਦਾ ਸਵਾਲ ਇਹ ਨਹੀਂ ਕਿ ਮੈਂ ਕਿਹੋ ਜਿਹਾ ਇਨਸਾਨ ਹਾਂ? ਸਵਾਲ ਇਹ ਹੈ ਕਿ ਇਸ ਨੂੰ ਠੀਕ ਕਰਨ ਲਈ ਮੈਂ ਕੀ ਕਰ ਸਕਦਾ ਹਾਂ? ਜਵਾਬ ਅਕਸਰ ਛੋਟਾ ਤੇ ਹਿੰਮਤ ਵਾਲਾ ਹੁੰਦਾ ਹੈ: ਬਿਨਾਂ ਬਹਾਨਿਆਂ ਦੇ ਇਕ ਸੱਚੀ ਮਾਫ਼ੀ। ਮੈਂ ਗ਼ਲਤ ਸੀ, ਤੇ ਮੈਨੂੰ ਅਫ਼ਸੋਸ ਹੈ ਕਿ ਤੈਨੂੰ ਮਾੜਾ ਲੱਗਾ। ਫਿਰ ਆਪਣਾ ਵਰਤਾਓ ਬਦਲਣਾ। ਮਾਫ਼ੀ ਨੂੰ ਪਰਫ਼ੈਕਟ ਹੋਣ ਦੀ ਲੋੜ ਨਹੀਂ। ਉਸ ਨੂੰ ਸੱਚਾ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ। ਬਹੁਤੇ ਲੋਕ ਸਾਡੇ ਦੇਰ ਰਾਤ ਦੇ ਡਰਾਂ ਨਾਲੋਂ ਕਿਤੇ ਵੱਧ ਮਾਫ਼ ਕਰਨ ਵਾਲੇ ਹੁੰਦੇ ਹਨ।", "t": "ਕਿਸੇ ਇਕ ਅਜਿਹੇ ਇਨਸਾਨ ਬਾਰੇ ਸੋਚੋ ਜਿਸ ਨੂੰ ਤੁਸੀਂ ਸੱਟ ਮਾਰੀ ਤੇ ਕਦੇ ਮਾਫ਼ੀ ਨਹੀਂ ਮੰਗੀ। ਇਸ ਹਫ਼ਤੇ ਇਕ ਛੋਟਾ, ਸੱਚਾ ਸੁਨੇਹਾ ਭੇਜੋ: ਮੈਂ ਗ਼ਲਤ ਸੀ, ਮੈਨੂੰ ਮਾਫ਼ ਕਰ ਦੇ। ਕੋਈ ਬਹਾਨਾ ਨਹੀਂ।", "q": "ਤੁਸੀਂ ਆਪਣੀ ਸਭ ਤੋਂ ਚੰਗੀ ਸਹੇਲੀ ਦਾ ਜਨਮਦਿਨ ਭੁੱਲ ਗਏ, ਤੇ ਉਹ ਚੁੱਪ ਚਾਪ ਦੁਖੀ ਲੱਗ ਰਹੀ ਹੈ। ਸਭ ਤੋਂ ਚੰਗਾ ਕੀ ਕਰਨਾ ਹੋਵੇਗਾ?", "o": ["ਇਉਂ ਵਿਖਾਉਣਾ ਕਿ ਤੁਸੀਂ ਧਿਆਨ ਹੀ ਨਹੀਂ ਦਿੱਤਾ", "ਸੱਚੇ ਮਨ ਨਾਲ ਮਾਫ਼ੀ ਮੰਗਣੀ, ਤੇ ਭਰਪਾਈ ਲਈ ਇਕ ਛੋਟਾ ਜਿਹਾ ਸਰਪ੍ਰਾਈਜ਼ ਪਲਾਨ ਕਰਨਾ", "ਲੰਮਾ ਸਮਝਾਉਣਾ ਕਿ ਤੁਸੀਂ ਕਿੰਨੇ ਰੁੱਝੇ ਸੀ"], "y": "ਬਹੁਤ ਪਿਆਰਾ। ਸੱਚੀ ਮਾਫ਼ੀ ਤੇ ਸੰਭਾਲ ਦਾ ਇਕ ਛੋਟਾ ਜਿਹਾ ਕੰਮ, ਦਾਗ਼ ਧੋਣ ਦਾ ਇਹੀ ਤਰੀਕਾ ਹੈ। ਉਸ ਨੂੰ ਉਹ ਦਿਨ ਘੱਟ ਯਾਦ ਰਹੇਗਾ ਜਦੋਂ ਤੁਸੀਂ ਭੁੱਲੇ, ਤੇ ਉਹ ਵੱਧ ਯਾਦ ਰਹੇਗਾ ਜਦੋਂ ਤੁਸੀਂ ਗੱਲ ਠੀਕ ਕੀਤੀ।", "n": "ਇਹ ਕੁਦਰਤੀ ਪ੍ਰਤੀਕਿਰਿਆ ਹੈ। ਜਦੋਂ ਅਸੀਂ ਦੋਸ਼ੀ ਮਹਿਸੂਸ ਕਰਦੇ ਹਾਂ, ਤਾਂ ਲੁਕਣਾ ਜਾਂ ਸਫ਼ਾਈ ਦੇਣਾ ਚਾਹੁੰਦੇ ਹਾਂ। ਪਰ ਲੰਮੇ ਬਹਾਨੇ ਇਉਂ ਲੱਗ ਸਕਦੇ ਹਨ ਜਿਵੇਂ ਉਸ ਦਾ ਦੁੱਖ ਮਾਇਨੇ ਨਹੀਂ ਰੱਖਦਾ। ਇਕ ਸਿੱਧੀ, ਸੱਚੀ ਮਾਫ਼ੀ ਤੇ ਭਰਪਾਈ ਲਈ ਇਕ ਛੋਟਾ ਜਿਹਾ ਕੰਮ ਕਰ ਕੇ ਵੇਖੋ। ਇਹੀ ਜ਼ਖ਼ਮ ਭਰਦਾ ਹੈ।"}, "joy1": {"ti": "ਖ਼ੁਸ਼ੀ ਵੰਡਣ ਲਈ ਹੁੰਦੀ ਹੈ", "s": "ਤੁਹਾਡਾ ਨਤੀਜਾ ਆਇਆ ਹੈ, ਤੇ ਉਮੀਦ ਤੋਂ ਵੀ ਚੰਗਾ ਹੈ। ਮਨ ਗਾਉਣ ਨੂੰ ਕਰਦਾ ਹੈ। ਤੁਸੀਂ ਆਪਣੀ ਸਭ ਤੋਂ ਚੰਗੀ ਦੋਸਤ ਨੂੰ ਫ਼ੋਨ ਕਰਦੇ ਹੋ, ਤੇ ਅਚਾਨਕ ਖ਼ੁਸ਼ੀ ਦੁੱਗਣੀ ਲੱਗਣ ਲੱਗ ਪੈਂਦੀ ਹੈ।", "m": "ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਦਾ ਦਿਲ ਉਸ ਇਕ ਵੱਲ ਮੁੜਿਆ ਹੈ, ਉਹ ਸਦਾ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ।", "k": "ਭਾਈ ਮਰਦਾਨਾ ਗੁਰੂ ਨਾਨਕ ਦੇ ਪਿੰਡ ਵਿਚ ਹੀ ਪਲੇ ਵੱਡੇ ਹੋਏ ਸਨ, ਤੇ ਬਚਪਨ ਤੋਂ ਉਨ੍ਹਾਂ ਦੇ ਦੋਸਤ ਸਨ। ਉਹ ਇਕ ਮੁਸਲਮਾਨ ਸੰਗੀਤਕਾਰ ਸਨ ਜੋ ਰਬਾਬ ਵਜਾਉਂਦੇ ਸਨ, ਤਾਰਾਂ ਵਾਲਾ ਇਕ ਸਾਜ਼। ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਆਪਣੀਆਂ ਲੰਮੀਆਂ ਯਾਤਰਾਵਾਂ ਉੱਤੇ ਨਿਕਲੇ, ਤਾਂ ਮਰਦਾਨਾ ਉਨ੍ਹਾਂ ਨਾਲ ਗਏ, ਬਹੁਤ ਸਾਲਾਂ ਤਕ ਤੇ ਹਜ਼ਾਰਾਂ ਮੀਲ। ਪੁਰਾਣੀਆਂ ਸਾਖੀਆਂ ਦੱਸਦੀਆਂ ਹਨ ਕਿ ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਦੇ ਮਨ ਵਿਚ ਨਵੇਂ ਬਚਨ ਉੱਠਦੇ, ਤਾਂ ਉਹ ਆਪਣੇ ਦੋਸਤ ਵੱਲ ਮੁੜ ਕੇ ਕਹਿੰਦੇ: ਮਰਦਾਨਿਆ, ਰਬਾਬ ਛੇੜ, ਬਾਣੀ ਆਈ ਹੈ। ਤੇ ਉੱਥੇ ਹੀ, ਕਿਸੇ ਰੁੱਖ ਹੇਠ ਜਾਂ ਦਰਿਆ ਕੰਢੇ, ਸੰਗੀਤ ਤੇ ਬਚਨ ਨਾਲ ਨਾਲ ਵਹਿ ਤੁਰਦੇ। ਉਨ੍ਹਾਂ ਦੀ ਖ਼ੁਸ਼ੀ ਕਦੇ ਆਪਣੇ ਤਕ ਨਹੀਂ ਰੱਖੀ ਗਈ। ਉਹ ਗਾਈ ਜਾਂਦੀ ਸੀ, ਤੇ ਜੋ ਵੀ ਸੁਣਨ ਆਉਂਦਾ, ਉਸ ਨਾਲ ਵੰਡੀ ਜਾਂਦੀ ਸੀ।", "a": "ਇਸ ਪੰਕਤੀ ਦੇ ਸ਼ਬਦ ਵਿਗਾਸੁ ਦਾ ਮਤਲਬ ਹੈ ਖਿੜਨਾ, ਜਿਵੇਂ ਸਵੇਰੇ ਫੁੱਲ ਖੁੱਲ੍ਹਦਾ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ ਕਿ ਜਿਨ੍ਹਾਂ ਦਾ ਦਿਲ ਉਸ ਇਕ ਵੱਲ ਮੁੜਿਆ ਹੈ, ਉਹ ਇਸੇ ਤਰ੍ਹਾਂ ਦੀ ਖ਼ੁਸ਼ੀ ਵਿਚ ਜਿਊਂਦੇ ਹਨ। ਇਹ ਕੋਈ ਪਾਰਟੀ ਨਹੀਂ ਜੋ ਅੱਧੀ ਰਾਤ ਨੂੰ ਮੁੱਕ ਜਾਵੇ। ਇਹ ਇਕ ਟਿਕਿਆ ਹੋਇਆ ਖਿੜਨਾ ਹੈ ਜੋ ਸਾਧਾਰਨ ਦਿਨਾਂ ਵਿਚ ਵੀ ਰਹਿੰਦਾ ਹੈ। ਮਰਦਾਨੇ ਦੀ ਰਬਾਬ ਵਿਖਾਉਂਦੀ ਹੈ ਕਿ ਇਹ ਖ਼ੁਸ਼ੀ ਕਦੇ ਫਿੱਕੀ ਜਾਂ ਭਾਰੀ ਨਹੀਂ ਸੀ। ਇਹ ਸੰਗੀਤ ਭਰੀ, ਨਿੱਘੀ ਤੇ ਦੋਸਤੀ ਨਾਲ ਭਰੀ ਸੀ। ਹਿੰਦੂ ਘਰ ਜੰਮੇ ਇਕ ਗੁਰੂ ਤੇ ਮੁਸਲਮਾਨ ਘਰ ਜੰਮੇ ਇਕ ਸੰਗੀਤਕਾਰ ਦਹਾਕਿਆਂ ਤਕ ਇਕੱਠੇ ਗਾਉਂਦੇ ਹੋਏ ਘੁੰਮੇ। ਉਨ੍ਹਾਂ ਦੀ ਖ਼ੁਸ਼ੀ ਨੇ ਉਹ ਸਾਰੀਆਂ ਲਕੀਰਾਂ ਪਾਰ ਕਰ ਦਿੱਤੀਆਂ ਜੋ ਲੋਕ ਅਕਸਰ ਖਿੱਚਦੇ ਹਨ। ਸੱਚੀ ਖ਼ੁਸ਼ੀ ਇਹੀ ਕਰਦੀ ਹੈ। ਉਹ ਸਾਨੂੰ ਹੰਕਾਰੀ ਨਹੀਂ ਬਣਾਉਂਦੀ। ਉਹ ਸਾਨੂੰ ਦੂਜਿਆਂ ਨੂੰ ਨਾਲ ਜੋੜਨ ਲਈ ਕਹਿੰਦੀ ਹੈ।", "b": "ਖ਼ੁਸ਼ੀ ਉੱਤੇ ਖੋਜ ਕਰਨ ਵਾਲੇ ਮਨੋਵਿਗਿਆਨੀਆਂ ਨੇ ਇਕ ਸਿੱਧੀ ਜਿਹੀ ਗੱਲ ਵੇਖੀ ਹੈ। ਜਦੋਂ ਅਸੀਂ ਕਿਸੇ ਨੂੰ ਆਪਣੀ ਚੰਗੀ ਖ਼ਬਰ ਦੱਸਦੇ ਹਾਂ, ਤੇ ਉਹ ਸੱਚੀ ਦਿਲਚਸਪੀ ਨਾਲ ਜਵਾਬ ਦਿੰਦਾ ਹੈ, ਤਾਂ ਚੰਗਾ ਅਹਿਸਾਸ ਅਕਸਰ ਵੱਧ ਦੇਰ ਟਿਕਦਾ ਹੈ। ਵੰਡੀ ਹੋਈ ਖ਼ੁਸ਼ੀ ਵਧਦੀ ਹੈ। ਖ਼ੁਸ਼ੀ ਸੰਗੀਤ ਨਾਲ, ਇਕੱਠੇ ਖਾਣ ਨਾਲ, ਤੇ ਇਕੱਠੇ ਹੱਸਣ ਨਾਲ ਵੀ ਫੈਲਦੀ ਹੈ। ਤੇ ਇਕ ਗੱਲ ਹੋਰ। ਜੋ ਲੋਕ ਛੋਟੀਆਂ ਚੀਜ਼ਾਂ ਲਈ ਸ਼ੁਕਰਗੁਜ਼ਾਰ ਰਹਿੰਦੇ ਹਨ, ਇਕ ਚੰਗੀ ਚਾਹ, ਧੁੱਪ ਵਾਲੀ ਬਾਰੀ, ਕਿਸੇ ਦੋਸਤ ਦੀ ਆਵਾਜ਼, ਉਹ ਸਮੇਂ ਨਾਲ ਉਨ੍ਹਾਂ ਲੋਕਾਂ ਨਾਲੋਂ ਵੱਧ ਖ਼ੁਸ਼ ਰਹਿੰਦੇ ਹਨ ਜੋ ਵੱਡੀਆਂ ਜਿੱਤਾਂ ਦੀ ਉਡੀਕ ਕਰਦੇ ਹਨ। ਤੁਹਾਨੂੰ ਕਿਸੇ ਪਰਫ਼ੈਕਟ ਦਿਨ ਦੀ ਉਡੀਕ ਨਹੀਂ ਕਰਨੀ। ਇਕ ਛੋਟਾ ਜਿਹਾ ਖਿੜਨਾ, ਜਿਸ ਨੂੰ ਵੇਖਿਆ ਤੇ ਵੰਡਿਆ ਜਾਵੇ, ਉਹੀ ਅਸਲ ਚੀਜ਼ ਹੈ।", "t": "ਅੱਜ ਕਿਸੇ ਨਾਲ ਇਕ ਛੋਟੀ ਖ਼ੁਸ਼ੀ ਵੰਡੋ: ਤੁਹਾਡਾ ਪਸੰਦੀਦਾ ਗੀਤ, ਕੋਈ ਮਜ਼ੇਦਾਰ ਤਸਵੀਰ, ਕੋਈ ਚੰਗੀ ਖ਼ਬਰ। ਤੇ ਜਦੋਂ ਕੋਈ ਆਪਣੀ ਖ਼ੁਸ਼ੀ ਵੰਡੇ, ਤਾਂ ਸੱਚੇ ਦਿਲੋਂ ਖ਼ੁਸ਼ ਹੋ ਕੇ ਜਵਾਬ ਦਿਓ।", "q": "ਤੁਹਾਡੀ ਸਾਥਣ ਜੋਸ਼ ਨਾਲ ਦੱਸਦੀ ਹੈ ਕਿ ਉਸ ਦੀ ਹੁਣੇ ਹੁਣੇ ਮੰਗਣੀ ਹੋਈ ਹੈ। ਤੁਸੀਂ ਇਕ ਰਿਪੋਰਟ ਪੂਰੀ ਕਰਨ ਵਿਚ ਰੁੱਝੇ ਹੋ। ਸਭ ਤੋਂ ਚੰਗਾ ਜਵਾਬ ਕੀ ਹੋਵੇਗਾ?", "o": ["ਬਿਨਾਂ ਉੱਤੇ ਵੇਖੇ ਵਧਾਈ ਕਹਿ ਦੇਣੀ", "ਇਕ ਮਿੰਟ ਰੁਕ ਕੇ, ਮੁਸਕਰਾ ਕੇ ਪੁੱਛਣਾ ਕਿ ਇਹ ਕਿਵੇਂ ਹੋਇਆ", "ਉਸ ਦੀ ਥਾਂ ਆਪਣੀਆਂ ਯੋਜਨਾਵਾਂ ਬਾਰੇ ਦੱਸਣ ਲੱਗ ਪੈਣਾ"], "y": "ਬਹੁਤ ਵਧੀਆ। ਇਕ ਮਿੰਟ ਦੀ ਸੱਚੀ ਖ਼ੁਸ਼ੀ ਉਸ ਦੀ ਖ਼ੁਸ਼ੀ ਦੁੱਗਣੀ ਕਰ ਦਿੰਦੀ ਹੈ, ਤੇ ਚੁੱਪ ਚਾਪ ਤੁਹਾਡੀ ਵੀ। ਖ਼ੁਸ਼ੀ ਇਉਂ ਹੀ ਕੰਮ ਕਰਦੀ ਹੈ: ਵੰਡੀ ਜਾਂਦੀ ਹੈ, ਜਮ੍ਹਾਂ ਨਹੀਂ ਕੀਤੀ ਜਾਂਦੀ।", "n": "ਰੁੱਝੇ ਹੋਣ ਵੇਲੇ ਇਹ ਬਹੁਤ ਆਮ ਜਵਾਬ ਹੈ। ਪਰ ਖ਼ਬਰ ਨਾਲ ਭਰੇ ਕਿਸੇ ਇਨਸਾਨ ਨੂੰ ਛੇਤੀ ਵਾਲੀ ਵਧਾਈ ਫਿੱਕੀ ਲੱਗ ਸਕਦੀ ਹੈ। ਇਕ ਮਿੰਟ ਰੁਕ ਕੇ ਉਸ ਦੀ ਖ਼ੁਸ਼ੀ ਵਿਚ ਸ਼ਾਮਲ ਹੋ ਕੇ ਵੇਖੋ। ਖ਼ੁਸ਼ੀ ਉਦੋਂ ਵਧਦੀ ਹੈ ਜਦੋਂ ਉਸ ਨੂੰ ਪਿਆਰ ਨਾਲ ਲਿਆ ਜਾਵੇ, ਤੇ ਰਿਪੋਰਟ ਸੱਠ ਸਕਿੰਟ ਉਡੀਕ ਕਰ ਸਕਦੀ ਹੈ।"}, "lonely1": {"ti": "ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਕੋਈ ਨਹੀਂ", "s": "ਤੁਸੀਂ ਕੰਮ ਲਈ ਇਕ ਨਵੇਂ ਸ਼ਹਿਰ ਆਏ ਹੋ। ਵੀਕਐਂਡ ਸਭ ਤੋਂ ਔਖੇ ਹੁੰਦੇ ਹਨ। ਔਨਲਾਈਨ ਹਰ ਕੋਈ ਦੋਸਤਾਂ ਨਾਲ ਦਿਸਦਾ ਹੈ, ਤੇ ਤੁਹਾਡਾ ਕਮਰਾ ਬਹੁਤ, ਬਹੁਤ ਸੁੰਨਾ ਲੱਗਦਾ ਹੈ।", "m": "ਸਾਰੇ ਜੀਆਂ ਦਾ ਇਕੋ ਦਾਤਾ ਹੈ। ਉਹ ਮੈਨੂੰ ਕਦੇ ਨਾ ਭੁੱਲੇ।", "k": "ਪੱਛਮ ਦੀ ਯਾਤਰਾ ਵਿਚ ਗੁਰੂ ਨਾਨਕ ਮੱਕੇ ਪਹੁੰਚੇ। ਸਫ਼ਰ ਤੋਂ ਥੱਕ ਕੇ ਉਹ ਆਰਾਮ ਕਰਨ ਲੇਟੇ, ਤੇ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰ ਸਬੱਬ ਨਾਲ ਕਾਬੇ ਵੱਲ ਹੋ ਗਏ। ਇਕ ਬੰਦੇ ਨੇ ਇਹ ਵੇਖਿਆ ਤੇ ਗੁੱਸੇ ਨਾਲ ਉਨ੍ਹਾਂ ਨੂੰ ਜਗਾਇਆ। ਤੂੰ ਖ਼ੁਦਾ ਦੇ ਘਰ ਵੱਲ ਪੈਰ ਕਰਨ ਦੀ ਹਿੰਮਤ ਕਿਵੇਂ ਕਰਦਾ ਹੈਂ, ਉਸ ਨੇ ਪੁੱਛਿਆ। ਗੁਰੂ ਨਾਨਕ ਨੇ ਨਰਮੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ: ਤਾਂ ਮੇਰੇ ਪੈਰ ਉਸ ਦਿਸ਼ਾ ਵੱਲ ਕਰ ਦੇ ਜਿੱਥੇ ਖ਼ੁਦਾ ਨਾ ਹੋਵੇ। ਭਾਈ ਗੁਰਦਾਸ, ਜਿਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਦੇ ਸਮੇਂ ਦੀਆਂ ਯਾਦਾਂ ਤਾਜ਼ੀਆਂ ਰਹਿੰਦਿਆਂ ਲਿਖਿਆ, ਆਪਣੀ ਪਹਿਲੀ ਵਾਰ ਵਿਚ ਇਹ ਕਹਾਣੀ ਦੱਸਦੇ ਹਨ। ਉਸ ਬੰਦੇ ਕੋਲ ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਸੀ। ਅਜਿਹੀ ਕੋਈ ਦਿਸ਼ਾ ਨਹੀਂ ਜਿੱਥੇ ਉਹ ਇਕ ਨਾ ਹੋਵੇ।", "a": "ਗੁਰੂ ਨਾਨਕ ਦੀ ਪੰਕਤੀ ਛੋਟੀ ਹੈ: ਸਾਰੇ ਜੀਆਂ ਦਾ ਇਕ ਦਾਤਾ ਹੈ, ਉਹ ਮੈਨੂੰ ਕਦੇ ਨਾ ਭੁੱਲੇ। ਹਰ ਕੋਈ ਉਸੇ ਦਾਤੇ ਦੇ ਸਹਾਰੇ ਹੈ। ਤੁਸੀਂ, ਤੁਹਾਡੇ ਆਲੇ ਦੁਆਲੇ ਸ਼ਹਿਰ ਦੇ ਲੋਕ, ਦੂਰ ਬੈਠਾ ਤੁਹਾਡਾ ਦੋਸਤ, ਬੱਸ ਵਿਚ ਬੈਠਾ ਅਜਨਬੀ ਵੀ। ਮੱਕੇ ਦੀ ਸਾਖੀ ਇਸ ਨੂੰ ਇਕ ਸਿੱਧੀ ਤਸਵੀਰ ਵਿਚ ਰੱਖ ਦਿੰਦੀ ਹੈ। ਕਿਸੇ ਵੀ ਦਿਸ਼ਾ ਵੱਲ ਮੁੜੋ, ਉਹ ਇਕ ਪਹਿਲਾਂ ਤੋਂ ਉੱਥੇ ਹੈ। ਇਕੱਲਾਪਣ ਅਕਸਰ ਕੰਨ ਵਿਚ ਕਹਿੰਦਾ ਹੈ ਕਿ ਅਸੀਂ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਹਾਂ, ਕਿ ਬਾਕੀ ਸਾਰੇ ਕਿਸੇ ਦੇ ਹਨ ਤੇ ਅਸੀਂ ਨਹੀਂ। ਇਹ ਪੰਕਤੀ ਉਸ ਘੁਸਰ ਮੁਸਰ ਦਾ ਜਵਾਬ ਹੈ। ਕੋਈ ਬਾਹਰ ਨਹੀਂ। ਇਸ ਨਾਲ ਖ਼ਾਲੀ ਕਮਰਾ ਉਸੇ ਵੇਲੇ ਨਹੀਂ ਭਰ ਜਾਂਦਾ। ਪਰ ਕਮਰਾ ਬਦਲ ਜਾਂਦਾ ਹੈ। ਤੁਸੀਂ ਉਸ ਵਿਚ ਛੱਡੇ ਹੋਏ ਨਹੀਂ। ਤੁਸੀਂ ਸਾਂਭੇ ਹੋਏ ਹੋ, ਤੇ ਅਗਲੀ ਦੋਸਤੀ ਓਨੀ ਦੂਰ ਨਹੀਂ ਜਿੰਨੀ ਲੱਗਦੀ ਹੈ।", "b": "ਇਕੱਲਾਪਣ ਬਹੁਤ ਆਮ ਹੈ, ਖ਼ਾਸ ਕਰਕੇ ਨਵੀਂ ਥਾਂ ਜਾਣ ਤੋਂ ਬਾਅਦ, ਤੇ ਇਹ ਤੁਹਾਡੇ ਬਾਰੇ ਕੁਝ ਮਾੜਾ ਨਹੀਂ ਕਹਿੰਦਾ। ਖੋਜੀ ਲੰਮੇ ਇਕੱਲੇਪਣ ਨੂੰ ਤਣਾਅ ਤੇ ਮਾੜੀ ਨੀਂਦ ਨਾਲ ਜੋੜਦੇ ਹਨ, ਇਸ ਲਈ ਉਸ ਦੀ ਪਿਆਰ ਨਾਲ ਸੰਭਾਲ ਜ਼ਰੂਰੀ ਹੈ। ਚੰਗੀ ਖ਼ਬਰ ਇਹ ਹੈ ਕਿ ਰਿਸ਼ਤੇ ਅਕਸਰ ਛੋਟੀਆਂ, ਵਾਰ ਵਾਰ ਦੀਆਂ ਮੁਲਾਕਾਤਾਂ ਨਾਲ ਵਧਦੇ ਹਨ, ਕਿਸੇ ਇਕ ਵੱਡੇ ਪਲ ਨਾਲ ਨਹੀਂ। ਹਰ ਸਵੇਰ ਉਸੇ ਚਾਹ ਵਾਲੇ ਦਾ ਹਾਲ ਚਾਲ ਪੁੱਛਣਾ। ਹਫ਼ਤੇ ਵਿਚ ਇਕ ਵਾਰ ਕੋਈ ਕਲਾਸ, ਜਾਂ ਐਤਵਾਰ ਗੁਰਦੁਆਰੇ ਦੇ ਲੰਗਰ ਵਿਚ ਸੇਵਾ, ਜਿੱਥੇ ਬਹੁਤ ਸਾਰੇ ਹੱਥ ਇਕੱਠੇ ਕੰਮ ਕਰਦੇ ਹਨ। ਕਿਸੇ ਪੁਰਾਣੇ ਦੋਸਤ ਨੂੰ ਪੰਜ ਮਿੰਟ ਦਾ ਫ਼ੋਨ। ਹਰ ਇਕ ਇਕ ਛੋਟਾ ਧਾਗਾ ਹੈ, ਤੇ ਧਾਗੇ ਮਿਲ ਕੇ ਰੱਸੀ ਬਣਦੇ ਹਨ। ਇਹ ਵੀ ਯਾਦ ਰੱਖੋ ਕਿ ਤੁਹਾਡੇ ਆਲੇ ਦੁਆਲੇ ਬਹੁਤ ਸਾਰੇ ਲੋਕ ਚੁੱਪ ਚਾਪ ਇਕੱਲੇ ਹਨ। ਹੋ ਸਕਦਾ ਹੈ ਤੁਹਾਡੇ ਹਾਲ ਚਾਲ ਪੁੱਛਣ ਦੀ ਹੀ ਉਹ ਉਡੀਕ ਕਰ ਰਹੇ ਹੋਣ।", "t": "ਇਸ ਹਫ਼ਤੇ ਇਕ ਅਜਿਹੀ ਥਾਂ ਚੁਣੋ ਜਿੱਥੇ ਤੁਸੀਂ ਵਾਰ ਵਾਰ ਜਾ ਸਕੋ: ਕੋਈ ਕਲਾਸ, ਪਾਰਕ, ਜਾਂ ਲੰਗਰ। ਦੋ ਵਾਰ ਜਾਓ, ਤੇ ਦੋਵੇਂ ਵਾਰ ਕਿਸੇ ਇਕ ਇਨਸਾਨ ਨਾਲ ਹਾਲ ਚਾਲ ਪੁੱਛੋ।", "q": "ਨਵੇਂ ਸ਼ਹਿਰ ਵਿਚ ਐਤਵਾਰ ਦੀ ਸ਼ਾਮ ਹੈ, ਤੇ ਤੁਸੀਂ ਬਹੁਤ ਇਕੱਲੇ ਮਹਿਸੂਸ ਕਰ ਰਹੇ ਹੋ। ਚੰਗਾ ਅਗਲਾ ਕਦਮ ਕੀ ਹੈ?", "o": ["ਆਪਣੇ ਆਪ ਨੂੰ ਕਹਿਣਾ ਕਿ ਕੋਈ ਤੁਹਾਡਾ ਦੋਸਤ ਨਹੀਂ ਬਣਨਾ ਚਾਹੁੰਦਾ", "ਕਿਸੇ ਪੁਰਾਣੇ ਦੋਸਤ ਨੂੰ ਫ਼ੋਨ ਕਰਨਾ, ਤੇ ਜੁੜਨ ਲਈ ਇਕ ਸਥਾਨਕ ਗਰੁੱਪ ਲੱਭਣਾ", "ਘਰ ਰਹਿ ਕੇ ਸਾਰਿਆਂ ਦੀਆਂ ਵੀਕਐਂਡ ਤਸਵੀਰਾਂ ਵੇਖਦੇ ਰਹਿਣਾ"], "y": "ਇਹ ਹਿੰਮਤ ਵਾਲਾ ਤੇ ਪਿਆਰਾ ਕਦਮ ਹੈ। ਪੁਰਾਣਾ ਦੋਸਤ ਯਾਦ ਕਰਾਉਂਦਾ ਹੈ ਕਿ ਤੁਹਾਨੂੰ ਪਿਆਰ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਤੇ ਸਥਾਨਕ ਗਰੁੱਪ ਨਵੇਂ ਧਾਗੇ ਸ਼ੁਰੂ ਕਰਦਾ ਹੈ। ਤੁਸੀਂ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਨਹੀਂ। ਤੁਸੀਂ ਬੱਸ ਉਸ ਵਿਚ ਆਪਣੀ ਥਾਂ ਲੱਭ ਰਹੇ ਹੋ।", "n": "ਇਹ ਬਹੁਤ ਸੱਚਾ ਅਹਿਸਾਸ ਹੈ, ਤੇ ਨਵੇਂ ਸ਼ਹਿਰਾਂ ਵਿਚ ਬਹੁਤ ਲੋਕ ਇਉਂ ਮਹਿਸੂਸ ਕਰਦੇ ਹਨ। ਪਰ ਕੌੜੀ ਸੋਚ ਤੇ ਲਗਾਤਾਰ ਸਕਰੋਲਿੰਗ ਅਕਸਰ ਇਕੱਲੇਪਣ ਨੂੰ ਹੋਰ ਭਾਰਾ ਕਰ ਦਿੰਦੀ ਹੈ। ਕਿਸੇ ਪੁਰਾਣੇ ਦੋਸਤ ਨੂੰ ਫ਼ੋਨ ਕਰ ਕੇ ਤੇ ਇਕ ਸਥਾਨਕ ਗਰੁੱਪ ਲੱਭ ਕੇ ਵੇਖੋ। ਛੋਟੇ ਧਾਗੇ, ਇਕ ਇਕ ਕਰਕੇ, ਅਸਲੀ ਰਿਸ਼ਤਾ ਬਣਦੇ ਹਨ।"}, "loved1": {"ti": "ਪਿਆਰ ਭਰੀ ਨਜ਼ਰ", "s": "ਤੁਸੀਂ ਸਾਰੀ ਰਾਤ ਇਕ ਦੋਸਤ ਦਾ ਘਰ ਬਦਲਵਾਉਣ ਵਿਚ ਲੱਗੇ ਰਹੇ। ਕੱਪੜੇ ਧੂੜ ਨਾਲ ਭਰੇ ਹਨ, ਲੱਕ ਦੁਖ ਰਿਹਾ ਹੈ, ਤੇ ਕਿਸੇ ਨੇ ਬਹੁਤਾ ਕੁਝ ਨਹੀਂ ਕਿਹਾ। ਤੁਸੀਂ ਸੋਚਦੇ ਹੋ, ਕੀ ਕਿਸੇ ਨੇ ਧਿਆਨ ਵੀ ਦਿੱਤਾ?", "m": "ਜੋ ਸੁਣਦਾ ਹੈ, ਮੰਨਦਾ ਹੈ, ਤੇ ਦਿਲ ਵਿਚ ਪਿਆਰ ਰੱਖਦਾ ਹੈ, ਉਹ ਆਪਣੇ ਅੰਦਰਲੇ ਪਵਿੱਤਰ ਸਰੋਵਰ ਵਿਚ ਨ੍ਹਾ ਕੇ ਸਾਫ਼ ਹੋ ਜਾਂਦਾ ਹੈ।", "k": "ਕਰਤਾਰਪੁਰ ਵਿਚ ਇਕ ਵਾਰ ਗੁਰੂ ਨਾਨਕ ਨੇ ਪਸ਼ੂਆਂ ਲਈ ਘਾਹ ਦੀਆਂ ਤਿੰਨ ਪੰਡਾਂ ਕਟਵਾਈਆਂ। ਘਾਹ ਗਿੱਲਾ ਸੀ ਤੇ ਉਸ ਵਿਚੋਂ ਚਿੱਕੜ ਚੋ ਰਿਹਾ ਸੀ, ਤੇ ਨੇੜੇ ਖੜ੍ਹੇ ਲੋਕਾਂ ਨੇ ਚੁੱਕਣ ਤੋਂ ਬਚਣ ਦੇ ਬਹਾਨੇ ਲੱਭ ਲਏ। ਭਾਈ ਲਹਿਣਾ ਹੁਣੇ ਹੁਣੇ ਆਏ ਸਨ, ਨਵੇਂ ਕੱਪੜੇ ਪਾਏ ਹੋਏ। ਬਿਨਾਂ ਕੁਝ ਕਹੇ ਉਨ੍ਹਾਂ ਨੇ ਤਿੰਨੇ ਪੰਡਾਂ ਸਿਰ ਉੱਤੇ ਚੁੱਕੀਆਂ ਤੇ ਘਰ ਤਕ ਲੈ ਗਏ। ਚਿੱਕੜ ਵਹਿ ਕੇ ਉਨ੍ਹਾਂ ਦੇ ਕੱਪੜਿਆਂ ਉੱਤੇ ਫੈਲ ਗਿਆ। ਜਦੋਂ ਉਹ ਪਹੁੰਚੇ, ਤਾਂ ਗੁਰੂ ਜੀ ਦੀ ਪਤਨੀ, ਮਾਤਾ ਸੁਲੱਖਣੀ ਜੀ, ਇਕ ਮਹਿਮਾਨ ਤੋਂ ਅਜਿਹਾ ਕੰਮ ਕਰਵਾਏ ਜਾਣ ਉੱਤੇ ਦੁਖੀ ਹੋਏ। ਜਿਵੇਂ ਮੈਕਾਲਿਫ਼ ਨੇ ਇਸ ਪਰੰਪਰਾ ਨੂੰ ਦਰਜ ਕੀਤਾ ਹੈ, ਗੁਰੂ ਨਾਨਕ ਨੇ ਕਿਹਾ ਕਿ ਲਹਿਣੇ ਦੇ ਕੱਪੜਿਆਂ ਉੱਤੇ ਚਿੱਕੜ ਨਹੀਂ। ਇਹ ਕੇਸਰ ਹੈ, ਮਾਣ ਦਾ ਰੰਗ।", "a": "ਇਹ ਪਉੜੀ ਉਸ ਇਨਸਾਨ ਦੀ ਗੱਲ ਕਰਦੀ ਹੈ ਜੋ ਸੁਣਦਾ ਹੈ, ਮੰਨਦਾ ਹੈ, ਤੇ ਦਿਲ ਵਿਚ ਪਿਆਰ ਰੱਖਦਾ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਅਜਿਹਾ ਇਨਸਾਨ ਆਪਣੇ ਅੰਦਰਲੇ ਪਵਿੱਤਰ ਸਰੋਵਰ ਵਿਚ ਨ੍ਹਾਉਂਦਾ ਹੈ। ਇੱਥੇ ਪਿਆਰ ਸਿਰਫ਼ ਇਕ ਅਹਿਸਾਸ ਨਹੀਂ ਜੋ ਸਾਨੂੰ ਮਿਲਦਾ ਹੈ। ਇਹ ਕੁਝ ਹੈ ਜੋ ਅਸੀਂ ਸਾਂਭਦੇ ਹਾਂ, ਤੇ ਕੁਝ ਜੋ ਅਸੀਂ ਕਰਦੇ ਹਾਂ। ਭਾਈ ਲਹਿਣੇ ਨੇ ਸਿਫ਼ਤ ਲਈ ਘਾਹ ਨਹੀਂ ਚੁੱਕਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਪਿਆਰ ਕਰਕੇ ਚੁੱਕਿਆ। ਤੇ ਗੁਰੂ ਨਾਨਕ ਨੇ ਉਹ ਪਿਆਰ ਪੂਰਾ ਵੇਖਿਆ। ਜਿੱਥੇ ਦੂਜਿਆਂ ਨੂੰ ਗੰਦ ਦਿਸਿਆ, ਉਨ੍ਹਾਂ ਨੂੰ ਕੇਸਰ ਦਿਸਿਆ। ਸੱਚਾ ਪਿਆਰ ਮਿਲਣਾ ਇਉਂ ਹੀ ਲੱਗਦਾ ਹੈ। ਕੋਈ ਠੀਕ ਉਸੇ ਚੀਜ਼ ਨੂੰ ਵੇਖੇ ਜਿਸ ਨੂੰ ਤੁਸੀਂ ਭੈੜਾ ਸਮਝਦੇ ਸੀ, ਤੁਹਾਡੀ ਥਕਾਵਟ, ਤੁਹਾਡੀ ਮਿਹਨਤ, ਤੁਹਾਡੀ ਖਿੱਲਰੀ ਹਾਲਤ, ਤੇ ਉਸ ਵਿਚ ਸੁੰਦਰਤਾ ਵੇਖੇ। ਤੁਹਾਡੀ ਅਣਦਿਸਦੀ ਮਿਹਨਤ ਕਦੇ ਬੇਕਾਰ ਨਹੀਂ ਜਾਂਦੀ।", "b": "ਸਾਨੂੰ ਸਾਰਿਆਂ ਨੂੰ ਕਦਰ ਮਹਿਸੂਸ ਹੋਣ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ, ਤੇ ਸਾਡਾ ਬਹੁਤ ਸਾਰਾ ਪਿਆਰ ਰੋਜ਼ ਦੇ ਜੀਵਨ ਵਿਚ ਅਣਦੇਖਿਆ ਰਹਿ ਜਾਂਦਾ ਹੈ। ਮਾਂ ਦੀਆਂ ਦਸ ਹਜ਼ਾਰ ਰੋਟੀਆਂ। ਕਿਸੇ ਦੋਸਤ ਦੀ ਦੇਰ ਰਾਤ ਦੀ ਮਦਦ। ਮਨੋਵਿਗਿਆਨੀ ਜੌਨ ਗੌਟਮੈਨ ਨੇ ਦਹਾਕਿਆਂ ਤਕ ਜੋੜਿਆਂ ਉੱਤੇ ਅਧਿਐਨ ਕੀਤਾ, ਤੇ ਵੇਖਿਆ ਕਿ ਛੋਟੇ ਪਲ ਬਹੁਤ ਮਾਇਨੇ ਰੱਖਦੇ ਹਨ: ਇਕ ਦੂਜੇ ਵੱਲ ਧਿਆਨ ਦੇਣਾ, ਧੰਨਵਾਦ ਕਰਨਾ, ਇਕ ਦੂਜੇ ਵੱਲ ਮੁੜਨਾ। ਚੰਗੀ ਖ਼ਬਰ ਇਹ ਹੈ ਕਿ ਧਿਆਨ ਦੇਣ ਵਾਲੇ ਅਸੀਂ ਆਪ ਬਣ ਸਕਦੇ ਹਾਂ। ਜਦੋਂ ਤੁਸੀਂ ਕਹਿੰਦੇ ਹੋ, ਮੈਂ ਵੇਖਿਆ ਤੂੰ ਕਿੰਨੀ ਮਿਹਨਤ ਕੀਤੀ, ਤਾਂ ਤੁਸੀਂ ਕਿਸੇ ਦੇ ਚਿੱਕੜ ਨੂੰ ਕੇਸਰ ਬਣਾ ਦਿੰਦੇ ਹੋ। ਤੇ ਜਦੋਂ ਕੋਈ ਤੁਹਾਡੇ ਵੱਲ ਧਿਆਨ ਨਾ ਦੇਵੇ, ਤਾਂ ਭਾਈ ਲਹਿਣੇ ਨੂੰ ਯਾਦ ਕਰੋ। ਸਾਫ਼ ਦਿਲ ਨਾਲ ਦਿੱਤਾ ਪਿਆਰ ਆਪਣੇ ਆਪ ਵਿਚ ਪੂਰਾ ਹੈ। ਉਸ ਨੂੰ ਸੱਚਾ ਹੋਣ ਲਈ ਤਾੜੀਆਂ ਦੀ ਲੋੜ ਨਹੀਂ। ਫਿਰ ਵੀ, ਲੋਕਾਂ ਨੂੰ ਦੱਸਣਾ ਚੰਗਾ ਹੈ ਕਿ ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿਆਰ ਕਰਦੇ ਹੋ। ਉਡੀਕ ਨਾ ਕਰੋ।", "t": "ਅੱਜ ਕਿਸੇ ਇਕ ਇਨਸਾਨ ਦੀ ਚੁੱਪ ਚਾਪ ਕੀਤੀ ਮਿਹਨਤ ਵੱਲ ਧਿਆਨ ਦਿਓ, ਘਰ ਜਾਂ ਕੰਮ ਉੱਤੇ, ਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸਾਫ਼ ਸਾਫ਼ ਕਹੋ: ਮੈਂ ਵੇਖਿਆ ਤੁਸੀਂ ਕੀ ਕੀਤਾ। ਸ਼ੁਕਰੀਆ।", "q": "ਤੁਹਾਡੀ ਮਾਂ ਸਾਲਾਂ ਤੋਂ ਹਰ ਰੋਜ਼ ਪਰਿਵਾਰ ਲਈ ਖਾਣਾ ਬਣਾਉਂਦੀ ਹੈ। ਆਮ ਤੌਰ ਉੱਤੇ ਕੋਈ ਕੁਝ ਨਹੀਂ ਕਹਿੰਦਾ। ਅੱਜ ਰਾਤ ਤੁਸੀਂ ਕੀ ਕਰ ਸਕਦੇ ਹੋ?", "o": ["ਕੁਝ ਨਹੀਂ, ਮਾਂ ਦਾ ਖਾਣਾ ਬਣਾਉਣਾ ਤਾਂ ਆਮ ਗੱਲ ਹੈ", "ਉਨ੍ਹਾਂ ਨੂੰ ਦੱਸਣਾ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਖਾਣੇ ਵਿਚ ਤੁਹਾਨੂੰ ਕੀ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਤੇ ਧੰਨਵਾਦ ਕਰਨਾ", "ਉਨ੍ਹਾਂ ਬਾਰੇ ਔਨਲਾਈਨ ਪੋਸਟ ਪਾਉਣੀ"], "y": "ਬਹੁਤ ਸੋਹਣਾ। ਇਕ ਸਾਫ਼ ਸਾਫ਼ ਧੰਨਵਾਦ ਸਾਲਾਂ ਦੀ ਅਣਦਿਸਦੀ ਮਿਹਨਤ ਨੂੰ ਕੇਸਰ ਬਣਾ ਦਿੰਦਾ ਹੈ। ਉਨ੍ਹਾਂ ਦਾ ਚਿਹਰਾ ਵੇਖਣਾ। ਉਹ ਛੋਟਾ ਜਿਹਾ ਵਾਕ ਤੁਹਾਡੀ ਸੋਚ ਤੋਂ ਵੱਧ ਮਾਇਨੇ ਰੱਖੇਗਾ।", "n": "ਸਾਡੇ ਵਿਚੋਂ ਬਹੁਤੇ ਇਹੀ ਕਰਦੇ ਹਨ, ਬਿਨਾਂ ਕੋਈ ਮਾੜਾ ਇਰਾਦਾ ਰੱਖੇ। ਉਨ੍ਹਾਂ ਦਾ ਕੰਮ ਏਨਾ ਆਮ ਹੋ ਗਿਆ ਹੈ ਕਿ ਅਸੀਂ ਉਸ ਨੂੰ ਵੇਖਣਾ ਬੰਦ ਕਰ ਦਿੰਦੇ ਹਾਂ। ਉਨ੍ਹਾਂ ਨੂੰ ਸਿੱਧਾ ਦੱਸ ਕੇ ਵੇਖੋ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਖਾਣੇ ਵਿਚ ਤੁਹਾਨੂੰ ਕੀ ਪਸੰਦ ਹੈ, ਤੇ ਧੰਨਵਾਦ ਕਰੋ। ਵੇਖੇ ਜਾਣਾ ਇਕ ਅਜਿਹਾ ਤੋਹਫ਼ਾ ਹੈ ਜੋ ਅਸੀਂ ਹਰ ਰੋਜ਼ ਦੇ ਸਕਦੇ ਹਾਂ।"}, "fear1": {"ti": "ਜਦੋਂ ਚਿੰਤਾ ਰੁਕਦੀ ਨਹੀਂ", "s": "ਰਾਤ ਦੇ ਦੋ ਵੱਜੇ ਹਨ। ਕੱਲ੍ਹ ਪਾਪਾ ਦੀ ਜਾਂਚ ਦੀ ਰਿਪੋਰਟ ਆਉਣੀ ਹੈ। ਦਿਮਾਗ਼ ਹਰ ਮਾੜੇ ਅੰਤ ਨੂੰ ਫ਼ਿਲਮ ਵਾਂਗ ਵਾਰ-ਵਾਰ ਚਲਾ ਰਿਹਾ ਹੈ, ਅਤੇ ਫ਼ੋਨ ਉੱਤੇ ਡਰਾਉਣੇ ਸ਼ਬਦਾਂ ਨਾਲ ਭਰਿਆ ਸਰਚ ਪੇਜ ਖੁੱਲ੍ਹਾ ਹੈ। ਨੀਂਦ ਬਹੁਤ ਦੂਰ ਲੱਗਦੀ ਹੈ।", "m": "ਜੋ ਪਾਰਬ੍ਰਹਮ ਦੀ ਸ਼ਰਨ ਵਿੱਚ ਹੈ, ਉਸ ਨੂੰ ਤੱਤੀ ਹਵਾ ਨਹੀਂ ਲੱਗਦੀ। ਸਾਡੇ ਚੁਫੇਰੇ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੀ ਰੱਖਿਆ ਦੀ ਲਕੀਰ ਹੈ; ਭਾਈ, ਕੋਈ ਦੁੱਖ ਸਾਨੂੰ ਛੂਹ ਨਹੀਂ ਸਕਦਾ।", "k": "ਸਿੱਖ ਪਰੰਪਰਾ ਯਾਦ ਕਰਦੀ ਹੈ ਕਿ ਜਦੋਂ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਛੋਟੇ ਪੁੱਤਰ ਹਰਗੋਬਿੰਦ ਨੂੰ ਚੇਚਕ ਹੋ ਗਈ, ਤਾਂ ਆਲੇ-ਦੁਆਲੇ ਬਹੁਤ ਲੋਕ ਡਰ ਗਏ। ਕੁਝ ਨੇ ਕਿਹਾ ਕਿ ਰਿਵਾਜ ਮੁਤਾਬਕ ਚੇਚਕ ਦੀ ਦੇਵੀ ਨੂੰ ਚੜ੍ਹਾਵਾ ਚੜ੍ਹਾਓ। ਗੁਰੂ ਜੀ ਨੇ ਅਜਿਹਾ ਨਹੀਂ ਕੀਤਾ। ਉਹ ਬੱਚੇ ਦੇ ਕੋਲ ਰਹੇ, ਸੰਗਤ ਨੂੰ ਕੀਰਤਨ ਅਤੇ ਅਰਦਾਸ ਨਾਲ ਜੋੜੀ ਰੱਖਿਆ, ਅਤੇ ਕਰਤਾਰ ਉੱਤੇ ਭਰੋਸਾ ਰੱਖਿਆ। ਜਦੋਂ ਬੱਚਾ ਠੀਕ ਹੋਇਆ, ਤਾਂ ਗੁਰੂ ਜੀ ਦਾ ਸ਼ੁਕਰਾਨਾ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਵਿੱਚ ਇੱਕ ਸ਼ਬਦ ਬਣ ਗਿਆ: ਸੀਤਲਾ ਤੇ ਰਖਿਆ ਬਿਹਾਰੀ, ਤੂੰ ਆਪ ਹੀ ਉਸ ਨੂੰ ਚੇਚਕ ਤੋਂ ਬਚਾਇਆ, ਅੰਗ 200। ਗੁਰੂ ਜੀ ਨੇ ਖ਼ਤਰੇ ਤੋਂ ਇਨਕਾਰ ਨਹੀਂ ਕੀਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਘਬਰਾਹਟ ਦੀ ਥਾਂ ਦੇਖਭਾਲ, ਸਾਥ ਅਤ
