ਭਣਾ ਤਾਂ ਜੋ ਚੰਗਾ ਲੱਗੇ"], "y": "ਬਿਲਕੁਲ। ਆਪਣੇ ਆਪ ਨੂੰ ਆਪਣੇ ਪਿਛਲੇ ਸਾਲ ਨਾਲ ਮਾਪਣਾ ਇਨਸਾਫ਼ ਵਾਲਾ ਵੀ ਹੈ ਅਤੇ ਕੰਮ ਦਾ ਵੀ। ਅਤੇ ਸਾੜੇ ਨੂੰ ਜਗਿਆਸਾ ਵਿੱਚ ਬਦਲਣਾ ਦਰਦ ਦੇ ਪਲ ਨੂੰ ਸਬਕ ਬਣਾ ਦਿੰਦਾ ਹੈ।", "n": "ਇਹ ਬਹੁਤ ਇਨਸਾਨੀ ਪ੍ਰਤੀਕਿਰਿਆ ਹੈ। ਪਰ ਜ਼ਿੰਦਗੀ ਨੂੰ ਬੇਇਨਸਾਫ਼ ਕਹਿਣ ਨਾਲ ਕੋਸ਼ਿਸ਼ ਰੁਕ ਜਾਂਦੀ ਹੈ, ਅਤੇ ਉਸ ਦੀਆਂ ਕਮੀਆਂ ਲੱਭਣਾ ਮਨ ਨੂੰ ਛੋਟਾ ਕਰਦਾ ਹੈ। ਆਪਣੇ ਪਿਛਲੇ ਸਾਲ ਨਾਲ ਤੁਲਨਾ ਕਰੋ, ਅਤੇ ਪੁੱਛੋ ਉਸ ਤੋਂ ਕੀ ਸਿੱਖ ਸਕਦੇ ਹੋ।", "d": "ਇੱਕ ਅਮੀਰ ਅਫ਼ਸਰ ਮਲਿਕ ਭਾਗੋ ਨੇ ਵੱਡਾ ਭੋਜ ਰੱਖਿਆ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਉਸ ਦੀ ਥਾਂ ਭਾਈ ਲਾਲੋ ਦੀ ਕੋਧਰੇ ਦੀ ਰੋਟੀ ਚੁਣੀ, ਜੋ ਇਮਾਨਦਾਰੀ ਨਾਲ ਕਮਾਉਣ ਵਾਲਾ ਤਰਖਾਣ ਸੀ। ਜਨਮਸਾਖੀ ਕਹਿੰਦੀ ਹੈ ਕਿ ਗੁਰੂ ਜੀ ਨੇ ਦੋਹਾਂ ਨੂੰ ਨਿਚੋੜਿਆ: ਲਾਲੋ ਦੀ ਰੋਟੀ ਵਿੱਚੋਂ ਦੁੱਧ ਨਿਕਲਿਆ, ਭਾਗੋ ਦੇ ਪਕਵਾਨ ਵਿੱਚੋਂ ਲਹੂ। ਕੀਮਤ ਥਾਲੀ ਦੇ ਆਕਾਰ ਵਿੱਚ ਨਹੀਂ। ਤੁਲਨਾ ਕਿਉਂ ਚੁੱਭਦੀ ਹੈ? ਅਸੀਂ ਆਪਣੇ ਆਮ ਅੰਦਰ ਦੀ ਤੁਲਨਾ ਦੂਜਿਆਂ ਦੇ ਸਭ ਤੋਂ ਚੰਗੇ ਬਾਹਰ ਨਾਲ ਕਰਦੇ ਹਾਂ। ਲਿਓਨ ਫ਼ੈਸਟਿੰਗਰ ਨੇ ਇਸ ਨੂੰ ਸੋਸ਼ਲ ਕੰਪੈਰਿਜ਼ਨ ਕਿਹਾ (1954): ਅਸੀਂ ਆਪਣੇ ਆਪ ਨੂੰ ਦੂਜਿਆਂ ਨਾਲ ਮਾਪ ਕੇ ਪਰਖਦੇ ਹਾਂ। ਸੋਸ਼ਲ ਮੀਡੀਆ ਉੱਤੇ ਸਭ ਦੀ ਹਾਈਲਾਈਟ ਰੀਲ ਸਾਡਾ ਪੈਮਾਨਾ ਬਣ ਜਾਂਦੀ ਹੈ। ਗੁਰਬਾਣੀ ਪੌੜੀ ਹੀ ਹਟਾ ਦਿੰਦੀ ਹੈ: ਨਾ ਕੋਈ ਉੱਚਾ, ਨਾ ਕੋਈ ਨੀਵਾਂ। ਅਸਲ ਮਿਸਾਲ: ਜਿਸ ਕਜ਼ਨ ਦੀਆਂ ਕੈਨੇਡਾ ਵਾਲੀਆਂ ਤਸਵੀਰਾਂ ਤੋਂ ਤੁਹਾਨੂੰ ਸਾੜਾ ਹੁੰਦਾ ਹੈ, ਉਹ ਸ਼ਾਇਦ ਹਰ ਰਾਤ ਇਕੱਲੇਪਣ ਵਿੱਚ ਘਰ ਫ਼ੋਨ ਕਰਦਾ ਹੈ। ਤੁਸੀਂ ਫ਼ੋਟੋ ਵੇਖਦੇ ਹੋ, ਜ਼ਿੰਦਗੀ ਨਹੀਂ।"}, "accept1": {"ti": "ਮੇਰੇ ਹੱਥ ਵਿਚ ਕੀ ਹੈ?", "s": "ਤੁਸੀਂ ਹਫ਼ਤਿਆਂ ਤਕ ਤਿਆਰੀ ਕਰਦੇ ਹੋ। ਇੰਟਰਵਿਊ ਵਾਲੇ ਦਿਨ ਗੱਡੀ ਦੋ ਘੰਟੇ ਲੇਟ ਹੈ। ਤੁਸੀਂ ਪਲੇਟਫ਼ਾਰਮ ਉੱਤੇ ਖੜ੍ਹੇ ਹੋ, ਤੇ ਇਕ ਗੱਡੀ ਉੱਤੇ ਲਾਲ ਪੀਲੇ ਹੋ ਰਹੇ ਹੋ।", "m": "ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਹੁਕਮ ਦੇ ਨਾਲ ਕਦਮ ਮਿਲਾ ਕੇ ਚੱਲੋ। ਇਹ ਸਾਡੇ ਅੰਦਰ ਹੀ ਲਿਖਿਆ ਹੋਇਆ ਹੈ।", "k": "ਕਈ ਸਾਲਾਂ ਤਕ ਗੁਰੂ ਨਾਨਕ ਦੂਰ ਦੂਰ ਤਕ ਘੁੰਮੇ, ਪੂਰਬ ਤੇ ਦੱਖਣ, ਪਹਾੜਾਂ ਵਿਚ ਤੇ ਪੱਛਮ ਤਕ, ਅਕਸਰ ਪੈਦਲ। ਭਾਈ ਗੁਰਦਾਸ, ਜਿਨ੍ਹਾਂ ਨੇ ਉਨ੍ਹਾਂ ਬਾਰੇ ਬੱਸ ਇਕ ਪੀੜ੍ਹੀ ਬਾਅਦ ਲਿਖਿਆ, ਦੱਸਦੇ ਹਨ ਕਿ ਇਨ੍ਹਾਂ ਲੰਮੀਆਂ ਯਾਤਰਾਵਾਂ ਦੇ ਮੁੱਕਣ ਉੱਤੇ ਕੀ ਹੋਇਆ। ਗੁਰੂ ਨਾਨਕ ਰਾਵੀ ਦਰਿਆ ਦੇ ਕੰਢੇ ਕਰਤਾਰਪੁਰ ਮੁੜ ਆਏ। ਉਨ੍ਹਾਂ ਨੇ ਉਦਾਸੀ ਭੇਖ ਲਾਹ ਦਿੱਤਾ ਤੇ ਸਾਧਾਰਨ ਗ੍ਰਿਹਸਤੀ ਕੱਪੜੇ ਪਾ ਲਏ। ਸਿੱਖ ਇਤਿਹਾਸ ਅੱਗੇ ਦੱਸਦਾ ਹੈ ਕਿ ਉਹ ਉੱਥੇ ਕਿਸੇ ਵੀ ਪਿੰਡ ਵਾਲੇ ਵਾਂਗ ਖੇਤੀ ਕਰਕੇ ਜਿਊਂਦੇ ਸਨ, ਤੇ ਹਰ ਸਵੇਰ ਸ਼ਾਮ ਲੋਕ ਇਕੱਠੇ ਬੈਠ ਕੇ ਗਾਉਂਦੇ ਤੇ ਵਿਚਾਰ ਕਰਦੇ ਸਨ। ਜੋ ਗੁਰੂ ਦੇਸ਼ ਦੇਸ਼ ਪੈਦਲ ਘੁੰਮੇ ਸਨ, ਹੁਣ ਬਾਕੀ ਸਾਰਿਆਂ ਵਾਂਗ ਮੀਂਹ ਦੀ ਉਡੀਕ ਕਰਦੇ ਸਨ।", "a": "ਗੁਰੂ ਨਾਨਕ ਨੇ ਹੁਣੇ ਪੁੱਛਿਆ ਸੀ ਕਿ ਇਨਸਾਨ ਸਚਿਆਰ ਕਿਵੇਂ ਜੀਵੇ। ਇਹ ਉਸ ਦਾ ਜਵਾਬ ਹੈ: ਹੁਕਮ ਨਾਲ ਕਦਮ ਮਿਲਾ ਕੇ ਚੱਲੋ, ਯਾਨੀ ਜੋ ਜਿਵੇਂ ਹੈ ਉਸ ਨਾਲ ਨਾ ਲੜੋ। ਇਹ ਦਰਿਆ ਦੇ ਵਹਾਅ ਨਾਲ ਤਰਨ ਵਰਗਾ ਹੈ। ਤੁਸੀਂ ਫਿਰ ਵੀ ਤਰਦੇ ਹੋ, ਤੇ ਪੂਰੇ ਜ਼ੋਰ ਨਾਲ ਤਰਦੇ ਹੋ, ਬੱਸ ਧਾਰਾ ਦੇ ਉਲਟ ਤਾਕਤ ਬਰਬਾਦ ਨਹੀਂ ਕਰਦੇ। ਕਰਤਾਰਪੁਰ ਵਿਖਾਉਂਦਾ ਹੈ ਕਿ ਅਸਲ ਜੀਵਨ ਵਿਚ ਇਹ ਕਿਵੇਂ ਦਿਸਦਾ ਹੈ। ਕਿਸਾਨ ਮੀਂਹ, ਧੁੱਪ ਜਾਂ ਰੁੱਤ ਨੂੰ ਹੁਕਮ ਨਹੀਂ ਦੇ ਸਕਦਾ। ਉਹ ਬੱਸ ਆਪਣਾ ਹਿੱਸਾ ਚੰਗੀ ਤਰ੍ਹਾਂ ਕਰ ਸਕਦਾ ਹੈ, ਤੇ ਅਸਮਾਨ ਜੋ ਕਰੇ ਉਸ ਨੂੰ ਮੰਨ ਸਕਦਾ ਹੈ। ਲਗਭਗ ਦੋ ਹਜ਼ਾਰ ਸਾਲ ਪਹਿਲਾਂ ਯੂਨਾਨ ਦੇ ਉਸਤਾਦ ਐਪਿਕਟੀਟਸ ਨੇ ਆਪਣੀ ਛੋਟੀ ਜਿਹੀ ਕਿਤਾਬ ਇਸੇ ਗੱਲ ਨਾਲ ਸ਼ੁਰੂ ਕੀਤੀ ਸੀ। ਕੁਝ ਚੀਜ਼ਾਂ ਸਾਡੇ ਵੱਸ ਵਿਚ ਹਨ, ਕੁਝ ਨਹੀਂ। ਸਾਡੀ ਕੋਸ਼ਿਸ਼ ਤੇ ਸਾਡਾ ਜਵਾਬ ਸਾਡਾ ਹੈ। ਮੌਸਮ, ਗੱਡੀ ਤੇ ਦੂਜਿਆਂ ਦੇ ਫ਼ੈਸਲੇ ਸਾਡੇ ਨਹੀਂ।", "b": "ਮੰਨ ਲੈਣਾ ਹਾਰ ਮੰਨ ਲੈਣਾ ਨਹੀਂ। ਪਲੇਟਫ਼ਾਰਮ ਉੱਤੇ ਤੁਹਾਡਾ ਹਿੱਸਾ ਛੋਟਾ ਹੈ, ਪਰ ਅਸਲੀ ਹੈ। ਦਫ਼ਤਰ ਫ਼ੋਨ ਕਰੋ, ਸੁਨੇਹਾ ਭੇਜੋ, ਸਾਹ ਲਓ, ਤੇ ਪਹੁੰਚ ਕੇ ਸ਼ਾਂਤੀ ਨਾਲ ਅੰਦਰ ਜਾਓ। ਗੱਡੀ ਉੱਤੇ ਗੁੱਸੇ ਨਾਲ ਗੱਡੀ ਦਾ ਕੁਝ ਨਹੀਂ ਵਿਗੜਦਾ। ਉਹ ਬੱਸ ਤੁਹਾਡੀ ਤਾਕਤ ਖਾਂਦਾ ਹੈ, ਤੇ ਇੰਟਰਵਿਊ ਸ਼ੁਰੂ ਹੋਣ ਤੋਂ ਪਹਿਲਾਂ ਹੀ ਉਸ ਨੂੰ ਵਿਗਾੜ ਦਿੰਦਾ ਹੈ। ਜੋ ਲੋਕ ਦੋ ਸੂਚੀਆਂ ਰੱਖਣਾ ਸਿੱਖ ਲੈਂਦੇ ਹਨ, ਮੇਰੇ ਹੱਥ ਵਿਚ ਤੇ ਮੇਰੇ ਹੱਥ ਵਿਚ ਨਹੀਂ, ਉਹ ਘੱਟ ਉਤਸ਼ਾਹੀ ਨਹੀਂ ਹੁੰਦੇ। ਉਹ ਅਕਸਰ ਵੱਧ ਕਾਮਯਾਬ ਹੁੰਦੇ ਹਨ, ਕਿਉਂਕਿ ਉਨ੍ਹਾਂ ਦੀ ਸਾਰੀ ਤਾਕਤ ਉੱਥੇ ਹੀ ਲੱਗਦੀ ਹੈ ਜਿੱਥੇ ਫ਼ਰਕ ਪੈ ਸਕਦਾ ਹੈ। ਉਹ ਚੰਗੀ ਨੀਂਦ ਵੀ ਸੌਂਦੇ ਹਨ, ਕਿਉਂਕਿ ਉਹ ਉਹ ਭਾਰ ਚੁੱਕਣਾ ਛੱਡ ਦਿੰਦੇ ਹਨ ਜੋ ਕਦੇ ਉਨ੍ਹਾਂ ਦਾ ਸੀ ਹੀ ਨਹੀਂ।", "t": "ਇੱਕ ਚਿੰਤਾ ਲਈ ਦੋ ਸੂਚੀਆਂ ਬਣਾਓ: ਮੇਰੇ ਹੱਥ ਵਿੱਚ, ਮੇਰੇ ਹੱਥ ਵਿੱਚ ਨਹੀਂ। ਪਹਿਲੀ ਉੱਤੇ ਕੰਮ ਕਰੋ।", "q": "ਤੁਸੀਂ ਮਹੀਨਿਆਂ ਤਿਆਰੀ ਕੀਤੀ। ਆਖ਼ਰੀ ਪਲ ਵਿੱਚ ਪੇਪਰ ਤਿੰਨ ਹਫ਼ਤੇ ਅੱਗੇ ਪੈ ਗਿਆ। ਸਾਰੀ ਯੋਜਨਾ ਵਿਗੜ ਗਈ। ਹੁਣ ਕੀ?", "o": ["ਸਾਰੀ ਸ਼ਾਮ ਸੋਸ਼ਲ ਮੀਡੀਆ ਉੱਤੇ ਬੋਰਡ ਉੱਤੇ ਗੁੱਸਾ ਕੱਢਣਾ", "ਤਿੰਨ ਹਫ਼ਤੇ ਪੂਰੀ ਛੁੱਟੀ; ਉਂਝ ਵੀ ਲੈਅ ਟੁੱਟ ਗਈ", "ਇੱਕ ਦਿਨ ਆਰਾਮ, ਫਿਰ ਤਿੰਨ ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਕਮਜ਼ੋਰ ਵਿਸ਼ੇ ਮਜ਼ਬੂਤ ਕਰਨ ਦੀ ਯੋਜਨਾ"], "y": "ਚੰਗੀ ਚੋਣ। ਤਾਰੀਖ਼ ਤੁਹਾਡੇ ਹੱਥ ਵਿੱਚ ਨਹੀਂ, ਪਰ ਸਮੇਂ ਦੀ ਵਰਤੋਂ ਹੈ। ਪਹਿਲਾਂ ਆਰਾਮ, ਫਿਰ ਦੇਰੀ ਨੂੰ ਫ਼ਾਇਦੇ ਵਿੱਚ ਬਦਲੋ।", "n": "ਇਹ ਪ੍ਰਤੀਕਿਰਿਆ ਸਮਝ ਆਉਂਦੀ ਹੈ, ਪਰ ਵੇਖੋ। ਆਨਲਾਈਨ ਗੁੱਸਾ ਕੁਝ ਨਹੀਂ ਬਦਲਦਾ, ਅਤੇ ਪੂਰੀ ਤਰ੍ਹਾਂ ਰੁਕਣਾ ਵਾਧੂ ਸਮੇਂ ਦਾ ਤੋਹਫ਼ਾ ਗੁਆਉਣਾ ਹੈ। ਇੱਕ ਦਿਨ ਆਰਾਮ, ਫਿਰ ਕਮਜ਼ੋਰ ਵਿਸ਼ੇ।", "d": "ਦਹਾਕਿਆਂ ਦੀਆਂ ਉਦਾਸੀਆਂ ਤੋਂ ਬਾਅਦ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਕਰਤਾਰਪੁਰ ਮੁੜੇ, ਆਮ ਕੱਪੜੇ ਪਾਏ ਅਤੇ ਖੇਤੀ ਕੀਤੀ। ਆਪਣੇ ਸਮੇਂ ਦਾ ਸਭ ਤੋਂ ਵੱਡਾ ਗੁਰੂ ਕਿਸੇ ਵੀ ਪਿੰਡ ਵਾਲੇ ਵਾਂਗ ਹਲ ਵਾਹੁੰਦਾ ਰਿਹਾ: ਆਪਣਾ ਹਿੱਸਾ ਕਰੋ, ਫ਼ਸਲ ਮੀਂਹ ਉੱਤੇ ਛੱਡ ਦਿਓ। ਜੋ ਬਦਲ ਨਹੀਂ ਸਕਦੇ, ਉਸ ਉੱਤੇ ਅਸੀਂ ਇੰਨੇ ਦੁਖੀ ਕਿਉਂ ਹੁੰਦੇ ਹਾਂ? ਕਿਉਂਕਿ ਅਸੀਂ ਆਪਣੀ ਊਰਜਾ ਟ੍ਰੇਨ, ਮੌਸਮ ਅਤੇ ਦੂਜਿਆਂ ਦੇ ਮੂਡ ਨਾਲ ਲੜਨ ਵਿੱਚ ਲਾ ਦਿੰਦੇ ਹਾਂ। ਸਟੋਇਕ ਅਧਿਆਪਕ ਐਪਿਕਟੀਟਸ ਨੇ ਆਪਣੀ ਕਿਤਾਬ ਇੱਕ ਸਤਰ ਨਾਲ ਸ਼ੁਰੂ ਕੀਤੀ: ਕੁਝ ਚੀਜ਼ਾਂ ਸਾਡੇ ਵੱਸ ਵਿੱਚ ਹਨ, ਕੁਝ ਨਹੀਂ। ਅੱਜ ਦੀ ਐਕਸੈਪਟੈਂਸ ਐਂਡ ਕਮਿਟਮੈਂਟ ਥੈਰੇਪੀ ਵੀ ਇਹੀ ਕਹਿੰਦੀ ਹੈ: ਜੋ ਨਹੀਂ ਬਦਲ ਸਕਦੇ ਉਸ ਨੂੰ ਸਵੀਕਾਰੋ, ਆਪਣੀਆਂ ਕਦਰਾਂ ਉੱਤੇ ਕਰਮ ਕਰੋ। ਹੁਕਮ ਵਿੱਚ ਚੱਲਣਾ ਹਾਰ ਮੰਨਣਾ ਨਹੀਂ, ਪੂਰੀ ਤਾਕਤ ਸਹੀ ਥਾਂ ਲਾਉਣਾ ਹੈ। ਅਸਲ ਮਿਸਾਲ: ਕਿਸਾਨ ਮੀਂਹ ਨੂੰ ਹੁਕਮ ਨਹੀਂ ਦੇ ਸਕਦਾ, ਪਰ ਮਿੱਟੀ ਤਿਆਰ ਕਰ ਸਕਦਾ ਹੈ। ਉਹ ਸ਼ਾਂਤ ਹੈ ਕਿਉਂਕਿ ਉਸ ਨੇ ਆਪਣਾ ਹਿੱਸਾ ਕੀਤਾ।"}, "content1": {"ti": "ਕਿੰਨਾ ਕਾਫ਼ੀ ਹੈ?", "s": "ਤੁਸੀਂ ਨਵਾਂ ਫ਼ੋਨ ਖ਼ਰੀਦਦੇ ਹੋ। ਇਕ ਹਫ਼ਤਾ ਬਹੁਤ ਚੰਗਾ ਲੱਗਦਾ ਹੈ। ਫਿਰ ਉਸ ਤੋਂ ਨਵਾਂ ਮਾਡਲ ਆ ਜਾਂਦਾ ਹੈ, ਤੇ ਹੱਥ ਵਾਲਾ ਫ਼ੋਨ ਅਚਾਨਕ ਪੁਰਾਣਾ ਲੱਗਣ ਲੱਗ ਪੈਂਦਾ ਹੈ।", "m": "ਸੰਤੋਖ ਨੂੰ ਆਪਣੀਆਂ ਮੁੰਦਰਾਂ ਬਣਾਓ, ਇਮਾਨਦਾਰ ਮਿਹਨਤ ਨੂੰ ਆਪਣਾ ਖੱਪਰ ਤੇ ਝੋਲੀ, ਤੇ ਧਿਆਨ ਨੂੰ ਆਪਣੀ ਬਿਭੂਤ।", "k": "ਲਾਹੌਰ ਵਿਚ ਦੁਨੀ ਚੰਦ ਰਹਿੰਦੇ ਸਨ, ਬਹੁਤ ਵੱਡੀ ਦੌਲਤ ਵਾਲੇ ਬੰਦੇ। ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਨਾਨਕ ਨੂੰ ਬੜੇ ਆਦਰ ਨਾਲ ਆਪਣੇ ਘਰ ਸੱਦਿਆ। ਜਾਣ ਵੇਲੇ ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਇਕ ਛੋਟੀ ਜਿਹੀ ਸੂਈ ਦਿੱਤੀ ਤੇ ਇਕ ਕੰਮ ਕਿਹਾ। ਇਹ ਮੇਰੇ ਲਈ ਸਾਂਭ ਕੇ ਰੱਖਣੀ, ਤੇ ਅਗਲੇ ਜਹਾਨ ਵਿਚ ਮੈਨੂੰ ਮੋੜ ਦੇਣੀ। ਦੁਨੀ ਚੰਦ ਨੇ ਮਾਣ ਨਾਲ ਹਾਂ ਕਹਿ ਦਿੱਤੀ ਤੇ ਸੂਈ ਆਪਣੀ ਪਤਨੀ ਕੋਲ ਲੈ ਗਏ। ਪਤਨੀ ਨੇ ਉਨ੍ਹਾਂ ਵੱਲ ਵੇਖਿਆ ਤੇ ਇਕ ਸਿੱਧਾ ਜਿਹਾ ਸਵਾਲ ਪੁੱਛਿਆ। ਮਰਨ ਤੋਂ ਬਾਅਦ ਤੁਸੀਂ ਇਕ ਸੂਈ ਵੀ ਨਾਲ ਕਿਵੇਂ ਲੈ ਜਾਓਗੇ? ਦੁਨੀ ਚੰਦ ਚੁੱਪ ਹੋ ਗਏ। ਜੇ ਉਹ ਇਕ ਸੂਈ ਵੀ ਨਹੀਂ ਲੈ ਜਾ ਸਕਦੇ, ਤਾਂ ਬਾਕੀ ਸਭ ਕੁਝ ਦਾ ਕੀ? ਉਹ ਗੁਰੂ ਜੀ ਕੋਲ ਮੁੜੇ, ਤੇ ਧਿਆਨ ਨਾਲ ਸੁਣਿਆ।", "a": "ਗੁਰੂ ਨਾਨਕ ਜੋਗੀਆਂ ਨਾਲ ਗੱਲ ਕਰ ਰਹੇ ਹਨ, ਜੋ ਆਪਣੇ ਰਾਹ ਦੀ ਨਿਸ਼ਾਨੀ ਵਜੋਂ ਖ਼ਾਸ ਮੁੰਦਰਾਂ ਪਾਉਂਦੇ ਸਨ ਤੇ ਖੱਪਰ ਰੱਖਦੇ ਸਨ। ਉਹ ਕਹਿੰਦੇ ਹਨ ਕਿ ਅਸਲੀ ਨਿਸ਼ਾਨੀਆਂ ਇਨਸਾਨ ਦੇ ਅੰਦਰ ਹੁੰਦੀਆਂ ਹਨ। ਪਹਿਲੀ ਜੋ ਉਹ ਗਿਣਾਉਂਦੇ ਹਨ, ਉਹ ਹੈ ਸੰਤੋਖ। ਜੋ ਹੈ ਉਸ ਵਿਚ ਸ਼ਾਂਤੀ, ਤੇ ਨਾਲ ਇਮਾਨਦਾਰ ਮਿਹਨਤ। ਸਾਖੀ ਵਾਲੀ ਸੂਈ ਛੋਟੀ ਜਿਹੀ ਹੈ, ਲਗਭਗ ਹਾਸੇ ਵਾਲੀ, ਤੇ ਇਹੀ ਉਸ ਦੀ ਤਾਕਤ ਹੈ। ਇਕ ਛੋਟੀ ਜਿਹੀ ਚੀਜ਼ ਨਾਲ ਉਹ ਵਿਖਾ ਦਿੰਦੀ ਹੈ ਕਿ ਅਸੀਂ ਕਿਸੇ ਚੀਜ਼ ਨੂੰ ਸਦਾ ਲਈ ਫੜ ਕੇ ਨਹੀਂ ਰੱਖ ਸਕਦੇ। ਦੁਨੀ ਚੰਦ ਨੂੰ ਆਪਣਾ ਘਰ ਛੱਡਣ ਦੀ ਲੋੜ ਨਹੀਂ ਸੀ। ਉਨ੍ਹਾਂ ਨੂੰ ਇਹ ਮੰਨਣਾ ਛੱਡਣਾ ਸੀ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਘਰ ਹੀ ਉਹ ਹਨ। ਸੰਤੋਖ ਇਹੀ ਤਬਦੀਲੀ ਹੈ: ਚੀਜ਼ਾਂ ਦੇ ਮਾਲਕ ਬਣਨ ਤੋਂ, ਉਨ੍ਹਾਂ ਨੂੰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਵਰਤਣ ਤੇ ਵੰਡਣ ਤਕ।", "b": "ਮਨੋਵਿਗਿਆਨੀ ਇਸ ਮੁਸ਼ਕਲ ਨੂੰ ਟਰੈੱਡਮਿਲ ਦੀ ਤਸਵੀਰ ਨਾਲ ਸਮਝਾਉਂਦੇ ਹਨ। ਅਸੀਂ ਤੇਜ਼ ਦੌੜਦੇ ਹਾਂ ਤੇ ਵੱਧ ਕਮਾਉਂਦੇ ਹਾਂ, ਪਰ ਹਰ ਨਵੀਂ ਚੀਜ਼ ਦੀ ਬਹੁਤ ਛੇਤੀ ਆਦਤ ਪੈ ਜਾਂਦੀ ਹੈ, ਇਸ ਲਈ ਖ਼ੁਸ਼ੀ ਉੱਥੇ ਦੀ ਉੱਥੇ ਰਹਿੰਦੀ ਹੈ। ਨਵਾਂ ਫ਼ੋਨ ਇਕ ਹਫ਼ਤਾ ਬਹੁਤ ਚੰਗਾ ਲੱਗਦਾ ਹੈ। ਵੱਡੀ ਤਨਖ਼ਾਹ ਇਕ ਮਹੀਨਾ ਖ਼ਾਸ ਲੱਗਦੀ ਹੈ। ਫਿਰ ਮੰਜ਼ਿਲ ਫਿਰ ਅੱਗੇ ਖਿਸਕ ਜਾਂਦੀ ਹੈ। ਸੰਤੋਖ ਦਾ ਮਤਲਬ ਵਧਣਾ ਛੱਡ ਦੇਣਾ ਨਹੀਂ। ਤੁਸੀਂ ਚੰਗੀ ਨੌਕਰੀ ਜਾਂ ਵੱਡਾ ਘਰ ਚਾਹ ਸਕਦੇ ਹੋ। ਫ਼ਰਕ ਇਸ ਵਿਚ ਹੈ ਕਿ ਵਧਦੇ ਵੇਲੇ ਤੁਸੀਂ ਕਿੱਥੇ ਖੜ੍ਹੇ ਹੋ। ਮੇਰੇ ਕੋਲ ਕਾਫ਼ੀ ਹੈ, ਤੇ ਮੈਂ ਅੱਗੇ ਬਣਾ ਰਿਹਾ ਹਾਂ, ਇੱਥੋਂ। ਜਦ ਤਕ ਉਹ ਨਹੀਂ ਮਿਲਦਾ ਮੈਂ ਕੁਝ ਨਹੀਂ, ਇੱਥੋਂ ਨਹੀਂ। ਪਹਿਲੀ ਥਾਂ ਤੋਂ ਜੀਵਨ ਇਕ ਸਫ਼ਰ ਲੱਗਦਾ ਹੈ। ਦੂਜੀ ਤੋਂ, ਇਕ ਅਜਿਹੀ ਦੌੜ ਜਿਸ ਵਿਚ ਤੁਸੀਂ ਸਦਾ ਹਾਰ ਰਹੇ ਹੋ।", "t": "ਅਗਲੀ ਖ਼ਰੀਦਦਾਰੀ ਤੋਂ ਪਹਿਲਾਂ ਇੱਕ ਦਿਨ ਰੁਕੋ। ਅੱਜ ਰਾਤ ਤਿੰਨ ਚੀਜ਼ਾਂ ਗਿਣੋ ਜੋ ਪਹਿਲਾਂ ਹੀ ਤੁਹਾਡੇ ਕੋਲ ਹਨ।", "q": "ਤੁਹਾਡੀ ਤਨਖ਼ਾਹ ਵਧੀ। ਦੋਸਤ ਕਹਿੰਦੇ ਹਨ: ਹੁਣ EMI ਉੱਤੇ ਵੱਡੀ ਗੱਡੀ ਲਓ, ਤੁਸੀਂ ਹੱਕਦਾਰ ਹੋ। ਸਿਆਣਪ ਕੀ ਹੈ?", "o": ["ਹੁਣ ਵਾਲੀ ਗੱਡੀ ਰੱਖਣਾ, ਛੇ ਮਹੀਨੇ ਵਾਧੂ ਪੈਸਾ ਬਚਾਉਣਾ, ਫਿਰ ਸ਼ਾਂਤੀ ਨਾਲ ਤੈਅ ਕਰਨਾ", "ਅੱਜ ਹੀ ਲੈ ਲੈਣਾ; ਜ਼ਿੰਦਗੀ ਛੋਟੀ ਹੈ", "ਗੱਡੀ ਵੀ ਲੈਣਾ, ਅਤੇ ਵੱਡੇ ਫ਼ਲੈਟ ਦਾ ਲੋਨ ਵੀ"], "y": "ਸਿਆਣਪ। ਛੇ ਮਹੀਨੇ ਦਿਖਾ ਦੇਣਗੇ ਕਿ ਤੁਹਾਨੂੰ ਸੱਚਮੁੱਚ ਉਹ ਚਾਹੀਦੀ ਹੈ ਜਾਂ ਬੱਸ ਪਹਿਲਾ ਚਾਅ। ਅਤੇ ਬਚਤ ਗੱਡੀ ਨਾਲੋਂ ਵਧੀਆ ਚੀਜ਼ ਖ਼ਰੀਦਦੀ ਹੈ: ਬੇਫ਼ਿਕਰੀ।", "n": "ਤੁਸੀਂ ਚੰਗੀਆਂ ਚੀਜ਼ਾਂ ਦੇ ਹੱਕਦਾਰ ਹੋ। ਪਰ ਨਵੀਂ ਤਨਖ਼ਾਹ ਉੱਤੇ ਵੱਡੀ EMI ਅਕਸਰ ਖ਼ੁਸ਼ੀ ਨੂੰ ਹਰ ਮਹੀਨੇ ਦੇ ਤਣਾਅ ਵਿੱਚ ਬਦਲ ਦਿੰਦੀ ਹੈ, ਅਤੇ ਚਾਅ ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਫਿੱਕਾ ਪੈ ਜਾਂਦਾ ਹੈ। ਛੇ ਮਹੀਨੇ ਰੁਕ ਕੇ ਵੇਖੋ।", "d": "ਲਾਹੌਰ ਦੇ ਅਮੀਰ ਦੁਨੀ ਚੰਦ ਨੇ ਆਪਣੇ ਘਰ ਉੱਤੇ ਹਰ ਲੱਖ ਲਈ ਇੱਕ ਝੰਡਾ ਲਾ ਰੱਖਿਆ ਸੀ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਉਸ ਨੂੰ ਇੱਕ ਸੂਈ ਦਿੱਤੀ ਅਤੇ ਕਿਹਾ, ਇਹ ਅਗਲੇ ਜਹਾਨ ਵਿੱਚ ਮੋੜ ਦੇਣੀ। ਉਸ ਦੀ ਪਤਨੀ ਨੇ ਪੁੱਛਿਆ: ਮਰਨ ਤੋਂ ਬਾਅਦ ਸੂਈ ਕਿਵੇਂ ਨਾਲ ਲੈ ਜਾਓਗੇ? ਉਹ ਚੁੱਪ ਹੋ ਗਿਆ, ਅਤੇ ਵੰਡਣ ਲੱਗਾ। ਬੱਸ ਕਦੇ ਬੱਸ ਕਿਉਂ ਨਹੀਂ ਹੁੰਦਾ? ਮਨੋਵਿਗਿਆਨੀ ਇਸ ਨੂੰ ਹੇਡੋਨਿਕ ਟ੍ਰੈਡਮਿਲ ਕਹਿੰਦੇ ਹਨ (ਬ੍ਰਿਕਮੈਨ ਅਤੇ ਕੈਂਪਬੈਲ, 1971): ਤਨਖ਼ਾਹ ਵਧਣ ਜਾਂ ਨਵੇਂ ਫ਼ੋਨ ਤੋਂ ਬਾਅਦ ਖ਼ੁਸ਼ੀ ਵਧਦੀ ਹੈ, ਫਿਰ ਆਮ ਉੱਤੇ ਮੁੜ ਆਉਂਦੀ ਹੈ, ਅਤੇ ਅਸੀਂ ਅਗਲੀ ਚੀਜ਼ ਪਿੱਛੇ ਦੌੜਦੇ ਹਾਂ। ਟ੍ਰੈਡਮਿਲ ਤੋਂ ਉਤਰਨ ਦਾ ਰਾਹ ਹੈ ਧਿਆਨ ਦੇਣਾ। ਜਿਨ੍ਹਾਂ ਨੇ ਹਰ ਹਫ਼ਤੇ ਸ਼ੁਕਰਾਨੇ ਦੀਆਂ ਗੱਲਾਂ ਲਿਖੀਆਂ, ਉਹ ਆਪਣੀ ਜ਼ਿੰਦਗੀ ਤੋਂ ਵੱਧ ਸੰਤੁਸ਼ਟ ਸਨ (ਐਮਨਸ ਅਤੇ ਮੈਕਕਲੋ, 2003)। ਸੰਤੋਖ ਘੱਟ ਰੱਖਣਾ ਨਹੀਂ, ਜੋ ਹੈ ਉਸ ਨੂੰ ਆਖ਼ਰਕਾਰ ਵੇਖ ਸਕਣਾ ਹੈ। ਅਸਲ ਮਿਸਾਲ: ਜਿਸ ਫ਼ੋਨ ਲਈ ਤੁਸੀਂ ਦੋ ਸਾਲ ਪਹਿਲਾਂ ਜ਼ਿੱਦ ਕੀਤੀ ਸੀ, ਅੱਜ ਉਸੇ ਨੂੰ ਪੁਰਾਣਾ ਕਹਿੰਦੇ ਹੋ।"}, "listen1": {"ti": "ਪਹਿਲਾਂ ਸੁਣੋ", "s": "ਤੁਹਾਡੀ ਸਹੇਲੀ ਆਪਣੇ ਮਾੜੇ ਦਿਨ ਦੀ ਗੱਲ ਸ਼ੁਰੂ ਕਰਦੀ ਹੈ। ਉਸ ਦੇ ਮੁਕਾਉਣ ਤੋਂ ਪਹਿਲਾਂ ਤੁਸੀਂ ਕਹਿ ਦਿੰਦੇ ਹੋ, ਪਤਾ ਤੈਨੂੰ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ? ਉਹ ਚੁੱਪ ਹੋ ਜਾਂਦੀ ਹੈ। ਉਸ ਨੂੰ ਸੁਣਨ ਵਾਲਾ ਚਾਹੀਦਾ ਸੀ, ਉਸ ਨੂੰ ਭਾਸ਼ਣ ਮਿਲ ਗਿਆ।", "m": "ਸੱਚੇ ਮਨ ਨਾਲ ਸੁਣਨ ਨਾਲ ਦੁੱਖ ਤੇ ਪਾਪ ਮਿਟ ਜਾਂਦੇ ਹਨ।", "k": "ਦੂਜੇ ਗੁਰੂ ਬਣਨ ਤੋਂ ਬਹੁਤ ਪਹਿਲਾਂ ਭਾਈ ਲਹਿਣਾ ਖਡੂਰ ਵਿਚ ਰਹਿੰਦੇ ਸਨ। ਇਕ ਸਵੇਰ ਤੜਕੇ ਉਨ੍ਹਾਂ ਨੇ ਆਪਣੇ ਗੁਆਂਢੀ ਭਾਈ ਜੋਧਾ ਨੂੰ ਕੁਝ ਅਜਿਹੀਆਂ ਪੰਕਤੀਆਂ ਗਾਉਂਦੇ ਸੁਣਿਆ ਜੋ ਉਨ੍ਹਾਂ ਨੇ ਪਹਿਲਾਂ ਕਦੇ ਨਹੀਂ ਸੁਣੀਆਂ ਸਨ। ਉਹ ਗੁਰੂ ਨਾਨਕ ਦੇ ਬਚਨ ਸਨ। ਭਾਈ ਲਹਿਣਾ ਰੁਕ ਗਏ, ਸੁਣਦੇ ਰਹੇ, ਤੇ ਉਹ ਬਚਨ ਉਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿਚੋਂ ਨਿਕਲੇ ਹੀ ਨਹੀਂ। ਉਨ੍ਹਾਂ ਨੇ ਪੁੱਛਿਆ ਕਿ ਇਹ ਕਿਸ ਨੇ ਲਿਖੇ ਹਨ। ਜਦੋਂ ਪਤਾ ਲੱਗਾ ਕਿ ਇਹ ਕਰਤਾਰਪੁਰ ਵਾਲੇ ਗੁਰੂ ਨਾਨਕ ਦੇ ਹਨ, ਤਾਂ ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲਣ ਤੁਰ ਪਏ, ਤੇ ਉਨ੍ਹਾਂ ਦਾ ਜੀਵਨ ਫਿਰ ਕਦੇ ਪਹਿਲਾਂ ਵਰਗਾ ਨਾ ਰਿਹਾ। ਇਹ ਸਭ ਇਕ ਸਾਧਾਰਨ ਸਵੇਰ ਤੋਂ ਸ਼ੁਰੂ ਹੋਇਆ, ਤੇ ਸੱਚੇ ਮਨ ਨਾਲ ਸੁਣਨ ਦੇ ਇਕ ਪਲ ਤੋਂ।", "a": "ਜਪੁਜੀ ਸਾਹਿਬ ਦੀਆਂ ਚਾਰ ਪਉੜੀਆਂ ਇਕੋ ਸ਼ਬਦ ਨਾਲ ਸ਼ੁਰੂ ਹੁੰਦੀਆਂ ਹਨ: ਸੁਣਿਐ, ਯਾਨੀ ਸੁਣਨਾ। ਗੁਰੂ ਨਾਨਕ ਪੂਰੇ ਧਿਆਨ ਨਾਲ ਰੱਬੀ ਸ਼ਬਦ ਨੂੰ ਸੁਣਨ ਦੀ ਗੱਲ ਕਰ ਰਹੇ ਹਨ। ਭਾਈ ਲਹਿਣਾ ਦੀ ਕਹਾਣੀ ਵਿਖਾਉਂਦੀ ਹੈ ਕਿ ਇਹ ਕਿੰਨਾ ਤਾਕਤਵਰ ਹੋ ਸਕਦਾ ਹੈ। ਉਹ ਆਪਣੇ ਖ਼ਿਆਲਾਂ ਵਿਚ ਡੁੱਬੇ ਅੱਗੇ ਲੰਘ ਸਕਦੇ ਸਨ। ਪਰ ਉਹ ਰੁਕੇ, ਤੇ ਜੋ ਸੁਣਿਆ ਉਸ ਲਈ ਪੂਰੀ ਤਰ੍ਹਾਂ ਖੁੱਲ੍ਹ ਗਏ। ਰੋਜ਼ ਦੇ ਜੀਵਨ ਵਿਚ ਅਸੀਂ ਉਹੀ ਗੁਣ, ਯਾਨੀ ਪੂਰਾ ਧਿਆਨ, ਆਪਣੇ ਸਾਹਮਣੇ ਬੈਠੇ ਲੋਕਾਂ ਲਈ ਉਧਾਰ ਲੈਂਦੇ ਹਾਂ। ਬਹੁਤਾ ਸਮਾਂ ਅਸੀਂ ਸੱਚਮੁੱਚ ਸੁਣਦੇ ਨਹੀਂ। ਅਸੀਂ ਬੱਸ ਆਪਣੀ ਵਾਰੀ ਉਡੀਕਦੇ ਹਾਂ। ਸਾਹਮਣੇ ਵਾਲਾ ਇਹ ਮਹਿਸੂਸ ਕਰ ਲੈਂਦਾ ਹੈ, ਜਿਵੇਂ ਤੁਸੀਂ ਮਹਿਸੂਸ ਕਰ ਲੈਂਦੇ ਹੋ ਜਦੋਂ ਕੋਈ ਗੱਲ ਕਰਦਿਆਂ ਵਾਰ ਵਾਰ ਆਪਣਾ ਫ਼ੋਨ ਵੇਖਦਾ ਰਹੇ।", "b": "ਸਟੀਫ਼ਨ ਕਵੀ ਆਪਣੀ ਮਸ਼ਹੂਰ ਕਿਤਾਬ, ਸੈਵਨ ਹੈਬਿਟਸ, ਵਿਚ ਕਹਿੰਦੇ ਹਨ: ਪਹਿਲਾਂ ਦੂਜੇ ਨੂੰ ਸਮਝੋ, ਫਿਰ ਆਪਣੀ ਗੱਲ ਸਮਝਾਓ। ਜੋ ਡਾਕਟਰ ਦਰਦ ਪੁੱਛੇ ਬਿਨਾਂ ਦਵਾਈ ਲਿਖ ਦੇਵੇ, ਉਹ ਚੰਗਾ ਡਾਕਟਰ ਨਹੀਂ। ਦੋਸਤ ਵੀ ਨਹੀਂ। ਜਦੋਂ ਇਨਸਾਨ ਨੂੰ ਲੱਗਦਾ ਹੈ ਕਿ ਉਸ ਨੂੰ ਸੁਣਿਆ ਗਿਆ, ਤਾਂ ਉਸ ਦੇ ਅੰਦਰ ਕੁਝ ਨਰਮ ਪੈ ਜਾਂਦਾ ਹੈ। ਉਹ ਸ਼ਾਂਤ ਹੋ ਜਾਂਦਾ ਹੈ, ਤੇ ਅਕਸਰ ਬੋਲਦਿਆਂ ਬੋਲਦਿਆਂ ਆਪਣਾ ਜਵਾਬ ਆਪ ਲੱਭ ਲੈਂਦਾ ਹੈ। ਜਦੋਂ ਉਸ ਨੂੰ ਲੱਗਦਾ ਹੈ ਕਿ ਉਸ ਨੂੰ ਪਰਖਿਆ ਜਾ ਰਿਹਾ ਹੈ ਜਾਂ ਕਾਹਲੀ ਕੀਤੀ ਜਾ ਰਹੀ ਹੈ, ਤਾਂ ਉਹ ਬਚਾਅ ਕਰਨ ਲੱਗ ਪੈਂਦਾ ਹੈ। ਦੋ ਮਿੰਟ ਦਾ ਸੱਚਾ ਸੁਣਨਾ ਦੋ ਘੰਟੇ ਦੀ ਬਹਿਸ ਬਚਾ ਸਕਦਾ ਹੈ। ਤੇ ਇਸ ਵਿਚ ਤੁਹਾਡੇ ਲਈ ਵੀ ਇਕ ਤੋਹਫ਼ਾ ਹੈ। ਜਦੋਂ ਤੁਸੀਂ ਪੂਰੇ ਮਨ ਨਾਲ ਸੁਣਦੇ ਹੋ, ਤਾਂ ਉਹ ਗੱਲਾਂ ਸਿੱਖਦੇ ਹੋ ਜੋ ਬੋਲਣ ਵਿਚ ਰੁੱਝੇ ਰਹਿ ਕੇ ਕਦੇ ਨਾ ਸੁਣ ਸਕਦੇ।", "t": "ਅੱਜ ਕਿਸੇ ਇੱਕ ਗੱਲਬਾਤ ਵਿੱਚ ਕੋਈ ਸਲਾਹ ਨਾ ਦਿਓ। ਬੱਸ ਪੁੱਛੋ: ਫਿਰ ਕੀ ਹੋਇਆ?", "q": "ਤੁਹਾਡਾ ਅੱਲ੍ਹੜ ਉਮਰ ਦਾ ਭਰਾ ਘਰ ਆ ਕੇ ਕਹਿੰਦਾ ਹੈ: ਮੈਨੂੰ ਸਕੂਲ ਤੋਂ ਨਫ਼ਰਤ ਹੈ, ਉੱਥੇ ਸਾਰੇ ਨਕਲੀ ਹਨ। ਤੁਸੀਂ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਕੀ ਕਹੋਗੇ?", "o": ["ਸਕੂਲ ਜ਼ਰੂਰੀ ਹੈ; ਤੈਨੂੰ ਐਡਜਸਟ ਕਰਨਾ ਪਵੇਗਾ", "ਸੁਣ ਕੇ ਔਖਾ ਲੱਗ ਰਿਹਾ ਹੈ। ਅੱਜ ਕੀ ਹੋਇਆ?", "ਤੇਰੀ ਉਮਰ ਵਿੱਚ ਮੇਰਾ ਹਾਲ ਇਸ ਤੋਂ ਵੀ ਮਾੜਾ ਸੀ"], "y": "ਹਾਂ। ਇੱਕ ਸਿੱਧਾ ਸਵਾਲ ਦਰਵਾਜ਼ਾ ਖੋਲ੍ਹਦਾ ਹੈ। ਜਦੋਂ ਉਸ ਨੂੰ ਲੱਗੇਗਾ ਕਿ ਸੁਣਿਆ ਗਿਆ, ਤਦ ਉਹ ਅਸਲ ਗੱਲ ਦੱਸੇਗਾ, ਅਤੇ ਤਦ ਹੀ ਤੁਸੀਂ ਮਦਦ ਕਰ ਸਕੋਗੇ।", "n": "ਨੀਅਤ ਚੰਗੀ ਹੈ, ਪਰ ਸਲਾਹ ਜਾਂ ਤੁਲਨਾ ਦਰਵਾਜ਼ਾ ਉਸ ਦੇ ਖੋਲ੍ਹਣ ਤੋਂ ਪਹਿਲਾਂ ਹੀ ਬੰਦ ਕਰ ਦਿੰਦੀ ਹੈ। ਉਹ ਦੱਸਣਾ ਬੰਦ ਕਰ ਦੇਵੇਗਾ। ਇੱਕ ਸਿੱਧਾ ਅੱਜ ਕੀ ਹੋਇਆ ਉਸ ਨੂੰ ਬੋਲਣ ਦਿੰਦਾ ਹੈ, ਫਿਰ ਤੁਸੀਂ ਸੱਚਮੁੱਚ ਮਦਦ ਕਰ ਸਕਦੇ ਹੋ।", "d": "ਭਾਈ ਲਹਿਣਾ ਜੀ ਦੀ ਜ਼ਿੰਦਗੀ ਇੱਕ ਆਮ ਸਵੇਰ ਬਦਲੀ, ਜਦੋਂ ਉਨ੍ਹਾਂ ਨੇ ਗੁਆਂਢੀ ਨੂੰ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੀ ਬਾਣੀ ਗਾਉਂਦਿਆਂ ਸੁਣਿਆ। ਉਹ ਰੁਕੇ, ਸੁਣਿਆ, ਅਤੇ ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਤੁਰ ਪਏ। ਅੱਗੇ ਚੱਲ ਕੇ ਉਹੀ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਬਣੇ। ਸਭ ਕੁਝ ਸੱਚੇ ਸੁਣਨ ਦੇ ਇੱਕ ਪਲ ਤੋਂ ਸ਼ੁਰੂ ਹੋਇਆ। ਅਸੀਂ ਸੁਣਨ ਵਿੱਚ ਕਿਉਂ ਖੁੰਝਦੇ ਹਾਂ? ਸਾਡੇ ਵਿੱਚੋਂ ਬਹੁਤੇ ਜਵਾਬ ਦੇਣ ਲਈ ਸੁਣਦੇ ਹਨ, ਸਮਝਣ ਲਈ ਨਹੀਂ। ਕੋਈ ਦਰਦ ਦੱਸਦਾ ਹੈ, ਤਾਂ ਮਨ ਠੀਕ ਕਰਨ, ਸਲਾਹ ਦੇਣ ਜਾਂ ਆਪਣੀ ਕਹਾਣੀ ਸੁਣਾਉਣ ਦੌੜਦਾ ਹੈ। ਮਨੋਵਿਗਿਆਨੀ ਕਾਰਲ ਰੌਜਰਜ਼ ਨੇ ਇਸ ਦਾ ਬਦਲ ਐਕਟਿਵ ਲਿਸਨਿੰਗ ਦੱਸਿਆ (1957): ਸ਼ਬਦਾਂ ਪਿੱਛੇ ਦੀ ਭਾਵਨਾ ਸੁਣਨਾ ਅਤੇ ਉਸ ਨੂੰ ਮੋੜਨਾ। ਜਦੋਂ ਲੋਕ ਸੱਚਮੁੱਚ ਸੁਣੇ ਜਾਂਦੇ ਹਨ, ਤਾਂ ਸ਼ਾਂਤ ਹੁੰਦੇ ਹਨ ਅਤੇ ਅਕਸਰ ਆਪਣਾ ਜਵਾਬ ਆਪ ਲੱਭ ਲੈਂਦੇ ਹਨ। ਜਪੁਜੀ ਸਾਹਿਬ ਦੀਆਂ ਸੁਣਿਐ ਵਾਲੀਆਂ ਪਉੜੀਆਂ ਕਹਿੰਦੀਆਂ ਹਨ: ਸੁਣਨ ਨਾਲ ਦੁੱਖ ਮਿਟਦਾ ਹੈ। ਅਸਲ ਮਿਸਾਲ: ਜੋ ਡਾਕਟਰ ਪਰਚੀ ਲਿਖਣ ਤੋਂ ਪਹਿਲਾਂ ਦੋ ਮਿੰਟ ਸੁਣਦਾ ਹੈ, ਮਰੀਜ਼ ਉਸੇ ਉੱਤੇ ਭਰੋਸਾ ਕਰਦੇ ਹਨ।"}, "habit1": {"ti": "ਹਰ ਸਵੇਰ ਇਕ ਛੋਟੀ ਜਿਹੀ ਚੀਜ਼", "s": "ਪਹਿਲੀ ਜਨਵਰੀ ਨੂੰ ਤੁਸੀਂ ਆਪਣੇ ਆਪ ਨਾਲ ਵਾਅਦਾ ਕਰਦੇ ਹੋ, ਰੋਜ਼ ਇਕ ਘੰਟਾ ਜਿੰਮ। ਵੀਹ ਜਨਵਰੀ ਤਕ ਜਿੰਮ ਵਾਲਾ ਬੈਗ ਮੰਜੇ ਹੇਠ ਪਿਆ ਹੁੰਦਾ ਹੈ।", "m": "ਪਹੁ ਫੁੱਟਣ ਤੋਂ ਪਹਿਲਾਂ ਦੇ ਸ਼ਾਂਤ ਸਮੇਂ ਵਿਚ ਸੱਚੇ ਨਾਮ ਤੇ ਉਸ ਦੀ ਵਡਿਆਈ ਦੀ ਵਿਚਾਰ ਕਰੋ।", "k": "ਜਦੋਂ ਅਮਰਦਾਸ ਜੀ ਖਡੂਰ ਵਿਚ ਗੁਰੂ ਅੰਗਦ ਜੀ ਦੀ ਸੇਵਾ ਕਰਨ ਆਏ, ਉਦੋਂ ਉਹ ਸੱਠ ਸਾਲ ਟੱਪ ਚੁੱਕੇ ਸਨ। ਹਰ ਰੋਜ਼, ਸੂਰਜ ਚੜ੍ਹਨ ਤੋਂ ਪਹਿਲਾਂ ਦੇ ਹਨੇਰੇ ਵਿਚ, ਉਹ ਬਿਆਸ ਦਰਿਆ ਤਕ ਜਾਂਦੇ, ਗਾਗਰ ਵਿਚ ਪਾਣੀ ਭਰਦੇ, ਤੇ ਵਾਪਸ ਲਿਆਉਂਦੇ ਤਾਂ ਜੋ ਗੁਰੂ ਜੀ ਇਸ਼ਨਾਨ ਕਰ ਸਕਣ। ਉਹ ਇਹ ਹਰ ਸਵੇਰ ਕਰਦੇ ਰਹੇ, ਗਰਮੀ ਦੀ ਤਪਸ਼ ਵਿਚ ਵੀ ਤੇ ਸਿਆਲ ਦੀ ਠੰਢ ਵਿਚ ਵੀ, ਬਾਰਾਂ ਸਾਲ ਤਕ। ਪਰੰਪਰਾ ਯਾਦ ਕਰਦੀ ਹੈ ਕਿ ਇਕ ਤੂਫ਼ਾਨੀ ਰਾਤ ਉਹ ਠੇਡਾ ਖਾ ਕੇ ਇਕ ਜੁਲਾਹੇ ਦੀ ਖੱਡੀ ਵਿਚ ਡਿੱਗ ਪਏ। ਉਹ ਉੱਠੇ, ਗਾਗਰ ਚੁੱਕੀ, ਤੇ ਪਾਣੀ ਲੈ ਕੇ ਅੱਗੇ ਤੁਰ ਪਏ। ਸਾਲਾਂ ਬਾਅਦ ਇਹੀ ਸ਼ਾਂਤ, ਵਫ਼ਾਦਾਰ ਇਨਸਾਨ ਤੀਜੇ ਗੁਰੂ ਬਣੇ।", "a": "ਅੰਮ੍ਰਿਤ ਵੇਲਾ ਸੂਰਜ ਚੜ੍ਹਨ ਤੋਂ ਪਹਿਲਾਂ ਦਾ ਸ਼ਾਂਤ ਸਮਾਂ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਵਿਚਾਰ ਨੂੰ ਦਿਨ ਦੇ ਇਕ ਪੱਕੇ ਸਮੇਂ ਨਾਲ ਬੰਨ੍ਹਦੇ ਹਨ। ਮਨ ਤਾਜ਼ਾ ਹੁੰਦਾ ਹੈ, ਘਰ ਚੁੱਪ ਹੁੰਦਾ ਹੈ, ਤੇ ਫ਼ੋਨ ਨੇ ਅਜੇ ਬੁਲਾਉਣਾ ਸ਼ੁਰੂ ਨਹੀਂ ਕੀਤਾ ਹੁੰਦਾ। ਅਮਰਦਾਸ ਜੀ ਦੇ ਬਾਰਾਂ ਸਾਲਾਂ ਦਾ ਪਾਣੀ ਪੱਕੇ ਸਮੇਂ ਦੀ ਲੁਕੀ ਤਾਕਤ ਵਿਖਾਉਂਦਾ ਹੈ। ਉਨ੍ਹਾਂ ਨੂੰ ਹਰ ਸਵੇਰ ਇਹ ਤੈਅ ਨਹੀਂ ਕਰਨਾ ਪੈਂਦਾ ਸੀ ਕਿ ਜਾਵਾਂ ਕਿ ਨਾ। ਪਹੁ ਫੁਟਾਲਾ ਉਨ੍ਹਾਂ ਲਈ ਤੈਅ ਕਰ ਦਿੰਦਾ ਸੀ। ਜੇਮਜ਼ ਕਲੀਅਰ ਆਪਣੀ ਕਿਤਾਬ, ਐਟੌਮਿਕ ਹੈਬਿਟਸ, ਵਿਚ ਇਹੀ ਸਲਾਹ ਅੱਜ ਦੇ ਸ਼ਬਦਾਂ ਵਿਚ ਦਿੰਦੇ ਹਨ। ਅਜਿਹੀ ਸ਼ੁਰੂਆਤ ਕਰੋ ਜਿਸ ਨੂੰ ਬੱਸ ਦੋ ਮਿੰਟ ਲੱਗਣ, ਤੇ ਉਸ ਨੂੰ ਕਿਸੇ ਅਜਿਹੇ ਕੰਮ ਨਾਲ ਜੋੜ ਦਿਓ ਜੋ ਤੁਸੀਂ ਪਹਿਲਾਂ ਹੀ ਕਰਦੇ ਹੋ। ਦੰਦ ਸਾਫ਼ ਕਰਨ ਤੋਂ ਬਾਅਦ, ਮੈਂ ਦੋ ਮਿੰਟ ਸ਼ਾਂਤ ਬੈਠਾਂਗਾ। ਏਨਾ ਛੋਟਾ ਕਿ ਨਾਂਹ ਨਾ ਕਰ ਸਕੋ।", "b": "ਇਹ ਕੰਮ ਕਿਉਂ ਕਰਦਾ ਹੈ? ਤੁਹਾਡੀ ਨਵੇਂ ਸਾਲ ਵਾਲੀ ਯੋਜਨਾ ਬਹੁਤ ਵੱਡੀ ਸੀ, ਤੇ ਉਸ ਦਾ ਕੋਈ ਪੱਕਾ ਸਮਾਂ ਨਹੀਂ ਸੀ। ਹਰ ਰੋਜ਼ ਆਪਣੇ ਆਪ ਨਾਲ ਬਹਿਸ ਕਰਨੀ ਪੈਂਦੀ ਸੀ, ਜਾਵਾਂ ਕਿ ਅੱਜ ਰਹਿਣ ਦਿਆਂ? ਇਹ ਰੋਜ਼ ਦੀ ਬਹਿਸ ਸਰੀਰ ਤੋਂ ਬਹੁਤ ਪਹਿਲਾਂ ਮਨ ਨੂੰ ਥਕਾ ਦਿੰਦੀ ਹੈ। ਪੱਕਾ ਸਮਾਂ ਇਸ ਬਹਿਸ ਨੂੰ ਮੁਕਾ ਦਿੰਦਾ ਹੈ। ਤੇ ਛੋਟੇ ਕਦਮ ਚੁੱਪ ਚਾਪ ਜੁੜਦੇ ਜਾਂਦੇ ਹਨ। ਰੋਜ਼ ਬਚਾਇਆ ਇਕ ਰੁਪਈਆ ਕੁਝ ਨਹੀਂ ਲੱਗਦਾ। ਇਕ ਸਾਲ ਵਿਚ ਉਹ ਚੰਗੀ ਰਕਮ ਬਣ ਜਾਂਦਾ ਹੈ। ਆਦਤ ਵੀ ਇਉਂ ਹੀ ਵਧਦੀ ਹੈ। ਪਹਿਲਾਂ ਉਸ ਨੂੰ ਪੱਕੀ ਕਰੋ, ਭਾਵੇਂ ਉਹ ਬਹੁਤ ਛੋਟੀ ਹੋਵੇ। ਬਾਅਦ ਵਿਚ ਉਸ ਨੂੰ ਲੰਮੀ ਕਰ ਸਕਦੇ ਹੋ। ਰੋਜ਼ ਬਲਣ ਵਾਲਾ ਛੋਟਾ ਦੀਵਾ ਸਾਲ ਵਿਚ ਇਕ ਵਾਰ ਬਲਣ ਵਾਲੀ ਵੱਡੀ ਅੱਗ ਨਾਲੋਂ ਵੱਧ ਚਾਨਣ ਦਿੰਦਾ ਹੈ।", "t": "ਦੋ ਮਿੰਟ ਦੀ ਇੱਕ ਆਦਤ ਬੁਰਸ਼ ਕਰਨ ਨਾਲ ਜੋੜੋ। ਕੱਲ੍ਹ ਤੋਂ ਸ਼ੁਰੂ।", "q": "ਤੁਸੀਂ ਨਿਯਮਿਤ ਕਸਰਤ ਚਾਹੁੰਦੇ ਹੋ। ਜਿਮ ਤਿੰਨ ਵਾਰ ਛੁੱਟ ਚੁੱਕਾ ਹੈ। ਕਿਹੜੀ ਯੋਜਨਾ ਸਭ ਤੋਂ ਵੱਧ ਟਿਕੇਗੀ?", "o": ["ਇੱਕ ਸਾਲ ਦੀ ਜਿਮ ਮੈਂਬਰਸ਼ਿਪ ਲੈਣਾ ਤਾਂ ਜੋ ਪੈਸਾ ਮਜਬੂਰ ਕਰੇ", "ਕਿਸੇ ਘੱਟ ਰੁਝੇਵੇਂ ਵਾਲੇ ਮਹੀਨੇ ਦੀ ਉਡੀਕ ਕਰਨਾ", "ਹਰ ਸਵੇਰ ਬੁਰਸ਼ ਕਰਦਿਆਂ ਹੀ ਦਸ ਪੁਸ਼-ਅੱਪ"], "y": "ਸਿਆਣਪ। ਬਹੁਤ ਛੋਟਾ, ਪਹਿਲਾਂ ਤੋਂ ਹੁੰਦੀ ਚੀਜ਼ ਨਾਲ ਜੁੜਿਆ, ਅਤੇ ਛੱਡਣਾ ਨਾਮੁਮਕਿਨ। ਆਪਣੇ ਆਪ ਹੋਣ ਲੱਗੇ, ਤਦ ਵਧਾਓ।", "n": "ਬਹੁਤ ਲੋਕ ਇਹੀ ਕਰਦੇ ਹਨ। ਪਰ ਪੈਸੇ ਦਾ ਦਬਾਅ ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਫਿੱਕਾ ਪੈਂਦਾ ਹੈ, ਅਤੇ ਘੱਟ ਰੁਝੇਵੇਂ ਵਾਲਾ ਮਹੀਨਾ ਕਦੇ ਆਉਂਦਾ ਨਹੀਂ। ਬੁਰਸ਼ ਵਰਗੀ ਚੀਜ਼ ਨਾਲ ਜੁੜੀ ਛੋਟੀ ਆਦਤ ਟਿਕਦੀ ਹੈ।", "d": "ਅਮਰਦਾਸ ਜੀ ਸੱਠ ਤੋਂ ਉੱਪਰ ਸਨ ਜਦੋਂ ਉਹ ਹਰ ਸਵੇਰ ਪਹੁ-ਫੁਟਾਲੇ ਤੋਂ ਪਹਿਲਾਂ ਬਿਆਸ ਦਰਿਆ ਤੋਂ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਲਈ ਪਾਣੀ ਲਿਆਉਣ ਲੱਗੇ। ਗਰਮੀ ਹੋਵੇ ਜਾਂ ਸਰਦੀ, ਬਾਰ੍ਹਾਂ ਸਾਲ। ਇੱਕ ਤੂਫ਼ਾਨੀ ਰਾਤ ਉਹ ਜੁਲਾਹੇ ਦੀ ਖੱਡੀ ਵਿੱਚ ਡਿੱਗ ਪਏ, ਉੱਠੇ, ਅਤੇ ਪਾਣੀ ਲੈ ਆਏ। ਉਹੀ ਸ਼ਾਂਤ ਇਨਸਾਨ ਤੀਜੇ ਗੁਰੂ ਬਣੇ। ਵੱਡੇ ਸੰਕਲਪ ਕਿਉਂ ਟੁੱਟਦੇ ਹਨ? ਕਿਉਂਕਿ ਉਹ ਜੋਸ਼ ਉੱਤੇ ਟਿਕੇ ਹੁੰਦੇ ਹਨ, ਅਤੇ ਜੋਸ਼ ਇੱਕ ਮੂਡ ਹੈ। ਆਦਤਾਂ ਦੁਹਰਾਅ ਉੱਤੇ ਟਿਕਦੀਆਂ ਹਨ। ਜੇਮਸ ਕਲੀਅਰ ਦੀ ਐਟੌਮਿਕ ਹੈਬਿਟਸ (2018) ਚੱਕਰ ਦੱਸਦੀ ਹੈ: ਸੰਕੇਤ, ਚਾਹ, ਪ੍ਰਤੀਕਿਰਿਆ, ਇਨਾਮ। ਸ਼ੁਰੂਆਤ ਬਹੁਤ ਛੋਟੀ ਰੱਖੋ ਅਤੇ ਉਸ ਨੂੰ ਕਿਸੇ ਪਹਿਲਾਂ ਤੋਂ ਕੀਤੀ ਜਾਂਦੀ ਚੀਜ਼ ਨਾਲ ਜੋੜੋ। ਫ਼ਿਲਿਪਾ ਲੈਲੀ ਦੇ 2010 ਦੇ ਅਧਿਐਨ ਵਿੱਚ ਨਵੀਂ ਆਦਤ ਨੂੰ ਆਪਣੇ ਆਪ ਹੋਣ ਵਿੱਚ ਔਸਤਨ ਲਗਭਗ ਛਿਆਹਠ ਦਿਨ ਲੱਗੇ। ਇਸੇ ਕਰਕੇ ਅੰਮ੍ਰਿਤ ਵੇਲਾ, ਰੋਜ਼ ਉਹੀ ਸ਼ਾਂਤ ਪਹਿਰ, ਮਾਇਨੇ ਰੱਖਦਾ ਹੈ। ਅਸਲ ਮਿਸਾਲ: ਰੋਜ਼ ਰਾਤ ਦੋ ਸਫ਼ੇ ਯਾਨੀ ਸਾਲ ਵਿੱਚ ਲਗਭਗ ਵੀਹ ਕਿਤਾਬਾਂ। ਐਤਵਾਰ ਦਾ ਇੱਕ ਘੰਟਾ ਮਸਾਂ ਹੀ ਮਹੀਨਾ ਪਾਰ ਕਰਦਾ ਹੈ।"}, "action1": {"ti": "ਜੋ ਬੀਜੋਗੇ", "s": "ਇਕ ਦੁਕਾਨਦਾਰ ਰੋਜ਼ ਦੁੱਧ ਵਿਚ ਥੋੜ੍ਹਾ ਜਿਹਾ ਪਾਣੀ ਰਲਾਉਂਦਾ ਹੈ। ਕਿਸੇ ਨੂੰ ਪਤਾ ਨਹੀਂ ਲੱਗਦਾ। ਇਕ ਸਾਲ ਬਾਅਦ ਉਸ ਦੇ ਅੱਧੇ ਗਾਹਕ ਚੁੱਪ ਚਾਪ ਅਗਲੀ ਦੁਕਾਨ ਉੱਤੇ ਜਾ ਚੁੱਕੇ ਹੁੰਦੇ ਹਨ।", "m": "ਤੁਸੀਂ ਆਪ ਹੀ ਬੀਜ ਬੀਜਦੇ ਹੋ, ਤੇ ਆਪ ਹੀ ਉਸ ਦੀ ਫ਼ਸਲ ਖਾਂਦੇ ਹੋ।", "k": "ਭਾਈ ਵੀਰ ਸਿੰਘ ਭੂਮੀਏ ਨਾਂ ਦੇ ਇਕ ਡਾਕੂ ਦੀ ਪੁਰਾਣੀ ਕਹਾਣੀ ਸੁਣਾਉਂਦੇ ਹਨ, ਜੋ ਚੋਰੀ ਦੇ ਪੈਸੇ ਨਾਲ ਮੁਸਾਫ਼ਰਾਂ ਨੂੰ ਮੁਫ਼ਤ ਭੋਜਨ ਛਕਾਉਂਦਾ ਸੀ। ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਉੱਥੋਂ ਲੰਘੇ, ਤਾਂ ਭੂਮੀਏ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਭੋਜਨ ਲਈ ਸੱਦਿਆ। ਗੁਰੂ ਜੀ ਦੂਜਿਆਂ ਦੇ ਹੰਝੂਆਂ ਨਾਲ ਖ਼ਰੀਦਿਆ ਭੋਜਨ ਨਹੀਂ ਛਕਦੇ ਸਨ, ਪਰ ਉਨ੍ਹਾਂ ਨੇ ਭੂਮੀਏ ਅੱਗੇ ਇਕ ਗੱਲ ਰੱਖੀ। ਕੁਝ ਛੋਟੇ ਵਾਅਦੇ ਨਿਭਾ: ਗ਼ਰੀਬ ਨੂੰ ਕਦੇ ਨਾ ਲੁੱਟੀਂ, ਸਦਾ ਸੱਚ ਬੋਲੀਂ, ਤੇ ਜਿਸ ਘਰ ਦਾ ਲੂਣ ਖਾਧਾ ਹੋਵੇ ਉਸ ਨਾਲ ਕਦੇ ਧੋਖਾ ਨਾ ਕਰੀਂ। ਭੂਮੀਏ ਨੇ ਸੌਖੇ ਸਮਝ ਕੇ ਹਾਂ ਕਹਿ ਦਿੱਤੀ। ਪਰ ਛੇਤੀ ਹੀ ਹਰ ਛੋਟਾ ਵਾਅਦਾ ਕਿਸੇ ਨਾ ਕਿਸੇ ਜੁਰਮ ਅੱਗੇ ਕੰਧ ਬਣਨ ਲੱਗਾ। ਤੇ ਇਕ ਰਾਤ, ਵਾਅਦੇ ਨਿਭਾਉਂਦਿਆਂ, ਉਸ ਨੇ ਵੇਖਿਆ ਕਿ ਉਹ ਹੁਣ ਚੋਰੀ ਕਰ ਹੀ ਨਹੀਂ ਸਕਦਾ। ਉਸ ਦਾ ਸਾਰਾ ਜੀਵਨ ਬਦਲ ਗਿਆ।", "a": "ਗੁਰੂ ਨਾਨਕ ਕਿਸਾਨ ਦੀ ਅਜਿਹੀ ਤਸਵੀਰ ਦਿੰਦੇ ਹਨ ਜੋ ਹਰ ਕੋਈ ਸਮਝਦਾ ਹੈ। ਕਣਕ ਬੀਜੋਗੇ ਤਾਂ ਕਣਕ ਮਿਲੇਗੀ। ਕੰਡੇ ਬੀਜੋਗੇ ਤਾਂ ਕੰਡੇ। ਤੁਹਾਡੀ ਫ਼ਸਲ ਕੋਈ ਹੋਰ ਤੈਅ ਨਹੀਂ ਕਰਦਾ। ਭੂਮੀਏ ਦੀ ਕਹਾਣੀ ਇਹੀ ਸੱਚ ਉਮੀਦ ਵਾਲੇ ਪਾਸਿਓਂ ਵਿਖਾਉਂਦੀ ਹੈ। ਉਹ ਕਿਸੇ ਇਕ ਵੱਡੇ ਪਲ ਵਿਚ ਨਹੀਂ ਬਦਲਿਆ। ਉਹ ਕੁਝ ਛੋਟੇ ਵਾਅਦਿਆਂ ਨਾਲ ਬਦਲਿਆ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਉਹ ਵਾਰ ਵਾਰ ਨਿਭਾਉਂਦਾ ਰਿਹਾ, ਜਦ ਤਕ ਉਸ ਦਾ ਸਾਰਾ ਜੀਵਨ ਵੱਖਰਾ ਨਾ ਹੋ ਗਿਆ। ਇਹ ਪੰਕਤੀ ਧਮਕੀ ਨਹੀਂ। ਇਹ ਚੰਗੀ ਖ਼ਬਰ ਹੈ, ਕਿਉਂਕਿ ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਤੁਸੀਂ ਅੱਜ । ਛੋਟੇ ਕੰਮ ਬੈਂਕ ਦੇ ਵਿਆਜ ਵਾਂਗ ਵਧਦੇ ਹਨ। ਜਪੁਜੀ ਸਾਹਿਬ ਸਿੱਧਾ ਕਹਿੰਦਾ ਹੈ: ਆਪੇ ਬੀਜਦੇ ਹੋ, ਆਪੇ ਖਾਂਦੇ ਹੋ। ਅਸਲ ਮਿਸਾਲ: ਜੋ ਦੁਕਾਨਦਾਰ ਰੋਜ਼ ਦੁੱਧ ਵਿੱਚ ਥੋੜ੍ਹਾ ਪਾਣੀ ਮਿਲਾਉਂਦਾ ਹੈ, ਉਹ ਇੱਕ ਸਾਲ ਵਿੱਚ ਅੱਧੇ ਗਾਹਕ ਗੁਆ ਦਿੰਦਾ ਹੈ, ਇੱਕ-ਇੱਕ ਚੁੱਪ ਫ਼ੈਸਲੇ ਨਾਲ।"}, "hard1": {"ti": "ਜਦੋਂ ਦਿਨ ਭਾਰਾ ਹੋਵੇ", "s": "ਨਤੀਜਾ ਆਉਂਦਾ ਹੈ, ਤੇ ਚੰਗਾ ਨਹੀਂ। ਜਾਂ ਨੌਕਰੀ ਚਲੀ ਗਈ। ਜਾਂ ਕੋਈ ਆਪਣਾ ਬੀਮਾਰ ਹੈ। ਭਲੇ ਲੋਕ ਕਹਿੰਦੇ ਹਨ, ਜੋ ਹੁੰਦਾ ਹੈ ਚੰਗੇ ਲਈ ਹੁੰਦਾ ਹੈ। ਪਤਾ ਨਹੀਂ ਕਿਉਂ, ਇਸ ਨਾਲ ਮਨ ਹੌਲਾ ਨਹੀਂ ਹੁੰਦਾ।", "m": "ਕਿੰਨੇ ਹੀ ਲੋਕ ਦੁੱਖ, ਭੁੱਖ ਤੇ ਲਗਾਤਾਰ ਮਾਰ ਸਹਿੰਦੇ ਹਨ। ਹੇ ਦਾਤਾਰ, ਇਹ ਵੀ ਤੇਰੀ ਹੀ ਦਾਤ ਹਨ।", "k": "ਲਗਭਗ ਸੰਨ ਪੰਦਰਾਂ ਸੌ ਇੱਕੀ ਵਿਚ ਬਾਬਰ ਦੀ ਫ਼ੌਜ ਨੇ ਸੈਦਪੁਰ ਨਗਰ ਉੱਤੇ ਹਮਲਾ ਕੀਤਾ। ਗੁਰੂ ਨਾਨਕ ਉੱਥੇ ਹੀ ਸਨ। ਜਨਮਸਾਖੀਆਂ ਦੱਸਦੀਆਂ ਹਨ ਕਿ ਉਹ ਵੀ ਕੈਦ ਕੀਤੇ ਲੋਕਾਂ ਵਿਚ ਸਨ, ਤੇ ਕੈਦਖ਼ਾਨੇ ਵਿਚ ਦੂਜੇ ਕੈਦੀਆਂ ਵਾਂਗ ਚੱਕੀ ਪੀਹਂਦੇ ਹੋਏ ਉਹ ਗਾਉਂਦੇ ਰਹੇ। ਉਨ੍ਹਾਂ ਨੇ ਜੋ ਵੇਖਿਆ, ਉਸ ਵਿਚੋਂ ਚਾਰ ਸ਼ਬਦ ਨਿਕਲੇ, ਜੋ ਅੱਜ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਵਿਚ ਹਨ ਤੇ ਬਾਬਰਵਾਣੀ ਅਖਵਾਉਂਦੇ ਹਨ। ਉਨ੍ਹਾਂ ਵਿਚ ਉਹ ਨਜ਼ਰ ਨਹੀਂ ਫੇਰਦੇ। ਉਹ ਡਰ, ਦੁੱਖ ਤੇ ਤਬਾਹੀ ਨੂੰ ਸਾਫ਼ ਸਾਫ਼ ਬਿਆਨ ਕਰਦੇ ਹਨ, ਤੇ ਕਰਤੇ ਨੂੰ ਲੋਕਾਂ ਦੇ ਦਰਦ ਬਾਰੇ ਸਵਾਲ ਵੀ ਕਰਦੇ ਹਨ। ਫਿਰ ਵੀ ਇਸ ਸਭ ਵਿਚਕਾਰ ਉਹ ਉਸ ਇਕ ਨਾਲ ਗੱਲ ਕਰਨਾ ਕਦੇ ਨਹੀਂ ਛੱਡਦੇ।", "a": "ਗੁਰੂ ਨਾਨਕ ਦੁੱਖ ਨੂੰ ਲੁਕਾਉਂਦੇ ਨਹੀਂ। ਇਸ ਪਉੜੀ ਵਿਚ ਉਹ ਉਸ ਦਾ ਸਾਫ਼ ਨਾਂ ਲੈਂਦੇ ਹਨ: ਦਰਦ, ਭੁੱਖ, ਵਾਰ ਵਾਰ ਦੀ ਮਾਰ। ਸੈਦਪੁਰ ਵਿਚ ਵੀ ਉਨ੍ਹਾਂ ਨੇ ਇਹੀ ਕੀਤਾ, ਅਸਲੀ ਦੁੱਖ ਨੂੰ ਸ਼ਬਦ ਦਿੱਤੇ, ਉਸ ਨੂੰ ਸੋਹਣੇ ਵਾਕਾਂ ਨਾਲ ਢਕਿਆ ਨਹੀਂ। ਉਹ ਇਹ ਨਹੀਂ ਕਹਿੰਦੇ ਕਿ ਦੁੱਖ ਮਿੱਠਾ ਹੈ, ਜਾਂ ਸਾਨੂੰ ਹੱਸ ਕੇ ਸਹਿਣਾ ਚਾਹੀਦਾ ਹੈ। ਉਹ ਬੱਸ ਏਨਾ ਜੋੜਦੇ ਹਨ: ਔਖਾ ਸਮਾਂ ਦਾਤਾਰ ਦੇ ਹੱਥੋਂ ਬਾਹਰ ਨਹੀਂ। ਇਹ ਇਸ ਗੱਲ ਦਾ ਸਬੂਤ ਨਹੀਂ ਕਿ ਤੁਹਾਨੂੰ ਭੁਲਾ ਦਿੱਤਾ ਗਿਆ ਹੈ। ਚੰਗੇ ਦਿਨ ਤੇ ਭਾਰੇ ਦਿਨ ਇਕੋ ਥਾਂ ਤੋਂ ਆਉਂਦੇ ਹਨ। ਇਹ ਇਕ ਸੋਚ ਉਸ ਵੱਖਰੇ ਦਰਦ ਨੂੰ ਹਟਾ ਸਕਦੀ ਹੈ ਜੋ ਪੁੱਛਦਾ ਹੈ, ਸਿਰਫ਼ ਮੇਰੇ ਨਾਲ ਹੀ ਕਿਉਂ? ਇਹ ਤੁਹਾਨੂੰ ਦੁਖੀ ਹੋਣ ਦਿੰਦੀ ਹੈ, ਬਿਨਾਂ ਆਪਣੇ ਆਪ ਨੂੰ ਛੱਡਿਆ ਹੋਇਆ ਮਹਿਸੂਸ ਕੀਤੇ।", "b": "ਵਿਕਟਰ ਫ਼ਰੈਂਕਲ ਇਕ ਡਾਕਟਰ ਸਨ ਜੋ ਨਾਜ਼ੀ ਕੈਦਖ਼ਾਨਿਆਂ ਵਿਚੋਂ ਬਚ ਕੇ ਨਿਕਲੇ। ਆਪਣੀ ਕਿਤਾਬ, ਮੈਨਜ਼ ਸਰਚ ਫ਼ਾਰ ਮੀਨਿੰਗ, ਵਿਚ ਉਨ੍ਹਾਂ ਨੇ ਲਿਖਿਆ ਕਿ ਜਦੋਂ ਅਸੀਂ ਹਾਲਾਤ ਨਹੀਂ ਬਦਲ ਸਕਦੇ, ਉਦੋਂ ਵੀ ਇਹ ਚੁਣ ਸਕਦੇ ਹਾਂ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਸਾਹਮਣਾ ਕਿਵੇਂ ਕਰੀਏ। ਜਿਨ੍ਹਾਂ ਲੋਕਾਂ ਨੇ ਆਪਣੇ ਦੁੱਖ ਵਿਚ ਕੋਈ ਅਰਥ ਲੱਭ ਲਿਆ, ਉਹ ਉਸ ਨੂੰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਚੁੱਕ ਸਕੇ। ਇਕ ਵਿਦਿਆਰਥਣ ਬਾਰੇ ਸੋਚੋ ਜੋ ਇਕ ਵਾਰ ਫ਼ੇਲ ਹੋਈ, ਤੇ ਅੱਗੇ ਜਾ ਕੇ ਧੀਰਜ ਵਾਲੀ ਅਧਿਆਪਕਾ ਬਣੀ, ਕਿਉਂਕਿ ਉਸ ਨੂੰ ਠੀਕ ਯਾਦ ਸੀ ਕਿ ਫ਼ੇਲ ਹੋਣਾ ਕਿਵੇਂ ਲੱਗਦਾ ਹੈ। ਫ਼ੇਲ ਹੋਣ ਦਾ ਦਰਦ ਉਦੋਂ ਵੀ ਹੋਇਆ ਸੀ। ਪਰ ਉਹ ਬੇਕਾਰ ਨਹੀਂ ਗਿਆ। ਇਹ ਵੀ ਵੇਖੋ ਕਿ ਗੁਰੂ ਨਾਨਕ ਦੂਜੇ ਕੈਦੀਆਂ ਵਿਚਕਾਰ ਗਾਉਂਦੇ ਰਹੇ। ਇਕੱਠੇ ਚੁੱਕਿਆ ਦੁੱਖ ਹੌਲਾ ਹੁੰਦਾ ਹੈ। ਭਾਰੇ ਦਿਨ ਇਕ ਸੱਚੀ ਗੱਲਬਾਤ ਸੌ ਬਹਾਦਰ ਚਿਹਰਿਆਂ ਨਾਲੋਂ ਵੱਧ ਕੰਮ ਆਉਂਦੀ ਹੈ।", "t": "ਜੇ ਅੱਜ ਦਿਨ ਭਾਰਾ ਹੈ, ਤਾਂ ਕਿਸੇ ਭਰੋਸੇ ਵਾਲੇ ਨੂੰ ਫ਼ੋਨ ਕਰਕੇ ਬੱਸ ਇੰਨਾ ਕਹੋ: ਅੱਜ ਦਿਨ ਔਖਾ ਸੀ।", "q": "ਇਸ ਮਹੀਨੇ ਪੰਜਵੇਂ ਇੰਟਰਵਿਊ ਵਿੱਚ ਵੀ ਤੁਸੀਂ ਰਿਜੈਕਟ ਹੋ ਗਏ। ਮੰਮੀ ਕਹਿੰਦੇ ਹਨ: ਚਿੰਤਾ ਨਾ ਕਰ, ਸਭ ਕਿਸੇ ਕਾਰਨ ਹੁੰਦਾ ਹੈ। ਤੁਹਾਨੂੰ ਹੋਰ ਮਾੜਾ ਲੱਗਦਾ ਹੈ। ਹੁਣੇ ਸਭ ਤੋਂ ਵੱਧ ਕੀ ਮਦਦ ਕਰੇਗਾ?", "o": ["ਅੱਜ ਰਾਤ ਪੰਜਾਹ ਨੌਕਰੀਆਂ ਲਈ ਅਪਲਾਈ ਕਰਨਾ ਤਾਂ ਜੋ ਸਾਬਤ ਹੋਵੇ ਤੁਸੀਂ ਨਾਕਾਮ ਨਹੀਂ", "ਅੱਜ ਆਪਣੇ ਆਪ ਨੂੰ ਉਦਾਸ ਹੋਣ ਦੇਣਾ, ਫਿਰ ਕੱਲ੍ਹ ਕਿਸੇ ਇੰਟਰਵਿਊਅਰ ਤੋਂ ਫ਼ੀਡਬੈਕ ਮੰਗਣਾ", "ਮੰਨ ਲੈਣਾ ਕਿ ਤੁਸੀਂ ਕਾਬਲ ਨਹੀਂ ਅਤੇ ਕੁਝ ਸਮਾਂ ਅਪਲਾਈ ਬੰਦ"], "y": "ਇਹੀ ਅਸਲ ਤਾਕਤ ਹੈ। ਦਰਦ ਨੂੰ ਇਮਾਨਦਾਰੀ ਨਾਲ ਮਹਿਸੂਸ ਕਰਨਾ ਉਸ ਨੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਕੋਸਣ ਵਿੱਚ ਬਦਲਣ ਤੋਂ ਰੋਕਦਾ ਹੈ, ਅਤੇ ਫ਼ੀਡਬੈਕ ਰਿਜੈਕਸ਼ਨ ਨੂੰ ਜਾਣਕਾਰੀ ਬਣਾ ਦਿੰਦੀ ਹੈ।", "n": "ਦੋਵੇਂ ਪ੍ਰਤੀਕਿਰਿਆਵਾਂ ਇਨਸਾਨੀ ਹਨ। ਪਰ ਘਬਰਾਹਟ ਵਿੱਚ ਅਪਲਾਈ ਕਰਨ ਨਾਲ ਅਕਸਰ ਹੋਰ ਰਿਜੈਕਸ਼ਨ ਮਿਲਦੀ ਹੈ, ਅਤੇ ਹਾਰ ਮੰਨਣਾ ਇੱਕ ਮਾੜੇ ਮਹੀਨੇ ਨੂੰ ਆਪਣੇ ਬਾਰੇ ਯਕੀਨ ਬਣਾ ਦਿੰਦਾ ਹੈ। ਅੱਜ ਮਹਿਸੂਸ ਕਰੋ, ਕੱਲ੍ਹ ਫ਼ੀਡਬੈਕ ਮੰਗੋ।", "d": "ਲਗਭਗ 1521 ਵਿੱਚ ਜਦੋਂ ਬਾਬਰ ਦੀ ਫ਼ੌਜ ਨੇ ਸੈਦਪੁਰ ਉੱਤੇ ਹਮਲਾ ਕੀਤਾ, ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਉੱਥੇ ਹੀ ਸਨ। ਬਾਬਰਵਾਣੀ ਨਾਮ ਦੀ ਬਾਣੀ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਦੁੱਖ ਤੋਂ ਨਜ਼ਰ ਨਹੀਂ ਚੁਰਾਈ। ਉਨ੍ਹਾਂ ਨੇ ਉਸ ਨੂੰ ਸਾਫ਼-ਸਾਫ਼ ਲਿਖਿਆ, ਅਤੇ ਕਰਤਾਰ ਨੂੰ ਸਵਾਲ ਵੀ ਕੀਤਾ। ਫਿਰ ਵੀ ਗਾਉਣਾ ਨਹੀਂ ਛੱਡਿਆ। ਜਦੋਂ ਲੋਕ ਕਹਿੰਦੇ ਹਨ ਸਭ ਚੰਗੇ ਲਈ ਹੁੰਦਾ ਹੈ, ਤਾਂ ਮਾੜਾ ਕਿਉਂ ਲੱਗਦਾ ਹੈ? ਕਿਉਂਕਿ ਇਹ ਦਰਦ ਨੂੰ ਛੱਡ ਕੇ ਅੱਗੇ ਛਾਲ ਮਾਰ ਦਿੰਦਾ ਹੈ। ਅਸਲ ਤਾਕਤ ਦਿਖਾਵਾ ਨਹੀਂ, ਘਾਟੇ ਨੂੰ ਮਹਿਸੂਸ ਕਰਕੇ ਵੀ ਟਿਕੇ ਰਹਿਣਾ ਹੈ। ਨਾਜ਼ੀ ਕੈਂਪਾਂ ਵਿੱਚੋਂ ਬਚੇ ਵਿਕਟਰ ਫ਼੍ਰੈਂਕਲ ਨੇ ਲਿਖਿਆ ਕਿ ਜਦੋਂ ਅਸੀਂ ਹਾਲਾਤ ਨਹੀਂ ਬਦਲ ਸਕਦੇ, ਤਾਂ ਆਪਣੇ ਆਪ ਨੂੰ ਬਦਲਣ ਦੀ ਚੁਣੌਤੀ ਮਿਲਦੀ ਹੈ (1946)। ਟੇਡੇਸਕੀ ਅਤੇ ਕੈਲਹੂਨ ਨੇ ਪਾਇਆ ਕਿ ਵੱਡੀ ਮੁਸ਼ਕਲ ਤੋਂ ਬਾਅਦ ਬਹੁਤ ਲੋਕ ਡੂੰਘੇ ਰਿਸ਼ਤੇ ਅਤੇ ਸਾਫ਼ ਤਰਜੀਹਾਂ ਦੱਸਦੇ ਹਨ: ਪੋਸਟ-ਟ੍ਰਾਮੈਟਿਕ ਗ੍ਰੋਥ। ਦੁੱਖ ਚੰਗਾ ਨਹੀਂ। ਪਰ ਆਖ਼ਰੀ ਸ਼ਬਦ ਉਸ ਦਾ ਨਹੀਂ। ਅਸਲ ਮਿਸਾਲ: ਮਹਾਂਮਾਰੀ ਵਿੱਚ ਨੌਕਰੀ ਗੁਆਉਣ ਵਾਲੇ ਕਈ ਲੋਕ ਕਹਿੰਦੇ ਹਨ ਕਿ ਉਸੇ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸਹੀ ਕੰਮ ਵੱਲ ਧੱਕਿਆ।"}, "kind1": {"ti": "ਦੋਹਾਂ ਪਾਸਿਆਂ ਲਈ ਪਾਣੀ", "s": "ਜਿਸ ਗੁਆਂਢੀ ਨੇ ਗੱਡੀ ਖੜ੍ਹੀ ਕਰਨ ਪਿੱਛੇ ਤੁਹਾਡੇ ਪਰਿਵਾਰ ਨਾਲ ਝਗੜਾ ਕੀਤਾ ਸੀ, ਉਹ ਪੌੜੀਆਂ ਉੱਤੇ ਤਿਲਕ ਗਿਆ ਹੈ। ਨੇੜੇ ਸਿਰਫ਼ ਤੁਸੀਂ ਹੋ। ਅੰਦਰੋਂ ਇਕ ਆਵਾਜ਼ ਕਹਿੰਦੀ ਹੈ, ਯਾਦ ਹੈ ਇਸ ਨੇ ਕੀ ਕਿਹਾ ਸੀ। ਦੂਜੀ ਕਹਿੰਦੀ ਹੈ, ਇਹ ਇਕ ਇਨਸਾਨ ਹੈ, ਤੇ ਤਕਲੀਫ਼ ਵਿਚ ਹੈ।", "m": "ਇਕੋ ਕਰਤਾ ਹੈ, ਜਿਸ ਦਾ ਨਾਮ ਸੱਚ ਹੈ। ਉਹ ਸਭ ਕੁਝ ਰਚਣ ਵਾਲਾ ਹੈ, ਨਿਡਰ ਹੈ, ਕਿਸੇ ਨਾਲ ਵੈਰ ਨਹੀਂ ਰੱਖਦਾ, ਸਮੇਂ ਤੋਂ ਪਰੇ ਹੈ, ਜਨਮ ਤੋਂ ਪਰੇ ਹੈ, ਆਪਣੇ ਆਪ ਤੋਂ ਹੈ, ਤੇ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।", "k": "ਅਨੰਦਪੁਰ ਦੇ ਘੇਰੇ ਵੇਲੇ ਮੈਦਾਨ ਜ਼ਖ਼ਮੀਆਂ ਨਾਲ ਭਰਿਆ ਸੀ, ਜੋ ਪਾਣੀ ਲਈ ਪੁਕਾਰ ਰਹੇ ਸਨ। ਭਾਈ ਘਨੱਈਆ ਜੀ ਮੋਢੇ ਉੱਤੇ ਪਾਣੀ ਦੀ ਮਸ਼ਕ ਲਈ ਉਨ੍ਹਾਂ ਵਿਚਕਾਰ ਤੁਰਦੇ ਸਨ। ਉਹ ਹਰ ਇਕ ਕੋਲ ਗੋਡਿਆਂ ਭਾਰ ਬੈਠਦੇ, ਤੇ ਸਾਰਿਆਂ ਨੂੰ ਪਾਣੀ ਪਿਲਾਉਂਦੇ, ਸਿੱਖ ਸਿਪਾਹੀਆਂ ਨੂੰ ਵੀ ਤੇ ਦੁਸ਼ਮਣ ਸਿਪਾਹੀਆਂ ਨੂੰ ਵੀ। ਕੁਝ ਸਿੱਖਾਂ ਨੂੰ ਗੁੱਸਾ ਆਇਆ ਤੇ ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਕੋਲ ਸ਼ਿਕਾਇਤ ਕੀਤੀ ਕਿ ਉਹ ਦੁਸ਼ਮਣ ਨੂੰ ਫਿਰ ਜਿਊਂਦਾ ਕਰ ਰਹੇ ਹਨ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸੱਦਿਆ ਤੇ ਪੁੱਛਿਆ ਕਿ ਕੀ ਇਹ ਸੱਚ ਹੈ। ਭਾਈ ਘਨੱਈਆ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ ਕਿ ਉਸ ਮੈਦਾਨ ਵਿਚ ਉਨ੍ਹਾਂ ਨੂੰ ਕੋਈ ਦੁਸ਼ਮਣ ਨਹੀਂ ਦਿਸਦਾ, ਸਿਰਫ਼ ਲੋੜਵੰਦ ਇਨਸਾਨ ਦਿਸਦੇ ਹਨ। ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਗੁਰੂ ਜੀ ਖ਼ੁਸ਼ ਹੋਏ, ਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮੱਲ੍ਹਮ ਤੇ ਪੱਟੀਆਂ ਵੀ ਦਿੱਤੀਆਂ, ਤਾਂ ਜੋ ਉਹ ਪਾਣੀ ਦੇ ਨਾਲ ਜ਼ਖ਼ਮ ਵੀ ਭਰ ਸਕਣ।", "a": "ਮੂਲ ਮੰਤਰ ਦੇ ਵਿਚਕਾਰਲੇ ਦੋ ਸ਼ਬਦਾਂ ਨੂੰ ਵੇਖੋ। ਨਿਰਭਉ, ਯਾਨੀ ਡਰ ਤੋਂ ਬਿਨਾਂ। ਤੇ ਨਿਰਵੈਰ, ਯਾਨੀ ਵੈਰ ਤੋਂ ਬਿਨਾਂ। ਜਿਸ ਇਕ ਦੀ ਇੱਥੇ ਗੱਲ ਹੈ, ਉਸ ਦਾ ਕੋਈ ਦੁਸ਼ਮਣ ਨਹੀਂ। ਜੋ ਲੋਕ ਇਸ ਨੂੰ ਜਿਊਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਦੇ ਆਪਣੇ ਦਿਲ ਵਿਚ ਵੀ ਦੁਸ਼ਮਣ ਹੌਲੀ ਹੌਲੀ ਘਟਦੇ ਜਾਂਦੇ ਹਨ। ਭਾਈ ਘਨੱਈਆ ਜੀ ਨੇ ਵਿਖਾਇਆ ਕਿ ਸਭ ਤੋਂ ਔਖੀ ਥਾਂ, ਜੰਗ ਦੇ ਵਿਚਕਾਰ, ਇਹ ਕਿਵੇਂ ਦਿਸਦਾ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਇਹ ਨਹੀਂ ਮੰਨਿਆ ਕਿ ਲੜਾਈ ਨਹੀਂ ਹੋ ਰਹੀ। ਬੱਸ ਉਨ੍ਹਾਂ ਨੇ ਲੜਾਈ ਨੂੰ ਇਹ ਤੈਅ ਨਹੀਂ ਕਰਨ ਦਿੱਤਾ ਕਿ ਪਾਣੀ ਕਿਸ ਨੂੰ ਮਿਲੇਗਾ। ਇਹ ਕਮਜ਼ੋਰੀ ਨਹੀਂ। ਜੋ ਇਕ ਘੰਟਾ ਪਹਿਲਾਂ ਤੁਹਾਡੇ ਨਾਲ ਲੜ ਰਿਹਾ ਸੀ, ਉਸ ਕੋਲ ਗੋਡਿਆਂ ਭਾਰ ਬੈਠਣ ਲਈ ਬਹੁਤ ਹਿੰਮਤ ਚਾਹੀਦੀ ਹੈ। ਡਰ ਤੇ ਵੈਰ ਅਕਸਰ ਨਾਲ ਨਾਲ ਤੁਰਦੇ ਹਨ। ਜਦੋਂ ਅਸੀਂ ਘੱਟ ਡਰਦੇ ਹਾਂ, ਤਾਂ ਸਾਨੂੰ ਦੁਸ਼ਮਣਾਂ ਦੀ ਘੱਟ ਲੋੜ ਪੈਂਦੀ ਹੈ।", "b": "ਜਿਸ ਨੂੰ ਤੁਸੀਂ ਪਸੰਦ ਨਹੀਂ ਕਰਦੇ ਉਸ ਦੀ ਮਦਦ ਕਰਨ ਦਾ ਮਤਲਬ ਇਹ ਨਹੀਂ ਕਿ ਉਹ ਠੀਕ ਸੀ। ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਤੁਹਾਡੀ ਭਲਾਈ ਉਸ ਦੇ ਵਰਤਾਓ ਉੱਤੇ ਨਹੀਂ ਟਿਕੀ। ਇਕ ਦੀਵੇ ਨੂੰ ਵੇਖੋ। ਕਮਰੇ ਵਿਚ ਜੋ ਵੀ ਆਵੇ, ਉਹ ਸਭ ਨੂੰ ਇਕੋ ਜਿਹਾ ਚਾਨਣ ਦਿੰਦਾ ਹੈ। ਤੇ ਇਸ ਵਿਚ ਤੁਹਾਡਾ ਆਪਣਾ ਵੀ ਚੁੱਪ ਚਾਪ ਫ਼ਾਇਦਾ ਹੈ। ਨਫ਼ਰਤ ਚੁੱਕਣ ਵਿਚ ਭਾਰੀ ਹੁੰਦੀ ਹੈ। ਤੁਸੀਂ ਉਸ ਨੂੰ ਸਾਰਾ ਦਿਨ ਆਪਣੀ ਛਾਤੀ ਵਿਚ ਢੋਂਦੇ ਹੋ, ਜਦ ਕਿ ਸਾਹਮਣੇ ਵਾਲੇ ਨੂੰ ਸ਼ਾਇਦ ਪਤਾ ਵੀ ਨਾ ਹੋਵੇ। ਉਹ ਤੁਹਾਡੀ ਨੀਂਦ ਤੇ ਮੂਡ ਵਿਗਾੜਦੀ ਹੈ, ਉਸ ਦਾ ਨਹੀਂ। ਮਾਫ਼ੀ ਉੱਤੇ ਖੋਜ ਕਰਨ ਵਾਲਿਆਂ ਨੇ ਵੇਖਿਆ ਹੈ ਕਿ ਮਨ ਦੀਆਂ ਗੰਢਾਂ ਖੋਲ੍ਹਣ ਨਾਲ ਅਕਸਰ ਤਣਾਅ ਘਟਦਾ ਹੈ। ਜੋ ਭਾਰ ਹੇਠਾਂ ਰੱਖ ਦਿੰਦਾ ਹੈ, ਉਹ ਹੌਲਾ ਹੋ ਕੇ ਤੁਰਦਾ ਹੈ। ਔਖੇ ਬੰਦੇ ਨਾਲ ਭਲਾਈ, ਆਖ਼ਰ ਵਿਚ, ਆਪਣੇ ਨਾਲ ਵੀ ਭਲਾਈ ਹੈ।", "t": "ਇਸ ਹਫ਼ਤੇ ਜਿਸ ਤੋਂ ਤੁਸੀਂ ਕਤਰਾਉਂਦੇ ਹੋ, ਉਸ ਲਈ ਇੱਕ ਛੋਟੀ ਭਲਾਈ ਕਰੋ।", "q": "ਜਿਸ ਗੁਆਂਢੀ ਨੇ ਸੁਸਾਇਟੀ ਵਿੱਚ ਤੁਹਾਡੇ ਪਰਿਵਾਰ ਦੀ ਸ਼ਿਕਾਇਤ ਕੀਤੀ ਸੀ, ਉਸ ਦੀ ਗੱਡੀ ਦੀ ਬੈਟਰੀ ਬੈਠ ਗਈ ਹੈ ਅਤੇ ਉਸ ਨੂੰ ਹਸਪਤਾਲ ਪਹੁੰਚਣ ਵਿੱਚ ਦੇਰ ਹੋ ਰਹੀ ਹੈ। ਤੁਹਾਡੇ ਕੋਲ ਕੇਬਲਾਂ ਹਨ। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਅਣਡਿੱਠਾ ਕਰਨਾ; ਉਸ ਨੇ ਆਪਣਾ ਰਾਹ ਆਪ ਚੁਣਿਆ", "ਮਦਦ ਕਰਨਾ, ਪਰ ਨਾਲ ਉਸ ਦੀ ਸ਼ਿਕਾਇਤ ਯਾਦ ਕਰਾਉਣਾ", "ਛੇਤੀ ਮਦਦ ਕਰਨਾ, ਅਤੇ ਪੁਰਾਣੀ ਗੱਲ ਦਾ ਜ਼ਿਕਰ ਨਾ ਕਰਨਾ"], "y": "ਇਹੀ ਭਾਈ ਘਨੱਈਆ ਜੀ ਦਾ ਰਾਹ ਹੈ। ਲੋੜ ਇਤਿਹਾਸ ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦੀ ਹੈ। ਅਤੇ ਬਿਨਾਂ ਭਾਸ਼ਣ ਦੀ ਮਦਦ ਹੀ ਦਿਲ ਨੂੰ ਨਰਮ ਕਰਦੀ ਹੈ।", "n": "ਤੁਹਾਡੀ ਸੱਟ ਅਸਲ ਹੈ। ਪਰ ਮੂੰਹ ਮੋੜਨਾ ਤੁਹਾਨੂੰ ਛੋਟਾ ਕਰਦਾ ਹੈ, ਅਤੇ ਯਾਦ ਕਰਾ ਕੇ ਮਦਦ ਕਰਨਾ ਭਲਾਈ ਨੂੰ ਕਰਜ਼ਾ ਬਣਾ ਦਿੰਦਾ ਹੈ। ਛੇਤੀ ਮਦਦ ਕਰੋ ਅਤੇ ਬੀਤੇ ਨੂੰ ਚੁੱਪ ਰਹਿਣ ਦਿਓ।", "d": "ਅਨੰਦਪੁਰ ਦੀ ਜੰਗ ਵਿੱਚ ਭਾਈ ਘਨੱਈਆ ਜੀ ਹਰ ਜ਼ਖ਼ਮੀ ਸਿਪਾਹੀ ਨੂੰ ਪਾਣੀ ਪਿਲਾਉਂਦੇ ਸਨ, ਸਿੱਖ ਹੋਵੇ ਜਾਂ ਦੁਸ਼ਮਣ। ਕੁਝ ਨੇ ਸ਼ਿਕਾਇਤ ਕੀਤੀ, ਤਾਂ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਪੁੱਛਿਆ। ਉਨ੍ਹਾਂ ਕਿਹਾ, ਮੈਨੂੰ ਕੋਈ ਦੁਸ਼ਮਣ ਨਹੀਂ ਦਿਸਿਆ, ਬੱਸ ਲੋੜਵੰਦ ਇਨਸਾਨ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮਲ੍ਹਮ ਦਿੱਤੀ ਅਤੇ ਕਿਹਾ, ਜ਼ਖ਼ਮਾਂ ਉੱਤੇ ਵੀ ਲਾਓ। ਇਹ ਸਾਡੇ ਲਈ ਇੰਨਾ ਔਖਾ ਕਿਉਂ ਹੈ? ਮਨ ਦੁਨੀਆ ਨੂੰ ਅਸੀਂ ਅਤੇ ਉਹ ਵਿੱਚ ਵੰਡਦਾ ਹੈ, ਅਤੇ ਬਿਨਾਂ ਜਾਣੇ ਆਪਣੇ ਸਮੂਹ ਦਾ ਪੱਖ ਲੈਂਦਾ ਹੈ। ਹੈਨਰੀ ਤਾਜਫ਼ੈਲ ਨੇ ਇਸ ਨੂੰ ਸੋਸ਼ਲ ਆਈਡੈਂਟਿਟੀ ਕਿਹਾ (1979)। ੴ, ਇੱਕ ਕਰਤਾਰ, ਜੜ੍ਹ ਤੱਕ ਜਾਂਦਾ ਹੈ: ਜੇ ਸਭ ਵਿੱਚ ਇੱਕੋ ਜੋਤ ਹੈ, ਤਾਂ ਉਹ ਕੋਈ ਨਹੀਂ। ਲਵਿੰਗ-ਕਾਈਂਡਨੈੱਸ ਅਭਿਆਸ ਉੱਤੇ ਖੋਜ ਵਿੱਚ ਪਾਇਆ ਗਿਆ ਕਿ ਕੁਝ ਹਫ਼ਤੇ ਦੂਜਿਆਂ ਦੇ ਭਲੇ ਦੀ ਕਾਮਨਾ ਕਰਨ ਵਾਲੇ ਲੋਕ ਵੱਧ ਜੁੜਾਅ ਅਤੇ ਸਕਾਰਾਤਮਕਤਾ ਮਹਿਸੂਸ ਕਰਦੇ ਸਨ (ਫ਼੍ਰੈਡਰਿਕਸਨ, 2008)। ਅਸਲ ਮਿਸਾਲ: ਪਾਰਕਿੰਗ ਉੱਤੇ ਜਿਸ ਗੁਆਂਢੀ ਨਾਲ ਝਗੜਾ ਹੋਇਆ, ਉਹ ਵੀ ਕਿਸੇ ਦਾ ਪਿਤਾ ਹੈ, ਅਤੇ ਦਰਦ ਹਰ ਚਿਹਰੇ ਉੱਤੇ ਇੱਕੋ ਜਿਹਾ ਦਿਸਦਾ ਹੈ।"}, "mind1": {"ti": "ਪਹਿਲਾਂ ਮਨ ਨੂੰ ਜਿੱਤੋ", "s": "ਰਾਤ ਦੇ ਗਿਆਰਾਂ ਵੱਜੇ ਹਨ। ਬੱਸ ਪੰਜ ਮਿੰਟ ਰੀਲਾਂ, ਤੁਸੀਂ ਆਪਣੇ ਆਪ ਨੂੰ ਕਹਿੰਦੇ ਹੋ। ਸਿਰ ਚੁੱਕਦੇ ਹੋ ਤਾਂ ਰਾਤ ਦਾ ਇਕ ਵੱਜ ਚੁੱਕਾ ਹੈ। ਅਲਾਰਮ ਸਵੇਰੇ ਛੇ ਵਜੇ ਦਾ ਹੈ।", "m": "ਸਭ ਨੂੰ ਆਪਣੀ ਹੀ ਜਮਾਤ ਦਾ ਸਮਝੋ। ਆਪਣੇ ਮਨ ਨੂੰ ਜਿੱਤ ਲਓ, ਤਾਂ ਜੱਗ ਜਿੱਤ ਲਿਆ।", "k": "ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਸੁਲਤਾਨਪੁਰ ਰਹਿੰਦੇ ਸਨ, ਤਾਂ ਉੱਥੋਂ ਦੇ ਨਵਾਬ ਦੌਲਤ ਖ਼ਾਨ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮਸੀਤ ਵਿਚ ਨਮਾਜ਼ ਵਿਚ ਸ਼ਾਮਲ ਹੋਣ ਲਈ ਸੱਦਿਆ। ਗੁਰੂ ਨਾਨਕ ਨਾਲ ਗਏ, ਪਰ ਜਦੋਂ ਬਾਕੀ ਸਾਰੇ ਨਮਾਜ਼ ਪੜ੍ਹ ਰਹੇ ਸਨ, ਉਹ ਚੁੱਪ ਚਾਪ ਖੜ੍ਹੇ ਰਹੇ। ਬਾਅਦ ਵਿਚ ਨਵਾਬ ਤੇ ਕਾਜ਼ੀ ਨੇ ਪੁੱਛਿਆ ਕਿ ਉਹ ਸ਼ਾਮਲ ਕਿਉਂ ਨਹੀਂ ਹੋਏ। ਜਨਮਸਾਖੀਆਂ ਉਨ੍ਹਾਂ ਦਾ ਜਵਾਬ ਦੱਸਦੀਆਂ ਹਨ। ਨਵਾਬ ਦਾ ਸਰੀਰ ਤਾਂ ਝੁਕ ਰਿਹਾ ਸੀ, ਪਰ ਉਸ ਦਾ ਮਨ ਦੂਰ ਕਾਬਲ ਵਿਚ ਘੋੜੇ ਖ਼ਰੀਦ ਰਿਹਾ ਸੀ। ਤੇ ਕਾਜ਼ੀ ਦਾ ਮਨ ਘਰ ਸੀ, ਇਸ ਫ਼ਿਕਰ ਵਿਚ ਕਿ ਕਿਤੇ ਉਸ ਦੀ ਨਵੀਂ ਜੰਮੀ ਵਛੇਰੀ ਖੂਹ ਵਿਚ ਨਾ ਡਿੱਗ ਪਵੇ। ਤਾਂ ਉਹ ਕਿਸ ਨਾਲ ਨਮਾਜ਼ ਪੜ੍ਹਦੇ? ਦੋਵੇਂ ਇਕ ਪਲ ਚੁੱਪ ਰਹੇ, ਫਿਰ ਮੰਨ ਗਏ ਕਿ ਇਹ ਸੱਚ ਹੈ।", "a": "ਉਸ ਸਮੇਂ ਦੇ ਜੋਗੀ ਬਾਹਰਲੀ ਦੁਨੀਆ ਜਿੱਤਣ ਲਈ ਘਰ ਛੱਡ ਦਿੰਦੇ ਸਨ। ਗੁਰੂ ਨਾਨਕ ਅੰਦਰ ਵੱਲ ਇਸ਼ਾਰਾ ਕਰਦੇ ਹਨ। ਆਪਣੇ ਮਨ ਨੂੰ ਜਿੱਤ ਲਓ, ਤਾਂ ਜੱਗ ਜਿੱਤ ਲਿਆ। ਸੁਲਤਾਨਪੁਰ ਦੀ ਸਾਖੀ ਵਿਖਾਉਂਦੀ ਹੈ ਕਿ ਮਨ ਕਿੰਨੀ ਸੌਖ ਨਾਲ ਤਿਲਕ ਜਾਂਦਾ ਹੈ। ਨਵਾਬ ਤੇ ਕਾਜ਼ੀ ਇਕ ਪਵਿੱਤਰ ਕੰਮ ਕਰ ਰਹੇ ਸਨ, ਫਿਰ ਵੀ ਉਨ੍ਹਾਂ ਦਾ ਮਨ ਘੋੜਿਆਂ ਤੇ ਵਛੇਰੀਆਂ ਉੱਤੇ ਸੀ। ਸਾਡਾ ਮਨ ਰੀਲਾਂ ਨਾਲ ਇਹੀ ਕਰਦਾ ਹੈ। ਤੁਸੀਂ ਕੱਲ੍ਹ ਰਾਤ ਦੋ ਘੰਟੇ ਗੁਆਉਣ ਦਾ ਫ਼ੈਸਲਾ ਨਹੀਂ ਕੀਤਾ ਸੀ। ਮਨ ਦੇ ਕਿਸੇ ਹਿੱਸੇ ਨੇ ਤੁਹਾਡੇ ਲਈ ਫ਼ੈਸਲਾ ਕਰ ਲਿਆ, ਇਕ ਇਕ ਸਵਾਈਪ ਕਰਕੇ। ਸਾਡੀਆਂ ਰੋਜ਼ ਦੀਆਂ ਬਹੁਤੀਆਂ ਲੜਾਈਆਂ ਇਉਂ ਹੀ ਹਨ। ਉਹ ਦੁਨੀਆ ਨਾਲ ਨਹੀਂ, ਆਪਣੇ ਹੀ ਧਿਆਨ ਨਾਲ ਹਨ। ਜੋ ਮਨ ਨੂੰ ਰਾਹ ਵਿਖਾ ਸਕਦਾ ਹੈ, ਉਸ ਨੇ ਸਭ ਤੋਂ ਔਖਾ ਕੰਮ ਕਰ ਲਿਆ, ਤੇ ਉਸ ਤੋਂ ਬਾਅਦ ਬਾਹਰ ਦਾ ਸਭ ਕੁਝ ਸੌਖਾ ਹੋ ਜਾਂਦਾ ਹੈ।", "b": "ਡੈਨੀਅਲ ਕਾਹਨਮੈਨ ਆਪਣੀ ਕਿਤਾਬ, ਥਿੰਕਿੰਗ ਫ਼ਾਸਟ ਐਂਡ ਸਲੋ, ਵਿਚ ਮਨ ਦੇ ਕੰਮ ਕਰਨ ਦੇ ਦੋ ਤਰੀਕੇ ਦੱਸਦੇ ਹਨ। ਇਕ ਤੇਜ਼ ਤੇ ਆਪਣੇ ਆਪ ਚੱਲਣ ਵਾਲਾ ਹੈ, ਜਿਵੇਂ ਸਵਾਈਪ ਕਰਨਾ। ਦੂਜਾ ਹੌਲਾ ਤੇ ਸੋਚ ਸਮਝ ਕੇ ਚੱਲਣ ਵਾਲਾ ਹੈ, ਜਿਵੇਂ ਹਿਸਾਬ ਲਾਉਣਾ। ਬਹੁਤ ਸਾਰੀਆਂ ਗ਼ਲਤੀਆਂ ਇਸ ਲਈ ਹੁੰਦੀਆਂ ਹਨ ਕਿ ਤੇਜ਼ ਵਾਲਾ ਕੰਮ ਕਰ ਜਾਂਦਾ ਹੈ, ਤੇ ਹੌਲਾ ਵਾਲਾ ਬਾਅਦ ਵਿਚ ਜਾਗਦਾ ਹੈ। ਇਸ ਲਈ ਅੱਧੀ ਰਾਤ ਨੂੰ, ਜਦੋਂ ਤੁਸੀਂ ਥੱਕੇ ਹੋਵੋ, ਇੱਛਾ ਸ਼ਕਤੀ ਦੇ ਭਰੋਸੇ ਨਾ ਰਹੋ। ਮਾਹੌਲ ਬਦਲ ਦਿਓ। ਫ਼ੋਨ ਦੂਜੇ ਕਮਰੇ ਵਿਚ ਚਾਰਜ ਕਰੋ, ਤੇ ਸਿਰਹਾਣੇ ਕੋਲ ਇਕ ਕਿਤਾਬ ਰੱਖੋ। ਜੋ ਹਲਵਾਈ ਪਰਹੇਜ਼ ਉੱਤੇ ਹੈ, ਉਹ ਜਲੇਬੀਆਂ ਕੋਲ ਨਹੀਂ ਬੈਠਦਾ। ਚੰਗੀ ਚੋਣ ਨੂੰ ਸੌਖੀ ਚੋਣ ਬਣਾ ਦਿਓ। ਤੇ ਜਦੋਂ ਮਨ ਭਟਕੇ, ਤਾਂ ਉਸ ਨੂੰ ਝਿੜਕੋ ਨਾ। ਬੱਸ ਧਿਆਨ ਦਿਓ, ਤੇ ਪਿਆਰ ਨਾਲ ਮੋੜ ਲਿਆਓ, ਵਾਰ ਵਾਰ। ਇਹੀ ਅਭਿਆਸ ਹੈ।", "t": "ਅੱਜ ਰਾਤ ਫ਼ੋਨ ਬੈੱਡਰੂਮ ਤੋਂ ਬਾਹਰ ਚਾਰਜ ਕਰੋ।", "q": "ਪੇਪਰ ਪੰਜ ਦਿਨਾਂ ਵਿੱਚ ਹੈ। ਹਰ ਵਾਰ ਪੜ੍ਹਨ ਬੈਠਦੇ ਹੋ, ਬੱਸ ਇੱਕ ਵਾਰ ਫ਼ੋਨ ਵੇਖਦੇ ਹੋ ਅਤੇ ਇੱਕ ਘੰਟਾ ਚਲਾ ਜਾਂਦਾ ਹੈ। ਅਸਲ ਵਿੱਚ ਕੀ ਕੰਮ ਕਰੇਗਾ?", "o": ["ਫ਼ੋਨ ਦੂਜੇ ਕਮਰੇ ਵਿੱਚ, ਪੰਜਾਹ ਮਿੰਟ ਪੜ੍ਹਾਈ ਅਤੇ ਦਸ ਮਿੰਟ ਬ੍ਰੇਕ ਦੇ ਹਿੱਸੇ", "ਸਾਰੀਆਂ ਐਪਾਂ ਹਮੇਸ਼ਾ ਲਈ ਮਿਟਾ ਦੇਣਾ", "ਇਸ ਵਾਰ ਇੱਛਾ-ਸ਼ਕਤੀ ਨਾਲ ਕੰਮ ਲੈਣ ਦਾ ਵਾਅਦਾ"], "y": "ਹਾਂ। ਦੂਰੀ ਇੱਛਾ-ਸ਼ਕਤੀ ਤੋਂ ਜਿੱਤਦੀ ਹੈ। ਫ਼ੋਨ ਪਹੁੰਚ ਤੋਂ ਬਾਹਰ ਹੋਵੇ, ਤਾਂ ਤਲਬ ਲੰਘ ਜਾਂਦੀ ਹੈ, ਅਤੇ ਮਿੱਥੇ ਛੋਟੇ ਬ੍ਰੇਕ ਧਿਆਨ ਨੂੰ ਟਿਕਾਊ ਬਣਾਉਂਦੇ ਹਨ।", "n": "ਇੱਛਾ-ਸ਼ਕਤੀ ਕਾਫ਼ੀ ਲੱਗਦੀ ਹੈ, ਪਰ ਕੋਲ ਪਏ ਫ਼ੋਨ ਤੋਂ ਅਕਸਰ ਹਾਰ ਜਾਂਦੀ ਹੈ। ਸਭ ਹਮੇਸ਼ਾ ਲਈ ਮਿਟਾਉਣਾ ਕੁਝ ਦਿਨਾਂ ਵਿੱਚ ਉਲਟਾ ਪੈਂਦਾ ਹੈ। ਫ਼ੋਨ ਤੋਂ ਦੂਰੀ ਬਣਾਓ, ਅਤੇ ਛੋਟੇ ਬ੍ਰੇਕ ਮਿੱਥੋ।", "d": "ਸੁਲਤਾਨਪੁਰ ਵਿੱਚ ਨਵਾਬ ਅਤੇ ਕਾਜ਼ੀ ਨੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਤੋਂ ਪੁੱਛਿਆ ਕਿ ਨਮਾਜ਼ ਵੇਲੇ ਤੁਸੀਂ ਚੁੱਪ ਕਿਉਂ ਖੜ੍ਹੇ ਰਹੇ। ਉਨ੍ਹਾਂ ਕਿਹਾ, ਤੁਹਾਡੇ ਸਰੀਰ ਝੁਕ ਰਹੇ ਸਨ, ਪਰ ਇੱਕ ਦਾ ਮਨ ਕਾਬੁਲ ਵਿੱਚ ਘੋੜੇ ਖ਼ਰੀਦ ਰਿਹਾ ਸੀ ਅਤੇ ਦੂਜੇ ਦਾ ਖੂਹ ਕੋਲ ਵਛੇਰੀ ਦੀ ਚਿੰਤਾ ਵਿੱਚ ਸੀ। ਧਿਆਨ ਬਿਨਾਂ ਇਬਾਦਤ ਬੱਸ ਹਰਕਤ ਹੈ। ਮਨ ਇੰਨਾ ਬੇਚੈਨ ਕਿਉਂ ਹੈ? ਹਾਰਵਰਡ ਦੇ ਕਿਲਿੰਗਸਵਰਥ ਅਤੇ ਗਿਲਬਰਟ ਨੇ ਫ਼ੋਨ ਐਪ ਰਾਹੀਂ ਹਜ਼ਾਰਾਂ ਲੋਕਾਂ ਦਾ ਹਾਲ ਪੁੱਛਿਆ (2010)। ਲਗਭਗ ਅੱਧੇ ਸਮੇਂ ਉਨ੍ਹਾਂ ਦਾ ਮਨ ਭਟਕ ਰਿਹਾ ਸੀ, ਅਤੇ ਭਟਕਦੇ ਸਮੇਂ ਉਹ ਘੱਟ ਖ਼ੁਸ਼ ਸਨ। ਭਗਵਦ ਗੀਤਾ ਕਹਿੰਦੀ ਹੈ ਮਨ ਹਵਾ ਜਿੰਨਾ ਫੜਨਾ ਔਖਾ ਹੈ। ਦੋਹਾਂ ਦਾ ਜਵਾਬ ਇੱਕ: ਅਭਿਆਸ। ਜਪੁਜੀ ਸਾਹਿਬ ਕਹਿੰਦਾ ਹੈ: ਮਨਿ ਜੀਤੈ ਜਗੁ ਜੀਤੁ। ਅਸਲ ਮਿਸਾਲ: ਤੁਸੀਂ ਪਰਿਵਾਰ ਨਾਲ ਖਾਣੇ ਉੱਤੇ ਬੈਠੇ ਹੋ, ਪਰ ਅੰਗੂਠਾ ਸਕਰੋਲ ਕਰ ਰਿਹਾ ਹੈ। ਤੁਸੀਂ ਉੱਥੇ ਸੀ, ਫਿਰ ਵੀ ਖੁੰਝ ਗਏ।"}, "nature1": {"ti": "ਹਵਾ, ਪਾਣੀ, ਧਰਤੀ", "s": "ਤੁਸੀਂ ਹਰ ਰੋਜ਼ ਲਗਭਗ ਵੀਹ ਹਜ਼ਾਰ ਸਾਹ ਲੈਂਦੇ ਹੋ। ਅੱਜ ਉਨ੍ਹਾਂ ਵਿਚੋਂ ਕਿੰਨਿਆਂ ਵੱਲ ਤੁਹਾਡਾ ਧਿਆਨ ਗਿਆ?", "m": "ਹਵਾ ਗੁਰੂ ਹੈ, ਪਾਣੀ ਪਿਤਾ ਹੈ, ਤੇ ਵੱਡੀ ਧਰਤੀ ਮਾਤਾ ਹੈ।", "k": "ਪੂਰਬ ਦੀ ਯਾਤਰਾ ਵਿਚ ਗੁਰੂ ਨਾਨਕ ਪੁਰੀ ਦੇ ਜਗਨਨਾਥ ਮੰਦਰ ਪਹੁੰਚੇ। ਸ਼ਾਮ ਨੂੰ ਪੁਜਾਰੀ ਆਰਤੀ ਕਰ ਰਹੇ ਸਨ, ਦੀਵਿਆਂ, ਫੁੱਲਾਂ ਤੇ ਧੂਫ਼ ਵਾਲਾ ਥਾਲ ਘੁਮਾਉਂਦੇ ਹੋਏ। ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਵੀ ਸ਼ਾਮਲ ਹੋਣ ਲਈ ਸੱਦਿਆ। ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਗੁਰੂ ਜੀ ਖੁੱਲ੍ਹੇ ਅਸਮਾਨ ਹੇਠ ਨਿਕਲ ਆਏ, ਤੇ ਇਕ ਸ਼ਬਦ ਗਾਇਆ ਜੋ ਅੱਜ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਵਿਚ ਹੈ। ਉਸ ਵਿਚ ਸਾਰਾ ਅਸਮਾਨ ਥਾਲ ਬਣ ਜਾਂਦਾ ਹੈ। ਸੂਰਜ ਤੇ ਚੰਦ ਉਸ ਦੇ ਦੀਵੇ ਹਨ, ਤੇ ਤਾਰੇ ਖਿੱਲਰੇ ਹੋਏ ਮੋਤੀ। ਹਵਾ ਧੂਫ਼ ਹੈ, ਤੇ ਹਰ ਜੰਗਲ ਆਪਣੇ ਫੁੱਲ ਭੇਟ ਕਰ ਰਿਹਾ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਗਾਇਆ ਕਿ ਸਾਰੀ ਕੁਦਰਤ ਪਹਿਲਾਂ ਤੋਂ ਹੀ ਆਰਤੀ ਕਰ ਰਹੀ ਹੈ।", "a": "ਜਪੁਜੀ ਸਾਹਿਬ ਦਾ ਅੰਤ ਕੁਦਰਤ ਨੂੰ ਸਾਡਾ ਆਪਣਾ ਪਰਿਵਾਰ ਕਹਿ ਕੇ ਹੁੰਦਾ ਹੈ। ਹਵਾ ਗੁਰੂ ਹੈ: ਉਹ ਹਰ ਸਾਹ ਨਾਲ ਜੀਵਨ ਦਿੰਦੀ ਹੈ ਤੇ ਕੁਝ ਨਹੀਂ ਮੰਗਦੀ। ਪਾਣੀ ਪਿਤਾ ਵਰਗਾ ਹੈ। ਵੱਡੀ ਧਰਤੀ ਮਾਂ ਵਾਂਗ ਸਭ ਨੂੰ ਖੁਆਉਂਦੀ ਹੈ। ਪੁਰੀ ਵਿਚ ਗੁਰੂ ਨਾਨਕ ਨੇ ਇਹੀ ਸੱਚ ਬ੍ਰਹਿਮੰਡ ਜਿੰਨਾ ਵੱਡਾ ਵੇਖਿਆ। ਜਦੋਂ ਸਾਰਾ ਬ੍ਰਹਿਮੰਡ ਪਹਿਲਾਂ ਤੋਂ ਆਰਤੀ ਗਾ ਰਿਹਾ ਹੈ, ਤਾਂ ਇਕ ਛੋਟੀ ਆਰਤੀ ਕਿਉਂ? ਅਸੀਂ ਸਾਮਾਨ ਲਿਆਉਣ ਵਾਲੇ ਤੇ ਰੋਟੀ ਬਣਾਉਣ ਵਾਲੇ ਦਾ ਧੰਨਵਾਦ ਕਰਦੇ ਹਾਂ। ਹਵਾ, ਟੂਟੀ ਦੇ ਪਾਣੀ, ਜਾਂ ਉਸ ਮਿੱਟੀ ਬਾਰੇ ਅਸੀਂ ਸ਼ਾਇਦ ਹੀ ਸੋਚਦੇ ਹਾਂ ਜਿਸ ਵਿਚ ਸਾਡਾ ਅੰਨ ਉੱਗਿਆ। ਉਹ ਹਰ ਪਲ ਸਾਡੇ ਲਈ ਕੰਮ ਕਰਦੇ ਹਨ ਤੇ ਕਦੇ ਬਿੱਲ ਨਹੀਂ ਭੇਜਦੇ। ਜੇ ਇਹ ਪਰਿਵਾਰ ਹੈ, ਤਾਂ ਇਸ ਨੂੰ ਪਰਿਵਾਰ ਵਾਲੀ ਸੰਭਾਲ ਮਿਲਣੀ ਚਾਹੀਦੀ ਹੈ: ਬਰਬਾਦ ਨਾ ਕਰਨਾ, ਗੰਦਾ ਨਾ ਕਰਨਾ, ਤੇ ਕਦੇ ਕਦੇ ਬੱਸ ਧੰਨਵਾਦ ਕਹਿਣਾ।", "b": "ਇੱਥੇ ਇਕ ਦੂਜੀ ਦਾਤ ਵੀ ਹੈ। ਜੋ ਲੋਕ ਥੋੜ੍ਹਾ ਜਿਹਾ ਸਮਾਂ ਵੀ ਕੁਦਰਤ ਨੂੰ ਵੇਖਣ ਵਿਚ ਲਾਉਂਦੇ ਹਨ, ਉਹ ਅਕਸਰ ਵੱਧ ਸ਼ਾਂਤ ਮਹਿਸੂਸ ਕਰਦੇ ਹਨ, ਤੇ ਆਪਣੀਆਂ ਪਰੇਸ਼ਾਨੀਆਂ ਵਿਚ ਘੱਟ ਫਸੇ ਰਹਿੰਦੇ ਹਨ। ਸ਼ਾਮ ਦੇ ਖੁੱਲ੍ਹੇ ਅਸਮਾਨ ਹੇਠ ਖੜ੍ਹੇ ਹੋਵੋ, ਤੁਹਾਡਾ ਵੱਡਾ ਫ਼ਿਕਰ ਥੋੜ੍ਹਾ ਛੋਟਾ ਲੱਗਣ ਲੱਗ ਪੈਂਦਾ ਹੈ। ਇਸ ਲਈ ਨਹੀਂ ਕਿ ਫ਼ਿਕਰ ਚਲਾ ਗਿਆ, ਸਗੋਂ ਇਸ ਲਈ ਕਿ ਤੁਹਾਨੂੰ ਯਾਦ ਆਇਆ ਕਿ ਦੁਨੀਆ ਕਿੰਨੀ ਵੱਡੀ ਹੈ। ਖੋਜੀ ਇਸ ਅਹਿਸਾਸ ਨੂੰ ਵਿਸਮਾਦ ਕਹਿੰਦੇ ਹਨ, ਤੇ ਉਨ੍ਹਾਂ ਨੇ ਵੇਖਿਆ ਹੈ ਕਿ ਇਹ ਆਪਣੇ ਬਾਰੇ ਮਨ ਦੀ ਲਗਾਤਾਰ ਬੁੜਬੁੜ ਨੂੰ ਸ਼ਾਂਤ ਕਰ ਸਕਦਾ ਹੈ। ਜਪੁਜੀ ਸਾਹਿਬ ਵਿਚ ਇਕ ਹੋਰ ਥਾਂ ਗੁਰੂ ਨਾਨਕ ਕੁਦਰਤ ਨੂੰ ਵੇਖ ਕੇ ਕਹਿੰਦੇ ਹਨ ਕਿ ਉਹ ਇਸ ਦਾ ਬਿਆਨ ਸ਼ੁਰੂ ਵੀ ਨਹੀਂ ਕਰ ਸਕਦੇ। ਹੈਰਾਨੀ ਮਨ ਲਈ ਇਕ ਤਰ੍ਹਾਂ ਦਾ ਆਰਾਮ ਹੈ। ਤੇ ਇਹ ਮੁਫ਼ਤ ਹੈ, ਹਰ ਇਕ ਸ਼ਾਮ।", "t": "ਅੱਜ ਦੋ ਮਿੰਟ ਬਿਨਾਂ ਫ਼ੋਨ ਬਾਹਰ ਜਾਓ। ਇੱਕ ਰੁੱਖ ਨੂੰ ਵੇਖੋ।", "q": "ਪਰਿਵਾਰ ਨਾਲ ਡਰਾਈਵ ਉੱਤੇ ਪਾਪਾ ਚਿਪਸ ਦਾ ਪੈਕਟ ਮੁਕਾ ਕੇ ਖਿੜਕੀ ਵਿੱਚੋਂ ਸੁੱਟਣ ਲੱਗੇ ਹਨ। ਕਹਿੰਦੇ ਹਨ, ਸਾਰੇ ਸੁੱਟਦੇ ਹਨ। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਕੁਝ ਨਾ ਕਹਿਣਾ; ਉਹ ਪਿਤਾ ਹਨ", "ਮੁਸਕਰਾ ਕੇ ਹੱਥ ਵਧਾਉਣਾ ਅਤੇ ਕਹਿਣਾ: ਮੈਨੂੰ ਦਿਓ, ਮੈਂ ਬੈਗ ਵਿੱਚ ਰੱਖ ਦਿੰਦਾ ਹਾਂ", "ਸਭ ਦੇ ਸਾਹਮਣੇ ਉਨ੍ਹਾਂ ਨੂੰ ਪ੍ਰਦੂਸ਼ਣ ਉੱਤੇ ਭਾਸ਼ਣ ਦੇਣਾ"], "y": "ਬਹੁਤ ਸੋਹਣਾ। ਨਾ ਸ਼ਰਮ, ਨਾ ਝਗੜਾ, ਅਤੇ ਪੈਕਟ ਬੈਗ ਵਿੱਚ। ਮੁਸਕਾਨ ਨਾਲ ਕੀਤੇ ਛੋਟੇ ਕੰਮ ਪਰਿਵਾਰ ਦੀਆਂ ਆਦਤਾਂ ਭਾਸ਼ਣਾਂ ਨਾਲੋਂ ਵੱਧ ਬਦਲਦੇ ਹਨ।", "n": "ਵੱਡਿਆਂ ਦਾ ਸਤਿਕਾਰ ਜ਼ਰੂਰੀ ਹੈ, ਅਤੇ ਧਰਤੀ ਦਾ ਖ਼ਿਆਲ ਵੀ। ਚੁੱਪ ਨਾਲ ਆਦਤ ਚੱਲਦੀ ਰਹਿੰਦੀ ਹੈ, ਅਤੇ ਭਾਸ਼ਣ ਨਾਲ ਉਹ ਬਚਾਅ ਵਿੱਚ ਆ ਜਾਂਦੇ ਹਨ। ਮੁਸਕਾਨ ਅਤੇ ਖੁੱਲ੍ਹਾ ਹੱਥ ਦੋ ਸਕਿੰਟਾਂ ਵਿੱਚ ਗੱਲ ਸੁਲਝਾ ਦਿੰਦੇ ਹਨ।", "d": "ਪੁਰੀ ਦੇ ਜਗਨਨਾਥ ਮੰਦਰ ਵਿੱਚ ਪੁਜਾਰੀ ਦੀਵਿਆਂ ਦੇ ਥਾਲ ਨਾਲ ਆਰਤੀ ਕਰ ਰਹੇ ਸਨ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਖੁੱਲ੍ਹੇ ਅਸਮਾਨ ਹੇਠ ਆਏ ਅਤੇ ਗਾਇਆ ਕਿ ਸਾਰਾ ਅਕਾਸ਼ ਥਾਲ ਹੈ, ਸੂਰਜ-ਚੰਨ ਦੀਵੇ, ਤਾਰੇ ਮੋਤੀ, ਅਤੇ ਹਵਾ ਧੂਪ। ਸਾਰੀ ਕੁਦਰਤ ਪਹਿਲਾਂ ਹੀ ਆਰਤੀ ਕਰ ਰਹੀ ਹੈ। ਬਾਹਰ ਸਾਨੂੰ ਇੰਨਾ ਸਕੂਨ ਕਿਉਂ ਮਿਲਦਾ ਹੈ? ਜੀਵ-ਵਿਗਿਆਨੀ ਈ. ਓ. ਵਿਲਸਨ ਨੇ ਇਸ ਨੂੰ ਬਾਇਓਫ਼ੀਲੀਆ ਕਿਹਾ (1984): ਜਿਊਂਦੀਆਂ ਚੀਜ਼ਾਂ ਨਾਲ ਜਮਾਂਦਰੂ ਪਿਆਰ। ਰੇਚਲ ਅਤੇ ਸਟੀਫ਼ਨ ਕੈਪਲਨ ਦੀ ਅਟੈਂ ਛਲੇ ਮਹੀਨੇ ਤੁਸੀਂ ਆਪਣੇ ਛੋਟੇ ਭਰਾ ਨੂੰ ਕੁਝ ਬਹੁਤ ਕੌੜਾ ਕਹਿ ਦਿੱਤਾ ਸੀ। ਉਹ ਹੱਸ ਕੇ ਟਾਲ ਗਿਆ, ਪਰ ਤੁਸੀਂ ਉਸ ਦਾ ਚਿਹਰਾ ਵੇਖਿਆ ਸੀ। ਤੁਸੀਂ ਰਾਤ ਨੂੰ ਅਜੇ ਵੀ ਉਸ ਬਾਰੇ ਸੋਚਦੇ ਹੋ, ਤੇ ਸਮਝ ਨਹੀਂ ਆਉਂਦਾ ਕਿ ਗੱਲ ਕਿਵੇਂ ਛੇੜੀਏ।", "m": "ਜਦੋਂ ਮਨ ਮਾੜੇ ਕੰਮਾਂ ਨਾਲ ਮੈਲਾ ਹੋ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਉਹ ਨਾਮ ਦੇ ਪਿਆਰ ਨਾਲ ਧੁਲ ਕੇ ਸਾਫ਼ ਹੁੰਦਾ ਹੈ।", "k": "ਤੁਲੰਬੇ ਨੇੜੇ ਸੱਜਣ ਰਹਿੰਦਾ ਸੀ, ਜੋ ਮੁਸਾਫ਼ਰਾਂ ਲਈ ਇਕ ਸਰਾਂ ਚਲਾਉਂਦਾ ਸੀ। ਬਾਹਰੋਂ ਉਹ ਨਿੱਘ ਨਾਲ ਸਵਾਗਤ ਕਰਨ ਵਾਲਾ ਸੀ। ਪਰ ਉਸ ਦੇ ਪਿੱਛੇ, ਜਨਮਸਾਖੀ ਦੱਸਦੀ ਹੈ, ਉਹ ਉੱਥੇ ਸੌਣ ਵਾਲੇ ਮਹਿਮਾਨਾਂ ਨੂੰ ਲੁੱਟਦਾ ਤੇ ਨੁਕਸਾਨ ਪਹੁੰਚਾਉਂਦਾ ਸੀ। ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਤੇ ਭਾਈ ਮਰਦਾਨਾ ਉਸ ਦੀ ਸਰਾਂ ਵਿਚ ਰੁਕੇ, ਤਾਂ ਸੱਜਣ ਨੇ ਉਨ੍ਹਾਂ ਦੀ ਚੰਗੀ ਸੇਵਾ ਕੀਤੀ, ਤੇ ਰਾਤ ਦੀ ਉਡੀਕ ਕਰਨ ਲੱਗਾ। ਸੌਣ ਤੋਂ ਪਹਿਲਾਂ ਗੁਰੂ ਜੀ ਨੇ ਗਾਉਣ ਦੀ ਇੱਛਾ ਜਤਾਈ, ਤੇ ਮਰਦਾਨੇ ਨੇ ਰਬਾਬ ਵਜਾਈ। ਸ਼ਬਦ ਅਜਿਹੀਆਂ ਚੀਜ਼ਾਂ ਬਾਰੇ ਸੀ ਜੋ ਬਾਹਰੋਂ ਚਮਕਦੀਆਂ ਤੇ ਸਾਫ਼ ਦਿਸਦੀਆਂ ਹਨ, ਪਰ ਅੰਦਰੋਂ ਕਾਲੀਆਂ ਰਹਿੰਦੀਆਂ ਹਨ। ਸੱਜਣ ਨੇ ਸੁਣਿਆ, ਤੇ ਉਸ ਨੂੰ ਆਪਣਾ ਚਿਹਰਾ ਦਿਸ ਪਿਆ। ਉਹ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਡਿੱਗ ਪਿਆ ਤੇ ਸਭ ਕੁਝ ਮੰਨ ਲਿਆ। ਗੁਰੂ ਨਾਨਕ ਨੇ ਕਿਹਾ ਕਿ ਜੋ ਕੁਝ ਗ਼ਲਤ ਤਰੀਕੇ ਨਾਲ ਲਿਆ ਹੈ ਉਹ ਮੋੜ ਦੇ, ਤੇ ਫਿਰ ਤੋਂ ਸ਼ੁਰੂ ਕਰ। ਸੱਜਣ ਨੇ ਇਹੀ ਕੀਤਾ। ਪਰੰਪਰਾ ਦੱਸਦੀ ਹੈ ਕਿ ਉਸ ਦੀ ਸਰਾਂ ਉਨ੍ਹਾਂ ਪਹਿਲੀਆਂ ਥਾਵਾਂ ਵਿਚੋਂ ਇਕ ਬਣੀ ਜਿੱਥੇ ਲੋਕ ਗੁਰੂ ਨਾਨਕ ਦੇ ਸ਼ਬਦ ਗਾਉਣ ਲਈ ਇਕੱਠੇ ਹੁੰਦੇ ਸਨ।", "a": "ਗੁਰੂ ਨਾਨਕ ਦੋਸ਼ੀ ਮਨ ਦੀ ਤੁਲਨਾ ਮੈਲੇ ਕੱਪੜਿਆਂ ਨਾਲ ਕਰਦੇ ਹਨ। ਰਾਹ ਦੀ ਧੂੜ ਨਾਲ ਮੈਲੇ ਕੱਪੜੇ ਪਾਣੀ ਤੇ ਸਾਬਣ ਨਾਲ ਧੁਲਦੇ ਹਨ। ਮਾੜੇ ਕੰਮਾਂ ਨਾਲ ਮੈਲਾ ਮਨ ਨਾਮ ਨਾਲ ਧੁਲਦਾ ਹੈ, ਯਾਨੀ ਉਸ ਇਕ ਦੇ ਪਿਆਰ ਤੇ ਯਾਦ ਨਾਲ। ਵੇਖੋ ਇਹ ਪੰਕਤੀ ਕੀ ਨਹੀਂ ਕਹਿੰਦੀ। ਇਹ ਨਹੀਂ ਕਹਿੰਦੀ ਕਿ ਤੁਸੀਂ ਸਦਾ ਲਈ ਮੈਲੇ ਹੋ। ਇਹ ਕਹਿੰਦੀ ਹੈ ਕਿ ਧੁਲਣਾ ਮੁਮਕਿਨ ਹੈ। ਸੱਜਣ ਨੇ ਸਾਡੇ ਵਿਚੋਂ ਬਹੁਤਿਆਂ ਨਾਲੋਂ ਕਿਤੇ ਮਾੜੇ ਕੰਮ ਕੀਤੇ ਸਨ, ਫਿਰ ਵੀ ਉਸ ਦੀ ਕਹਾਣੀ ਸਜ਼ਾ ਉੱਤੇ ਨਹੀਂ, ਇਕ ਨਵੀਂ ਸ਼ੁਰੂਆਤ ਉੱਤੇ ਮੁੱਕਦੀ ਹੈ। ਇਹ ਵੀ ਵੇਖੋ ਕਿ ਧੁਲਣ ਲਈ ਕੀ ਚਾਹੀਦਾ ਸੀ। ਉਸ ਨੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਸਾਫ਼ ਵੇਖਣਾ ਪਿਆ, ਮੰਨਣਾ ਪਿਆ, ਤੇ ਜੋ ਲਿਆ ਸੀ ਮੋੜਨਾ ਪਿਆ। ਠੀਕ ਵਰਤਿਆ ਜਾਵੇ ਤਾਂ ਪਛਤਾਵਾ ਉਸ ਦਾਗ਼ ਵਰਗਾ ਹੈ ਜੋ ਆਖ਼ਰ ਦਿਸ ਪਿਆ। ਇਹ ਸਾਫ਼ ਹੋਣ ਵੱਲ ਪਹਿਲਾ ਕਦਮ ਹੈ, ਕਹਾਣੀ ਦਾ ਅੰਤ ਨਹੀਂ।", "b": "ਮਨੋਵਿਗਿਆਨੀ ਪਛਤਾਵੇ ਤੇ ਸ਼ਰਮ ਵਿਚ ਫ਼ਰਕ ਕਰਦੇ ਹਨ। ਪਛਤਾਵਾ ਕਹਿੰਦਾ ਹੈ, ਮੈਂ ਇਕ ਮਾੜਾ ਕੰਮ ਕੀਤਾ। ਸ਼ਰਮ ਕਹਿੰਦੀ ਹੈ, ਮੈਂ ਹੀ ਮਾੜਾ ਹਾਂ। ਜੂਨ ਟੈਂਗਨੀ ਤੇ ਦੂਜੇ ਖੋਜੀਆਂ ਦਾ ਕੰਮ ਦੱਸਦਾ ਹੈ ਕਿ ਪਛਤਾਵਾ ਅਕਸਰ ਇਨਸਾਨ ਨੂੰ ਨੁਕਸਾਨ ਠੀਕ ਕਰਨ ਵੱਲ ਧੱਕਦਾ ਹੈ, ਜਦ ਕਿ ਸ਼ਰਮ ਉਸ ਨੂੰ ਲੁਕਣ, ਮੁੱਕਰਨ ਜਾਂ ਭੜਕਣ ਵੱਲ। ਇਸ ਲਈ ਕੰਮ ਦਾ ਸਵਾਲ ਇਹ ਨਹੀਂ ਉੱਤੇ ਸੱਚੀ ਖ਼ੁਸ਼ੀ ਦਿਖਾਓ, ਅਤੇ ਇੱਕ ਸਵਾਲ ਪੁੱਛੋ।", "q": "ਤੁਹਾਡੀ ਛੋਟੀ ਭੈਣ ਦੌੜਦੀ ਆਉਂਦੀ ਹੈ, ਦੱਸਣ ਕਿ ਸਕੂਲ ਮੁਕਾਬਲੇ ਵਿੱਚ ਦੂਜਾ ਇਨਾਮ ਮਿਲਿਆ। ਤੁਸੀਂ ਵਰਕ ਕਾਲ ਦੇ ਵਿਚਕਾਰ ਹੋ। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਵੀਹ ਸਕਿੰਟ ਕਾਲ ਮਿਊਟ ਕਰਕੇ, ਵੱਡੀ ਮੁਸਕਾਨ ਨਾਲ ਕਹਿਣਾ: ਕਾਲ ਤੋਂ ਬਾਅਦ ਸਭ ਦੱਸੀਂ!", "ਇਸ਼ਾਰੇ ਨਾਲ ਰੁਕਣ ਲਈ ਕਹਿਣਾ ਅਤੇ ਕਾਲ ਪੂਰੀ ਕਰਨਾ", "ਬਿਨਾਂ ਉੱਪਰ ਵੇਖੇ ਸ਼ਾਬਾਸ਼ ਕਹਿ ਦੇਣਾ"], "y": "ਬਹੁਤ ਸੋਹਣਾ। ਵੀਹ ਸਕਿੰਟ ਦੀ ਸੱਚੀ ਖ਼ੁਸ਼ੀ, ਅਤੇ ਅੱਗੇ ਸੁਣਨ ਦਾ ਵਾਅਦਾ। ਉਸ ਨੂੰ ਯਾਦ ਰਹੇਗਾ ਕਿ ਤੁਸੀਂ ਉਸ ਲਈ ਖ਼ੁਸ਼ ਸੀ।", "n": "ਤੁਸੀਂ ਰੁੱਝੇ ਸੀ, ਇਹ ਸੱਚ ਹੈ। ਪਰ ਬੱਚੇ ਦਾ ਮਾਣ ਦਾ ਪਲ ਛੇਤੀ ਲੰਘ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਠੰਢਾ ਜਵਾਬ ਸਿਖਾਉਂਦਾ ਹੈ ਕਿ ਉਸ ਦੀ ਖ਼ੁਸ਼ੀ ਤੁਹਾਡੇ ਲਈ ਮਾਇਨੇ ਨਹੀਂ ਰੱਖਦੀ। ਵੀਹ ਸਕਿੰਟ ਦਾ ਸੱਚਾ ਧਿਆਨ ਕਾਫ਼ੀ ਹੈ।", "d": "ਭਾਈ ਮਰਦਾਨਾ, ਮੁਸਲਮਾਨ ਰਬਾਬੀ ਅਤੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਬਚਪਨ ਦੇ ਦੋਸਤ, ਸਾਲਾਂ ਉਨ੍ਹਾਂ ਨਾਲ ਉਦਾਸੀਆਂ ਉੱਤੇ ਰਹੇ। ਜਦੋਂ ਨਵੀਂ ਬਾਣੀ ਆਉਂਦੀ, ਗੁਰੂ ਜੀ ਕਹਿੰਦੇ: ਮਰਦਾਨਿਆ, ਰਬਾਬ ਛੇੜ, ਬਾਣੀ ਆਈ ਹੈ। ਖ਼ੁਸ਼ੀ ਗੀਤ ਬਣ ਕੇ ਨਿਕਲਦੀ, ਅਤੇ ਰੁੱਖਾਂ ਹੇਠ, ਦਰਿਆਵਾਂ ਕੰਢੇ ਵੰਡੀ ਜਾਂਦੀ। ਵੰਡੀ ਹੋਈ ਖ਼ੁਸ਼ੀ ਕਿਉਂ ਵਧਦੀ ਹੈ? ਮਨੋਵਿਗਿਆਨੀ ਚੰਗੀ ਖ਼ਬਰ ਸਾਂਝੀ ਕਰਨ ਨੂੰ ਕੈਪੀਟਲਾਈਜ਼ੇਸ਼ਨ ਕਹਿੰਦੇ ਹਨ। ਸ਼ੈਲੀ ਗੇਬਲ ਅਤੇ ਸਾਥੀਆਂ ਨੇ ਪਾਇਆ (2004) ਕਿ ਜਦੋਂ ਕੋਈ ਸਾਡੀ ਚੰਗੀ ਖ਼ਬਰ ਉੱਤੇ ਸੱਚੇ ਉਤਸ਼ਾਹ ਨਾਲ ਜਵਾਬ ਦਿੰਦਾ ਹੈ, ਤਾਂ ਖ਼ੁਸ਼ੀ ਵਧਦੀ ਹੈ ਅਤੇ ਰਿਸ਼ਤਾ ਡੂੰਘਾ ਹੁੰਦਾ ਹੈ। ਠੰਢਾ ਜਿਹਾ ਚੰਗਾ ਹੈ, ਦੋਹਾਂ ਨੂੰ ਛੋਟਾ ਕਰਦਾ ਹੈ। ਗੁਰਬਾਣੀ ਦਾ ਸ਼ਬਦ ਵਿਗਾਸੁ, ਯਾਨੀ ਖਿੜਨਾ, ਅਜਿਹੇ ਹੀ ਖੁੱਲ੍ਹੇ ਦਿਲ ਨੂੰ ਦੱਸਦਾ ਹੈ। ਅਸਲ ਮਿਸਾਲ: ਜਦੋਂ ਦੋਸਤ ਨਵੀਂ ਨੌਕਰੀ ਦੀ ਖ਼ਬਰ ਦੇਣ ਫ਼ੋਨ ਕਰੇ, ਤਾਂ ਦੋ ਮਿੰਟ ਪੁੱਛਣਾ ਕਿ ਕਿਵੇਂ ਹੋਇਆ, ਉਸ ਲਈ ਕਿਸੇ ਤੋਹਫ਼ੇ ਨਾਲੋਂ ਵੱਧ ਹੈ।"}, "lonely1": {"ti": "ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਕੋਈ ਨਹੀਂ", "s": "ਤੁਸੀਂ ਕੰਮ ਲਈ ਇਕ ਨਵੇਂ ਸ਼ਹਿਰ ਆਏ ਹੋ। ਵੀਕਐਂਡ ਸਭ ਤੋਂ ਔਖੇ ਹੁੰਦੇ ਹਨ। ਔਨਲਾਈਨ ਹਰ ਕੋਈ ਦੋਸਤਾਂ ਨਾਲ ਦਿਸਦਾ ਹੈ, ਤੇ ਤੁਹਾਡਾ ਕਮਰਾ ਬਹੁਤ, ਬਹੁਤ ਸੁੰਨਾ ਲੱਗਦਾ ਹੈ।", "m": "ਸਾਰੇ ਜੀਆਂ ਦਾ ਇਕੋ ਦਾਤਾ ਹੈ। ਉਹ ਮੈਨੂੰ ਕਦੇ ਨਾ ਭੁੱਲੇ।", "k": "ਪੱਛਮ ਦੀ ਯਾਤਰਾ ਵਿਚ ਗੁਰੂ ਨਾਨਕ ਮੱਕੇ ਪਹੁੰਚੇ। ਸਫ਼ਰ ਤੋਂ ਥੱਕ ਕੇ ਉਹ ਆਰਾਮ ਕਰਨ ਲੇਟੇ, ਤੇ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰ ਸਬੱਬ ਨਾਲ ਕਾਬੇ ਵੱਲ ਹੋ ਗਏ। ਇਕ ਬੰਦੇ ਨੇ ਇਹ ਵੇਖਿਆ ਤੇ ਗੁੱਸੇ ਨਾਲ ਉਨ੍ਹਾਂ ਨੂੰ ਜਗਾਇਆ। ਤੂੰ ਖ਼ੁਦਾ ਦੇ ਘਰ ਵੱਲ ਪੈਰ ਕਰਨ ਦੀ ਹਿੰਮਤ ਕਿਵੇਂ ਕਰਦਾ ਹੈਂ, ਉਸ ਨੇ ਪੁੱਛਿਆ। ਗੁਰੂ ਨਾਨਕ ਨੇ ਨਰਮੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ: ਤਾਂ ਮੇਰੇ ਪੈਰ ਉਸ ਦਿਸ਼ਾ ਵੱਲ ਕਰ ਦੇ ਜਿੱਥੇ ਖ਼ੁਦਾ ਨਾ ਹੋਵੇ। ਭਾਈ ਗੁਰਦਾਸ, ਜਿਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਦੇ ਸਮੇਂ ਦੀਆਂ ਯਾਦਾਂ ਤਾਜ਼ੀਆਂ ਰਹਿੰਦਿਆਂ ਲਿਖਿਆ, ਆਪਣੀ ਪਹਿਲੀ ਵਾਰ ਵਿਚ ਇਹ ਕਹਾਣੀ ਦੱਸਦੇ ਹਨ। ਉਸ ਬੰਦੇ ਕੋਲ ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਸੀ। ਅਜਿਹੀ ਕੋਈ ਦਿਸ਼ਾ ਨਹੀਂ ਜਿੱਥੇ ਉਹ ਇਕ ਨਾ ਹੋਵੇ।", "a": "ਗੁਰੂ ਨਾਨਕ ਦੀ ਪੰਕਤੀ ਛੋਟੀ ਹੈ: ਸਾਰੇ ਜੀਆਂ ਦਾ ਇਕ ਦਾਤਾ ਹੈ, ਉਹ ਮੈਨੂੰ ਕਦੇ ਨਾ ਭੁੱਲੇ। ਹਰ ਕੋਈ ਉਸੇ ਦਾਤੇ ਦੇ ਸਹਾਰੇ ਹੈ। ਤੁਸੀਂ, ਤੁਹਾਡੇ ਆਲੇ ਦੁਆਲੇ ਸ਼ਹਿਰ ਦੇ ਲੋਕ, ਦੂਰ ਬੈਠਾ ਤੁਹਾਡਾ ਦੋਸਤ, ਬੱਸ ਵਿਚ ਬੈਠਾ ਅਜਨਬੀ ਵੀ। ਮੱਕੇ ਦੀ ਸਾਖੀ ਇਸ ਨੂੰ ਇਕ ਸਿੱਧੀ ਤਸਵੀਰ ਵਿਚ ਰੱਖ ਦਿੰਦੀ ਹੈ। ਕਿਸੇ ਵੀ ਦਿਸ਼ਾ ਵੱਲ ਮੁੜੋ, ਉਹ ਇਕ ਪਹਿਲਾਂ ਤੋਂ ਉੱਥੇ ਹੈ। ਇਕੱਲਾਪਣ ਅਕਸਰ ਕੰਨ ਵਿਚ ਕਹਿੰਦਾ ਹੈ ਕਿ ਅਸੀਂ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਹਾਂ, ਕਿ ਬਾਕੀ ਸਾਰੇ ਕਿਸੇ ਦੇ ਹਨ ਤੇ ਅਸੀਂ ਨਹੀਂ। ਇਹ ਪੰਕਤੀ ਉਸ ਘੁਸਰ ਮੁਸਰ ਦਾ ਜਵਾਬ ਹੈ। ਕੋਈ ਬਾਹਰ ਨਹੀਂ। ਇਸ ਨਾਲ ਖ਼ਾਲੀ ਕਮਰਾ ਉਸੇ ਵੇਲੇ ਨਹੀਂ ਭਰ ਜਾਂਦਾ। ਪਰ ਕਮਰਾ ਬਦਲ ਜਾਂਦਾ ਹੈ। ਤੁਸੀਂ ਉਸ ਵਿਚ ਛੱਡੇ ਹੋਏ ਨਹੀਂ। ਤੁਸੀਂ ਸਾਂਭੇ ਹੋਏ ਹੋ, ਤੇ ਅਗਲੀ ਦੋਸਤੀ ਓਨੀ ਦੂਰ ਨਹੀਂ ਜਿੰਨੀ ਲੱਗਦੀ ਹੈ।", "b": "ਇਕੱਲਾਪਣ ਬਹੁਤ ਆਮ ਹੈ, ਖ਼ਾਸ ਕਰਕੇ ਨਵੀਂ ਥਾਂ ਜਾਣ ਤੋਂ ਬਾਅਦ, ਤੇ ਇਹ ਤੁਹਾਡੇ ਬਾਰੇ ਕੁਝ ਮਾੜਾ ਨਹੀਂ ਕਹਿੰਦਾ। ਖੋਜੀ ਲੰਮੇ ਇਕੱਲੇਪਣ ਨੂੰ ਤਣਾਅ ਤੇ ਮਾੜੀ ਨੀਂਦ ਨਾਲ ਜੋੜਦੇ ਹਨ, ਇਸ ਲਈ ਉਸ ਦੀ ਪਿਆਰ ਨਾਲ ਸੰਭਾਲ ਜ਼ਰੂਰੀ ਹੈ। ਚੰਗੀ ਖ਼ਬਰ ਇਹ ਹੈ ਕਿ ਰਿਸ਼ਤੇ ਅਕਸਰ ਛੋਟੀਆਂ, ਵਾਰ ਵਾਰ ਦੀਆਂ ਮੁਲਾਕਾਤਾਂ ਨਾਲ ਵਧਦੇ ਹਨ, ਕਿਸੇ ਇਕ ਵੱਡੇ ਪਲ ਨਾਲ ਨਹੀਂ। ਹਰ ਸਵੇਰ ਉਸੇ ਚਾਹ ਵਾਲੇ ਦਾ ਹਾਲ ਚਾਲ ਪੁੱਛਣਾ। ਹਫ਼ਤੇ ਵਿਚ ਇਕ ਵਾਰ ਕੋਈ ਕਲਾਸ, ਜਾਂ ਐਤਵਾਰ ਗੁਰਦੁਆਰੇ ਦੇ ਲੰਗਰ ਵਿਚ ਸੇਵਾ, ਜਿੱਥੇ ਬਹੁਤ ਸਾਰੇ ਹੱਥ ਇਕੱਠੇ ਕੰਮ ਕਰਦੇ ਹਨ। ਕਿਸੇ ਪੁਰਾਣੇ ਦੋਸਤ ਨੂੰ ਪੰਜ ਮਿੰਟ ਦਾ ਫ਼ੋਨ। ਹਰ ਇਕ ਇਕ ਛੋਟਾ ਧਾਗਾ ਹੈ, ਤੇ ਧਾਗੇ ਮਿਲ ਕੇ ਰੱਸੀ ਬਣਦੇ ਹਨ। ਇਹ ਵੀ ਯਾਦ ਰੱਖੋ ਕਿ ਤੁਹਾਡੇ ਆਲੇ ਦੁਆਲੇ ਬਹੁਤ ਸਾਰੇ ਲੋਕ ਚੁੱਪ ਚਾਪ ਇਕੱਲੇ ਹਨ। ਹੋ ਸਕਦਾ ਹੈ ਤੁਹਾਡੇ ਹਾਲ ਚਾਲ ਪੁੱਛਣ ਦੀ ਹੀ ਉਹ ਉਡੀਕ ਕਰ ਰਹੇ ਹੋਣ।", "t": "ਇਸ ਹਫ਼ਤੇ ਇੱਕ ਥਾਂ ਚੁਣੋ ਜਿੱਥੇ ਦੋ ਵਾਰ ਜਾਓ, ਅਤੇ ਦੋਵੇਂ ਵਾਰ ਇੱਕ ਇਨਸਾਨ ਨਾਲ ਹਾਲ-ਚਾਲ ਪੁੱਛੋ।", "q": "ਤੁਹਾਨੂੰ ਨਵੇਂ ਸ਼ਹਿਰ ਆਇਆਂ ਤਿੰਨ ਮਹੀਨੇ ਹੋਏ। ਇੱਕ ਸਹਿਕਰਮੀ ਤੁਹਾਨੂੰ ਵੀਕਐਂਡ ਉੱਤੇ ਆਪਣੇ ਦੋਸਤਾਂ ਨਾਲ ਡਿਨਰ ਉੱਤੇ ਸੱਦਦੀ ਹੈ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਤੁਸੀਂ ਨਹੀਂ ਜਾਣਦੇ। ਤੁਹਾਨੂੰ ਝਿਜਕ ਹੈ। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?", "o": ["ਨਿਮਰਤਾ ਨਾਲ ਨਾਂਹ ਕਰਨਾ; ਜਦੋਂ ਲੋਕਾਂ ਨੂੰ ਵੱਧ ਜਾਣਾਂਗੇ ਤਦ ਜਾਵਾਂਗੇ", "ਜਾਣਾ, ਇੱਕ ਘੰਟਾ ਰੁਕਣਾ, ਅਤੇ ਦੋ ਲੋਕਾਂ ਨੂੰ ਇੱਕ-ਇੱਕ ਸਵਾਲ ਪੁੱਛਣਾ", "ਜਾਣਾ, ਪਰ ਫ਼ੋਨ ਵਿੱਚ ਲੱਗੇ ਰਹਿਣਾ ਤਾਂ ਜੋ ਅਜੀਬ ਨਾ ਲੱਗੇ"], "y": "ਚੰਗੀ ਚੋਣ। ਦੋਸਤੀਆਂ ਛੋਟੀ-ਛੋਟੀ ਵਾਰ-ਵਾਰ ਦੀ ਹਾਜ਼ਰੀ ਨਾਲ ਸ਼ੁਰੂ ਹੁੰਦੀਆਂ ਹਨ। ਇੱਕ ਘੰਟਾ ਅਤੇ ਦੋ ਸੱਚੇ ਸਵਾਲ ਸ਼ੁਰੂਆਤ ਲਈ ਕਾਫ਼ੀ ਹਨ।", "n": "ਝਿਜਕ ਕੁਦਰਤੀ ਹੈ। ਪਰ ਲੋਕਾਂ ਨੂੰ ਜਾ ਕੇ ਹੀ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ, ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਨਹੀਂ, ਅਤੇ ਫ਼ੋਨ ਤੁਹਾਨੂੰ ਕਮਰੇ ਵਿੱਚ ਅਦਿੱਖ ਕਰ ਦਿੰਦਾ ਹੈ। ਇੱਕ ਘੰਟਾ ਜਾਓ ਅਤੇ ਦੋ ਸਵਾਲ ਪੁੱਛੋ।", "d": "ਮੱਕੇ ਵਿੱਚ ਇੱਕ ਗੁੱਸੇ ਵਾਲੇ ਬੰਦੇ ਨੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੂੰ ਜਗਾਇਆ, ਕਿਉਂਕਿ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰ ਕਾਬੇ ਵੱਲ ਸਨ। ਗੁਰੂ ਜੀ ਨੇ ਨਰਮੀ ਨਾਲ ਕਿਹਾ: ਮੇਰੇ ਪੈਰ ਉਸ ਪਾਸੇ ਕਰ ਦਿਓ ਜਿੱਥੇ ਖ਼ੁਦਾ ਨਾ ਹੋਵੇ। ਭਾਈ ਗੁਰਦਾਸ ਜੀ ਆਪਣੀ ਪਹਿਲੀ ਵਾਰ ਵਿੱਚ ਇਹ ਲਿਖਦੇ ਹਨ। ਕੋਈ ਦਿਸ਼ਾ ਉਸ ਇੱਕ ਤੋਂ ਬਿਨਾਂ ਨਹੀਂ, ਅਤੇ ਕੋਈ ਇਨਸਾਨ ਘੇਰੇ ਤੋਂ ਬਾਹਰ ਨਹੀਂ। ਇਕੱਲਾਪਣ ਇੰਨਾ ਕਿਉਂ ਚੁੱਭਦਾ ਹੈ? ਕਿਉਂਕਿ ਜੁੜਾਅ ਖਾਣੇ ਵਰਗੀ ਬੁਨਿਆਦੀ ਲੋੜ ਹੈ। ਰੌਏ ਬੌਮਾਈਸਟਰ ਅਤੇ ਮਾਰਕ ਲੀਅਰੀ ਨੇ 1995 ਵਿੱਚ ਇਹੀ ਦਲੀਲ ਦਿੱਤੀ। 2010 ਵਿੱਚ ਜੂਲੀਅਨ ਹੋਲਟ-ਲੁੰਸਟੈਡ ਨੇ 148 ਅਧਿਐਨਾਂ ਦੀ ਸਮੀਖਿਆ ਕੀਤੀ ਅਤੇ ਪਾਇਆ ਕਿ ਮਜ਼ਬੂਤ ਰਿਸ਼ਤਿਆਂ ਵਾਲੇ ਲੋਕਾਂ ਦੀ ਅਧਿਐਨ ਦੇ ਸਮੇਂ ਦੌਰਾਨ ਜਿਊਂਦੇ ਰਹਿਣ ਦੀ ਸੰਭਾਵਨਾ ਲਗਭਗ ਪੰਜਾਹ ਪ੍ਰਤੀਸ਼ਤ ਵੱਧ ਸੀ। ਇਕੱਲਾਪਣ ਕਮਜ਼ੋਰੀ ਨਹੀਂ; ਇਹ ਭੁੱਖ ਵਰਗਾ ਸੰਕੇਤ ਹੈ ਕਿ ਹੱਥ ਵਧਾਓ। ਗੁਰਬਾਣੀ ਦੋਵੇਂ ਗੱਲਾਂ ਕਹਿੰਦੀ ਹੈ: ਤੁਸੀਂ ਉਸ ਇੱਕ ਦੀ ਸੰਭਾਲ ਤੋਂ ਬਾਹਰ ਨਹੀਂ, ਅਤੇ ਇਹੀ ਸੱਚ ਤੁਹਾਨੂੰ ਦੂਜਿਆਂ ਵੱਲ ਵਧਣ ਲਈ ਕਹਿੰਦਾ ਹੈ। ਅਸਲ ਮਿਸਾਲ: ਨਵੇਂ ਸ਼ਹਿਰ ਦੀਆਂ ਬਹੁਤੀਆਂ ਦੋਸਤੀਆਂ ਇੱਕੋ ਥਾਂ ਵਾਰ-ਵਾਰ ਜਾਣ ਨਾਲ ਸ਼ੁਰੂ ਹੁੰਦੀਆਂ ਹਨ।"}, "loved1": {"ti": "ਪਿਆਰ ਭਰੀ ਨਜ਼ਰ", "s": "ਤੁਸੀਂ ਸਾਰੀ ਰਾਤ ਇਕ ਦੋਸਤ ਦਾ ਘਰ ਬਦਲਵਾਉਣ ਵਿਚ ਲੱਗੇ ਰਹੇ। ਕੱਪੜੇ ਧੂੜ ਨਾਲ ਭਰੇ ਹਨ, ਲੱਕ ਦੁਖ ਰਿਹਾ ਹੈ, ਤੇ ਕਿਸੇ ਨੇ ਬਹੁਤਾ ਕੁਝ ਨਹੀਂ ਕਿਹਾ। ਤੁਸੀਂ ਸੋਚਦੇ ਹੋ, ਕੀ ਕਿਸੇ ਨੇ ਧਿਆਨ ਵੀ ਦਿੱਤਾ?", "m": "ਜੋ ਸੁਣਦਾ ਹੈ, ਮੰਨਦਾ ਹੈ, ਤੇ ਦਿਲ ਵਿਚ ਪਿਆਰ ਰੱਖਦਾ ਹੈ, ਉਹ ਆਪਣੇ ਅੰਦਰਲੇ ਪਵਿੱਤਰ ਸਰੋਵਰ ਵਿਚ ਨ੍ਹਾ ਕੇ ਸਾਫ਼ ਹੋ ਜਾਂਦਾ ਹੈ।", "k": "ਕਰਤਾਰਪੁਰ ਵਿਚ ਇਕ ਵਾਰ ਗੁਰੂ ਨਾਨਕ ਨੇ ਪਸ਼ੂਆਂ ਲਈ ਘਾਹ ਦੀਆਂ ਤਿੰਨ ਪੰਡਾਂ ਕਟਵਾਈਆਂ। ਘਾਹ ਗਿੱਲਾ ਸੀ ਤੇ ਉਸ ਵਿਚੋਂ ਚਿੱਕੜ ਚੋ ਰਿਹਾ ਸੀ, ਤੇ ਨੇੜੇ ਖੜ੍ਹੇ ਲੋਕਾਂ ਨੇ ਚੁੱਕਣ ਤੋਂ ਬਚਣ ਦੇ ਬਹਾਨੇ ਲੱਭ ਲਏ। ਭਾਈ ਲਹਿਣਾ ਹੁਣੇ ਹੁਣੇ ਆਏ ਸਨ, ਨਵੇਂ ਕੱਪੜੇ ਪਾਏ ਹੋਏ। ਬਿਨਾਂ ਕੁਝ ਕਹੇ ਉਨ੍ਹਾਂ ਨੇ ਤਿੰਨੇ ਪੰਡਾਂ ਸਿਰ ਉੱਤੇ ਚੁੱਕੀਆਂ ਤੇ ਘਰ ਤਕ ਲੈ ਗਏ। ਚਿੱਕੜ ਵਹਿ ਕੇ ਉਨ੍ਹਾਂ ਦੇ ਕੱਪੜਿਆਂ ਉੱਤੇ ਫੈਲ ਗਿਆ। ਜਦੋਂ ਉਹ ਪਹੁੰਚੇ, ਤਾਂ ਗੁਰੂ ਜੀ ਦੀ ਪਤਨੀ, ਮਾਤਾ ਸੁਲੱਖਣੀ ਜੀ, ਇਕ ਮਹਿਮਾਨ ਤੋਂ ਅਜਿਹਾ ਕੰਮ ਕਰਵਾਏ ਜਾਣ ਉੱਤੇ ਦੁਖੀ ਹੋਏ। ਜਿਵੇਂ ਮੈਕਾਲਿਫ਼ ਨੇ ਇਸ ਪਰੰਪਰਾ ਨੂੰ ਦਰਜ ਕੀਤਾ ਹੈ, ਗੁਰੂ ਨਾਨਕ ਨੇ ਕਿਹਾ ਕਿ ਲਹਿਣੇ ਦੇ ਕੱਪੜਿਆਂ ਉੱਤੇ ਚਿੱਕੜ ਨਹੀਂ। ਇਹ ਕੇਸਰ ਹੈ, ਮਾਣ ਦਾ ਰੰਗ।", "a": "ਇਹ ਪਉੜੀ ਉਸ ਇਨਸਾਨ ਦੀ ਗੱਲ ਕਰਦੀ ਹੈ ਜੋ ਸੁਣਦਾ ਹੈ, ਮੰਨਦਾ ਹੈ, ਤੇ ਦਿਲ ਵਿਚ ਪਿਆਰ ਰੱਖਦਾ ਹੈ। ਗੁਰੂ ਨਾਨਕ ਕਹਿੰਦੇ ਹਨ, ਅਜਿਹਾ ਇਨਸਾਨ ਆਪਣੇ ਅੰਦਰਲੇ ਪਵਿੱਤਰ ਸਰੋਵਰ ਵਿਚ ਨ੍ਹਾਉਂਦਾ ਹੈ। ਇੱਥੇ ਪਿਆਰ ਸਿਰਫ਼ ਇਕ ਅਹਿਸਾਸ ਨਹੀਂ ਜੋ ਸਾਨੂੰ ਮਿਲਦਾ ਹੈ। ਇਹ ਕੁਝ ਹੈ ਜੋ ਅਸੀਂ ਸਾਂਭਦੇ ਹਾਂ, ਤੇ ਕੁਝ ਜੋ ਅਸੀਂ ਕਰਦੇ ਹਾਂ। ਭਾਈ ਲਹਿਣੇ ਨੇ ਸਿਫ਼ਤ ਲਈ ਘਾਹ ਨਹੀਂ ਚੁੱਕਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਪਿਆਰ ਕਰਕੇ ਚੁੱਕਿਆ। ਤੇ ਗੁਰੂ ਨਾਨਕ ਨੇ ਉਹ ਪਿਆਰ ਪੂਰਾ ਵੇਖਿਆ। ਜਿੱਥੇ ਦੂਜਿਆਂ ਨੂੰ ਗੰਦ ਦਿਸਿਆ, ਉਨ੍ਹਾਂ ਨੂੰ ਕੇਸਰ ਦਿਸਿਆ। ਸੱਚਾ ਪਿਆਰ ਮਿਲਣਾ ਇਉਂ ਹੀ ਲੱਗਦਾ ਹੈ। ਕੋਈ ਠੀਕ ਉਸੇ ਚੀਜ਼ ਨੂੰ ਵੇਖੇ ਜਿਸ ਨੂੰ ਤੁਸੀਂ ਭੈੜਾ ਸਮਝਦੇ ਸੀ, ਤੁਹਾਡੀ ਥਕਾਵਟ, ਤੁਹਾਡੀ ਮਿਹਨਤ, ਤੁਹਾਡੀ ਖਿੱਲਰੀ ਹਾਲਤ, ਤੇ ਉਸ ਵਿਚ ਸੁੰਦਰਤਾ ਵੇਖੇ। ਤੁਹਾਡੀ ਅਣਦਿਸਦੀ ਮਿਹਨਤ ਕਦੇ ਬੇਕਾਰ ਨਹੀਂ ਜਾਂਦੀ।", "b": "ਸਾਨੂੰ ਸਾਰਿਆਂ ਨੂੰ ਕਦਰ ਮਹਿਸੂਸ ਹੋਣ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ, ਤੇ ਸਾਡਾ ਬਹੁਤ ਸਾਰਾ ਪਿਆਰ ਰੋਜ਼ ਦੇ ਜੀਵਨ ਵਿਚ ਅਣਦੇਖਿਆ ਰਹਿ ਜਾਂਦਾ ਹੈ। ਮਾਂ ਦੀਆਂ ਦਸ ਹਜ਼ਾਰ ਰੋਟੀਆਂ। ਕਿਸੇ ਦੋਸਤ ਦੀ ਦੇਰ ਰਾਤ ਦੀ ਮਦਦ। ਮਨੋਵਿਗਿਆਨੀ ਜੌਨ ਗੌਟਮੈਨ ਨੇ ਦਹਾਕਿਆਂ ਤਕ ਜੋੜਿਆਂ ਉੱਤੇ ਅਧਿਐਨ ਕੀਤਾ, ਤੇ ਵੇਖਿਆ ਕਿ ਛੋਟੇ ਪਲ ਬਹੁਤ ਮਾਇਨੇ ਰੱਖਦੇ ਹਨ: ਇਕ ਦੂਜੇ ਵੱਲ ਧਿਆਨ ਦੇਣਾ, ਧੰਨਵਾਦ ਕਰਨਾ, ਇਕ ਦੂਜੇ ਵੱਲ ਮੁੜਨਾ। ਚੰਗੀ ਖ਼ਬਰ ਇਹ ਹੈ ਕਿ ਧਿਆਨ ਦੇਣ ਵਾਲੇ ਅਸੀਂ ਆਪ ਬਣ ਸਕਦੇ ਹਾਂ। ਜਦੋਂ ਤੁਸੀਂ ਕਹਿੰਦੇ ਹੋ, ਮੈਂ ਵੇਖਿਆ ਤੂੰ ਕਿੰਨੀ ਮਿਹਨਤ ਕੀਤੀ, ਤਾਂ ਤੁਸੀਂ ਕਿਸੇ ਦੇ ਚਿੱਕੜ ਨੂੰ ਕੇਸਰ ਬਣਾ ਦਿੰਦੇ ਹੋ। ਤੇ ਜਦੋਂ ਕੋਈ ਤੁਹਾਡੇ ਵੱਲ ਧਿਆਨ ਨਾ ਦੇਵੇ, ਤਾਂ ਭਾਈ ਲਹਿਣੇ ਨੂੰ ਯਾਦ ਕਰੋ। ਸਾਫ਼ ਦਿਲ ਨਾਲ ਦਿੱਤਾ ਪਿਆਰ ਆਪਣੇ ਆਪ ਵਿਚ ਪੂਰਾ ਹੈ। ਉਸ ਨੂੰ ਸੱਚਾ ਹੋਣ ਲਈ ਤਾੜੀਆਂ ਦੀ ਲੋੜ ਨਹੀਂ। ਫਿਰ ਵੀ, ਲੋਕਾਂ ਨੂੰ ਦੱਸਣਾ ਚੰਗਾ ਹੈ ਕਿ ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿਆਰ ਕਰਦੇ ਹੋ। ਉਡੀਕ ਨਾ ਕਰੋ।", "t": "ਅੱਜ ਕਿਸੇ ਇੱਕ ਨੂੰ ਕਹੋ: ਮੈਂ ਵੇਖਿਆ ਤੁਸੀਂ ਕੀ ਕੀਤਾ। ਧੰਨਵਾਦ। ਸਾਫ਼-ਸਾਫ਼ ਕਹੋ।", "q": "ਤੁਹਾਡੇ ਪਾਪਾ ਪੱਚੀ ਸਾਲਾਂ ਤੋਂ ਇੱਕੋ ਥਕਾਉਣ ਵਾਲੀ ਨੌਕਰੀ ਕਰ ਰਹੇ ਹਨ ਤਾਂ ਜੋ ਤੁਹਾਡੀ ਪੜ੍ਹਾਈ ਹੋ ਸਕੇ। ਉਹ ਕਦੇ ਇਸ ਦਾ ਜ਼ਿਕਰ ਨਹੀਂ ਕਰਦੇ। ਅੱਜ ਰਾਤ ਖਾਣੇ ਉੱਤੇ ਤੁਸੀਂ ਕੀ ਕਰ ਸਕਦੇ ਹੋ?", "o": ["ਕੁਝ ਨਹੀਂ; ਮਾਪੇ ਇਹੀ ਕਰਦੇ ਹਨ", "ਅਗਲੇ ਮਹੀਨੇ ਮਹਿੰਗਾ ਤੋਹਫ਼ਾ ਖ਼ਰੀਦਣਾ", "ਸਾਫ਼ ਸ਼ਬਦਾਂ ਵਿੱਚ ਕਹਿਣਾ: ਮੈਂ ਜਾਣਦਾ ਹਾਂ ਤੁਸੀਂ ਮੇਰੇ ਲਈ ਕੀ ਛੱਡਿਆ। ਧੰਨਵਾਦ, ਪਾਪਾ।"], "y": "ਇਹ ਗੱਲ ਉਨ੍ਹਾਂ ਨਾਲ ਸਾਲਾਂ ਰਹੇਗੀ। ਸਾਫ਼ ਸ਼ਬਦ ਦੱਸਦੇ ਹਨ ਕਿ ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਦੀ ਕੁਰਬਾਨੀ ਸੱਚਮੁੱਚ ਵੇਖੀ ਹੈ, ਅਤੇ ਹਰ ਮਾਪਾ ਚੁੱਪ-ਚਾਪ ਇਹੀ ਚਾਹੁੰਦਾ ਹੈ।", "n": "ਤੋਹਫ਼ੇ ਚੰਗੇ ਹਨ, ਅਤੇ ਮਾਪੇ ਕੁਦਰਤੀ ਤੌਰ ਉੱਤੇ ਕੁਰਬਾਨੀ ਕਰਦੇ ਹਨ। ਪਰ ਬਹੁਤੇ ਮਾਪੇ ਵੇਖੇ ਜਾਣਾ ਚਾਹੁੰਦੇ ਹਨ। ਅੱਜ ਰਾਤ ਦੇ ਸਾਫ਼ ਸ਼ਬਦ ਕਿਸੇ ਵੀ ਖ਼ਰੀਦੀ ਚੀਜ਼ ਨਾਲੋਂ ਵੱਧ ਮਾਇਨੇ ਰੱਖਦੇ ਹਨ।", "d": "ਕਰਤਾਰਪੁਰ ਵਿੱਚ ਚਿੱਕੜ ਨਾਲ ਚੋਂਦੀਆਂ ਘਾਹ ਦੀਆਂ ਪੰਡਾਂ ਚੁੱਕਣੀਆਂ ਸਨ। ਬਾਕੀ ਲੋਕ ਬਹਾਨੇ ਲੱਭਦੇ ਰਹੇ। ਭਾਈ ਲਹਿਣਾ ਜੀ ਨੇ ਨਵੇਂ ਕੱਪੜਿਆਂ ਵਿੱਚ ਤਿੰਨੇ ਪੰਡਾਂ ਚੁੱਕ ਲਈਆਂ। ਮਾਤਾ ਸੁਲੱਖਣੀ ਜੀ ਚਿੱਕੜ ਭਰੇ ਕੱਪੜੇ ਵੇਖ ਕੇ ਦੁਖੀ ਹੋਏ, ਤਾਂ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਕਿਹਾ: ਇਹ ਚਿੱਕੜ ਨਹੀਂ, ਕੇਸਰ ਹੈ। ਪਿਆਰ ਮਿਹਨਤ ਵੇਖਦਾ ਹੈ, ਦਾਗ਼ ਨਹੀਂ। ਅਸੀਂ ਤਾਰੀਫ਼ ਪਿੱਛੇ ਕਿਉਂ ਦੌੜਦੇ ਰਹਿੰਦੇ ਹਾਂ? ਕਾਰਲ ਰੌਜਰਜ਼ ਨੇ ਅਨਕੰਡੀਸ਼ਨਲ ਪੌਜ਼ਿਟਿਵ ਰਿਗਾਰਡ ਦੱਸਿਆ: ਬਿਨਾਂ ਸ਼ਰਤ ਕੀਮਤੀ ਮੰਨਿਆ ਜਾਣਾ। ਜੈਨੀਫ਼ਰ ਕ੍ਰੌਕਰ ਦੀ ਖੋਜ ਉਲਟਾ ਜਾਲ ਦਿਖਾਉਂਦੀ ਹੈ: ਜਦੋਂ ਕੀਮਤ ਅੰਕਾਂ, ਸ਼ਕਲ ਜਾਂ ਲਾਈਕਾਂ ਉੱਤੇ ਟਿਕੀ ਹੋਵੇ, ਤਾਂ ਹਰ ਨਤੀਜੇ ਨਾਲ ਮਨ ਝੂਲਦਾ ਹੈ। ਗੁਰਬਾਣੀ ਉਸ ਕੀਮਤ ਵੱਲ ਇਸ਼ਾਰਾ ਕਰਦੀ ਹੈ ਜੋ ਕਾਰਗੁਜ਼ਾਰੀ ਉੱਤੇ ਨਹੀਂ ਟਿਕੀ। ਅਤੇ ਸਾਨੂੰ ਕਹਿੰਦੀ ਹੈ ਕਿ ਉਹ ਅੱਖਾਂ ਬਣੋ ਜੋ ਵੇਖਦੀਆਂ ਹਨ। ਅਸਲ ਮਿਸਾਲ: ਦਫ਼ਤਰ ਦੀ ਸਫ਼ਾਈ ਕਰਨ ਵਾਲੀ, ਜੋ ਸਭ ਚਮਕਾ ਕੇ ਰੱਖਦੀ ਹੈ, ਤਦ ਹੀ ਦਿਸਦੀ ਹੈ ਜਦੋਂ ਕੁਝ ਗੰਦਾ ਹੋਵੇ। ਇੱਕ ਧੰਨਵਾਦ ਉਸ ਦਾ ਪੂਰਾ ਦਿਨ ਬਦਲ ਸਕਦਾ ਹੈ।"}, "fear1": {"ti": "ਜਦੋਂ ਚਿੰਤਾ ਰੁਕਦੀ ਨਹੀਂ", "s": "ਰਾਤ ਦੇ ਦੋ ਵੱਜੇ ਹਨ। ਕੱਲ੍ਹ ਪਾਪਾ ਦੀ ਜਾਂਚ ਦੀ ਰਿਪੋਰਟ ਆਉਣੀ ਹੈ। ਦਿਮਾਗ਼ ਹਰ ਮਾੜੇ ਅੰਤ ਨੂੰ ਫ਼ਿਲਮ ਵਾਂਗ ਵਾਰ-ਵਾਰ ਚਲਾ ਰਿਹਾ ਹੈ, ਅਤੇ ਫ਼ੋਨ ਉੱਤੇ ਡਰਾਉਣੇ ਸ਼ਬਦਾਂ ਨਾਲ ਭਰਿਆ ਸਰਚ ਪੇਜ ਖੁੱਲ੍ਹਾ ਹੈ। ਨੀਂਦ ਬਹੁਤ ਦੂਰ ਲੱਗਦੀ ਹੈ।", "m": "ਜੋ ਪਾਰਬ੍ਰਹਮ ਦੀ ਸ਼ਰਨ ਵਿੱਚ ਹੈ, ਉਸ ਨੂੰ ਤੱਤੀ ਹਵਾ ਨਹੀਂ ਲੱਗਦੀ। ਸਾਡੇ ਚੁਫੇਰੇ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੀ ਰੱਖਿਆ ਦੀ ਲਕੀਰ ਹੈ; ਭਾਈ, ਕੋਈ ਦੁੱਖ ਸਾਨੂੰ ਛੂਹ ਨਹੀਂ ਸਕਦਾ।", "k": "ਸਿੱਖ ਪਰੰਪਰਾ ਯਾਦ ਕਰਦੀ ਹੈ ਕਿ ਜਦੋਂ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਛੋਟੇ ਪੁੱਤਰ ਹਰਗੋਬਿੰਦ ਨੂੰ ਚੇਚਕ ਹੋ ਗਈ, ਤਾਂ ਆਲੇ-ਦੁਆਲੇ ਬਹੁਤ ਲੋਕ ਡਰ ਗਏ। ਕੁਝ ਨੇ ਕਿਹਾ ਕਿ ਰਿਵਾਜ ਮੁਤਾਬਕ ਚੇਚਕ ਦੀ ਦੇਵੀ ਨੂੰ ਚੜ੍ਹਾਵਾ ਚੜ੍ਹਾਓ। ਗੁਰੂ ਜੀ ਨੇ ਅਜਿਹਾ ਨਹੀਂ ਕੀਤਾ। ਉਹ ਬੱਚੇ ਦੇ ਕੋਲ ਰਹੇ, ਸੰਗਤ ਨੂੰ ਕੀਰਤਨ ਅਤੇ ਅਰਦਾਸ ਨਾਲ ਜੋੜੀ ਰੱਖਿਆ, ਅਤੇ ਕਰਤਾਰ ਉੱਤੇ ਭਰੋਸਾ ਰੱਖਿਆ। ਜਦੋਂ ਬੱਚਾ ਠੀਕ ਹੋਇਆ, ਤਾਂ ਗੁਰੂ ਜੀ ਦਾ ਸ਼ੁਕਰਾਨਾ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਵਿੱਚ ਇੱਕ ਸ਼ਬਦ ਬਣ ਗਿਆ: ਸੀਤਲਾ ਤੇ ਰਖਿਆ ਬਿਹਾਰੀ, ਤੂੰ ਆਪ ਹੀ ਉਸ ਨੂੰ ਚੇਚਕ ਤੋਂ ਬਚਾਇਆ, ਅੰਗ 200। ਗੁਰੂ ਜੀ ਨੇ ਖ਼ਤਰੇ ਤੋਂ ਇਨਕਾਰ ਨਹੀਂ ਕੀਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਘਬਰਾਹਟ ਦੀ ਥਾਂ ਦੇਖਭਾਲ, ਸਾਥ ਅਤੇ ਭਰੋਸੇ ਨਾਲ ਉਸ ਦਾ ਸਾਹਮਣਾ ਕੀਤਾ।", "a": "ਪੂਰਾ ਸ਼ਬਦ ਵੇਖੋ। ਇਸ ਦੀ ਰਹਾਉ ਵਾਲੀ ਤੁਕ, ਜੋ ਸ਼ਬਦ ਦਾ ਕੇਂਦਰ ਹੈ, ਕਹਿੰਦੀ ਹੈ ਕਿ ਪੂਰੇ ਸਤਿਗੁਰੂ ਨੇ ਨਾਮ ਦੀ ਦਵਾਈ ਦਿੱਤੀ ਹੈ। ਪ੍ਰੋ. ਸਾਹਿਬ ਸਿੰਘ ਤੱਤੀ ਹਵਾ ਦਾ ਅਰਥ ਰੋਗਾਂ ਅਤੇ ਦੁੱਖਾਂ ਦਾ ਸੇਕ ਦੱਸਦੇ ਹਨ। ਯਾਨੀ ਇਹ ਵਾਅਦਾ ਨਹੀਂ ਕਿ ਕਦੇ ਕੁਝ ਔਖਾ ਨਹੀਂ ਹੋਵੇਗਾ। ਇਹ ਅੰਦਰ ਦੀ ਗੱਲ ਹੈ: ਜਦੋਂ ਮਨ ਨਾਮ ਵਿੱਚ ਟਿਕਦਾ ਹੈ, ਤਾਂ ਉਸ ਦੇ ਚੁਫੇਰੇ ਇੱਕ ਘੇਰਾ ਬਣ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਡਰ ਦਾ ਸੇਕ ਉਸ ਨੂੰ ਸਾੜ ਨਹੀਂ ਸਕਦਾ। ਸਰੀਰ ਬਿਮਾਰ ਹੋ ਸਕਦਾ ਹੈ, ਪਰ ਮਨ ਦਾ ਸੜਨਾ ਜ਼ਰੂਰੀ ਨਹੀਂ। ਚਿੰਤਾ ਸ
